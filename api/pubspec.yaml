name: heart
description: "Heart of Yours API"
version: 1.0.0
repository: "https://github.com/kit-g/heart-api.git"
publish_to: none

environment:
  sdk: ">=3.13.0"

dependencies:
  asn1lib: ^1.6.5
  crypto: ^3.0.6
  csv: ^8.0.0
  heart_aws:
    path: "../shared/heart_aws"
    version: 1.1.0
  # Path-only, like heart_aws: a version constraint on a path dependency can
  # only ever be redundant or break CI on the next heart_models bump — the
  # working tree is always the version consumed.
  heart_design:
    path: "../shared/heart_design"
  heart_models:
    path: "../shared/heart_models"
  jose: ^0.3.5
  logging: ^1.3.0
  mime: ^2.1.0
  openid_client: ^0.4.10+1
  pointycastle: ^4.0.0
  postgres: ^3.5.20
  relic: ^1.2.0
  version: ^3.0.2

dev_dependencies:
  analyzer: ^14.5.0
  build_runner: ^2.16.2
  lints: ^6.1.0
  mockito: ^5.8.1
  relic_core: ^1.2.0
  test: ^1.33.0
  aws_common: 0.7.16
  aws_signature_v4: any
