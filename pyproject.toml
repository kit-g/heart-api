[project]
name = "heart-go"
version = "0.1.0"
description = "Heart monorepo workspace root. Per-service deps live in the member pyprojects."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.9",
    "pillow>=12.3.0",
]

[tool.uv.workspace]
members = ["firebase", "assets"]

[dependency-groups]
dev = [
    "urllib3>=2.7.0", # security override
    "cryptography>=48.0.1", # security override
    "wheel>=0.46.2", # security override
    "werkzeug>=3.1.6", # security override
    "flask>=3.1.3", # security override
    "aws-sam-cli>=1.148.0",
    "pyyaml>=6.0.3",
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
# Flat-import-style: each service ships its modules as if they live at the
# Lambda zip root, so the imports in source code (`from events import ...`)
# work both inside the Lambda runtime and in pytest.
#
# Services share module names (`app`, `events`), so they CANNOT share one
# pythonpath in a single pytest process — `import events` would be ambiguous.
# This default config runs the firebase suite; each other service runs scoped
# in its own process, replacing pythonpath:
#   uv run pytest assets/tests -o pythonpath=assets/assets
# (see assets/README.md). Its CI workflow does the same.
pythonpath = ["firebase/firebase"]
testpaths = ["firebase/tests"]
