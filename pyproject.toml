[project]
name = "heart-go"
version = "0.1.0"
description = "Heart monorepo workspace root. Per-service deps live in the member pyprojects."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.9",
    "pillow>=12.3.0",
]

[tool.uv.workspace]
members = ["firebase", "assets"]

[dependency-groups]
dev = [
    "urllib3>=2.7.0", # security override
    "cryptography>=50.0.0", # security override
    "pyyaml>=6.0.3",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    # scripts/ deps: library sync + validation, movement seed/merge. Declared
    # here so CI runs them from the lockfile instead of unpinned `pip install`s
    # (ruamel.yaml was previously reachable only as a transitive of aws-sam-cli).
    "psycopg[binary]>=3.2",
    "jsonschema>=4.25",
    "ruamel-yaml>=0.18",
    "ruff>=0.14",
    "pre-commit>=4.6.1",
]

[tool.ruff]
# One config for CLI, CI, and the IDE plugin — keep it here, not in ruff.toml.
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modernize, B bugbear, SIM simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
# Flat-import-style: each service ships its modules as if they live at the
# Lambda zip root, so the imports in source code (`from events import ...`)
# work both inside the Lambda runtime and in pytest.
#
# Services share module names (`app`, `events`), so they CANNOT share one
# pythonpath in a single pytest process — `import events` would be ambiguous.
# This default config runs the firebase suite; each other service runs scoped
# in its own process, replacing pythonpath:
#   uv run pytest assets/tests -o pythonpath=assets/assets
# (see assets/README.md). Its CI workflow does the same.
pythonpath = ["firebase/firebase"]
testpaths = ["firebase/tests"]
