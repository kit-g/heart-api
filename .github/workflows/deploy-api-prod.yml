name: "Deploy Dart API, prod"

on:
  workflow_dispatch: { }
  push:
    tags: [ 'v*' ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: api-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prod:
    uses: ./.github/workflows/deploy-api.yml
    with:
      AWS_ROLE: 'arn:aws:iam::922419543441:role/heart-github-actions-deploy-role'
      AWS_REGION: 'ca-central-1'
      FUNCTION_NAME: 'heart-api'
      API: 'https://zn9nvduxyd.execute-api.ca-central-1.amazonaws.com/v1'
      SECRETS_BUCKET: '922419543441-ca-central-1-static'
      SUPABASE_CRED_KEY: 'secrets/supabase.json'
      ENVIRONMENT: 'prod'
      MONITORING_TOPIC_ARN: 'arn:aws:sns:ca-central-1:922419543441:monitoring'
  # The tag's notes are committed beside the code (release_notes/<tag>.md, the
  # `release` skill); a deployed tag becomes a GitHub release carrying them.
  release:
    name: "GitHub release"
    needs: prod
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="release_notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing: the release notes are committed before the tag"
            exit 1
          fi
          title=$(head -n 1 "$notes" | sed 's/^# //')
          tail -n +3 "$notes" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
