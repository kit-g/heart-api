name: "Generate Exercise library, dev"

on:
  workflow_dispatch: { }
  push:
    branches: [ main ]
    paths:
      - content/exercise_library.yml
      - content/exercise_library_schema.json

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/exercise-library.yml
    with:
      AWS_ROLE: 'arn:aws:iam::583168578067:role/HeartGitHubActionsDeployRole'
      AWS_REGION: 'ca-central-1'
      EXERCISE_BUCKET: '583168578067-exercise-assets'
