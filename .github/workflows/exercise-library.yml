name: "Sync Exercise library"

on:
  workflow_dispatch:
    inputs:
      AWS_REGION:
        required: true
        type: string
        default: 'ca-central-1'
      AWS_ROLE:
        required: true
        type: string
      SECRETS_BUCKET:
        required: true
        type: string
        description: "S3 bucket holding secrets/supabase.json"

  workflow_call:
    inputs:
      AWS_REGION:
        required: true
        type: string
        default: 'ca-central-1'
      AWS_ROLE:
        required: true
        type: string
      SECRETS_BUCKET:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  sync-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: "Install dependencies"
        run: pip install pyyaml boto3 'psycopg[binary]'

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: "Sync exercise library to Postgres"
        env:
          SECRETS_BUCKET: ${{ inputs.SECRETS_BUCKET }}
        run: python scripts/library_locales.py
