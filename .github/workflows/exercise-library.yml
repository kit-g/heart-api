name: "Sync Exercise library"

on:
  workflow_dispatch:
    inputs:
      AWS_REGION:
        required: true
        type: string
        default: 'ca-central-1'
      AWS_ROLE:
        required: true
        type: string
      SECRETS_BUCKET:
        required: true
        type: string
        description: "S3 bucket holding secrets/supabase.json"

  workflow_call:
    inputs:
      AWS_REGION:
        required: true
        type: string
        default: 'ca-central-1'
      AWS_ROLE:
        required: true
        type: string
      SECRETS_BUCKET:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: "Validate library content"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      - name: "Validate against schema"
        run: uv run python scripts/validate_library.py

  sync-library:
    runs-on: ubuntu-latest
    needs: [ validate ]
    # Skip the database write on PRs; only ship on push/manual. (For
    # workflow_call the event name reflects the caller's trigger.)
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # No floating v9 major tag exists upstream; pin the exact release.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: "Sync exercise library to Postgres"
        env:
          SECRETS_BUCKET: ${{ inputs.SECRETS_BUCKET }}
        run: uv run python scripts/library_locales.py
