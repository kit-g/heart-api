name: "Sync Exercise library"

on:
  workflow_call:
    inputs:
      AWS_REGION:
        required: true
        type: string
        default: 'ca-central-1'
      AWS_ROLE:
        required: true
        type: string
      SECRETS_BUCKET:
        required: true
        type: string
      CONTENT_BUCKET:
        required: true
        type: string
      MEDIA_DISTRIBUTION_ID:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: "Validate library content"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      - name: "Validate against schema"
        run: uv run python scripts/validate_library.py

  sync-library:
    runs-on: ubuntu-latest
    needs: [ validate ]
    # Skip the database write on PRs; only ship on push/manual. (For
    # workflow_call the event name reflects the caller's trigger.)
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # No floating v9 major tag exists upstream; pin the exact release.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: "Sync exercise library to Postgres"
        env:
          SECRETS_BUCKET: ${{ inputs.SECRETS_BUCKET }}
        run: uv run python scripts/library_locales.py

      # Same secrets object apply_migrations.sh reads (host/port/user/password);
      # fetched fresh rather than reused from the sync step above, since that
      # step's psycopg connection doesn't leave credentials behind for later
      # steps to pick up.
      - name: "Fetch Supabase credentials"
        run: aws s3 cp "s3://${{ inputs.SECRETS_BUCKET }}/secrets/supabase.json" /tmp/supabase.json

      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # PostgresConfig.fromEnv() (api/bin/publish_library.dart) needs the same
      # PG_* names the API Lambda's own environment carries — not the bare
      # PGHOST names apply_migrations.sh uses. Exported and consumed within
      # this one step so the password never round-trips through $GITHUB_ENV.
      - name: "Publish exercise library to the CDN"
        run: |
          export PG_HOST="$(jq -r .host /tmp/supabase.json)"
          export PG_PORT="$(jq -r .port /tmp/supabase.json)"
          export PG_USER="$(jq -r .user /tmp/supabase.json)"
          export PG_PASSWORD="$(jq -r .password /tmp/supabase.json)"
          export PG_DATABASE=heart
          echo "::add-mask::$PG_PASSWORD"
          ./scripts/publish_library.sh "${{ inputs.CONTENT_BUCKET }}" "${{ inputs.MEDIA_DISTRIBUTION_ID }}"
