name: "Deploy Assets Service"

on:
  workflow_dispatch:
    inputs:
      AWS_REGION:
        required: true
        type: string
      AWS_ROLE:
        required: true
        type: string
      FUNCTION_NAME:
        required: true
        type: string
        description: "Lambda function to update"

  workflow_call:
    inputs:
      AWS_REGION:
        required: true
        type: string
      AWS_ROLE:
        required: true
        type: string
      FUNCTION_NAME:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  python-test:
    name: "Python Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Install uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      # Scoped run: services share flat module names (app, events), so the
      # assets suite runs in its own process with its own pythonpath. See the
      # note in the root pyproject.toml.
      - name: "Run pytest"
        run: uv run pytest assets/tests -o pythonpath=assets/assets

  build-and-deploy:
    name: "Build & Deploy"
    runs-on: ubuntu-latest
    needs: [ python-test ]
    # Skip deploy on PRs; only ship on push/manual. (For workflow_call the
    # event name reflects the caller's trigger.)
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: "Export commit SHA"
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Resolve assets service deps"
        run: |
          uv export \
            --package assets \
            --frozen \
            --no-dev \
            --no-hashes \
            > requirements.txt

      # Pillow is a C extension: install wheels for the Lambda's arch/runtime,
      # not the runner's. Pinned to 3.12 — Pillow doesn't run on Lambda > 3.12.
      #
      # The glibc floor is manylinux_2_28, NOT manylinux2014 (2.17): Pillow
      # 12.3.0 dropped its manylinux_2_17 wheels and now ships linux wheels
      # only for manylinux_2_27/2_28. Against a 2.17 target uv finds no
      # compatible wheel and silently falls back to building the sdist — which
      # yields a runner-native binary that won't import on the Lambda. The
      # python3.12 runtime is Amazon Linux 2023 (glibc 2.34), so 2_28 is safe.
      # --no-build makes a future wheel-tag change fail loudly instead.
      - name: "Install deps into Lambda package dir"
        run: |
          uv pip install \
            --no-cache-dir \
            --no-build \
            --target pkg/ \
            --python-platform aarch64-manylinux_2_28 \
            --python-version 3.12 \
            --requirements requirements.txt

      - name: "Copy service source into package"
        run: cp assets/assets/*.py pkg/

      - name: "Zip the package"
        run: ( cd pkg && zip -qr ../assets.zip . )

      - name: "Update Lambda Function Code"
        run: |
          aws lambda update-function-code \
            --function-name ${{ inputs.FUNCTION_NAME }} \
            --zip-file fileb://assets.zip \
            --region ${{ inputs.AWS_REGION }} > /dev/null

      - name: "Wait for Lambda update"
        run: |
          aws lambda wait function-updated \
            --function-name ${{ inputs.FUNCTION_NAME }} \
            --region ${{ inputs.AWS_REGION }}

    outputs:
      commit: ${{ steps.commit.outputs.commit }}
