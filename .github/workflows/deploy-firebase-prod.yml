name: "Deploy Firebase Service, prod"

# Prod ships on release tags, same gate as deploy-api-prod.
on:
  workflow_dispatch: { }
  push:
    tags: [ 'v*' ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: firebase-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prod:
    uses: ./.github/workflows/deploy-firebase.yml
    with:
      AWS_ROLE: 'arn:aws:iam::922419543441:role/heart-github-actions-deploy-role'
      AWS_REGION: 'ca-central-1'
      FUNCTION_NAME: 'heart-firebase'
      SECRETS_BUCKET: '922419543441-ca-central-1-static'
      FIREBASE_CRED_KEY: 'secrets/firebase/firebase-terraform-sa.json'
