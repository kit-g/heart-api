name: "Deploy Dart API, dev"

on:
  workflow_dispatch: { }
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'shared/**'
      - 'database/**'
      - 'scripts/apply_migrations.sh'
      - 'scripts/db_tests.sh'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/deploy-api-dev.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: api-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/deploy-api.yml
    with:
      AWS_ROLE: 'arn:aws:iam::583168578067:role/heart-github-actions-deploy-role'
      AWS_REGION: 'ca-central-1'
      FUNCTION_NAME: 'heart-api'
      API: 'https://1y5vu7awze.execute-api.ca-central-1.amazonaws.com/v1'
      SECRETS_BUCKET: '583168578067-ca-central-1-static'
      SUPABASE_CRED_KEY: 'secrets/supabase.json'