name: "Deploy Firebase Service"

on:
  workflow_dispatch:
    inputs:
      AWS_REGION:
        required: true
        type: string
      AWS_ROLE:
        required: true
        type: string
      FUNCTION_NAME:
        required: true
        type: string
        description: "Lambda function to update"
      SECRETS_BUCKET:
        required: true
        type: string
        description: "S3 bucket holding the runtime Firebase Admin SA key"
      FIREBASE_CRED_KEY:
        required: true
        type: string
        description: "S3 key for the runtime SA key, baked into the deploy zip"

  workflow_call:
    inputs:
      AWS_REGION:
        required: true
        type: string
      AWS_ROLE:
        required: true
        type: string
      FUNCTION_NAME:
        required: true
        type: string
      SECRETS_BUCKET:
        required: true
        type: string
      FIREBASE_CRED_KEY:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  python-test:
    name: "Python Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Install uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      - name: "Run pytest"
        run: uv run pytest

  build-and-deploy:
    name: "Build & Deploy"
    runs-on: ubuntu-latest
    needs: [ python-test ]
    # Skip deploy on PRs; only ship on push/manual. (For workflow_call the
    # event name reflects the caller's trigger.)
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: "Export commit SHA"
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Resolve firebase service deps"
        run: |
          uv export \
            --package firebase \
            --frozen \
            --no-dev \
            --no-hashes \
            > requirements.txt

      - name: "Install deps into Lambda package dir"
        run: |
          uv pip install \
            --no-cache-dir \
            --target pkg/ \
            --python-platform aarch64-manylinux2014 \
            --python-version 3.12 \
            --requirements requirements.txt

      - name: "Copy service source into package"
        run: cp firebase/firebase/*.py pkg/

      - name: "Fetch runtime Firebase SA key and bake into the zip"
        run: |
          aws s3 cp \
            "s3://${{ inputs.SECRETS_BUCKET }}/${{ inputs.FIREBASE_CRED_KEY }}" \
            pkg/firebase.json

      - name: "Zip the package"
        run: ( cd pkg && zip -qr ../firebase.zip . )

      - name: "Update Lambda Function Code"
        run: |
          aws lambda update-function-code \
            --function-name ${{ inputs.FUNCTION_NAME }} \
            --zip-file fileb://firebase.zip \
            --region ${{ inputs.AWS_REGION }} > /dev/null

      - name: "Wait for Lambda update"
        run: |
          aws lambda wait function-updated \
            --function-name ${{ inputs.FUNCTION_NAME }} \
            --region ${{ inputs.AWS_REGION }}

    outputs:
      commit: ${{ steps.commit.outputs.commit }}
