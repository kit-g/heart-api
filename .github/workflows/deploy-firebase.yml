name: "Deploy Firebase Service"

on:
  workflow_call:
    inputs:
      AWS_REGION:
        required: true
        type: string
      AWS_ROLE:
        required: true
        type: string
      FUNCTION_NAME:
        required: true
        type: string
      SECRETS_BUCKET:
        required: true
        type: string
      FIREBASE_CRED_KEY:
        required: true
        type: string

jobs:
  python-test:
    permissions:
      contents: read
    name: "Python Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      - name: "Run pytest"
        run: uv run pytest

  build-and-deploy:
    permissions:
      contents: read
      id-token: write
    name: "Build & Deploy"
    # arm64, as the function is: the package's handler is imported before it ships
    runs-on: ubuntu-24.04-arm
    needs: [ python-test ]
    # Skip deploy on PRs; only ship on push/manual. (For workflow_call the
    # event name reflects the caller's trigger.)
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: "Export commit SHA"
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: "Install deps and source into the Lambda package dir"
        run: |
          ./scripts/lambda_deps.sh \
            ${{ inputs.FUNCTION_NAME }} ${{ inputs.AWS_REGION }} \
            firebase firebase/firebase pkg

      - name: "Fetch runtime Firebase SA key and bake into the zip"
        run: |
          aws s3 cp \
            "s3://${{ inputs.SECRETS_BUCKET }}/${{ inputs.FIREBASE_CRED_KEY }}" \
            pkg/firebase.json

      - name: "Zip the package"
        run: ( cd pkg && zip -qr ../firebase.zip . )

      - name: "Update Lambda Function Code"
        run: |
          aws lambda update-function-code \
            --function-name ${{ inputs.FUNCTION_NAME }} \
            --zip-file fileb://firebase.zip \
            --region ${{ inputs.AWS_REGION }} > /dev/null

      - name: "Wait for Lambda update"
        run: |
          aws lambda wait function-updated \
            --function-name ${{ inputs.FUNCTION_NAME }} \
            --region ${{ inputs.AWS_REGION }}

    outputs:
      commit: ${{ steps.commit.outputs.commit }}
