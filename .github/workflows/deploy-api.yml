name: "Deploy Dart API"

on:
  workflow_dispatch:
    inputs:
      AWS_REGION:
        required: true
        type: string
      AWS_ROLE:
        required: true
        type: string
      FUNCTION_NAME:
        required: true
        type: string
        description: "Lambda function to update"
      API:
        required: true
        type: string
        description: "API Gateway base URL, used by the smoke test"
      SECRETS_BUCKET:
        required: true
        type: string
        description: "S3 bucket holding the Supabase credentials"
      SUPABASE_CRED_KEY:
        required: true
        type: string
        description: "S3 key for supabase.json; points migrations at the target database"

  workflow_call:
    inputs:
      AWS_REGION:
        required: true
        type: string
      AWS_ROLE:
        required: true
        type: string
      FUNCTION_NAME:
        required: true
        type: string
      API:
        required: true
        type: string
      SECRETS_BUCKET:
        required: true
        type: string
      SUPABASE_CRED_KEY:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  PG_VERSION: "17"

jobs:
  lint:
    name: "Lint Dart Code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: "Install dependencies"
        working-directory: api
        run: dart pub get

      - name: "Generate Mocks"
        working-directory: api
        run: dart run build_runner build

      - name: "Format check"
        working-directory: api
        run: |
          # Skip generated files (mocks, build_runner output)
          find . -name '*.dart' \
            -not -path './.dart_tool/*' \
            -not -name '*.mocks.dart' \
            -not -name '*.g.dart' \
            -not -name '*.freezed.dart' \
            -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed

      - name: "Run Analysis"
        working-directory: api
        run: dart analyze

  dart-test:
    name: "Dart Tests (${{ matrix.package }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ api, shared/heart_aws, shared/heart_models ]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: "Install dependencies"
        working-directory: ${{ matrix.package }}
        run: dart pub get

      # heart_aws has no build_runner; the other two generate their mocks
      # (mocks are gitignored, not checked in)
      - name: "Generate Mocks"
        if: matrix.package != 'shared/heart_aws'
        working-directory: ${{ matrix.package }}
        run: dart run build_runner build

      # `shared/heart_models` → `shared-heart_models`: artifact names and report
      # filenames cannot hold a slash, and the suite stays identifiable.
      - name: "Derive report name"
        run: echo "REPORT_NAME=${PACKAGE//\//-}" >> "$GITHUB_ENV"
        env:
          PACKAGE: ${{ matrix.package }}

      # `--reporter=github` puts failures inline on the PR diff; the file
      # reporter is what the test-summary job aggregates.
      - name: "Run Tests"
        working-directory: ${{ matrix.package }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-reports"
          dart test \
            --reporter=github \
            --file-reporter="json:$GITHUB_WORKSPACE/test-reports/${REPORT_NAME}.json"

      - name: "Upload test report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ env.REPORT_NAME }}
          path: test-reports/
          if-no-files-found: ignore
          retention-days: 7

  db-test:
    name: "Database Tests & Coverage"
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: heart
    steps:
      - uses: actions/checkout@v7

      - name: "Add PGDG apt repository"
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update

      - name: "Install Postgres ${{ env.PG_VERSION }} + pgtap + pg_prove"
        run: |
          sudo apt-get install -y \
            postgresql-${{ env.PG_VERSION }} \
            postgresql-${{ env.PG_VERSION }}-pgtap \
            pgtap

      - name: "Start Postgres + create test DB"
        run: |
          sudo systemctl stop postgresql || true
          sudo pg_createcluster ${{ env.PG_VERSION }} main || true
          sudo sed -i -e 's/^port =.*/port = 5432/' /etc/postgresql/${{ env.PG_VERSION }}/main/postgresql.conf
          sudo pg_ctlcluster ${{ env.PG_VERSION }} main start
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD '$PGPASSWORD'"
          sudo -u postgres createdb $PGDATABASE
          sudo -u postgres psql -d $PGDATABASE -c "CREATE EXTENSION pgtap"

      - name: "Apply migrations"
        run: ./scripts/apply_migrations.sh

      # The same script the docs point developers at, so CI can't drift from
      # the local flow. tee, so a failure still reaches the summary: pipefail
      # keeps the script's exit status rather than tee's.
      - name: "Run pgtap suite"
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/test-reports"
          ./scripts/db_tests.sh | tee "$GITHUB_WORKSPACE/test-reports/pgtap.tap"

      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: "Install Dart dependencies"
        working-directory: api
        run: dart pub get

      - name: "Generate mocks"
        working-directory: api
        run: dart run build_runner build

      # Runs the FULL api suite — unit + `db`-tagged (unskipped via --run-skipped)
      # — against the Postgres provisioned above, so coverage reflects the code
      # the DB integration tests exercise. This subsumes the db-only run.
      - name: "Run tests with coverage"
        working-directory: api
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-reports"
          dart test \
            --coverage=coverage \
            --run-skipped \
            --reporter=github \
            --file-reporter="json:$GITHUB_WORKSPACE/test-reports/api-with-db.json"

      - name: "Enforce coverage floor"
        working-directory: api
        run: |
          set -o pipefail
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=.dart_tool/package_config.json
          dart run tool/check_coverage.dart 75 | tee "$GITHUB_WORKSPACE/test-reports/coverage.txt"

      - name: "Upload test report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-database
          path: test-reports/
          if-no-files-found: ignore
          retention-days: 7

  test-summary:
    name: "Test Summary"
    runs-on: ubuntu-latest
    needs: [ dart-test, db-test ]
    # The point of the summary is the runs that went wrong, so it must not be
    # skipped when a test job fails.
    if: always()
    steps:
      - uses: actions/checkout@v7

      # A cancelled or skipped test job leaves nothing to download; the summary
      # says so rather than failing and adding a second red X to the run.
      - name: "Collect reports"
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-report-*
          path: test-reports
          merge-multiple: true

      - name: "Render summary"
        run: |
          python3 scripts/test_summary.py test-reports test-reports/coverage.txt \
            >> "$GITHUB_STEP_SUMMARY"


  build-and-deploy:
    name: "Build & Deploy"
    runs-on: ubuntu-latest
    needs: [ lint, dart-test, db-test ]
    # Skip deploy on PRs; only ship on push/manual. (For workflow_call the
    # event name reflects the caller's trigger.)
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: "Export commit SHA"
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: "Install psql + jq"
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: "Fetch Supabase credentials"
        run: |
          aws s3 cp \
            "s3://${{ inputs.SECRETS_BUCKET }}/${{ inputs.SUPABASE_CRED_KEY }}" \
            /tmp/supabase.json

      - name: "Apply migrations to Supabase"
        run: ./scripts/apply_migrations.sh

      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: "Build Lambda binary"
        working-directory: api
        run: |
          dart pub get
          COMMIT=${{ steps.commit.outputs.commit }} ARTIFACTS_DIR=. make build-ApiFunction
          zip function.zip bootstrap

      - name: "Update Lambda Function Code"
        run: |
          aws lambda update-function-code \
            --function-name ${{ inputs.FUNCTION_NAME }} \
            --zip-file fileb://api/function.zip \
            --region ${{ inputs.AWS_REGION }} > /dev/null

      - name: "Wait for Lambda update"
        run: |
          aws lambda wait function-updated \
            --function-name ${{ inputs.FUNCTION_NAME }} \
            --region ${{ inputs.AWS_REGION }}

    outputs:
      commit: ${{ steps.commit.outputs.commit }}

  smoke-test:
    name: "Smoke Test"
    runs-on: ubuntu-latest
    needs: [ build-and-deploy ]
    env:
      API: ${{ inputs.API }}
      EXPECTED_COMMIT: ${{ needs.build-and-deploy.outputs.commit }}
    steps:
      - name: "Check /version endpoint"
        run: |
          echo "Expecting commit: $EXPECTED_COMMIT"

          response=$(curl -fsS $API/version)
          echo "Response: $response"

          deployed_commit=$(echo "$response" | jq -r .commit)

          if [ "$deployed_commit" != "$EXPECTED_COMMIT" ]; then
              echo "Deployed commit ($deployed_commit) does not match expected ($EXPECTED_COMMIT)"
              exit 1
          fi

          echo "Smoke test passed: commit matches."