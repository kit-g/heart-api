name: "Deploy Dart API"

on:
  push:
    branches: [ main, connections, postgres ]
    paths:
      - 'api/**'
      - 'shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ca-central-1"
  AWS_ROLE: "arn:aws:iam::583168578067:role/HeartGitHubActionsDeployRole"
  FUNCTION_NAME: "heart-api"
  API: "https://c90as24l23.execute-api.us-east-2.amazonaws.com/v1"

jobs:
  lint:
    name: "Lint Dart Code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1

      - name: "Install dependencies"
        working-directory: api
        run: dart pub get

      - name: "Generate Mocks"
        working-directory: api
        run: dart run build_runner build --delete-conflicting-outputs

      - name: "Run Analysis"
        working-directory: api
        run: dart analyze

  test:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1

      - name: "Install dependencies"
        working-directory: api
        run: dart pub get

      - name: "Generate Mocks"
        working-directory: api
        run: dart run build_runner build --delete-conflicting-outputs

      - name: "Run Tests"
        working-directory: api
        run: dart test

  build-and-deploy:
    name: "Build & Deploy"
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v6

      - name: "Export commit SHA"
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - uses: dart-lang/setup-dart@v1

      - name: "Build Lambda binary"
        working-directory: api
        run: |
          dart pub get
          COMMIT=${{ steps.commit.outputs.commit }} ARTIFACTS_DIR=. make build-ApiFunction
          zip function.zip bootstrap

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Update Lambda Function Code"
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://api/function.zip \
            --region ${{ env.AWS_REGION }} > /dev/null

    outputs:
      commit: ${{ steps.commit.outputs.commit }}

  smoke-test:
    name: "Smoke Test"
    runs-on: ubuntu-latest
    needs: [ build-and-deploy ]
    env:
      EXPECTED_COMMIT: ${{ needs.build-and-deploy.outputs.commit }}
    steps:
      - name: "Check /version endpoint"
        run: |
          echo "Expecting commit: $EXPECTED_COMMIT"

          response=$(curl -s $API/version)
          echo "Response: $response"

          deployed_commit=$(echo "$response" | jq -r .commit)

          if [ "$deployed_commit" != "$EXPECTED_COMMIT" ]; then
              echo "Deployed commit ($deployed_commit) does not match expected ($EXPECTED_COMMIT)"
              exit 1
          fi

          echo "Smoke test passed: commit matches."