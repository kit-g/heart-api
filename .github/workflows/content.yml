name: "Publish content"

# The CDN content besides the exercise library: static/programs,
# static/go-easy, static/balance and static/templates, checked, rendered and
# uploaded by scripts/publish_content.sh.
on:
  workflow_call:
    inputs:
      AWS_REGION:
        required: true
        type: string
        default: 'ca-central-1'
      AWS_ROLE:
        required: true
        type: string
      CONTENT_BUCKET:
        required: true
        type: string
      MEDIA_DISTRIBUTION_ID:
        required: true
        type: string

jobs:
  check:
    permissions:
      contents: read
    name: "Check content"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No floating major tags exist upstream; pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      - name: "Check and render"
        run: ./scripts/publish_content.sh --check

  publish:
    permissions:
      contents: read
      id-token: write
    name: "Publish content to the CDN"
    runs-on: ubuntu-latest
    needs: [ check ]
    # PRs only check; a push or a manual run publishes. (For workflow_call the
    # event name is the caller's.)
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: "Sync workspace"
        run: uv sync --all-packages --frozen

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: "Publish"
        run: ./scripts/publish_content.sh "${{ inputs.CONTENT_BUCKET }}" "${{ inputs.MEDIA_DISTRIBUTION_ID }}"
