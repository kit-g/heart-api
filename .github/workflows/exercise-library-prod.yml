name: "Sync Exercise library, prod"

on:
  workflow_dispatch: { }
  push:
    branches: [ main ]
    paths:
      - content/exercise_library.yml
      - content/exercise_library_schema.json
      - scripts/library_locales.py
      - .github/workflows/exercise-library.yml
      - .github/workflows/exercise-library-prod.yml

permissions:
  id-token: write
  contents: read

jobs:
  prod:
    uses: ./.github/workflows/exercise-library.yml
    with:
      AWS_ROLE: 'arn:aws:iam::922419543441:role/heart-github-actions-deploy-role'
      AWS_REGION: 'ca-central-1'
      SECRETS_BUCKET: '922419543441-ca-central-1-static'
