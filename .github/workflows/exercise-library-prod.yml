name: "Sync Exercise library, prod"

# Prod syncs ship on release tags (same gate as deploy-api-prod), not on every
# push to main — dev soaks content changes first.
on:
  workflow_dispatch: { }
  push:
    tags: [ 'v*' ]

permissions:
  id-token: write
  contents: read

# Two quick tag pushes must not run concurrent syncs against the same database.
concurrency:
  group: exercise-library-prod
  cancel-in-progress: false

jobs:
  prod:
    uses: ./.github/workflows/exercise-library.yml
    with:
      AWS_ROLE: 'arn:aws:iam::922419543441:role/heart-github-actions-deploy-role'
      AWS_REGION: 'ca-central-1'
      SECRETS_BUCKET: '922419543441-ca-central-1-static'
      CONTENT_BUCKET: '922419543441-ca-central-1-content'
      MEDIA_DISTRIBUTION_ID: 'EGZ95J4EWTC39'
