name: "Publish content, prod"

# Manual only, and only from a release tag: run it with "Use workflow from"
# set to a v* tag once that release is out. A tag push doesn't trigger it, so
# prod content never races the API deploy the same tag starts, and it ships
# only after its review.
on:
  workflow_dispatch: { }

permissions:
  id-token: write
  contents: read

concurrency:
  group: content-prod
  cancel-in-progress: false

jobs:
  tag:
    name: "Run from a release tag"
    runs-on: ubuntu-latest
    steps:
      - name: "Refuse anything but a v* tag"
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Run this from a release tag (v*), not ${GITHUB_REF}."
          exit 1

  prod:
    needs: [ tag ]
    uses: ./.github/workflows/content.yml
    with:
      AWS_ROLE: 'arn:aws:iam::922419543441:role/heart-github-actions-deploy-role'
      AWS_REGION: 'ca-central-1'
      CONTENT_BUCKET: '922419543441-ca-central-1-content'
      MEDIA_DISTRIBUTION_ID: 'EGZ95J4EWTC39'
