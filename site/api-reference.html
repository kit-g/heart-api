<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="description" content="Every route, parameter and response of the Heart of Yours read-only API, generated from the code."/>
    <!-- Linked from the site, kept out of search until the app can create tokens (heart-of-yours#271). -->
    <meta name="robots" content="noindex"/>
    <title>API reference - Heart of Yours, a free workout log app</title>
    <link rel="canonical" href="https://heart-of.me/api-reference.html"/>
    <!-- Safari on iPhone shows a native "Get" bar for the app. -->
    <meta name="apple-itunes-app" content="app-id=6777837444"/>
    <!-- Link previews: absolute URLs, because crawlers don't resolve relative ones. -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Heart of Yours"/>
    <meta property="og:title" content="API reference - Heart of Yours, a free workout log app"/>
    <meta property="og:description" content="Every route, parameter and response of the read-only API, generated from the code."/>
    <meta property="og:url" content="https://heart-of.me/api-reference.html"/>
    <meta property="og:image" content="https://heart-of.me/assets/og.png?v=3"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt" content="Heart of Yours: a workout log that gets out of your way. Free, no account needed, health data stays on your phone. Beside it, the app’s workouts-per-week chart and goals."/>
    <meta name="twitter:card" content="summary_large_image"/>
    <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,600&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="assets/tokens.css">
    <link rel="stylesheet" href="assets/site.css">
    <link rel="stylesheet" href="assets/tailwind.css">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css"
          integrity="sha384-wxLW6kwyHktdDGr6Pv1zgm/VGJh99lfUbzSn6HNHBENZlCN7W602k9VkGdxuFvPn" crossorigin="anonymous">
    <script src="assets/site.js"></script>
</head>
<body class="bg-ground text-ink font-text min-h-screen flex flex-col selection:bg-accent selection:text-on-accent">
<header class="w-full flex justify-center pt-6 pb-2 px-6 sm:px-10 z-10">
    <div class="w-full max-w-[1200px] flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <div class="size-9 flex items-center justify-center bg-surface rounded overflow-hidden border">
                <!-- The mark is drawn in --ink, so it ships as two transparent files
                     rather than the opaque app tile: the chip's own surface shows
                     through in either brightness. Decorative — the wordmark beside
                     it already names the app. -->
                <picture class="size-full">
                    <source srcset="assets/logo-dark.png" media="(prefers-color-scheme: dark)"/>
                    <img src="assets/logo-light.png" width="192" height="192" alt=""
                         class="size-full object-contain"/>
                </picture>
            </div>
            <h2 class="text-lg font-title font-semibold tracking-tight">Heart of Yours</h2>
        </a>
        <nav class="flex items-center gap-8">
            <a class="text-sm font-medium text-muted hover:text-accent-ink transition-colors" href="developers.html">Developer API</a>
            <a class="text-sm font-medium text-muted hover:text-accent-ink transition-colors" href="/">Back Home</a>
        </nav>
    </div>
</header>

<!-- Swagger UI draws in light colours only, so it keeps a light ground in either theme. -->
<main class="flex-grow w-full max-w-5xl mx-auto px-6 py-10">
    <div id="reference" style="background: #fff; color: #3b4151; border-radius: 8px;"></div>
</main>

<footer class="w-full py-10 px-6 border-t">
    <div class="max-w-[960px] mx-auto flex flex-col items-center gap-6">
        <p class="text-xs text-muted">
            © <span id="footer-year"></span> Heart of Yours.
        </p>
    </div>
</footer>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"
        integrity="sha384-wmyclcVGX/WhUkdkATwhaK1X1JtiNrr2EoYJ+diV3vj4v6OC5yCeSu+yW13SYJep" crossorigin="anonymous"></script>
<script>SwaggerUIBundle({url: 'openapi/me.json', dom_id: '#reference'});</script>
</body>
</html>
