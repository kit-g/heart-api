<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex"/>
    <title>Get the app - Heart of Yours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,600&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="assets/tokens.css">
    <link rel="stylesheet" href="assets/site.css">
    <link rel="stylesheet" href="assets/tailwind.css">
    <!-- the version makes a browser holding the last script fetch this one, which sets heartPlatform -->
    <script src="assets/site.js?v=2"></script>
</head>
<!-- Where the QR code on the home page points. A phone goes straight to its own
     store; anything else, or a browser without scripts, stays here with both badges. -->
<body class="bg-ground text-ink font-text min-h-screen flex flex-col overflow-x-hidden">
<main class="flex-grow w-full max-w-md mx-auto px-6 py-12 flex flex-col items-center justify-center gap-8 text-center">
    <h1 class="font-title text-3xl font-semibold tracking-tight">Get Heart of Yours</h1>
    <section class="flex flex-wrap justify-center gap-4" aria-label="Get the app">
        <a href="https://apps.apple.com/app/id6777837444" data-store="ios"
           class="inline-block hover:opacity-90 transition-opacity">
            <img src="assets/appstore_button.svg" alt="Download on the App Store" class="h-12 w-auto"/>
        </a>
        <a href="https://play.google.com/store/apps/details?id=me.heart.android&referrer=utm_source%3Dsite%26utm_campaign%3Dqr"
           data-store="android" class="inline-block hover:opacity-90 transition-opacity">
            <img src="assets/google_play_button.svg" alt="Get it on Google Play" class="h-12 w-auto"/>
        </a>
    </section>
    <a href="index.html" class="text-sm font-medium text-muted hover:text-accent-ink transition-colors">heart-of.me</a>
</main>
<script>
    {
        const badge = document.querySelector(`[data-store="${window.heartPlatform}"]`);
        if (badge) {
            location.replace(badge.href);
        }
    }
</script>
</body>
</html>
