[project]
name = "assets"
version = "0.1.0"
description = "Assets pipeline — processes exercise media uploads into asset + thumbnail with dimensions"
# Pinned to 3.12: Pillow's prebuilt wheels don't run on AWS Lambda runtimes
# above python3.12, so this service ships on python3.12 (see stacks/assets and
# deploy-assets.yml). Local dev/test runs on the workspace's newer interpreter,
# where Pillow is fine.
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.1.1",
    "boto3>=1.42.9",
]

[tool.uv]
# Application, not a library — uv won't wheel-install this into the venv.
# Source lives at assets/assets/*.py with flat imports (`from events import ...`)
# so the same files work unchanged inside the Lambda zip. See assets/README.md.
package = false
