  - key: power_and_size
    audience: getting_stronger
    equipment: gym
    per_week: 4
    weeks: 12
    minutes: 70
    next: [strength_waves, weekly_top_sets]
    safety: [start, stop_if, discomfort]
    deload: {every: 6, load: 0.9, volume: 0.5}
    name: {en: "Power and size, four days", es: "Fuerza y volumen, cuatro días", fr: "Force et volume, quatre jours", ru: "Сила и объём, четыре дня"}
    note:
      en: "Four days: a heavy upper and lower day for strength, then an upper and lower day with more reps for size."
      es: "Cuatro días: un día pesado de tren superior y otro de inferior para la fuerza, y luego superior e inferior con más repeticiones para el volumen."
      fr: "Quatre jours : un jour lourd haut du corps et un bas du corps pour la force, puis haut et bas avec plus de répétitions pour le volume."
      ru: "Четыре дня: тяжёлые день верха и день низа — для силы, затем верх и низ с большим числом повторений — для объёма."
    who:
      en: "For getting both stronger and bigger, four days a week."
      es: "Para ganar a la vez fuerza y músculo, cuatro días por semana."
      fr: "Pour gagner à la fois en force et en muscle, quatre jours par semaine."
      ru: "Чтобы прибавлять и в силе, и в мышцах, четыре дня в неделю."
    week:
      en: "Four sessions of about 70 minutes: heavy upper, heavy lower, a day off, then upper and lower for size. Every sixth week is lighter."
      es: "Cuatro sesiones de unos 70 minutos: superior pesado, inferior pesado, un día libre, y superior e inferior para volumen. Cada sexta semana es más ligera."
      fr: "Quatre séances d’environ 70 minutes : haut lourd, bas lourd, un jour de repos, puis haut et bas pour le volume. Une semaine sur six est allégée."
      ru: "Четыре тренировки примерно по 70 минут: тяжёлый верх, тяжёлый низ, день отдыха, затем верх и низ на объём. Каждая шестая неделя — лёгкая."
    grows:
      en: "Every set aims for its range, a rep or two short of failing. When all of them reach the top, the weight goes up."
      es: "Cada serie busca su rango, a una o dos repeticiones del fallo. Cuando todas llegan al tope, el peso sube."
      fr: "Chaque série vise sa fourchette, une ou deux répétitions avant l’échec. Quand toutes atteignent le haut, la charge augmente."
      ru: "Каждый подход — в своём диапазоне, за одно-два повторения до отказа. Когда все дошли до верха, вес растёт."
    misses:
      en: "Three sessions in a row below the range take that lift down a tenth."
      es: "Tres sesiones seguidas por debajo del rango bajan ese ejercicio una décima parte."
      fr: "Trois séances d’affilée sous la fourchette font baisser ce mouvement d’un dixième."
      ru: "Три тренировки подряд ниже диапазона снижают вес в этом упражнении на десятую часть."
    why:
      - sources: [currier_2023, acsm_2026]
        about: [program, sessions.upper_power, sessions.lower_power]
        text:
          en: "Heavy sets lead for strength, and moderate ones build size as well, so the week has both."
          es: "Las series pesadas son las mejores para la fuerza y las moderadas construyen músculo igual de bien, así que la semana tiene ambas."
          fr: "Les séries lourdes mènent pour la force, et les modérées construisent autant de muscle : la semaine a les deux."
          ru: "Тяжёлые подходы лучше для силы, а умеренные не хуже строят мышцы, поэтому в неделе есть и те и другие."
      - sources: [schoenfeld_2016]
        about: [week]
        text:
          en: "Each muscle gets two sessions a week, which builds more than one."
          es: "Cada músculo recibe dos sesiones por semana, lo que construye más que una."
          fr: "Chaque muscle a deux séances par semaine, ce qui construit plus qu’une."
          ru: "Каждая мышца получает две тренировки в неделю — это даёт больше, чем одна."
      - sources: [bell_2023, coleman_2024]
        about: [deload]
        text:
          en: "A lighter week every six keeps you fresh without a week off."
          es: "Una semana más ligera cada seis te mantiene fresco sin una semana libre."
          fr: "Une semaine allégée toutes les six vous garde frais sans semaine de repos."
          ru: "Лёгкая неделя раз в шесть недель сохраняет свежесть без недели отдыха."
    rules:
      bench-press-barbell: &power_and_size__barbell {kind: rangeThenWeight, step: 2.5}
      bent-over-row-barbell: *power_and_size__barbell
      lat-pulldown-cable: *power_and_size__barbell
