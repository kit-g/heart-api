  - key: three_tiers
    audience: getting_stronger
    equipment: gym
    per_week: 4
    weeks: 12
    minutes: 60
    next: [strength_waves, weekly_top_sets]
    safety: [start, stop_if, discomfort]
    name: {en: Three tiers, es: Tres niveles, fr: Trois niveaux, ru: Три уровня}
    note:
      en: "Four workouts in turn. Each day has one heavy lift, one lift for more reps and lighter accessory work. When a lift stalls, its sets and reps change before the weight does."
      es: "Cuatro entrenamientos por turnos. Cada día tiene un ejercicio pesado, uno con más repeticiones y trabajo accesorio más ligero. Cuando un ejercicio se estanca, cambian sus series y repeticiones antes que el peso."
      fr: "Quatre séances en alternance. Chaque jour, un mouvement lourd, un mouvement à plus de répétitions et du travail accessoire plus léger. Quand un mouvement bloque, ses séries et répétitions changent avant la charge."
      ru: "Четыре тренировки по очереди. В каждый день — одно тяжёлое упражнение, одно на больше повторений и более лёгкая подсобка. Когда упражнение застревает, сначала меняются подходы и повторения, а не вес."
    who:
      en: "For lifters a few months in, past the first easy gains, who want a plan that doesn't stall at the first missed rep."
      es: "Para quien lleva unos meses entrenando, ya pasadas las primeras ganancias fáciles, y quiere un plan que no se atasque a la primera repetición fallada."
      fr: "Pour ceux qui s’entraînent depuis quelques mois, après les premiers progrès faciles, et veulent un programme qui ne bloque pas à la première répétition manquée."
      ru: "Для тех, кто тренируется уже несколько месяцев, прошёл первые лёгкие успехи и хочет план, который не застревает на первом недобранном повторении."
    week:
      en: "Four sessions of about an hour, in turn. The squat, bench, press and deadlift are each heavy on one day and for sets of ten on another; pulldowns and rows fill out every day."
      es: "Cuatro sesiones de una hora, por turnos. Sentadilla, banca, press militar y peso muerto son pesados un día y en series de diez otro; jalones y remos completan cada día."
      fr: "Quatre séances d’environ une heure, en alternance. Squat, développé couché, militaire et soulevé de terre sont lourds un jour et en séries de dix un autre ; tirages et rowings complètent chaque séance."
      ru: "Четыре тренировки примерно по часу, по очереди. Присед, жим лёжа, жим стоя и становая тяга в один день тяжёлые, в другой — подходами по десять; тяги блока и тяги к поясу дополняют каждый день."
    grows:
      en: "Make every rep on a lift and it goes up next time: 2.5 kg, 5 on the heavy deadlift. Accessories go up 2.5 kg once the last set reaches 25."
      es: "Completa todas las repeticiones de un ejercicio y sube la próxima vez: 2,5 kg, 5 en el peso muerto pesado. Los accesorios suben 2,5 kg cuando la última serie llega a 25."
      fr: "Réussissez toutes les répétitions d’un mouvement et il monte la fois suivante : 2,5 kg, 5 au soulevé de terre lourd. Les accessoires montent de 2,5 kg quand la dernière série atteint 25."
      ru: "Сделали все повторения — в следующий раз вес растёт: на 2,5 кг, в тяжёлой становой на 5. Подсобка растёт на 2,5 кг, когда последний подход доходит до 25."
    misses:
      en: "Miss on a heavy lift and keep the weight, in more sets of fewer reps: five triples, then six doubles, then ten singles. Miss on those and the weight drops about 15% and starts over. The sets of ten go to eight, then six, the same way."
      es: "Si fallas un ejercicio pesado, mantén el peso en más series de menos repeticiones: cinco de tres, luego seis de dos, luego diez de una. Si fallas ahí, el peso baja un 15% y vuelves a empezar. Las series de diez pasan a ocho y luego a seis, igual."
      fr: "Un mouvement lourd manqué, on garde la charge en plus de séries de moins de répétitions : cinq triples, puis six doubles, puis dix simples. Manqué là aussi, la charge baisse d’environ 15 % et on recommence. Les séries de dix passent à huit, puis à six, de la même façon."
      ru: "Не справились с тяжёлым упражнением — вес остаётся, а подходов больше и повторений меньше: пять троек, потом шесть двоек, потом десять одиночных. Не справились и там — вес снижается примерно на 15%, и всё начинается заново. Подходы по десять так же переходят в восемь, потом в шесть."
    why:
      - sources: [currier_2023, acsm_2026]
        about: [program, grows]
        text:
          en: "Heavy sets led the research for strength, and two to three sets of moderate reps build muscle. Few other details of a program mattered."
          es: "Las series pesadas encabezaron la investigación sobre fuerza, y dos o tres series de repeticiones moderadas construyen músculo. Pocos otros detalles de un programa importaron."
          fr: "Les séries lourdes sont arrivées en tête pour la force, et deux à trois séries de répétitions modérées construisent du muscle. Peu d’autres détails d’un programme ont compté."
          ru: "Тяжёлые подходы лидировали в исследованиях силы, а два-три подхода средних повторений строят мышцы. Остальные детали программы почти не имели значения."
      - sources: [acsm_2026]
        about: [misses]
        text:
          en: "Changing sets and reps at a stall is a way to keep the weights heavy enough, which the research found mattered. The exact schemes are convention, not findings."
          es: "Cambiar series y repeticiones al estancarse es una forma de mantener los pesos lo bastante altos, lo que la investigación vio que importaba. Los esquemas exactos son costumbre, no hallazgos."
          fr: "Changer séries et répétitions quand ça bloque permet de garder des charges assez lourdes, ce qui comptait selon la recherche. Les schémas exacts sont des usages, pas des résultats."
          ru: "Смена подходов и повторений при застое — способ сохранить достаточно тяжёлые веса, а это, по исследованиям, важно. Сами схемы — традиция, а не научный вывод."
      - sources: [schoenfeld_2016]
        about: [week]
        text:
          en: "Each big lift comes twice a week, once heavy and once lighter: training a muscle twice a week built more than once."
          es: "Cada ejercicio grande va dos veces por semana, una pesada y otra más ligera: entrenar un músculo dos veces por semana construyó más que una."
          fr: "Chaque grand mouvement revient deux fois par semaine, une fois lourd et une fois plus léger : entraîner un muscle deux fois par semaine a construit davantage qu’une."
          ru: "Каждое базовое упражнение — дважды в неделю, один раз тяжело, другой легче: две тренировки мышцы в неделю дали больше, чем одна."
      - sources: [rest_singer_2024]
        about: [rest]
        text:
          en: "Three to four minutes after heavy sets, because a little longer rest does a little more on big lifts."
          es: "De tres a cuatro minutos tras las series pesadas, porque descansar un poco más rinde un poco más en los ejercicios grandes."
          fr: "Trois à quatre minutes après les séries lourdes, car un repos un peu plus long rapporte un peu plus sur les grands mouvements."
          ru: "Три-четыре минуты после тяжёлых подходов: на базовых упражнениях чуть более долгий отдых даёт чуть больше."
    rules:
