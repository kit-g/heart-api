      seated-row-cable: *three_tiers__light
    sessions:
      - key: a1
        name: {en: Day A1, es: Día A1, fr: Jour A1, ru: День A1}
        exercises:
          - {exercise: squat-barbell, sets: &three_tiers__heavy_sets [{reps: 3}, {reps: 3}, {reps: 3}, {reps: 3}, {reps: 3+}], rest: 240}
          - exercise: bench-press-barbell
            sets: 3
            target: {reps: 10}
            rest: 150
            rule: &three_tiers__second
              kind: stages
              step: 2.5
