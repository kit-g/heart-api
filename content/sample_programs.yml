  - key: one_muscle_a_day
    audience: getting_stronger
    equipment: gym
    per_week: 5
    weeks: 12
    minutes: 60
    next: [push_pull_legs, power_and_size, upper_lower]
    safety: [start, stop_if, discomfort]
    name: {en: One muscle group a day, es: Un grupo muscular al día, fr: Un groupe musculaire par jour, ru: Одна группа мышц в день}
    note:
      en: "Five days, one area each: chest, back, shoulders, legs, arms. Plenty of sets for one part at a time."
      es: "Cinco días, una zona cada uno: pecho, espalda, hombros, piernas, brazos. Muchas series para una parte cada vez."
      fr: "Cinq jours, une zone chacun : pectoraux, dos, épaules, jambes, bras. Beaucoup de séries pour une partie à la fois."
      ru: "Пять дней, по одной зоне: грудь, спина, плечи, ноги, руки. Много подходов на одну часть за раз."
    who:
      en: "For lifters who enjoy a bodybuilding-style week and have five days. If you often skip days, a plan that works each muscle twice is more forgiving."
      es: "Para quien disfruta de una semana al estilo culturismo y tiene cinco días. Si sueles saltarte días, un plan que trabaja cada músculo dos veces perdona más."
      fr: "Pour ceux qui aiment une semaine façon bodybuilding et ont cinq jours. Si vous sautez souvent des séances, un plan qui travaille chaque muscle deux fois pardonne davantage."
      ru: "Для тех, кому нравится неделя в стиле бодибилдинга и есть пять дней. Если вы часто пропускаете, план, где каждая мышца работает дважды, прощает больше."
    week:
      en: "Five sessions of about an hour, one area each, on any five days."
      es: "Cinco sesiones de una hora, una zona cada una, en cualquiera cinco días."
      fr: "Cinq séances d’environ une heure, une zone chacune, sur n’importe quels cinq jours."
      ru: "Пять тренировок примерно по часу, по одной зоне, в любые пять дней."
    grows:
      en: "Every set aims for its range, a rep or two short of failing. When all of them reach the top, the weight goes up."
      es: "Cada serie busca su rango, a una o dos repeticiones del fallo. Cuando todas llegan al tope, el peso sube."
      fr: "Chaque série vise sa fourchette, une ou deux répétitions avant l’échec. Quand toutes atteignent le haut, la charge augmente."
      ru: "Каждый подход — в своём диапазоне, за одно-два повторения до отказа. Когда все дошли до верха, вес растёт."
    misses:
      en: "Three sessions in a row below the range take that lift down a tenth."
      es: "Tres sesiones seguidas por debajo del rango bajan ese ejercicio una décima parte."
      fr: "Trois séances d’affilée sous la fourchette font baisser ce mouvement d’un dixième."
      ru: "Три тренировки подряд ниже диапазона снижают вес в этом упражнении на десятую часть."
    why:
      - sources: [schoenfeld_2019]
        about: [program, week]
        text:
          en: "With the same number of sets, once a week per muscle builds about as much as more often. So this works, if it's the week you enjoy."
          es: "Con el mismo número de series, una vez por semana por músculo construye más o menos lo mismo que más a menudo. Así que funciona, si es la semana que disfrutas."
          fr: "À nombre de séries égal, une fois par semaine par muscle construit à peu près autant que plus souvent. Donc ça marche, si c’est la semaine qui vous plaît."
          ru: "При одинаковом числе подходов раз в неделю на мышцу даёт примерно столько же, сколько чаще. Так что это работает — если такая неделя вам нравится."
      - sources: [schoenfeld_2016]
        about: [who, next]
        text:
          en: "Working each muscle twice a week did a little more in other research, and it forgives a missed day better."
          es: "Trabajar cada músculo dos veces por semana rindió algo más en otra investigación, y perdona mejor un día perdido."
          fr: "Travailler chaque muscle deux fois par semaine a donné un peu plus dans d’autres études, et pardonne mieux une séance manquée."
          ru: "Две тренировки каждой мышцы в неделю в других исследованиях дали немного больше и легче переносят пропуск."
    rules:
      bench-press-barbell: &one_muscle_a_day__barbell {kind: rangeThenWeight, step: 2.5}
      pec-deck-machine: *one_muscle_a_day__barbell
      bent-over-row-barbell: *one_muscle_a_day__barbell
      lat-pulldown-cable: *one_muscle_a_day__barbell
      seated-row-cable: *one_muscle_a_day__barbell
      pull-up: *one_muscle_a_day__barbell
      overhead-press-barbell: *one_muscle_a_day__barbell
      face-pull-cable: *one_muscle_a_day__barbell
      squat-barbell: *one_muscle_a_day__barbell
