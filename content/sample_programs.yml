      leg-extension-machine: *one_muscle_a_day__barbell
      lying-leg-curl-machine: *one_muscle_a_day__barbell
      bicep-curl-barbell: *one_muscle_a_day__barbell
      skullcrusher-barbell: *one_muscle_a_day__barbell
