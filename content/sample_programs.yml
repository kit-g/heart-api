  - key: waves_and_volume
    audience: getting_stronger
    equipment: gym
    per_week: 4
    minutes: 75
    next: [weekly_top_sets]
    safety: [start, stop_if, discomfort]
    name: {en: Waves and volume, es: Olas y volumen, fr: Vagues et volume, ru: Волны и объём}
    note:
      en: "The four-lift training-max waves, with five sets of ten at half your max after the main work: more muscle from the same plan."
      es: "Las olas de máximo de entrenamiento en cuatro ejercicios, con cinco series de diez a la mitad de tu máximo tras el trabajo principal: más músculo con el mismo plan."
      fr: "Les vagues sur maximum d’entraînement en quatre mouvements, avec cinq séries de dix à la moitié de votre max après le travail principal : plus de muscle avec le même plan."
      ru: "Те же волны по тренировочному максимуму в четырёх упражнениях, плюс пять подходов по десять на половине максимума после основной работы: больше мышц по тому же плану."
    who:
      en: "For lifters who like the wave plan and want more size from it."
      es: "Para quien disfruta del plan por olas y quiere sacarle más músculo."
      fr: "Pour ceux qui aiment le plan en vagues et veulent en tirer plus de muscle."
      ru: "Для тех, кому нравится план волнами и хочется получить от него больше мышц."
    week:
      en: "Four sessions of about 75 minutes: squat, bench, deadlift and press days, each with five sets of ten and some pulling. The first week finds your maxes."
      es: "Cuatro sesiones de unos 75 minutos: días de sentadilla, banca, peso muerto y press, cada uno con cinco series de diez y algo de tirón. La primera semana encuentra tus máximos."
      fr: "Quatre séances d’environ 75 minutes : jours squat, développé couché, soulevé de terre et militaire, chacun avec cinq séries de dix et du tirage. La première semaine trouve vos max."
      ru: "Четыре тренировки примерно по 75 минут: дни приседа, жима лёжа, становой и жима стоя, в каждом — пять подходов по десять и немного тяги. Первая неделя находит ваши максимумы."
    grows:
      en: "Each lift runs on a training max, 90% of what the first week's test says you could lift once. After each four-week wave it goes up 2.5 kg for the presses and 5 kg for the squat and deadlift."
      es: "Cada ejercicio va con un máximo de entrenamiento, el 90% de lo que la prueba de la primera semana dice que podrías levantar una vez. Tras cada ola de cuatro semanas sube 2,5 kg en los press y 5 kg en sentadilla y peso muerto."
      fr: "Chaque mouvement suit un maximum d’entraînement, 90 % de ce que le test de la première semaine dit que vous pourriez soulever une fois. Après chaque vague de quatre semaines, il monte de 2,5 kg pour les développés et de 5 kg pour le squat et le soulevé de terre."
      ru: "Каждое упражнение идёт от тренировочного максимума — 90% от того, что, по тесту первой недели, вы могли бы поднять один раз. После каждой четырёхнедельной волны он растёт на 2,5 кг в жимах и на 5 кг в приседе и становой."
    misses:
      en: "Fall short on the last heavy set two waves in a row and that lift's max drops a tenth."
      es: "Si te quedas corto en la última serie pesada dos olas seguidas, el máximo de ese ejercicio baja una décima parte."
      fr: "Échouez sur la dernière série lourde deux vagues d’affilée et le max de ce mouvement baisse d’un dixième."
      ru: "Не справились с последним тяжёлым подходом две волны подряд — максимум в этом упражнении снижается на десятую часть."
    why:
      - sources: [acsm_2026]
        about: [program, grows]
        text:
          en: "Waves aren't magic; research finds a small edge for strength at most. But a plan you enjoy is one you keep."
          es: "Las olas no son magia; la investigación encuentra como mucho una pequeña ventaja para la fuerza. Pero un plan que disfrutas es un plan que mantienes."
          fr: "Les vagues n’ont rien de magique ; la recherche trouve au mieux un petit avantage pour la force. Mais un plan qu’on aime est un plan qu’on garde."
          ru: "Волны — не волшебство: исследования находят разве что небольшое преимущество для силы. Но план, который нравится, — это план, который не бросаешь."
      - sources: [iversen_2021, currier_2023]
        about: [rules.squat-barbell, rules.bench-press-barbell, rules.deadlift-barbell, rules.overhead-press-barbell]
        text:
          en: "The heavy sets drive strength; the five sets of ten add the volume that builds size."
          es: "Las series pesadas impulsan la fuerza; las cinco series de diez añaden el volumen que construye músculo."
          fr: "Les séries lourdes font la force ; les cinq séries de dix ajoutent le volume qui construit le muscle."
          ru: "Тяжёлые подходы развивают силу, а пять подходов по десять добавляют объём, который строит мышцы."
      - sources: [bell_2023, coleman_2024]
        about: [grows]
        text:
          en: "Every fourth week is light, not off."
          es: "Cada cuarta semana es ligera, no libre."
          fr: "Une semaine sur quatre est légère, pas off."
          ru: "Каждая четвёртая неделя — лёгкая, а не выходная."
    phases:
      - name: {en: Find your maxes, es: Encuentra tus máximos, fr: Trouvez vos max, ru: Найдите максимумы}
        sessions: [test_lower, test_upper]
        cycles: 1
      - name: {en: Waves, es: Olas, fr: Vagues, ru: Волны}
        sessions: [squat, bench, deadlift, press]
    tests:
      test_lower: {share: 0.9}
      test_upper: {share: 0.9}
    rules:
      squat-barbell: &waves_and_volume__lower_volume
        kind: shareOfMax
        step: 5
        waves: &waves_and_volume__volume_waves
          - [{share: 0.65, reps: 5}, {share: 0.75, reps: 5}, {share: 0.85, reps: 5, amrap: true},
             {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true},
             {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true}]
          - [{share: 0.70, reps: 3}, {share: 0.80, reps: 3}, {share: 0.90, reps: 3, amrap: true},
             {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true},
             {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true}]
          - [{share: 0.75, reps: 5}, {share: 0.85, reps: 3}, {share: 0.95, reps: 1, amrap: true},
             {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true},
             {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true}]
          - [{share: 0.40, reps: 5}, {share: 0.50, reps: 5}, {share: 0.60, reps: 5},
             {share: 0.4, reps: 5, supplemental: true}, {share: 0.4, reps: 5, supplemental: true}, {share: 0.4, reps: 5, supplemental: true},
             {share: 0.4, reps: 5, supplemental: true}, {share: 0.4, reps: 5, supplemental: true}]
      deadlift-barbell: *waves_and_volume__lower_volume
      bench-press-barbell: &waves_and_volume__upper_volume
        kind: shareOfMax
        step: 2.5
        waves: *waves_and_volume__volume_waves
      overhead-press-barbell: *waves_and_volume__upper_volume
    sessions:
      - key: test_lower
        name: {en: Test the squat and deadlift, es: Test de sentadilla y peso muerto, fr: Test du squat et du soulevé de terre, ru: Тест приседа и становой}
        note:
          en: "Work up to one heavy set of three to five reps, with a rep left in the tank."
          es: "Sube hasta una serie pesada de tres a cinco repeticiones, dejando una en reserva."
          fr: "Montez jusqu’à une série lourde de trois à cinq répétitions, en gardant une répétition en réserve."
          ru: "Дойдите до одного тяжёлого подхода на три–пять повторений, оставив одно в запасе."
        exercises:
          - {exercise: squat-barbell, sets: 1, target: {reps: [3, 5], rir: 1}, rest: 240}
          - {exercise: deadlift-barbell, sets: 1, target: {reps: [3, 5], rir: 1}, rest: 240}
      - key: test_upper
        name: {en: Test the bench and press, es: Test de press de banca y militar, fr: Test du développé couché et militaire, ru: Тест жима лёжа и стоя}
        note:
          en: "Work up to one heavy set of three to five reps, with a rep left in the tank."
          es: "Sube hasta una serie pesada de tres a cinco repeticiones, dejando una en reserva."
          fr: "Montez jusqu’à une série lourde de trois à cinq répétitions, en gardant une répétition en réserve."
          ru: "Дойдите до одного тяжёлого подхода на три–пять повторений, оставив одно в запасе."
        exercises:
          - {exercise: bench-press-barbell, sets: 1, target: {reps: [3, 5], rir: 1}, rest: 240}
          - {exercise: overhead-press-barbell, sets: 1, target: {reps: [3, 5], rir: 1}, rest: 240}
      - key: squat
        name: {en: Squat day, es: Día de sentadilla, fr: Jour squat, ru: День приседа}
        exercises:
          - exercise: squat-barbell
            rest: 150
            sets: &waves_and_volume__week_one [{share: 0.65, reps: 5}, {share: 0.75, reps: 5}, {share: 0.85, reps: 5+},
                   {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true},
                   {share: 0.5, reps: 10, supplemental: true}, {share: 0.5, reps: 10, supplemental: true}]
          - {exercise: lat-pulldown-cable, pattern: vertical_pull, total_reps: [50, 100], sets: 5, target: {reps: [10, 20]}, rest: 60}
      - key: bench
        name: {en: Bench day, es: Día de press de banca, fr: Jour développé couché, ru: День жима лёжа}
        exercises:
          - {exercise: bench-press-barbell, rest: 120, sets: *waves_and_volume__week_one}
          - {exercise: seated-row-cable, pattern: horizontal_row, total_reps: [50, 100], sets: 5, target: {reps: [10, 20]}, rest: 60}
      - key: deadlift
        name: {en: Deadlift day, es: Día de peso muerto, fr: Jour soulevé de terre, ru: День становой тяги}
        exercises:
          - {exercise: deadlift-barbell, rest: 180, sets: *waves_and_volume__week_one}
          - {exercise: bent-over-row-dumbbell, pattern: horizontal_row, total_reps: [50, 100], sets: 5, target: {reps: [10, 20]}, rest: 60}
      - key: press
        name: {en: Press day, es: Día de press militar, fr: Jour développé militaire, ru: День жима стоя}
        exercises:
          - {exercise: overhead-press-barbell, rest: 120, sets: *waves_and_volume__week_one}
          - {exercise: lat-pulldown-cable, pattern: vertical_pull, total_reps: [50, 100], sets: 5, target: {reps: [10, 20]}, rest: 60}

  - key: weekly_top_sets
    audience: getting_stronger
    equipment: gym
    per_week: 4
    minutes: 90
    safety: [start, stop_if, discomfort]
    name: {en: "Top set, weekly steps", es: "Serie tope, pasos semanales", fr: "Série de pointe, paliers hebdomadaires", ru: "Пиковый подход, шаги по неделям"}
    note:
      en: "Four heavy days on a training max: a top set for as many reps as you can, a long way back down, then a second lift for volume. The top set picks next week's step."
      es: "Cuatro días pesados con un máximo de entrenamiento: una serie tope al máximo de repeticiones, un largo descenso, y un segundo ejercicio para el volumen. La serie tope decide el paso de la semana siguiente."
      fr: "Quatre jours lourds sur un maximum d’entraînement : une série de pointe au maximum de répétitions, une longue redescente, puis un second mouvement pour le volume. La série de pointe fixe le palier de la semaine suivante."
      ru: "Четыре тяжёлых дня от тренировочного максимума: пиковый подход на максимум повторений, долгий спуск вниз и второе упражнение на объём. Пиковый подход определяет шаг следующей недели."
    who:
      en: "For experienced lifters with time for long sessions, who like fast, week-to-week progress."
      es: "Para levantadores con experiencia y tiempo para sesiones largas, que disfrutan de un progreso rápido semana a semana."
      fr: "Pour les pratiquants expérimentés qui ont le temps de longues séances et aiment progresser vite, de semaine en semaine."
      ru: "Для опытных атлетов, у которых есть время на долгие тренировки и которым нравится быстрый прогресс от недели к неделе."
    week:
      en: "Four sessions of up to an hour and a half: bench, squat, press and deadlift days, each with a second lift. The first week finds your maxes."
      es: "Cuatro sesiones de hasta hora y media: días de banca, sentadilla, press y peso muerto, cada uno con un segundo ejercicio. La primera semana encuentra tus máximos."
      fr: "Quatre séances jusqu’à une heure et demie : jours développé couché, squat, militaire et soulevé de terre, chacun avec un second mouvement. La première semaine trouve vos max."
      ru: "Четыре тренировки до полутора часов: дни жима лёжа, приседа, жима стоя и становой, в каждом — второе упражнение. Первая неделя находит ваши максимумы."
    grows:
      en: "Each main lift runs on a training max. The third set is as many as you can: 2 to 5 reps adds 2.5 kg next week, 6 or more adds 5 (7.5 on the squat and deadlift), and 1 holds. The second lift follows the main lift's max."
      es: "Cada ejercicio principal va con un máximo de entrenamiento. La tercera serie es al máximo de repeticiones: de 2 a 5 suma 2,5 kg la semana siguiente, 6 o más suma 5 (7,5 en sentadilla y peso muerto), y 1 lo mantiene. El segundo ejercicio sigue el máximo del principal."
      fr: "Chaque mouvement principal suit un maximum d’entraînement. La troisième série se fait au maximum : 2 à 5 répétitions ajoutent 2,5 kg la semaine suivante, 6 ou plus ajoutent 5 (7,5 au squat et au soulevé de terre), et 1 maintient. Le second mouvement suit le max du principal."
      ru: "Каждое основное упражнение идёт от тренировочного максимума. Третий подход — на максимум: 2–5 повторений дают +2,5 кг на следующей неделе, 6 и больше — +5 (+7,5 в приседе и становой), 1 — без изменений. Второе упражнение следует за максимумом основного."
    misses:
      en: "No rep on the top set two weeks in a row and that max drops a tenth."
      es: "Sin ninguna repetición en la serie tope dos semanas seguidas, ese máximo baja una décima parte."
      fr: "Aucune répétition sur la série de pointe deux semaines d’affilée et ce max baisse d’un dixième."
      ru: "Ни одного повторения в пиковом подходе две недели подряд — этот максимум снижается на десятую часть."
    why:
      - sources: [currier_2023]
        about: [program, week]
        text:
          en: "Heavy sets lead the research for strength. This plan does a lot of them, so it needs the time and sleep to recover."
          es: "Las series pesadas encabezan la investigación sobre fuerza. Este plan hace muchas, así que necesita tiempo y sueño para recuperarse."
          fr: "Les séries lourdes mènent la recherche sur la force. Ce plan en fait beaucoup : il demande du temps et du sommeil pour récupérer."
          ru: "Тяжёлые подходы лидируют в исследованиях силы. В этом плане их много, поэтому на восстановление нужны время и сон."
      - sources: [acsm_2026]
        about: [grows]
        text:
          en: "Letting the top set pick the step moves you as fast as you recover. It's a way to pace, not a magic number."
          es: "Dejar que la serie tope decida el paso te hace avanzar tan rápido como te recuperas. Es una forma de dosificar, no un número mágico."
          fr: "Laisser la série de pointe fixer le palier vous fait avancer aussi vite que vous récupérez. C’est une façon de doser, pas un chiffre magique."
          ru: "Когда шаг выбирает пиковый подход, вы растёте настолько быстро, насколько восстанавливаетесь. Это способ дозировать, а не волшебное число."
    phases:
      - name: {en: Find your maxes, es: Encuentra tus máximos, fr: Trouvez vos max, ru: Найдите максимумы}
        sessions: [test_lower, test_upper]
        cycles: 1
      - name: {en: Weekly steps, es: Pasos semanales, fr: Paliers hebdomadaires, ru: Шаги по неделям}
        sessions: [bench, squat, press, deadlift]
    tests:
      test_lower: {share: 0.9}
      test_upper: {share: 0.9}
    rules:
      bench-press-barbell: &weekly_top_sets__upper_top
        kind: shareOfMax
        step: 2.5
        miss: {when: amrap, after: 2, cut: 0.1}
        amrap: [{reps: 0, step: 0}, {reps: 2, step: 2.5}, {reps: 6, step: 5}]
        waves: &weekly_top_sets__top_wave
          - [{share: 0.75, reps: 5}, {share: 0.85, reps: 3}, {share: 0.95, reps: 1, amrap: true},
             {share: 0.90, reps: 3}, {share: 0.85, reps: 3}, {share: 0.80, reps: 3},
             {share: 0.75, reps: 5}, {share: 0.70, reps: 5}, {share: 0.65, reps: 5}]
      overhead-press-barbell: *weekly_top_sets__upper_top
      squat-barbell: &weekly_top_sets__lower_top
        kind: shareOfMax
        step: 5
        miss: {when: amrap, after: 2, cut: 0.1}
        amrap: [{reps: 0, step: 0}, {reps: 2, step: 2.5}, {reps: 4, step: 5}, {reps: 6, step: 7.5}]
        waves: *weekly_top_sets__top_wave
      deadlift-barbell: *weekly_top_sets__lower_top
    sessions:
      - key: test_lower
        name: {en: Test the squat and deadlift, es: Test de sentadilla y peso muerto, fr: Test du squat et du soulevé de terre, ru: Тест приседа и становой}
        note:
          en: "Work up to one heavy set of three to five reps, with a rep left in the tank."
          es: "Sube hasta una serie pesada de tres a cinco repeticiones, dejando una en reserva."
