  "Reverse Curl (Barbell)":
    category: Barbell
    target: Arms
    i18n:
      en:
        name: "Reverse Curl (Barbell)"
        instructions: |
          ## Overview
          The barbell reverse curl is an isolation exercise that primarily targets the brachioradialis and brachialis. It also engages the biceps brachii and forearm extensors, using an overhand grip to emphasize forearm and upper arm development.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a barbell with an overhand grip
          - Position your hands slightly wider than shoulder-width apart
          - Let the bar hang at arm's length in front of your thighs
          - Keep your elbows close to your sides throughout the movement
          - Engage your core and maintain an upright posture

          ### 2. Movement
          1. Curl the bar upward by bending your elbows while keeping palms facing down
          2. Keep your upper arms stationary and close to your torso
          3. Continue lifting until your forearms are near vertical
          4. Pause and squeeze at the top of the movement
          5. Slowly lower the bar back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you curl the bar up
          - Inhale as you lower the bar back down

          ### 4. Tips
          - Maintain the overhand grip throughout the entire movement
          - Keep your elbows pinned to your sides throughout
          - Avoid swinging or using momentum to lift the weight
          - Focus on squeezing your forearms and brachialis at the top
          - Control both the lifting and lowering phases equally

          ### 5. Common Mistakes
          - Allowing the wrists to curl upward instead of maintaining alignment
          - Letting the elbows drift forward during the curl
          - Swinging the body or using momentum
          - Not fully extending the arms at the bottom
          - Using too much weight and compromising form
          - Dropping the weight too quickly on the descent

          ### 6. Safety / Modifications
          - Start with lighter weight than standard curls due to the grip disadvantage
          - Use an EZ curl bar if you experience wrist discomfort
          - Advanced variation: perform with a slow 3-5 second negative phase
          - Keep wrists in a neutral position to avoid strain

