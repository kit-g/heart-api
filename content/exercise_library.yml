  "Clean (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Clean (Barbell)"
        instructions: |
          ## Overview
          The barbell clean is an explosive Olympic weightlifting movement that primarily targets the quadriceps, glutes, and hamstrings. It also engages the entire posterior chain, traps, and shoulders, using a powerful hip extension and pull to move the barbell from floor to shoulders.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, barbell over mid-foot
          - Grip the bar just outside your legs with a hook grip
          - Hinge at hips and bend knees to reach the bar
          - Keep your back flat, chest up, and shoulders over the bar
          - Engage your lats and core before pulling

          ### 2. Movement
          1. Drive explosively through your legs to lift the bar off the floor
          2. Keep the bar close to your body as it travels upward
          3. Extend your hips and knees powerfully when the bar reaches mid-thigh
          4. Pull yourself under the bar as it rises
          5. Catch the bar on your shoulders in a front squat position
          6. Stand up fully to complete the rep

          ### 3. Breathing
          - Take a deep breath before pulling
          - Hold your breath through the pull and catch
          - Exhale after standing up

          ### 4. Tips
          - This is an advanced technical movement requiring coaching
          - Focus on explosive hip extension at the right moment
          - Keep the bar path close to your body throughout
          - Catch the bar with elbows high and forward
          - Master the movement with light weight before loading

          ### 5. Common Mistakes
          - Starting with hips too high or too low
          - Pulling with arms too early instead of using legs
          - Letting the bar drift away from the body
          - Not extending fully at the hips before pulling under
          - Landing with elbows low or not receiving properly
          - Attempting heavy weight without proper technique

          ### 6. Safety / Modifications
          - Learn from a qualified Olympic lifting coach
          - Master the hang clean before full cleans from the floor
          - Practice with PVC pipe or empty bar first
          - Use bumper plates and lifting platform for safe dropping

