          - Hold the weight in place with your hands
          - Keep your knees bent at 90 degrees throughout

          ### 2. Movement
          1. Lower your heels by flexing your ankles as far as possible
          2. Allow a full stretch in your calves at the bottom
          3. Pause briefly at the bottom stretch position
          4. Press through the balls of your feet to raise your heels as high as possible
          5. Squeeze your calves hard at the top
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your heels
          - Exhale as you press up onto your toes

          ### 4. Tips
          - Keep your knees stationary and bent throughout
          - The seated position emphasizes the soleus muscle
          - Achieve full range of motion from deep stretch to high contraction
          - Focus on squeezing your calves at the top
          - Use a towel or pad for comfort under the weight

          ### 5. Common Mistakes
          - Not achieving full range of motion at top or bottom
          - Bouncing at the bottom instead of controlled stretch
          - Using too much weight and compromising form
          - Moving too quickly through the repetitions
          - Not squeezing at the top contraction
          - Letting the weight shift or become unstable

          ### 6. Safety / Modifications
          - Use a pad or towel under the weight for thigh comfort
          - Start with light weight to establish proper form
          - Vary foot position (neutral, toes in, toes out) for complete calf development
          - Advanced variation: pause for 2-3 seconds at peak contraction

    muscles:
      primary:
        ids:
          - gastrocnemius_l
          - gastrocnemius_r
      secondary: {}
  "Seated Leg Curl (Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Seated Leg Curl (Machine)"
        instructions: |
          ## Overview
          The seated leg curl is an isolation exercise that primarily targets the hamstrings. It also engages the calves, using a seated position with a guided machine to isolate and strengthen the muscles on the back of the thigh through knee flexion.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the leg curl machine with your back firmly against the pad
          - Position the pad against the back of your lower legs, just above your ankles
          - Adjust the machine so your knees align with the pivot point
          - Grip the handles for stability
          - Keep your thighs secured under the thigh pad

          ### 2. Movement
          1. Curl your legs down and back by bending your knees
          2. Continue until the pad nearly touches the back of the seat
          3. Pause and squeeze your hamstrings at full flexion
          4. Slowly return the weight to the starting position with control
          5. Stop just before the weight stack touches to maintain tension
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you curl your legs down
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your back pressed firmly against the pad
          - Focus on squeezing your hamstrings at full flexion
          - Control both the curling and extending phases
          - Maintain constant tension by not letting the weight stack rest
          - Avoid using momentum or jerking the weight

          ### 5. Common Mistakes
          - Lifting your glutes off the seat during the curl
          - Using momentum or swinging the weight
          - Not achieving full range of motion
          - Letting the weight stack rest between reps
          - Moving too quickly through the repetitions
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Adjust pad and seat positions for proper knee alignment
          - Start with light weight to establish proper form
          - The seated position may be more comfortable than lying variations
          - Advanced variation: perform one leg at a time or add a pause at full flexion

    muscles:
      primary:
        groups:
          - hamstrings
      secondary: {}
  "Seated Leg Press (Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Seated Leg Press (Machine)"
        instructions: |
          ## Overview
          The seated leg press is a compound lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It uses a seated machine with a more upright back position than traditional leg press machines, providing stable resistance with reduced lower back stress.

          ## How to Perform
          ### 1. Starting Position
          - Sit in the seated leg press machine with your back firmly against the pad
          - Position your feet shoulder-width apart on the platform
          - Keep your feet flat with toes pointing slightly outward
          - Unlock the safety handles if present
          - Keep your core engaged and hands on the handles

          ### 2. Movement
          1. Press the platform forward by extending your legs
          2. Continue until your legs are fully extended without locking your knees
          3. Pause briefly at full extension
          4. Slowly bend your knees to return the platform to the starting position
          5. Continue until your knees reach approximately 90 degrees
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you press the platform forward
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your back and hips pressed firmly against the pads
          - Drive through your entire foot, not just your toes
          - Avoid locking your knees completely at full extension
          - Keep your knees tracking over your toes
          - Maintain constant tension throughout the movement

          ### 5. Common Mistakes
          - Lifting your glutes or lower back off the pad
          - Locking knees completely at full extension
          - Allowing the knees to cave inward
          - Not achieving adequate depth (at least 90 degrees)
          - Using too much weight and compromising form
          - Placing feet too low on the platform, increasing knee stress

          ### 6. Safety / Modifications
          - Adjust foot position (higher, lower, wider, narrower) to target different muscles
          - Never lock out your knees completely to protect the joint
          - Start with moderate weight to master proper form
