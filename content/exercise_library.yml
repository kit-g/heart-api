  "Ball Slams":
    category: Machine
    target: Full Body
    i18n:
      en:
        name: "Ball Slams"
        instructions: |
          ## Overview
          Ball slams are an explosive full-body exercise that primarily targets the core, shoulders, and lats. They also engage the entire posterior chain and cardiovascular system, using a medicine ball to build power, release stress, and develop explosive strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart holding a medicine ball
          - Hold the ball at chest height with both hands
          - Keep your chest up, core engaged, and knees slightly bent
          - Maintain good posture throughout

          ### 2. Movement
          1. Raise the ball overhead by reaching up tall
          2. Forcefully slam the ball straight down to the ground
          3. Use your entire body to generate power in the slam
          4. Bend your knees and hips as you slam
          5. Catch or pick up the ball as it bounces
          6. Immediately repeat for the desired number of explosive reps

          ### 3. Breathing
          - Inhale as you raise the ball overhead
          - Exhale forcefully as you slam the ball down

          ### 4. Tips
          - Use your entire body, not just your arms
          - Slam with maximum force and aggression
          - This exercise is excellent for building power and releasing stress
          - Maintain control of the movement despite the explosiveness
          - Use a ball designed for slamming

          ### 5. Common Mistakes
          - Using only arms instead of full body
          - Not slamming with full force
          - Letting the ball bounce uncontrolled
          - Standing too upright and not engaging the core
          - Using a ball that bounces too much
          - Poor posture during the movement

          ### 6. Safety / Modifications
          - Use a slam ball designed for this purpose
          - Start with a lighter ball to master the explosive movement
          - Perform on a surface that can handle the impact
          - Vary the tempo from explosive to controlled for different goals

    muscles:
      primary:
        groups:
          - core
          - shoulders
      secondary:
        groups:
          - arms
          - legs
  "Burpee":
    category: Reps Only
    target: Full Body
    i18n:
      en:
        name: "Burpee"
        instructions: |
          ## Overview
          The burpee is a full-body calisthenics exercise that primarily targets the chest, shoulders, core, and legs. It combines a push-up, squat, and jump into one continuous movement, building cardiovascular endurance, strength, and explosive power.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart
          - Keep your chest up and core engaged
          - Prepare to move quickly through the entire sequence

          ### 2. Movement
          1. Squat down and place your hands on the floor
          2. Jump or step your feet back into a high plank position
          3. Perform a push-up by lowering your chest to the floor
          4. Push back up to plank position
          5. Jump or step your feet back toward your hands
          6. Explosively jump up with arms overhead and repeat

          ### 3. Breathing
          - Breathe throughout the movement as needed
          - Exhale during the push-up and jump phases

          ### 4. Tips
          - Maintain a steady rhythm throughout the reps
          - Keep your core tight during the plank and push-up
          - Land softly from the jump
          - Modifications can eliminate the push-up or jump
          - Focus on form over speed when learning

          ### 5. Common Mistakes
          - Allowing hips to sag during the plank position
          - Not achieving chest-to-floor on the push-up
          - Landing too heavily from the jump
          - Rushing through reps and losing form
          - Not fully extending during the jump
          - Holding your breath throughout

          ### 6. Safety / Modifications
          - Step back instead of jumping to reduce impact
          - Eliminate the push-up for an easier version
          - Remove the jump at the end if needed
          - Advanced variation: add a pull-up or increase speed

    muscles:
      primary:
        groups:
          - chest
          - legs
      secondary:
        groups:
          - arms
          - core
          - shoulders
  "Jumping Jack":
    category: Reps Only
    target: Full Body
    i18n:
      en:
        name: "Jumping Jack"
        instructions: |
          ## Overview
          The jumping jack is a basic cardiovascular exercise that primarily targets the legs, core, and shoulders. It involves jumping while spreading the legs and raising the arms, building cardiovascular endurance, coordination, and serving as an effective warm-up movement.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet together and arms at your sides
          - Keep your chest up, core engaged, and eyes forward
          - Prepare to jump and move your limbs simultaneously

          ### 2. Movement
          1. Jump and spread your feet wider than shoulder-width
          2. Simultaneously raise your arms out to the sides and overhead
          3. Jump again and return feet together while lowering arms
          4. Continue alternating in a smooth, rhythmic motion
          5. Maintain good posture throughout
          6. Repeat for the desired number of reps or time

          ### 3. Breathing
          - Breathe rhythmically and steadily throughout
          - Inhale and exhale with each jump cycle

          ### 4. Tips
          - Land softly on the balls of your feet
          - Maintain a steady, controlled rhythm
          - This is an excellent warm-up exercise
          - Keep your core engaged throughout
          - Arms and legs should move in coordination

          ### 5. Common Mistakes
          - Landing too heavily on your heels
          - Not fully raising arms overhead
          - Moving too quickly and losing coordination
          - Landing with locked knees
          - Poor posture with rounded shoulders
          - Holding your breath

          ### 6. Safety / Modifications
          - Step side to side instead of jumping for low-impact version
          - Reduce range of motion if needed
          - Increase speed for greater intensity
          - Advanced variation: add a squat or reach variation

    muscles:
      primary:
        groups:
          - legs
      secondary:
        groups:
          - shoulders
  "Kettlebell Swing":
    category: Machine
    target: Full Body
    i18n:
      en:
        name: "Kettlebell Swing"
        instructions: |
          ## Overview
          The kettlebell swing is a dynamic full-body exercise that primarily targets the glutes, hamstrings, and core. It also engages the shoulders, back, and cardiovascular system, using an explosive hip hinge motion to develop power, endurance, and posterior chain strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet slightly wider than shoulder-width apart
          - Place a kettlebell on the floor about one foot in front of you
          - Hinge at your hips and grip the kettlebell with both hands
          - Keep your back flat, chest up, and core engaged
          - Pull the kettlebell slightly back between your legs

          ### 2. Movement
          1. Explosively drive your hips forward to swing the kettlebell up
          2. Let the kettlebell float to chest or shoulder height
          3. Keep your arms straight and let your hips do the work
          4. As the kettlebell descends, hinge at your hips again
          5. Let the kettlebell swing back between your legs
          6. Immediately drive hips forward again to continue the swing

          ### 3. Breathing
          - Exhale forcefully as you drive your hips forward
          - Inhale as the kettlebell descends

          ### 4. Tips
          - This is a hip hinge movement, not a squat
          - The power comes from your hips, not your arms
          - Keep your core tight throughout the movement
          - The kettlebell should feel weightless at the top
          - Maintain a neutral spine throughout

          ### 5. Common Mistakes
          - Squatting instead of hip hinging
          - Using arms to lift the kettlebell instead of hips
          - Hyperextending the back at the top of the swing
          - Not driving hips forward explosively
          - Letting the kettlebell drop too low between legs
          - Rounding the back during the hinge

          ### 6. Safety / Modifications
          - Start with a lighter kettlebell to master the hip hinge
          - Master the deadlift before attempting kettlebell swings
          - Stop if you experience lower back discomfort
          - Advanced variation: single-arm swings or American swings (overhead)

    muscles:
      primary:
        groups:
          - glutes
          - hamstrings
      secondary:
        groups:
          - back
          - core
          - shoulders
  "Kettlebell Turkish Get Up":
    category: Machine
    target: Full Body
    i18n:
      en:
        name: "Kettlebell Turkish Get Up"
        instructions: |
          ## Overview
          The Turkish get up is a complex full-body movement that targets the shoulders, core, and legs. It involves moving from lying down to standing while holding a kettlebell overhead, building shoulder stability, core strength, coordination, and full-body control.

          ## How to Perform
          ### 1. Starting Position
          - Lie on your back with a kettlebell beside your right shoulder
          - Grip the kettlebell with your right hand and press it overhead
          - Bend your right knee with foot flat on the floor
          - Extend your left arm at 45 degrees on the floor
          - Keep your eyes on the kettlebell throughout

          ### 2. Movement
          1. Roll onto your left elbow while keeping the kettlebell overhead
          2. Press up onto your left hand
          3. Lift your hips off the floor into a bridge position
          4. Sweep your left leg back under you into a kneeling position
          5. Stand up from the kneeling position
          6. Reverse all steps to return to the starting position, then repeat on the other side

          ### 3. Breathing
          - Breathe steadily throughout the multi-step movement
          - Never hold your breath during any phase

          ### 4. Tips
          - This is a highly technical movement requiring practice
          - Keep your eyes on the kettlebell at all times
          - Move slowly and deliberately through each phase
          - Each step should be distinct and controlled
          - Master with no weight before adding a kettlebell

          ### 5. Common Mistakes
          - Moving too quickly through the phases
          - Not keeping eyes on the kettlebell
          - Bending the arm holding the kettlebell
          - Poor sequencing of the movement steps
          - Attempting with too much weight too soon
          - Not maintaining shoulder stability throughout

          ### 6. Safety / Modifications
          - Learn the movement without weight first
          - Break down and practice each phase separately
          - Start with a very light kettlebell
          - Consider working with a qualified instructor initially

    muscles:
      primary:
        groups:
          - core
          - legs
          - shoulders
      secondary:
        groups:
          - back
          - glutes
  "Muscle Up":
    category: Weighted Body Weight
    target: Full Body
    i18n:
      en:
        name: "Muscle Up"
        instructions: |
          ## Overview
          The muscle up is an advanced bodyweight exercise that combines a pull-up with a dip. It primarily targets the lats, chest, shoulders, and triceps, requiring significant upper body strength, explosive power, and technical skill to transition from below to above the bar or rings.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar or gymnastic rings
          - Use a false grip (thumbs over the bar) for easier transition
          - Keep your body in a hollow position
          - Engage your core and prepare for an explosive pull
          - Generate a slight swing if needed for momentum

          ### 2. Movement
          1. Explosively pull yourself up toward the bar
          2. As you rise, lean back slightly and pull your chest over the bar
          3. Aggressively transition your chest and shoulders over the bar
          4. Press down to complete the movement in a supported position
          5. Lower yourself back down with control to the starting hang
          6. Repeat for the desired number of reps

          ### 3. Breathing
          - Take a breath before pulling
          - Exhale explosively during the pull and transition
          - Inhale during the descent

          ### 4. Tips
          - This is an advanced movement requiring significant strength
          - The transition phase is the most technical part
          - Explosive pulling power is essential
          - Practice pull-ups and dips separately first
          - Consider using resistance bands for assistance when learning

          ### 5. Common Mistakes
          - Not generating enough explosive pull momentum
          - Failing to lean back during the transition
          - Inadequate strength in pull-ups or dips
          - Poor timing of the transition phase
          - Attempting without sufficient prerequisite strength
          - Using too much swing or momentum

          ### 6. Safety / Modifications
          - Master strict pull-ups (15+) and dips (20+) first
          - Use resistance band assistance when learning
          - Practice the transition phase separately
          - Ring muscle ups are generally easier to learn than bar muscle ups

    muscles:
      primary:
        groups:
          - arms
          - back
          - chest
      secondary:
        groups:
          - core
          - shoulders
  "Squat Row (Band)":
    category: Reps Only
    target: Full Body
    i18n:
      en:
        name: "Squat Row (Band)"
        instructions: |
          ## Overview
          The band squat row is a compound full-body exercise that combines a squat with a rowing motion. It primarily targets the legs, back, and core, using a resistance band to coordinate lower and upper body movement while building strength and coordination.

          ## How to Perform
          ### 1. Starting Position
          - Anchor a resistance band at chest height
          - Stand facing the anchor point holding both ends of the band
          - Walk back until the band has tension with arms extended
          - Stand with feet shoulder-width apart
          - Keep your chest up and core engaged

          ### 2. Movement
          1. Simultaneously squat down and allow your arms to extend forward
          2. At the bottom of the squat, begin pulling the band toward your body
          3. Row the band to your chest as you drive up from the squat
          4. Finish standing with the band pulled to your chest
          5. Extend your arms as you lower into the next squat
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you squat down
          - Exhale as you row and stand up

          ### 4. Tips
          - Coordinate the squat and row movements smoothly
          - Keep constant tension on the band throughout
          - Engage your core to maintain stability
          - Focus on both the lower and upper body working together
          - This exercise builds full-body coordination

          ### 5. Common Mistakes
          - Not coordinating the squat and row together
          - Allowing the band tension to drop
          - Rounding the back during the squat
          - Using only arms to row without engaging back
          - Poor squat depth
          - Moving too quickly and losing control

          ### 6. Safety / Modifications
          - Adjust band resistance by moving closer or farther from anchor
          - Focus on form over speed or resistance
          - Perform squats and rows separately first to master each
          - Anchor the band securely before starting

    muscles:
      primary:
        groups:
          - back
        ids:
          - latissimus_dorsi_l
          - latissimus_dorsi_r
      secondary:
        groups:
          - arms
          - shoulders
  "Sumo Deadlift High Pull (Barbell)":
    category: Barbell
    target: Full Body
    i18n:
      en:
        name: "Sumo Deadlift High Pull (Barbell)"
        instructions: |
          ## Overview
          The sumo deadlift high pull is a compound full-body exercise that combines elements of Olympic lifting. It primarily targets the legs, glutes, traps, and shoulders, using a wide sumo stance with an explosive pull to build power and full-body coordination.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet wider than shoulder-width, toes pointed out
          - Position a barbell over mid-foot
          - Grip the bar with hands inside your legs, arms straight
          - Keep your back flat, chest up, and hips low
          - Engage your core and lats before pulling

          ### 2. Movement
          1. Drive explosively through your legs to lift the bar
          2. Extend your hips and knees powerfully as the bar rises
          3. Once fully extended, pull the bar upward with your elbows high
          4. Continue pulling until the bar reaches chest height
          5. Lower the bar back to the floor with control
          6. Reset and repeat for the desired number of explosive reps

          ### 3. Breathing
          - Inhale before starting the lift
          - Hold your breath through the pull
          - Exhale as you lower the bar

          ### 4. Tips
          - The wide stance emphasizes the legs and glutes
          - Explode through the lift with maximum power
          - Lead with your elbows during the high pull
          - This exercise combines strength and power development
          - Keep the bar close to your body throughout

          ### 5. Common Mistakes
          - Not opening hips fully before pulling
          - Pulling with arms before completing leg drive
          - Using too much weight and losing explosive speed
          - Rounding the back during the pull
          - Not keeping elbows high during the pull
          - Letting the bar drift away from the body

          ### 6. Safety / Modifications
          - Start with light weight to master the explosive movement
          - Ensure adequate hip mobility for the wide stance
          - Master the sumo deadlift before adding the high pull
          - This is an excellent exercise for CrossFit and functional training

    muscles:
      primary:
        groups:
          - adductors
          - glutes
      secondary:
        groups:
          - back
          - hamstrings
          - legs
  "Thruster (Barbell)":
    category: Barbell
    target: Full Body
    i18n:
      en:
        name: "Thruster (Barbell)"
        instructions: |
          ## Overview
          The barbell thruster is a compound full-body exercise that combines a front squat with an overhead press. It primarily targets the legs, shoulders, and core, using one continuous explosive movement to build power, endurance, and full-body strength.

          ## How to Perform
          ### 1. Starting Position
          - Hold a barbell in the front rack position at shoulder height
          - Stand with feet shoulder-width apart
          - Keep your elbows high and chest up
          - Engage your core throughout

          ### 2. Movement
          1. Descend into a front squat until thighs are parallel or below
          2. Explosively drive up from the squat
          3. Use the momentum to press the bar overhead as you stand
          4. Lock out the bar overhead with arms fully extended
          5. Lower the bar back to the front rack position
          6. Immediately descend into the next squat and repeat

          ### 3. Breathing
          - Inhale as you descend into the squat
          - Exhale explosively as you drive up and press

          ### 4. Tips
          - Use the leg drive to help press the bar overhead
          - Keep the movement fluid and continuous
          - Maintain an upright torso during the squat
          - This is one of the most demanding full-body exercises
          - Start light to master the coordination

          ### 5. Common Mistakes
          - Not using leg drive to assist the press
          - Pausing between the squat and press
          - Allowing the chest to collapse during the squat
          - Not achieving full lockout overhead
          - Poor front rack position with low elbows
          - Using too much weight before mastering form

          ### 6. Safety / Modifications
          - Master front squats and overhead presses separately first
          - Start with an empty bar or light dumbbells
          - This exercise is popular in CrossFit and metabolic conditioning
          - Reduce weight for higher rep endurance sets

    muscles:
      primary:
        groups:
          - legs
          - shoulders
      secondary:
        groups:
          - core
          - glutes
  "Thruster (Kettlebell)":
    category: Machine
    target: Full Body
    i18n:
      en:
        name: "Thruster (Kettlebell)"
        instructions: |
          ## Overview
          The kettlebell thruster is a compound full-body exercise that combines a squat with an overhead press. It primarily targets the legs, shoulders, and core, using kettlebells to allow for independent arm movement while building power, endurance, and coordination.

          ## How to Perform
          ### 1. Starting Position
          - Hold one or two kettlebells in the rack position at shoulder height
          - Stand with feet shoulder-width apart
          - Keep your elbows tucked and chest up
          - Engage your core throughout

          ### 2. Movement
          1. Descend into a squat until thighs are parallel or below
          2. Explosively drive up from the squat
          3. Use the momentum to press the kettlebells overhead as you stand
          4. Lock out the kettlebells overhead with arms fully extended
          5. Lower the kettlebells back to the rack position
          6. Immediately descend into the next squat and repeat

          ### 3. Breathing
          - Inhale as you descend into the squat
          - Exhale explosively as you drive up and press

          ### 4. Tips
          - Use the leg drive to help press the kettlebells overhead
          - Keep the movement fluid and continuous
          - Maintain an upright torso during the squat
          - Kettlebells allow for a more natural arm path than barbells
          - Start light to master the coordination

          ### 5. Common Mistakes
          - Not using leg drive to assist the press
          - Pausing between the squat and press
          - Allowing the chest to collapse during the squat
          - Not achieving full lockout overhead
          - Poor rack position with kettlebells
          - Using too much weight before mastering form

          ### 6. Safety / Modifications
          - Master goblet squats and kettlebell presses separately first
          - Start with one light kettlebell before using two
          - Perform with dumbbells if kettlebells are unavailable
          - This exercise is excellent for metabolic conditioning

    muscles:
      primary:
        groups:
          - legs
          - shoulders
      secondary:
        groups:
          - core
          - glutes
  "Aerobics":
    category: Duration
    target: Cardio
    i18n:
      en:
        name: "Aerobics"
        instructions: |
          ## Overview
          Aerobics is a form of cardiovascular exercise that combines rhythmic movements with music. It targets the cardiovascular system and various muscle groups, improving heart health, endurance, coordination, and overall fitness through sustained moderate to vigorous activity.

    muscles:
