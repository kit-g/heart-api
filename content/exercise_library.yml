        instructions: |
          ## Overview
          The cable reverse fly is an isolation exercise that primarily targets the rear deltoids and upper back. It also engages the rhomboids and middle trapezius, using cables to provide constant tension for improved shoulder balance, posture, and rear delt development.

          ## How to Perform
          ### 1. Starting Position
          - Stand centered between two cable pulleys set at shoulder height
          - Cross your arms in front and grip the opposite cable handle
          - Step back slightly to create tension with arms extended
          - Keep a slight bend in your elbows throughout
          - Stand with chest up and core engaged

          ### 2. Movement
          1. Pull both handles out to the sides in a wide arc
          2. Keep your elbows slightly bent throughout the movement
          3. Focus on squeezing your shoulder blades together
          4. Continue until your arms are extended to your sides
          5. Pause and squeeze your rear delts at the end
          6. Slowly return your arms to the crossed starting position and repeat

          ### 3. Breathing
          - Exhale as you pull the handles out to the sides
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on pulling with your rear delts and upper back
          - Keep your elbows slightly bent in a fixed position
          - Squeeze your shoulder blades together at the end
          - Maintain constant tension by not letting the weight stack touch
          - Keep your torso stable and avoid rotating

          ### 5. Common Mistakes
          - Straightening the arms completely during the movement
          - Using momentum or swinging the weight
          - Not squeezing the shoulder blades together
          - Rotating the torso instead of keeping it stable
          - Letting the weight stack rest between reps
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with light weight to master the movement pattern
          - Adjust cable height for different angles of emphasis
          - Perform one arm at a time for unilateral focus
          - If you experience shoulder discomfort, reduce weight or range of motion

