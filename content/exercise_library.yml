  "Step-Back Lunge":
    category: Dumbbell
    target: Legs
    i18n:
      en:
        name: "Step-Back Lunge"
        instructions: |
          ## Overview
          The step-back lunge is a unilateral lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core and stabilizers, using a backward stepping motion that reduces knee stress compared to forward lunges while building single-leg strength and balance.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding dumbbells at your sides
          - Keep your chest up, core engaged, and eyes forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Step backward with one leg into a long stride
          2. Lower your hips by bending both knees
          3. Continue until your front thigh is parallel to the floor
          4. Keep your front knee aligned over your ankle
          5. Push through your front heel to return to standing position
          6. Repeat on the same leg or alternate legs for desired reps

          ### 3. Breathing
          - Inhale as you step back and lower down
          - Exhale as you push back to standing

          ### 4. Tips
          - Keep your torso upright throughout the movement
          - The backward step is often easier on the knees than forward lunges
          - Push through your front heel to return to standing
          - Take a long enough stride to maintain balance
          - Let the dumbbells hang naturally at your sides

          ### 5. Common Mistakes
          - Leaning too far forward during the lunge
          - Allowing the front knee to cave inward
          - Taking too short a stride backward
          - Not achieving adequate depth
          - Letting the back knee slam into the floor
          - Using momentum instead of controlled movement

          ### 6. Safety / Modifications
          - Start with bodyweight to master the backward stepping motion
          - This variation is often better for those with knee concerns
          - Hold one dumbbell to work on single-side stability
          - Advanced variation: add a knee drive at the top or increase dumbbell weight

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Lying Leg Curl (Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Lying Leg Curl (Machine)"
        instructions: |
          ## Overview
          The lying leg curl is an isolation exercise that primarily targets the hamstrings. It also engages the calves, using a guided machine to isolate and strengthen the muscles on the back of the thigh through knee flexion.

          ## How to Perform
          ### 1. Starting Position
          - Lie face down on the leg curl machine
          - Position the pad against the back of your lower legs, just above your ankles
          - Align your knees with the machine's pivot point
          - Grip the handles for stability
          - Keep your hips pressed down against the bench

          ### 2. Movement
          1. Curl your legs up by bending your knees
          2. Continue until the pad nearly touches your glutes
          3. Pause and squeeze your hamstrings at full flexion
          4. Slowly lower the weight back to the starting position with control
          5. Stop just before the weight stack touches to maintain tension
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you curl your legs up
          - Inhale as you lower the weight back down

          ### 4. Tips
          - Keep your hips pressed firmly against the bench
          - Focus on squeezing your hamstrings at full flexion
          - Control both the curling and lowering phases
          - Maintain constant tension by not letting the weight stack rest
          - Avoid using momentum or swinging your legs

          ### 5. Common Mistakes
          - Lifting your hips off the bench during the curl
          - Using momentum or swinging the weight up
          - Not achieving full range of motion
          - Letting the weight stack rest between reps
          - Moving too quickly through the repetitions
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Adjust pad position to ensure proper knee alignment
          - Start with light weight to establish proper form
          - Point your toes forward, inward, or outward to emphasize different hamstring areas
          - Advanced variation: perform one leg at a time or add a pause at full flexion

    muscles:
      primary:
        groups:
          - hamstrings
      secondary: {}
  "Mountain Climber":
    category: Reps Only
    target: Legs
    i18n:
      en:
        name: "Mountain Climber"
        instructions: |
          ## Overview
          The mountain climber is a dynamic full-body exercise that primarily targets the core, hip flexors, and shoulders. It also engages the quadriceps and cardiovascular system, using a running motion from a plank position to build endurance, coordination, and core stability.

          ## How to Perform
          ### 1. Starting Position
          - Begin in a high plank position with hands directly under shoulders
          - Keep your body in a straight line from head to heels
          - Engage your core and keep your hips level
          - Position your feet hip-width apart

          ### 2. Movement
          1. Drive one knee toward your chest in a running motion
          2. Quickly switch legs by extending the bent leg back and bringing the other knee forward
          3. Continue alternating legs in a rhythmic running motion
          4. Keep your core tight and hips level throughout
          5. Maintain a steady pace or increase speed for intensity
          6. Continue for the desired number of reps or time

          ### 3. Breathing
          - Breathe rhythmically and steadily throughout the movement
          - Avoid holding your breath

          ### 4. Tips
          - Keep your core engaged to prevent hips from sagging or piking
          - Maintain a plank position throughout the movement
          - Focus on bringing knees toward chest, not just moving legs
          - Start slowly to master form before increasing speed
          - Keep your hands firmly planted and shoulders stable

          ### 5. Common Mistakes
          - Allowing the hips to sag or pike upward
          - Bouncing the hips up and down with each rep
          - Not bringing knees far enough toward the chest
          - Letting the shoulders round forward
          - Moving too quickly and losing form
          - Holding your breath during the exercise

          ### 6. Safety / Modifications
          - Start with slow mountain climbers to master form
          - Elevate your hands on a bench for an easier variation
          - Perform slow and controlled reps for increased core engagement
          - Advanced variation: add a twist by bringing knee to opposite elbow or increase speed

    muscles:
      primary:
        groups:
          - legs
      secondary:
        groups:
          - core
          - glutes
  "Pistol Squat":
    category: Weighted Body Weight
    target: Legs
    i18n:
      en:
        name: "Pistol Squat"
        instructions: |
          ## Overview
          The pistol squat is an advanced unilateral lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core, hip flexors, and balance stabilizers, using a single-leg squat to full depth to build exceptional leg strength, mobility, and balance.

          ## How to Perform
          ### 1. Starting Position
          - Stand on one leg with the other leg extended straight in front of you
          - Keep your chest up, core engaged, and arms extended forward for balance
          - Maintain good posture and focus on a point ahead

          ### 2. Movement
          1. Lower yourself by bending your standing knee and hip
          2. Keep your extended leg straight and parallel to the floor
          3. Continue descending as low as possible while maintaining balance
          4. Keep your heel on the ground and chest up
          5. Drive through your heel to return to standing position
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Inhale as you lower yourself down
          - Exhale as you drive back up to standing

          ### 4. Tips
          - This exercise requires significant strength, mobility, and balance
          - Keep your chest up and core tight throughout
          - Your extended leg should remain straight and off the ground
          - Focus on controlled movement in both directions
          - Use your arms for counterbalance

          ### 5. Common Mistakes
          - Not achieving adequate depth due to mobility limitations
          - Allowing the knee to cave inward
          - Losing balance and putting the extended leg down
          - Rounding the back or leaning too far forward
          - Not keeping the extended leg straight
          - Attempting pistol squats before building adequate strength

          ### 6. Safety / Modifications
          - Build up to pistol squats with assisted variations first
          - Hold onto a support for balance assistance
          - Perform box pistol squats (sitting back to a box)
          - Start with elevated pistol squats (standing on a step)
          - If you experience knee discomfort, improve mobility before progressing

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Romanian Deadlift (Dumbbell)":
    category: Dumbbell
    target: Legs
    i18n:
      en:
        name: "Romanian Deadlift (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell Romanian deadlift is a hip hinge exercise that primarily targets the hamstrings, glutes, and erector spinae. It also engages the lats and traps as stabilizers, using dumbbells for independent arm movement and a more natural hand position while emphasizing the eccentric phase.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a dumbbell in each hand
          - Position dumbbells in front of your thighs with palms facing your body
          - Stand upright with chest up, shoulders back, and core engaged
          - Maintain a slight bend in your knees throughout

          ### 2. Movement
          1. Hinge at the hips by pushing them back and lowering the dumbbells
          2. Keep your back flat and dumbbells close to your legs
          3. Lower until you feel a stretch in your hamstrings, typically mid-shin
          4. Maintain a slight knee bend throughout the movement
          5. Drive your hips forward to return to the starting position
          6. Squeeze your glutes at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower the dumbbells
          - Exhale as you drive your hips forward to stand up

          ### 4. Tips
          - Focus on the hip hinge, not squatting or bending your knees
          - Keep your back flat and chest up throughout
          - Push your hips back as far as possible
          - Keep the dumbbells close to your legs throughout
          - Feel the stretch in your hamstrings at the bottom

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Bending the knees too much, turning it into a squat
          - Not pushing the hips back far enough
          - Lowering the dumbbells too far beyond the point of hamstring stretch
          - Using too much weight and compromising form
          - Looking up instead of maintaining neutral neck position

          ### 6. Safety / Modifications
          - Start with light dumbbells to master the hip hinge pattern
          - Keep a slight bend in your knees to protect your hamstrings
          - The dumbbell variation allows for a more natural grip than barbells
          - If you experience lower back discomfort, reduce weight and ensure proper form

    muscles:
      primary:
        groups:
          - hamstrings
      secondary:
        groups:
          - back
          - glutes
  "Seated Calf Raise (Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Seated Calf Raise (Machine)"
        instructions: |
          ## Overview
          The seated calf raise is an isolation exercise that primarily targets the soleus muscle of the calf. It also engages the gastrocnemius, using a seated position with bent knees to emphasize the soleus for complete calf development.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the seated calf raise machine with the pad resting on your lower thighs
          - Position the balls of your feet on the platform with heels hanging off
          - Adjust the pad height so it rests comfortably on your thighs
          - Release the safety lever
          - Keep your knees bent at 90 degrees throughout

          ### 2. Movement
          1. Lower your heels by flexing your ankles as far as possible
          2. Allow a full stretch in your calves at the bottom
          3. Pause briefly at the bottom stretch position
          4. Press through the balls of your feet to raise your heels as high as possible
          5. Squeeze your calves hard at the top
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your heels
          - Exhale as you press up onto your toes

          ### 4. Tips
          - Keep your knees stationary and bent throughout
          - The seated position emphasizes the soleus muscle
          - Achieve full range of motion from deep stretch to high contraction
          - Focus on squeezing your calves at the top
          - Control the weight throughout both phases

          ### 5. Common Mistakes
          - Not achieving full range of motion at top or bottom
          - Bouncing at the bottom instead of controlled stretch
          - Using too much weight and compromising form
          - Moving too quickly through the repetitions
          - Not squeezing at the top contraction
          - Extending or moving the knees during the movement

          ### 6. Safety / Modifications
          - Adjust pad height for comfort and proper positioning
          - Vary foot position (neutral, toes in, toes out) for complete calf development
          - Combine with standing calf raises for comprehensive calf training
          - Advanced variation: pause for 2-3 seconds at peak contraction

    muscles:
      primary:
        ids:
          - gastrocnemius_l
          - gastrocnemius_r
      secondary: {}
  "Seated Calf Raise (Plate Loaded)":
    category: Machine
