        instructions: |
          ## Overview
          The cable crossover is an isolation exercise that primarily targets the pectoralis major, particularly the inner chest. It also engages the front deltoids as stabilizers, using cables to provide constant tension throughout a wide arc of motion.

          ## How to Perform
          ### 1. Starting Position
          - Stand centered between two high cable pulleys
