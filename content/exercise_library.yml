  "Snatch (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Snatch (Barbell)"
        instructions: |
          ## Overview
          The snatch is a complete Olympic weightlifting movement that targets the entire body. It requires moving the barbell from floor to locked out overhead in one continuous explosive motion, demanding maximum power, speed, mobility, and technical precision.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, barbell over mid-foot
          - Grip the bar with a wide snatch grip (arms almost at collars)
          - Hinge at hips and bend knees to reach the bar
          - Keep your back flat, chest up, and shoulders over the bar
          - Arms should be straight and relaxed

          ### 2. Movement
          1. Drive explosively through your legs to lift the bar off the floor
          2. Keep the bar close as it travels up your legs
          3. Extend your hips and knees powerfully at mid-thigh
          4. Pull yourself under the bar as it rises
          5. Catch the bar overhead in a full squat with arms locked
          6. Stand up fully with the bar overhead to complete the lift

          ### 3. Breathing
          - Take a deep breath before pulling
          - Hold your breath through the pull, catch, and recovery
          - Exhale after standing with the bar overhead

          ### 4. Tips
          - This is the most technical lift in weightlifting
          - The wide grip shortens the pulling distance
          - Speed and technique matter more than strength
          - Every phase must be perfect for a successful lift
          - Requires extensive coaching and practice

          ### 5. Common Mistakes
          - Using incorrect grip width
          - Pulling with arms before completing leg drive
          - Pressing the bar out instead of pulling under
          - Poor receiving position and balance
          - Inadequate mobility for deep overhead squat
          - Attempting without proper technical foundation

          ### 6. Safety / Modifications
          - Requires extensive coaching from qualified Olympic lifting instructor
          - Master all component parts before attempting full snatches
          - Use bumper plates and proper lifting platform
          - This lift demands years of practice to master

