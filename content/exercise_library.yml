          - Keep your upper arms stationary and perpendicular to the floor throughout
          - Allow your arms to fully extend at the bottom for maximum stretch
          - Avoid swinging or using momentum to lift the weight
          - Keep your back pressed firmly against the bench
          - Focus on the stretch at the bottom and squeeze at the top

          ### 5. Common Mistakes
          - Allowing the elbows to drift forward during the curl
          - Not achieving full arm extension at the bottom
          - Lifting the shoulders off the bench
          - Using momentum or swinging the weights
