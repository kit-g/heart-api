          - Loop a resistance band across your upper back
          - Hold one end of the band in each hand
          - Begin in a high plank position with hands slightly wider than shoulder-width
          - Position the band under your palms on the floor
          - Keep your body in a straight line from head to heels

          ### 2. Movement
          1. Lower your body by bending your elbows against the band resistance
          2. Keep your elbows at about a 45-degree angle from your body
          3. Continue lowering until your chest nearly touches the floor
          4. Pause briefly at the bottom
          5. Press through your palms against the band resistance to return to starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up to the starting position

          ### 4. Tips
          - The band provides more resistance at the top of the movement
          - Maintain a straight body line from head to heels throughout
          - Keep your core and glutes engaged to prevent sagging
          - Focus on controlled movement in both directions
          - Adjust band thickness to modify resistance level

          ### 5. Common Mistakes
          - Allowing the hips to sag or pike upward
          - Flaring the elbows out excessively
          - Not achieving full range of motion
          - Letting the band slip out of position
          - Using momentum instead of controlled movement
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the movement
          - Perform knee push ups with the band if needed
          - Adjust band tension by changing hand position or band thickness
          - Advanced variation: use a heavier resistance band or add a pause at the bottom

