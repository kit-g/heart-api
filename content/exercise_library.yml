          - Start with light dumbbells to master the controlled lowering technique
          - Perform one arm at a time for unilateral focus if needed
          - Advanced variation: lower the dumbbells beside your head for increased stretch
          - Use a neutral or pronated grip based on comfort

  "Triceps Dip":
    category: Weighted Body Weight
    target: Arms
    i18n:
      en:
        name: "Triceps Dip"
        instructions: |
          ## Overview
          The triceps dip is a bodyweight exercise that primarily targets the triceps. It also engages the chest and front shoulders as secondary muscles, making it an effective compound movement for building upper-body pressing strength and triceps mass.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself on parallel dip bars with arms fully extended
          - Grip the bars firmly with hands slightly wider than shoulder-width
          - Keep your body upright with a slight forward lean
          - Cross your ankles behind you or keep legs straight
          - Engage your core and keep your shoulders pressed down

          ### 2. Movement
          1. Lower your body by bending your elbows until they reach about 90 degrees
          2. Keep your elbows pointing straight back, not flaring excessively
          3. Maintain an upright torso to emphasize triceps over chest
          4. Pause briefly at the bottom of the movement
          5. Press through your palms to extend your arms and return to the starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up to the starting position

          ### 4. Tips
          - Keep your body relatively upright to maximize triceps engagement
          - Keep your elbows tucked close to your body throughout
          - Focus on using your triceps to lift yourself rather than momentum
          - Avoid dropping too low and putting excessive strain on the shoulders
          - Maintain control throughout the entire range of motion

          ### 5. Common Mistakes
          - Leaning too far forward, which shifts emphasis to the chest
          - Allowing the elbows to flare out excessively
          - Dropping too low and straining the shoulders
          - Using momentum or bouncing at the bottom
          - Not achieving full elbow extension at the top
          - Hunching the shoulders forward

          ### 6. Safety / Modifications
          - Use an assisted dip machine or resistance band for support if needed
          - Reduce range of motion if you experience shoulder discomfort
          - Advanced variation: add weight using a dip belt or weight vest
          - Progress gradually to avoid shoulder strain

  "Triceps Dip (Assisted)":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Triceps Dip (Assisted)"
        instructions: |
          ## Overview
          The assisted triceps dip is a machine-based exercise that primarily targets the triceps with support. It also engages the chest and front shoulders, using counterbalance assistance to make the dip movement more accessible while building strength toward unassisted dips.

          ## How to Perform
          ### 1. Starting Position
          - Set the weight on the assisted dip machine (more weight = more assistance)
          - Step onto the platform and grip the handles
          - Position your knees or feet on the assistance pad
          - Start with arms fully extended and body upright
          - Engage your core and keep your shoulders pressed down

          ### 2. Movement
          1. Lower your body by bending your elbows until they reach about 90 degrees
          2. Keep your elbows pointing back and body relatively upright
          3. Maintain control as the assistance pad supports your weight
          4. Pause briefly at the bottom of the movement
          5. Press through your palms to extend your arms and return to the starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up to the starting position

          ### 4. Tips
          - Keep your body relatively upright to maximize triceps engagement
          - Gradually reduce assistance weight as you build strength
          - Focus on controlled movement throughout the range of motion
          - Keep your elbows relatively close to your body
          - Avoid relying too heavily on the assistance

          ### 5. Common Mistakes
          - Using too much assistance and not challenging yourself
          - Leaning too far forward, shifting emphasis to the chest
          - Allowing the elbows to flare out excessively
          - Using momentum instead of controlled movement
          - Not achieving full range of motion
          - Hunching the shoulders forward

          ### 6. Safety / Modifications
          - Start with higher assistance and gradually decrease as you get stronger
          - Reduce range of motion if you experience shoulder discomfort
          - Progress toward unassisted dips by consistently reducing assistance weight
          - Focus on form over decreasing assistance too quickly

  "Triceps Extension":
    category: Barbell
    target: Arms
    i18n:
      en:
        name: "Triceps Extension"
        instructions: |
          ## Overview
          The barbell triceps extension is an isolation exercise that primarily targets all three heads of the triceps. It also engages the shoulders and core as stabilizers, using an overhead position to maximize stretch and contraction of the triceps throughout the movement.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart or sit on a bench with back support
          - Hold a barbell with a narrow overhand grip
          - Press the barbell overhead until your arms are fully extended
          - Keep your elbows pointing forward and close to your head
          - Engage your core for stability

          ### 2. Movement
          1. Lower the barbell behind your head by bending your elbows
          2. Keep your upper arms stationary and vertical throughout
          3. Lower until you feel a deep stretch in your triceps
          4. Pause briefly at the bottom position
          5. Extend your elbows to press the barbell back to the starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower the barbell behind your head
          - Exhale as you press the barbell back up

          ### 4. Tips
          - Keep your upper arms stationary and vertical throughout
          - Keep your elbows as close together as comfortable
          - Avoid arching your lower back during the movement
          - Focus on the stretch at the bottom and squeeze at the top
          - Control the weight throughout the entire range of motion

          ### 5. Common Mistakes
          - Allowing the elbows to flare out excessively
          - Moving the upper arms instead of keeping them stationary
          - Arching the lower back excessively
          - Using too much weight and compromising form
          - Not achieving full range of motion
          - Leaning forward or backward during the movement

          ### 6. Safety / Modifications
          - Use an EZ curl bar if you experience wrist or elbow discomfort
          - Start with light weight to master the overhead position
          - Perform seated with back support for added stability
          - Advanced variation: perform standing to engage more core muscles

  "Triceps Extension (Barbell)":
    category: Barbell
    target: Arms
    i18n:
      en:
        name: "Triceps Extension (Barbell)"
        instructions: |
          ## Overview
          The barbell triceps extension is an isolation exercise that primarily targets all three heads of the triceps. It also engages the shoulders and core as stabilizers, using an overhead position to maximize stretch and contraction of the triceps throughout the movement.

          ## How to Perform
