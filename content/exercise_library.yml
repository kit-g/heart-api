  "Strict Military Press (Barbell)":
    category: Barbell
    target: Shoulders
    i18n:
      en:
        name: "Strict Military Press (Barbell)"
        instructions: |
          ## Overview
          The strict military press is a compound upper body exercise that primarily targets all three heads of the deltoids. It also engages the triceps, upper chest, and core, using a strict standing position with no leg drive to build pure shoulder pressing strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand at attention with feet together or very close, barbell at upper chest
          - Grip the bar slightly wider than shoulder-width with palms facing forward
          - Unrack the bar and hold it at shoulder level
          - Keep your body rigid with chest up, core tight, and glutes engaged
          - Maintain military posture throughout

          ### 2. Movement
          1. Press the bar straight up overhead by extending your arms
          2. Keep your body completely rigid with no leg drive or momentum
          3. Continue pressing until your arms are fully extended overhead
          4. Lock out your elbows at the top with the bar over mid-foot
          5. Lower the bar back to shoulder level with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Take a breath and brace your core before pressing
          - Hold your breath during the press
          - Exhale at the top or as you lower the bar

          ### 4. Tips
          - Maintain strict military posture with no leg drive whatsoever
          - Keep your entire body rigid from feet to shoulders
          - Press the bar in a straight vertical line
          - The strict form builds pure shoulder strength
          - This variation requires lighter weight than standard overhead press

          ### 5. Common Mistakes
          - Using any leg drive or momentum
          - Arching the lower back excessively during the press
          - Pressing the bar forward instead of straight up
          - Not maintaining rigid body position
          - Widening stance beyond military attention
          - Using too much weight before mastering strict form

          ### 6. Safety / Modifications
          - Start with significantly lighter weight than standard overhead press
          - Master the standard overhead press before attempting strict military press
          - Use a power rack with safety pins when training alone
          - This is an advanced variation emphasizing strict form and control

