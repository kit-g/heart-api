          - Step forward into a staggered stance for stability
          - Lean forward slightly from the hips with chest up
          - Keep a slight bend in your elbows throughout

          ### 2. Movement
          1. Bring both handles down and together in front of your chest
          2. Keep your elbows slightly bent in a hugging motion
          3. Continue until your hands meet or cross at chest level
          4. Squeeze your chest hard at the peak contraction
          5. Slowly return your arms to the starting position with control
          6. Stop before losing tension on the cables, then repeat

          ### 3. Breathing
          - Exhale as you bring the handles together
          - Inhale as you return to the starting position

