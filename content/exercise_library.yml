  "Pull Up":
    category: Weighted Body Weight
    target: Back
    i18n:
      en:
        name: "Pull Up"
        instructions: |
          ## Overview
          The pull up is a bodyweight pulling exercise that primarily targets the latissimus dorsi. It also engages the rhomboids, middle trapezius, biceps, and core, making it one of the most effective upper body exercises for building back width and pulling strength.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with an overhand grip, hands slightly wider than shoulder-width
          - Allow your body to hang fully extended with arms straight
          - Engage your core and keep your shoulders pulled down
          - Cross your ankles or keep legs straight
          - Avoid excessive swinging

          ### 2. Movement
          1. Pull yourself up by driving your elbows down and back
          2. Lead with your chest and keep your shoulders back
          3. Continue pulling until your chin clears the bar
          4. Keep your core tight throughout the movement
          5. Pause briefly at the top
          6. Slowly lower yourself back to the starting position with full arm extension

          ### 3. Breathing
          - Exhale as you pull yourself up
          - Inhale as you lower yourself back down

          ### 4. Tips
          - Think about pulling your elbows down rather than pulling your chin up
          - Keep your shoulders engaged and avoid letting them shrug
          - Control the descent for maximum muscle engagement
          - Aim for full range of motion from dead hang to chin over bar
          - Keep your core tight to minimize swinging

          ### 5. Common Mistakes
          - Using momentum or kipping instead of strict form
          - Not achieving full range of motion at top or bottom
          - Allowing the shoulders to shrug up toward the ears
          - Swinging excessively during the movement
          - Not fully extending the arms at the bottom
          - Pulling with arms only instead of engaging the back

          ### 6. Safety / Modifications
          - Use an assisted pull-up machine or resistance band for support
          - Perform negative pull-ups (jump to the top and lower slowly) to build strength
          - Advanced variation: add weight using a dip belt or weight vest
          - Progress gradually to avoid shoulder strain

    muscles:
      primary:
        ids:
          - latissimus_dorsi_l
          - latissimus_dorsi_r
      secondary:
        groups:
          - arms
          - shoulders
  "Pull Up (Assisted)":
    category: Assisted Body Weight
    target: Back
    i18n:
      en:
        name: "Pull Up (Assisted)"
        instructions: |
          ## Overview
          The assisted pull up is a machine-based pulling exercise that primarily targets the latissimus dorsi with support. It also engages the rhomboids, middle trapezius, and biceps, using counterbalance assistance to make the pull up movement more accessible while building strength toward unassisted pull ups.

          ## How to Perform
          ### 1. Starting Position
          - Set the weight on the assisted pull up machine (more weight = more assistance)
          - Grip the handles with an overhand grip, hands slightly wider than shoulder-width
          - Position your knees or feet on the assistance pad
          - Hang with arms fully extended and shoulders engaged
          - Keep your core tight and body stable

          ### 2. Movement
          1. Pull yourself up by driving your elbows down and back
          2. Continue until your chin clears the handles or bar
          3. Keep your core engaged and movement controlled
          4. Pause briefly at the top of the movement
          5. Slowly lower yourself back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull yourself up
          - Inhale as you lower yourself back down

          ### 4. Tips
          - Gradually reduce assistance weight as you build strength
          - Focus on pulling with your back muscles, not just your arms
          - Keep your shoulders down and back throughout
          - Control both the pulling and lowering phases
          - Avoid relying too heavily on the assistance

          ### 5. Common Mistakes
          - Using too much assistance and not challenging yourself
          - Not achieving full range of motion
          - Allowing the shoulders to shrug up
          - Using momentum instead of controlled movement
          - Not gradually reducing assistance weight over time
          - Pulling with arms only instead of engaging the back

          ### 6. Safety / Modifications
          - Start with higher assistance and gradually decrease as you get stronger
          - Focus on form over reducing assistance too quickly
          - Progress toward band-assisted or negative pull ups before attempting unassisted
          - Perform lat pulldowns as an alternative to build foundational strength

    muscles:
      primary:
        ids:
          - latissimus_dorsi_l
          - latissimus_dorsi_r
      secondary:
        groups:
          - arms
          - shoulders
  "Pull Up (Band)":
    category: Assisted Body Weight
    target: Back
    i18n:
      en:
        name: "Pull Up (Band)"
        instructions: |
          ## Overview
          The band-assisted pull up is a modified pulling exercise that primarily targets the latissimus dorsi with elastic support. It also engages the rhomboids, middle trapezius, and biceps, using resistance bands to provide variable assistance throughout the movement while building strength toward unassisted pull ups.

          ## How to Perform
          ### 1. Starting Position
          - Loop a resistance band over a pull-up bar
          - Pull one end through the other to secure it to the bar
          - Grip the bar with an overhand grip, hands slightly wider than shoulder-width
          - Place one or both knees or feet in the bottom loop of the band
          - Hang with arms fully extended and shoulders engaged

          ### 2. Movement
          1. Pull yourself up by driving your elbows down and back
          2. The band will provide more assistance at the bottom and less at the top
          3. Continue until your chin clears the bar
          4. Keep your core engaged and movement controlled
          5. Slowly lower yourself back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull yourself up
          - Inhale as you lower yourself back down

          ### 4. Tips
          - Start with a thicker band for more assistance
          - Gradually progress to thinner bands as you build strength
          - Focus on pulling with your back muscles, not just your arms
          - Keep your shoulders down and back throughout
          - Control both the pulling and lowering phases

          ### 5. Common Mistakes
          - Using a band with too much assistance
          - Not achieving full range of motion
          - Allowing the shoulders to shrug up
          - Using momentum or kipping motion
          - Not gradually progressing to lighter bands
          - Pulling with arms only instead of engaging the back

          ### 6. Safety / Modifications
          - Start with a heavy resistance band and progress to lighter ones
          - Place both feet in the band for maximum assistance
          - Use one foot for moderate assistance as you get stronger
          - Combine band-assisted pull ups with negative pull ups for faster progress

