          2. Keep your upper arms stationary and angled slightly back
          3. Lower until your forearms are just past parallel to the floor
          4. Pause briefly at the bottom stretch position
          5. Extend your elbows to press the dumbbells back to the starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower the dumbbells toward your forehead
          - Exhale as you press the dumbbells back up

          ### 4. Tips
          - Keep your upper arms completely stationary throughout
          - Lower the dumbbells under control to avoid hitting your head
          - Focus on keeping tension on your triceps throughout
          - Allow your wrists to rotate naturally if comfortable
          - Keep your elbows relatively close together

          ### 5. Common Mistakes
