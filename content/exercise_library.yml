          - Begin in a high plank position then lower your knees to the floor
          - Position your hands slightly wider than shoulder-width apart
          - Keep your body in a straight line from head to knees
          - Cross your ankles behind you or keep them down
          - Engage your core throughout

          ### 2. Movement
          1. Lower your body by bending your elbows
          2. Keep your elbows at about a 45-degree angle from your body
          3. Continue lowering until your chest nearly touches the floor
          4. Pause briefly at the bottom
          5. Press through your palms to extend your arms and return to starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up to the starting position

          ### 4. Tips
          - Maintain a straight line from head to knees throughout
          - Keep your core engaged to prevent sagging
          - Focus on controlled movement in both directions
          - Keep your neck neutral, looking slightly ahead of your hands
          - Achieve full range of motion from chest near floor to arms fully extended

          ### 5. Common Mistakes
          - Allowing the hips to sag downward
          - Flaring the elbows out excessively
          - Not achieving full range of motion
          - Letting the head drop or looking down
          - Using momentum instead of controlled movement
          - Positioning knees too far forward, reducing difficulty too much

          ### 6. Safety / Modifications
          - Use a mat or padding under your knees for comfort
          - Elevate your hands on a bench for an even easier variation
          - Progress to standard push ups once you can perform 15-20 controlled reps
          - Try different hand positions for variety once you build strength

    muscles:
      primary:
        ids:
          - pectoralis_major_l
          - pectoralis_major_r
      secondary:
        groups:
          - arms
          - core
          - shoulders
  "Box Jump":
    category: Reps Only
    target: Legs
    i18n:
      en:
        name: "Box Jump"
        instructions: |
          ## Overview
          The box jump is a plyometric exercise that primarily targets the quadriceps, glutes, and calves. It also engages the hamstrings and core, using explosive jumping to build lower body power, athleticism, and coordination.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing a sturdy box or platform with feet hip-width apart
          - Position yourself an arm's length away from the box
          - Keep your chest up and core engaged
          - Bend your knees slightly and swing your arms back
          - Prepare for an explosive jump

          ### 2. Movement
          1. Swing your arms forward and explosively jump onto the box
          2. Land softly on the box with both feet simultaneously
          3. Absorb the impact by landing in a partial squat position
          4. Stand up fully on top of the box
          5. Step down carefully one foot at a time
          6. Reset and repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale during the preparatory phase
          - Exhale explosively as you jump

          ### 4. Tips
          - Focus on explosive power from your legs, not just height
          - Land softly with bent knees to absorb impact
          - Start with a lower box height and progress gradually
          - Keep your chest up and eyes on the box throughout
          - Step down rather than jumping down to reduce joint stress

          ### 5. Common Mistakes
          - Landing with straight legs, increasing injury risk
          - Jumping down instead of stepping down
          - Using a box that's too high for your current ability
          - Not fully extending at the top of the box
          - Landing with feet in different positions
          - Rushing reps without proper reset between jumps

          ### 6. Safety / Modifications
          - Start with a low, stable box (12-18 inches) to master technique
          - Ensure the box is stable and won't slip or tip
          - Progress to higher boxes only after mastering lower heights
          - Advanced variation: add a weighted vest or perform single-leg box jumps

    muscles:
      primary:
        groups:
          - legs
      secondary:
        groups:
          - core
          - glutes
  "Box Squat (Barbell)":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Box Squat (Barbell)"
        instructions: |
          ## Overview
          The barbell box squat is a compound lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core and lower back, using a box to ensure consistent depth and teach proper squat mechanics while allowing for heavier loads.

          ## How to Perform
          ### 1. Starting Position
          - Position a box or bench behind you at appropriate height (slightly below parallel)
          - Stand with feet shoulder-width apart, barbell across your upper back
          - Grip the bar with hands slightly wider than shoulder-width
          - Keep your chest up, core engaged, and eyes forward
          - Maintain a neutral spine throughout

          ### 2. Movement
          1. Initiate the squat by pushing your hips back and bending your knees
          2. Lower yourself until you sit back onto the box
          3. Pause briefly on the box while maintaining tension
          4. Drive through your heels to stand back up explosively
          5. Extend your hips and knees to return to the starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale deeply before descending
          - Hold your breath during the descent and pause
          - Exhale as you drive back up

          ### 4. Tips
          - Sit back onto the box rather than dropping down
          - Maintain tension in your muscles even when sitting on the box
          - Drive through your heels when standing back up
          - Keep your chest up and core tight throughout
          - The box teaches proper depth and hip hinge mechanics

          ### 5. Common Mistakes
          - Relaxing completely when sitting on the box
          - Using a box that's too high or too low
          - Allowing the knees to cave inward
          - Leaning too far forward during descent
          - Not driving through the heels when standing
          - Bouncing off the box instead of pausing

          ### 6. Safety / Modifications
          - Start with a higher box and gradually lower it as mobility improves
          - Use a safety rack or spotter when lifting heavy weights
          - Perform without weight initially to master the movement pattern
          - Advanced variation: add chains or bands for accommodating resistance

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Bulgarian Split Squat":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Bulgarian Split Squat"
        instructions: |
          ## Overview
          The Bulgarian split squat is a unilateral lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core and hip stabilizers, using an elevated rear foot position to increase range of motion and challenge balance while building single-leg strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing away from a bench or elevated surface
          - Place the top of your rear foot on the bench behind you
          - Position your front foot far enough forward to allow a deep lunge
          - Keep your chest up, core engaged, and torso upright
          - Hold dumbbells at your sides or a barbell across your upper back

          ### 2. Movement
          1. Lower your body by bending your front knee and hip
          2. Keep your front knee tracking over your toes
          3. Continue lowering until your front thigh is parallel to the floor
          4. Pause briefly at the bottom
          5. Drive through your front heel to return to the starting position
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you drive back up to the starting position

          ### 4. Tips
          - Keep most of your weight on your front leg
          - Maintain an upright torso throughout the movement
          - Find the optimal front foot position for your flexibility
          - Focus on controlling the descent and explosive drive up
          - Keep your front knee aligned with your toes

          ### 5. Common Mistakes
          - Positioning front foot too close to the bench
          - Allowing the front knee to cave inward
          - Leaning too far forward during the movement
          - Putting too much weight on the rear foot
          - Not achieving adequate depth
          - Rushing through reps instead of controlling the movement

          ### 6. Safety / Modifications
          - Start with bodyweight only to master balance and form
          - Use a lower surface for the rear foot if needed
          - Hold onto a support for balance initially
          - Advanced variation: add weight with dumbbells, barbell, or weighted vest

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Cable Pull Through":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Cable Pull Through"
        instructions: |
          ## Overview
          The cable pull through is a hip hinge exercise that primarily targets the glutes and hamstrings. It also engages the lower back and core, using a cable to provide constant tension throughout the movement while teaching proper hip hinge mechanics.

          ## How to Perform
          ### 1. Starting Position
          - Attach a rope handle to a low cable pulley
          - Stand facing away from the cable with feet shoulder-width apart
          - Reach between your legs and grip the rope with both hands
          - Step forward to create tension on the cable
          - Keep your chest up and core engaged

          ### 2. Movement
          1. Hinge at your hips by pushing them back
          2. Allow the cable to pull your arms between your legs
          3. Keep your back flat and knees slightly bent
          4. Continue until you feel a stretch in your hamstrings
          5. Drive your hips forward explosively to return to standing
          6. Squeeze your glutes hard at the top, then repeat

          ### 3. Breathing
          - Inhale as you hinge forward
          - Exhale as you drive your hips forward

          ### 4. Tips
          - Focus on the hip hinge movement, not squatting
          - Drive through your heels when standing up
          - Squeeze your glutes hard at the top of each rep
          - Keep the cable tension constant throughout
          - Maintain a neutral spine and flat back

          ### 5. Common Mistakes
          - Squatting instead of hip hinging
          - Rounding the back during the movement
          - Not pushing the hips back far enough
          - Using too much weight and compromising form
          - Not fully extending hips at the top
          - Allowing the knees to cave inward

          ### 6. Safety / Modifications
          - Start with light weight to master the hip hinge pattern
          - Keep a slight bend in your knees throughout
          - Use this exercise to learn proper deadlift mechanics
          - Advanced variation: perform single-leg cable pull throughs

    muscles:
      primary:
        groups:
          - glutes
          - hamstrings
      secondary:
        groups:
          - back
  "Calf Press on Leg Press":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Calf Press on Leg Press"
        instructions: |
          ## Overview
          The calf press on leg press is an isolation exercise that primarily targets the gastrocnemius and soleus muscles of the calves. It uses the leg press machine to provide stable resistance while allowing for heavy loading and full range of motion in the ankle joint.

          ## How to Perform
          ### 1. Starting Position
          - Sit in the leg press machine with your back firmly against the pad
          - Position only the balls of your feet on the bottom edge of the platform
          - Keep your heels hanging off with legs fully extended
          - Unlock the safety catches
          - Keep your knees straight but not locked throughout

          ### 2. Movement
          1. Lower the platform by flexing your ankles and dropping your heels
          2. Allow a full stretch in your calves at the bottom
          3. Pause briefly at the bottom stretch position
          4. Press through the balls of your feet to extend your ankles
          5. Raise your heels as high as possible
          6. Squeeze your calves hard at the top, then repeat

          ### 3. Breathing
          - Inhale as you lower your heels
          - Exhale as you press up onto your toes

          ### 4. Tips
          - Keep your legs straight throughout to isolate the calves
          - Achieve full range of motion from deep stretch to high contraction
          - Focus on squeezing your calves at the top
          - Control the weight throughout both phases
          - Keep your core engaged for stability

          ### 5. Common Mistakes
          - Bending the knees during the movement
          - Not achieving full range of motion at top or bottom
          - Bouncing at the bottom instead of controlled stretch
          - Using too much weight and compromising form
          - Moving too quickly through the repetitions
          - Not squeezing at the top contraction

          ### 6. Safety / Modifications
          - Start with moderate weight to master the full range of motion
          - Vary foot position (neutral, toes in, toes out) for complete calf development
          - Advanced variation: perform single-leg calf presses
          - Pause for 2-3 seconds at peak contraction for increased intensity

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Calf Press on Seated Leg Press":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Calf Press on Seated Leg Press"
        instructions: |
          ## Overview
          The calf press on seated leg press is an isolation exercise that primarily targets the gastrocnemius and soleus muscles of the calves. It uses the seated leg press machine to provide stable resistance at a different angle, emphasizing the soleus muscle more due to the seated, bent-knee position.

          ## How to Perform
          ### 1. Starting Position
          - Sit in the seated leg press machine with your back firmly against the pad
          - Position only the balls of your feet on the bottom edge of the platform
          - Keep your heels hanging off with knees bent at 90 degrees
          - Unlock the safety catches if present
          - Keep your knees stationary throughout the movement

          ### 2. Movement
          1. Lower the platform by flexing your ankles and dropping your heels
          2. Allow a full stretch in your calves at the bottom
          3. Pause briefly at the bottom stretch position
          4. Press through the balls of your feet to extend your ankles
          5. Raise your heels as high as possible
          6. Squeeze your calves hard at the top, then repeat

          ### 3. Breathing
          - Inhale as you lower your heels
          - Exhale as you press up onto your toes

          ### 4. Tips
          - Keep your knees stationary and bent throughout
          - The seated position emphasizes the soleus muscle
          - Achieve full range of motion from deep stretch to high contraction
          - Focus on squeezing your calves at the top
          - Control the weight throughout both phases

          ### 5. Common Mistakes
          - Extending or moving the knees during the movement
          - Not achieving full range of motion at top or bottom
          - Bouncing at the bottom instead of controlled stretch
          - Using too much weight and compromising form
          - Moving too quickly through the repetitions
          - Not squeezing at the top contraction

          ### 6. Safety / Modifications
          - Start with moderate weight to master the full range of motion
          - Vary foot position (neutral, toes in, toes out) for complete calf development
          - Combine with standing calf raises for complete calf training
          - Advanced variation: pause for 2-3 seconds at peak contraction

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Deadlift (Band)":
    category: Weighted Body Weight
    target: Legs
    i18n:
      en:
        name: "Deadlift (Band)"
        instructions: |
          ## Overview
          The band deadlift is a resistance-based compound exercise that primarily targets the glutes, hamstrings, and erector spinae. It also engages the quadriceps, lats, and core, using progressive band resistance to teach proper deadlift mechanics with lighter loading.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, stepping on the center of a resistance band
          - Grip both ends of the band with hands just outside your legs
          - Hinge at the hips and bend your knees to reach the band
          - Keep your chest up, back flat, and shoulders slightly ahead of your hands
          - Engage your core and lats before lifting

          ### 2. Movement
          1. Drive through your heels and extend your hips and knees simultaneously
          2. Keep the band close to your body as you lift
          3. Stand up fully by extending your hips and knees
          4. Keep your shoulders back and chest up at the top
          5. Lower back down by pushing your hips back and bending your knees
          6. Return to the starting position with control and repeat

          ### 3. Breathing
          - Take a deep breath and brace your core before lifting
          - Hold your breath during the lift
          - Exhale at the top or as you lower back down

          ### 4. Tips
          - Keep the band close to your shins and thighs throughout
          - Lead with your chest as you stand up
          - Keep your spine neutral, avoiding rounding or hyperextension
          - The band provides increasing resistance as you stand
          - Focus on the hip hinge pattern

          ### 5. Common Mistakes
          - Rounding the lower back during the lift
          - Starting with hips too high or too low
          - Letting the band drift away from the body
          - Not fully extending hips at the top
          - Looking up or down instead of maintaining neutral neck
          - Using arms to pull instead of legs and hips to drive

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master proper form
          - Adjust foot position on the band to modify resistance
          - Use this variation to learn deadlift mechanics before progressing to barbells
          - Advanced variation: use a heavier resistance band or perform single-leg band deadlifts

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
      secondary:
        groups:
          - hamstrings
  "Deadlift (Dumbbell)":
    category: Dumbbell
    target: Legs
    i18n:
      en:
        name: "Deadlift (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell deadlift is a compound exercise that primarily targets the glutes, hamstrings, and erector spinae. It also engages the quadriceps, lats, traps, and grip muscles, using dumbbells for independent arm movement and a more natural hand position than barbells.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, dumbbells on the floor beside your feet
          - Hinge at the hips and bend your knees to grip the dumbbells
          - Hold dumbbells with a neutral or pronated grip
          - Keep your chest up, back flat, and shoulders slightly ahead of the dumbbells
          - Engage your core and lats before lifting

          ### 2. Movement
          1. Drive through your heels and extend your hips and knees simultaneously
          2. Keep the dumbbells close to your body as you lift
          3. Stand up fully by extending your hips and knees
          4. Keep your shoulders back and chest up at the top
          5. Lower the dumbbells by pushing your hips back and bending your knees
          6. Return the dumbbells to the floor with control and repeat

          ### 3. Breathing
          - Take a deep breath and brace your core before lifting
          - Hold your breath during the lift
          - Exhale at the top or as you lower the dumbbells

          ### 4. Tips
          - Keep the dumbbells close to your shins and thighs throughout
          - Lead with your chest as you stand up
          - Keep your spine neutral, avoiding rounding or hyperextension
          - The neutral grip can be more comfortable for some lifters
          - Think about pushing the floor away rather than lifting the dumbbells

          ### 5. Common Mistakes
          - Rounding the lower back during the lift
          - Starting with hips too high or too low
          - Letting the dumbbells drift away from the body
          - Not fully extending hips at the top
          - Looking up or down instead of maintaining neutral neck
          - Using arms to pull instead of legs and hips to drive

          ### 6. Safety / Modifications
          - Start with moderate dumbbells to master proper form
          - Use lifting straps if grip strength is limiting
          - Advanced variation: perform single-leg dumbbell deadlifts
          - If you experience lower back discomfort, reduce weight and check your form

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
      secondary:
        groups:
          - hamstrings
  "Deadlift (Smith Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Deadlift (Smith Machine)"
        instructions: |
          ## Overview
          The Smith machine deadlift is a guided compound exercise that primarily targets the glutes, hamstrings, and erector spinae. It also engages the quadriceps, lats, and traps, using a fixed vertical bar path to provide stability and allow focus on the lifting motion.

          ## How to Perform
          ### 1. Starting Position
          - Position the bar on a Smith machine at mid-shin height
          - Stand inside the machine with feet hip-width apart, bar over mid-foot
          - Grip the bar just outside your legs with an overhand or mixed grip
          - Hinge at the hips and bend your knees to reach the bar
          - Keep your chest up, back flat, and shoulders slightly ahead of the bar

          ### 2. Movement
          1. Unrack the bar by rotating it, then drive through your heels
          2. Extend your hips and knees simultaneously to stand up
          3. Keep the bar close to your body as you lift
          4. Stand up fully with shoulders back and chest up
          5. Lower the bar by pushing your hips back and bending your knees
          6. Return the bar to the starting position and repeat

          ### 3. Breathing
          - Take a deep breath and brace your core before lifting
          - Hold your breath during the lift
          - Exhale at the top or as you lower the bar

          ### 4. Tips
          - The fixed bar path can help maintain proper form
          - Keep the bar close to your shins and thighs throughout
          - Lead with your chest as you stand up
          - Keep your spine neutral throughout the movement
          - Use the safety catches for added security

          ### 5. Common Mistakes
          - Rounding the lower back during the lift
          - Starting with hips too high or too low
          - Not adjusting foot position relative to the fixed bar path
          - Not fully extending hips at the top
          - Looking up or down instead of maintaining neutral neck
          - Relying too heavily on the machine's guided path

          ### 6. Safety / Modifications
          - Adjust starting bar height to mid-shin for optimal form
          - Use the safety catches at appropriate height
          - Experiment with foot position to find your optimal stance relative to the bar
          - If you experience lower back discomfort, reduce weight and check your form

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
      secondary:
        groups:
          - hamstrings
  "Deficit Deadlift (Barbell)":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Deficit Deadlift (Barbell)"
        instructions: |
          ## Overview
          The deficit barbell deadlift is an advanced compound exercise that primarily targets the glutes, hamstrings, and erector spinae with increased range of motion. It also engages the quadriceps more than standard deadlifts, using an elevated platform to increase difficulty and strengthen the bottom position.

          ## How to Perform
          ### 1. Starting Position
          - Stand on a 1-3 inch elevated platform with feet hip-width apart
          - Position a barbell over mid-foot on the floor below
          - Grip the bar just outside your legs with an overhand or mixed grip
          - Hinge at the hips and bend your knees deeper to reach the bar
          - Keep your chest up, back flat, and shoulders slightly ahead of the bar

          ### 2. Movement
          1. Drive through your heels and extend your hips and knees simultaneously
          2. Keep the bar close to your body as you lift from the deeper position
          3. Stand up fully by extending your hips and knees
          4. Keep your shoulders back and chest up at the top
          5. Lower the bar by pushing your hips back and bending your knees
          6. Return the bar to the floor with control and repeat

          ### 3. Breathing
          - Take a deep breath and brace your core before lifting
          - Hold your breath during the lift
          - Exhale at the top or as you lower the bar

          ### 4. Tips
          - The deficit increases range of motion and difficulty
          - Keep the bar close to your shins and thighs throughout
          - Focus on explosive drive from the bottom position
          - Use lighter weight than your standard deadlift
          - This variation builds strength in the hardest part of the lift

          ### 5. Common Mistakes
          - Using a platform that's too high for your mobility
          - Rounding the lower back due to increased range of motion
          - Starting with hips too high to compensate for the deficit
          - Using too much weight and compromising form
          - Not maintaining bar path close to the body
          - Losing neutral spine at the bottom

          ### 6. Safety / Modifications
          - Start with a 1-inch deficit and progress gradually
          - Use 10-20% less weight than your standard deadlift
          - Ensure you have adequate mobility for the increased range
          - If you experience lower back discomfort, reduce deficit height or weight

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
      secondary:
        groups:
          - hamstrings
  "Front Squat (Barbell)":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Front Squat (Barbell)"
        instructions: |
          ## Overview
          The barbell front squat is a compound lower body exercise that primarily targets the quadriceps with greater emphasis than back squats. It also engages the glutes, hamstrings, core, and upper back, using a front-loaded barbell position that promotes upright torso positioning.

          ## How to Perform
          ### 1. Starting Position
          - Position a barbell in a rack at upper chest height
          - Step under the bar and position it across your front deltoids
          - Create a shelf with your shoulders, keeping elbows high and pointed forward
          - Grip can be clean grip (fingers under bar) or crossed-arm grip
          - Stand with feet shoulder-width apart, toes slightly out

          ### 2. Movement
          1. Unrack the bar and step back with feet shoulder-width apart
          2. Initiate the squat by bending your knees and hips simultaneously
          3. Keep your torso upright and elbows high throughout
          4. Descend until thighs are at least parallel to the floor
          5. Drive through your heels to return to standing position
          6. Keep elbows up and chest proud, then repeat for controlled reps

          ### 3. Breathing
          - Take a deep breath and brace your core before descending
          - Hold your breath during the descent and bottom position
          - Exhale as you drive back up or at the top

          ### 4. Tips
          - Keep your elbows as high as possible throughout
          - The front-loaded position forces a more upright torso
          - Focus on keeping your chest up and core tight
          - Drive your knees out as you descend
          - The front squat emphasizes quadriceps more than back squats

          ### 5. Common Mistakes
          - Allowing the elbows to drop, causing the bar to roll forward
          - Leaning too far forward and losing the upright position
          - Not achieving adequate depth
          - Allowing the knees to cave inward
          - Using too much weight before mastering the position
          - Not maintaining core tension throughout

          ### 6. Safety / Modifications
          - Start with light weight to master the front rack position
          - Use a crossed-arm grip if the clean grip is uncomfortable
          - Practice front squats with just the bar first
          - Advanced variation: add a pause at the bottom or perform tempo front squats

    muscles:
      primary:
        groups:
          - legs
      secondary:
        groups:
          - back
          - core
          - glutes
  "Glute Ham Raise":
    category: Weighted Body Weight
    target: Legs
    i18n:
      en:
        name: "Glute Ham Raise"
        instructions: |
          ## Overview
          The glute ham raise is an advanced bodyweight exercise that primarily targets the hamstrings and glutes. It also engages the lower back and calves, using eccentric and concentric hamstring contraction to build posterior chain strength and injury resilience.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself face down on a glute ham raise machine
          - Secure your ankles under the ankle pads with thighs on the support pad
          - Start with your torso upright and perpendicular to the floor
          - Cross your arms over your chest or place hands in front
          - Engage your core and glutes throughout

          ### 2. Movement
          1. Slowly lower your torso forward by extending at the knees
          2. Keep your body straight from knees to head as you descend
          3. Control the descent using your hamstrings and glutes
          4. Lower until your torso is nearly parallel to the floor
          5. Pull yourself back to the starting position using your hamstrings
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your torso forward
          - Exhale as you pull yourself back to the starting position

          ### 4. Tips
          - Focus on controlling the eccentric (lowering) phase
          - Keep your body in a straight line throughout
          - Use your hamstrings and glutes, not momentum
          - Start with partial range of motion if full reps are too difficult
          - This exercise builds significant hamstring strength

          ### 5. Common Mistakes
          - Bending at the hips instead of maintaining a straight body
          - Dropping too quickly on the eccentric phase
          - Using momentum to swing back up
          - Not engaging the glutes throughout
          - Arching the lower back excessively
          - Attempting full range before building adequate strength

          ### 6. Safety / Modifications
          - Use a resistance band for assistance if needed
          - Start with eccentric-only reps (lowering only, then reset)
          - Push off the floor with your hands to help return to start
          - Advanced variation: hold a weight plate at your chest for added resistance

    muscles:
      primary:
        groups:
          - legs
      secondary: {}
  "Glute Kickback (Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Glute Kickback (Machine)"
        instructions: |
          ## Overview
          The machine glute kickback is an isolation exercise that primarily targets the glutes. It also engages the hamstrings, using a guided movement path to provide stability and consistent resistance throughout the hip extension motion.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself on the glute kickback machine following its design
          - Place one foot on the foot platform with knee bent
          - Grip the handles for stability
          - Keep your torso stable and core engaged
          - Align your working hip with the machine's pivot point

          ### 2. Movement
          1. Push the foot platform back by extending your hip
          2. Keep your knee slightly bent throughout the movement
          3. Continue until your leg is fully extended behind you
          4. Squeeze your glute hard at full extension
          5. Slowly return the platform to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you extend your leg back
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on using your glute to drive the movement
          - Keep your torso stable and avoid arching your back
          - Squeeze your glute hard at full extension
          - Control both the extending and returning phases
          - Keep constant tension by not letting the weight stack rest

          ### 5. Common Mistakes
          - Arching the lower back excessively during the kickback
          - Using momentum instead of controlled glute contraction
          - Not achieving full hip extension
          - Letting the weight stack rest between reps
          - Rotating the hips or torso during the movement
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Adjust machine settings to fit your body properly
          - Start with light weight to establish proper form
          - Focus on the glute squeeze rather than kicking high
          - Advanced variation: pause for 2-3 seconds at full extension

    muscles:
      primary:
        groups:
          - glutes
      secondary:
        groups:
          - hamstrings
  "Goblet Squat (Kettlebell)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Goblet Squat (Kettlebell)"
        instructions: |
          ## Overview
          The goblet squat is a compound lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core and upper back, using a front-loaded kettlebell or dumbbell position to promote proper squat mechanics and upright torso positioning.

          ## How to Perform
          ### 1. Starting Position
          - Hold a kettlebell by the horns (handles) or a dumbbell vertically at chest height
          - Stand with feet slightly wider than shoulder-width apart
          - Point your toes slightly outward
          - Keep your chest up, core engaged, and elbows pointing down
          - Maintain an upright torso throughout

          ### 2. Movement
          1. Initiate the squat by bending your knees and hips simultaneously
          2. Keep the kettlebell close to your chest throughout
          3. Descend until your elbows touch the inside of your knees or deeper
          4. Keep your chest up and weight on your heels
          5. Drive through your heels to return to standing position
          6. Fully extend your hips and knees at the top, then repeat

          ### 3. Breathing
          - Inhale as you descend into the squat
          - Exhale as you drive back up to standing

          ### 4. Tips
          - The front-loaded position encourages proper squat form
          - Use the kettlebell as a counterbalance to sit back deeper
          - Keep your elbows inside your knees at the bottom
          - Drive your knees out as you descend and ascend
          - This variation is excellent for learning squat mechanics

          ### 5. Common Mistakes
          - Allowing the chest to collapse forward
          - Not achieving adequate depth
          - Allowing the knees to cave inward
          - Letting the kettlebell drift away from your chest
          - Rising onto your toes instead of keeping weight on heels
          - Rushing through reps instead of controlled movement

          ### 6. Safety / Modifications
          - Start with a light kettlebell to master the movement pattern
          - Use a dumbbell if kettlebells are unavailable
          - Place a box behind you to ensure consistent depth
          - Advanced variation: add a pause at the bottom or perform tempo goblet squats

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Hack Squat":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Hack Squat"
        instructions: |
          ## Overview
          The hack squat is a compound lower body exercise that primarily targets the quadriceps. It also engages the glutes and hamstrings, using a machine or barbell position that allows for heavy loading with reduced lower back stress compared to traditional squats.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself on a hack squat machine with back against the pad
          - Place feet shoulder-width apart on the platform, toes slightly out
          - Position shoulders under the shoulder pads
          - Release the safety handles and hold the side handles
          - Keep your chest up and core engaged

          ### 2. Movement
          1. Lower yourself by bending your knees and hips
          2. Keep your back pressed against the pad throughout
          3. Descend until thighs are at least parallel to the platform
          4. Pause briefly at the bottom
          5. Drive through your heels to return to starting position
          6. Fully extend your legs at the top, then repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower yourself down
          - Exhale as you drive back up to starting position

          ### 4. Tips
          - Keep your back pressed firmly against the pad
          - The angled path emphasizes quadriceps development
          - Drive through your entire foot, not just your toes
          - Keep your knees tracking over your toes
          - Maintain constant tension throughout the movement

          ### 5. Common Mistakes
          - Lifting your back off the pad during the movement
          - Not achieving adequate depth
          - Allowing the knees to cave inward
          - Locking out knees completely at the top
          - Using too much weight and compromising form
          - Placing feet too low on the platform, increasing knee stress

          ### 6. Safety / Modifications
          - Adjust foot position on the platform to target different quad areas
          - Keep knees behind or in line with toes to reduce knee stress
          - Start with light weight to master the movement pattern
          - Advanced variation: perform single-leg hack squats or add a pause at the bottom

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Hack Squat (Barbell)":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Hack Squat (Barbell)"
        instructions: |
          ## Overview
          The barbell hack squat is a compound lower body exercise that primarily targets the quadriceps. It also engages the glutes, hamstrings, and lower back, using a barbell positioned behind the legs to create a unique loading pattern that emphasizes the quads.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, barbell on the floor behind your heels
          - Squat down and grip the barbell behind your legs with an overhand grip
          - Position hands slightly wider than shoulder-width apart
          - Keep your chest up, core engaged, and weight on your heels
          - Maintain a neutral spine throughout

          ### 2. Movement
          1. Drive through your heels to stand up, lifting the barbell
          2. Keep the bar close to your legs as you ascend
          3. Extend your hips and knees to reach full standing position
          4. Pause briefly at the top
          5. Lower the barbell back down by bending your knees and hips
          6. Return the bar to the floor with control and repeat

          ### 3. Breathing
          - Take a deep breath and brace before lifting
          - Hold your breath during the lift
          - Exhale at the top or as you lower the bar

          ### 4. Tips
          - The bar position behind your legs emphasizes quadriceps
          - Keep the bar close to your legs throughout
          - Focus on driving through your heels
          - Keep your torso as upright as possible
          - Start with light weight to master the unique bar position

          ### 5. Common Mistakes
          - Rounding the back during the lift
          - Letting the bar drift away from the legs
          - Leaning too far forward
          - Not achieving full hip extension at the top
          - Using too much weight before mastering form
          - Allowing the knees to cave inward

          ### 6. Safety / Modifications
          - Start with very light weight or just the bar
          - Use lifting straps if grip strength is limiting
          - This variation is less common than machine hack squats
          - If you experience discomfort, consider using a hack squat machine instead

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "High Knee Skips":
    category: Reps Only
    target: Legs
    i18n:
      en:
        name: "High Knee Skips"
        instructions: |
          ## Overview
          High knee skips are a plyometric cardio exercise that primarily targets the hip flexors, quadriceps, and calves. They also engage the core and improve coordination, using explosive skipping movements to build lower body power and cardiovascular endurance.

          ## How to Perform
          ### 1. Starting Position
          - Stand tall with feet hip-width apart
          - Keep your chest up, core engaged, and arms at your sides
          - Prepare to move forward with explosive skipping motion
          - Maintain good posture throughout

          ### 2. Movement
          1. Skip forward while driving one knee up toward your chest
          2. Swing the opposite arm forward as you drive the knee up
          3. Land on the ball of your foot and immediately skip with the other leg
          4. Continue alternating legs with explosive, exaggerated skipping motion
          5. Drive knees as high as possible with each skip
          6. Maintain rhythm and continue for desired reps or time

          ### 4. Tips
          - Focus on explosive power with each skip
          - Drive your knees up as high as possible
          - Use your arms to generate momentum
          - Land softly on the balls of your feet
          - Maintain an upright posture throughout

          ### 5. Common Mistakes
          - Not driving knees high enough
          - Landing flat-footed instead of on the balls of feet
          - Leaning too far forward or backward
          - Not using arms to assist with momentum
          - Moving too slowly without explosive power
          - Holding your breath during the exercise

          ### 6. Safety / Modifications
          - Start with regular high knees in place before adding the skip
          - Reduce height and speed if you experience knee or hip discomfort
          - Perform on a softer surface to reduce impact
          - Advanced variation: add a weighted vest or increase speed and height

    muscles:
      primary:
        groups:
          - legs
      secondary:
        groups:
          - core
          - glutes
  "Hip Abductor (Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Hip Abductor (Machine)"
        instructions: |
          ## Overview
          The machine hip abductor is an isolation exercise that primarily targets the gluteus medius and minimus. It also engages the tensor fasciae latae, using a guided movement path to strengthen the outer hip muscles and improve hip stability.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the hip abductor machine with your back firmly against the pad
          - Position the outside of your thighs against the padded levers
          - Adjust the machine so your knees are aligned with the pivot point
          - Grip the handles for stability
          - Keep your feet flat and core engaged

          ### 2. Movement
          1. Push your legs apart by contracting your outer hip muscles
          2. Move against the resistance in a controlled manner
          3. Continue until your legs are as far apart as comfortable
          4. Pause and squeeze your outer glutes at full abduction
          5. Slowly return your legs to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you push your legs apart
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on using your outer hip muscles, not momentum
          - Keep your back pressed firmly against the pad
          - Avoid rotating your torso during the movement
          - Control both the abduction and adduction phases
          - Maintain constant tension by not letting the weight stack rest

          ### 5. Common Mistakes
          - Using momentum or swinging the legs
          - Lifting the glutes off the seat
          - Rotating the torso instead of keeping it stable
          - Not achieving full range of motion
          - Letting the weight stack rest between reps
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Adjust pad position to ensure proper knee alignment
          - Start with light weight to establish proper form
          - Focus on controlled movement over heavy weight
          - Advanced variation: pause for 2-3 seconds at full abduction

    muscles:
      primary:
        ids:
          - gluteus_medius_1_l
          - gluteus_medius_1_r
          - gluteus_medius_2_l
          - gluteus_medius_2_r
      secondary: {}
  "Hip Adductor (Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Hip Adductor (Machine)"
        instructions: |
          ## Overview
          The machine hip adductor is an isolation exercise that primarily targets the adductor muscles of the inner thighs. It also engages the gracilis and pectineus, using a guided movement path to strengthen the inner hip muscles and improve hip stability.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the hip adductor machine with your back firmly against the pad
          - Position the inside of your thighs against the padded levers
          - Adjust the machine so your legs start in a wide, open position
          - Grip the handles for stability
          - Keep your feet flat and core engaged

          ### 2. Movement
          1. Bring your legs together by contracting your inner thigh muscles
          2. Move against the resistance in a controlled manner
          3. Continue until your legs come together or nearly touch
          4. Pause and squeeze your inner thighs at full adduction
          5. Slowly return your legs to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you bring your legs together
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on using your inner thigh muscles, not momentum
          - Keep your back pressed firmly against the pad
          - Avoid rotating your torso during the movement
          - Control both the adduction and abduction phases
          - Maintain constant tension by not letting the weight stack rest

          ### 5. Common Mistakes
          - Using momentum or swinging the legs
          - Lifting the glutes off the seat
          - Rotating the torso instead of keeping it stable
          - Not achieving full range of motion
          - Letting the weight stack rest between reps
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Adjust the starting leg position for comfortable range of motion
          - Start with light weight to establish proper form
          - Focus on controlled movement over heavy weight
          - Advanced variation: pause for 2-3 seconds at full adduction

    muscles:
      primary:
        groups:
          - adductors
      secondary: {}
  "Hip Thrust (Barbell)":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Hip Thrust (Barbell)"
        instructions: |
          ## Overview
          The barbell hip thrust is an isolation exercise that primarily targets the glutes. It also engages the hamstrings and lower back, using a horizontal hip extension movement with a barbell to build powerful glute strength and muscle development.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the floor with your upper back against a bench
          - Roll a barbell over your legs and position it across your hips
          - Use a pad or towel for comfort if needed
          - Plant your feet flat on the floor, hip-width apart
          - Keep your shoulders on the bench and core engaged

          ### 2. Movement
          1. Drive through your heels to lift your hips and the barbell upward
          2. Extend your hips until your body forms a straight line from shoulders to knees
          3. Keep your chin tucked and avoid overextending your lower back
          4. Squeeze your glutes hard at the top of the movement
          5. Slowly lower your hips back down with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your hips down
          - Exhale as you drive your hips up

          ### 4. Tips
          - Focus on squeezing your glutes at the top, not arching your back
          - Keep your ribs down and core engaged to prevent hyperextension
          - Drive through your heels, not your toes
          - Keep your chin tucked throughout the movement
          - Position the barbell in the crease of your hips for optimal leverage

          ### 5. Common Mistakes
          - Hyperextending the lower back at the top instead of using glutes
          - Positioning feet too close or too far from the body
          - Not achieving full hip extension at the top
          - Arching the neck to look up during the movement
          - Using momentum instead of controlled glute contraction
          - Not using a pad, causing discomfort and distraction

          ### 6. Safety / Modifications
          - Start with bodyweight hip thrusts to master the movement pattern
          - Use a barbell pad or towel to protect your hips
          - Place a resistance band around your knees to increase glute activation
          - Advanced variation: perform single-leg barbell hip thrusts or add a pause at the top

    muscles:
      primary:
        groups:
          - glutes
      secondary:
        groups:
          - hamstrings
  "Hip Thrust (Bodyweight)":
    category: Reps Only
    target: Legs
    i18n:
      en:
        name: "Hip Thrust (Bodyweight)"
        instructions: |
          ## Overview
          The bodyweight hip thrust is an isolation exercise that primarily targets the glutes. It also engages the hamstrings and lower back, using horizontal hip extension without added weight to build foundational glute strength and activation.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the floor with your upper back against a bench
          - Position your shoulder blades on the edge of the bench
          - Plant your feet flat on the floor, hip-width apart
          - Keep your arms crossed over your chest or at your sides
          - Engage your core throughout

          ### 2. Movement
          1. Drive through your heels to lift your hips upward
          2. Extend your hips until your body forms a straight line from shoulders to knees
          3. Keep your chin tucked and avoid overextending your lower back
          4. Squeeze your glutes hard at the top of the movement
          5. Slowly lower your hips back down with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your hips down
          - Exhale as you drive your hips up

          ### 4. Tips
          - Focus on squeezing your glutes at the top, not arching your back
          - Keep your ribs down and core engaged to prevent hyperextension
          - Drive through your heels, not your toes
          - Keep your chin tucked throughout the movement
          - Control both the lifting and lowering phases

          ### 5. Common Mistakes
          - Hyperextending the lower back at the top instead of using glutes
          - Positioning feet too close or too far from the body
          - Not achieving full hip extension at the top
          - Arching the neck to look up during the movement
          - Using momentum instead of controlled glute contraction
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Master this variation before adding weight
          - Place a resistance band around your knees to increase glute activation
          - Elevate your feet on a step for increased range of motion
          - Advanced variation: perform single-leg bodyweight hip thrusts or add a pause at the top

    muscles:
      primary:
        groups:
          - glutes
      secondary:
        groups:
          - hamstrings
  "Donkey Kick (Smith Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Donkey Kick (Smith Machine)"
        instructions: |
          ## Overview
          The Smith machine donkey kick is an isolation exercise that primarily targets the glutes. It also engages the hamstrings, using a fixed vertical bar path to provide stable resistance for the hip extension movement.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself on all fours under the Smith machine bar
          - Place the sole of one foot against the underside of the bar
          - Position hands directly under shoulders and knee under hip
          - Keep your core engaged and back flat
          - Set the bar at an appropriate starting height

          ### 2. Movement
          1. Press your foot up against the bar by extending your hip
          2. Keep your knee bent at 90 degrees throughout
          3. Continue until your thigh is in line with your torso or slightly higher
          4. Squeeze your glute hard at the top of the movement
          5. Slowly lower the bar back to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you press the bar up
          - Inhale as you lower the bar back down

          ### 4. Tips
          - Keep your core engaged and back flat throughout
          - Focus on using your glute to drive the movement
          - Maintain a 90-degree bend in your knee
          - Avoid arching your lower back excessively
          - Keep your hips square to the floor

          ### 5. Common Mistakes
          - Arching the lower back excessively to lift higher
          - Rotating the hips instead of keeping them square
          - Using momentum instead of controlled glute contraction
          - Straightening the working leg during the movement
          - Not achieving full hip extension
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with light weight or just the bar to master the movement
          - Adjust starting bar height for comfortable range of motion
          - Keep your supporting knee padded for comfort
          - Advanced variation: pause for 2-3 seconds at the top of each rep

    muscles:
      primary:
        groups:
          - glutes
      secondary:
        groups:
          - hamstrings
  "Donkey Kick":
    category: Weighted Body Weight
    target: Legs
    i18n:
      en:
        name: "Donkey Kick"
        instructions: |
          ## Overview
          The donkey kick is a bodyweight isolation exercise that primarily targets the glutes. It also engages the hamstrings and core, using a kicking motion from an all-fours position to activate and strengthen the glute muscles.

          ## How to Perform
          ### 1. Starting Position
          - Start on all fours with hands directly under shoulders
          - Position knees directly under hips
          - Keep your core engaged and back flat
          - Maintain a neutral spine throughout
          - Keep your head aligned with your spine

          ### 2. Movement
          1. Lift one leg by extending your hip while keeping knee bent at 90 degrees
          2. Press your heel toward the ceiling as if stamping upward
          3. Continue until your thigh is in line with your torso or slightly higher
          4. Squeeze your glute hard at the top of the movement
          5. Slowly lower your knee back to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you kick your leg up
          - Inhale as you lower your leg back down

          ### 4. Tips
          - Keep your core engaged and back flat throughout
          - Focus on using your glute to drive the movement
          - Maintain a 90-degree bend in your knee
          - Avoid arching your lower back excessively
          - Keep your hips square to the floor

          ### 5. Common Mistakes
          - Arching the lower back excessively to lift higher
          - Rotating the hips instead of keeping them square
          - Using momentum instead of controlled glute contraction
          - Straightening the working leg during the movement
          - Not achieving full hip extension
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Use a mat or padding under your knees for comfort
          - Add ankle weights or resistance band for increased difficulty
          - Perform slower tempo reps for greater muscle engagement
          - Advanced variation: add a pulse at the top or hold for 2-3 seconds

    muscles:
      primary:
        groups:
          - glutes
      secondary:
        groups:
          - hamstrings
  "Fire Hydrant":
    category: Weighted Body Weight
    target: Legs
    i18n:
      en:
        name: "Fire Hydrant"
        instructions: |
          ## Overview
          The fire hydrant is a bodyweight isolation exercise that primarily targets the gluteus medius and minimus. It also engages the hip abductors and core stabilizers, using a lateral leg lift from an all-fours position to strengthen the outer hip and improve hip stability.

          ## How to Perform
          ### 1. Starting Position
          - Start on all fours with hands directly under shoulders
          - Position knees directly under hips
          - Keep your core engaged and back flat
          - Maintain a neutral spine throughout
          - Keep your head aligned with your spine

          ### 2. Movement
          1. Lift one knee out to the side while keeping it bent at 90 degrees
          2. Raise your leg until your thigh is parallel to the floor or as high as comfortable
          3. Keep your hips square and avoid rotating your torso
          4. Pause and squeeze your outer glute at the top
          5. Slowly lower your knee back to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you lift your leg out to the side
          - Inhale as you lower your leg back down

          ### 4. Tips
          - Keep your core engaged and back flat throughout
          - Focus on using your outer hip muscles to lift the leg
          - Maintain a 90-degree bend in your knee
          - Avoid rotating your hips or torso during the movement
          - Keep your supporting arm and leg stable

          ### 5. Common Mistakes
          - Rotating the hips or torso instead of keeping them square
          - Arching or rounding the lower back
          - Using momentum instead of controlled movement
          - Not maintaining the 90-degree knee bend
          - Lifting the leg too high and losing form
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Use a mat or padding under your knees and hands for comfort
          - Add ankle weights or resistance band for increased difficulty
          - Perform with small pulses at the top for increased burn
          - Advanced variation: hold for 2-3 seconds at the top of each rep

    muscles:
      primary:
        groups:
          - glutes
      secondary:
        groups:
          - hamstrings
  "Jump Squat":
    category: Reps Only
    target: Legs
    i18n:
      en:
        name: "Jump Squat"
        instructions: |
          ## Overview
          The jump squat is a plyometric exercise that primarily targets the quadriceps, glutes, and calves. It also engages the hamstrings and core, using explosive jumping from a squat position to build lower body power and cardiovascular endurance.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart
          - Keep your chest up and core engaged
          - Position your arms at your sides or in front of you
          - Maintain good posture throughout

          ### 2. Movement
          1. Lower into a squat by bending your knees and hips
          2. Descend until thighs are at least parallel to the floor
          3. Explosively jump upward, extending through your hips, knees, and ankles
          4. Swing your arms upward to generate momentum
          5. Land softly with bent knees to absorb the impact
          6. Immediately descend into the next squat and repeat

          ### 3. Breathing
          - Inhale as you descend into the squat
          - Exhale explosively as you jump

          ### 4. Tips
          - Focus on explosive power when jumping upward
          - Land softly with bent knees to absorb impact
          - Keep your chest up throughout the movement
          - Use your arms to generate momentum
          - Maintain control throughout the entire movement

          ### 5. Common Mistakes
          - Landing with straight legs, increasing injury risk
          - Not descending low enough before jumping
          - Allowing the knees to cave inward during landing
          - Using momentum without control
          - Not fully extending during the jump phase
          - Landing too heavily instead of softly

          ### 6. Safety / Modifications
          - Start with bodyweight squats to master form before adding jumps
          - Perform on a softer surface to reduce impact
          - Reduce jump height if experiencing knee or ankle discomfort
          - Advanced variation: add a weighted vest or hold dumbbells

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Lateral Box Jump":
    category: Reps Only
    target: Legs
    i18n:
      en:
        name: "Lateral Box Jump"
        instructions: |
          ## Overview
          The lateral box jump is a plyometric exercise that primarily targets the quadriceps, glutes, and calves. It also engages the hip abductors and core stabilizers, using lateral explosive jumping to build lower body power, coordination, and lateral athleticism.

          ## How to Perform
          ### 1. Starting Position
          - Stand beside a sturdy box or platform with feet hip-width apart
          - Position yourself about one foot away from the box
          - Keep your chest up and core engaged
          - Bend your knees slightly and prepare for a lateral jump
          - Keep your arms ready to generate momentum

          ### 2. Movement
          1. Swing your arms and explosively jump laterally onto the box
          2. Land softly on the box with both feet simultaneously
          3. Absorb the impact by landing in a partial squat position
          4. Stand up fully on top of the box
          5. Step down on the opposite side of the box
          6. Immediately jump back laterally to the starting side and repeat

          ### 3. Breathing
          - Inhale during the preparatory phase
          - Exhale explosively as you jump

          ### 4. Tips
          - Focus on explosive lateral power from your legs
          - Land softly with bent knees to absorb impact
          - Keep your chest up and eyes on the box
          - Use your arms to generate lateral momentum
          - Start with a lower box height and progress gradually

          ### 5. Common Mistakes
          - Landing with straight legs, increasing injury risk
          - Using a box that's too high for your current ability
          - Not landing with both feet simultaneously
          - Jumping down instead of stepping down
          - Losing balance during the lateral jump
          - Rushing reps without proper reset between jumps

          ### 6. Safety / Modifications
          - Start with a low, stable box (12-18 inches) to master technique
          - Ensure the box is stable and won't slip or tip
          - Practice lateral jumps on the floor before adding box height
          - Advanced variation: increase box height or perform continuous lateral jumps without pausing

    muscles:
      primary:
        groups:
          - legs
      secondary:
        groups:
          - core
          - glutes
  "Leg Extension (Machine)":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Leg Extension (Machine)"
        instructions: |
          ## Overview
          The machine leg extension is an isolation exercise that primarily targets the quadriceps. It uses a guided movement path with adjustable resistance to isolate and strengthen the four muscles of the front thigh.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the leg extension machine with your back firmly against the pad
          - Adjust the pad so your knees align with the machine's pivot point
          - Position your ankles behind the lower pad
          - Grip the handles at your sides for stability
          - Keep your core engaged throughout

          ### 2. Movement
          1. Extend your legs by contracting your quadriceps
          2. Continue until your legs are fully extended
          3. Pause and squeeze your quads at full extension
          4. Slowly lower the weight back to the starting position with control
          5. Stop just before the weight stack touches to maintain tension
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you extend your legs
          - Inhale as you lower the weight back down

          ### 4. Tips
          - Keep your back pressed firmly against the pad
          - Focus on squeezing your quadriceps at full extension
          - Control both the extending and lowering phases
          - Maintain constant tension by not letting the weight stack rest
          - Point your toes straight ahead or slightly upward

          ### 5. Common Mistakes
          - Lifting your glutes off the seat during extension
          - Using momentum or swinging the weight
          - Not achieving full knee extension at the top
          - Letting the weight stack rest between reps
          - Moving too quickly through the repetitions
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Adjust seat and pad positions for proper knee alignment
          - Start with light weight to establish proper form
          - Avoid this exercise if you have knee issues; consult a professional
          - Advanced variation: perform one leg at a time or add a pause at extension

    muscles:
      primary:
        ids:
          - rectus_femoris_l
          - rectus_femoris_r
          - vastus_lateralis_l
          - vastus_lateralis_r
          - vastus_medialis_l
          - vastus_medialis_r
      secondary: {}
  "Leg Press":
    category: Machine
    target: Legs
    i18n:
      en:
        name: "Leg Press"
        instructions: |
          ## Overview
          The leg press is a compound lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It uses a guided machine to provide stable resistance while allowing for heavy loading with reduced stress on the lower back compared to free weight squats.

          ## How to Perform
          ### 1. Starting Position
          - Sit in the leg press machine with your back and hips firmly against the pads
          - Position your feet shoulder-width apart on the platform
          - Keep your feet flat with toes pointing slightly outward
          - Unlock the safety handles
          - Keep your core engaged and hands on the handles

          ### 2. Movement
          1. Lower the platform by bending your knees toward your chest
          2. Continue until your knees reach approximately 90 degrees
          3. Pause briefly at the bottom
          4. Drive through your heels to press the platform back up
          5. Extend your legs without locking your knees completely
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower the platform down
          - Exhale as you press the platform back up

          ### 4. Tips
          - Keep your back and hips pressed firmly against the pads
          - Drive through your entire foot, not just your toes
          - Avoid locking your knees completely at full extension
          - Keep your knees tracking over your toes
          - Maintain constant tension throughout the movement

          ### 5. Common Mistakes
          - Lifting your glutes or lower back off the pad
          - Locking knees completely at full extension
          - Allowing the knees to cave inward
          - Not achieving adequate depth (at least 90 degrees)
          - Using too much weight and compromising form
          - Placing feet too low on the platform, increasing knee stress

          ### 6. Safety / Modifications
          - Adjust foot position (higher, lower, wider, narrower) to target different muscles
          - Never lock out your knees completely to protect the joint
          - Start with moderate weight to master proper form
          - Advanced variation: perform single-leg leg press or add a pause at the bottom

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Lunge (Barbell)":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Lunge (Barbell)"
        instructions: |
          ## Overview
          The barbell lunge is a unilateral lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core and stabilizer muscles, using a barbell across the upper back to add resistance while challenging balance and coordination.

          ## How to Perform
          ### 1. Starting Position
          - Position a barbell across your upper back as you would for a squat
          - Stand with feet hip-width apart
          - Keep your chest up, core engaged, and eyes forward
          - Grip the bar with hands slightly wider than shoulder-width
          - Maintain good posture throughout

          ### 2. Movement
          1. Step forward with one leg into a long stride
          2. Lower your hips by bending both knees
          3. Continue until your front thigh is parallel to the floor
          4. Keep your front knee aligned over your ankle
          5. Push through your front heel to return to standing position
          6. Repeat on the same leg or alternate legs for desired reps

          ### 3. Breathing
          - Inhale as you step forward and lower down
          - Exhale as you push back to standing

          ### 4. Tips
          - Keep your torso upright throughout the movement
          - Ensure your front knee doesn't extend past your toes
          - Push through your front heel, not your toes
          - Take a long enough stride to maintain balance
          - Keep the barbell stable on your upper back

          ### 5. Common Mistakes
          - Leaning too far forward during the lunge
          - Allowing the front knee to cave inward
          - Taking too short a stride, causing knee stress
          - Not achieving adequate depth
          - Letting the back knee slam into the floor
          - Losing balance or wobbling during the movement

          ### 6. Safety / Modifications
          - Start with bodyweight lunges to master balance before adding a barbell
          - Perform walking lunges to maintain momentum
          - Use dumbbells instead if barbell feels unstable
          - Advanced variation: add a deficit by stepping onto a platform with your front foot

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Lunge (Bodyweight)":
    category: Reps Only
    target: Legs
    i18n:
      en:
        name: "Lunge (Bodyweight)"
        instructions: |
          ## Overview
          The bodyweight lunge is a unilateral lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core and stabilizer muscles, using body weight alone to build foundational single-leg strength, balance, and coordination.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart
          - Keep your chest up, core engaged, and eyes forward
          - Place your hands on your hips or at your sides
          - Maintain good posture throughout

          ### 2. Movement
          1. Step forward with one leg into a long stride
          2. Lower your hips by bending both knees
          3. Continue until your front thigh is parallel to the floor
          4. Keep your front knee aligned over your ankle
          5. Push through your front heel to return to standing position
          6. Repeat on the same leg or alternate legs for desired reps

          ### 3. Breathing
          - Inhale as you step forward and lower down
          - Exhale as you push back to standing

          ### 4. Tips
          - Keep your torso upright throughout the movement
          - Ensure your front knee doesn't extend past your toes
          - Push through your front heel, not your toes
          - Take a long enough stride to maintain balance
          - Focus on controlled movement in both directions

          ### 5. Common Mistakes
          - Leaning too far forward during the lunge
          - Allowing the front knee to cave inward
          - Taking too short a stride, causing knee stress
          - Not achieving adequate depth
          - Letting the back knee slam into the floor
          - Using momentum instead of controlled movement

          ### 6. Safety / Modifications
          - Hold onto a support for balance initially
          - Perform walking lunges to maintain momentum
          - Reduce range of motion if you experience knee discomfort
          - Advanced variation: add dumbbells, jump lunges, or walking lunges

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Lunge (Dumbbell)":
    category: Dumbbell
    target: Legs
    i18n:
      en:
        name: "Lunge (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell lunge is a unilateral lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core and stabilizer muscles, using dumbbells held at the sides to add resistance while maintaining better balance than barbell variations.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a dumbbell in each hand
          - Let the dumbbells hang at your sides with arms straight
          - Keep your chest up, core engaged, and eyes forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Step forward with one leg into a long stride
          2. Lower your hips by bending both knees
          3. Continue until your front thigh is parallel to the floor
          4. Keep your front knee aligned over your ankle
          5. Push through your front heel to return to standing position
          6. Repeat on the same leg or alternate legs for desired reps

          ### 3. Breathing
          - Inhale as you step forward and lower down
          - Exhale as you push back to standing

          ### 4. Tips
          - Keep your torso upright throughout the movement
          - Ensure your front knee doesn't extend past your toes
          - Push through your front heel, not your toes
          - Let the dumbbells hang naturally at your sides
          - Take a long enough stride to maintain balance

          ### 5. Common Mistakes
          - Leaning too far forward during the lunge
          - Allowing the front knee to cave inward
          - Taking too short a stride, causing knee stress
          - Not achieving adequate depth
          - Letting the back knee slam into the floor
          - Swinging the dumbbells for momentum

          ### 6. Safety / Modifications
          - Start with light dumbbells to master balance and form
          - Perform walking lunges to maintain momentum
          - Hold one dumbbell to work on single-side stability
          - Advanced variation: add a deficit, perform jump lunges, or increase dumbbell weight

    muscles:
