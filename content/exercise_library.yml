  "Pullover (Dumbbell)":
    category: Dumbbell
    target: Chest
    i18n:
      en:
        name: "Pullover (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell pullover is a compound exercise that primarily targets the pectoralis major and latissimus dorsi. It also engages the triceps and serratus anterior, using a unique overhead arc motion that stretches and contracts both chest and back muscles.

          ## How to Perform
          ### 1. Starting Position
          - Lie perpendicular across a flat bench with only your upper back supported
          - Hold a single dumbbell with both hands above your chest
          - Grip the dumbbell by cupping the inner plate with both palms
          - Keep your hips slightly lower than your shoulders
          - Plant your feet flat on the floor for stability

          ### 2. Movement
          1. Lower the dumbbell in an arc behind your head
          2. Keep a slight bend in your elbows throughout
          3. Continue until you feel a stretch in your chest and lats
          4. Pause briefly at the bottom
          5. Pull the dumbbell back to the starting position in the same arc
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale deeply as you lower the dumbbell behind your head
          - Exhale as you pull the dumbbell back up

          ### 4. Tips
          - Keep your hips slightly dropped throughout to maximize stretch
          - Maintain a slight bend in your elbows throughout
          - Focus on the stretch in your chest and lats at the bottom
          - Control the weight throughout the entire arc
          - Keep your core engaged for stability

          ### 5. Common Mistakes
          - Using too much weight and losing control
          - Straightening the arms completely
          - Bending the elbows too much, turning it into a triceps extension
          - Not achieving a full stretch at the bottom
          - Moving too quickly through the repetitions
          - Raising the hips too high and losing the stretch

          ### 6. Safety / Modifications
          - Start with a moderate dumbbell to master the arc motion
          - Keep elbows slightly bent to protect shoulder and elbow joints
          - Perform on a flat bench lying lengthwise for more stability
          - Advanced variation: pause for 2-3 seconds at the bottom stretch

