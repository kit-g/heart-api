  "Reverse Grip Concentration Curl (Dumbbell)":
    category: Dumbbell
    target: Arms
    i18n:
      en:
        name: "Reverse Grip Concentration Curl (Dumbbell)"
        instructions: |
          ## Overview
          The reverse grip concentration curl is an isolation exercise that primarily targets the brachioradialis and brachialis with maximum focus. It also engages the biceps brachii and forearm extensors, using the seated, braced position with an overhand grip to eliminate momentum.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a bench with your legs spread wide
          - Hold a dumbbell in one hand with an overhand grip (palm facing down)
          - Place the back of your upper arm against your inner thigh
          - Lean forward slightly and brace your free hand on your opposite thigh
          - Keep your chest up and core engaged

          ### 2. Movement
          1. Curl the dumbbell upward while maintaining the overhand grip
          2. Keep your upper arm pressed firmly against your inner thigh throughout
          3. Continue lifting until your forearm is near vertical
          4. Pause and squeeze at the top of the movement
          5. Slowly lower the dumbbell back to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you curl the dumbbell up
          - Inhale as you lower the dumbbell back down

          ### 4. Tips
          - Keep your upper arm completely stationary against your thigh
          - Maintain the overhand grip throughout the entire movement
          - Focus on pure muscle contraction without any body movement
          - Keep your wrist in a neutral position
          - Control the weight throughout the entire range of motion

          ### 5. Common Mistakes
          - Lifting the elbow off the thigh during the curl
          - Allowing the wrist to curl upward instead of staying neutral
          - Using momentum or swinging the weight
          - Not achieving full range of motion
          - Leaning back or rocking the torso
          - Using too much weight and compromising strict form

          ### 6. Safety / Modifications
          - Start with a lighter weight than standard concentration curls
          - Keep your back straight to avoid lower back strain
          - Advanced variation: add a 3-5 second pause at peak contraction
          - Focus on the squeeze in your forearm and outer biceps

