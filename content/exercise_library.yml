          - hamstrings
  "Press Under (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Press Under (Barbell)"
        instructions: |
          ## Overview
          The press under is an Olympic lifting accessory exercise that targets the shoulders, triceps, and core. It teaches the movement pattern of pressing under the barbell during the catch phase of snatches and jerks, building speed, positioning, and confidence.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a barbell at chest height
          - Use your snatch or jerk grip width depending on which lift you're training
          - Keep your chest up, core engaged, and elbows slightly below the bar
          - The bar should rest on your front shoulders for jerk practice

          ### 2. Movement
          1. Press the bar slightly overhead while simultaneously dropping under it
          2. Move your feet out to your receiving stance as you press
          3. Lock your arms out completely in the overhead position
          4. Land in a partial squat with the bar stable overhead
          5. Stand up fully with the bar overhead
          6. Return the bar to the starting position and repeat

          ### 3. Breathing
          - Inhale before initiating the press
          - Hold your breath during the press and drop
          - Exhale after achieving the lockout position

          ### 4. Tips
          - This is a skill-building accessory for Olympic lifts
          - Focus on speed moving under the bar, not pressing power
          - The press is minimal; emphasis is on dropping under
          - Practice the footwork pattern for your jerk or snatch
          - Use light weight to develop speed and confidence

          ### 5. Common Mistakes
          - Pressing too much instead of dropping under
          - Not moving feet to proper receiving position
          - Hesitating instead of committing to the movement
          - Using too much weight and slowing down
          - Not achieving full lockout overhead
          - Poor bar path during the press

          ### 6. Safety / Modifications
          - Start with PVC pipe or empty bar to learn the pattern
          - This is a teaching tool, not a strength exercise
          - Keep weight light to maintain speed
          - Essential for learning the split jerk and snatch

