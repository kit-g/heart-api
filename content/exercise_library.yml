  "Incline Bench Press (Cable)":
    category: Machine
    target: Chest
    i18n:
      en:
        name: "Incline Bench Press (Cable)"
        instructions: |
          ## Overview
          The cable incline bench press is a machine-based pressing exercise that primarily targets the upper pectoralis major. It also engages the front deltoids and triceps, using cables on an incline to provide constant tension throughout the movement for effective upper chest development.

          ## How to Perform
          ### 1. Starting Position
          - Set an adjustable bench to a 30-45 degree incline between two low cable pulleys
          - Attach handles to both low pulleys and set appropriate weight
          - Lie back on the incline bench with your feet firmly planted on the floor
          - Grip both handles with arms extended, hands at upper chest level
          - Keep your shoulder blades retracted and pressed into the bench

          ### 2. Movement
          1. Lower the handles slowly toward your upper chest by bending your elbows
          2. Keep your elbows at about a 45-degree angle from your body
          3. Lower until your hands are beside your upper chest
          4. Pause briefly at the bottom
          5. Press the handles back up by extending your arms
          6. Stop just before full lockout to maintain tension, then repeat

          ### 3. Breathing
          - Inhale as you lower the handles toward your chest
          - Exhale as you press the handles back up

          ### 4. Tips
          - Maintain constant tension by not fully locking out at the top
          - Keep your shoulder blades retracted throughout
          - Focus on squeezing your upper chest at the top
          - Control both the lowering and pressing phases equally
          - Keep your feet flat and core engaged for stability

          ### 5. Common Mistakes
          - Fully locking out and losing tension on the chest
          - Allowing the elbows to flare out excessively
          - Using momentum instead of controlled movement
          - Lifting the glutes off the bench
          - Not maintaining shoulder blade retraction
          - Setting the incline too steep, shifting emphasis to shoulders

          ### 6. Safety / Modifications
          - Start with light weight to master the cable press pattern on an incline
          - Adjust incline angle between 30-45 degrees for optimal upper chest engagement
          - Use one arm at a time for unilateral training
          - Advanced variation: add a pause at the bottom for increased intensity

