        instructions: |
          ## Overview
          The incline dumbbell curl is an isolation exercise that primarily targets the biceps brachii with an extended range of motion. It also engages the brachialis and brachioradialis, using the inclined position to create a greater stretch on the biceps at the start of each rep.

          ## How to Perform
