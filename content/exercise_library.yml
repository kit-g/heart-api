  "Chest Fly":
    category: Machine
    target: Chest
    i18n:
      en:
        name: "Chest Fly"
        instructions: |
          ## Overview
          The machine chest fly is an isolation exercise that primarily targets the pectoralis major. It also engages the front deltoids minimally, using a fixed movement path to provide stability and consistent resistance throughout the fly motion.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the chest fly machine with your back firmly against the pad
          - Adjust the seat height so the handles align with your mid-chest
          - Grip the handles with arms extended out to the sides
          - Keep a slight bend in your elbows throughout
          - Plant your feet flat on the floor and engage your core

          ### 2. Movement
          1. Bring both handles together in front of your chest
          2. Keep your elbows slightly bent in a hugging motion
          3. Continue until the handles meet or nearly touch
          4. Squeeze your chest hard at the peak contraction
          5. Slowly return your arms to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you bring the handles together
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep a consistent elbow bend throughout the movement
          - Focus on squeezing your chest at the peak
          - Maintain constant tension by not letting the weight stack rest
          - Keep your back pressed firmly against the pad
          - Control both the squeezing and opening phases

          ### 5. Common Mistakes
          - Straightening the arms completely during the movement
          - Using momentum instead of controlled muscle contraction
          - Letting the weight stack rest between reps
          - Lifting your back off the pad
          - Moving too quickly and losing the squeeze
          - Using too much weight and bending elbows excessively

          ### 6. Safety / Modifications
          - Adjust seat height to ensure handles align with your chest
          - Start with light weight to establish mind-muscle connection
          - Advanced variation: pause for 2-3 seconds at peak contraction
          - Adjust handle position for different stretch depths

