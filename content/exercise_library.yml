    i18n:
      en:
        name: "Incline Bench Press (Barbell)"
        instructions: |
          ## Overview
          The incline barbell bench press is a compound pressing exercise that primarily targets the upper pectoralis major. It also engages the front deltoids and triceps, using an inclined bench position to emphasize the upper chest and build overall pressing strength.

          ## How to Perform
          ### 1. Starting Position
          - Set an adjustable bench to a 30-45 degree incline
          - Lie back on the bench with your feet firmly planted on the floor
          - Position yourself so your eyes are under the bar
          - Grip the bar with hands slightly wider than shoulder-width apart
          - Unrack the bar and hold it with arms extended above your upper chest

          ### 2. Movement
          1. Lower the bar slowly to your upper chest or collarbone
          2. Keep your elbows at about a 45-degree angle from your body
          3. Touch the bar lightly to your chest
          4. Pause briefly at the bottom
          5. Press the bar back up by extending your arms
          6. Lock out your elbows at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower the bar to your chest
          - Exhale as you press the bar back up

          ### 4. Tips
          - Keep your shoulder blades retracted throughout
          - Maintain the incline angle of 30-45 degrees for optimal upper chest engagement
          - Control the descent and avoid bouncing the bar
          - Keep your feet flat and core engaged for stability
          - Focus on squeezing your upper chest at the top

          ### 5. Common Mistakes
          - Setting the incline too steep (over 45 degrees), shifting emphasis to shoulders
          - Bouncing the bar off the chest
          - Allowing the elbows to flare out excessively
          - Lifting the glutes off the bench
          - Not achieving full range of motion
