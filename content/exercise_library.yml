  "Incline Bench Press (Smith Machine)":
    category: Machine
    target: Chest
    i18n:
      en:
        name: "Incline Bench Press (Smith Machine)"
        instructions: |
          ## Overview
          The Smith machine incline bench press is a guided pressing exercise that primarily targets the upper pectoralis major. It also engages the front deltoids and triceps, using a fixed vertical bar path on an incline to provide stability and emphasize the upper chest.

          ## How to Perform
          ### 1. Starting Position
          - Set an adjustable bench to a 30-45 degree incline under the Smith machine bar
          - Lie back on the bench with your upper chest aligned under the bar
          - Grip the bar with hands slightly wider than shoulder-width apart
          - Unrack the bar by rotating it and hold with arms extended
          - Keep your shoulder blades retracted and feet flat on the floor

          ### 2. Movement
          1. Lower the bar slowly to your upper chest or collarbone
          2. Keep your elbows at about a 45-degree angle from your body
          3. Touch the bar lightly to your chest
          4. Pause briefly at the bottom
          5. Press the bar back up by extending your arms
          6. Lock out your elbows at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower the bar to your chest
          - Exhale as you press the bar back up

          ### 4. Tips
          - Position the bench so the bar path aligns naturally with your press
          - Keep your shoulder blades retracted throughout
          - Focus on squeezing your upper chest at the top
          - Take advantage of the fixed path for controlled reps
          - Maintain a 30-45 degree incline for optimal upper chest engagement

          ### 5. Common Mistakes
          - Positioning the bench incorrectly relative to the bar path
          - Setting the incline too steep, shifting emphasis to shoulders
          - Bouncing the bar off the chest
          - Allowing the elbows to flare out excessively
          - Not achieving full range of motion
          - Relying too heavily on the machine's stability

          ### 6. Safety / Modifications
          - Adjust bench position to ensure natural bar path over your upper chest
          - Use the safety catches at appropriate height
          - Adjust incline angle between 30-45 degrees based on comfort
          - Advanced variation: use slow negatives or add chains

