  "Knee Raise (Captain's Chair)":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Knee Raise (Captain's Chair)"
        validated: true
        instructions: |
          ## Overview
          The captain's chair knee raise is a supported core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the obliques and transverse abdominis for stability, offering more support than hanging variations while still providing an effective lower ab workout.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself in the captain's chair with your back firmly against the pad
          - Place your forearms on the armrests and grip the handles
          - Let your legs hang straight down with feet off the ground
          - Engage your core and keep your shoulders pressed down
          - Maintain an upright posture throughout the movement

          ### 2. Movement
          1. Lift your knees toward your chest by contracting your lower abs
          2. Continue raising your knees until they reach at least hip level or higher
          3. Keep the movement controlled and avoid swinging
          4. Pause briefly at the top of the movement
          5. Slowly lower your knees back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you lift your knees toward your chest
          - Inhale as you lower your knees back to the starting position

          ### 4. Tips
          - Focus on using your core to lift your knees, not just your hip flexors
          - Keep your back pressed against the pad throughout the movement
          - Avoid swinging or using momentum to raise your legs
          - Think about bringing your hips forward and up, not just your knees
          - Maintain steady breathing and avoid holding your breath

          ### 5. Common Mistakes
          - Using momentum and swinging instead of controlled muscle contraction
          - Arching the lower back away from the pad
          - Only lifting the knees partially without engaging the lower abs fully
          - Allowing the shoulders to shrug up toward the ears
          - Moving too quickly and losing control
          - Not bringing knees high enough to fully engage the abs

          ### 6. Safety / Modifications
          - Beginners can start with smaller raises, not bringing knees as high
          - Advanced variation: pause for 2-3 seconds at the top of each rep
          - Progress to captain's chair leg raises by extending your legs straight
          - If you experience shoulder discomfort, adjust your grip or arm position

