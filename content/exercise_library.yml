  "Stretching":
    category: Duration
    target: Other
    i18n:
      en:
        name: "Stretching"
        instructions: |
          ## Overview
          Stretching is a flexibility exercise that targets multiple muscle groups throughout the body. It helps improve range of motion, reduce muscle tension, and promote recovery, making it essential for overall mobility and injury prevention.

          ## How to Perform
          ### 1. Starting Position
          - Choose a comfortable space with enough room to move freely
          - Wear comfortable, non-restrictive clothing
          - Begin with light movement to warm up your muscles
          - Focus on areas that feel tight or will be used in your workout

          ### 2. Movement
          1. Select stretches targeting your desired muscle groups
          2. Move slowly into each stretch until you feel gentle tension
          3. Hold each stretch for 15-30 seconds without bouncing
          4. Breathe deeply and relax into each position
          5. Release slowly and move to the next stretch
          6. Continue for your desired duration

          ### 3. Breathing
          - Breathe slowly and deeply throughout each stretch
          - Exhale as you deepen into a stretch
          - Never hold your breath while stretching

          ### 4. Tips
          - Stretch after workouts when muscles are warm
          - Focus on major muscle groups and areas of tightness
          - Stretching should feel comfortable, never painful
          - Include both upper and lower body stretches
          - Consistency is more important than duration

          ### 5. Common Mistakes
          - Bouncing or jerking movements during stretches
          - Pushing into painful ranges of motion
          - Holding your breath during stretches
          - Rushing through stretches without proper hold time
          - Stretching cold muscles without warming up
          - Neglecting certain muscle groups

          ### 6. Safety / Modifications
          - Never stretch to the point of sharp pain
          - Use props like yoga blocks or straps if needed
          - Reduce intensity if recovering from injury
          - Consider dynamic stretching before workouts and static after

