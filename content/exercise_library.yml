  "Skating":
    category: Cardio
    target: Cardio
    i18n:
      en:
        name: "Skating"
        instructions: |
          ## Overview
          Skating (ice skating, roller skating, or inline skating) is a cardiovascular activity that targets the legs, glutes, and core. It builds balance, coordination, leg strength, and provides effective aerobic conditioning while being relatively low-impact on joints.

          ## How to Perform
          ### 1. Starting Position
          - Wear appropriate skates that fit properly
          - Use protective gear (helmet, knee pads, wrist guards)
          - Start in a stable, balanced stance
          - Keep knees slightly bent
          - Maintain an athletic posture

          ### 2. Movement
          1. Push off with one leg at an angle
          2. Glide on the opposite leg
          3. Shift weight and push with the other leg
          4. Maintain a rhythmic side-to-side motion
          5. Keep your core engaged and knees bent
          6. Continue skating for your desired duration

          ### 3. Breathing
          - Breathe steadily and rhythmically throughout
          - Adjust pace to maintain comfortable breathing
          - Take breaks if needed when learning

          ### 4. Tips
          - Bend your knees for better balance and power
          - Push to the side, not straight back
          - Keep your weight over your skates
          - Relax and find your rhythm
          - Practice stopping techniques before building speed

          ### 5. Common Mistakes
          - Standing too upright with locked knees
          - Pushing straight back instead of to the side
          - Not wearing proper safety equipment
          - Skating beyond current skill level
          - Looking down at feet instead of forward
          - Tensing up instead of staying relaxed

          ### 6. Safety / Modifications
          - Always wear appropriate protective gear
          - Learn proper falling techniques
          - Start on smooth, flat surfaces
          - Take lessons from qualified instructors for faster progression

