        name: "Upright Row (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell upright row is a compound upper body exercise that primarily targets the middle deltoids and upper trapezius. It also engages the front deltoids and biceps, using dumbbells for independent arm movement to build shoulder width and upper trap development.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart holding a dumbbell in each hand
          - Let the dumbbells hang at arm's length in front of your thighs
          - Keep your palms facing your body
          - Stand upright with chest up and core engaged
          - Maintain good posture throughout

          ### 2. Movement
          1. Pull the dumbbells straight up along your body
          2. Lead with your elbows, keeping them higher than your hands
          3. Continue pulling until dumbbells reach upper chest or shoulder height
          4. Pause briefly at the top
          5. Slowly lower the dumbbells back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the dumbbells up
          - Inhale as you lower the dumbbells back down

          ### 4. Tips
          - Keep the dumbbells close to your body as you pull
          - Lead with your elbows throughout the movement
          - Focus on pulling with your shoulders and traps
          - Control both the pulling and lowering phases
          - The dumbbells allow for a more natural arm path

          ### 5. Common Mistakes
          - Pulling too high and straining the shoulders
          - Allowing the elbows to drop below the wrists
          - Using momentum or swinging the body
          - Leaning backward during the pull
          - Using too wide a grip, which can cause shoulder impingement
          - Moving too quickly and losing control

          ### 6. Safety / Modifications
          - Use a moderate grip width to avoid shoulder discomfort
          - Stop at shoulder height if you experience any shoulder pain
          - Start with light dumbbells to master the movement pattern
          - If you experience shoulder discomfort, consider face pulls as an alternative
