  "Shrug (Barbell)":
    category: Barbell
    target: Shoulders
    i18n:
      en:
        name: "Shrug (Barbell)"
        instructions: |
          ## Overview
          The barbell shrug is an isolation exercise that primarily targets the upper trapezius muscles. It also engages the levator scapulae and rhomboids, using a barbell to provide heavy loading for building thick, powerful traps and improving shoulder stability.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a barbell
          - Grip the bar with hands slightly wider than shoulder-width, palms facing your body
          - Let the bar hang at arm's length in front of your thighs
          - Keep your arms straight with a slight bend in your elbows
          - Stand upright with chest up and core engaged

          ### 2. Movement
          1. Elevate your shoulders straight up toward your ears
          2. Keep your arms straight throughout the movement
          3. Shrug as high as possible, focusing on your traps
          4. Pause and squeeze your traps at the top
          5. Slowly lower your shoulders back to the starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you shrug your shoulders up
          - Inhale as you lower your shoulders back down

          ### 4. Tips
          - Focus on moving your shoulders straight up, not rolling them
          - Keep your arms straight throughout the movement
          - Squeeze your traps hard at the top of each rep
          - Avoid using momentum or jerking the weight
          - The barbell allows for heavy loading of the traps

          ### 5. Common Mistakes
          - Rolling the shoulders instead of shrugging straight up
          - Bending the elbows and turning it into a row
          - Using momentum or jerking the weight
          - Not achieving full range of motion
          - Shrugging forward or backward instead of straight up
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Start with moderate weight to master the straight-up shrugging motion
          - Use lifting straps if grip strength is limiting
          - Perform behind-the-back barbell shrugs for variation
          - If you experience neck discomfort, reduce weight and ensure proper form

