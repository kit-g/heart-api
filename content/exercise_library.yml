  "Reverse Fly (Dumbbell)":
    category: Dumbbell
    target: Shoulders
    i18n:
      en:
        name: "Reverse Fly (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell reverse fly is an isolation exercise that primarily targets the rear deltoids and upper back. It also engages the rhomboids and middle trapezius, using dumbbells with a bent-over position to build rear shoulder strength, improve posture, and balance shoulder development.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a dumbbell in each hand
          - Hinge forward at the hips until your torso is nearly parallel to the floor
          - Let the dumbbells hang below your chest with palms facing each other
          - Keep a slight bend in your knees and maintain a flat back
          - Engage your core throughout

          ### 2. Movement
          1. Raise both dumbbells out to the sides in a wide arc
          2. Keep your elbows slightly bent throughout the movement
          3. Focus on squeezing your shoulder blades together
          4. Continue until your arms are parallel to the floor
          5. Pause and squeeze your rear delts at the top
          6. Slowly lower the dumbbells back to the starting position and repeat

          ### 3. Breathing
          - Exhale as you raise the dumbbells to the sides
          - Inhale as you lower them back down

          ### 4. Tips
          - Focus on pulling with your rear delts and upper back
          - Keep your elbows slightly bent in a fixed position
          - Squeeze your shoulder blades together at the top
          - Maintain a flat back throughout the movement
          - Control both the raising and lowering phases

          ### 5. Common Mistakes
          - Straightening the arms completely during the movement
          - Rounding the back instead of maintaining a flat spine
          - Using momentum or swinging the dumbbells
          - Not squeezing the shoulder blades together
          - Raising the dumbbells too high
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with light dumbbells to master the bent-over position
          - Perform seated while leaning forward for added stability
          - Perform on an incline bench face down for support
          - If you experience lower back discomfort, use a supported variation

