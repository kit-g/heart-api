  "Rowing (Machine)":
    category: Cardio
    target: Cardio
    i18n:
      en:
        name: "Rowing (Machine)"
        instructions: |
          ## Overview
          The rowing machine is a full-body cardiovascular exercise that targets the legs, back, core, and arms. It provides low-impact aerobic conditioning while building strength and endurance through a rowing motion that engages approximately 85% of body muscles.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the rower with feet secured in the foot straps
          - Grip the handle with an overhand grip
          - Start with shins vertical and body leaning slightly forward
          - Keep your back straight and core engaged
          - Arms should be extended reaching for the handle

          ### 2. Movement
          1. Push through your legs to begin the drive
          2. Once legs are extended, lean back slightly and pull handle to chest
          3. Reverse the motion: extend arms, lean forward, bend knees
          4. Maintain a smooth, continuous rhythm
          5. The drive should be powerful, the recovery controlled
          6. Continue rowing for your desired duration or distance

          ### 3. Breathing
          - Exhale during the drive (power phase)
          - Inhale during the recovery

          ### 4. Tips
          - The power comes from your legs (60%), core (20%), then arms (20%)
          - Maintain good posture throughout the stroke
          - Keep the handle moving smoothly and steadily
          - Aim for a consistent stroke rate (20-30 strokes per minute)
          - Watch the display for feedback on pace and power

          ### 5. Common Mistakes
          - Using only arms instead of legs for power
          - Rounding the back during the stroke
          - Pulling with bent arms before legs are extended
          - Gripping the handle too tightly
          - Rushing the recovery phase
          - Leaning back too far at the finish

          ### 6. Safety / Modifications
          - Start with short sessions to learn proper form
          - Adjust foot strap position for comfort
          - Reduce resistance (damper setting) for longer sessions
          - This provides excellent full-body low-impact cardio

