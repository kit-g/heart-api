    i18n:
      en:
        name: "Seated Calf Raise (Plate Loaded)"
        instructions: |
          ## Overview
          The plate-loaded seated calf raise is an isolation exercise that primarily targets the soleus muscle of the calf. It also engages the gastrocnemius, using weight plates placed on the thighs in a seated position to emphasize the soleus for complete calf development.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a bench with a step or platform in front of you
