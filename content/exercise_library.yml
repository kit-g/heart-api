        instructions: |
          ## Overview
          The seated wide-grip cable row is a horizontal pulling exercise that primarily targets the latissimus dorsi with emphasis on the outer back. It also engages the rhomboids, middle trapezius, and rear deltoids, using a wider grip to target upper back width and improve posture.

