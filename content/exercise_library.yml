  "Battle Ropes":
    category: Cardio
    target: Cardio
    i18n:
      en:
        name: "Battle Ropes"
        instructions: |
          ## Overview
          Battle ropes are a high-intensity cardiovascular and strength exercise that targets the shoulders, arms, core, and legs. Using thick, heavy ropes to create waves and patterns, it builds power, endurance, grip strength, and provides an effective full-body metabolic workout.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing the anchor point with feet shoulder-width apart
          - Hold one end of each rope in each hand
          - Maintain a slight bend in your knees with core engaged
          - Keep your back straight and chest up
          - Position yourself at a distance where the ropes have slight slack

          ### 2. Movement
          1. Choose a rope pattern (alternating waves, double waves, slams, etc.)
          2. Create powerful, rhythmic waves by moving your arms
          3. Maintain the movement for a set time interval
          4. Keep your core engaged and use your whole body
          5. Generate continuous waves without stopping
          6. Continue for the desired work interval (typically 20-60 seconds)

          ### 3. Breathing
          - Breathe steadily and rhythmically throughout
          - Exhale with effort during intense portions
          - Avoid holding your breath

          ### 4. Tips
          - Engage your core to protect your lower back
          - Use your hips and legs, not just your arms
          - Start with shorter intervals and build endurance
          - Various wave patterns target different muscle groups
          - This is excellent for high-intensity interval training

          ### 5. Common Mistakes
          - Using only arms instead of full body
          - Standing too upright without athletic stance
          - Not creating consistent wave patterns
          - Holding your breath during the work
          - Starting with intervals that are too long
          - Poor posture with rounded back

          ### 6. Safety / Modifications
          - Start with lighter ropes or shorter intervals
          - Reduce intensity by creating smaller waves
          - Alternate between different wave patterns
          - Rest adequately between intervals

    muscles:
      primary:
        groups:
          - arms
          - shoulders
      secondary:
        groups:
          - core
  "Climbing":
    category: Duration
    target: Cardio
    i18n:
      en:
        name: "Climbing"
        instructions: |
          ## Overview
          Climbing is a full-body cardiovascular and strength activity that targets the back, arms, core, and legs. Whether rock climbing, wall climbing, or rope climbing, it builds grip strength, muscular endurance, problem-solving skills, and cardiovascular fitness.

          ## How to Perform
          ### 1. Starting Position
          - Approach the climbing wall or surface with appropriate safety gear
          - Assess your route before beginning
          - Wear climbing shoes and use chalk if needed
          - Ensure proper belay setup for safety if applicable
          - Start from a stable position

          ### 2. Movement
          1. Plan your route and identify handholds and footholds
          2. Use your legs to push up rather than pulling with arms alone
          3. Maintain three points of contact when possible
          4. Shift your weight efficiently between holds
          5. Pace yourself to maintain endurance throughout the climb
          6. Continue climbing for your desired duration or route

          ### 3. Breathing
          - Breathe steadily throughout the climb
          - Take brief breaks on stable holds if needed
          - Avoid holding your breath during difficult sections

          ### 4. Tips
          - Use your legs to push, not just arms to pull
          - Keep your hips close to the wall for better balance
          - Look ahead to plan your next several moves
          - Rest on good holds when you find them
          - Focus on technique over pure strength

          ### 5. Common Mistakes
          - Over-gripping holds and wasting energy
          - Relying too much on arms instead of legs
          - Not planning ahead and getting stuck
          - Climbing too quickly and exhausting yourself
          - Poor body positioning away from the wall
          - Not resting on good holds

          ### 6. Safety / Modifications
          - Always climb with proper safety equipment and supervision
          - Start with easier routes and progress gradually
          - Consider bouldering (low heights, crash pads) for beginners
          - Learn proper technique from experienced climbers or instructors

    muscles:
      primary:
        groups:
          - legs
      secondary:
        groups:
          - core
  "Cycling":
    category: Cardio
    target: Cardio
    i18n:
      en:
        name: "Cycling"
        instructions: |
          ## Overview
          Cycling is a cardiovascular exercise that primarily targets the quadriceps, hamstrings, and glutes. Whether outdoors or on a stationary bike, it provides low-impact aerobic conditioning while building leg strength, endurance, and cardiovascular fitness.

          ## How to Perform
          ### 1. Safety 
          - Wear a helmet when cycling outdoors
          - Start with shorter durations and build endurance
          - Adjust intensity by changing resistance or terrain
          - Consider indoor cycling for weather or safety concerns

