  "Snatch Pull (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Snatch Pull (Barbell)"
        instructions: |
          ## Overview
          The snatch pull is an Olympic lifting accessory exercise that targets the posterior chain, traps, and shoulders. It isolates the pulling portion of the snatch without the catch, allowing heavier loads to develop pulling strength and reinforce proper bar path.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, barbell over mid-foot
          - Grip the bar with a wide snatch grip
          - Hinge at hips and bend knees to reach the bar
          - Keep your back flat, chest up, and shoulders over the bar
          - Engage your lats and core before pulling

          ### 2. Movement
          1. Drive explosively through your legs to lift the bar off the floor
          2. Keep the bar close to your body as it travels upward
          3. Extend your hips and knees powerfully at mid-thigh
          4. Shrug your shoulders and rise onto your toes at full extension
          5. Lower the bar back to the floor with control
          6. Repeat for the desired number of powerful reps

          ### 3. Breathing
          - Take a deep breath before pulling
          - Hold your breath during the pull
          - Exhale as you lower the bar

          ### 4. Tips
          - Focus on maximum power and speed in the pull
          - Keep the bar close to your body throughout
          - This exercise allows heavier weight than full snatches
          - Emphasize the triple extension at the power position
          - Use this to develop pulling strength for snatches

          ### 5. Common Mistakes
          - Pulling with arms too early
          - Not fully extending hips and ankles
          - Letting the bar drift away from the body
          - Using too much weight and losing bar speed
          - Rounding the back during the pull
          - Not maintaining proper bar path

          ### 6. Safety / Modifications
          - Master the snatch deadlift before adding the full pull
          - Use 100-110% of your snatch max for this accessory
          - Use straps if grip is limiting
          - This is a key accessory for developing snatch strength

