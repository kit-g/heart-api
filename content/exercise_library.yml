  "Push Up":
    category: Weighted Body Weight
    target: Chest
    i18n:
      en:
        name: "Push Up"
        instructions: |
          ## Overview
          The push up is a bodyweight pressing exercise that primarily targets the pectoralis major. It also engages the front deltoids, triceps, and core, making it one of the most effective and versatile upper body exercises for building strength and endurance.

          ## How to Perform
          ### 1. Starting Position
          - Begin in a high plank position with hands slightly wider than shoulder-width apart
          - Position your hands directly under your shoulders
          - Keep your body in a straight line from head to heels
          - Engage your core and glutes throughout
          - Keep your feet together or hip-width apart

          ### 2. Movement
          1. Lower your body by bending your elbows
          2. Keep your elbows at about a 45-degree angle from your body
          3. Continue lowering until your chest nearly touches the floor
          4. Pause briefly at the bottom
          5. Press through your palms to extend your arms and return to starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up to the starting position

          ### 4. Tips
          - Maintain a straight body line from head to heels throughout
          - Keep your core and glutes engaged to prevent sagging
          - Focus on controlled movement in both directions
          - Keep your neck neutral, looking slightly ahead of your hands
          - Achieve full range of motion from chest near floor to arms fully extended

          ### 5. Common Mistakes
          - Allowing the hips to sag or pike upward
          - Flaring the elbows out excessively
          - Not achieving full range of motion
          - Letting the head drop or looking down
          - Using momentum instead of controlled movement
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Start with knee push ups if standard push ups are too challenging
          - Elevate your hands on a bench or wall for an easier variation
          - Advanced variation: add weight with a vest or resistance band across your back
          - Try different hand positions (wide, narrow, diamond) for variety

    muscles:
      primary:
        ids:
          - pectoralis_major_l
          - pectoralis_major_r
      secondary:
        groups:
          - arms
          - core
          - shoulders
