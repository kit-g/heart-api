  "Elliptical Machine":
    category: Cardio
    target: Cardio
    i18n:
      en:
        name: "Elliptical Machine"
        instructions: |
          ## Overview
          The elliptical machine is a low-impact cardiovascular exercise that targets the legs, glutes, and cardiovascular system. It mimics running motion without impact stress on joints, providing effective aerobic conditioning with options for upper body engagement.

          ## How to Perform
          ### 1. Starting Position
          - Step onto the elliptical and place feet on the pedals
          - Grip the stationary or moving handles
          - Stand upright with core engaged
          - Start with low resistance
          - Begin with a comfortable stride length

          ### 2. Movement
          1. Begin moving in a forward elliptical motion
          2. Push through your entire foot, not just toes
          3. Use arm handles for upper body engagement if desired
          4. Maintain an upright posture throughout
          5. Adjust resistance and incline for desired intensity
          6. Continue for your desired duration

          ### 3. Breathing
          - Breathe steadily and rhythmically throughout
          - Increase breathing rate with intensity
          - Never hold your breath

          ### 4. Tips
          - Keep your feet flat on the pedals throughout
          - Maintain an upright posture, avoid leaning forward
          - Use moving handles to engage upper body
          - Adjust stride length, incline, and resistance for variety
          - This is excellent for low-impact cardio conditioning

          ### 5. Common Mistakes
          - Leaning too heavily on the handles
          - Allowing heels to lift off the pedals
          - Poor posture with rounded shoulders
          - Using only toe pressure instead of full foot
          - Setting resistance too high initially
          - Not engaging core during the movement

          ### 6. Safety / Modifications
          - Start with low resistance and short duration
          - Gradually increase intensity and time
          - Ideal for those with joint concerns or recovering from injury
          - Vary incline and resistance for different training effects

    muscles:
      primary:
        groups:
          - legs
      secondary:
        groups:
          - core
  "Hiking":
    category: Cardio
    target: Cardio
    i18n:
      en:
        name: "Hiking"
        instructions: |
          ## Overview
          Hiking is an outdoor cardiovascular activity that targets the legs, glutes, and cardiovascular system. Walking on varied terrain, especially with elevation changes, builds endurance, leg strength, and provides mental health benefits from nature exposure.

          ## How to Perform
          ### 1. Safety 
          - Always tell someone your hiking plans
          - Bring a fully charged phone and map
          - Start with flat, well-marked trails
          - Gradually progress to longer distances and elevation gain

    muscles:
