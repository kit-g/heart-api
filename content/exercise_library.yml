        instructions: |
          ## Overview
          The cable overhead press is a machine-based compound exercise that primarily targets all three heads of the deltoids. It also engages the triceps and upper chest, using cables to provide constant tension throughout the pressing movement.

          ## How to Perform
          ### 1. Starting Position
          - Stand between two low cable pulleys or use a single cable
          - Attach handles to the pulleys and set appropriate weight
          - Grip the handles at shoulder height with palms facing forward
          - Stand with feet shoulder-width apart
          - Keep your chest up, core engaged, and elbows slightly forward

          ### 2. Movement
          1. Press the handles straight up overhead by extending your arms
          2. Continue pressing until your arms are fully extended
          3. Pause briefly at the top
          4. Slowly lower the handles back to shoulder level with control
          5. Stop just before losing tension on the cables
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you press the handles overhead
          - Inhale as you lower the handles back down

          ### 4. Tips
          - Maintain constant tension by not releasing the weight completely
          - Keep your core tight to prevent arching your lower back
          - Focus on pressing straight up, not forward
          - Control both the pressing and lowering phases
          - The cables provide consistent resistance throughout

          ### 5. Common Mistakes
          - Fully releasing tension at the bottom
          - Arching the lower back excessively during the press
          - Pressing forward instead of straight up
          - Not achieving full extension at the top
          - Using momentum instead of controlled movement
          - Letting the weight stack rest between reps

          ### 6. Safety / Modifications
          - Start with light weight to master the cable press pattern
          - Perform one arm at a time for unilateral focus
          - Adjust cable height and angle as needed
          - If you experience shoulder discomfort, reduce weight or check your form

