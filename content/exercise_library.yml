    category: Barbell
    target: Chest
    i18n:
      en:
        name: "Decline Bench Press (Barbell)"
        instructions: |
          ## Overview
          The decline barbell bench press is a compound pressing exercise that primarily targets the lower pectoralis major. It also engages the front deltoids and triceps, using a declined bench position to emphasize the lower chest with typically heavier loads than flat pressing.

          ## How to Perform
          ### 1. Starting Position
          - Lie on a decline bench with your feet secured under the foot pads
          - Position yourself so your eyes are directly under the bar
          - Grip the bar with hands slightly wider than shoulder-width apart
          - Unrack the bar and hold it with arms fully extended above your lower chest
          - Keep your shoulder blades retracted and pressed into the bench

          ### 2. Movement
          1. Lower the bar slowly to your lower chest
          2. Keep your elbows at about a 45-degree angle from your body
          3. Touch the bar lightly to your chest
          4. Pause briefly at the bottom
          5. Press the bar back up by extending your arms
          6. Lock out your elbows at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower the bar to your chest
          - Exhale as you press the bar back up

          ### 4. Tips
          - Keep your shoulder blades retracted throughout
          - Focus on squeezing your lower chest at the top
          - Control the descent and avoid bouncing the bar
          - Keep your feet secured to maintain stability
          - The decline angle typically allows for heavier weights

          ### 5. Common Mistakes
          - Bouncing the bar off the chest
          - Allowing the elbows to flare out excessively
          - Not securing feet properly, causing instability
          - Not achieving full range of motion
          - Using too much weight and compromising form
          - Losing shoulder blade retraction

          ### 6. Safety / Modifications
          - Always use a spotter when lifting heavy weights
          - Ensure your feet are securely anchored before unracking
          - Start with lighter weight than your flat bench press to adapt
          - If you experience shoulder discomfort, adjust your grip width

