  "Chest Fly (Band)":
    category: Weighted Body Weight
    target: Chest
    i18n:
      en:
        name: "Chest Fly (Band)"
        instructions: |
          ## Overview
          The band chest fly is a resistance-based isolation exercise that primarily targets the pectoralis major. It also engages the front deltoids, using progressive band resistance to provide increasing tension throughout the fly motion.

          ## How to Perform
          ### 1. Starting Position
          - Anchor a resistance band at chest height behind you
          - Hold one end of the band in each hand
          - Step forward to create tension with arms extended out to the sides
          - Stand in a staggered stance for stability
          - Keep a slight bend in your elbows throughout

          ### 2. Movement
          1. Bring both hands together in front of your chest
          2. Keep your elbows slightly bent in a hugging motion
          3. Continue until your hands meet at chest level
          4. Squeeze your chest hard at the peak contraction
          5. Slowly return your arms to the starting position with control
          6. Stop before losing tension on the band, then repeat

          ### 3. Breathing
          - Exhale as you bring your hands together
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep a consistent elbow bend throughout the movement
          - Focus on squeezing your chest, not pulling with your arms
          - Maintain constant tension by controlling both phases
          - Keep your core tight and body stable
          - Adjust your distance from the anchor to modify resistance

          ### 5. Common Mistakes
          - Straightening the arms completely during the movement
          - Using momentum or swinging the body
          - Not maintaining constant tension on the band
          - Leaning too far forward
          - Moving too quickly and losing the squeeze
          - Releasing all tension at the starting position

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the movement
          - Adjust distance from anchor point to modify resistance level
          - Perform one arm at a time for unilateral focus
          - Advanced variation: pause for 2-3 seconds at peak contraction

