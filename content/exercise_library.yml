exercises:
  "Ab Wheel":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Ab Wheel"
        instructions: |
          ## Overview
          The ab wheel rollout is a challenging core exercise that primarily targets the rectus abdominis and transverse abdominis. It also engages the obliques, hip flexors, and shoulders as stabilizers throughout the movement.

          ## How to Perform
          ### 1. Starting Position
          - Kneel on a mat with the ab wheel directly in front of you
          - Grip the wheel handles firmly with both hands, shoulder-width apart
          - Position your shoulders directly over the wheel
          - Keep your back straight and core engaged
          - Look down at the floor to maintain a neutral neck position

          ### 2. Movement
          1. Slowly roll the wheel forward by extending your arms and hips
          2. Keep your core tight and avoid letting your lower back sag
          3. Roll out as far as you can while maintaining control and a flat back
          4. Pause briefly at the fully extended position
          5. Pull the wheel back toward your knees by contracting your abs
          6. Return to the starting position with control

          ### 3. Breathing
          - Exhale as you roll out and extend your body
          - Inhale as you pull the wheel back to the starting position

          ### 4. Tips
          - Keep constant tension in your core throughout the entire movement
          - Move slowly and with control; speed reduces effectiveness
          - Focus on using your abs to pull you back, not your arms
          - Keep your hips stable and avoid excessive arching

          ### 5. Common Mistakes
          - Allowing the lower back to sag or hyperextend
          - Rolling out too far before building adequate strength
          - Using momentum instead of controlled movement
          - Letting the hips pike upward on the return
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Start with partial rollouts against a wall to limit range of motion
          - Perform from your knees before attempting from your feet
          - If you experience lower back discomfort, reduce your range of motion
          - Progress to standing rollouts only after mastering the kneeling version

  "Bicycle Crunch":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Bicycle Crunch"
        instructions: |
          ## Overview
          The bicycle crunch is a dynamic core exercise that primarily targets the rectus abdominis and obliques. It also engages the hip flexors and transverse abdominis as you coordinate the twisting motion with alternating leg movements.

          ## How to Perform
          ### 1. Starting Position
          - Lie on your back on a mat with your knees bent and feet flat on the floor
          - Place your hands lightly behind your head with elbows pointing out to the sides
          - Lift your shoulders slightly off the mat and engage your core
          - Raise your feet off the floor with knees bent at 90 degrees
          - Keep your lower back pressed into the mat

          ### 2. Movement
          1. Simultaneously bring your right elbow toward your left knee while extending your right leg straight
          2. Twist your torso to bring your shoulder (not just your elbow) across your body
          3. Pause briefly when your elbow and knee come close together
          4. Return to the center position with both knees bent
          5. Repeat on the opposite side, bringing your left elbow toward your right knee while extending your left leg
          6. Continue alternating sides in a smooth, controlled pedaling motion

          ### 3. Breathing
          - Exhale as you twist and bring your elbow toward your knee
          - Inhale as you return to center and switch sides

          ### 4. Tips
          - Focus on rotating your entire torso, not just moving your elbows
          - Keep your neck relaxed and avoid pulling on your head with your hands
          - Maintain constant tension in your core throughout the movement
          - Move with control rather than speed for maximum effectiveness
          - Keep your lower back pressed against the mat to protect your spine

          ### 5. Common Mistakes
          - Pulling on the neck or head instead of engaging the core
          - Moving too quickly and losing proper form
          - Only moving the elbows instead of rotating the torso
          - Allowing the lower back to arch off the mat
          - Not fully extending the legs on each repetition
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Beginners can keep their feet on the ground and perform the twist without leg movement
          - Reduce range of motion if you experience neck or lower back discomfort
          - Progress by slowing down the tempo to increase time under tension
          - Advanced variation: pause for 2-3 seconds at each twist

