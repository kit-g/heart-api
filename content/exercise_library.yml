  "Triceps Extension (Cable)":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Triceps Extension (Cable)"
        instructions: |
          ## Overview
          The cable triceps extension is an isolation exercise that primarily targets all three heads of the triceps with constant tension. It also engages the shoulders and core as stabilizers, using an overhead cable position to maintain continuous resistance throughout the movement.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing away from a high cable pulley with a rope attachment
          - Grip the rope ends and step forward to create tension
          - Position your arms overhead with elbows bent
          - Keep your elbows pointing forward and relatively close to your head
          - Stagger your stance for stability and engage your core

          ### 2. Movement
          1. Extend your elbows to press your hands forward and up
          2. Keep your upper arms stationary and close to your head
          3. Continue until your arms are fully extended
          4. Pause and squeeze your triceps at full extension
          5. Slowly return to the starting position with control
          6. Stop before the weight stack touches to maintain constant tension, then repeat

          ### 3. Breathing
          - Exhale as you extend your arms forward
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your upper arms stationary throughout the movement
          - Maintain constant tension by not letting the weight stack rest
          - Keep your elbows relatively close together
          - Avoid arching your lower back during the movement
          - Focus on the squeeze at full extension

          ### 5. Common Mistakes
          - Allowing the elbows to flare out excessively
          - Moving the upper arms instead of keeping them stationary
          - Letting the weight stack rest between reps
          - Leaning too far forward
          - Using momentum instead of controlled movement
          - Not achieving full elbow extension

          ### 6. Safety / Modifications
          - Start with light weight to master the overhead cable position
          - Try different attachments (rope, straight bar, V-bar) for variety
          - Advanced variation: perform one arm at a time for unilateral focus
          - Kneel on both knees for a more stable position if needed

  "Triceps Extension (Dumbbell)":
    category: Dumbbell
    target: Arms
    i18n:
      en:
        name: "Triceps Extension (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell triceps extension is an isolation exercise that primarily targets all three heads of the triceps. It also engages the shoulders and core as stabilizers, using an overhead dumbbell position to allow natural arm movement and maximize triceps stretch.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart or sit on a bench with back support
          - Hold a single dumbbell with both hands, gripping one end
          - Press the dumbbell overhead until your arms are fully extended
          - Keep your elbows pointing forward and close to your head
          - Engage your core for stability

          ### 2. Movement
          1. Lower the dumbbell behind your head by bending your elbows
          2. Keep your upper arms stationary and vertical throughout
          3. Lower until you feel a deep stretch in your triceps
          4. Pause briefly at the bottom position
          5. Extend your elbows to press the dumbbell back to the starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower the dumbbell behind your head
          - Exhale as you press the dumbbell back up

          ### 4. Tips
          - Keep your upper arms stationary and vertical throughout
          - Keep your elbows as close together as comfortable
          - Avoid arching your lower back during the movement
          - Focus on the stretch at the bottom and squeeze at the top
          - Control the weight throughout the entire range of motion

          ### 5. Common Mistakes
          - Allowing the elbows to flare out excessively
          - Moving the upper arms instead of keeping them stationary
          - Arching the lower back excessively
          - Using too much weight and compromising form
          - Not achieving full range of motion
          - Leaning forward or backward during the movement

          ### 6. Safety / Modifications
          - Start with a moderate dumbbell to master the overhead position
          - Perform seated with back support for added stability
          - Advanced variation: perform with one arm at a time for unilateral focus
          - Use two dumbbells (one in each hand) for independent arm movement

  "Triceps Extension (Machine)":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Triceps Extension (Machine)"
        instructions: |
          ## Overview
          The machine triceps extension is an isolation exercise that primarily targets all three heads of the triceps with a guided movement path. It also engages the shoulders minimally, using a fixed machine to provide stability and consistent resistance throughout the extension.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the machine with your back firmly against the pad
          - Adjust the seat height so your elbows align with the machine's pivot point
          - Grip the handles with an overhand or neutral grip, depending on the machine
          - Position your elbows at about 90 degrees to start
          - Keep your upper arms pressed against the pad if applicable

          ### 2. Movement
          1. Extend your arms by pressing the handles down or forward
          2. Keep your upper arms stationary against the pad throughout
          3. Continue until your arms are fully extended
          4. Pause and squeeze your triceps at full extension
          5. Slowly return to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you extend your arms
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your upper arms completely stationary throughout
          - Maintain constant tension by not letting the weight stack rest
          - Focus on squeezing your triceps at full extension
          - Control both the extension and return phases
          - Avoid using momentum or body movement

          ### 5. Common Mistakes
          - Lifting the upper arms or elbows off the pad
          - Using momentum instead of controlled muscle contraction
          - Letting the weight stack rest completely between reps
          - Not achieving full arm extension
          - Using too much weight and compromising form
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Adjust seat height to ensure proper elbow alignment with the pivot point
          - Start with light weight to establish mind-muscle connection
          - Advanced variation: add a 2-3 second pause at full extension
          - Perform one arm at a time if the machine allows for unilateral training

  "Triceps Pushdown (Cable - Straight Bar)":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Triceps Pushdown (Cable - Straight Bar)"
        instructions: |
          ## Overview
          The cable triceps pushdown is an isolation exercise that primarily targets all three heads of the triceps with constant tension. It also engages the shoulders minimally as stabilizers, using a high cable pulley with a straight bar for consistent resistance throughout the movement.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing a high cable pulley with a straight bar attached
          - Grip the bar with an overhand grip, hands shoulder-width apart
          - Position your elbows close to your sides with forearms parallel to the floor
          - Keep your feet hip-width apart with a slight forward stance
          - Engage your core and maintain an upright posture

          ### 2. Movement
          1. Push the bar down by extending your elbows fully
          2. Keep your upper arms stationary and pinned to your sides
          3. Continue pressing until your arms are fully extended at your thighs
          4. Pause and squeeze your triceps at full extension
          5. Slowly allow the bar to rise back to the starting position with control
          6. Stop before the weight stack touches to maintain constant tension, then repeat

          ### 3. Breathing
          - Exhale as you push the bar down
          - Inhale as you allow the bar to return to the starting position

          ### 4. Tips
          - Keep your elbows completely stationary and tucked to your sides
          - Focus on isolating the triceps by only moving at the elbow joint
          - Maintain constant tension by not letting the weight stack rest
          - Avoid leaning forward or using body momentum
          - Squeeze your triceps hard at the bottom of each rep

          ### 5. Common Mistakes
          - Allowing the elbows to drift forward or flare out
          - Leaning forward and using body weight to push the bar
          - Not achieving full elbow extension at the bottom
          - Letting the weight stack rest between reps
          - Using momentum instead of controlled movement
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with light weight to master the strict elbow isolation
          - Try different attachments (rope, V-bar, single handle) for variety
          - Advanced variation: perform one arm at a time for unilateral focus
          - Add a 2-3 second pause at full extension for increased intensity

  "Upright Row (Cable)":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Upright Row (Cable)"
        instructions: |
          ## Overview
          The cable upright row is a compound exercise that primarily targets the lateral deltoids and upper trapezius. It also engages the biceps, forearms, and middle trapezius, using a low cable pulley to provide constant tension throughout the vertical pulling movement.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing a low cable pulley with a straight bar or rope attached
          - Grip the attachment with an overhand grip, hands slightly narrower than shoulder-width
          - Stand upright with feet hip-width apart
          - Let your arms hang straight down with the cable under tension
          - Keep your shoulders back and core engaged

          ### 2. Movement
          1. Pull the attachment upward along your body by raising your elbows
          2. Lead with your elbows, keeping them higher than your wrists
          3. Continue pulling until the attachment reaches upper chest or chin height
          4. Keep the attachment close to your body throughout
          5. Pause briefly at the top of the movement
          6. Slowly lower the attachment back to the starting position with control

          ### 3. Breathing
          - Exhale as you pull the attachment upward
          - Inhale as you lower the attachment back down

          ### 4. Tips
          - Lead with your elbows, not your hands
          - Keep the attachment close to your body throughout the movement
          - Avoid shrugging your shoulders at the top
          - Maintain constant tension by not letting the weight stack rest
          - Control both the lifting and lowering phases

          ### 5. Common Mistakes
          - Pulling too high and straining the shoulders
          - Allowing the elbows to drop below the wrists
          - Using momentum or swinging the body
          - Letting the weight stack rest between reps
          - Leaning backward during the pull
          - Using too wide a grip, which can cause shoulder impingement

          ### 6. Safety / Modifications
          - Use a moderate grip width to avoid shoulder discomfort
          - Stop at shoulder height if you experience any shoulder pain
          - Try a rope attachment for a more natural hand position
          - Advanced variation: perform one arm at a time for unilateral focus

  "Wrist Roller":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Wrist Roller"
        instructions: |
          ## Overview
          The wrist roller is a forearm exercise that primarily targets the wrist flexors and extensors. It also engages the grip muscles and forearms through a continuous rolling motion, making it effective for building forearm strength and endurance.

          ## How to Perform
          ### 1. Starting Position
          - Stand upright holding a wrist roller device with both hands
          - Grip the handle with an overhand grip, palms facing down
          - Extend your arms straight out in front of you at shoulder height
          - Keep your feet shoulder-width apart and core engaged
          - Ensure the weight is hanging freely from the rope

          ### 2. Movement
          1. Begin rolling the handle by alternating wrist flexion with each hand
          2. Roll the rope upward, winding the weight toward the handle
          3. Keep your arms extended and parallel to the floor throughout
          4. Continue rolling until the weight reaches the top
          5. Reverse the motion by slowly unwinding the rope back down
          6. Maintain control during both the rolling up and unwinding phases

          ### 3. Breathing
          - Breathe steadily and naturally throughout the movement
          - Avoid holding your breath during the continuous rolling motion

          ### 4. Tips
          - Keep your arms extended at shoulder height throughout
          - Focus on controlled wrist movements rather than using momentum
          - Maintain steady, continuous motion without pausing
          - Keep your wrists aligned with your forearms
          - Start with lighter weight to master the technique

          ### 5. Common Mistakes
          - Dropping the arms below shoulder height
          - Using momentum or jerky movements
          - Allowing the weight to drop uncontrolled on the descent
          - Bending the elbows during the movement
          - Rolling too quickly and losing control
          - Tensing the shoulders and upper body unnecessarily

          ### 6. Safety / Modifications
          - Start with a light weight to build forearm endurance
          - Rest between sets as forearms fatigue quickly
          - Advanced variation: roll the weight up and down multiple times without resting
          - Reverse grip variation: use an underhand grip to emphasize different forearm muscles

  "Back Extension":
    category: Weighted Body Weight
    target: Back
    i18n:
      en:
        name: "Back Extension"
        instructions: |
          ## Overview
          The back extension is a bodyweight exercise that primarily targets the erector spinae and lower back muscles. It also engages the glutes and hamstrings as secondary muscles, making it effective for strengthening the posterior chain and improving spinal stability.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself face down on a back extension bench
          - Secure your ankles under the footpads with your thighs resting on the support pad
          - Cross your arms over your chest or place hands behind your head
          - Begin with your torso hinged forward at approximately 90 degrees
          - Keep your spine neutral and core engaged

          ### 2. Movement
          1. Raise your torso by contracting your lower back and glutes
          2. Continue lifting until your body forms a straight line from head to heels
          3. Keep your neck neutral and avoid hyperextending your spine
          4. Pause briefly at the top position
          5. Slowly lower your torso back down with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you raise your torso up
          - Inhale as you lower your torso back down

          ### 4. Tips
          - Focus on engaging your lower back and glutes throughout
          - Avoid hyperextending or arching excessively at the top
          - Keep your core tight to protect your spine
          - Move slowly and with control in both directions
          - Keep your neck in a neutral position aligned with your spine

          ### 5. Common Mistakes
          - Hyperextending the spine at the top of the movement
          - Using momentum instead of controlled muscle contraction
          - Allowing the hips to lift off the pad
          - Moving too quickly and losing control
          - Arching the neck to look forward
          - Not engaging the glutes during the movement

          ### 6. Safety / Modifications
          - Beginners can reduce range of motion until they build strength
          - Hold a weight plate at your chest for added resistance
          - Perform on the floor without equipment if no bench is available
          - If you experience lower back discomfort, reduce range of motion and consult a professional

  "Back Extension (Machine)":
    category: Machine
    target: Back
    i18n:
      en:
        name: "Back Extension (Machine)"
        instructions: |
          ## Overview
          The machine back extension is a resistance-based exercise that primarily targets the erector spinae and lower back muscles. It also engages the glutes and hamstrings, providing guided support and adjustable resistance for safe and effective lower back strengthening.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the back extension machine with your back against the pad
          - Adjust the pad height so it rests comfortably against your mid to upper back
          - Secure your feet on the footrest or under the foot pads
          - Cross your arms over your chest or grip the handles
          - Select an appropriate weight on the stack

          ### 2. Movement
          1. Push back against the pad by extending your spine and hips
          2. Continue until your back is straight or slightly extended
          3. Keep your core engaged and movement controlled
          4. Pause briefly at full extension
          5. Slowly return to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you extend your back against the pad
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your core engaged throughout the movement
          - Avoid hyperextending your spine excessively
          - Focus on smooth, controlled movement in both directions
          - Maintain constant tension by not letting the weight stack rest
          - Keep your feet firmly planted throughout

          ### 5. Common Mistakes
          - Using too much weight and compromising form
          - Hyperextending the spine excessively
          - Using momentum instead of controlled muscle contraction
          - Letting the weight stack rest between reps
          - Arching the neck instead of maintaining neutral alignment
          - Moving too quickly through the range of motion

          ### 6. Safety / Modifications
          - Start with light weight to master proper form and control
          - Adjust pad height to ensure proper back positioning
          - Advanced variation: pause for 2-3 seconds at full extension
          - If you experience discomfort, reduce weight and ensure proper pad alignment

  "Bent Over One Arm Row (Dumbbell)":
    category: Dumbbell
    target: Back
    i18n:
      en:
        name: "Bent Over One Arm Row (Dumbbell)"
        instructions: |
          ## Overview
          The bent over one arm dumbbell row is a unilateral pulling exercise that primarily targets the latissimus dorsi, rhomboids, and middle trapezius. It also engages the biceps and rear deltoids, allowing you to address strength imbalances and achieve a greater range of motion than bilateral rows.

          ## How to Perform
          ### 1. Starting Position
          - Place one knee and the same-side hand on a flat bench for support
          - Position your other foot on the floor with a slight bend in the knee
          - Hold a dumbbell in your free hand with your arm hanging straight down
          - Keep your back flat and parallel to the floor
          - Engage your core and maintain a neutral spine

          ### 2. Movement
          1. Pull the dumbbell upward by driving your elbow toward the ceiling
          2. Keep your elbow close to your body as you row
          3. Continue until the dumbbell reaches your hip or lower ribcage
          4. Squeeze your shoulder blade toward your spine at the top
          5. Slowly lower the dumbbell back to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you pull the dumbbell up
          - Inhale as you lower the dumbbell back down

          ### 4. Tips
          - Lead with your elbow, not your hand
          - Keep your torso stable and avoid rotating
          - Focus on squeezing your back muscles at the top
          - Maintain a flat back throughout the movement
          - Control the weight in both directions

          ### 5. Common Mistakes
          - Rotating the torso instead of keeping it stable
          - Using momentum to swing the weight up
          - Not achieving full range of motion
          - Rounding the back instead of keeping it flat
          - Pulling with the arm instead of the back muscles
          - Moving too quickly and losing control

          ### 6. Safety / Modifications
          - Start with moderate weight to master the form
          - Perform without a bench by hinging at the hips and placing your free hand on your thigh
          - Advanced variation: pause for 2-3 seconds at the top of each rep
          - Ensure equal reps on both sides for balanced development

  "Bent Over Row (Band)":
    category: Weighted Body Weight
    target: Back
    i18n:
      en:
        name: "Bent Over Row (Band)"
        instructions: |
          ## Overview
          The band bent over row is a resistance-based pulling exercise that primarily targets the latissimus dorsi, rhomboids, and middle trapezius. It also engages the biceps and rear deltoids, providing progressive resistance throughout the movement for effective back development.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, stepping on the center of a resistance band
          - Grip each end of the band with your hands
          - Hinge forward at the hips with a slight bend in your knees
          - Keep your back flat and core engaged
          - Let your arms hang straight down with tension on the band

          ### 2. Movement
          1. Pull the band toward your torso by driving your elbows back
          2. Keep your elbows close to your body as you row
          3. Continue until your hands reach your lower ribcage or hips
          4. Squeeze your shoulder blades together at the top
          5. Slowly release back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the band toward your torso
          - Inhale as you release back to the starting position

          ### 4. Tips
          - Keep your back flat and core tight throughout
          - Lead with your elbows, pulling them back behind you
          - Focus on squeezing your shoulder blades together
          - Maintain constant tension on the band
          - Avoid rounding your back during the movement

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Using momentum instead of controlled movement
          - Not achieving full range of motion
          - Standing too upright and reducing back engagement
          - Releasing tension on the band at the bottom
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the hip hinge position
          - Adjust foot position on the band to modify resistance
          - Advanced variation: use a heavier resistance band or add a pause at the top
          - Keep knees slightly bent to protect your lower back

  "Bent Over Row (Barbell)":
    category: Barbell
    target: Back
    i18n:
      en:
        name: "Bent Over Row (Barbell)"
        instructions: |
          ## Overview
          The barbell bent over row is a compound pulling exercise that primarily targets the latissimus dorsi, rhomboids, and middle trapezius. It also engages the biceps, rear deltoids, and lower back stabilizers, making it one of the most effective exercises for building overall back thickness and strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, holding a barbell with an overhand grip
          - Position your hands slightly wider than shoulder-width apart
          - Hinge forward at the hips with a slight bend in your knees
          - Keep your back flat, chest up, and core engaged
          - Let the barbell hang at arm's length below your shoulders

          ### 2. Movement
          1. Pull the barbell toward your lower chest or upper abdomen
          2. Drive your elbows back and up, keeping them close to your body
          3. Continue until the bar touches your torso
          4. Squeeze your shoulder blades together at the top
          5. Slowly lower the barbell back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the barbell toward your torso
          - Inhale as you lower the barbell back down

          ### 4. Tips
          - Keep your back flat and core tight throughout
          - Lead with your elbows, not your hands
          - Focus on squeezing your shoulder blades together
          - Maintain a consistent torso angle throughout the set
          - Avoid using momentum or swinging the weight

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Standing too upright and reducing back engagement
          - Using momentum to swing the weight up
          - Not achieving full range of motion
          - Allowing the elbows to flare out excessively
          - Moving too quickly and losing control

          ### 6. Safety / Modifications
          - Start with light weight to master the hip hinge and flat back position
          - Use lifting straps if grip strength is limiting
          - Advanced variation: perform with an underhand grip for different muscle emphasis
          - If you experience lower back discomfort, reduce weight and check your form

  "Bent Over Row (Dumbbell)":
    category: Dumbbell
    target: Back
    i18n:
      en:
        name: "Bent Over Row (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell bent over row is a compound pulling exercise that primarily targets the latissimus dorsi, rhomboids, and middle trapezius. It also engages the biceps and rear deltoids, allowing for independent arm movement and natural wrist positioning throughout the rowing motion.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a dumbbell in each hand
          - Hinge forward at the hips with a slight bend in your knees
          - Keep your back flat, chest up, and core engaged
          - Let the dumbbells hang at arm's length with palms facing each other or your body
          - Maintain a neutral spine throughout

          ### 2. Movement
          1. Pull both dumbbells toward your hips or lower ribcage
          2. Drive your elbows back and up, keeping them close to your body
          3. Continue until the dumbbells reach your torso
          4. Squeeze your shoulder blades together at the top
          5. Slowly lower the dumbbells back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the dumbbells toward your torso
          - Inhale as you lower the dumbbells back down

          ### 4. Tips
          - Keep your back flat and core tight throughout
          - Lead with your elbows, pulling them back behind you
          - Focus on squeezing your shoulder blades together
          - Maintain a consistent torso angle throughout the set
          - Allow natural wrist rotation if comfortable

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Standing too upright and reducing back engagement
          - Using momentum to swing the weights up
          - Not achieving full range of motion
          - Allowing the torso to rotate side to side
          - Moving too quickly and losing control

          ### 6. Safety / Modifications
          - Start with moderate dumbbells to master the hip hinge position
          - Perform one arm at a time for better focus and stability
          - Advanced variation: pause for 2-3 seconds at the top of each rep
          - Keep knees slightly bent to protect your lower back

  "Bent Over Row - Underhand (Barbell)":
    category: Barbell
    target: Back
    i18n:
      en:
        name: "Bent Over Row - Underhand (Barbell)"
        instructions: |
          ## Overview
          The underhand barbell bent over row is a compound pulling exercise that primarily targets the latissimus dorsi and lower lats with greater emphasis. It also engages the biceps more than the overhand variation, along with the rhomboids and middle trapezius, making it effective for building back width and arm strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, holding a barbell with an underhand grip
          - Position your hands slightly narrower than shoulder-width apart
          - Hinge forward at the hips with a slight bend in your knees
          - Keep your back flat, chest up, and core engaged
          - Let the barbell hang at arm's length below your shoulders

          ### 2. Movement
          1. Pull the barbell toward your lower chest or upper abdomen
          2. Drive your elbows back and slightly outward as you row
          3. Continue until the bar touches your torso
          4. Squeeze your shoulder blades together at the top
          5. Slowly lower the barbell back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the barbell toward your torso
          - Inhale as you lower the barbell back down

          ### 4. Tips
          - Keep your back flat and core tight throughout
          - The underhand grip allows your elbows to stay closer to your body
          - Focus on squeezing your lats and shoulder blades
          - Maintain a consistent torso angle throughout the set
          - Control the weight in both directions

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Standing too upright and reducing back engagement
          - Using momentum to swing the weight up
          - Not achieving full range of motion
          - Allowing the elbows to flare out excessively
          - Moving too quickly and losing control

          ### 6. Safety / Modifications
          - Start with lighter weight than your overhand row to master the grip
          - Use lifting straps if grip strength is limiting
          - Advanced variation: perform with a narrower grip for increased biceps emphasis
          - If you experience lower back discomfort, reduce weight and check your form

  "Chin Up":
    category: Weighted Body Weight
    target: Back
    i18n:
      en:
        name: "Chin Up"
        instructions: |
          ## Overview
          The chin up is a bodyweight pulling exercise that primarily targets the latissimus dorsi and biceps. It also engages the rhomboids, middle trapezius, and core, using an underhand grip that emphasizes the biceps more than traditional pull ups for effective upper body pulling strength.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with an underhand grip (palms facing you)
          - Position your hands slightly narrower than shoulder-width apart
          - Allow your body to hang fully extended with arms straight
          - Engage your core and keep your shoulders pulled down
          - Cross your ankles or keep legs straight

          ### 2. Movement
          1. Pull yourself up by driving your elbows down and back
          2. Continue pulling until your chin clears the bar
          3. Keep your core tight and avoid excessive swinging
          4. Pause briefly at the top of the movement
          5. Slowly lower yourself back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull yourself up
          - Inhale as you lower yourself back down

          ### 4. Tips
          - Lead with your chest and keep your shoulders back
          - Focus on pulling your elbows down rather than just your hands up
          - Keep your core engaged to minimize swinging
          - Control the descent for maximum muscle engagement
          - Think about pulling the bar down to you rather than pulling yourself up

          ### 5. Common Mistakes
          - Using momentum or kipping instead of strict form
          - Not achieving full range of motion at top or bottom
          - Allowing the shoulders to shrug up toward the ears
          - Swinging excessively during the movement
          - Not fully extending the arms at the bottom
          - Pulling with arms only instead of engaging the back

          ### 6. Safety / Modifications
          - Use an assisted chin up machine or resistance band for support
          - Perform negative chin ups (jump to the top and lower slowly) to build strength
          - Advanced variation: add weight using a dip belt or weight vest
          - Progress gradually to avoid shoulder strain

  "Chin Up (Assisted)":
    category: Assisted Body Weight
    target: Back
    i18n:
      en:
        name: "Chin Up (Assisted)"
        instructions: |
          ## Overview
          The assisted chin up is a machine-based pulling exercise that primarily targets the latissimus dorsi and biceps with support. It also engages the rhomboids and middle trapezius, using counterbalance assistance to make the chin up movement more accessible while building strength toward unassisted chin ups.

          ## How to Perform
          ### 1. Starting Position
          - Set the weight on the assisted chin up machine (more weight = more assistance)
          - Grip the handles with an underhand grip, hands shoulder-width apart
          - Position your knees or feet on the assistance pad
          - Hang with arms fully extended and shoulders engaged
          - Keep your core tight and body stable

          ### 2. Movement
          1. Pull yourself up by driving your elbows down and back
          2. Continue until your chin clears the handles or bar
          3. Keep your core engaged and movement controlled
          4. Pause briefly at the top of the movement
          5. Slowly lower yourself back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull yourself up
          - Inhale as you lower yourself back down

          ### 4. Tips
          - Gradually reduce assistance weight as you build strength
          - Focus on pulling with your back muscles, not just your arms
          - Keep your shoulders down and back throughout
          - Control both the pulling and lowering phases
          - Avoid relying too heavily on the assistance

          ### 5. Common Mistakes
          - Using too much assistance and not challenging yourself
          - Not achieving full range of motion
          - Allowing the shoulders to shrug up
          - Using momentum instead of controlled movement
          - Not gradually reducing assistance weight over time
          - Pulling with arms only instead of engaging the back

          ### 6. Safety / Modifications
          - Start with higher assistance and gradually decrease as you get stronger
          - Focus on form over reducing assistance too quickly
          - Progress toward band-assisted or negative chin ups before attempting unassisted
          - Perform lat pulldowns as an alternative to build foundational strength

  "Deadlift (Barbell)":
    category: Barbell
    target: Back
    i18n:
      en:
        name: "Deadlift (Barbell)"
        instructions: |
          ## Overview
          The barbell deadlift is a compound exercise that primarily targets the erector spinae, glutes, and hamstrings. It also engages the quadriceps, lats, traps, and grip muscles, making it one of the most effective full-body strength exercises for building overall posterior chain power.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, barbell over mid-foot
          - Grip the bar just outside your legs with hands shoulder-width apart
          - Hinge at the hips and bend your knees to reach the bar
          - Keep your chest up, back flat, and shoulders slightly ahead of the bar
          - Engage your core and lats before lifting

          ### 2. Movement
          1. Drive through your heels and extend your hips and knees simultaneously
          2. Keep the bar close to your body as you lift
          3. Stand up fully by extending your hips and knees
          4. Keep your shoulders back and chest up at the top
          5. Lower the bar by pushing your hips back and bending your knees
          6. Return the bar to the floor with control and repeat

          ### 3. Breathing
          - Take a deep breath and brace your core before lifting
          - Hold your breath during the lift
          - Exhale at the top or as you lower the bar

          ### 4. Tips
          - Keep the bar close to your shins and thighs throughout
          - Lead with your chest as you stand up
          - Keep your spine neutral, avoiding rounding or hyperextension
          - Drive through your entire foot, not just your toes
          - Think about pushing the floor away rather than lifting the bar

          ### 5. Common Mistakes
          - Rounding the lower back during the lift
          - Starting with hips too high or too low
          - Letting the bar drift away from the body
          - Not fully extending hips at the top
          - Looking up or down instead of maintaining neutral neck
          - Using arms to pull instead of legs and hips to drive

          ### 6. Safety / Modifications
          - Start with light weight to master proper form and hip hinge
          - Use lifting straps if grip strength is limiting
          - Advanced variation: perform deficit deadlifts or Romanian deadlifts
          - If you experience lower back discomfort, reduce weight and check your form with a professional

  "Good Morning (Barbell)":
    category: Barbell
    target: Back
    i18n:
      en:
        name: "Good Morning (Barbell)"
        instructions: |
          ## Overview
          The barbell good morning is a hip hinge exercise that primarily targets the erector spinae, glutes, and hamstrings. It also engages the core and upper back as stabilizers, making it effective for strengthening the posterior chain and improving hip hinge mechanics.

          ## How to Perform
          ### 1. Starting Position
          - Position a barbell across your upper back as you would for a squat
          - Stand with feet hip to shoulder-width apart
          - Grip the bar with hands slightly wider than shoulder-width
          - Keep your chest up, core engaged, and knees slightly bent
          - Maintain a neutral spine throughout

          ### 2. Movement
          1. Hinge forward at the hips by pushing your hips back
          2. Keep your back flat and core tight as you lower your torso
          3. Continue until your torso is near parallel to the floor or you feel a stretch in your hamstrings
          4. Maintain a slight bend in your knees throughout
          5. Drive your hips forward to return to the starting position
          6. Squeeze your glutes at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you hinge forward
          - Exhale as you drive your hips forward to stand up

          ### 4. Tips
          - Focus on the hip hinge movement, not squatting
          - Keep your back flat and chest up throughout
          - Push your hips back as far as possible
          - Keep the bar secure on your upper back
          - Control the descent and avoid dropping quickly

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Bending the knees too much, turning it into a squat
          - Not pushing the hips back far enough
          - Using too much weight and compromising form
          - Moving too quickly and losing control
          - Hyperextending the back at the top

          ### 6. Safety / Modifications
          - Start with light weight or just the bar to master the hip hinge
          - Keep knees slightly bent to protect your hamstrings
          - Perform with dumbbells held at your sides if barbell feels unstable
          - If you experience lower back discomfort, reduce weight and ensure proper form

  "Incline Row (Dumbbell)":
    category: Dumbbell
    target: Back
    i18n:
      en:
        name: "Incline Row (Dumbbell)"
        instructions: |
          ## Overview
          The incline dumbbell row is a chest-supported pulling exercise that primarily targets the latissimus dorsi, rhomboids, and middle trapezius. It also engages the biceps and rear deltoids, using an incline bench to eliminate lower back strain while allowing you to focus purely on back muscle contraction.

          ## How to Perform
          ### 1. Starting Position
          - Set an adjustable bench to a 30-45 degree incline
          - Lie face down on the bench with your chest against the pad
          - Hold a dumbbell in each hand with arms hanging straight down
          - Keep your feet flat on the floor for stability
          - Engage your core and maintain a neutral spine

          ### 2. Movement
          1. Pull both dumbbells toward your hips or lower ribcage
          2. Drive your elbows back and up, keeping them close to your body
          3. Continue until the dumbbells reach your torso
          4. Squeeze your shoulder blades together at the top
          5. Slowly lower the dumbbells back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the dumbbells up
          - Inhale as you lower the dumbbells back down

          ### 4. Tips
          - Keep your chest pressed firmly against the bench
          - Lead with your elbows, not your hands
          - Focus on squeezing your shoulder blades together
          - Avoid using momentum or swinging the weights
          - Control the weight throughout the entire range of motion

          ### 5. Common Mistakes
          - Lifting your chest off the bench during the row
          - Using momentum to swing the weights up
          - Not achieving full range of motion
          - Allowing the elbows to flare out excessively
          - Moving too quickly and losing control
          - Not squeezing the shoulder blades at the top

          ### 6. Safety / Modifications
          - Start with moderate dumbbells to master the chest-supported position
          - Adjust bench angle between 30-60 degrees for different muscle emphasis
          - Perform one arm at a time for unilateral focus
          - Advanced variation: pause for 2-3 seconds at the top of each rep

  "Inverted Row (Bodyweight)":
    category: Reps Only
    target: Back
    i18n:
      en:
        name: "Inverted Row (Bodyweight)"
        instructions: |
          ## Overview
          The inverted row is a bodyweight pulling exercise that primarily targets the latissimus dorsi, rhomboids, and middle trapezius. It also engages the biceps, rear deltoids, and core, making it an effective horizontal pulling movement for building back strength and muscle endurance.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself under a fixed bar set at waist to chest height
          - Grip the bar with an overhand grip, hands shoulder-width apart
          - Extend your body straight with heels on the ground and arms fully extended
          - Keep your body in a straight line from head to heels
          - Engage your core and glutes throughout

          ### 2. Movement
          1. Pull your chest toward the bar by driving your elbows back
          2. Keep your body straight and core tight as you pull
          3. Continue until your chest touches or nearly touches the bar
          4. Squeeze your shoulder blades together at the top
          5. Slowly lower yourself back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull your chest toward the bar
          - Inhale as you lower yourself back down

          ### 4. Tips
          - Keep your body in a straight line throughout the movement
          - Lead with your chest and keep your elbows close to your body
          - Focus on squeezing your shoulder blades together
          - Avoid letting your hips sag or pike upward
          - Control both the pulling and lowering phases

          ### 5. Common Mistakes
          - Allowing the hips to sag or pike upward
          - Not achieving full range of motion at the top
          - Using momentum instead of controlled movement
          - Allowing the elbows to flare out excessively
          - Not maintaining a straight body line
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Raise the bar higher to make the exercise easier for beginners
          - Lower the bar or elevate your feet for increased difficulty
          - Perform with an underhand grip for different muscle emphasis
          - Advanced variation: pause for 2-3 seconds at the top of each rep

  "Iso-Lateral Row (Machine)":
    category: Machine
    target: Back
    i18n:
      en:
        name: "Iso-Lateral Row (Machine)"
        instructions: |
          ## Overview
          The iso-lateral row is a machine-based pulling exercise that primarily targets the latissimus dorsi, rhomboids, and middle trapezius. It also engages the biceps and rear deltoids, using independent arm movement to address strength imbalances and allow unilateral or bilateral training.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the iso-lateral row machine with your chest against the pad
          - Adjust the seat height so the handles align with your mid-chest
          - Grip the handles with a neutral or overhand grip
          - Keep your feet flat on the footrests and core engaged
          - Position your shoulders back and down

          ### 2. Movement
          1. Pull the handles toward your torso by driving your elbows back
          2. Keep your chest pressed against the pad throughout
          3. Continue until your elbows are behind your torso
          4. Squeeze your shoulder blades together at the end of the movement
          5. Slowly return the handles to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the handles toward your torso
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your chest firmly against the pad to isolate your back
          - Lead with your elbows, pulling them back behind you
          - Focus on squeezing your shoulder blades together
          - Perform both arms together or alternate for unilateral training
          - Control the weight throughout the entire range of motion

          ### 5. Common Mistakes
          - Lifting your chest off the pad during the row
          - Using momentum instead of controlled muscle contraction
          - Not achieving full range of motion
          - Allowing the shoulders to shrug up
          - Moving too quickly through the repetitions
          - Not equalizing strength between both arms

          ### 6. Safety / Modifications
          - Adjust seat height to ensure proper alignment with the handles
          - Start with light weight to establish proper form
          - Perform one arm at a time to address imbalances
          - Advanced variation: pause for 2-3 seconds at peak contraction

  "Kipping Pull Up":
    category: Reps Only
    target: Back
    i18n:
      en:
        name: "Kipping Pull Up"
        instructions: |
          ## Overview
          The kipping pull up is a dynamic bodyweight pulling exercise that primarily targets the latissimus dorsi using momentum. It also engages the shoulders, core, and hip flexors through a coordinated swinging motion, making it a functional movement for CrossFit and athletic training.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with an overhand grip, hands slightly wider than shoulder-width
          - Allow your body to hang fully extended with arms straight
          - Engage your core and prepare to initiate the kipping motion
          - Keep your shoulders active, not passively hanging

          ### 2. Movement
          1. Generate momentum by pushing forward and then pulling your body backward in an arch
          2. As your body swings forward, drive your hips toward the bar
          3. Use the upward momentum to pull your chin over the bar
          4. Push away from the bar at the top to begin the next kip
          5. Allow your body to swing back into the arch position
          6. Repeat the kipping motion in a fluid, continuous rhythm

          ### 3. Breathing
          - Breathe rhythmically throughout the continuous kipping motion
          - Avoid holding your breath during the movement

          ### 4. Tips
          - Master strict pull-ups before attempting kipping variations
          - Generate momentum from your hips, not just your arms
          - Keep the movement fluid and continuous
          - Think of the motion as a coordinated full-body swing
          - Practice the hollow and arch positions separately before combining them

          ### 5. Common Mistakes
          - Attempting kipping without sufficient strict pull-up strength
          - Using excessive, uncontrolled swinging
          - Not coordinating the hip drive with the pull
          - Breaking rhythm between reps
          - Allowing shoulders to disengage at the bottom
          - Kipping without understanding proper progression

          ### 6. Safety / Modifications
          - Build a foundation with 5-10 strict pull-ups before kipping
          - Practice hollow and arch swings separately
          - Use an assisted pull-up machine to build foundational strength
          - Work with a coach to learn proper kipping mechanics safely

  "Kneeling Pulldown (Band)":
    category: Weighted Body Weight
    target: Back
    i18n:
      en:
        name: "Kneeling Pulldown (Band)"
        instructions: |
          ## Overview
          The kneeling band pulldown is a resistance-based pulling exercise that primarily targets the latissimus dorsi. It also engages the rhomboids, middle trapezius, and biceps, using a kneeling position with bands to provide progressive resistance throughout the pulling motion.

          ## How to Perform
          ### 1. Starting Position
          - Anchor a resistance band overhead to a secure point
          - Kneel on the floor facing the anchor point
          - Grip the band with both hands, arms extended overhead
          - Keep your core engaged and torso upright
          - Position yourself far enough back to create tension in the band

          ### 2. Movement
          1. Pull the band down toward your chest by driving your elbows down and back
          2. Keep your torso upright and core engaged throughout
          3. Continue until your hands reach chest or shoulder height
          4. Squeeze your shoulder blades together at the bottom
          5. Slowly return your arms to the overhead position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the band down
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your torso upright throughout the movement
          - Lead with your elbows, pulling them down and back
          - Focus on squeezing your shoulder blades together
          - Maintain constant tension on the band
          - Control the resistance on both the pulling and releasing phases

          ### 5. Common Mistakes
          - Leaning back to use body weight instead of back muscles
          - Not maintaining constant tension on the band
          - Using momentum instead of controlled movement
          - Allowing the shoulders to shrug up
          - Not achieving full range of motion
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the movement pattern
          - Adjust distance from anchor point to modify resistance
          - Perform standing if kneeling is uncomfortable
          - Advanced variation: use a heavier resistance band or add a pause at the bottom

  "Lat Pulldown (Cable)":
    category: Machine
    target: Back
    i18n:
      en:
        name: "Lat Pulldown (Cable)"
        instructions: |
          ## Overview
          The cable lat pulldown is a machine-based pulling exercise that primarily targets the latissimus dorsi. It also engages the rhomboids, middle trapezius, and biceps, using a high cable pulley with constant tension to build back width and pulling strength.

          ## How to Perform
          ### 1. Starting Position
          - Sit at a lat pulldown station with your thighs secured under the pads
          - Grip the bar with an overhand grip, hands slightly wider than shoulder-width
          - Extend your arms fully overhead while maintaining tension on the cable
          - Keep your chest up and shoulders down
          - Engage your core and maintain an upright torso

          ### 2. Movement
          1. Pull the bar down toward your upper chest by driving your elbows down and back
          2. Keep your torso upright or lean back slightly
          3. Continue until the bar reaches your upper chest or collarbone
          4. Squeeze your shoulder blades together at the bottom
          5. Slowly return the bar to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you pull the bar down
          - Inhale as you return to the starting position

          ### 4. Tips
          - Lead with your elbows, not your hands
          - Keep your chest up and shoulders back throughout
          - Focus on squeezing your shoulder blades together
          - Maintain constant tension by not letting the weight stack rest
          - Avoid using momentum or excessive body swing

          ### 5. Common Mistakes
          - Leaning back excessively and turning it into a row
          - Using momentum to swing the weight down
          - Not achieving full range of motion at top or bottom
          - Allowing the shoulders to shrug up
          - Letting the weight stack rest between reps
          - Pulling the bar behind the neck, which can strain shoulders

          ### 6. Safety / Modifications
          - Adjust seat height and thigh pad to secure your lower body
          - Start with moderate weight to master proper form
          - Try an underhand grip for different muscle emphasis
          - Advanced variation: pause for 2-3 seconds at the bottom of each rep

  "Lat Pulldown (Machine)":
    category: Machine
    target: Back
    i18n:
      en:
        name: "Lat Pulldown (Machine)"
        instructions: |
          ## Overview
          The machine lat pulldown is a guided pulling exercise that primarily targets the latissimus dorsi. It also engages the rhomboids, middle trapezius, and biceps, using a fixed movement path to provide stability and consistent resistance throughout the pulling motion.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the lat pulldown machine with your thighs secured under the pads
          - Adjust the seat height so your arms can fully extend overhead
          - Grip the handles with an overhand or neutral grip, depending on the machine
          - Keep your chest up and shoulders down
          - Engage your core and maintain an upright torso

          ### 2. Movement
          1. Pull the handles down toward your chest by driving your elbows down and back
          2. Keep your torso upright throughout the movement
          3. Continue until the handles reach your upper chest
          4. Squeeze your shoulder blades together at the bottom
          5. Slowly return the handles to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you pull the handles down
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your chest up and shoulders back throughout
          - Lead with your elbows, pulling them down and back
          - Focus on squeezing your shoulder blades together
          - Maintain constant tension by not letting the weight stack rest
          - Control the weight throughout the entire range of motion

          ### 5. Common Mistakes
          - Leaning back excessively during the pull
          - Using momentum instead of controlled muscle contraction
          - Not achieving full range of motion
          - Allowing the shoulders to shrug up
          - Letting the weight stack rest between reps
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Adjust seat height and thigh pad for proper positioning
          - Start with light weight to establish mind-muscle connection
          - Try different grip attachments if available
          - Advanced variation: pause for 2-3 seconds at the bottom of each rep

  "Lat Pulldown (Single Arm)":
    category: Machine
    target: Back
    i18n:
      en:
        name: "Lat Pulldown (Single Arm)"
        instructions: |
          ## Overview
          The single arm lat pulldown is a unilateral pulling exercise that primarily targets the latissimus dorsi. It also engages the rhomboids, middle trapezius, and core stabilizers, using independent arm movement to address strength imbalances and improve overall back development.

          ## How to Perform
          ### 1. Starting Position
          - Sit at a lat pulldown station with your thighs secured under the pads
          - Attach a single handle to the high cable pulley
          - Grip the handle with one hand using an overhand or neutral grip
          - Extend your arm fully overhead while maintaining tension
          - Keep your torso upright and core engaged

          ### 2. Movement
          1. Pull the handle down toward your shoulder by driving your elbow down and back
          2. Keep your torso stable and avoid rotating excessively
          3. Continue until the handle reaches your shoulder or upper chest
          4. Squeeze your shoulder blade down and back at the bottom
          5. Slowly return the handle to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you pull the handle down
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your torso stable and minimize rotation
          - Lead with your elbow, pulling it down and back
          - Focus on squeezing your shoulder blade toward your spine
          - Maintain constant tension throughout the movement
          - Control the weight in both directions

          ### 5. Common Mistakes
          - Rotating the torso excessively instead of stabilizing
          - Using momentum to pull the weight down
          - Not achieving full range of motion
          - Allowing the shoulder to shrug up
          - Letting the weight stack rest between reps
          - Not performing equal reps on both sides

          ### 6. Safety / Modifications
          - Start with lighter weight than bilateral pulldowns
          - Place your free hand on the machine for additional stability
          - Advanced variation: pause for 2-3 seconds at the bottom of each rep
          - Ensure equal reps and focus on both sides for balanced development

  "Lat Pulldown - Underhand (Band)":
    category: Weighted Body Weight
    target: Back
    i18n:
      en:
        name: "Lat Pulldown - Underhand (Band)"
        instructions: |
          ## Overview
          The underhand band lat pulldown is a resistance-based pulling exercise that primarily targets the latissimus dorsi with greater biceps engagement. It also engages the rhomboids and middle trapezius, using an underhand grip with progressive band resistance throughout the movement.

          ## How to Perform
          ### 1. Starting Position
          - Anchor a resistance band overhead to a secure point
          - Stand or kneel facing the anchor point
          - Grip the band with both hands using an underhand grip (palms facing you)
          - Extend your arms overhead with tension on the band
          - Keep your core engaged and torso upright

          ### 2. Movement
          1. Pull the band down toward your chest by driving your elbows down and back
          2. Keep your torso upright throughout the movement
          3. Continue until your hands reach your upper chest or shoulders
          4. Squeeze your shoulder blades together at the bottom
          5. Slowly return your arms to the overhead position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you pull the band down
          - Inhale as you return to the starting position

          ### 4. Tips
          - The underhand grip allows elbows to stay closer to your body
          - Focus on pulling with your back muscles, not just your arms
          - Keep your chest up and shoulders back throughout
          - Maintain constant tension on the band
          - Control the resistance on both the pulling and releasing phases

          ### 5. Common Mistakes
          - Leaning back excessively to use body weight
          - Not maintaining constant tension on the band
          - Using momentum instead of controlled movement
          - Allowing the shoulders to shrug up
          - Relying too heavily on biceps instead of back muscles
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the underhand grip pattern
          - Adjust distance from anchor point to modify resistance
          - Perform kneeling if standing is too challenging
          - Advanced variation: use a heavier resistance band or add a pause at the bottom

