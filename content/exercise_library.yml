    i18n:
      en:
        name: "Push Press"
        instructions: |
          ## Overview
          The push press is a compound power exercise that primarily targets the deltoids with leg drive assistance. It also engages the triceps, upper chest, quadriceps, and core, using an explosive leg drive to press heavier weights overhead than strict pressing allows.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart, barbell racked at upper chest height
          - Grip the bar slightly wider than shoulder-width with palms facing forward
          - Unrack the bar and hold it at shoulder level
          - Keep your chest up, core engaged, and elbows slightly forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Dip slightly by bending your knees and hips
          2. Explosively drive upward with your legs while pressing the bar overhead
          3. Use the leg momentum to help press the bar overhead
          4. Continue pressing until your arms are fully extended
          5. Lock out your elbows at the top with the bar overhead
          6. Lower the bar back to shoulder level with control and repeat

          ### 3. Breathing
          - Inhale during the dip phase
          - Exhale explosively as you drive and press

          ### 4. Tips
          - The leg drive should be explosive and powerful
          - Time the leg drive with the arm press for maximum efficiency
          - Keep your core tight throughout the movement
          - This exercise allows for heavier loads than strict pressing
          - Focus on smooth coordination between legs and arms

          ### 5. Common Mistakes
          - Dipping too deep or not deep enough
          - Not coordinating the leg drive with the arm press
          - Pressing forward instead of straight up
          - Arching the lower back excessively
          - Not achieving full lockout at the top
          - Using the legs to do all the work instead of assisting

          ### 6. Safety / Modifications
          - Master the strict overhead press before progressing to push press
          - Start with moderate weight to learn the leg drive timing
          - Use a power rack with safety pins when training alone
          - This exercise is excellent for building explosive power

