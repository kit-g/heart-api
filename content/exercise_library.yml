        name: "Lateral Raise (Machine)"
        instructions: |
          ## Overview
          The machine lateral raise is an isolation exercise that primarily targets the middle deltoids. It also engages the upper trapezius, using a guided machine to provide stable resistance and consistent form for building shoulder width.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the lateral raise machine with your back against the pad
          - Adjust the seat height so the pivot points align with your shoulders
          - Position your arms against the padded levers
          - Grip the handles lightly
          - Keep your feet flat and core engaged

          ### 2. Movement
          1. Raise your arms out to the sides by pushing against the pads
          2. Continue raising until your arms are at shoulder height
          3. Keep your elbows slightly bent throughout
          4. Pause briefly at the top
          5. Slowly lower your arms back to the starting position with control
          6. Stop just before the weight stack touches to maintain tension and repeat

          ### 3. Breathing
          - Exhale as you raise your arms to the sides
          - Inhale as you lower your arms back down

          ### 4. Tips
          - Keep your back pressed firmly against the pad
          - Focus on lifting with your middle delts, not your traps
          - Control both the raising and lowering phases
          - Maintain constant tension by not letting the weight stack rest
          - Avoid shrugging your shoulders during the movement

          ### 5. Common Mistakes
          - Lifting your back off the pad during the raise
          - Shrugging the shoulders instead of isolating the delts
          - Using momentum instead of controlled movement
          - Letting the weight stack rest between reps
          - Raising the arms too high above shoulder level
          - Moving too quickly through the repetitions

