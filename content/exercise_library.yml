  "Clean and Jerk (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Clean and Jerk (Barbell)"
        instructions: |
          ## Overview
          The clean and jerk is a complete Olympic weightlifting movement that targets the entire body. It combines the clean (floor to shoulders) with the jerk (shoulders to overhead), engaging the legs, hips, back, shoulders, and core in one of the most demanding full-body exercises.

          ## How to Perform
          ### 1. Starting Position
          - Perform a full clean to bring the bar to your shoulders
          - Adjust your feet to shoulder-width or slightly wider
          - Keep elbows high with the bar resting on your front deltoids
          - Stand tall with core engaged and ready to dip

          ### 2. Movement
          1. Perform a clean to bring the bar to your shoulders
          2. Dip by bending your knees slightly while keeping torso vertical
          3. Drive explosively upward extending through your legs
          4. Press the bar overhead while splitting your feet or pushing them out
          5. Lock out your arms with the bar stable overhead
          6. Recover by bringing your feet back together under the bar

          ### 3. Breathing
          - Breathe during the setup and between phases
          - Hold your breath during the dip and drive
          - Exhale once the bar is locked out overhead

          ### 4. Tips
          - This is the most technically demanding Olympic lift
          - The dip should be controlled and vertical
          - Use leg drive, not just arms, to get the bar overhead
          - Practice split jerk or power jerk footwork separately
          - Master both the clean and overhead movements independently first

          ### 5. Common Mistakes
          - Dipping forward instead of staying vertical
          - Not using enough leg drive in the jerk
          - Pressing with arms before driving with legs
          - Poor bar path during the jerk portion
          - Not fully locking out arms overhead
          - Attempting without proper technical foundation

          ### 6. Safety / Modifications
          - Requires extensive coaching from qualified Olympic lifting instructor
          - Master the clean and the jerk separately before combining
          - Use bumper plates and proper lifting platform
          - Progress very gradually with weight increases

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
          - shoulders
      secondary:
        groups:
          - arms
          - core
          - hamstrings
  "Deadlift High Pull (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Deadlift High Pull (Barbell)"
        instructions: |
          ## Overview
          The barbell deadlift high pull is an Olympic lifting accessory exercise that targets the entire posterior chain, traps, and shoulders. It combines a deadlift with an explosive upright pull, building power and teaching the second pull mechanics used in cleans and snatches.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, barbell over mid-foot
          - Grip the bar slightly wider than shoulder-width
          - Hinge at hips and bend knees to reach the bar
          - Keep your back flat, chest up, and shoulders over the bar
          - Engage your core and lats before pulling

          ### 2. Movement
          1. Perform a deadlift by driving through your legs
          2. When the bar reaches mid-thigh, explosively extend hips and knees
          3. Shrug your shoulders and pull the bar upward with your elbows high
          4. Continue pulling until the bar reaches chest or lower rib height
          5. Lower the bar back to the starting position with control
          6. Repeat for the desired number of explosive reps

          ### 3. Breathing
          - Inhale before starting the pull
          - Hold your breath through the explosive pull
          - Exhale as you lower the bar

          ### 4. Tips
          - Focus on explosive hip extension at mid-thigh
          - Lead with your elbows during the high pull
          - Keep the bar close to your body throughout
          - This exercise teaches the second pull of Olympic lifts
          - Use lighter weight than your deadlift max

          ### 5. Common Mistakes
          - Pulling with arms too early before hip extension
          - Not fully extending hips and ankles at the power position
          - Letting the bar drift away from the body
          - Using too much weight and losing explosive speed
          - Rounding the back during the pull
          - Not keeping elbows high during the pull phase

          ### 6. Safety / Modifications
          - Start with light weight to master the explosive movement
          - This is an accessory exercise for Olympic lifting
          - Master the deadlift before adding the high pull component
          - Use this to develop power for cleans and snatches

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
      secondary:
        groups:
          - hamstrings
  "Hang Clean (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Hang Clean (Barbell)"
        instructions: |
          ## Overview
          The hang clean is an Olympic lifting variation that targets the quadriceps, glutes, hamstrings, and upper back. It starts from a standing position rather than the floor, focusing on the explosive hip extension and catch phases while reducing technical complexity.

          ## How to Perform
          ### 1. Starting Position
          - Stand holding a barbell at arm's length
          - Position the bar at mid-thigh with feet hip-width apart
          - Keep your chest up, back flat, and core engaged
          - Hinge slightly at the hips with knees bent
          - Grip just outside your legs with a hook grip if possible

          ### 2. Movement
          1. Lower the bar slightly below the knees with control
          2. Explosively extend your hips and knees to jump upward
          3. Shrug your shoulders and pull yourself under the bar
          4. Catch the bar on your front shoulders in a front squat position
          5. Stand up fully with the bar on your shoulders
          6. Lower the bar back to the hang position and repeat

          ### 3. Breathing
          - Inhale during the lowering phase
          - Hold your breath through the explosive pull and catch
          - Exhale after standing up

          ### 4. Tips
          - This variation focuses on the power position of the clean
          - Keep the bar close to your body during the pull
          - Catch the bar with elbows high and forward
          - The hang position reduces technical demands versus floor cleans
          - Focus on explosive hip extension

          ### 5. Common Mistakes
          - Lowering the bar too slowly and losing tension
          - Pulling with arms instead of driving with hips
          - Letting the bar drift away from the body
          - Catching with elbows low or back position
          - Not fully extending hips before pulling under
          - Using too much weight before mastering technique

          ### 6. Safety / Modifications
          - Learn this variation before progressing to full cleans from floor
          - Master the power clean (catching high) before full squat cleans
          - Use bumper plates for safe dropping if needed
          - Seek coaching for proper Olympic lifting technique

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
          - shoulders
      secondary:
        groups:
          - arms
          - core
          - hamstrings
  "Hang Snatch (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Hang Snatch (Barbell)"
        instructions: |
          ## Overview
          The hang snatch is an Olympic lifting variation that targets the entire body with emphasis on explosive power. Starting from a standing position, it requires moving the barbell from thighs to overhead in one fluid motion, building full-body coordination and power.

          ## How to Perform
          ### 1. Starting Position
          - Stand holding a barbell with a wide snatch grip
          - Position the bar at mid-thigh with feet hip-width apart
          - Keep your chest up, back flat, and core engaged
          - Hinge slightly at the hips with knees bent
          - Arms should be straight and wide on the bar

          ### 2. Movement
          1. Lower the bar slightly below the knees with control
          2. Explosively extend your hips and knees to jump upward
          3. Pull yourself under the bar as it rises
          4. Catch the bar overhead in a full squat or power position
          5. Stand up fully with the bar locked out overhead
          6. Lower the bar back to the hang position and repeat

          ### 3. Breathing
          - Inhale during the lowering phase
          - Hold your breath through the explosive pull and catch
          - Exhale after standing with the bar overhead

          ### 4. Tips
          - The wide grip creates a shorter pull distance
          - This is one of the most technical Olympic lifting movements
          - Keep the bar close during the pull
          - Catch with arms locked and bar over mid-foot
          - Master the hang position before progressing to full snatches

          ### 5. Common Mistakes
          - Using a grip that's too narrow
          - Pulling with arms before full hip extension
          - Pressing the bar out instead of pulling under it
          - Landing with feet too wide or in poor position
          - Not achieving full lockout overhead
          - Attempting without adequate mobility and technique training

          ### 6. Safety / Modifications
          - This requires extensive coaching from qualified instructors
          - Master the muscle snatch and overhead squat first
          - Use bumper plates and proper lifting platform
          - Progress very gradually with weight

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
          - shoulders
      secondary:
        groups:
          - arms
          - core
          - hamstrings
  "Jump Shrug (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Jump Shrug (Barbell)"
        instructions: |
          ## Overview
          The barbell jump shrug is an explosive Olympic lifting accessory exercise that primarily targets the traps, calves, and glutes. It teaches the explosive triple extension (ankles, knees, hips) essential for Olympic lifts while building power and trap development.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a barbell
          - Position the bar at mid-thigh with arms straight
          - Keep your chest up, back flat, and core engaged
          - Grip the bar just outside your legs
          - Maintain a slight bend in your knees

          ### 2. Movement
          1. Dip slightly by bending your knees
          2. Explosively extend your ankles, knees, and hips to jump upward
          3. Shrug your shoulders powerfully at the top of the jump
          4. Land softly with bent knees
          5. Reset to the starting position
          6. Repeat for the desired number of explosive reps

          ### 3. Breathing
          - Inhale during the dip
          - Exhale explosively during the jump and shrug

          ### 4. Tips
          - Focus on maximum explosive power with each rep
          - The shrug should happen at full extension
          - Keep arms straight throughout the movement
          - This exercise teaches the triple extension for Olympic lifts
          - Use lighter weight to maintain explosive speed

          ### 5. Common Mistakes
          - Pulling with arms instead of using legs and shrug
          - Not fully extending ankles, knees, and hips
          - Dipping too deep before the jump
          - Using too much weight and losing explosive quality
          - Landing with straight legs
          - Not shrugging at the peak of the jump

          ### 6. Safety / Modifications
          - Start with light weight to master the explosive movement
          - Land softly to protect your joints
          - This is an accessory exercise for Olympic lifting
          - Use this to develop power for cleans and snatches

    muscles:
      primary:
        ids:
          - trapezius_upper_l
          - trapezius_upper_r
      secondary: {}
  "Overhead Squat (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Overhead Squat (Barbell)"
        instructions: |
          ## Overview
          The barbell overhead squat is an Olympic lifting accessory that targets the quadriceps, glutes, and entire core. It also requires significant shoulder mobility and stability, building full-body strength, balance, and the receiving position used in snatches.

          ## How to Perform
          ### 1. Starting Position
          - Start with the barbell overhead in a wide snatch grip
          - Stand with feet shoulder-width apart, toes slightly out
          - Lock your arms completely with the bar over mid-foot
          - Keep your chest up, core engaged, and eyes forward
          - Maintain active shoulders pushing up into the bar

          ### 2. Movement
          1. Initiate the squat by bending your knees and hips simultaneously
          2. Keep the bar directly over mid-foot as you descend
          3. Maintain locked arms and active shoulders throughout
          4. Descend until thighs are at least parallel to the floor
          5. Drive through your heels to return to standing
          6. Keep the bar overhead and stable throughout, then repeat

          ### 3. Breathing
          - Inhale before descending
          - Hold your breath during the descent and bottom position
          - Exhale as you drive back up

          ### 4. Tips
          - This exercise requires excellent shoulder and hip mobility
          - The bar should remain over mid-foot throughout
          - Keep arms locked and push up into the bar constantly
          - Start with PVC pipe or empty bar to learn the movement
          - This builds the receiving position for snatches

          ### 5. Common Mistakes
          - Allowing arms to bend during the squat
          - Letting the bar drift forward or backward
          - Not maintaining active shoulders pushing into the bar
          - Inadequate hip or shoulder mobility for proper depth
          - Looking down instead of forward
          - Attempting without adequate mobility preparation

          ### 6. Safety / Modifications
          - Master with PVC pipe before adding weight
          - Work on shoulder and hip mobility separately
          - Use a spotter when learning with weight
          - This is essential preparation for Olympic snatch training

    muscles:
      primary:
        groups:
          - legs
          - shoulders
      secondary:
        groups:
          - back
          - core
  "Power Clean":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Power Clean"
        instructions: |
          ## Overview
          The power clean is an Olympic lifting variation that targets the entire posterior chain, traps, and shoulders. It differs from the full clean by catching the bar in a partial squat rather than full depth, emphasizing explosive power and being more accessible for athletes.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, barbell over mid-foot
          - Grip the bar just outside your legs
          - Hinge at hips and bend knees to reach the bar
          - Keep your back flat, chest up, and shoulders over the bar
          - Engage your lats and core before pulling

          ### 2. Movement
          1. Drive explosively through your legs to lift the bar off the floor
          2. Keep the bar close to your body as it travels upward
          3. Extend your hips and knees powerfully when the bar reaches mid-thigh
          4. Pull yourself under the bar slightly
          5. Catch the bar on your shoulders in a partial squat position
          6. Stand up fully to complete the rep

          ### 3. Breathing
          - Take a deep breath before pulling
          - Hold your breath through the pull and catch
          - Exhale after standing up

          ### 4. Tips
          - Catch the bar higher than in a full clean (above parallel)
          - Focus on explosive hip extension and speed under the bar
          - This variation requires less mobility than full cleans
          - Keep the bar path close to your body
          - More accessible for general athletic training

          ### 5. Common Mistakes
          - Catching too high with no knee bend
          - Pulling with arms too early instead of using legs
          - Letting the bar drift away from the body
          - Not extending fully at the hips before pulling under
          - Landing with elbows low
          - Using too much weight before mastering technique

          ### 6. Safety / Modifications
          - Learn from a qualified coach or trainer
          - Master the hang power clean before full power cleans
          - Use bumper plates for safe dropping
          - This variation is excellent for athletic power development

    muscles:
      primary:
        groups:
          - back
