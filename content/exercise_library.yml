      secondary:
        groups:
          - legs
  "Flat Leg Raise":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Flat Leg Raise"
        validated: true
        instructions: |
          ## Overview
          The flat leg raise is a challenging bodyweight core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the transverse abdominis and obliques for stability, requiring greater core strength than the bent-knee variation due to the extended leg position.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back on a mat with your legs fully extended
          - Place your hands beside your hips or under your glutes for support
          - Press your lower back into the mat and engage your core
          - Keep your head and shoulders relaxed on the mat
          - Point your toes and maintain straight legs throughout

          ### 2. Movement
          1. Lift both legs toward the ceiling by contracting your lower abs
          2. Keep your legs straight and together as you raise them
          3. Continue until your legs are perpendicular to the floor or slightly beyond
          4. Maintain your lower back pressed against the mat throughout
          5. Pause briefly at the top of the movement
          6. Slowly lower your legs back down with control
          7. Stop just before your heels touch the floor to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you lift your legs toward the ceiling
          - Inhale as you lower your legs back down

          ### 4. Tips
          - Keep your legs straight and together throughout the entire movement
          - Focus on using your lower abs rather than relying on hip flexors
          - Press your lower back firmly into the mat to protect your spine
          - Lower your legs only as far as you can while maintaining lower back contact
          - Move with control; slower is more challenging and effective

          ### 5. Common Mistakes
          - Allowing the lower back to arch off the mat, especially during the lowering phase
          - Bending the knees to make the exercise easier
          - Using momentum to swing the legs up instead of controlled contraction
          - Lowering the legs too far and losing lower back contact
          - Moving too quickly and sacrificing form
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Beginners should master flat knee raises before attempting this exercise
          - Place hands under your glutes for additional lower back support
          - Reduce range of motion by not lowering legs as far if you experience lower back strain
          - Advanced variation: lower legs very slowly (3-5 seconds) to increase intensity

    muscles:
      primary:
        ids:
          - rectus_abdominis_3_l
          - rectus_abdominis_3_r
          - rectus_abdominis_4_l
          - rectus_abdominis_4_r
      secondary:
        groups:
          - legs
  "Hanging Knee Raise":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Hanging Knee Raise"
        validated: true
        instructions: |
          ## Overview
          The hanging knee raise is a bodyweight core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the obliques, transverse abdominis, and grip strength as you hang from a bar, making it more challenging than floor-based variations.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with your hands shoulder-width apart using an overhand grip
          - Allow your body to hang fully extended with your feet off the ground
          - Engage your core and keep your shoulders pulled down and back
          - Keep your legs together and maintain a slight bend in your knees
          - Avoid excessive swinging by stabilizing your body

          ### 2. Movement
          1. Lift your knees toward your chest by contracting your lower abs
          2. Continue raising your knees until they reach at least hip level or higher
          3. Keep the movement controlled and avoid using momentum
          4. Pause briefly at the top of the movement
          5. Slowly lower your knees back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you lift your knees toward your chest
          - Inhale as you lower your knees back to the starting position

          ### 4. Tips
          - Focus on initiating the movement from your core, not just your hip flexors
          - Minimize swinging by keeping your core tight and movement controlled
          - Keep your shoulders engaged and avoid hanging passively
          - Think about bringing your hips forward and up, not just your knees
          - Maintain steady breathing throughout to avoid holding your breath

          ### 5. Common Mistakes
          - Using momentum and swinging instead of controlled muscle contraction
          - Only lifting the knees partially without engaging the lower abs fully
          - Allowing the shoulders to shrug up toward the ears
          - Moving too quickly and losing control
          - Releasing grip tension, which can compromise form
          - Not bringing knees high enough to engage the abs effectively

          ### 6. Safety / Modifications
          - Beginners can use wrist straps for better grip support
          - Use a captain's chair or dip station for an assisted version
          - Advanced variation: pause for 2-3 seconds at the top of each rep
          - Progress to hanging leg raises once you master the knee raise with proper form

