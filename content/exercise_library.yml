  "Bench Press (Cable)":
    category: Machine
    target: Chest
    i18n:
      en:
        name: "Bench Press (Cable)"
        instructions: |
          ## Overview
          The cable bench press is a machine-based pressing exercise that primarily targets the pectoralis major. It also engages the front deltoids and triceps, using cables to provide constant tension throughout the movement for consistent chest activation.

          ## How to Perform
          ### 1. Starting Position
          - Position a flat bench between two low cable pulleys
          - Attach handles to both low pulleys and set appropriate weight
          - Lie flat on the bench with your feet firmly planted on the floor
          - Grip both handles with arms extended, hands at chest level
          - Keep your shoulder blades retracted and pressed into the bench

          ### 2. Movement
          1. Lower the handles slowly toward your chest by bending your elbows
          2. Keep your elbows at about a 45-degree angle from your body
          3. Lower until your hands are beside your chest
          4. Pause briefly at the bottom
          5. Press the handles back up by extending your arms
          6. Stop just before full lockout to maintain tension, then repeat

          ### 3. Breathing
          - Inhale as you lower the handles toward your chest
          - Exhale as you press the handles back up

          ### 4. Tips
          - Maintain constant tension by not fully locking out at the top
          - Keep your shoulder blades retracted throughout
          - Control both the lowering and pressing phases equally
          - Keep your feet flat and core engaged for stability
          - Focus on squeezing your chest at the top of each rep

          ### 5. Common Mistakes
          - Fully locking out and losing tension on the chest
          - Allowing the elbows to flare out excessively
          - Using momentum instead of controlled movement
          - Lifting the glutes off the bench
          - Not maintaining shoulder blade retraction
          - Arching the lower back excessively

          ### 6. Safety / Modifications
          - Start with light weight to master the cable press pattern
          - Adjust cable height for different angles (low, mid, high)
          - Perform on an incline or decline bench for muscle variation
          - Use one arm at a time for unilateral training

