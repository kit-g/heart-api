        instructions: |
          ## Overview
          The barbell floor press is a partial-range pressing exercise that primarily targets the pectoralis major and triceps. It also engages the front deltoids, using the floor to limit range of motion and reduce shoulder strain while allowing for heavy pressing.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on the floor with your knees bent and feet flat
          - Position yourself under a racked barbell or have spotters hand you the bar
          - Grip the bar with hands slightly wider than shoulder-width apart
          - Hold the bar with arms fully extended above your chest
          - Keep your shoulder blades retracted against the floor

          ### 2. Movement
          1. Lower the bar slowly until your elbows touch the floor
          2. Keep your elbows at about a 45-degree angle from your body
          3. Pause briefly when your triceps contact the floor
          4. Press the bar back up by extending your arms
          5. Lock out your elbows at the top
          6. Repeat for controlled reps without bouncing elbows off the floor

          ### 3. Breathing
          - Inhale as you lower the bar
          - Exhale as you press the bar back up

          ### 4. Tips
          - The floor limits your range of motion and reduces shoulder stress
          - Pause briefly when elbows touch the floor, don't bounce
          - Focus on explosive pressing from the bottom position
          - Keep your shoulder blades retracted throughout
          - This variation allows for heavier loads than full-range pressing

          ### 5. Common Mistakes
          - Bouncing elbows off the floor to generate momentum
          - Allowing the elbows to flare out excessively
          - Not pausing when elbows touch the floor
          - Arching the back excessively
          - Using too much weight and compromising control
          - Lifting the glutes off the floor

          ### 6. Safety / Modifications
          - Use a power rack with safety pins set at appropriate height
          - Have spotters help you get into and out of position with heavy weights
          - Start with moderate weight to adapt to the limited range
          - Advanced variation: add chains or use slow negatives

