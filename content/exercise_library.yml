        instructions: |
          ## Overview
          The incline machine chest press is a guided pressing exercise that primarily targets the upper pectoralis major. It also engages the front deltoids and triceps, using a fixed movement path on an incline to provide stability and consistent resistance for upper chest development.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the incline chest press machine with your back firmly against the pad
          - Adjust the seat height so the handles align with your upper chest
          - Grip the handles with both hands
          - Plant your feet flat on the floor and engage your core
          - Keep your shoulder blades retracted against the pad

          ### 2. Movement
          1. Press the handles forward and upward by extending your arms
          2. Keep your back pressed firmly against the pad throughout
          3. Continue until your arms are fully extended
          4. Pause briefly at full extension
          5. Slowly return the handles to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you press the handles forward
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your back pressed firmly against the pad
          - Focus on squeezing your upper chest at full extension
          - Maintain shoulder blade retraction throughout
          - Control both the pressing and returning phases
          - Maintain constant tension by not letting the weight stack rest

          ### 5. Common Mistakes
          - Lifting your back off the pad during the press
          - Using momentum instead of controlled muscle contraction
          - Letting the weight stack rest between reps
          - Not achieving full range of motion
          - Allowing the shoulders to shrug forward
          - Moving too quickly through the repetitions

