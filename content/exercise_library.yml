  "Squat (Barbell)":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Squat (Barbell)"
        instructions: |
          ## Overview
          The barbell squat is a compound lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core, lower back, and upper back, making it one of the most effective full-body strength exercises for building overall lower body power.

          ## How to Perform
          ### 1. Starting Position
          - Position a barbell in a rack at upper chest height
          - Step under the bar and position it across your upper back (high bar) or lower on your rear delts (low bar)
          - Grip the bar with hands slightly wider than shoulder-width
          - Unrack the bar and step back with feet shoulder-width apart
          - Keep your chest up, core engaged, and eyes forward

          ### 2. Movement
          1. Initiate the squat by bending your knees and hips simultaneously
          2. Keep your chest up and weight on your heels
          3. Descend until thighs are at least parallel to the floor
          4. Maintain a neutral spine throughout the movement
          5. Drive through your heels to return to standing position
          6. Fully extend your hips and knees at the top, then repeat

          ### 3. Breathing
          - Take a deep breath and brace your core before descending
          - Hold your breath during the descent and bottom position
          - Exhale as you drive back up or at the top

          ### 4. Tips
          - Keep your knees tracking over your toes
          - Maintain an upright torso throughout
          - Drive through your entire foot, not just your toes
          - Keep the bar path vertical over mid-foot
          - Focus on controlled descent and explosive ascent

          ### 5. Common Mistakes
          - Allowing the knees to cave inward
          - Not achieving adequate depth (at least parallel)
          - Rising onto your toes instead of keeping weight on heels
          - Rounding the back or losing neutral spine
          - Letting the bar drift forward during descent
          - Using too much weight before mastering form

          ### 6. Safety / Modifications
          - Always use safety bars or a spotter when lifting heavy
          - Start with light weight to master proper form
          - Adjust bar position (high vs. low bar) based on comfort and goals
          - Advanced variation: add chains, bands, or perform pause squats

