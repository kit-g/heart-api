        name: "Chest Dip (Assisted)"
        instructions: |
          ## Overview
          The assisted chest dip is a machine-based pressing exercise that primarily targets the lower pectoralis major with support. It also engages the triceps and front deltoids, using counterbalance assistance to make the dip movement more accessible while building strength toward unassisted dips.

          ## How to Perform
          ### 1. Starting Position
          - Set the weight on the assisted dip machine (more weight = more assistance)
          - Grip the handles with hands slightly wider than shoulder-width
          - Position your knees or feet on the assistance pad
          - Start with arms fully extended and torso leaning forward
          - Engage your core and keep your shoulders pressed down

          ### 2. Movement
          1. Lower your body by bending your elbows until they reach about 90 degrees
          2. Keep your torso leaning forward throughout the movement
          3. Maintain control as the assistance pad supports your weight
          4. Pause briefly at the bottom of the movement
          5. Press through your palms to extend your arms and return to starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up to the starting position

          ### 4. Tips
          - Maintain a forward lean to emphasize chest over triceps
          - Gradually reduce assistance weight as you build strength
          - Focus on controlled movement throughout the range of motion
          - Keep your elbows flared slightly for chest emphasis
          - Avoid relying too heavily on the assistance

          ### 5. Common Mistakes
          - Using too much assistance and not challenging yourself
          - Staying too upright instead of leaning forward
          - Allowing the elbows to flare out excessively
          - Using momentum instead of controlled movement
          - Not achieving full range of motion
          - Not gradually reducing assistance weight over time

          ### 6. Safety / Modifications
          - Start with higher assistance and gradually decrease as you get stronger
          - Focus on form over reducing assistance too quickly
          - Progress toward band-assisted or negative dips before attempting unassisted
          - Reduce range of motion if you experience shoulder discomfort

