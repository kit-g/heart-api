        instructions: |
          ## Overview
          Indoor cycling is a cardiovascular exercise performed on a stationary bike that targets the quadriceps, hamstrings, and glutes. It provides controlled, low-impact aerobic conditioning while building leg strength and endurance in a climate-controlled environment.

          ## How to Perform
          ### 1. Safety 
          - Adjust seat and handlebars before each session
          - Start with beginner classes or programs
          - Modify intensity by adjusting resistance
          - Take breaks if needed during challenging intervals

