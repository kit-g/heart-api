  "Knees to Elbows":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Knees to Elbows"
        validated: true
        instructions: |
          ## Overview
          Knees to elbows is an advanced hanging core exercise that primarily targets the entire rectus abdominis and hip flexors. It also engages the obliques, transverse abdominis, grip strength, and shoulder stabilizers, requiring significant core control and coordination.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with your hands shoulder-width apart using an overhand grip
          - Allow your body to hang fully extended with your feet off the ground
          - Engage your core and keep your shoulders pulled down and back
          - Minimize swinging by stabilizing your body
          - Keep your legs together throughout the movement

          ### 2. Movement
          1. Simultaneously lift your knees toward your elbows by contracting your abs
          2. Lean back slightly and bring your knees as high as possible
          3. Aim to touch or come close to touching your elbows with your knees
          4. Keep the movement controlled and avoid excessive swinging
          5. Pause briefly at the top of the movement
          6. Slowly lower your knees back to the starting position with control
          7. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale forcefully as you lift your knees toward your elbows
          - Inhale as you lower your knees back to the starting position

          ### 4. Tips
          - Focus on bringing your knees up and forward, not just up
          - Allow a slight backward lean to facilitate knee-to-elbow contact
          - Keep your shoulders engaged and avoid hanging passively
          - Minimize swinging by maintaining core tension throughout
          - Think about curling your entire torso, not just lifting your legs

          ### 5. Common Mistakes
          - Using excessive momentum and swinging instead of controlled contraction
          - Not bringing knees high enough to fully engage the core
          - Allowing the shoulders to shrug up toward the ears
          - Moving too quickly and losing control
          - Releasing grip tension, which compromises form
          - Not leaning back slightly, making it harder to reach elbows

          ### 6. Safety / Modifications
          - Master hanging knee raises before attempting this advanced variation
          - Use wrist straps if grip strength is limiting
          - Beginners can perform the exercise on a captain's chair for support
          - Advanced variation: add a twist to alternate bringing knees to opposite elbows

