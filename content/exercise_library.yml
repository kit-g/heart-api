        name: "Pec Deck (Machine)"
        instructions: |
          ## Overview
          The pec deck is an isolation exercise that primarily targets the pectoralis major. It also engages the front deltoids minimally, using a fixed movement path with padded arms to provide stability and consistent resistance throughout the fly motion.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the pec deck machine with your back firmly against the pad
          - Adjust the seat height so your upper arms are parallel to the floor
          - Position your forearms against the padded arms of the machine
          - Grip the handles lightly or rest your forearms on the pads
          - Keep your feet flat on the floor and engage your core

          ### 2. Movement
          1. Bring both padded arms together in front of your chest
          2. Keep your elbows at roughly shoulder height throughout
          3. Continue until the pads meet or nearly touch
          4. Squeeze your chest hard at the peak contraction
          5. Slowly return the pads to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you bring the pads together
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your back pressed firmly against the pad
          - Focus on squeezing your chest at the peak
          - Maintain constant tension by not letting the weight stack rest
          - Keep your elbows at roughly shoulder height
          - Control both the squeezing and opening phases

          ### 5. Common Mistakes
          - Lifting your back off the pad during the movement
          - Using momentum instead of controlled muscle contraction
          - Letting the weight stack rest between reps
          - Lowering the pads too far back and straining the shoulders
          - Moving too quickly and losing the squeeze
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Adjust seat height to ensure proper arm alignment
          - Start with light weight to establish mind-muscle connection
          - Reduce range of motion if you experience shoulder discomfort
          - Advanced variation: pause for 2-3 seconds at peak contraction

