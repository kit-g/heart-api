        instructions: |
          ## Overview
          The knee push up is a modified bodyweight pressing exercise that primarily targets the pectoralis major. It also engages the front deltoids, triceps, and core, using a kneeling position to reduce the load and make the exercise more accessible for beginners.

          ## How to Perform
