          - hamstrings
  "Split Jerk (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Split Jerk (Barbell)"
        instructions: |
          ## Overview
          The split jerk is an Olympic lifting movement that targets the shoulders, triceps, and legs. It involves driving a barbell from the shoulders to overhead while splitting the feet fore and aft, allowing for greater stability and heavier weights than power jerks.

          ## How to Perform
          ### 1. Starting Position
          - Start with the barbell resting on your front shoulders
          - Stand with feet hip-width apart
          - Keep elbows slightly forward and high
          - Engage your core and maintain an upright torso
          - Prepare for a controlled dip

          ### 2. Movement
          1. Dip by bending your knees slightly while keeping torso vertical
          2. Drive explosively upward extending through your legs
          3. Split your feet fore and aft as you press the bar overhead
          4. Land with front knee bent and back leg extended
          5. Lock out your arms with the bar stable overhead
          6. Recover by bringing your front foot back, then your back foot

          ### 3. Breathing
          - Take a breath before the dip
          - Hold your breath during the dip, drive, and split
          - Exhale once the bar is locked out and stable

          ### 4. Tips
          - The split stance provides more stability than other jerks
          - Dip must be vertical without leaning forward
          - Drive aggressively with your legs before arms press
          - Front shin should be vertical in the receiving position
          - This is the most common jerk variation in competition

          ### 5. Common Mistakes
          - Dipping forward instead of staying vertical
          - Not splitting feet far enough apart
          - Pressing with arms before driving with legs
          - Landing with front knee past the toes
          - Poor bar path during the drive
          - Not fully locking out arms overhead

          ### 6. Safety / Modifications
          - Requires coaching from qualified Olympic lifting instructor
          - Practice the split footwork without weight first
          - Master the power jerk before learning split jerk
          - Use blocks to practice the receiving position

