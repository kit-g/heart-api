  "Incline Chest Fly (Dumbbell)":
    category: Dumbbell
    target: Chest
    i18n:
      en:
        name: "Incline Chest Fly (Dumbbell)"
        instructions: |
          ## Overview
          The incline dumbbell chest fly is an isolation exercise that primarily targets the upper pectoralis major. It also engages the front deltoids as stabilizers, using an inclined position with dumbbells to create a wide arc of motion that stretches and contracts the upper chest muscles.

          ## How to Perform
          ### 1. Starting Position
          - Set an adjustable bench to a 30-45 degree incline
          - Lie back on the bench with your feet firmly planted on the floor
          - Hold a dumbbell in each hand with arms extended above your upper chest
          - Position dumbbells with palms facing each other
          - Keep a slight bend in your elbows throughout

          ### 2. Movement
          1. Lower both dumbbells out to the sides in a wide arc
          2. Keep your elbows slightly bent throughout the movement
          3. Continue lowering until you feel a stretch in your upper chest
          4. Pause briefly at the bottom
          5. Bring the dumbbells back together above your chest in a hugging motion
          6. Squeeze your upper chest at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower the dumbbells out to the sides
          - Exhale as you bring the dumbbells back together

          ### 4. Tips
          - Keep a consistent slight bend in your elbows throughout
          - Focus on the stretch at the bottom and squeeze at the top
          - Maintain shoulder blade retraction throughout
          - The incline emphasizes the upper chest fibers
          - Control the weight throughout the entire arc

          ### 5. Common Mistakes
          - Straightening the arms completely, turning it into a press
          - Bending the elbows too much, reducing chest engagement
          - Lowering the dumbbells too far and straining the shoulders
          - Setting the incline too steep, shifting emphasis to shoulders
          - Using too much weight and losing the arc motion
          - Not squeezing at the top of the movement

          ### 6. Safety / Modifications
          - Start with light dumbbells to master the arc motion on an incline
          - Keep elbows slightly bent to protect shoulder joints
          - Adjust incline angle between 30-45 degrees for comfort
          - Advanced variation: pause for 2-3 seconds at the bottom stretch

