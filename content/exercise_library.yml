  "Seated Overhead Press (Barbell)":
    category: Barbell
    target: Shoulders
    i18n:
      en:
        name: "Seated Overhead Press (Barbell)"
        instructions: |
          ## Overview
          The seated barbell overhead press is a compound upper body exercise that primarily targets all three heads of the deltoids. It also engages the triceps and upper chest, using a seated position with back support to eliminate leg drive and isolate the shoulders.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a bench with back support, feet flat on the floor
          - Position a barbell at upper chest height in a rack
          - Grip the bar slightly wider than shoulder-width with palms facing forward
          - Unrack the bar and hold it at shoulder level
          - Keep your back pressed against the pad and core engaged

          ### 2. Movement
          1. Press the bar straight up overhead by extending your arms
          2. Continue pressing until your arms are fully extended
          3. Lock out your elbows at the top
          4. Pause briefly at the top
          5. Lower the bar back to shoulder level with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Take a breath and brace before pressing
          - Hold your breath during the press
          - Exhale at the top or as you lower the bar

          ### 4. Tips
          - Keep your back pressed firmly against the pad
          - The seated position eliminates leg drive for strict shoulder work
          - Press straight up, not forward
          - Focus on full range of motion
          - This variation is excellent for isolating the shoulders

          ### 5. Common Mistakes
          - Arching the lower back off the pad during the press
          - Pressing forward instead of straight up
          - Not achieving full lockout at the top
          - Using momentum by lifting the glutes off the seat
          - Flaring the elbows out too wide
          - Not maintaining core tension

          ### 6. Safety / Modifications
          - Use a spotter when lifting heavy weights
          - Start with lighter weight than your standing press
          - Adjust back pad angle if available for comfort
          - If you experience shoulder discomfort, check your grip width and bar path

