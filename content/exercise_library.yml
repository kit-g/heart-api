  "Single Leg Bridge":
    category: Weighted Body Weight
    target: Legs
    i18n:
      en:
        name: "Single Leg Bridge"
        instructions: |
          ## Overview
          The single leg bridge is a unilateral bodyweight exercise that primarily targets the glutes and hamstrings. It also engages the core and hip stabilizers, using a single-leg position to build glute strength, address imbalances, and improve hip stability.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back with knees bent and feet flat on the floor
          - Position your feet hip-width apart near your glutes
          - Extend one leg straight out, keeping it in line with your thigh
          - Keep your arms at your sides on the floor
          - Engage your core throughout

          ### 2. Movement
          1. Drive through the heel of your planted foot to lift your hips upward
          2. Raise your hips until your body forms a straight line from shoulders to knees
          3. Keep your extended leg straight and in line with your working thigh
          4. Squeeze your glute hard at the top of the movement
          5. Slowly lower your hips back down with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Inhale as you lower your hips down
          - Exhale as you drive your hips up

          ### 4. Tips
          - Focus on squeezing your glute at the top, not arching your back
          - Keep your hips level throughout the movement
          - Drive through your heel, not your toes
          - Keep your extended leg straight and engaged
          - Control both the lifting and lowering phases

          ### 5. Common Mistakes
          - Hyperextending the lower back at the top instead of using glutes
          - Allowing the hips to rotate or tilt to one side
          - Not achieving full hip extension at the top
          - Pushing through the toes instead of the heel
          - Bending the extended leg during the movement
          - Moving too quickly and losing control

          ### 6. Safety / Modifications
          - Master regular glute bridges before progressing to single leg
          - Place your hands on your hips to check for level hips
          - Reduce range of motion if you experience lower back discomfort
          - Advanced variation: elevate your foot on a bench or add a pause at the top

    muscles:
      primary:
        groups:
          - glutes
      secondary:
        groups:
          - hamstrings
  "Squat (Band)":
    category: Weighted Body Weight
    target: Legs
    i18n:
      en:
        name: "Squat (Band)"
        instructions: |
          ## Overview
          The band squat is a resistance-based compound exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core, using progressive band resistance to teach proper squat mechanics with lighter loading and constant tension.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart, stepping on the center of a resistance band
          - Hold the band handles at shoulder height or loop the band over your shoulders
          - Keep your chest up, core engaged, and eyes forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Initiate the squat by bending your knees and hips simultaneously
          2. Keep your chest up and weight on your heels
          3. Descend until thighs are at least parallel to the floor
          4. Pause briefly at the bottom
          5. Drive through your heels to return to standing position
          6. Fully extend your hips and knees at the top, then repeat

          ### 3. Breathing
          - Inhale as you descend into the squat
          - Exhale as you drive back up to standing

          ### 4. Tips
          - The band provides increasing resistance as you stand
          - Keep your knees tracking over your toes
          - Maintain an upright torso throughout
          - Drive through your entire foot, not just your toes
          - Focus on controlled movement in both directions

          ### 5. Common Mistakes
          - Allowing the knees to cave inward
          - Not achieving adequate depth
          - Rising onto your toes instead of keeping weight on heels
          - Rounding the back during descent
          - Using momentum instead of controlled movement
          - Not maintaining constant tension on the band

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the movement pattern
          - Adjust foot position on the band to modify resistance
          - Use this variation to learn squat mechanics before progressing to barbells
          - Advanced variation: use a heavier resistance band or add a pause at the bottom

