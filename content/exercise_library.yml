        instructions: |
          ## Overview
          The seated dumbbell overhead press is a compound upper body exercise that primarily targets all three heads of the deltoids. It also engages the triceps and upper chest, using a seated position with dumbbells for independent arm movement and strict shoulder isolation.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a bench with back support, feet flat on the floor
          - Hold a dumbbell in each hand at shoulder height
          - Position dumbbells with palms facing forward
          - Keep your back pressed against the pad and core engaged
          - Maintain your elbows below your wrists

          ### 2. Movement
          1. Press both dumbbells straight up overhead by extending your arms
          2. Continue pressing until your arms are fully extended
          3. Bring the dumbbells together at the top without clashing them
          4. Pause briefly at the top
          5. Lower the dumbbells back to shoulder level with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you press the dumbbells overhead
          - Inhale as you lower the dumbbells back down

          ### 4. Tips
          - Keep your back pressed firmly against the pad
          - The seated position provides stability for strict pressing
          - Press straight up, not forward or back
          - Control both the pressing and lowering phases
          - Avoid clashing the dumbbells together at the top

          ### 5. Common Mistakes
          - Arching the lower back off the pad during the press
          - Pressing forward instead of straight up
          - Not achieving full extension at the top
          - Clashing the dumbbells together at the top
          - Using too much weight and compromising form
          - Allowing one arm to dominate the movement

          ### 6. Safety / Modifications
          - Start with moderate dumbbells to master the seated position
          - Adjust back pad angle if available for comfort
          - Perform alternating presses to reduce fatigue
          - If you experience shoulder discomfort, reduce weight or check your form

