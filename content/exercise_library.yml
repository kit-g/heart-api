  "Front Raise (Cable)":
    category: Machine
    target: Shoulders
    i18n:
      en:
        name: "Front Raise (Cable)"
        instructions: |
          ## Overview
          The cable front raise is an isolation exercise that primarily targets the front deltoids. It also engages the upper chest, using a cable to provide constant tension throughout the movement for consistent shoulder activation.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing away from a low cable pulley
          - Attach a straight bar or rope handle to the low pulley
          - Grip the attachment with both hands
          - Step forward to create tension with the attachment in front of your thighs
          - Keep your chest up, core engaged, and arms straight with slight elbow bend

          ### 2. Movement
          1. Raise the attachment forward and upward in front of your body
          2. Keep your arms straight with only a slight elbow bend
          3. Continue raising until your arms are at shoulder height
          4. Pause briefly at the top
          5. Slowly lower the attachment back to the starting position with control
          6. Stop just before losing tension on the cable and repeat

          ### 3. Breathing
          - Exhale as you raise the attachment up
          - Inhale as you lower it back down

          ### 4. Tips
          - Maintain constant tension by not letting the weight stack touch
          - Keep your torso stable and avoid using momentum
          - Focus on squeezing your front delts at the top
          - Control both the raising and lowering phases equally
          - The cable provides consistent resistance throughout

          ### 5. Common Mistakes
          - Using momentum or swinging the attachment
          - Leaning back during the raise
          - Bending the elbows excessively
          - Raising the attachment too high above shoulder level
          - Letting the weight stack rest between reps
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with light weight to master the cable movement pattern
          - Adjust cable height and position as needed
          - Perform one arm at a time for unilateral focus
          - If you experience shoulder discomfort, reduce weight or range of motion

