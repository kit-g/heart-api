        name: "Incline Bench Press (Dumbbell)"
        instructions: |
          ## Overview
          The incline dumbbell bench press is a compound pressing exercise that primarily targets the upper pectoralis major. It also engages the front deltoids and triceps, using an inclined position with independent arm movement for greater range of motion and upper chest development.

          ## How to Perform
          ### 1. Starting Position
          - Set an adjustable bench to a 30-45 degree incline
          - Sit back on the bench with your feet firmly planted on the floor
          - Hold a dumbbell in each hand at upper chest level
          - Position dumbbells with a neutral or pronated grip
          - Keep your shoulder blades retracted and pressed into the bench

          ### 2. Movement
          1. Press both dumbbells upward by extending your arms
          2. Keep your elbows at about a 45-degree angle from your body
          3. Continue until your arms are fully extended above your upper chest
          4. Bring dumbbells together at the top without clashing them
          5. Slowly lower the dumbbells back to starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower the dumbbells to your chest
          - Exhale as you press the dumbbells back up

          ### 4. Tips
          - Keep your shoulder blades retracted throughout
          - Focus on squeezing your upper chest at the top
          - Allow dumbbells to travel deeper than a barbell would
          - Control both the lowering and pressing phases
          - Maintain a 30-45 degree incline for optimal upper chest engagement

          ### 5. Common Mistakes
          - Setting the incline too steep, shifting emphasis to shoulders
          - Bouncing dumbbells off the chest
          - Allowing the elbows to flare out excessively
          - Lifting the glutes off the bench during the press
          - Clashing dumbbells together at the top
          - Losing shoulder blade retraction

          ### 6. Safety / Modifications
          - Start with lighter dumbbells than your flat press
          - Adjust incline angle between 30-45 degrees based on comfort
          - Use a spotter when attempting heavy weights
