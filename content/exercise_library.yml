          1. Press the bar straight up overhead by extending your arms
          2. Continue pressing until your arms are fully extended
          3. Lock out your elbows at the top
          4. Pause briefly at the top
          5. Lower the bar back to shoulder level with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you press the bar overhead
          - Inhale as you lower the bar back down

          ### 4. Tips
          - The fixed bar path helps maintain proper form
          - Keep your core tight to prevent arching your lower back
          - Take advantage of the guided path for controlled reps
          - Focus on pressing straight up
          - Use the safety catches for added security

          ### 5. Common Mistakes
          - Positioning yourself incorrectly relative to the bar path
          - Arching the lower back excessively during the press
          - Not achieving full lockout at the top
          - Flaring the elbows out too wide
          - Relying too heavily on the machine's stability
          - Using too much weight before mastering form

          ### 6. Safety / Modifications
