        name: "Overhead Press (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell overhead press is a compound upper body exercise that primarily targets all three heads of the deltoids. It also engages the triceps and upper chest, using dumbbells for independent arm movement and a greater range of motion than barbell variations.

          ## How to Perform
          ### 1. Starting Position
          - Stand or sit with feet shoulder-width apart holding a dumbbell in each hand
          - Position dumbbells at shoulder height with palms facing forward
          - Keep your elbows below your wrists
          - Maintain an upright torso with chest up and core engaged
          - Keep your feet flat on the floor

          ### 2. Movement
          1. Press both dumbbells straight up overhead by extending your arms
          2. Continue pressing until your arms are fully extended
          3. Bring the dumbbells together at the top without clashing them
          4. Pause briefly at the top
          5. Lower the dumbbells back to shoulder level with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you press the dumbbells overhead
          - Inhale as you lower the dumbbells back down

          ### 4. Tips
          - Keep your core tight to prevent arching your lower back
          - Press straight up, not forward or back
          - Control both the pressing and lowering phases
          - The dumbbells allow for independent arm movement
          - Avoid clashing the dumbbells together at the top

          ### 5. Common Mistakes
          - Arching the lower back excessively during the press
          - Pressing forward instead of straight up
          - Not achieving full extension at the top
          - Clashing the dumbbells together at the top
          - Using too much weight and compromising form
          - Allowing one arm to dominate the movement

          ### 6. Safety / Modifications
          - Start with moderate dumbbells to master balance and form
          - Perform seated for more stability and back support
          - Perform one arm at a time for unilateral focus
          - If you experience shoulder discomfort, reduce weight or check your form

