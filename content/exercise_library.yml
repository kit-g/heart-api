          1. Place one foot fully on top of the box
          2. Drive through the heel of your elevated foot to step up
          3. Bring your other foot up to meet it on the box
          4. Stand fully upright on top of the box
          5. Step down with the same leg that stepped up first
          6. Repeat for desired reps, then switch legs

          ### 3. Breathing
          - Inhale before stepping up
          - Exhale as you drive up onto the box

          ### 4. Tips
          - Drive through your elevated heel, not your toes
          - Avoid pushing off with your trailing leg
          - Keep your chest up and torso upright throughout
          - Keep the barbell stable on your upper back
          - Focus on controlled movement in both directions

          ### 5. Common Mistakes
          - Using momentum from the trailing leg to push up
          - Leaning too far forward during the step-up
          - Not placing the full foot on the box
          - Allowing the knee to cave inward
          - Using a box that's too high for proper form with added weight
          - Not fully standing up on top of the box

          ### 6. Safety / Modifications
          - Ensure the box is stable and won't slip or tip
          - Start with bodyweight step-ups before adding a barbell
          - Use a lower box height than bodyweight variations when first adding weight
          - Advanced variation: increase box height or barbell weight gradually

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Step-up (Dumbbell)":
    category: Dumbbell
    target: Legs
    i18n:
      en:
        name: "Step-up (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell step-up is a unilateral lower body exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the core and stabilizers, using dumbbells held at the sides to add resistance while maintaining better balance than barbell variations.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing a sturdy box or bench at knee height or below
          - Hold a dumbbell in each hand with arms straight at your sides
          - Keep your chest up, core engaged, and eyes forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Place one foot fully on top of the box
          2. Drive through the heel of your elevated foot to step up
          3. Bring your other foot up to meet it on the box
          4. Stand fully upright on top of the box
          5. Step down with the same leg that stepped up first
          6. Repeat for desired reps, then switch legs

          ### 3. Breathing
          - Inhale before stepping up
          - Exhale as you drive up onto the box

          ### 4. Tips
          - Drive through your elevated heel, not your toes
          - Avoid pushing off with your trailing leg
          - Keep your chest up and torso upright throughout
          - Let the dumbbells hang naturally at your sides
          - Focus on controlled movement in both directions

          ### 5. Common Mistakes
          - Using momentum from the trailing leg to push up
          - Leaning too far forward during the step-up
          - Not placing the full foot on the box
          - Allowing the knee to cave inward
          - Using a box that's too high for proper form
          - Not fully standing up on top of the box

          ### 6. Safety / Modifications
          - Ensure the box is stable and won't slip or tip
          - Start with light dumbbells to master balance and form
          - Use a lower box height when first adding weight
          - Advanced variation: increase box height, add weight, or hold one dumbbell for unilateral focus

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Straight Leg Deadlift (Band)":
    category: Weighted Body Weight
    target: Legs
    i18n:
      en:
        name: "Straight Leg Deadlift (Band)"
        instructions: |
          ## Overview
          The band straight leg deadlift is a resistance-based hip hinge exercise that primarily targets the hamstrings and erector spinae. It also engages the glutes and lats, using progressive band resistance with minimal knee bend to emphasize the posterior chain.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, stepping on the center of a resistance band
          - Grip both ends of the band with hands just outside your legs
          - Stand upright with chest up, shoulders back, and core engaged
          - Maintain only a very slight bend in your knees throughout

          ### 2. Movement
          1. Hinge at the hips by pushing them back and lowering your torso
          2. Keep your back flat and the band close to your legs
          3. Keep your legs nearly straight with minimal knee bend
          4. Lower until you feel a stretch in your hamstrings
          5. Drive your hips forward to return to the starting position
          6. Squeeze your glutes at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you hinge forward
          - Exhale as you drive your hips forward to stand up

          ### 4. Tips
          - Keep your legs nearly straight throughout the movement
          - Focus on the hip hinge, not squatting
          - Keep your back flat and chest up throughout
          - Push your hips back as far as possible
          - The band provides increasing resistance as you stand

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Bending the knees too much, turning it into a Romanian deadlift
          - Not pushing the hips back far enough
          - Lowering too far beyond the point of hamstring stretch
          - Not maintaining constant tension on the band
          - Looking up instead of maintaining neutral neck position

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the hip hinge with straight legs
          - Adjust foot position on the band to modify resistance
          - Progress from Romanian deadlifts if this variation feels too intense
          - If you experience lower back discomfort, reduce resistance and ensure proper form

    muscles:
      primary:
        groups:
          - hamstrings
      secondary:
        groups:
          - back
          - glutes
  "Stiff Leg Deadlift (Dumbbell)":
    category: Dumbbell
    target: Legs
    i18n:
      en:
        name: "Stiff Leg Deadlift (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell stiff leg deadlift is a hip hinge exercise that primarily targets the hamstrings and erector spinae. It also engages the glutes and lats as stabilizers, using dumbbells with minimal knee bend to emphasize the posterior chain and build lower back and hamstring strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a dumbbell in each hand
          - Position dumbbells in front of your thighs with palms facing your body
          - Stand upright with chest up, shoulders back, and core engaged
          - Maintain only a very slight bend in your knees throughout

          ### 2. Movement
          1. Hinge at the hips by pushing them back and lowering the dumbbells
          2. Keep your back flat and dumbbells close to your legs
          3. Keep your legs nearly straight with minimal knee bend
          4. Lower until you feel a stretch in your hamstrings, typically mid-shin
          5. Drive your hips forward to return to the starting position
          6. Squeeze your glutes at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower the dumbbells
          - Exhale as you drive your hips forward to stand up

          ### 4. Tips
          - Keep your legs nearly straight throughout the movement
          - Focus on the hip hinge, not squatting
          - Keep your back flat and chest up throughout
          - Push your hips back as far as possible
          - Feel the stretch in your hamstrings at the bottom

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Bending the knees too much, turning it into a Romanian deadlift
          - Not pushing the hips back far enough
          - Lowering the dumbbells too far beyond the point of hamstring stretch
          - Using too much weight and compromising form
          - Looking up instead of maintaining neutral neck position

          ### 6. Safety / Modifications
          - Start with light dumbbells to master the hip hinge with straight legs
          - Progress from Romanian deadlifts if this variation feels too intense
          - The dumbbell variation allows for a more natural grip than barbells
          - If you experience lower back discomfort, reduce weight and ensure proper form

    muscles:
      primary:
        groups:
          - hamstrings
      secondary:
        groups:
          - back
          - glutes
  "Curtsey Lunges (Barbell)":
    category: Dumbbell
    target: Legs
    i18n:
      en:
        name: "Curtsey Lunges (Barbell)"
        instructions: |
          ## Overview
          The curtsey lunge is a unilateral lower body exercise that primarily targets the glutes, quadriceps, and hip abductors. It also engages the core and stabilizers, using a diagonal backward stepping motion to emphasize the glutes and outer hips.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding dumbbells at your sides
          - Keep your chest up, core engaged, and eyes forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Step one leg back and across behind your other leg in a curtsey motion
          2. Lower your hips by bending both knees
          3. Continue until your front thigh is near parallel to the floor
          4. Keep your chest up and torso upright
          5. Push through your front heel to return to standing position
          6. Repeat on the same leg or alternate legs for desired reps

          ### 3. Breathing
          - Inhale as you step back and lower down
          - Exhale as you push back to standing

          ### 4. Tips
          - The diagonal stepping motion emphasizes the glutes and outer hips
          - Keep your torso upright throughout the movement
          - Focus on balance and control during the cross-behind step
          - Drive through your front heel to return to standing
          - Let the dumbbells hang naturally at your sides

          ### 5. Common Mistakes
          - Leaning too far forward during the lunge
          - Allowing the front knee to cave inward
          - Not stepping far enough back and across
          - Not achieving adequate depth
          - Losing balance during the diagonal step
          - Using momentum instead of controlled movement

          ### 6. Safety / Modifications
          - Start with bodyweight to master the diagonal stepping motion
          - Hold onto a support for balance initially
          - Use light dumbbells when first adding weight
          - Advanced variation: increase dumbbell weight or add a pulse at the bottom

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Deficit Squat":
    category: Dumbbell
    target: Legs
    i18n:
      en:
        name: "Deficit Squat"
        instructions: |
          ## Overview
          The deficit squat is an advanced compound exercise that primarily targets the quadriceps, glutes, and hamstrings with increased range of motion. It uses an elevated platform to increase the depth and difficulty of the squat, building strength in the bottom position and improving mobility.

          ## How to Perform
          ### 1. Starting Position
          - Stand on a 1-3 inch elevated platform with feet shoulder-width apart
          - Hold dumbbells at your sides or a barbell across your upper back
          - Keep your chest up, core engaged, and eyes forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Initiate the squat by bending your knees and hips simultaneously
          2. Keep your chest up and weight on your heels
          3. Descend deeper than a regular squat due to the elevated platform
          4. Pause briefly at the bottom
          5. Drive through your heels to return to standing position
          6. Fully extend your hips and knees at the top, then repeat

          ### 3. Breathing
          - Inhale as you descend into the squat
          - Exhale as you drive back up to standing

          ### 4. Tips
          - The deficit increases range of motion and difficulty
          - Keep your knees tracking over your toes
          - Maintain an upright torso throughout
          - Use lighter weight than your standard squat
          - This variation builds strength in the bottom position

          ### 5. Common Mistakes
          - Using a platform that's too high for your mobility
          - Not achieving the increased depth the deficit allows
          - Allowing the knees to cave inward
          - Rising onto your toes instead of keeping weight on heels
          - Using too much weight before adapting to the increased range
          - Losing neutral spine at the bottom

          ### 6. Safety / Modifications
          - Start with a 1-inch deficit and progress gradually
          - Ensure you have adequate mobility for the increased range
          - Use less weight than your standard squat
          - If you experience knee discomfort, reduce deficit height or weight

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Trap Bar Deadlift":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Trap Bar Deadlift"
        instructions: |
          ## Overview
          The trap bar deadlift is a compound exercise that primarily targets the quadriceps, glutes, and hamstrings. It also engages the erector spinae, lats, and traps, using a hexagonal bar design that allows for a more neutral spine position and reduced lower back stress.

          ## How to Perform
          ### 1. Starting Position
          - Stand inside a trap bar with feet hip-width apart
          - Grip the handles at your sides with a neutral grip
          - Hinge at the hips and bend your knees to reach the handles
          - Keep your chest up, back flat, and shoulders over the bar
          - Engage your core and lats before lifting

          ### 2. Movement
          1. Drive through your heels and extend your hips and knees simultaneously
          2. Keep the bar close to your body as you lift
          3. Stand up fully by extending your hips and knees
          4. Keep your shoulders back and chest up at the top
          5. Lower the bar by pushing your hips back and bending your knees
          6. Return the bar to the floor with control and repeat

          ### 3. Breathing
          - Take a deep breath and brace your core before lifting
          - Hold your breath during the lift
          - Exhale at the top or as you lower the bar

          ### 4. Tips
          - The trap bar allows for a more natural and neutral grip
          - The bar path is more vertical than conventional deadlifts
          - This variation is often easier on the lower back
          - Drive through your entire foot, not just your toes
          - Think about pushing the floor away rather than lifting the bar

          ### 5. Common Mistakes
          - Rounding the lower back during the lift
          - Starting with hips too high or too low
          - Not fully extending hips at the top
          - Looking up or down instead of maintaining neutral neck
          - Using arms to pull instead of legs and hips to drive
          - Not taking advantage of the neutral grip position

          ### 6. Safety / Modifications
          - Start with lighter weight to adapt to the trap bar
          - Many trap bars have high and low handles; start with high handles
          - This variation is excellent for those with lower back concerns
          - If you experience lower back discomfort, check your form and reduce weight

    muscles:
      primary:
        groups:
          - back
          - glutes
          - legs
      secondary:
        groups:
          - hamstrings
  "Zercher Squat (Barbell)":
    category: Barbell
    target: Legs
    i18n:
      en:
        name: "Zercher Squat (Barbell)"
        instructions: |
          ## Overview
          The Zercher squat is an advanced compound exercise that primarily targets the quadriceps, glutes, and hamstrings. It also heavily engages the core, upper back, and biceps, using a barbell held in the crooks of the elbows to create a unique loading pattern that promotes upright posture.

          ## How to Perform
          ### 1. Starting Position
          - Position a barbell in a rack at elbow height
          - Step under the bar and position it in the crooks of your elbows
          - Clasp your hands together in front of your chest
          - Stand with feet shoulder-width apart
          - Keep your chest up, core engaged, and elbows tucked

          ### 2. Movement
          1. Initiate the squat by bending your knees and hips simultaneously
          2. Keep your torso upright and elbows tucked throughout
          3. Descend until thighs are at least parallel to the floor
          4. Maintain an upright posture with the bar secure in your elbows
          5. Drive through your heels to return to standing position
          6. Fully extend your hips and knees at the top, then repeat

          ### 3. Breathing
          - Take a deep breath and brace your core before descending
          - Hold your breath during the descent and bottom position
          - Exhale as you drive back up or at the top

          ### 4. Tips
          - The front-loaded position forces an extremely upright torso
          - Keep your elbows tucked to prevent the bar from slipping
          - Use a pad or towel for comfort in the crooks of your elbows
          - This variation heavily emphasizes the core and upper back
          - Start with light weight to adapt to the unique bar position

          ### 5. Common Mistakes
          - Allowing the bar to slip out of the elbows
          - Leaning too far forward despite the front load
          - Not achieving adequate depth
          - Allowing the elbows to flare out
          - Using too much weight before mastering the position
          - Not maintaining core tension throughout

          ### 6. Safety / Modifications
          - Start with a very light barbell or even a training bar
          - Use a thick pad or towel in the crooks of your elbows for comfort
          - This is an advanced variation; master front squats first
          - If you experience discomfort, reduce weight or try a different squat variation

    muscles:
      primary:
        groups:
          - glutes
          - legs
      secondary:
        groups:
          - core
          - hamstrings
  "Arnold Press (Dumbbell)":
    category: Dumbbell
    target: Shoulders
    i18n:
      en:
        name: "Arnold Press (Dumbbell)"
        instructions: |
          ## Overview
          The Arnold press is a compound shoulder exercise that primarily targets all three heads of the deltoids. It also engages the triceps and upper chest, using a rotating dumbbell press motion to provide complete shoulder development through a unique range of motion.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a bench with back support, holding a dumbbell in each hand
          - Position dumbbells at shoulder height with palms facing your body
          - Keep your elbows in front of your torso
          - Engage your core and keep your back pressed against the pad
          - Plant your feet flat on the floor

          ### 2. Movement
          1. Press the dumbbells upward while rotating your palms outward
          2. Continue pressing and rotating until arms are fully extended overhead
          3. At the top, palms should be facing forward
          4. Pause briefly at the top
          5. Reverse the motion by rotating palms back inward as you lower
          6. Return to starting position with palms facing your body and repeat

          ### 3. Breathing
          - Inhale at the starting position
          - Exhale as you press the dumbbells up
          - Inhale as you lower the dumbbells back down

          ### 4. Tips
          - The rotation should be smooth and controlled throughout
          - Keep your core engaged to protect your lower back
          - Focus on the rotation as much as the pressing motion
          - Control both the pressing and lowering phases equally
          - The unique rotation targets all three deltoid heads

          ### 5. Common Mistakes
          - Rotating too quickly and losing control
          - Arching the lower back excessively
          - Not completing the full rotation
          - Using too much weight and compromising form
          - Allowing the elbows to flare out too early
          - Rushing through the movement

          ### 6. Safety / Modifications
          - Start with lighter dumbbells than standard shoulder presses
          - Master the rotation pattern before adding weight
          - Perform standing for an additional core challenge
          - If you experience shoulder discomfort, reduce weight or range of motion

    muscles:
      primary:
        ids:
          - anterior_deltoid_l
          - anterior_deltoid_r
          - lateral_deltoid_l
          - lateral_deltoid_r
      secondary:
        ids:
          - triceps_brachii_caput_laterale_l
          - triceps_brachii_caput_laterale_r
          - triceps_brachii_caput_longum_l
          - triceps_brachii_caput_longum_r
          - triceps_brachii_caput_mediale_l
          - triceps_brachii_caput_mediale_r
  "Halo":
    category: Dumbbell
    target: Shoulders
    i18n:
      en:
        name: "Halo"
        instructions: |
          ## Overview
          The halo is a dynamic shoulder mobility exercise that primarily targets the deltoids and rotator cuff muscles. It also engages the core and upper back, using a circular motion around the head to improve shoulder mobility, stability, and coordination.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart or kneel for added stability
          - Hold one dumbbell or kettlebell by the horns at chest height
          - Keep your chest up, core engaged, and eyes forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Circle the weight around your head in a controlled motion
          2. Keep the weight close to your head as it travels around
          3. Maintain an upright torso and stable lower body
          4. Complete the full circle and return to the starting position
          5. Repeat for desired reps in one direction
          6. Switch directions and repeat for equal reps

          ### 3. Breathing
          - Breathe steadily and rhythmically throughout the movement
          - Avoid holding your breath

          ### 4. Tips
          - Keep the weight close to your head throughout the circle
          - Focus on smooth, controlled movement
          - Keep your core tight to prevent torso rotation
          - Start with a light weight to master the movement pattern
          - This exercise is excellent for shoulder warm-ups and mobility

          ### 5. Common Mistakes
          - Using too much weight and losing control
          - Allowing the torso to rotate with the weight
          - Moving too quickly through the circles
          - Not keeping the weight close to the head
          - Arching the lower back during the movement
          - Holding your breath

          ### 6. Safety / Modifications
          - Start with a very light dumbbell or kettlebell
          - Kneel for added stability if balance is an issue
          - Use this exercise as a warm-up before shoulder training
          - Reduce range of motion if you experience shoulder discomfort

    muscles:
      primary:
        groups:
          - shoulders
      secondary:
        groups:
          - core
  "Handstand Push Up":
    category: Weighted Body Weight
    target: Shoulders
    i18n:
      en:
        name: "Handstand Push Up"
        instructions: |
          ## Overview
          The handstand push up is an advanced bodyweight pressing exercise that primarily targets the shoulders. It also engages the triceps, upper chest, and core, using an inverted position to create maximum shoulder loading through vertical pressing.

          ## How to Perform
          ### 1. Starting Position
          - Kick up into a handstand position against a wall
          - Position your hands slightly wider than shoulder-width apart
          - Keep your body in a straight line from hands to feet
          - Engage your core and keep your head in a neutral position
          - Maintain balance with assistance from the wall

          ### 2. Movement
          1. Lower your body by bending your elbows
          2. Descend until the top of your head nearly touches the floor
          3. Keep your elbows at about a 45-degree angle from your body
          4. Pause briefly at the bottom
          5. Press through your palms to extend your arms
          6. Return to the starting handstand position and repeat

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up

          ### 4. Tips
          - This is an advanced exercise requiring significant strength
          - Keep your core tight to maintain body alignment
          - Control the descent to maximize muscle engagement
          - Focus on pressing straight up, not away from the wall
          - Use the wall for balance assistance

          ### 5. Common Mistakes
          - Allowing the back to arch excessively
          - Not achieving full range of motion
          - Flaring the elbows out too wide
          - Losing core tension and body alignment
          - Attempting this exercise before building adequate strength
          - Moving too quickly and losing control

          ### 6. Safety / Modifications
          - Build up to this with pike push ups or elevated pike push ups
          - Use an assisted handstand push up with resistance band
          - Perform negative-only reps (lowering only) to build strength
          - Ensure you can hold a wall handstand for 30+ seconds before attempting

    muscles:
      primary:
        ids:
          - pectoralis_major_l
          - pectoralis_major_r
      secondary:
        groups:
          - arms
          - core
          - shoulders
  "Face Pull (Cable)":
    category: Machine
    target: Shoulders
    i18n:
      en:
        name: "Face Pull (Cable)"
        instructions: |
          ## Overview
          The cable face pull is an isolation exercise that primarily targets the rear deltoids and upper back. It also engages the rhomboids and middle trapezius, using a rope attachment to improve shoulder health, posture, and rear delt development.

          ## How to Perform
          ### 1. Starting Position
          - Attach a rope to a cable pulley at upper chest height
          - Stand facing the cable with feet shoulder-width apart
          - Grip the rope with both hands using a neutral grip
          - Step back to create tension on the cable
          - Keep your chest up and core engaged

          ### 2. Movement
          1. Pull the rope toward your face by driving your elbows back and out
          2. Separate the rope ends as you pull, moving them past your ears
          3. Focus on squeezing your shoulder blades together
          4. Continue until your hands are beside your ears
          5. Pause and squeeze your rear delts and upper back
          6. Slowly return to the starting position with control and repeat

          ### 3. Breathing
          - Exhale as you pull the rope toward your face
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on pulling with your rear delts and upper back, not your arms
          - Keep your elbows high and flared out during the pull
          - Separate the rope ends to maximize rear delt contraction
          - Maintain constant tension on the cable throughout
          - This exercise is excellent for shoulder health and posture

          ### 5. Common Mistakes
          - Pulling too low toward the chest instead of the face
          - Not separating the rope ends at the finish
          - Using momentum or jerking the weight
          - Allowing the elbows to drop during the pull
          - Using too much weight and compromising form
          - Not squeezing the shoulder blades together

          ### 6. Safety / Modifications
          - Start with light weight to master the movement pattern
          - Adjust cable height between upper chest and face level
          - Perform with a resistance band if cables are unavailable
          - Focus on controlled reps and proper form over heavy weight

    muscles:
      primary:
        ids:
          - posterior_deltoid_l
          - posterior_deltoid_r
      secondary:
        groups:
          - back
  "Front Raise (Band)":
    category: Weighted Body Weight
    target: Shoulders
    i18n:
      en:
        name: "Front Raise (Band)"
        instructions: |
          ## Overview
          The band front raise is an isolation exercise that primarily targets the front deltoids. It also engages the upper chest, using progressive band resistance to build shoulder strength and muscle definition in the front of the shoulders.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, stepping on the center of a resistance band
          - Grip both ends of the band with hands in front of your thighs
          - Keep your arms straight with a slight bend in your elbows
          - Stand upright with chest up and core engaged
          - Maintain good posture throughout

          ### 2. Movement
          1. Raise both arms forward and upward in front of your body
          2. Keep your arms straight with only a slight elbow bend
          3. Continue raising until your arms are at shoulder height or slightly above
          4. Pause briefly at the top
          5. Slowly lower your arms back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you raise your arms up
          - Inhale as you lower your arms back down

          ### 4. Tips
          - The band provides increasing resistance as you raise
          - Keep your torso stable and avoid using momentum
          - Focus on squeezing your front delts at the top
          - Maintain constant tension by controlling both phases
          - Adjust foot position on the band to modify resistance

          ### 5. Common Mistakes
          - Using momentum or swinging the arms
          - Leaning back during the raise
          - Bending the elbows excessively
          - Raising the arms too high above shoulder level
          - Not maintaining constant tension on the band
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the movement
          - Adjust foot position on band for comfortable resistance
          - Perform one arm at a time for unilateral focus
          - If you experience shoulder discomfort, reduce range of motion or resistance

    muscles:
      primary:
        ids:
          - anterior_deltoid_l
          - anterior_deltoid_r
      secondary: {}
  "Front Raise (Barbell)":
    category: Barbell
    target: Shoulders
    i18n:
      en:
        name: "Front Raise (Barbell)"
        instructions: |
          ## Overview
          The barbell front raise is an isolation exercise that primarily targets the front deltoids. It also engages the upper chest, using a barbell to provide stable bilateral resistance for building shoulder strength and muscle definition.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart holding a barbell
          - Grip the bar with hands slightly wider than shoulder-width, palms facing down
          - Position the bar in front of your thighs with arms straight
          - Keep your chest up, core engaged, and maintain good posture
          - Maintain a slight bend in your elbows throughout

          ### 2. Movement
          1. Raise the barbell forward and upward in front of your body
          2. Keep your arms straight with only a slight elbow bend
          3. Continue raising until the bar reaches shoulder height
          4. Pause briefly at the top
          5. Slowly lower the bar back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you raise the bar up
          - Inhale as you lower the bar back down

          ### 4. Tips
          - Keep your torso stable and avoid using momentum
          - Focus on lifting with your front delts, not your arms
          - Maintain a slight bend in your elbows throughout
          - Control both the raising and lowering phases
          - The barbell allows for heavier loading than dumbbells

          ### 5. Common Mistakes
          - Using momentum or swinging the bar
          - Leaning back during the raise
          - Bending the elbows excessively
          - Raising the bar too high above shoulder level
          - Using too much weight and compromising form
          - Not maintaining constant tension

          ### 6. Safety / Modifications
          - Start with light weight to master the movement pattern
          - Use an EZ curl bar if straight bar causes wrist discomfort
          - Perform with dumbbells for independent arm movement
          - If you experience shoulder discomfort, reduce weight or range of motion

