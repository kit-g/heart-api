  "Jump Rope":
    category: Reps Only
    target: Cardio
    i18n:
      en:
        name: "Jump Rope"
        instructions: |
          ## Overview
          Jump rope is a high-intensity cardiovascular exercise that targets the calves, shoulders, and cardiovascular system. It builds coordination, agility, endurance, and provides an efficient full-body workout with minimal equipment.

          ## How to Perform
          ### 1. Starting Position
          - Hold the rope handles with hands at hip level
          - Position the rope behind your heels
          - Stand with feet together or slightly apart
          - Keep elbows close to your sides
          - Maintain upright posture with core engaged

          ### 2. Movement
          1. Swing the rope over your head using your wrists
          2. Jump with both feet to clear the rope as it passes under
          3. Land softly on the balls of your feet
          4. Keep jumps low, just high enough to clear the rope
          5. Maintain a steady rhythm
          6. Continue for desired duration or rep count

          ### 3. Breathing
          - Breathe rhythmically and steadily throughout
          - Find a breathing pattern that matches your rhythm
          - Avoid holding your breath

          ### 4. Tips
          - Use your wrists to turn the rope, not your arms
          - Keep jumps small and efficient
          - Land softly to reduce joint impact
          - Start with shorter intervals and build endurance
          - Various techniques (single leg, double-unders) add variety

          ### 5. Common Mistakes
          - Jumping too high unnecessarily
          - Using arms instead of wrists to turn rope
          - Landing too heavily on heels
          - Holding handles too far from body
          - Poor posture with rounded shoulders
          - Rope length not adjusted properly for height

          ### 6. Safety / Modifications
          - Adjust rope length appropriately for your height
          - Start with basic bounce and progress to variations
          - Perform on appropriate surface (not concrete)
          - Wear supportive athletic shoes

    muscles:
      primary:
        groups:
