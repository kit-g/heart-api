    i18n:
      en:
        name: "Standing Calf Raise (Barbell)"
        instructions: |
          ## Overview
          The standing barbell calf raise is an isolation exercise that primarily targets the gastrocnemius muscle of the calf. It also engages the soleus, using a barbell across the upper back to provide heavy resistance for building calf strength and size.

          ## How to Perform
          ### 1. Starting Position
          - Position a barbell across your upper back as you would for a squat
          - Stand with the balls of your feet on an elevated surface or platform
          - Keep your heels hanging off the edge
          - Stand upright with feet hip-width apart
          - Keep your legs straight but not locked throughout

          ### 2. Movement
          1. Lower your heels by flexing your ankles as far as possible
          2. Allow a full stretch in your calves at the bottom
          3. Pause briefly at the bottom stretch position
          4. Press through the balls of your feet to raise your heels as high as possible
          5. Squeeze your calves hard at the top
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your heels
          - Exhale as you press up onto your toes

          ### 4. Tips
          - Keep your legs straight throughout to isolate the calves
          - Achieve full range of motion from deep stretch to high contraction
          - Focus on squeezing your calves at the top
          - Control the weight throughout both phases
          - Keep your core engaged for stability

          ### 5. Common Mistakes
          - Bending the knees during the movement
          - Not achieving full range of motion at top or bottom
          - Bouncing at the bottom instead of controlled stretch
          - Using too much weight and compromising form
          - Moving too quickly through the repetitions
          - Not squeezing at the top contraction

          ### 6. Safety / Modifications
          - Start with moderate weight to master the full range of motion
          - Use a power rack with safety bars for added security
          - Vary foot position (neutral, toes in, toes out) for complete calf development
          - Advanced variation: perform single-leg barbell calf raises

