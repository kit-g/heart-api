          - Exhale as you raise your arm to the side
          - Inhale as you lower your arm back down

          ### 4. Tips
          - Maintain constant tension by not letting the weight stack touch
          - Keep your torso stable and avoid leaning
          - Focus on leading with your elbow slightly bent
          - Control both the raising and lowering phases equally
