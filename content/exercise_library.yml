  "Chest Dip":
    category: Weighted Body Weight
    target: Chest
    i18n:
      en:
        name: "Chest Dip"
        instructions: |
          ## Overview
          The chest dip is a bodyweight pressing exercise that primarily targets the lower pectoralis major. It also engages the triceps and front deltoids, using a forward lean to shift emphasis from triceps to chest for effective lower chest development.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself on parallel dip bars with arms fully extended
          - Grip the bars firmly with hands slightly wider than shoulder-width if possible
          - Lean your torso forward at about 30-45 degrees
          - Cross your ankles behind you or keep legs straight
          - Engage your core and keep your shoulders pressed down

          ### 2. Movement
          1. Lower your body by bending your elbows until they reach about 90 degrees
          2. Keep your elbows flared out slightly and torso leaning forward
          3. Continue lowering until you feel a stretch in your chest
          4. Pause briefly at the bottom of the movement
          5. Press through your palms to extend your arms and return to starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up to the starting position

          ### 4. Tips
          - Lean forward throughout to keep emphasis on your chest
          - Keep your elbows flared out more than triceps dips
          - Focus on the stretch in your chest at the bottom
          - Avoid dropping too low and straining your shoulders
          - Maintain control throughout the entire range of motion

          ### 5. Common Mistakes
          - Staying too upright, which shifts emphasis to triceps
          - Not leaning forward enough
          - Dropping too low and straining the shoulders
          - Using momentum or bouncing at the bottom
          - Not achieving full elbow extension at the top
          - Allowing shoulders to shrug up

          ### 6. Safety / Modifications
          - Use an assisted dip machine or resistance band for support
          - Reduce range of motion if you experience shoulder discomfort
          - Advanced variation: add weight using a dip belt or weight vest
          - Progress gradually to avoid shoulder strain

