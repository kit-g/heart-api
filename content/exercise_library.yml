  "Overhead Press (Barbell)":
    category: Barbell
    target: Shoulders
    i18n:
      en:
        name: "Overhead Press (Barbell)"
        instructions: |
          ## Overview
          The barbell overhead press is a compound upper body exercise that primarily targets all three heads of the deltoids. It also engages the triceps, upper chest, and core, making it one of the most effective exercises for building overall shoulder strength and upper body pressing power.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart, barbell racked at upper chest height
          - Grip the bar slightly wider than shoulder-width with palms facing forward
          - Unrack the bar and hold it at shoulder level
          - Keep your chest up, core engaged, and elbows slightly forward
          - Maintain good posture throughout

          ### 2. Movement
          1. Press the bar straight up overhead by extending your arms
          2. Move your head slightly back to allow the bar to pass
          3. Continue pressing until your arms are fully extended overhead
          4. Lock out your elbows at the top with the bar over mid-foot
          5. Lower the bar back to shoulder level with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Take a breath and brace your core before pressing
          - Hold your breath during the press
          - Exhale at the top or as you lower the bar

          ### 4. Tips
          - Press the bar in a straight vertical line
          - Keep your core tight to prevent arching your lower back
          - Lock out your arms fully at the top
          - Keep the bar path close to your face
          - This exercise can be performed standing or seated

          ### 5. Common Mistakes
          - Arching the lower back excessively during the press
          - Pressing the bar forward instead of straight up
          - Not achieving full lockout at the top
          - Flaring the elbows out too wide
          - Using momentum from the legs (turning it into a push press)
          - Not maintaining core tension throughout

          ### 6. Safety / Modifications
          - Start with light weight to master the vertical pressing path
          - Use a power rack with safety pins when training alone
          - Perform seated overhead press for more stability
          - If you experience shoulder discomfort, check your grip width and bar path

