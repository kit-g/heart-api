exercises:
  "Ab Wheel":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Ab Wheel"
        instructions: |
          ## Overview
          The ab wheel rollout is a challenging core exercise that primarily targets the rectus abdominis and transverse abdominis. It also engages the obliques, hip flexors, and shoulders as stabilizers throughout the movement.

          ## How to Perform
          ### 1. Starting Position
          - Kneel on a mat with the ab wheel directly in front of you
          - Grip the wheel handles firmly with both hands, shoulder-width apart
          - Position your shoulders directly over the wheel
          - Keep your back straight and core engaged
          - Look down at the floor to maintain a neutral neck position

          ### 2. Movement
          1. Slowly roll the wheel forward by extending your arms and hips
          2. Keep your core tight and avoid letting your lower back sag
          3. Roll out as far as you can while maintaining control and a flat back
          4. Pause briefly at the fully extended position
          5. Pull the wheel back toward your knees by contracting your abs
          6. Return to the starting position with control

          ### 3. Breathing
          - Exhale as you roll out and extend your body
          - Inhale as you pull the wheel back to the starting position

          ### 4. Tips
          - Keep constant tension in your core throughout the entire movement
          - Move slowly and with control; speed reduces effectiveness
          - Focus on using your abs to pull you back, not your arms
          - Keep your hips stable and avoid excessive arching

          ### 5. Common Mistakes
          - Allowing the lower back to sag or hyperextend
          - Rolling out too far before building adequate strength
          - Using momentum instead of controlled movement
          - Letting the hips pike upward on the return
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Start with partial rollouts against a wall to limit range of motion
          - Perform from your knees before attempting from your feet
          - If you experience lower back discomfort, reduce your range of motion
          - Progress to standing rollouts only after mastering the kneeling version

  "Bicycle Crunch":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Bicycle Crunch"
        instructions: |
          ## Overview
          The bicycle crunch is a dynamic core exercise that primarily targets the rectus abdominis and obliques. It also engages the hip flexors and transverse abdominis as you coordinate the twisting motion with alternating leg movements.

          ## How to Perform
          ### 1. Starting Position
          - Lie on your back on a mat with your knees bent and feet flat on the floor
          - Place your hands lightly behind your head with elbows pointing out to the sides
          - Lift your shoulders slightly off the mat and engage your core
          - Raise your feet off the floor with knees bent at 90 degrees
          - Keep your lower back pressed into the mat

          ### 2. Movement
          1. Simultaneously bring your right elbow toward your left knee while extending your right leg straight
          2. Twist your torso to bring your shoulder (not just your elbow) across your body
          3. Pause briefly when your elbow and knee come close together
          4. Return to the center position with both knees bent
          5. Repeat on the opposite side, bringing your left elbow toward your right knee while extending your left leg
          6. Continue alternating sides in a smooth, controlled pedaling motion

          ### 3. Breathing
          - Exhale as you twist and bring your elbow toward your knee
          - Inhale as you return to center and switch sides

          ### 4. Tips
          - Focus on rotating your entire torso, not just moving your elbows
          - Keep your neck relaxed and avoid pulling on your head with your hands
          - Maintain constant tension in your core throughout the movement
          - Move with control rather than speed for maximum effectiveness
          - Keep your lower back pressed against the mat to protect your spine

          ### 5. Common Mistakes
          - Pulling on the neck or head instead of engaging the core
          - Moving too quickly and losing proper form
          - Only moving the elbows instead of rotating the torso
          - Allowing the lower back to arch off the mat
          - Not fully extending the legs on each repetition
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Beginners can keep their feet on the ground and perform the twist without leg movement
          - Reduce range of motion if you experience neck or lower back discomfort
          - Progress by slowing down the tempo to increase time under tension
          - Advanced variation: pause for 2-3 seconds at each twist

  "Cable Crunch":
    category: Machine
    target: Core
    i18n:
      en:
        name: "Cable Crunch"
        instructions: |
          ## Overview
          The cable crunch is an effective core exercise that primarily targets the rectus abdominis with constant tension throughout the movement. It also engages the obliques and transverse abdominis as stabilizers, making it a popular choice for building ab strength and definition.

          ## How to Perform
          ### 1. Starting Position
          - Kneel in front of a high cable pulley with a rope attachment
          - Grip the rope ends and position them beside your head or at your upper chest
          - Keep your hips stationary and maintain a slight forward lean
          - Engage your core and set your shoulder blades down and back
          - Position yourself close enough that the weight stack doesn't rest between reps

          ### 2. Movement
          1. Exhale and crunch downward by contracting your abs and bringing your elbows toward your thighs
          2. Focus on curling your torso forward, not just pulling with your arms
          3. Squeeze your abs hard at the bottom of the movement for 1-2 seconds
          4. Slowly return to the starting position under control while maintaining tension
          5. Stop just before the weight stack touches down to keep constant tension on your core
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale forcefully as you crunch down and contract your abs
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your hips fixed throughout the movement; only your torso should move
          - Think about bringing your ribcage toward your pelvis rather than just bending forward
          - Maintain a controlled tempo; avoid jerking or using momentum
          - Keep tension on your abs by not allowing the weight to rest between reps
          - Your arms should remain in a fixed position relative to your head

          ### 5. Common Mistakes
          - Using the arms and shoulders to pull instead of contracting the abs
          - Allowing the hips to rock back and forth
          - Moving too quickly and relying on momentum
          - Letting the weight stack rest completely between reps
          - Choosing too heavy a weight that compromises form
          - Extending the spine too far on the return, which can strain the lower back

          ### 6. Safety / Modifications
          - Start with a light weight to master the form and mind-muscle connection
          - If you experience neck discomfort, try holding the rope at chest level instead of by your head
          - Advanced variation: pause for 3-5 seconds at peak contraction for increased intensity
          - Regression: perform standard bodyweight crunches until you build sufficient core strength

  "Cable Twist":
    category: Machine
    target: Core
    i18n:
      en:
        name: "Cable Twist"
        instructions: |
          ## Overview
          The cable twist is a rotational core exercise that primarily targets the obliques and transverse abdominis. It also engages the rectus abdominis and hip stabilizers throughout the twisting movement, making it effective for building rotational strength and core stability.

          ## How to Perform
          ### 1. Starting Position
          - Stand sideways to a cable machine with the pulley set at chest height
          - Grip the handle with both hands and step away from the machine to create tension
          - Position your feet shoulder-width apart with knees slightly bent
          - Extend your arms out in front of your chest, keeping a slight bend in the elbows
          - Engage your core and maintain an upright torso

          ### 2. Movement
          1. Rotate your torso away from the cable machine, pivoting through your core
          2. Keep your arms extended and move as one unit with your torso
          3. Rotate as far as comfortable while maintaining control and upright posture
          4. Pause briefly at the end of the rotation
          5. Slowly return to the starting position with control, resisting the cable's pull
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you rotate away from the machine
          - Inhale as you return to the starting position

          ### 4. Tips
          - Initiate the movement from your core, not your arms or shoulders
          - Keep your hips facing forward throughout the movement
          - Maintain a stable lower body while your upper body rotates
          - Move slowly and with control to maximize core engagement
          - Keep tension on the cable throughout the entire range of motion

          ### 5. Common Mistakes
          - Using momentum or swinging the weight instead of controlled rotation
          - Allowing the hips to rotate along with the torso
          - Bending or extending the arms during the movement
          - Leaning backward or forward instead of maintaining an upright posture
          - Choosing too heavy a weight that compromises form
          - Twisting too quickly without proper control

          ### 6. Safety / Modifications
          - Start with a light weight to master the rotational pattern
          - Beginners can perform half-range rotations until they build control
          - Advanced variation: pause for 2-3 seconds at peak rotation for increased intensity
          - If you experience lower back discomfort, reduce the range of motion or weight

  "Cross Body Crunch":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Cross Body Crunch"
        instructions: |
          ## Overview
          The cross body crunch is a rotational core exercise that primarily targets the obliques and rectus abdominis. It also engages the hip flexors and transverse abdominis as you bring your elbow toward the opposite knee, making it effective for building rotational core strength.

          ## How to Perform
          ### 1. Starting Position
          - Lie on your back on a mat with your knees bent and feet flat on the floor
          - Place your hands lightly behind your head with elbows pointing out to the sides
          - Lift your shoulders slightly off the mat and engage your core
          - Keep your lower back pressed into the mat throughout the movement

          ### 2. Movement
          1. Lift your right shoulder off the mat while bringing your left knee toward your chest
          2. Rotate your torso to bring your right elbow toward your left knee
          3. Focus on rotating your entire torso, not just moving your elbow
          4. Pause briefly when your elbow and knee come close together
          5. Lower back to the starting position with control
          6. Repeat on the opposite side, bringing your left elbow toward your right knee
          7. Continue alternating sides for the desired number of reps

          ### 3. Breathing
          - Exhale as you crunch and rotate toward your knee
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your neck relaxed and avoid pulling on your head with your hands
          - Initiate the movement from your core, not your arms
          - Maintain constant tension in your abs throughout the movement
          - Keep your lower back pressed against the mat to protect your spine
          - Move with control rather than speed for maximum effectiveness

          ### 5. Common Mistakes
          - Pulling on the neck or head instead of engaging the core
          - Only moving the elbow instead of rotating the entire torso
          - Allowing the lower back to arch off the mat
          - Moving too quickly and losing proper form
          - Using momentum instead of controlled muscle contraction
          - Not fully engaging the obliques during the twist

          ### 6. Safety / Modifications
          - Beginners can keep both feet on the ground and perform the twist without raising the knee
          - Advanced variation: hold the contracted position for 2-3 seconds on each side
          - If you experience neck discomfort, support your head with one hand and reach with the other
          - Progress by slowing down the tempo to increase time under tension

  "Crunch":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Crunch"
        instructions: |
          ## Overview
          The crunch is a fundamental core exercise that primarily targets the rectus abdominis. It also engages the transverse abdominis and obliques as stabilizers, making it an accessible and effective exercise for building abdominal strength and endurance.

          ## How to Perform
          ### 1. Starting Position
          - Lie on your back on a mat with your knees bent and feet flat on the floor
          - Place your hands lightly behind your head or crossed over your chest
          - Keep your elbows pointing out to the sides if hands are behind your head
          - Engage your core and press your lower back into the mat
          - Keep a small space between your chin and chest

          ### 2. Movement
          1. Lift your shoulder blades off the mat by contracting your abdominal muscles
          2. Curl your upper body toward your knees, focusing on bringing your ribcage toward your pelvis
          3. Exhale and squeeze your abs at the top of the movement for 1-2 seconds
          4. Slowly lower your shoulders back down with control
          5. Stop just before your shoulders touch the mat to maintain tension
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale forcefully as you crunch up and contract your abs
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on curling your torso rather than just lifting your head and neck
          - Keep your lower back pressed against the mat throughout
          - Avoid pulling on your head or neck with your hands
          - Move slowly and with control to maximize muscle engagement
          - Keep constant tension on your abs by not fully relaxing between reps

          ### 5. Common Mistakes
          - Pulling on the neck with your hands, which can cause strain
          - Using momentum instead of controlled muscle contraction
          - Lifting too high or using hip flexors instead of abs
          - Allowing the lower back to arch off the mat
          - Moving too quickly and sacrificing form for speed
          - Completely relaxing between reps, losing core tension

          ### 6. Safety / Modifications
          - Beginners can place hands on thighs and slide them toward knees during the crunch
          - Advanced variation: hold a weight plate on your chest for added resistance
          - If you experience neck discomfort, keep your gaze focused on a spot on the ceiling
          - Progress by adding a 3-5 second pause at peak contraction

  "Crunch (Machine)":
    category: Machine
    target: Core
    i18n:
      en:
        name: "Crunch (Machine)"
        instructions: |
          ## Overview
          The machine crunch is a resistance-based core exercise that primarily targets the rectus abdominis with consistent tension throughout the movement. It also engages the obliques and transverse abdominis as stabilizers, offering a controlled way to progressively overload your abdominal muscles.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the crunch machine with your back against the pad
          - Place your feet under the foot pads or on the footrest
          - Grip the handles above your head or at chest level, depending on the machine design
          - Adjust the weight to a challenging but manageable resistance
          - Engage your core and maintain a neutral spine position

          ### 2. Movement
          1. Exhale and crunch forward by contracting your abdominal muscles
          2. Focus on curling your torso and bringing your ribcage toward your pelvis
          3. Keep the movement controlled and avoid using momentum
          4. Squeeze your abs hard at the bottom of the movement for 1-2 seconds
          5. Slowly return to the starting position while maintaining tension on your core
          6. Stop just before the weight stack touches to keep continuous tension on your abs

          ### 3. Breathing
          - Exhale forcefully as you crunch forward and contract your abs
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on using your core to move the weight, not your arms or shoulders
          - Keep your neck in a neutral position throughout the movement
          - Maintain a controlled tempo to maximize muscle engagement
          - Avoid letting the weight stack rest between reps
          - Keep your lower back pressed against the pad

          ### 5. Common Mistakes
          - Using the arms or shoulders to pull the weight instead of engaging the core
          - Moving too quickly and relying on momentum
          - Choosing too heavy a weight that compromises form
          - Allowing the weight stack to rest completely between reps
          - Extending or arching the spine on the return movement
          - Holding your breath during the exercise

          ### 6. Safety / Modifications
          - Start with a light weight to master proper form and mind-muscle connection
          - Advanced variation: pause for 3-5 seconds at peak contraction
          - If you experience lower back discomfort, reduce the weight and focus on core engagement
          - Progress gradually by adding small weight increments over time

  "Crunch (Stability Ball)":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Crunch (Stability Ball)"
        instructions: |
          ## Overview
          The stability ball crunch is a bodyweight core exercise that primarily targets the rectus abdominis with an extended range of motion. It also engages the obliques, transverse abdominis, and lower back stabilizers as you work to maintain balance on the unstable surface.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a stability ball and walk your feet forward until your lower back is supported by the ball
          - Position the ball under your lower to mid-back with your feet flat on the floor, hip-width apart
          - Place your hands lightly behind your head or crossed over your chest
          - Allow your upper back to extend slightly over the ball
          - Engage your core and keep your hips level

          ### 2. Movement
          1. Exhale and lift your shoulder blades by contracting your abdominal muscles
          2. Curl your upper body forward, bringing your ribcage toward your pelvis
          3. Keep your lower back in contact with the ball for stability
          4. Squeeze your abs at the top of the movement for 1-2 seconds
          5. Slowly lower back down with control, allowing a slight stretch over the ball
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you crunch up and contract your abs
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on curling your torso rather than just lifting your head
          - Keep your feet firmly planted to maintain stability
          - Avoid pulling on your neck with your hands
          - Move slowly to challenge your balance and maximize core engagement
          - Use the ball's instability to recruit more stabilizer muscles

          ### 5. Common Mistakes
          - Pulling on the neck or head, which can cause strain
          - Moving too quickly and losing balance
          - Allowing the hips to drop or sag during the movement
          - Using momentum instead of controlled muscle contraction
          - Positioning the ball too high or too low on your back
          - Not taking advantage of the extended range of motion the ball provides

          ### 6. Safety / Modifications
          - Beginners can start with feet wider apart for better stability
          - Place the ball against a wall for added support if needed
          - Advanced variation: hold a weight plate on your chest for added resistance
          - If you experience difficulty balancing, deflate the ball slightly for a more stable surface

  "Decline Crunch":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Decline Crunch"
        instructions: |
          ## Overview
          The decline crunch is an advanced core exercise that primarily targets the rectus abdominis with increased resistance from gravity. It also engages the hip flexors and obliques as stabilizers, making it more challenging than the standard floor crunch due to the declined angle.

          ## How to Perform
          ### 1. Starting Position
          - Lie back on a decline bench with your feet secured under the foot pads
          - Adjust the bench to a moderate decline angle (typically 15-30 degrees)
          - Place your hands lightly behind your head or crossed over your chest
          - Keep your elbows pointing out to the sides if hands are behind your head
          - Engage your core and maintain a neutral spine position

          ### 2. Movement
          1. Lift your shoulder blades off the bench by contracting your abdominal muscles
          2. Curl your upper body forward, bringing your ribcage toward your pelvis
          3. Exhale and squeeze your abs at the top of the movement for 1-2 seconds
          4. Slowly lower your shoulders back down with control
          5. Stop just before your shoulders touch the bench to maintain tension
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale forcefully as you crunch up and contract your abs
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on curling your torso rather than just lifting with your neck
          - Keep constant tension on your abs by not fully relaxing between reps
          - Avoid pulling on your head or neck with your hands
          - Start with a shallow decline and progress to steeper angles
          - Move slowly and with control to maximize muscle engagement

          ### 5. Common Mistakes
          - Pulling on the neck with your hands, which can cause strain
          - Using momentum to swing up instead of controlled contraction
          - Starting with too steep a decline before building adequate strength
          - Allowing the lower back to hyperextend on the way down
          - Moving too quickly and sacrificing form for reps
          - Completely relaxing between reps, losing core tension

          ### 6. Safety / Modifications
          - Beginners should start with a flat or very shallow decline
          - Advanced variation: hold a weight plate on your chest for added resistance
          - If you experience discomfort, reduce the decline angle or return to floor crunches
          - Progress by gradually increasing the decline angle as you build strength

  "Flat Knee Raise":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Flat Knee Raise"
        instructions: |
          ## Overview
          The flat knee raise is a bodyweight core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the transverse abdominis and obliques as stabilizers, making it an accessible entry point for developing lower ab strength.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back on a mat with your legs extended
          - Place your hands beside your hips or under your glutes for support
          - Press your lower back into the mat and engage your core
          - Keep your head and shoulders relaxed on the mat
          - Maintain a neutral neck position by looking at the ceiling

          ### 2. Movement
          1. Bend your knees and lift them toward your chest by contracting your lower abs
          2. Continue until your knees are directly above your hips or slightly beyond
          3. Keep your lower back pressed against the mat throughout the movement
          4. Pause briefly at the top of the movement
          5. Slowly lower your knees back down with control
          6. Stop just before your feet touch the floor to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you lift your knees toward your chest
          - Inhale as you lower your knees back to the starting position

          ### 4. Tips
          - Focus on using your lower abs to lift your knees, not just your hip flexors
          - Keep your lower back pressed into the mat to protect your spine
          - Move slowly and with control throughout the entire range of motion
          - Maintain constant tension by not letting your feet touch the floor between reps
          - Keep your upper body relaxed to avoid neck tension

          ### 5. Common Mistakes
          - Allowing the lower back to arch off the mat
          - Using momentum to swing the legs up instead of controlled contraction
          - Moving too quickly and sacrificing form
          - Letting the feet touch the floor completely between reps
          - Tensing the neck or upper body unnecessarily
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Beginners can perform smaller raises, not bringing knees as high
          - Place hands under your glutes for additional lower back support
          - Advanced variation: pause for 2-3 seconds at the top of each rep
          - Progress to flat leg raises once you master the knee raise with proper form

  "Flat Leg Raise":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Flat Leg Raise"
        instructions: |
          ## Overview
          The flat leg raise is a challenging bodyweight core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the transverse abdominis and obliques for stability, requiring greater core strength than the bent-knee variation due to the extended leg position.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back on a mat with your legs fully extended
          - Place your hands beside your hips or under your glutes for support
          - Press your lower back into the mat and engage your core
          - Keep your head and shoulders relaxed on the mat
          - Point your toes and maintain straight legs throughout

          ### 2. Movement
          1. Lift both legs toward the ceiling by contracting your lower abs
          2. Keep your legs straight and together as you raise them
          3. Continue until your legs are perpendicular to the floor or slightly beyond
          4. Maintain your lower back pressed against the mat throughout
          5. Pause briefly at the top of the movement
          6. Slowly lower your legs back down with control
          7. Stop just before your heels touch the floor to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you lift your legs toward the ceiling
          - Inhale as you lower your legs back down

          ### 4. Tips
          - Keep your legs straight and together throughout the entire movement
          - Focus on using your lower abs rather than relying on hip flexors
          - Press your lower back firmly into the mat to protect your spine
          - Lower your legs only as far as you can while maintaining lower back contact
          - Move with control; slower is more challenging and effective

          ### 5. Common Mistakes
          - Allowing the lower back to arch off the mat, especially during the lowering phase
          - Bending the knees to make the exercise easier
          - Using momentum to swing the legs up instead of controlled contraction
          - Lowering the legs too far and losing lower back contact
          - Moving too quickly and sacrificing form
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Beginners should master flat knee raises before attempting this exercise
          - Place hands under your glutes for additional lower back support
          - Reduce range of motion by not lowering legs as far if you experience lower back strain
          - Advanced variation: lower legs very slowly (3-5 seconds) to increase intensity

  "Hanging Knee Raise":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Hanging Knee Raise"
        instructions: |
          ## Overview
          The hanging knee raise is a bodyweight core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the obliques, transverse abdominis, and grip strength as you hang from a bar, making it more challenging than floor-based variations.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with your hands shoulder-width apart using an overhand grip
          - Allow your body to hang fully extended with your feet off the ground
          - Engage your core and keep your shoulders pulled down and back
          - Keep your legs together and maintain a slight bend in your knees
          - Avoid excessive swinging by stabilizing your body

          ### 2. Movement
          1. Lift your knees toward your chest by contracting your lower abs
          2. Continue raising your knees until they reach at least hip level or higher
          3. Keep the movement controlled and avoid using momentum
          4. Pause briefly at the top of the movement
          5. Slowly lower your knees back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you lift your knees toward your chest
          - Inhale as you lower your knees back to the starting position

          ### 4. Tips
          - Focus on initiating the movement from your core, not just your hip flexors
          - Minimize swinging by keeping your core tight and movement controlled
          - Keep your shoulders engaged and avoid hanging passively
          - Think about bringing your hips forward and up, not just your knees
          - Maintain steady breathing throughout to avoid holding your breath

          ### 5. Common Mistakes
          - Using momentum and swinging instead of controlled muscle contraction
          - Only lifting the knees partially without engaging the lower abs fully
          - Allowing the shoulders to shrug up toward the ears
          - Moving too quickly and losing control
          - Releasing grip tension, which can compromise form
          - Not bringing knees high enough to engage the abs effectively

          ### 6. Safety / Modifications
          - Beginners can use wrist straps for better grip support
          - Use a captain's chair or dip station for an assisted version
          - Advanced variation: pause for 2-3 seconds at the top of each rep
          - Progress to hanging leg raises once you master the knee raise with proper form

  "Hanging Leg Raise":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Hanging Leg Raise"
        instructions: |
          ## Overview
          The hanging leg raise is an advanced bodyweight core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the entire core, including the obliques and transverse abdominis, along with grip and shoulder stability, making it one of the most challenging ab exercises.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with your hands shoulder-width apart using an overhand grip
          - Allow your body to hang fully extended with your feet off the ground
          - Engage your core and keep your shoulders pulled down and back
          - Keep your legs together and fully extended
          - Avoid excessive swinging by stabilizing your body

          ### 2. Movement
          1. Lift your legs toward the ceiling by contracting your lower abs
          2. Keep your legs straight and together as you raise them
          3. Continue until your legs are at least parallel to the ground or higher
          4. Minimize swinging by keeping the movement controlled
          5. Pause briefly at the top of the movement
          6. Slowly lower your legs back to the starting position with control
          7. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you lift your legs toward the ceiling
          - Inhale as you lower your legs back to the starting position

          ### 4. Tips
          - Keep your legs completely straight throughout the entire movement
          - Focus on using your core to lift your legs, not just your hip flexors
          - Keep your shoulders engaged and avoid hanging passively
          - Minimize body swing by maintaining core tension throughout
          - Think about bringing your toes to the bar for maximum core engagement

          ### 5. Common Mistakes
          - Bending the knees to make the exercise easier
          - Using momentum and swinging excessively
          - Allowing the shoulders to shrug up toward the ears
          - Not raising the legs high enough to fully engage the abs
          - Moving too quickly and losing control
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Master hanging knee raises before attempting this advanced variation
          - Use wrist straps if grip strength is limiting
          - Beginners can perform the exercise on a captain's chair for support
          - Advanced variation: add ankle weights or perform toes-to-bar raises

  "Jackknife Sit Up":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Jackknife Sit Up"
        instructions: |
          ## Overview
          The jackknife sit up is a dynamic core exercise that primarily targets the entire rectus abdominis. It also engages the hip flexors, obliques, and transverse abdominis as you simultaneously lift your upper and lower body, creating an intense contraction through the entire core.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back on a mat with your arms extended overhead
          - Keep your legs straight and together, fully extended on the mat
          - Engage your core and press your lower back into the mat
          - Keep your head in a neutral position aligned with your spine

          ### 2. Movement
          1. Simultaneously lift your legs and upper body off the mat
          2. Reach your hands toward your toes while keeping your legs straight
          3. Focus on bringing your ribcage and hips together at the top
          4. Balance on your glutes at the peak of the movement
          5. Pause briefly when your hands touch or reach toward your feet
          6. Slowly lower both your upper and lower body back down with control
          7. Return to the starting position and repeat for controlled reps

          ### 3. Breathing
          - Exhale as you fold up and bring your body together
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on using your core to fold your body, not momentum
          - Keep your legs straight throughout the entire movement
          - Maintain control during both the lifting and lowering phases
          - Avoid using your arms to pull yourself up; let your core do the work
          - Keep constant tension on your abs by moving slowly

          ### 5. Common Mistakes
          - Using momentum to swing up instead of controlled core contraction
          - Bending the knees to make the exercise easier
          - Allowing the arms to pull instead of letting the core drive the movement
          - Moving too quickly and losing control
          - Not fully extending back to the starting position
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Beginners should start with crunches and leg raises separately before combining them
          - Perform a bent-knee variation if straight legs are too challenging
          - Advanced variation: hold a light weight overhead for added resistance
          - If you experience lower back discomfort, reduce your range of motion

  "Knee Raise (Captain's Chair)":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Knee Raise (Captain's Chair)"
        instructions: |
          ## Overview
          The captain's chair knee raise is a supported core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the obliques and transverse abdominis for stability, offering more support than hanging variations while still providing an effective lower ab workout.

          ## How to Perform
          ### 1. Starting Position
          - Position yourself in the captain's chair with your back firmly against the pad
          - Place your forearms on the armrests and grip the handles
          - Let your legs hang straight down with feet off the ground
          - Engage your core and keep your shoulders pressed down
          - Maintain an upright posture throughout the movement

          ### 2. Movement
          1. Lift your knees toward your chest by contracting your lower abs
          2. Continue raising your knees until they reach at least hip level or higher
          3. Keep the movement controlled and avoid swinging
          4. Pause briefly at the top of the movement
          5. Slowly lower your knees back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you lift your knees toward your chest
          - Inhale as you lower your knees back to the starting position

          ### 4. Tips
          - Focus on using your core to lift your knees, not just your hip flexors
          - Keep your back pressed against the pad throughout the movement
          - Avoid swinging or using momentum to raise your legs
          - Think about bringing your hips forward and up, not just your knees
          - Maintain steady breathing and avoid holding your breath

          ### 5. Common Mistakes
          - Using momentum and swinging instead of controlled muscle contraction
          - Arching the lower back away from the pad
          - Only lifting the knees partially without engaging the lower abs fully
          - Allowing the shoulders to shrug up toward the ears
          - Moving too quickly and losing control
          - Not bringing knees high enough to fully engage the abs

          ### 6. Safety / Modifications
          - Beginners can start with smaller raises, not bringing knees as high
          - Advanced variation: pause for 2-3 seconds at the top of each rep
          - Progress to captain's chair leg raises by extending your legs straight
          - If you experience shoulder discomfort, adjust your grip or arm position

  "Knees to Elbows":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Knees to Elbows"
        instructions: |
          ## Overview
          Knees to elbows is an advanced hanging core exercise that primarily targets the entire rectus abdominis and hip flexors. It also engages the obliques, transverse abdominis, grip strength, and shoulder stabilizers, requiring significant core control and coordination.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with your hands shoulder-width apart using an overhand grip
          - Allow your body to hang fully extended with your feet off the ground
          - Engage your core and keep your shoulders pulled down and back
          - Minimize swinging by stabilizing your body
          - Keep your legs together throughout the movement

          ### 2. Movement
          1. Simultaneously lift your knees toward your elbows by contracting your abs
          2. Lean back slightly and bring your knees as high as possible
          3. Aim to touch or come close to touching your elbows with your knees
          4. Keep the movement controlled and avoid excessive swinging
          5. Pause briefly at the top of the movement
          6. Slowly lower your knees back to the starting position with control
          7. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale forcefully as you lift your knees toward your elbows
          - Inhale as you lower your knees back to the starting position

          ### 4. Tips
          - Focus on bringing your knees up and forward, not just up
          - Allow a slight backward lean to facilitate knee-to-elbow contact
          - Keep your shoulders engaged and avoid hanging passively
          - Minimize swinging by maintaining core tension throughout
          - Think about curling your entire torso, not just lifting your legs

          ### 5. Common Mistakes
          - Using excessive momentum and swinging instead of controlled contraction
          - Not bringing knees high enough to fully engage the core
          - Allowing the shoulders to shrug up toward the ears
          - Moving too quickly and losing control
          - Releasing grip tension, which compromises form
          - Not leaning back slightly, making it harder to reach elbows

          ### 6. Safety / Modifications
          - Master hanging knee raises before attempting this advanced variation
          - Use wrist straps if grip strength is limiting
          - Beginners can perform the exercise on a captain's chair for support
          - Advanced variation: add a twist to alternate bringing knees to opposite elbows

  "Oblique Crunch":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Oblique Crunch"
        instructions: |
          ## Overview
          The oblique crunch is a bodyweight core exercise that primarily targets the obliques and rectus abdominis. It also engages the transverse abdominis as a stabilizer, making it effective for building lateral core strength and definition.

          ## How to Perform
          ### 1. Starting Position
          - Lie on your side on a mat with your legs stacked or staggered for stability
          - Place your bottom arm on the floor for support or across your chest
          - Place your top hand lightly behind your head with elbow pointing up
          - Engage your core and maintain a neutral spine
          - Keep your hips stacked and facing forward

          ### 2. Movement
          1. Lift your shoulder and upper torso toward your hip by contracting your obliques
          2. Focus on bringing your ribcage toward your hip on the same side
          3. Squeeze your obliques at the top of the movement for 1-2 seconds
          4. Slowly lower back to the starting position with control
          5. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you crunch up and contract your obliques
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on lateral flexion from your obliques, not forward flexion
          - Keep your hips stable and avoid rotating them
          - Move slowly and with control to maximize muscle engagement
          - Avoid pulling on your head or neck with your hand
          - Keep constant tension on your obliques throughout the movement

          ### 5. Common Mistakes
          - Pulling on the neck or head, which can cause strain
          - Rotating the hips instead of isolating the obliques
          - Using momentum instead of controlled muscle contraction
          - Not fully engaging the obliques on each rep
          - Moving too quickly and sacrificing form
          - Forgetting to repeat on both sides equally

          ### 6. Safety / Modifications
          - Beginners can place both hands behind the head for more support
          - Advanced variation: hold a weight plate on your chest for added resistance
          - If you experience neck discomfort, place your top arm across your chest instead
          - Progress by adding a 2-3 second pause at peak contraction

  "Plank":
    category: Duration
    target: Core
    i18n:
      en:
        name: "Plank"
        instructions: |
          ## Overview
          The plank is an isometric core exercise that primarily targets the transverse abdominis and rectus abdominis. It also engages the shoulders, glutes, and lower back stabilizers throughout the hold, making it one of the most effective exercises for building overall core stability and endurance.

          ## How to Perform
          ### 1. Starting Position
          - Start in a prone position on a mat with your forearms on the ground
          - Position your elbows directly under your shoulders with forearms parallel
          - Extend your legs straight back with toes tucked under
          - Lift your body off the ground, creating a straight line from head to heels
          - Engage your core, squeeze your glutes, and keep your neck neutral

          ### 2. Movement
          1. Hold this static position while maintaining proper alignment
          2. Keep your body in a straight line without sagging or piking
          3. Breathe steadily and maintain core tension throughout
          4. Focus on keeping your hips level and stable
          5. Hold for the target duration, typically 20-60 seconds or longer
          6. Lower to the ground with control when complete

          ### 3. Breathing
          - Breathe steadily and naturally throughout the hold
          - Avoid holding your breath; maintain consistent, calm breathing

          ### 4. Tips
          - Keep your body in a straight line from head to heels
          - Engage your glutes to prevent lower back sagging
          - Pull your belly button toward your spine to activate deep core muscles
          - Keep your neck neutral by looking at a spot on the floor
          - Distribute your weight evenly between your forearms and toes

          ### 5. Common Mistakes
          - Allowing the hips to sag, which strains the lower back
          - Piking the hips too high, which reduces core engagement
          - Holding your breath instead of breathing naturally
          - Letting the shoulders creep up toward the ears
          - Dropping the head down or looking forward instead of maintaining neutral neck
          - Holding the position with poor form instead of reducing duration

          ### 6. Safety / Modifications
          - Beginners can start on their knees instead of toes
          - Reduce hold time and focus on perfect form before increasing duration
          - Advanced variation: lift one leg or one arm to increase difficulty
          - If you experience lower back discomfort, check your form and reduce hold time

  "Reverse Crunch":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Reverse Crunch"
        instructions: |
          ## Overview
          The reverse crunch is a bodyweight core exercise that primarily targets the lower rectus abdominis. It also engages the hip flexors, obliques, and transverse abdominis as stabilizers, making it effective for building lower ab strength with less strain on the neck than traditional crunches.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back on a mat with your knees bent at 90 degrees
          - Lift your feet off the floor so your thighs are perpendicular to the ground
          - Place your arms beside your body with palms facing down for support
          - Press your lower back into the mat and engage your core
          - Keep your head and upper back relaxed on the mat

          ### 2. Movement
          1. Lift your hips off the mat by contracting your lower abs
          2. Curl your pelvis toward your ribcage, bringing your knees toward your chest
          3. Focus on using your abs to lift your hips, not momentum
          4. Pause briefly at the top when your hips are fully lifted
          5. Slowly lower your hips back to the starting position with control
          6. Stop just before your feet touch the floor to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you lift your hips and curl your pelvis
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on curling your pelvis rather than just lifting your legs
          - Keep your lower back pressed against the mat throughout
          - Move slowly and with control to maximize ab engagement
          - Use your hands for balance only, not to push yourself up
          - Keep constant tension on your abs by not fully relaxing between reps

          ### 5. Common Mistakes
          - Using momentum to swing the legs instead of controlled contraction
          - Not lifting the hips off the mat, only moving the legs
          - Allowing the lower back to arch during the movement
          - Moving too quickly and sacrificing form
          - Pushing with the arms instead of using the core
          - Completely relaxing between reps, losing core tension

          ### 6. Safety / Modifications
          - Beginners can reduce range of motion by not bringing knees as close to chest
          - Place hands under your glutes for additional lower back support
          - Advanced variation: hold a medicine ball between your knees for added resistance
          - If you experience lower back discomfort, focus on smaller movements with better control

  "Reverse Plank":
    category: Duration
    target: Core
    i18n:
      en:
        name: "Reverse Plank"
        instructions: |
          ## Overview
          The reverse plank is an isometric core exercise that primarily targets the transverse abdominis, lower back, and glutes. It also engages the shoulders, hamstrings, and upper back stabilizers, making it effective for building posterior chain strength and improving posture.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a mat with your legs extended straight in front of you
          - Place your hands on the floor behind you, fingers pointing toward your feet
          - Position your hands shoulder-width apart with arms straight
          - Engage your core and prepare to lift your hips
          - Keep your feet together or hip-width apart

          ### 2. Movement
          1. Press through your hands and heels to lift your hips off the ground
          2. Raise your hips until your body forms a straight line from head to heels
          3. Keep your arms straight and shoulders pressed down
          4. Engage your glutes and core to maintain the position
          5. Hold this static position for the target duration, typically 20-45 seconds
          6. Lower your hips back to the ground with control when complete

          ### 3. Breathing
          - Breathe steadily and naturally throughout the hold
          - Avoid holding your breath; maintain consistent, calm breathing

          ### 4. Tips
          - Keep your body in a straight line without sagging or piking
          - Squeeze your glutes throughout the hold to protect your lower back
          - Press your chest up and open to engage your upper back
          - Keep your neck neutral by looking slightly upward
          - Distribute your weight evenly between your hands and heels

          ### 5. Common Mistakes
          - Allowing the hips to sag, which strains the lower back
          - Bending the arms instead of keeping them straight
          - Dropping the head back too far, which strains the neck
          - Holding your breath instead of breathing naturally
          - Not engaging the glutes, putting excess stress on the lower back
          - Holding the position with poor form instead of reducing duration

          ### 6. Safety / Modifications
          - Beginners can start with bent knees (reverse tabletop position)
          - Reduce hold time and focus on perfect form before increasing duration
          - Advanced variation: lift one leg to increase difficulty
          - If you experience wrist discomfort, perform on your forearms instead

  "Russian Twist":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Russian Twist"
        instructions: |
          ## Overview
          The Russian twist is a dynamic rotational core exercise that primarily targets the obliques and transverse abdominis. It also engages the rectus abdominis and hip flexors as stabilizers, making it effective for building rotational strength and core stability.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a mat with your knees bent and feet flat on the floor
          - Lean back slightly to engage your core, creating a V-shape with your torso and thighs
          - Lift your feet slightly off the ground for added difficulty, or keep them planted
          - Clasp your hands together in front of your chest
          - Keep your back straight and core engaged throughout

          ### 2. Movement
          1. Rotate your torso to the right, bringing your hands toward the floor beside your hip
          2. Keep your hips facing forward while your upper body twists
          3. Pause briefly when your hands touch or come close to the floor
          4. Rotate back through center to the opposite side
          5. Bring your hands toward the floor beside your left hip
          6. Continue alternating sides in a controlled, rhythmic motion for the desired number of reps

          ### 3. Breathing
          - Exhale as you twist to each side
          - Inhale as you pass through center

          ### 4. Tips
          - Initiate the rotation from your core, not your arms
          - Keep your chest lifted and back straight throughout
          - Maintain a consistent lean-back angle without collapsing forward
          - Move with control rather than speed for maximum effectiveness
          - Keep your hips stable and facing forward

          ### 5. Common Mistakes
          - Rotating the hips along with the torso instead of keeping them stable
          - Rounding the back and collapsing forward
          - Moving too quickly and using momentum instead of control
          - Only moving the arms instead of rotating the entire torso
          - Holding your breath during the movement
          - Leaning back too far, which can strain the lower back

          ### 6. Safety / Modifications
          - Beginners can keep their feet on the ground for better stability
          - Advanced variation: hold a weight plate, dumbbell, or medicine ball for added resistance
          - Reduce the range of motion if you experience lower back discomfort
          - Progress by lifting feet higher or adding a pause at each side

  "Flutter Kick":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Flutter Kick"
        instructions: |
          ## Overview
          The flutter kick is a dynamic bodyweight core exercise that primarily targets the lower rectus abdominis and hip flexors. It also engages the transverse abdominis and obliques as stabilizers, building lower ab endurance through continuous, alternating leg movements.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back on a mat with your legs fully extended
          - Place your hands beside your hips or under your glutes for support
          - Press your lower back into the mat and engage your core
          - Lift your legs slightly off the ground, about 6-12 inches
          - Keep your head and shoulders relaxed on the mat

          ### 2. Movement
          1. Alternate lifting each leg up and down in a small, rapid flutter motion
          2. Keep your legs straight and toes pointed throughout
          3. Maintain a consistent, controlled rhythm without touching the floor
          4. Keep your lower back pressed firmly against the mat
          5. Continue the alternating flutter for the desired number of reps or time duration
          6. Focus on small, quick movements rather than large leg swings

          ### 3. Breathing
          - Breathe steadily and naturally throughout the movement
          - Avoid holding your breath; maintain consistent breathing rhythm

          ### 4. Tips
          - Keep your legs relatively low to increase lower ab engagement
          - Press your lower back into the mat to protect your spine
          - Move from your hips, not your knees
          - Keep your core tight throughout the entire set
          - Focus on controlled, rapid movements rather than large kicks

          ### 5. Common Mistakes
          - Allowing the lower back to arch off the mat
          - Making the leg movements too large, reducing core engagement
          - Letting the legs drop too low or touch the floor between kicks
          - Tensing the neck and upper body unnecessarily
          - Moving too slowly or inconsistently
          - Holding your breath during the exercise

          ### 6. Safety / Modifications
          - Beginners can raise legs higher to reduce intensity
          - Place hands under your glutes for additional lower back support
          - Advanced variation: perform with head and shoulders lifted in a crunch position
          - If you experience lower back discomfort, raise your legs higher or reduce duration

  "Side Bend (Cable)":
    category: Machine
    target: Core
    i18n:
      en:
        name: "Side Bend (Cable)"
        instructions: |
          ## Overview
          The cable side bend is a resistance-based core exercise that primarily targets the obliques and transverse abdominis. It also engages the quadratus lumborum and erector spinae as stabilizers, providing constant tension throughout the movement for building lateral core strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand sideways to a low cable pulley machine with feet shoulder-width apart
          - Grip the handle with the hand closest to the machine
          - Step away slightly to create tension on the cable
          - Place your free hand behind your head or on your hip
          - Stand upright with your core engaged and shoulders level

          ### 2. Movement
          1. Slowly bend away from the cable by contracting your opposite-side obliques
          2. Keep your hips stable and facing forward throughout
          3. Bend laterally as far as comfortable while maintaining control
          4. Pause briefly at the end of the movement
          5. Return to the starting upright position with control, resisting the cable's pull
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you bend away from the cable
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on pure lateral flexion without twisting or leaning forward
          - Keep your hips and shoulders facing forward throughout
          - Move slowly and with control to maximize oblique engagement
          - Avoid bending toward the cable, which reduces effectiveness
          - Keep tension on the cable throughout the entire range of motion

          ### 5. Common Mistakes
          - Using too much weight and compromising form
          - Twisting or rotating instead of pure lateral bending
          - Allowing the hips to shift side to side
          - Bending forward or backward instead of directly to the side
          - Moving too quickly and using momentum
          - Not controlling the return to starting position

          ### 6. Safety / Modifications
          - Start with light weight to master the movement pattern
          - Beginners can perform without weight to establish proper form
          - Advanced variation: pause for 2-3 seconds at peak contraction
          - If you experience lower back discomfort, reduce weight and check your form

  "Side Bend (Band)":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Side Bend (Band)"
        instructions: |
          ## Overview
          The band side bend is a resistance-based core exercise that primarily targets the obliques and transverse abdominis. It also engages the quadratus lumborum as a stabilizer, providing progressive tension throughout the movement for building lateral core strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, stepping on the center of a resistance band
          - Grip one end of the band with one hand at your side
          - Place your free hand behind your head or on your hip
          - Stand upright with your core engaged and shoulders level
          - Ensure the band has slight tension even in the starting position

          ### 2. Movement
          1. Slowly bend away from the band by contracting your opposite-side obliques
          2. Keep your hips stable and facing forward throughout
          3. Bend laterally as far as comfortable while maintaining control
          4. Pause briefly at the end of the movement
          5. Return to the starting upright position with control, resisting the band's pull
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you bend away from the band
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on pure lateral flexion without twisting or leaning forward
          - Keep your hips and shoulders facing forward throughout
          - Move slowly and with control to maximize oblique engagement
          - Avoid bending toward the band side, which reduces effectiveness
          - Maintain constant tension on the band throughout

          ### 5. Common Mistakes
          - Using too much band resistance and compromising form
          - Twisting or rotating instead of pure lateral bending
          - Allowing the hips to shift side to side
          - Bending forward or backward instead of directly to the side
          - Moving too quickly and using momentum
          - Not controlling the return to starting position

          ### 6. Safety / Modifications
          - Start with lighter band resistance to master the movement pattern
          - Beginners can perform without band to establish proper form first
          - Advanced variation: use a heavier resistance band or pause at peak contraction
          - If you experience lower back discomfort, reduce resistance and check your form

  "Side Bend (Dumbbell)":
    category: Dumbbell
    target: Core
    i18n:
      en:
        name: "Side Bend (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell side bend is a weighted core exercise that primarily targets the obliques and transverse abdominis. It also engages the quadratus lumborum and erector spinae as stabilizers, making it effective for building lateral core strength and definition.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet shoulder-width apart holding a dumbbell in one hand
          - Let the dumbbell hang at your side with your arm fully extended
          - Place your free hand behind your head or on your hip
          - Stand upright with your core engaged and shoulders level
          - Keep your chest lifted and maintain a neutral spine

          ### 2. Movement
          1. Slowly bend toward the side holding the dumbbell, lowering it down your leg
          2. Keep your hips stable and facing forward throughout
          3. Lower as far as comfortable while maintaining control
          4. Pause briefly at the bottom of the movement
          5. Contract your opposite-side obliques to return to the starting upright position
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Inhale as you bend toward the weighted side
          - Exhale as you return to the starting position

          ### 4. Tips
          - Focus on pure lateral flexion without twisting or leaning forward
          - Keep your hips and shoulders facing forward throughout
          - Move slowly and with control to maximize oblique engagement
          - Let the weight stretch your obliques on the way down
          - Contract the opposite obliques to pull yourself back up

          ### 5. Common Mistakes
          - Using too heavy a weight and compromising form
          - Twisting or rotating instead of pure lateral bending
          - Allowing the hips to shift side to side
          - Bending forward or backward instead of directly to the side
          - Moving too quickly and using momentum
          - Holding a dumbbell in both hands, which reduces effectiveness

          ### 6. Safety / Modifications
          - Start with a light dumbbell to master the movement pattern
          - Beginners can perform without weight to establish proper form
          - Advanced variation: pause for 2-3 seconds at the bottom for increased stretch
          - If you experience lower back discomfort, reduce weight and check your form

  "Side Plank":
    category: Duration
    target: Core
    i18n:
      en:
        name: "Side Plank"
        instructions: |
          ## Overview
          The side plank is an isometric core exercise that primarily targets the obliques and transverse abdominis. It also engages the shoulders, hip stabilizers, and quadratus lumborum, making it highly effective for building lateral core strength, stability, and balance.

          ## How to Perform
          ### 1. Starting Position
          - Lie on your side on a mat with your legs stacked and body in a straight line
          - Position your elbow directly under your shoulder with forearm perpendicular to your body
          - Stack your feet or place the top foot in front for more stability
          - Place your top hand on your hip or extend it toward the ceiling
          - Engage your core and prepare to lift your hips

          ### 2. Movement
          1. Press through your forearm and feet to lift your hips off the ground
          2. Raise your hips until your body forms a straight line from head to feet
          3. Keep your core engaged and hips lifted throughout
          4. Avoid letting your hips sag or pike upward
          5. Hold this static position for the target duration, typically 20-45 seconds per side
          6. Lower your hips back to the ground with control, then repeat on the other side

          ### 3. Breathing
          - Breathe steadily and naturally throughout the hold
          - Avoid holding your breath; maintain consistent, calm breathing

          ### 4. Tips
          - Keep your body in a straight line without sagging or rotating
          - Engage your obliques to keep your hips lifted
          - Press your bottom shoulder down and away from your ear
          - Keep your neck neutral by looking straight ahead
          - Think about pushing the ground away with your forearm

          ### 5. Common Mistakes
          - Allowing the hips to sag toward the floor
          - Rotating the torso forward or backward instead of staying in lateral alignment
          - Letting the shoulders creep up toward the ears
          - Holding your breath instead of breathing naturally
          - Not stacking the body properly, creating misalignment
          - Holding the position with poor form instead of reducing duration

          ### 6. Safety / Modifications
          - Beginners can perform on their knees instead of feet
          - Reduce hold time and focus on perfect form before increasing duration
          - Advanced variation: lift the top leg to increase difficulty
          - Repeat on both sides for balanced core development

  "Sit Up":
    category: Weighted Body Weight
    target: Core
    i18n:
      en:
        name: "Sit Up"
        instructions: |
          ## Overview
          The sit up is a classic bodyweight core exercise that primarily targets the rectus abdominis and hip flexors. It also engages the obliques and transverse abdominis throughout the full range of motion, making it more dynamic than crunches but requiring greater hip flexor involvement.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back on a mat with your knees bent and feet flat on the floor
          - Secure your feet under a stable object or have a partner hold them if needed
          - Place your hands behind your head, crossed over your chest, or extended toward your knees
          - Keep your elbows pointing out to the sides if hands are behind your head
          - Engage your core and press your lower back into the mat

          ### 2. Movement
          1. Lift your entire upper body off the mat by contracting your abs
          2. Continue curling up until your torso is nearly vertical or chest reaches your knees
          3. Keep your core engaged and exhale as you rise
          4. Pause briefly at the top of the movement
          5. Slowly lower your torso back down with control
          6. Touch your shoulder blades to the mat before starting the next rep

          ### 3. Breathing
          - Exhale as you sit up and curl your torso forward
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on using your core to lift yourself, not pulling with your neck
          - Keep your feet flat on the ground throughout the movement
          - Move with control rather than momentum
          - Avoid yanking on your head or neck if hands are behind your head
          - Keep your lower back from arching excessively

          ### 5. Common Mistakes
          - Pulling on the neck or head, which can cause strain
          - Using momentum to swing up instead of controlled muscle contraction
          - Allowing the feet to lift off the ground
          - Arching the lower back excessively during the movement
          - Moving too quickly and sacrificing form
          - Not fully lowering back down between reps

          ### 6. Safety / Modifications
          - Beginners can perform crunches instead until they build sufficient strength
          - Place hands on thighs and slide them toward knees for an easier variation
          - Advanced variation: hold a weight plate on your chest for added resistance
          - If you experience lower back discomfort, switch to crunches or reduce range of motion

  "Superman":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Superman"
        instructions: |
          ## Overview
          The superman is a bodyweight core exercise that primarily targets the lower back (erector spinae) and glutes. It also engages the upper back, shoulders, and hamstrings, making it effective for strengthening the posterior chain and improving spinal extension.

          ## How to Perform
          ### 1. Starting Position
          - Lie face down on a mat with your arms extended straight overhead
          - Keep your legs straight and together, fully extended behind you
          - Rest your forehead on the mat with your neck in a neutral position
          - Engage your core and glutes before starting the movement
          - Keep your toes pointed throughout

          ### 2. Movement
          1. Simultaneously lift your arms, chest, and legs off the mat
          2. Raise them as high as comfortable while squeezing your lower back and glutes
          3. Keep your arms and legs straight throughout the movement
          4. Pause briefly at the top, squeezing your posterior chain
          5. Slowly lower your arms, chest, and legs back to the mat with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you lift your arms, chest, and legs off the mat
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on squeezing your lower back and glutes at the top
          - Keep your neck neutral by looking down at the mat
          - Lift with control rather than momentum
          - Keep your arms and legs straight throughout
          - Imagine lengthening your body from fingertips to toes

          ### 5. Common Mistakes
          - Lifting the head and neck too high, which can cause strain
          - Bending the arms or legs during the movement
          - Using momentum instead of controlled muscle contraction
          - Not engaging the glutes, relying only on the lower back
          - Moving too quickly and sacrificing form
          - Holding your breath during the exercise

          ### 6. Safety / Modifications
          - Beginners can lift only arms or only legs until they build strength
          - Reduce range of motion if you experience lower back discomfort
          - Advanced variation: hold the top position for 3-5 seconds for increased intensity
          - Progress to alternating supermans (opposite arm and leg) for variation

  "Toes To Bar":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "Toes To Bar"
        instructions: |
          ## Overview
          Toes to bar is an advanced hanging core exercise that primarily targets the entire rectus abdominis and hip flexors. It also engages the obliques, transverse abdominis, lats, grip strength, and shoulder stabilizers, making it one of the most challenging bodyweight ab exercises.

          ## How to Perform
          ### 1. Starting Position
          - Hang from a pull-up bar with your hands shoulder-width apart using an overhand grip
          - Allow your body to hang fully extended with your feet off the ground
          - Engage your core and keep your shoulders pulled down and back
          - Keep your legs together and fully extended
          - Minimize swinging by stabilizing your body

          ### 2. Movement
          1. Simultaneously lift your legs and bring your toes toward the bar
          2. Keep your legs straight as you raise them in a smooth arc
          3. Use core strength and a slight hip drive to reach your toes to the bar
          4. Touch the bar with your toes at the top of the movement
          5. Control the descent as you lower your legs back down
          6. Return to the starting hanging position and repeat for controlled reps

          ### 3. Breathing
          - Exhale forcefully as you lift your legs toward the bar
          - Inhale as you lower your legs back to the starting position

          ### 4. Tips
          - Generate momentum from your shoulders and core, not just your legs
          - Think about bringing your toes to the bar in an arc, not straight up
          - Keep your arms straight and shoulders engaged throughout
          - Use a controlled swing rather than fighting against it
          - Squeeze your abs hard at the top of the movement

          ### 5. Common Mistakes
          - Bending the knees to make the exercise easier
          - Using excessive, uncontrolled swinging
          - Not bringing the toes all the way to the bar
          - Allowing the shoulders to shrug up toward the ears
          - Dropping the legs too quickly on the descent
          - Not engaging the lats to help control the movement

          ### 6. Safety / Modifications
          - Master hanging leg raises and knees to elbows before attempting this exercise
          - Use wrist straps if grip strength is limiting
          - Beginners can practice the kipping motion separately before combining it
          - Advanced variation: perform strict toes to bar without any swing or kip

  "Torso Rotation (Machine)":
    category: Machine
    target: Core
    i18n:
      en:
        name: "Torso Rotation (Machine)"
        instructions: |
          ## Overview
          The torso rotation machine is a resistance-based core exercise that primarily targets the obliques and transverse abdominis. It also engages the rectus abdominis and deep core stabilizers through a controlled rotational movement, allowing you to progressively overload rotational core strength.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the torso rotation machine with your back against the pad
          - Adjust the seat height so the pivot point aligns with your mid-torso
          - Place your feet flat on the footrests and secure your thighs under the pads
          - Grip the handles at chest height on either side
          - Engage your core and maintain an upright posture

          ### 2. Movement
          1. Rotate your torso to one side by contracting your obliques
          2. Keep your hips stable and facing forward throughout the movement
          3. Rotate as far as the machine allows while maintaining control
          4. Pause briefly at the end of the rotation
          5. Return to the starting center position with control
          6. Complete all reps on one side, then adjust the machine and repeat on the other side

          ### 3. Breathing
          - Exhale as you rotate to the side
          - Inhale as you return to the starting position

          ### 4. Tips
          - Focus on rotating from your core, not pulling with your arms
          - Keep your hips and lower body completely stable
          - Move slowly and with control to maximize oblique engagement
          - Maintain an upright posture throughout the movement
          - Keep tension on the weight stack by not letting it rest between reps

          ### 5. Common Mistakes
          - Using too much weight and compromising form
          - Rotating the hips along with the torso
          - Using momentum or jerking the weight
          - Pulling with the arms instead of rotating with the core
          - Moving too quickly through the range of motion
          - Leaning forward or backward instead of staying upright

          ### 6. Safety / Modifications
          - Start with light weight to master the rotational pattern
          - Perform equal reps on both sides for balanced development
          - Advanced variation: pause for 2-3 seconds at peak rotation
          - If you experience lower back discomfort, reduce weight and ensure proper form

  "V Up":
    category: Reps Only
    target: Core
    i18n:
      en:
        name: "V Up"
        instructions: |
          ## Overview
          The V up is an advanced bodyweight core exercise that primarily targets the entire rectus abdominis. It also engages the hip flexors, obliques, and transverse abdominis as you simultaneously lift your upper and lower body into a V position, creating intense core contraction.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on your back on a mat with your arms extended overhead
          - Keep your legs straight and together, fully extended on the mat
          - Engage your core and press your lower back into the mat
          - Keep your head in a neutral position aligned with your spine

          ### 2. Movement
          1. Simultaneously lift your legs and upper body off the mat
          2. Keep your arms and legs straight as you reach your hands toward your toes
          3. Form a V shape with your body, balancing on your glutes
          4. Touch or reach toward your toes at the peak of the movement
          5. Pause briefly in the V position
          6. Slowly lower both your upper and lower body back down with control
          7. Return to the starting position and repeat for controlled reps

          ### 3. Breathing
          - Exhale as you fold up into the V position
          - Inhale as you lower back to the starting position

          ### 4. Tips
          - Focus on using your core to fold your body, not momentum
          - Keep your legs and arms straight throughout the entire movement
          - Maintain control during both the lifting and lowering phases
          - Balance on your glutes at the top of the movement
          - Keep constant tension on your abs by moving slowly

          ### 5. Common Mistakes
          - Using momentum to swing up instead of controlled core contraction
          - Bending the knees or arms to make the exercise easier
          - Allowing the arms to pull instead of letting the core drive the movement
          - Moving too quickly and losing control
          - Not fully extending back to the starting position
          - Holding your breath during the movement

          ### 6. Safety / Modifications
          - Beginners should master crunches and leg raises separately before combining them
          - Perform a bent-knee variation (tuck V up) if straight legs are too challenging
          - Advanced variation: hold a light weight between your feet for added resistance
          - If you experience lower back discomfort, reduce your range of motion or switch to easier variations

      en_CA:
        name: "V Up"
        fallback_to: en

  "Bench Dip":
    category: Weighted Body Weight
    target: Arms
    i18n:
      en:
        name: "Bench Dip"
        instructions: |
          ## Overview
          The bench dip is a bodyweight exercise that primarily targets the triceps. It also engages the shoulders and chest as secondary muscles, making it an effective upper-body pushing movement that can be performed with minimal equipment.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the edge of a sturdy bench with your hands gripping the edge beside your hips
          - Place your hands shoulder-width apart with fingers pointing forward
          - Extend your legs out in front of you with heels on the ground
          - Slide your glutes off the bench while keeping your hands in place
          - Keep your back close to the bench and shoulders pressed down

          ### 2. Movement
          1. Lower your body by bending your elbows until they reach about 90 degrees
          2. Keep your elbows pointing straight back, not flaring out to the sides
          3. Maintain an upright torso and avoid hunching your shoulders
          4. Pause briefly at the bottom of the movement
          5. Press through your palms to extend your arms and return to the starting position
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Inhale as you lower your body down
          - Exhale as you press back up to the starting position

          ### 4. Tips
          - Keep your elbows tucked in close to your body throughout the movement
          - Focus on using your triceps to lift yourself rather than pushing with your legs
          - Keep your core engaged to maintain stability
          - Avoid letting your shoulders shrug up toward your ears
          - Move through a full range of motion while maintaining control

          ### 5. Common Mistakes
          - Allowing the elbows to flare out excessively to the sides
          - Dropping too low and putting excessive strain on the shoulders
          - Using leg drive instead of isolating the triceps
          - Moving too quickly and using momentum
          - Hunching the shoulders forward
          - Not going low enough to adequately engage the triceps

          ### 6. Safety / Modifications
          - Beginners can bend their knees and place feet closer to the bench for easier leverage
          - Advanced variation: elevate your feet on another bench to increase difficulty
          - Place a weight plate on your lap for added resistance
          - If you experience shoulder discomfort, reduce your range of motion

  "Bench Press - Close Grip (Barbell)":
    category: Barbell
    target: Arms
    i18n:
      en:
        name: "Bench Press - Close Grip (Barbell)"
        instructions: |
          ## Overview
          The close grip bench press is a barbell exercise that primarily targets the triceps. It also engages the chest and front shoulders as secondary muscles, making it an effective compound movement for building upper-body pressing strength with greater triceps emphasis.

          ## How to Perform
          ### 1. Starting Position
          - Lie flat on a bench with your feet firmly planted on the floor
          - Grip the barbell with your hands positioned slightly narrower than shoulder-width apart
          - Position yourself so the bar is directly above your upper chest
          - Unrack the bar and hold it with arms fully extended
          - Keep your shoulder blades retracted and pressed into the bench

          ### 2. Movement
          1. Lower the bar slowly to your lower chest or upper abdomen
          2. Keep your elbows tucked close to your sides at about a 45-degree angle from your body
          3. Lower the bar until it lightly touches your torso
          4. Pause briefly at the bottom
          5. Press the bar back up by extending your arms
          6. Lock out your elbows at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower the bar to your chest
          - Exhale as you press the bar back up

          ### 4. Tips
          - Keep your elbows tucked in throughout the movement to maximize triceps engagement
          - Maintain a stable, flat back position on the bench
          - Use a grip that's comfortable but closer than your regular bench press grip
          - Keep your wrists straight and aligned over your forearms
          - Control the descent and avoid bouncing the bar off your chest

          ### 5. Common Mistakes
          - Using a grip that's too narrow, which can strain the wrists
          - Allowing the elbows to flare out excessively
          - Bouncing the bar off the chest instead of controlled touch-and-press
          - Arching the back excessively
          - Using too much weight and compromising form
          - Not lowering the bar all the way to the chest

          ### 6. Safety / Modifications
          - Use a spotter when lifting heavy weights
          - Start with light weight to master the tucked-elbow technique
          - If you experience wrist discomfort, slightly widen your grip
          - Advanced variation: add chains or bands for accommodating resistance

  "Bicep Curl (Barbell)":
    category: Barbell
    target: Arms
    i18n:
      en:
        name: "Bicep Curl (Barbell)"
        instructions: |
          ## Overview
          The barbell bicep curl is a classic isolation exercise that primarily targets the biceps brachii. It also engages the brachialis and brachioradialis as secondary muscles, making it one of the most effective exercises for building arm size and strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a barbell with an underhand grip
          - Position your hands slightly wider than shoulder-width apart
          - Let the bar hang at arm's length in front of your thighs
          - Keep your elbows close to your sides throughout the movement
          - Engage your core and maintain an upright posture

          ### 2. Movement
          1. Curl the bar upward by bending your elbows and contracting your biceps
          2. Keep your upper arms stationary and close to your torso
          3. Continue lifting until the bar reaches shoulder height
          4. Pause and squeeze your biceps at the top of the movement
          5. Slowly lower the bar back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you curl the bar up
          - Inhale as you lower the bar back down

          ### 4. Tips
          - Keep your elbows pinned to your sides throughout the movement
          - Avoid swinging or using momentum to lift the weight
          - Focus on squeezing your biceps at the top of each rep
          - Maintain a straight back and stable core
          - Control both the lifting and lowering phases

          ### 5. Common Mistakes
          - Swinging the body or using momentum to lift the weight
          - Allowing the elbows to drift forward during the curl
          - Not fully extending the arms at the bottom
          - Lifting the weight too quickly on the way up
          - Dropping the weight too quickly on the way down
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Start with a light weight to master proper form
          - Use an EZ curl bar if you experience wrist discomfort
          - Advanced variation: perform slow negatives (3-5 seconds) on the lowering phase
          - Beginners can use dumbbells for more natural wrist positioning

  "Bicep Curl (Cable)":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Bicep Curl (Cable)"
        instructions: |
          ## Overview
          The cable bicep curl is an isolation exercise that primarily targets the biceps brachii with constant tension throughout the movement. It also engages the brachialis and brachioradialis, offering a smoother resistance curve than free weights for continuous muscle activation.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing a low cable pulley with feet hip-width apart
          - Attach a straight bar or EZ curl bar to the low pulley
          - Grip the bar with an underhand grip, hands shoulder-width apart
          - Step back slightly to create tension on the cable
          - Keep your elbows close to your sides and maintain an upright posture

          ### 2. Movement
          1. Curl the bar upward by bending your elbows and contracting your biceps
          2. Keep your upper arms stationary and close to your torso
          3. Continue lifting until the bar reaches shoulder height
          4. Pause and squeeze your biceps at the top of the movement
          5. Slowly lower the bar back to the starting position with control
          6. Stop just before the weight stack touches to maintain constant tension, then repeat

          ### 3. Breathing
          - Exhale as you curl the bar up
          - Inhale as you lower the bar back down

          ### 4. Tips
          - Keep your elbows pinned to your sides throughout the movement
          - Avoid leaning back or using momentum to lift the weight
          - Maintain constant tension by not letting the weight stack rest between reps
          - Focus on squeezing your biceps at the top of each rep
          - Control both the lifting and lowering phases

          ### 5. Common Mistakes
          - Swinging the body or using momentum to lift the weight
          - Allowing the elbows to drift forward during the curl
          - Letting the weight stack rest completely between reps
          - Lifting the weight too quickly on the way up
          - Not maintaining constant tension on the cable
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Start with light weight to master proper form and mind-muscle connection
          - Try different attachments (rope, straight bar, EZ bar) for variety
          - Advanced variation: perform one arm at a time for unilateral focus
          - Use a rope attachment if you experience wrist discomfort with bars

  "Bicep Curl (Dumbbell)":
    category: Dumbbell
    target: Arms
    i18n:
      en:
        name: "Bicep Curl (Dumbbell)"
        instructions: |
          ## Overview
          The dumbbell bicep curl is a fundamental isolation exercise that primarily targets the biceps brachii. It also engages the brachialis and brachioradialis, allowing for independent arm training and natural wrist rotation throughout the movement.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a dumbbell in each hand
          - Let the dumbbells hang at arm's length beside your thighs
          - Keep your palms facing forward (supinated grip)
          - Maintain an upright posture with your core engaged
          - Keep your elbows close to your sides throughout

          ### 2. Movement
          1. Curl both dumbbells upward by bending your elbows and contracting your biceps
          2. Keep your upper arms stationary and pinned to your sides
          3. Continue lifting until the dumbbells reach shoulder height
          4. Pause and squeeze your biceps at the top of the movement
          5. Slowly lower the dumbbells back to the starting position with control
          6. Repeat for the desired number of controlled reps

          ### 3. Breathing
          - Exhale as you curl the dumbbells up
          - Inhale as you lower the dumbbells back down

          ### 4. Tips
          - Keep your elbows stationary and close to your body throughout
          - Avoid swinging or using momentum to lift the weight
          - Focus on squeezing your biceps at the top of each rep
          - Maintain a straight back and stable core
          - Control both the lifting and lowering phases equally

          ### 5. Common Mistakes
          - Swinging the body or using momentum to lift the weight
          - Allowing the elbows to drift forward during the curl
          - Not fully extending the arms at the bottom
          - Rotating the wrists excessively
          - Dropping the weight too quickly on the way down
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Start with light dumbbells to master proper form
          - Perform alternating curls (one arm at a time) for better focus
          - Advanced variation: perform with a slow 3-5 second negative phase
          - Seated variation can help eliminate momentum and body swing

  "Bicep Curl (Machine)":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Bicep Curl (Machine)"
        instructions: |
          ## Overview
          The machine bicep curl is an isolation exercise that primarily targets the biceps brachii with a fixed movement path. It also engages the brachialis and brachioradialis, offering stability and support that allows you to focus purely on biceps contraction.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the machine with your back firmly against the pad
          - Adjust the seat height so your elbows align with the machine's pivot point
          - Position your upper arms on the arm pad with elbows slightly below shoulder level
          - Grip the handles with an underhand grip
          - Keep your chest up and core engaged

          ### 2. Movement
          1. Curl the handles upward by contracting your biceps
          2. Keep your upper arms pressed firmly against the pad throughout
          3. Continue lifting until your biceps are fully contracted
          4. Pause and squeeze your biceps at the top of the movement
          5. Slowly lower the handles back to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you curl the handles up
          - Inhale as you lower the handles back down

          ### 4. Tips
          - Keep your upper arms pressed firmly against the pad throughout
          - Avoid lifting your elbows off the pad during the curl
          - Focus on squeezing your biceps at the top of each rep
          - Maintain constant tension by not letting the weight stack rest
          - Control both the lifting and lowering phases

          ### 5. Common Mistakes
          - Lifting the elbows off the arm pad during the curl
          - Using momentum instead of controlled muscle contraction
          - Not adjusting the seat properly for optimal elbow alignment
          - Letting the weight stack rest completely between reps
          - Using too much weight and compromising form
          - Not achieving full range of motion

          ### 6. Safety / Modifications
          - Adjust seat height to ensure proper elbow alignment with the pivot point
          - Start with light weight to establish mind-muscle connection
          - Advanced variation: perform one arm at a time for unilateral focus
          - Add a 2-3 second pause at peak contraction for increased intensity

  "Cable Kickback":
    category: Machine
    target: Arms
    i18n:
      en:
        name: "Cable Kickback"
        instructions: |
          ## Overview
          The cable kickback is an isolation exercise that primarily targets the triceps, particularly the long head. It also engages the shoulders and core as stabilizers, providing constant tension throughout the movement for effective triceps development.

          ## How to Perform
          ### 1. Starting Position
          - Stand facing a low cable pulley with a single handle attached
          - Grip the handle with one hand and step back to create tension
          - Hinge forward at the hips with your torso at about 45 degrees
          - Keep your working arm's elbow bent at 90 degrees and tucked close to your side
          - Place your free hand on your thigh or the machine for support
          - Engage your core for stability

          ### 2. Movement
          1. Extend your arm backward by straightening your elbow
          2. Keep your upper arm stationary and parallel to the floor
          3. Continue until your arm is fully extended behind you
          4. Pause and squeeze your triceps at full extension
          5. Slowly return to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you extend your arm backward
          - Inhale as you return to the starting position

          ### 4. Tips
          - Keep your upper arm completely still throughout the movement
          - Focus on isolating the triceps by only moving at the elbow joint
          - Maintain a stable torso position without rocking back and forth
          - Squeeze your triceps hard at full extension
          - Keep tension on the cable throughout the entire movement

          ### 5. Common Mistakes
          - Allowing the upper arm to move during the extension
          - Swinging the arm or using momentum
          - Not achieving full elbow extension at the back
          - Rocking the torso back and forth
          - Using too much weight and compromising form
          - Letting the cable slack at any point in the movement

          ### 6. Safety / Modifications
          - Start with light weight to master the isolation technique
          - Keep your core engaged to protect your lower back in the bent position
          - Advanced variation: pause for 2-3 seconds at full extension
          - Use a rope attachment instead of a handle for a different grip option

  "Concentration Curl (Dumbbell)":
    category: Dumbbell
    target: Arms
    i18n:
      en:
        name: "Concentration Curl (Dumbbell)"
        instructions: |
          ## Overview
          The concentration curl is an isolation exercise that primarily targets the biceps brachii with maximum focus on the muscle. It also engages the brachialis and brachioradialis, with the seated, braced position eliminating momentum for strict biceps isolation.

          ## How to Perform
          ### 1. Starting Position
          - Sit on a bench with your legs spread wide
          - Hold a dumbbell in one hand with your arm hanging straight down
          - Place the back of your upper arm against your inner thigh
          - Lean forward slightly and brace your free hand on your opposite thigh
          - Keep your chest up and core engaged

          ### 2. Movement
          1. Curl the dumbbell upward by contracting your biceps
          2. Keep your upper arm pressed firmly against your inner thigh throughout
          3. Continue lifting until the dumbbell reaches shoulder height
          4. Pause and squeeze your biceps hard at the top
          5. Slowly lower the dumbbell back to the starting position with control
          6. Complete all reps on one side, then repeat on the other side

          ### 3. Breathing
          - Exhale as you curl the dumbbell up
          - Inhale as you lower the dumbbell back down

          ### 4. Tips
          - Keep your upper arm completely stationary against your thigh
          - Focus on pure biceps contraction without any body movement
          - Squeeze your biceps hard at the top of each rep
          - Avoid letting the dumbbell swing or using momentum
          - Control the weight throughout the entire range of motion

          ### 5. Common Mistakes
          - Lifting the elbow off the thigh during the curl
          - Using momentum or swinging the weight
          - Not achieving full range of motion at top or bottom
          - Leaning back or rocking the torso
          - Using too much weight and compromising strict form
          - Rushing through reps instead of focusing on muscle contraction

          ### 6. Safety / Modifications
          - Start with a moderate weight to ensure strict form
          - Keep your back straight to avoid lower back strain
          - Advanced variation: add a 3-5 second pause at peak contraction
          - Perform with your arm braced on an incline bench for a different angle

