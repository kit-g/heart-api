          - back
      secondary:
        groups:
          - glutes
          - hamstrings
  "Romanian Deadlift (Barbell)":
    category: Barbell
    target: Back
    i18n:
      en:
        name: "Romanian Deadlift (Barbell)"
        instructions: |
          ## Overview
          The Romanian deadlift is a hip hinge exercise that primarily targets the hamstrings, glutes, and erector spinae. It also engages the lats and traps as stabilizers, using a controlled lowering motion to emphasize the eccentric phase and build posterior chain strength.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart holding a barbell with an overhand grip
          - Position your hands just outside your legs
          - Stand upright with the barbell at hip level
          - Keep your chest up, shoulders back, and core engaged
          - Maintain a slight bend in your knees throughout

          ### 2. Movement
          1. Hinge at the hips by pushing them back and lowering the barbell
          2. Keep your back flat and the bar close to your legs
          3. Lower until you feel a stretch in your hamstrings, typically mid-shin
          4. Maintain a slight knee bend throughout the movement
          5. Drive your hips forward to return to the starting position
          6. Squeeze your glutes at the top and repeat for controlled reps

          ### 3. Breathing
          - Inhale as you lower the barbell
          - Exhale as you drive your hips forward to stand up

          ### 4. Tips
          - Focus on the hip hinge, not squatting or bending your knees
          - Keep your back flat and chest up throughout
          - Push your hips back as far as possible
          - Keep the barbell close to your legs throughout
          - Feel the stretch in your hamstrings at the bottom

          ### 5. Common Mistakes
          - Rounding the back instead of maintaining a flat spine
          - Bending the knees too much, turning it into a squat
          - Not pushing the hips back far enough
          - Lowering the bar too far beyond the point of hamstring stretch
          - Using too much weight and compromising form
          - Moving too quickly through the repetitions

          ### 6. Safety / Modifications
          - Start with light weight to master the hip hinge pattern
          - Keep a slight bend in your knees to protect your hamstrings
          - Perform with dumbbells if barbell feels unstable
          - If you experience lower back discomfort, reduce weight and ensure proper form

    muscles:
      primary:
        groups:
          - hamstrings
      secondary:
        groups:
          - back
          - glutes
  "Seated Row (Cable)":
    category: Machine
    target: Back
    i18n:
      en:
        name: "Seated Row (Cable)"
        instructions: |
          ## Overview
          The cable seated row is a horizontal pulling exercise that primarily targets the latissimus dorsi, rhomboids, and middle trapezius. It also engages the biceps and rear deltoids, using a cable machine to provide constant tension throughout the rowing motion for effective back development.

          ## How to Perform
          ### 1. Starting Position
          - Sit on the seated row machine with your feet on the footrests
          - Grip the handle with both hands, arms fully extended
          - Keep your knees slightly bent and back straight
          - Sit upright with your chest up and shoulders back
          - Engage your core throughout the movement

          ### 2. Movement
          1. Pull the handle toward your torso by driving your elbows back
          2. Keep your torso upright and avoid leaning back excessively
          3. Continue until the handle reaches your lower chest or upper abdomen
          4. Squeeze your shoulder blades together at the back of the movement
          5. Slowly extend your arms back to the starting position with control
          6. Stop just before the weight stack touches to maintain tension, then repeat

          ### 3. Breathing
          - Exhale as you pull the handle toward your torso
          - Inhale as you extend your arms back to the starting position

          ### 4. Tips
          - Keep your torso upright with minimal lean
          - Lead with your elbows, pulling them back behind you
          - Focus on squeezing your shoulder blades together
          - Maintain constant tension by not letting the weight stack rest
          - Control the weight throughout the entire range of motion

          ### 5. Common Mistakes
          - Leaning back excessively and using momentum
          - Rounding the back during the movement
          - Not achieving full range of motion
          - Allowing the shoulders to shrug up
          - Letting the weight stack rest between reps
          - Using too much weight and compromising form

          ### 6. Safety / Modifications
          - Adjust foot position to ensure knees stay slightly bent
          - Try different handle attachments (wide, narrow, neutral grip) for variety
          - Perform one arm at a time for unilateral focus

