      secondary:
        groups:
          - arms
          - core
          - hamstrings
  "Power Snatch (Barbell)":
    category: Barbell
    target: Olympic
    i18n:
      en:
        name: "Power Snatch (Barbell)"
        instructions: |
          ## Overview
          The power snatch is an Olympic lifting variation that targets the entire body with explosive power emphasis. It moves the barbell from floor to overhead in one motion, catching in a partial squat rather than full depth, making it more accessible while still building tremendous power.

          ## How to Perform
          ### 1. Starting Position
          - Stand with feet hip-width apart, barbell over mid-foot
          - Grip the bar with a wide snatch grip
          - Hinge at hips and bend knees to reach the bar
          - Keep your back flat, chest up, and shoulders over the bar
          - Arms should be straight and wide on the bar

          ### 2. Movement
          1. Drive explosively through your legs to lift the bar off the floor
          2. Keep the bar close to your body as it travels upward
          3. Extend your hips and knees powerfully at mid-thigh
          4. Pull yourself under the bar as it rises
          5. Catch the bar overhead in a partial squat with arms locked
          6. Stand up fully with the bar overhead to complete the rep

          ### 3. Breathing
          - Take a deep breath before pulling
          - Hold your breath through the pull and catch
          - Exhale after standing with the bar overhead

          ### 4. Tips
          - Catch the bar higher than a full snatch (above parallel)
          - The wide grip creates a shorter pull distance
          - This variation requires less mobility than full snatches
          - Keep the bar close during the explosive pull
          - Focus on speed and power generation

          ### 5. Common Mistakes
          - Using a grip that's too narrow
          - Pulling with arms before full hip extension
          - Pressing the bar out instead of pulling under it
          - Landing with feet too wide
          - Not achieving full lockout overhead
          - Attempting without adequate coaching

          ### 6. Safety / Modifications
          - Requires coaching from qualified Olympic lifting instructor
          - Master the muscle snatch first
          - Use bumper plates and proper lifting platform
          - More accessible than full snatches for general athletes

    muscles:
