  Hip Thrust (Barbell):
    name: Hip thrust (barre)
    instructions: |
      ## Aperçu
      Le hip thrust avec barre est un exercice d'isolation qui cible principalement les fessiers. Il sollicite aussi les ischio-jambiers et le bas du dos, l'extension horizontale des hanches avec une barre développant puissance et masse musculaire au niveau des fessiers.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous au sol, le haut du dos contre un banc
      - Faites rouler une barre par-dessus vos jambes et placez-la sur vos hanches
      - Utilisez un coussin de barre ou une serviette pour plus de confort si nécessaire
      - Posez les pieds à plat au sol, écartés à la largeur des hanches
      - Gardez les épaules sur le banc et la sangle abdominale gainée

      ### 2. Mouvement
      1. Poussez dans les talons pour élever les hanches et la barre
      2. Étendez les hanches jusqu'à ce que le corps forme une ligne droite des épaules aux genoux
      3. Gardez le menton rentré et évitez de cambrer excessivement le bas du dos
      4. Contractez fortement les fessiers en haut du mouvement
      5. Redescendez lentement les hanches de façon contrôlée
      6. Répétez pour le nombre de répétitions contrôlées souhaité

      ### 3. Respiration
      - Inspirez pendant la descente des hanches
      - Expirez en poussant les hanches vers le haut

      ### 4. Conseils
      - Concentrez-vous sur la contraction des fessiers en haut, pas sur la cambrure du dos
      - Gardez les côtes basses et la sangle abdominale gainée pour éviter l'hyperextension
      - Poussez dans les talons, pas dans les orteils
      - Gardez le menton rentré tout au long du mouvement
      - Placez la barre dans le pli des hanches pour un levier optimal

      ### 5. Erreurs fréquentes
      - Cambrer excessivement le bas du dos en haut au lieu d'utiliser les fessiers
      - Placer les pieds trop près ou trop loin du corps
      - Ne pas atteindre l'extension complète des hanches en haut
      - Cambrer la nuque pour regarder vers le haut pendant le mouvement
      - Utiliser l'élan au lieu d'une contraction contrôlée des fessiers
      - Ne pas utiliser de coussin, ce qui cause gêne et distraction

      ### 6. Sécurité et adaptations
      - Commencez par des hip thrusts au poids du corps pour maîtriser le schéma de mouvement
      - Utilisez un coussin de barre ou une serviette pour protéger vos hanches
      - Placez une bande élastique autour des genoux pour augmenter l'activation des fessiers
      - Variante avancée : réalisez des hip thrusts avec barre sur une jambe ou ajoutez une pause en haut
