    instructions: |
      ## Aperçu
      Le tirage menton à la barre est un exercice de tirage polyarticulaire qui cible principalement les deltoïdes latéraux et le trapèze supérieur. Il sollicite également les biceps, les avant-bras et le trapèze moyen ; le tirage vertical renforce les épaules et le haut du dos.

      ## Exécution
      ### 1. Position de départ
      - Debout, pieds écartés à la largeur des hanches, tenez une barre en pronation
      - Placez vos mains légèrement plus rapprochées que la largeur des épaules
      - Laissez la barre pendre à bout de bras devant vos cuisses
      - Gardez les épaules en arrière et la sangle abdominale gainée
      - Maintenez une posture droite tout au long du mouvement

      ### 2. Mouvement
      1. Tirez la barre vers le haut le long du corps en élevant les coudes
      2. Menez avec les coudes, en les gardant plus hauts que les poignets
      3. Continuez à tirer jusqu'à ce que la barre atteigne le haut de la poitrine ou le menton
      4. Gardez la barre près du corps tout au long du mouvement
      5. Marquez une brève pause en haut du mouvement
      6. Redescendez lentement la barre à la position de départ, en contrôlant

      ### 3. Respiration
      - Expirez en tirant la barre vers le haut
      - Inspirez en redescendant la barre

      ### 4. Conseils
      - Menez le mouvement avec les coudes, pas avec les mains
      - Gardez la barre près du corps tout au long du mouvement
      - Évitez de hausser les épaules en haut
      - Contrôlez la montée comme la descente
      - Utilisez une largeur de prise modérée pour protéger vos épaules

      ### 5. Erreurs fréquentes
      - Tirer trop haut et solliciter excessivement les épaules
      - Laisser les coudes descendre sous les poignets
      - Utiliser l'élan ou balancer le corps
      - Se pencher en arrière pendant le tirage
      - Utiliser une prise trop large, ce qui peut provoquer un conflit d'épaule
      - Aller trop vite et perdre le contrôle

      ### 6. Sécurité et adaptations
      - Utilisez une largeur de prise modérée pour éviter toute gêne aux épaules
      - Arrêtez-vous à hauteur d'épaules si vous ressentez une douleur à l'épaule
      - Utilisez une barre EZ si la barre droite gêne vos poignets
      - Variante avancée : réalisez l'exercice avec des haltères pour un travail indépendant de chaque bras
    validated: false
