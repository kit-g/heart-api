      Les élévations latérales à la machine sont un exercice d'isolation qui cible principalement les deltoïdes moyens. Elles sollicitent aussi le trapèze supérieur, en utilisant une machine guidée pour offrir une résistance stable et une technique constante afin d'élargir les épaules.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur la machine à élévations latérales, dos contre le dossier
      - Réglez la hauteur du siège pour aligner les axes de rotation avec vos épaules
      - Placez vos bras contre les bras rembourrés de la machine
      - Saisissez légèrement les poignées
      - Gardez les pieds à plat et la sangle abdominale gainée

      ### 2. Mouvement
      1. Élevez les bras sur les côtés en poussant contre les coussins
      2. Continuez jusqu'à ce que vos bras soient à hauteur d'épaules
      3. Gardez les coudes légèrement fléchis tout au long du mouvement
      4. Marquez une brève pause en haut
      5. Redescendez lentement les bras à la position de départ en contrôlant
      6. Arrêtez-vous juste avant que la pile de poids ne se pose pour garder la tension, puis répétez

      ### 3. Respiration
      - Expirez en élevant les bras sur les côtés
      - Inspirez en les redescendant

      ### 4. Conseils
      - Gardez le dos fermement appuyé contre le dossier
      - Concentrez-vous sur le travail des deltoïdes moyens, pas des trapèzes
      - Contrôlez aussi bien la montée que la descente
