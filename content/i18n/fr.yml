      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, un haltère dans chaque main
      - Placez les haltères devant les cuisses, paumes tournées vers le corps
      - Tenez-vous droit, poitrine haute, épaules en arrière et sangle abdominale engagée
      - Gardez une légère flexion des genoux tout au long de l'exercice

      ### 2. Mouvement
      1. Effectuez une flexion de hanches en poussant les hanches vers l'arrière et en descendant les haltères
      2. Gardez le dos plat et les haltères près des jambes
      3. Descendez jusqu'à sentir un étirement des ischio-jambiers, généralement à mi-tibia
      4. Gardez une légère flexion des genoux tout au long du mouvement
      5. Poussez les hanches vers l'avant pour revenir à la position de départ
      6. Contractez les fessiers en haut et répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant les haltères
      - Expirez en poussant les hanches vers l'avant pour vous redresser

      ### 4. Conseils
      - Concentrez-vous sur la flexion de hanches, pas sur un squat ni sur la flexion des genoux
      - Gardez le dos plat et la poitrine haute tout au long de l'exercice
      - Poussez les hanches aussi loin que possible vers l'arrière
      - Gardez les haltères près des jambes tout au long du mouvement
      - Ressentez l'étirement des ischio-jambiers en bas

      ### 5. Erreurs fréquentes
      - Arrondir le dos au lieu de maintenir une colonne plate
      - Fléchir excessivement les genoux, ce qui transforme le mouvement en squat
      - Ne pas pousser les hanches assez loin vers l'arrière
      - Descendre les haltères au-delà du point d'étirement des ischio-jambiers
      - Utiliser une charge trop lourde au détriment de la technique
      - Regarder vers le haut au lieu de garder la nuque en position neutre

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères légers pour maîtriser le schéma de flexion de hanches
      - Gardez une légère flexion des genoux pour protéger vos ischio-jambiers
      - La variante avec haltères permet une prise plus naturelle qu'avec une barre
      - En cas de gêne dans le bas du dos, réduisez la charge et vérifiez votre technique
