      - Ne pas effectuer le même nombre de répétitions de chaque côté

      ### 6. Sécurité et adaptations
      - Commencez avec une charge plus légère qu'en tirage bilatéral
      - Posez la main libre sur la machine pour plus de stabilité
      - Variante avancée : marquez une pause de 2-3 secondes en bas de chaque répétition
      - Veillez à un nombre égal de répétitions et à la même attention des deux côtés pour un développement équilibré
