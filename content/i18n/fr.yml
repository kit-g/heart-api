  Bicep Curl (Machine):
    name: Curl biceps (machine)
    instructions: |
      ## Aperçu
      Le curl biceps à la machine est un exercice d'isolation qui cible principalement le biceps brachial selon une trajectoire guidée. Il sollicite aussi le brachial antérieur et le brachio-radial, la stabilité et le soutien offerts par la machine permettant de se concentrer uniquement sur la contraction des biceps.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur la machine, le dos fermement appuyé contre le dossier
      - Réglez la hauteur du siège pour que vos coudes soient alignés avec le point de pivot de la machine
      - Placez le haut des bras sur le coussin, coudes légèrement en dessous du niveau des épaules
      - Saisissez les poignées en prise supination
      - Gardez la poitrine relevée et la sangle abdominale gainée

      ### 2. Mouvement
      1. Montez les poignées en contractant les biceps
      2. Gardez le haut des bras fermement appuyé contre le coussin tout au long du mouvement
      3. Continuez à monter jusqu'à la contraction complète des biceps
      4. Marquez une pause et contractez les biceps en haut du mouvement
      5. Redescendez lentement les poignées vers la position de départ avec contrôle
      6. Arrêtez-vous juste avant que la pile de poids ne se pose afin de garder la tension, puis répétez

      ### 3. Respiration
      - Expirez en montant les poignées
      - Inspirez en redescendant les poignées

      ### 4. Conseils
      - Gardez le haut des bras fermement appuyé contre le coussin tout au long du mouvement
      - Ne décollez pas les coudes du coussin pendant le curl
      - Concentrez-vous sur la contraction des biceps en haut de chaque répétition
      - Maintenez une tension constante en ne laissant pas la pile de poids se poser
      - Contrôlez aussi bien la phase de montée que la phase de descente

      ### 5. Erreurs fréquentes
      - Décoller les coudes du coussin pendant le curl
      - Utiliser l'élan au lieu d'une contraction musculaire contrôlée
      - Mal régler le siège, ce qui compromet l'alignement des coudes
      - Laisser la pile de poids se poser complètement entre les répétitions
      - Utiliser une charge trop lourde au détriment de la technique
      - Ne pas travailler sur une amplitude complète

      ### 6. Sécurité et adaptations
      - Réglez la hauteur du siège pour bien aligner les coudes avec le point de pivot
      - Commencez avec une charge légère pour établir la connexion esprit-muscle
      - Variante avancée : travaillez un bras à la fois pour un travail unilatéral
      - Ajoutez une pause de 2-3 secondes au pic de contraction pour plus d'intensité
