  Box Jump:
    name: Saut sur box
    instructions: |
      ## Aperçu
      Le saut sur box est un exercice pliométrique qui cible principalement les quadriceps, les fessiers et les mollets. Il sollicite aussi les ischio-jambiers et la sangle abdominale ; le saut explosif développe la puissance du bas du corps, les qualités athlétiques et la coordination.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous face à une box stable ou une plateforme, pieds écartés à largeur de hanches
      - Placez-vous à une longueur de bras de la box
      - Gardez la poitrine haute et la sangle abdominale gainée
      - Fléchissez légèrement les genoux et balancez les bras vers l'arrière
      - Préparez-vous à un saut explosif

      ### 2. Mouvement
      1. Balancez les bras vers l'avant et sautez de manière explosive sur la box
      2. Atterrissez en douceur sur la box, les deux pieds en même temps
      3. Absorbez l'impact en atterrissant en position de squat partiel
      4. Redressez-vous complètement sur la box
      5. Redescendez prudemment, un pied à la fois
      6. Replacez-vous et répétez le nombre de répétitions souhaité de façon contrôlée

      ### 3. Respiration
      - Inspirez pendant la phase de préparation
      - Expirez de manière explosive au moment du saut

      ### 4. Conseils
      - Cherchez la puissance explosive des jambes, pas seulement la hauteur
      - Atterrissez en douceur, genoux fléchis, pour absorber l'impact
      - Commencez avec une box plus basse et progressez graduellement
      - Gardez la poitrine haute et les yeux sur la box pendant tout le mouvement
      - Redescendez en marchant plutôt qu'en sautant pour ménager vos articulations

      ### 5. Erreurs fréquentes
      - Atterrir jambes tendues, ce qui augmente le risque de blessure
      - Sauter pour redescendre au lieu de redescendre en marchant
      - Utiliser une box trop haute pour votre niveau actuel
      - Ne pas se redresser complètement en haut de la box
      - Atterrir avec les pieds décalés
      - Enchaîner les sauts sans bien se replacer entre les répétitions

      ### 6. Sécurité et adaptations
      - Commencez avec une box basse et stable (12-18 pouces, soit 30-45 cm) pour maîtriser la technique
      - Assurez-vous que la box est stable et ne peut ni glisser ni basculer
      - Ne passez à des box plus hautes qu'après avoir maîtrisé les hauteurs inférieures
      - Variante avancée : ajoutez un gilet lesté ou réalisez des sauts sur box à une jambe
    validated: false
    source_digest: fc5a42d63c7f
  Box Squat (Barbell):
    name: Box squat (barre)
    instructions: |
      ## Aperçu
      Le box squat à la barre est un exercice polyarticulaire du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite aussi la sangle abdominale et le bas du dos ; la box garantit une profondeur constante et enseigne une bonne mécanique de squat tout en permettant des charges plus lourdes.

      ## Exécution
      ### 1. Position de départ
      - Placez une box ou un banc derrière vous, à la hauteur appropriée (légèrement sous la parallèle)
      - Tenez-vous debout, pieds écartés à largeur d'épaules, la barre posée sur le haut du dos
      - Saisissez la barre avec les mains un peu plus écartées que la largeur des épaules
      - Gardez la poitrine haute, la sangle abdominale gainée et le regard vers l'avant
      - Maintenez une colonne neutre pendant tout le mouvement

      ### 2. Mouvement
      1. Amorcez le squat en poussant les hanches vers l'arrière et en fléchissant les genoux
      2. Descendez jusqu'à vous asseoir vers l'arrière sur la box
      3. Marquez une brève pause sur la box en maintenant la tension
      4. Poussez dans vos talons pour vous relever de manière explosive
      5. Tendez les hanches et les genoux pour revenir à la position de départ
      6. Répétez le nombre de répétitions souhaité de façon contrôlée

      ### 3. Respiration
      - Inspirez profondément avant de descendre
      - Bloquez votre respiration pendant la descente et la pause
      - Expirez en remontant

      ### 4. Conseils
      - Asseyez-vous vers l'arrière sur la box plutôt que de vous laisser tomber
      - Maintenez la tension musculaire même assis sur la box
      - Poussez dans vos talons pour vous relever
      - Gardez la poitrine haute et la sangle abdominale gainée pendant tout le mouvement
      - La box enseigne la bonne profondeur et la mécanique de la flexion de hanches

      ### 5. Erreurs fréquentes
      - Se relâcher complètement en s'asseyant sur la box
      - Utiliser une box trop haute ou trop basse
      - Laisser les genoux rentrer vers l'intérieur
      - Se pencher trop en avant pendant la descente
      - Ne pas pousser dans les talons en se relevant
      - Rebondir sur la box au lieu de marquer une pause

      ### 6. Sécurité et adaptations
      - Commencez avec une box plus haute et abaissez-la progressivement à mesure que votre mobilité s'améliore
      - Utilisez un rack de sécurité ou faites-vous parer pour les charges lourdes
      - Réalisez d'abord le mouvement sans charge pour maîtriser le schéma moteur
      - Variante avancée : ajoutez des chaînes ou des bandes pour une résistance variable
