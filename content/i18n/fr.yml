  Inverted Row (Bodyweight):
    name: Rowing inversé (poids du corps)
    instructions: |
      ## Aperçu
      Le rowing inversé est un exercice de tirage au poids du corps qui cible principalement le grand dorsal, les rhomboïdes et la partie moyenne des trapèzes. Il sollicite aussi les biceps, les deltoïdes postérieurs et la sangle abdominale, ce qui en fait un mouvement de tirage horizontal efficace pour développer la force et l'endurance musculaire du dos.

      ## Exécution
      ### 1. Position de départ
      - Placez-vous sous une barre fixe réglée entre la hauteur de la taille et celle de la poitrine
      - Saisissez la barre en pronation, mains écartées à la largeur des épaules
      - Tendez votre corps bien droit, talons au sol et bras complètement tendus
      - Gardez le corps aligné en ligne droite de la tête aux talons
      - Gainez votre sangle abdominale et contractez les fessiers tout au long de l'exercice

      ### 2. Mouvement
      1. Tirez votre poitrine vers la barre en amenant les coudes vers l'arrière
      2. Gardez le corps droit et la sangle abdominale bien gainée pendant le tirage
      3. Continuez jusqu'à ce que votre poitrine touche ou frôle la barre
      4. Serrez les omoplates en haut du mouvement
      5. Redescendez lentement à la position de départ, en contrôlant le mouvement
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en tirant la poitrine vers la barre
      - Inspirez en redescendant

      ### 4. Conseils
      - Gardez le corps en ligne droite tout au long du mouvement
      - Menez le mouvement avec la poitrine et gardez les coudes près du corps
      - Concentrez-vous sur le serrage des omoplates
      - Évitez de laisser les hanches s'affaisser ou remonter en pique
      - Contrôlez aussi bien la montée que la descente

      ### 5. Erreurs fréquentes
      - Laisser les hanches s'affaisser ou remonter en pique
      - Ne pas atteindre l'amplitude complète en haut du mouvement
      - Utiliser l'élan plutôt qu'un mouvement contrôlé
      - Laisser les coudes s'écarter excessivement
      - Ne pas maintenir le corps en ligne droite
      - Enchaîner les répétitions trop rapidement

      ### 6. Sécurité et adaptations
      - Remontez la barre pour faciliter l'exercice, idéal pour les débutants
      - Abaissez la barre ou surélevez les pieds pour augmenter la difficulté
      - Exécutez le mouvement en supination pour un accent musculaire différent
      - Variante avancée : marquez une pause de 2 à 3 secondes en haut de chaque répétition
