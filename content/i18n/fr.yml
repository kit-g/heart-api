      - Gardez la barre près des jambes tout au long du mouvement
      - Concentrez-vous sur la poussée dans les talons
      - Gardez le buste aussi droit que possible
      - Commencez avec une charge légère pour maîtriser cette position de barre particulière

      ### 5. Erreurs fréquentes
      - Arrondir le dos pendant la montée
      - Laisser la barre s'éloigner des jambes
      - Se pencher trop en avant
      - Ne pas atteindre l'extension complète des hanches en haut
      - Utiliser une charge trop lourde avant de maîtriser la technique
      - Laisser les genoux rentrer vers l'intérieur

      ### 6. Sécurité et adaptations
      - Commencez avec une charge très légère ou la barre seule
      - Utilisez des sangles de tirage si la force de prise vous limite
      - Cette variante est moins courante que le hack squat à la machine
      - En cas de gêne, envisagez plutôt la machine à hack squat
