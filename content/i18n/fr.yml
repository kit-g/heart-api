      1. Descendez la barre en fléchissant les coudes, en l'amenant vers le front
      2. Gardez les bras immobiles et légèrement inclinés vers l'arrière
      3. Descendez jusqu'à ce que vos avant-bras dépassent légèrement la parallèle au sol
      4. Marquez une brève pause en position d'étirement, en bas
      5. Tendez les coudes pour ramener la barre à la position de départ
      6. Répétez le mouvement de façon contrôlée pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Inspirez en descendant la barre vers le front
      - Expirez en repoussant la barre vers le haut

      ### 4. Conseils
      - Gardez les bras immobiles pendant tout le mouvement
      - Descendez la barre avec contrôle pour éviter de heurter votre front
      - Veillez à maintenir la tension sur les triceps du début à la fin
      - Gardez les coudes relativement serrés, sans les écarter
      - Inclinez légèrement les bras vers l'arrière pour maximiser le travail des triceps

      ### 5. Erreurs fréquentes
      - Laisser les coudes s'écarter excessivement
      - Bouger les bras au lieu de les garder immobiles
