  Hip Abductor (Machine):
    name: Abduction des hanches (machine)
    instructions: |
      ## Aperçu
      L'abduction des hanches à la machine est un exercice d'isolation qui cible principalement le moyen et le petit fessier. Il sollicite aussi le tenseur du fascia lata, la trajectoire guidée renforçant les muscles externes de la hanche et améliorant la stabilité des hanches.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur la machine, le dos fermement appuyé contre le dossier
      - Placez l'extérieur des cuisses contre les leviers rembourrés
      - Réglez la machine pour que vos genoux soient alignés avec l'axe de rotation
      - Saisissez les poignées pour la stabilité
      - Gardez les pieds à plat et la sangle abdominale gainée

      ### 2. Mouvement
      1. Écartez les jambes en contractant les muscles externes des hanches
      2. Déplacez-vous contre la résistance de façon contrôlée
      3. Continuez jusqu'à ce que vos jambes soient écartées autant que confortablement possible
      4. Marquez une pause et contractez l'extérieur des fessiers en abduction complète
      5. Ramenez lentement les jambes à la position de départ de façon contrôlée
      6. Arrêtez-vous juste avant que la charge ne touche la pile pour maintenir la tension, puis recommencez

      ### 3. Respiration
      - Expirez en écartant les jambes
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur les muscles externes des hanches, pas sur l'élan
      - Gardez le dos fermement plaqué contre le dossier
      - Évitez de faire pivoter le buste pendant le mouvement
      - Contrôlez la phase d'abduction comme la phase de retour
      - Maintenez une tension constante en ne laissant pas la charge se reposer

      ### 5. Erreurs fréquentes
      - Utiliser l'élan ou balancer les jambes
      - Décoller les fessiers du siège
      - Faire pivoter le buste au lieu de le garder stable
      - Ne pas atteindre l'amplitude complète
      - Laisser la charge se reposer entre les répétitions
      - Enchaîner les répétitions trop rapidement

      ### 6. Sécurité et adaptations
      - Ajustez la position des coussins pour un bon alignement des genoux
      - Commencez avec une charge légère pour établir une bonne technique
      - Privilégiez un mouvement contrôlé plutôt qu'une charge lourde
      - Variante avancée : marquez une pause de 2-3 secondes en abduction complète
