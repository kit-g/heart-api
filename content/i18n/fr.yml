  Chest Dip:
    name: Dips pectoraux
    instructions: |
      ## Aperçu
      Les dips pectoraux sont un exercice de poussée au poids du corps qui cible principalement la partie inférieure du grand pectoral. Ils sollicitent également les triceps et les deltoïdes antérieurs ; l'inclinaison du buste vers l'avant déplace l'effort des triceps vers les pectoraux, pour un développement efficace du bas des pectoraux.

      ## Exécution
      ### 1. Position de départ
      - Placez-vous sur des barres parallèles, bras complètement tendus
      - Saisissez fermement les barres, mains légèrement plus écartées que la largeur des épaules si possible
      - Inclinez le buste vers l'avant à environ 30-45 degrés
      - Croisez les chevilles derrière vous ou gardez les jambes tendues
      - Gainez votre sangle abdominale et gardez les épaules abaissées

      ### 2. Mouvement
      1. Descendez en pliant les coudes jusqu'à environ 90 degrés
      2. Gardez les coudes légèrement écartés et le buste incliné vers l'avant
      3. Continuez à descendre jusqu'à sentir un étirement dans les pectoraux
      4. Marquez une brève pause en bas du mouvement
      5. Poussez dans les paumes pour tendre les bras et revenir à la position de départ
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant
      - Expirez en remontant vers la position de départ

      ### 4. Conseils
      - Restez incliné vers l'avant pour garder l'accent sur les pectoraux
      - Gardez les coudes plus écartés que pour des dips pour triceps
      - Concentrez-vous sur l'étirement des pectoraux en bas
      - Évitez de descendre trop bas et de solliciter excessivement les épaules
      - Gardez le contrôle sur toute l'amplitude du mouvement

      ### 5. Erreurs fréquentes
      - Rester trop redressé, ce qui déplace l'effort vers les triceps
      - Ne pas s'incliner assez vers l'avant
      - Descendre trop bas et solliciter excessivement les épaules
      - Utiliser l'élan ou rebondir en bas
      - Ne pas tendre complètement les coudes en haut
      - Laisser les épaules remonter

      ### 6. Sécurité et adaptations
      - Utilisez une machine à dips assistée ou une bande élastique en soutien
      - Réduisez l'amplitude en cas de gêne aux épaules
      - Variante avancée : ajoutez du lest avec une ceinture de lest ou un gilet lesté
      - Progressez graduellement pour éviter de surmener les épaules
