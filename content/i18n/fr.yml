  Jumping Jack:
    name: Jumping jacks
    instructions: |
      ## Aperçu
      Le jumping jack est un exercice cardiovasculaire de base qui cible principalement les jambes, la sangle abdominale et les épaules. Il consiste à sauter en écartant les jambes tout en levant les bras, développant l'endurance cardiovasculaire et la coordination, et constitue un excellent mouvement d'échauffement.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds joints et bras le long du corps
      - Gardez la poitrine haute, la sangle abdominale engagée et le regard vers l'avant
      - Préparez-vous à sauter en bougeant bras et jambes simultanément

      ### 2. Mouvement
      1. Sautez en écartant les pieds plus larges que les épaules
      2. Levez simultanément les bras sur les côtés puis au-dessus de la tête
      3. Sautez de nouveau pour rejoindre les pieds en abaissant les bras
      4. Continuez d'alterner dans un mouvement fluide et rythmé
      5. Maintenez une bonne posture tout au long de l'exercice
      6. Répétez pour le nombre de répétitions ou la durée souhaités

      ### 3. Respiration
      - Respirez de façon régulière et rythmée tout au long de l'exercice
      - Inspirez et expirez à chaque cycle de saut

      ### 4. Conseils
      - Réceptionnez-vous en douceur sur la plante des pieds
      - Maintenez un rythme régulier et contrôlé
      - C'est un excellent exercice d'échauffement
      - Gardez la sangle abdominale engagée en permanence
      - Bras et jambes doivent bouger de façon coordonnée

      ### 5. Erreurs fréquentes
      - Se réceptionner trop lourdement sur les talons
      - Ne pas lever complètement les bras au-dessus de la tête
      - Aller trop vite et perdre la coordination
      - Se réceptionner genoux verrouillés
      - Mauvaise posture, épaules arrondies
      - Retenir sa respiration

      ### 6. Sécurité et adaptations
      - Faites des pas latéraux au lieu de sauter pour une version à faible impact
      - Réduisez l'amplitude si nécessaire
      - Augmentez la vitesse pour plus d'intensité
      - Variante avancée : ajoutez un squat ou une extension supplémentaire
