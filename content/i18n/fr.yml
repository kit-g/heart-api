  Cable Kickback:
    name: Extension du triceps vers l'arrière (poulie)
    instructions: |
      ## Aperçu
      L'extension du triceps vers l'arrière à la poulie est un exercice d'isolation qui cible principalement les triceps, en particulier le chef long. Il sollicite aussi les épaules et la sangle abdominale comme stabilisateurs, et offre une tension constante tout au long du mouvement pour un développement efficace des triceps.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous face à une poulie basse équipée d'une poignée simple
      - Saisissez la poignée d'une main et reculez pour mettre le câble sous tension
      - Penchez le buste vers l'avant à environ 45 degrés en fléchissant les hanches
      - Gardez le coude du bras de travail fléchi à 90 degrés et serré contre le flanc
      - Posez la main libre sur la cuisse ou sur la machine en appui
      - Gainez votre sangle abdominale pour rester stable

      ### 2. Mouvement
      1. Tendez le bras vers l'arrière en dépliant le coude
      2. Gardez le haut du bras immobile et parallèle au sol
      3. Continuez jusqu'à l'extension complète du bras derrière vous
      4. Marquez une pause et contractez le triceps en extension complète
      5. Revenez lentement à la position de départ avec contrôle
      6. Effectuez toutes les répétitions d'un côté, puis répétez de l'autre côté

      ### 3. Respiration
      - Expirez en tendant le bras vers l'arrière
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez le haut du bras parfaitement immobile tout au long du mouvement
      - Isolez le triceps en ne bougeant qu'au niveau du coude
      - Maintenez un buste stable sans balancement d'avant en arrière
      - Contractez fortement le triceps en extension complète
      - Gardez la tension sur le câble pendant tout le mouvement

      ### 5. Erreurs fréquentes
      - Laisser le haut du bras bouger pendant l'extension
      - Balancer le bras ou utiliser l'élan
      - Ne pas atteindre l'extension complète du coude à l'arrière
      - Balancer le buste d'avant en arrière
      - Utiliser une charge trop lourde au détriment de la technique
      - Laisser le câble se détendre à un moment du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser la technique d'isolation
      - Gardez la sangle abdominale gainée pour protéger le bas du dos en position penchée
      - Variante avancée : marquez une pause de 2-3 secondes en extension complète
      - Utilisez une corde à la place de la poignée pour une prise différente
