  Decline Bench Press (Barbell):
    name: Développé décliné (barre)
    instructions: |
      ## Aperçu
      Le développé décliné à la barre est un exercice de poussée polyarticulaire qui cible principalement la partie inférieure du grand pectoral. Il sollicite aussi les deltoïdes antérieurs et les triceps ; la position déclinée du banc met l'accent sur le bas des pectoraux, avec des charges généralement plus lourdes qu'au développé couché à plat.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous sur un banc décliné, les pieds calés sous les coussins
      - Placez-vous de façon que vos yeux soient directement sous la barre
      - Saisissez la barre avec les mains un peu plus écartées que la largeur des épaules
      - Sortez la barre des supports et tenez-la bras complètement tendus au-dessus du bas de votre poitrine
      - Gardez les omoplates serrées et plaquées contre le banc

      ### 2. Mouvement
      1. Descendez la barre lentement vers le bas de votre poitrine
      2. Gardez les coudes à environ 45 degrés du corps
      3. Touchez légèrement la poitrine avec la barre
      4. Marquez une brève pause en bas
      5. Repoussez la barre vers le haut en tendant les bras
      6. Tendez complètement les coudes en haut et répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant la barre vers la poitrine
      - Expirez en repoussant la barre vers le haut

      ### 4. Conseils
      - Gardez les omoplates serrées pendant tout le mouvement
      - Concentrez-vous sur la contraction du bas des pectoraux en haut du mouvement
      - Contrôlez la descente et évitez de faire rebondir la barre
      - Gardez les pieds bien calés pour rester stable
      - L'angle décliné permet généralement de soulever plus lourd

      ### 5. Erreurs fréquentes
      - Faire rebondir la barre sur la poitrine
      - Laisser les coudes s'écarter excessivement
      - Ne pas caler correctement les pieds, ce qui crée de l'instabilité
      - Ne pas travailler sur une amplitude complète
      - Utiliser une charge trop lourde au détriment de la technique
      - Relâcher le serrage des omoplates

      ### 6. Sécurité et adaptations
      - Faites-vous toujours parer par un partenaire pour les charges lourdes
      - Assurez-vous que vos pieds sont bien ancrés avant de sortir la barre des supports
      - Commencez plus léger qu'à votre développé couché à plat pour vous adapter
      - En cas de gêne à l'épaule, ajustez la largeur de votre prise
