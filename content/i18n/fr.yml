      - Charger trop lourd au détriment de la technique
      - Perdre le serrage des omoplates

      ### 6. Sécurité et adaptations
      - Faites-vous toujours assurer par un pareur pour les charges lourdes
      - Commencez avec une charge plus légère que votre développé couché habituel
      - Élargissez progressivement la prise pour trouver votre position optimale
      - En cas de gêne aux épaules, resserrez légèrement votre prise
