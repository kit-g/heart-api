  Bench Press (Dumbbell):
    name: Développé couché (haltères)
    instructions: |
      ## Aperçu
      Le développé couché avec haltères est un exercice de développé polyarticulaire qui cible principalement le grand pectoral. Il sollicite également les deltoïdes antérieurs et les triceps, tout en permettant un travail indépendant de chaque bras et une amplitude supérieure à la variante à la barre.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur un banc, pieds bien ancrés au sol
      - Tenez un haltère dans chaque main à hauteur de poitrine
      - Placez les haltères en prise neutre ou en pronation
      - Gardez les omoplates serrées et plaquées contre le banc
      - Tendez complètement les bras, haltères au-dessus de la poitrine

      ### 2. Mouvement
      1. Descendez lentement les deux haltères vers la poitrine en pliant les coudes
      2. Gardez les coudes à environ 45 degrés du corps
      3. Descendez jusqu'à ce que les haltères soient à côté de votre poitrine
      4. Marquez une brève pause en bas
      5. Repoussez les haltères vers le haut en tendant les bras
      6. Rapprochez les haltères en haut et répétez des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant les haltères vers la poitrine
      - Expirez en repoussant les haltères

      ### 4. Conseils
      - Gardez les omoplates serrées tout au long du mouvement
      - Conservez une cambrure naturelle du bas du dos
      - Contrôlez la descente pour maximiser l'étirement des pectoraux
      - Laissez les haltères descendre plus bas que ne le permettrait une barre
      - Gardez les poignets droits et stables

      ### 5. Erreurs fréquentes
      - Faire rebondir les haltères sur la poitrine
      - Laisser les coudes s'écarter excessivement
      - Décoller les fessiers du banc pendant la poussée
      - Ne pas travailler sur une amplitude complète
      - Entrechoquer les haltères en haut
      - Perdre le serrage des omoplates

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères légers pour maîtriser l'équilibre et le contrôle
      - Faites-vous assurer par un pareur pour les charges lourdes
      - Réalisez l'exercice sur un banc incliné ou décliné pour varier
      - Variante avancée : marquez une pause de 2 à 3 secondes en bas
