  Hack Squat:
    name: Hack squat
    instructions: |
      ## Aperçu
      Le hack squat est un exercice polyarticulaire du bas du corps qui cible principalement les quadriceps. Il sollicite aussi les fessiers et les ischio-jambiers, la machine (ou la barre) permettant une charge lourde tout en réduisant le stress sur le bas du dos par rapport au squat traditionnel.

      ## Exécution
      ### 1. Position de départ
      - Installez-vous sur la machine à hack squat, le dos contre le dossier
      - Placez les pieds sur la plateforme à la largeur des épaules, pointes légèrement vers l'extérieur
      - Positionnez les épaules sous les coussins d'épaules
      - Libérez les poignées de sécurité et tenez les poignées latérales
      - Gardez la poitrine haute et la sangle abdominale gainée

      ### 2. Mouvement
      1. Descendez en fléchissant les genoux et les hanches
      2. Gardez le dos plaqué contre le dossier tout au long du mouvement
      3. Descendez jusqu'à ce que les cuisses soient au moins parallèles à la plateforme
      4. Marquez une brève pause en bas
      5. Poussez dans les talons pour revenir à la position de départ
      6. Étendez complètement les jambes en haut, puis répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Inspirez pendant la descente
      - Expirez pendant la remontée vers la position de départ

      ### 4. Conseils
      - Gardez le dos fermement plaqué contre le dossier
      - La trajectoire inclinée met l'accent sur le développement des quadriceps
      - Poussez avec l'ensemble du pied, pas seulement les orteils
      - Gardez les genoux alignés avec les pointes de pieds
      - Maintenez une tension constante tout au long du mouvement

      ### 5. Erreurs fréquentes
      - Décoller le dos du dossier pendant le mouvement
      - Ne pas atteindre une profondeur suffisante
      - Laisser les genoux rentrer vers l'intérieur
      - Verrouiller complètement les genoux en haut
      - Utiliser une charge trop lourde au détriment de la technique
      - Placer les pieds trop bas sur la plateforme, ce qui augmente le stress sur les genoux

      ### 6. Sécurité et adaptations
      - Ajustez la position des pieds sur la plateforme pour cibler différentes zones des quadriceps
      - Gardez les genoux derrière les pointes de pieds ou alignés avec elles pour réduire le stress sur les genoux
      - Commencez avec une charge légère pour maîtriser le schéma de mouvement
      - Variante avancée : réalisez des hack squats sur une jambe ou ajoutez une pause en bas
