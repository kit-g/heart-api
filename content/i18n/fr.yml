    instructions: |
      ## Aperçu
      Les écartés avec bande sont un exercice d'isolation à résistance élastique qui cible principalement le grand pectoral. Ils sollicitent également les deltoïdes antérieurs ; la résistance progressive de la bande fournit une tension croissante tout au long du mouvement d'écarté.

      ## Exécution
      ### 1. Position de départ
      - Ancrez une bande élastique à hauteur de poitrine derrière vous
      - Tenez une extrémité de la bande dans chaque main
      - Avancez pour mettre la bande en tension, bras étendus sur les côtés
      - Tenez-vous en position décalée pour plus de stabilité
      - Gardez une légère flexion des coudes tout au long du mouvement

      ### 2. Mouvement
      1. Rapprochez les deux mains devant votre poitrine
      2. Gardez les coudes légèrement fléchis, comme pour enlacer quelque chose
      3. Continuez jusqu'à ce que vos mains se rejoignent à hauteur de poitrine
      4. Contractez fort les pectoraux au pic de la contraction
      5. Ramenez lentement les bras à la position de départ, en contrôlant
      6. Arrêtez-vous avant de perdre la tension de la bande, puis répétez

      ### 3. Respiration
      - Expirez en rapprochant les mains
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez une flexion des coudes constante tout au long du mouvement
      - Concentrez-vous sur la contraction des pectoraux, sans tirer avec les bras
      - Maintenez une tension constante en contrôlant les deux phases
      - Gardez la sangle abdominale gainée et le corps stable
      - Ajustez votre distance par rapport au point d'ancrage pour modifier la résistance

      ### 5. Erreurs fréquentes
      - Tendre complètement les bras pendant le mouvement
      - Utiliser l'élan ou balancer le corps
      - Ne pas maintenir une tension constante sur la bande
