  Push Up:
    name: Pompes
    instructions: |
      ## Aperçu
      Les pompes sont un exercice de poussée au poids du corps qui cible principalement le grand pectoral. Elles sollicitent aussi les deltoïdes antérieurs, les triceps et la sangle abdominale, ce qui en fait l'un des exercices du haut du corps les plus efficaces et polyvalents pour développer force et endurance.

      ## Exécution
      ### 1. Position de départ
      - Placez-vous en planche haute, mains un peu plus écartées que la largeur des épaules
      - Alignez vos mains à l'aplomb de vos épaules
      - Gardez le corps aligné de la tête aux talons
      - Gainez la sangle abdominale et contractez les fessiers pendant tout le mouvement
      - Gardez les pieds joints ou écartés à largeur de hanches

      ### 2. Mouvement
      1. Descendez votre corps en fléchissant les coudes
      2. Gardez les coudes à environ 45 degrés du corps
      3. Continuez à descendre jusqu'à ce que votre poitrine frôle le sol
      4. Marquez une brève pause en bas
      5. Poussez dans vos paumes pour tendre les bras et revenir à la position de départ
      6. Répétez le nombre de répétitions souhaité de façon contrôlée

      ### 3. Respiration
      - Inspirez en descendant
      - Expirez en repoussant vers la position de départ

      ### 4. Conseils
      - Maintenez le corps aligné de la tête aux talons pendant tout le mouvement
      - Gardez la sangle abdominale et les fessiers contractés pour éviter tout affaissement
      - Concentrez-vous sur un mouvement contrôlé dans les deux sens
      - Gardez la nuque neutre, le regard légèrement devant vos mains
      - Travaillez sur une amplitude complète, de la poitrine près du sol jusqu'aux bras tendus

      ### 5. Erreurs fréquentes
      - Laisser les hanches s'affaisser ou monter en pique
      - Écarter excessivement les coudes
      - Ne pas travailler sur une amplitude complète
      - Laisser tomber la tête ou regarder vers le bas
      - Utiliser l'élan plutôt qu'un mouvement contrôlé
      - Retenir sa respiration pendant le mouvement

      ### 6. Sécurité et adaptations
      - Commencez par les pompes sur les genoux si les pompes classiques sont trop difficiles
      - Surélevez vos mains sur un banc ou contre un mur pour une variante plus facile
      - Variante avancée : ajoutez du lest avec un gilet ou une bande élastique passée dans votre dos
      - Essayez différentes positions de mains (larges, serrées, en diamant) pour varier
