  Front Raise (Band):
    name: Élévations frontales (bande)
    instructions: |
      ## Aperçu
      Les élévations frontales avec bande sont un exercice d'isolation qui cible principalement les deltoïdes antérieurs. Elles sollicitent aussi le haut des pectoraux, en utilisant la résistance progressive de la bande pour développer la force et le dessin de l'avant des épaules.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, en marchant sur le centre d'une bande élastique
      - Saisissez les deux extrémités de la bande, mains devant les cuisses
      - Gardez les bras tendus avec une légère flexion des coudes
      - Tenez-vous droit, poitrine haute et sangle abdominale gainée
      - Maintenez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Élevez les deux bras vers l'avant et vers le haut devant votre corps
      2. Gardez les bras tendus avec seulement une légère flexion des coudes
      3. Continuez jusqu'à ce que vos bras soient à hauteur d'épaules, ou légèrement au-dessus
      4. Marquez une brève pause en haut
      5. Redescendez lentement les bras à la position de départ en contrôlant
      6. Répétez le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en élevant les bras
      - Inspirez en les redescendant

      ### 4. Conseils
      - La bande offre une résistance croissante à mesure que vous montez
      - Gardez le buste stable et évitez d'utiliser de l'élan
      - Concentrez-vous sur la contraction des deltoïdes antérieurs en haut
      - Maintenez une tension constante en contrôlant les deux phases
      - Ajustez la position des pieds sur la bande pour moduler la résistance

      ### 5. Erreurs fréquentes
      - Utiliser de l'élan ou balancer les bras
      - Se pencher en arrière pendant l'élévation
      - Fléchir excessivement les coudes
      - Élever les bras trop haut au-dessus des épaules
      - Ne pas maintenir une tension constante sur la bande
      - Enchaîner les répétitions trop rapidement

      ### 6. Sécurité et adaptations
      - Commencez avec une bande plus légère pour maîtriser le mouvement
      - Ajustez la position des pieds sur la bande pour une résistance confortable
      - Travaillez un bras à la fois pour un travail unilatéral
      - En cas de gêne à l'épaule, réduisez l'amplitude ou la résistance
