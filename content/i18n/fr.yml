      - Décrochez la barre en la faisant pivoter et tenez-la bras tendus
      - Gardez les omoplates serrées et les pieds à plat au sol

      ### 2. Mouvement
      1. Descendez lentement la barre vers le milieu ou le bas de la poitrine
      2. Gardez les coudes à environ 45 degrés du corps
      3. Effleurez la poitrine avec la barre
      4. Marquez une brève pause en bas
      5. Repoussez la barre vers le haut en tendant les bras
      6. Tendez complètement les coudes en haut et répétez des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant la barre vers la poitrine
      - Expirez en repoussant la barre

      ### 4. Conseils
      - Placez le banc de façon que la trajectoire de la barre corresponde à votre poussée naturelle
      - Gardez les omoplates serrées tout au long du mouvement
      - Profitez de la trajectoire fixe pour des répétitions contrôlées
      - Conservez une cambrure naturelle du bas du dos
      - Gardez les pieds à plat et poussez dedans pour plus de stabilité

