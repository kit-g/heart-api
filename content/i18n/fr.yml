    instructions: |
      ## Aperçu
      Le squat à la machine est un exercice polyarticulaire du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il utilise une trajectoire guidée pour offrir stabilité et résistance constante tout en réduisant les contraintes sur le bas du dos par rapport aux squats avec charges libres.

      ## Exécution
      ### 1. Position de départ
      - Installez-vous dans la machine à squat selon sa conception
      - Placez vos épaules sous les coussinets ou saisissez les poignées
      - Placez vos pieds sur la plateforme, écartés à la largeur des épaules
      - Gardez la poitrine haute, la sangle abdominale gainée et le regard vers l'avant
      - Maintenez une bonne posture tout au long du mouvement

      ### 2. Mouvement
      1. Amorcez le squat en fléchissant simultanément les genoux et les hanches
      2. Gardez la poitrine haute et le poids sur les talons
      3. Descendez jusqu'à ce que les cuisses soient au moins parallèles à la plateforme
      4. Marquez une brève pause en bas
      5. Poussez sur vos talons pour revenir à la position de départ
      6. Étendez complètement les jambes, puis répétez pour des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant en squat
      - Expirez en remontant vers la position de départ

      ### 4. Conseils
      - Gardez le dos fermement plaqué contre le dossier, le cas échéant
      - La trajectoire guidée aide à maintenir une bonne technique
      - Poussez avec l'ensemble du pied, pas seulement les orteils
      - Gardez les genoux alignés avec les orteils
      - Maintenez une tension constante tout au long du mouvement

      ### 5. Erreurs fréquentes
      - Décoller le dos du dossier pendant le mouvement
      - Ne pas descendre suffisamment bas
      - Laisser les genoux rentrer vers l'intérieur
      - Verrouiller complètement les genoux en haut
      - Utiliser une charge trop lourde au détriment de la technique
      - Placer les pieds trop bas sur la plateforme, ce qui augmente les contraintes sur les genoux

      ### 6. Sécurité et adaptations
      - Ajustez la position des pieds sur la plateforme pour cibler différents groupes musculaires
      - Commencez avec une charge légère pour maîtriser le schéma de mouvement de la machine
      - La trajectoire guidée est utile aux débutants qui apprennent la mécanique du squat
      - Variante avancée : effectuez des squats à la machine sur une jambe ou ajoutez une pause en bas
