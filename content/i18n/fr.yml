  Good Morning (Barbell):
    name: Good morning (barre)
    instructions: |
      ## Aperçu
      Le good morning à la barre est un exercice de flexion de hanches qui cible principalement les érecteurs du rachis, les fessiers et les ischio-jambiers. Il sollicite aussi la sangle abdominale et le haut du dos comme stabilisateurs, ce qui en fait un exercice efficace pour renforcer la chaîne postérieure et améliorer la mécanique de la flexion de hanches.

      ## Exécution
      ### 1. Position de départ
      - Placez une barre sur le haut de votre dos, comme pour un squat
      - Tenez-vous debout, pieds écartés de la largeur des hanches à celle des épaules
      - Saisissez la barre, mains légèrement plus écartées que la largeur des épaules
      - Gardez la poitrine sortie, la sangle abdominale gainée et les genoux légèrement fléchis
      - Maintenez une colonne neutre tout au long de l'exercice

      ### 2. Mouvement
      1. Penchez-vous vers l'avant en poussant les hanches vers l'arrière
      2. Gardez le dos plat et la sangle abdominale bien gainée pendant la descente du buste
      3. Continuez jusqu'à ce que le buste soit presque parallèle au sol ou que vous sentiez un étirement dans les ischio-jambiers
      4. Maintenez une légère flexion des genoux tout au long du mouvement
      5. Poussez les hanches vers l'avant pour revenir à la position de départ
      6. Contractez les fessiers en haut et répétez pour des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en vous penchant vers l'avant
      - Expirez en poussant les hanches vers l'avant pour vous redresser

      ### 4. Conseils
      - Concentrez-vous sur la flexion de hanches, pas sur un squat
      - Gardez le dos plat et la poitrine sortie tout au long du mouvement
      - Poussez les hanches le plus loin possible vers l'arrière
      - Gardez la barre bien calée sur le haut du dos
      - Contrôlez la descente et évitez de descendre brusquement

      ### 5. Erreurs fréquentes
      - Arrondir le dos au lieu de maintenir une colonne plate
      - Fléchir excessivement les genoux et transformer le mouvement en squat
      - Ne pas pousser les hanches assez loin vers l'arrière
      - Utiliser une charge trop lourde au détriment de la technique
      - Bouger trop vite et perdre le contrôle
      - Hyperétendre le dos en haut du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère, voire la barre seule, pour maîtriser la flexion de hanches
      - Gardez les genoux légèrement fléchis pour protéger vos ischio-jambiers
      - Exécutez le mouvement avec des haltères le long du corps si la barre semble instable
      - En cas de gêne dans le bas du dos, réduisez la charge et vérifiez votre technique
