  Cable Twist:
    name: Rotation du buste à la poulie
    instructions: |
      ## Aperçu
      La rotation du buste à la poulie est un exercice de rotation qui cible principalement les obliques et le transverse. Elle sollicite également le grand droit de l'abdomen et les stabilisateurs des hanches tout au long du mouvement de rotation, ce qui la rend efficace pour développer la force en rotation et la stabilité de la sangle abdominale.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous de profil par rapport à la poulie, réglée à hauteur de poitrine
      - Saisissez la poignée à deux mains et éloignez-vous de la machine pour créer de la tension
      - Placez les pieds écartés de la largeur des épaules, genoux légèrement fléchis
      - Tendez les bras devant la poitrine, en gardant les coudes légèrement fléchis
      - Engagez la sangle abdominale et gardez le buste droit

      ### 2. Mouvement
      1. Tournez le buste en vous éloignant de la poulie, en pivotant à partir de la sangle abdominale
      2. Gardez les bras tendus et bougez d'un seul bloc avec le buste
      3. Tournez aussi loin que le confort le permet tout en gardant le contrôle et une posture droite
      4. Marquez une brève pause en fin de rotation
      5. Revenez lentement à la position de départ de manière contrôlée, en résistant à la traction du câble
      6. Effectuez toutes les répétitions d'un côté, puis répétez de l'autre côté

      ### 3. Respiration
      - Expirez pendant la rotation qui vous éloigne de la machine
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Initiez le mouvement à partir de la sangle abdominale, pas des bras ni des épaules
      - Gardez les hanches face à l'avant pendant tout le mouvement
      - Maintenez le bas du corps stable pendant que le haut du corps pivote
      - Bougez lentement et avec contrôle pour maximiser l'engagement de la sangle abdominale
      - Gardez la tension sur le câble sur toute l'amplitude du mouvement

      ### 5. Erreurs fréquentes
      - Utiliser l'élan ou balancer la charge au lieu d'une rotation contrôlée
      - Laisser les hanches pivoter en même temps que le buste
      - Fléchir ou tendre les bras pendant le mouvement
      - Se pencher en arrière ou en avant au lieu de garder une posture droite
      - Choisir une charge trop lourde qui compromet la technique
      - Tourner trop vite, sans contrôle suffisant

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser le schéma de rotation
      - Les débutants peuvent effectuer des rotations à mi-amplitude jusqu'à acquérir le contrôle
      - Variante avancée : marquez une pause de 2 à 3 secondes au pic de rotation pour plus d'intensité
      - En cas de gêne dans le bas du dos, réduisez l'amplitude ou la charge
