  Bench Press - Wide Grip (Barbell):
    name: Développé couché prise large (barre)
    instructions: |
      ## Aperçu
      Le développé couché prise large à la barre est un exercice de développé polyarticulaire qui cible principalement la partie externe du grand pectoral. Il sollicite également les deltoïdes antérieurs et les triceps ; l'écartement plus large des mains met l'accent sur la largeur des pectoraux et réduit la participation des triceps.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur un banc, pieds bien ancrés au sol
      - Placez-vous de façon que vos yeux soient directement sous la barre
      - Saisissez la barre, mains nettement plus écartées que la largeur des épaules
      - Décrochez la barre et tenez-la bras complètement tendus au-dessus de la poitrine
      - Gardez les omoplates serrées et plaquées contre le banc

      ### 2. Mouvement
      1. Descendez lentement la barre vers le milieu ou le haut de la poitrine
      2. Gardez les coudes plus écartés que sur un développé classique
      3. Effleurez la poitrine avec la barre
      4. Marquez une brève pause en bas
      5. Repoussez la barre vers le haut en tendant les bras
      6. Tendez complètement les coudes en haut et répétez des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant la barre vers la poitrine
      - Expirez en repoussant la barre

      ### 4. Conseils
      - La prise plus large réduit l'amplitude mais augmente l'étirement des pectoraux
      - Gardez les omoplates serrées tout au long du mouvement
      - Concentrez-vous sur la contraction des pectoraux en haut
      - Conservez une cambrure naturelle du bas du dos
      - Gardez les poignets droits malgré la prise plus large

      ### 5. Erreurs fréquentes
      - Utiliser une prise trop large qui sollicite excessivement les épaules
