  Side Bend (Cable):
    name: Flexion latérale (poulie)
    instructions: |
      ## Aperçu
      La flexion latérale à la poulie est un exercice de résistance pour la sangle abdominale qui cible principalement les obliques et le transverse de l'abdomen. Il sollicite aussi le carré des lombes et les érecteurs du rachis comme stabilisateurs, et offre une tension constante tout au long du mouvement pour développer la force latérale du tronc.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous de profil par rapport à une poulie basse, pieds écartés à la largeur des épaules
      - Saisissez la poignée avec la main la plus proche de la machine
      - Éloignez-vous légèrement pour mettre le câble sous tension
      - Placez la main libre derrière la tête ou sur la hanche
      - Tenez-vous droit, sangle abdominale gainée et épaules à la même hauteur

      ### 2. Mouvement
      1. Penchez-vous lentement du côté opposé à la poulie en contractant les obliques du côté opposé
      2. Gardez les hanches stables et face à l'avant tout au long du mouvement
      3. Fléchissez latéralement aussi loin que le confort le permet, en gardant le contrôle
      4. Marquez une courte pause en fin de mouvement
      5. Revenez à la position droite de départ avec contrôle, en résistant à la traction du câble
      6. Effectuez toutes les répétitions d'un côté, puis répétez de l'autre côté

      ### 3. Respiration
      - Expirez en vous penchant du côté opposé à la poulie
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur une flexion purement latérale, sans rotation ni inclinaison vers l'avant
      - Gardez les hanches et les épaules face à l'avant tout au long du mouvement
      - Bougez lentement et avec contrôle pour maximiser le travail des obliques
      - Évitez de vous pencher vers la poulie, ce qui réduit l'efficacité
      - Maintenez la tension sur le câble sur toute l'amplitude du mouvement

      ### 5. Erreurs fréquentes
      - Utiliser une charge trop lourde au détriment de la technique
      - Faire une rotation au lieu d'une flexion purement latérale
      - Laisser les hanches se déplacer d'un côté à l'autre
      - Se pencher vers l'avant ou vers l'arrière au lieu de fléchir directement sur le côté
      - Aller trop vite et utiliser l'élan
      - Ne pas contrôler le retour à la position de départ

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser le schéma de mouvement
      - Les débutants peuvent s'exercer sans charge pour acquérir la bonne technique
      - Variante avancée : marquez une pause de 2-3 secondes au pic de contraction
      - En cas de gêne dans le bas du dos, réduisez la charge et vérifiez votre technique
