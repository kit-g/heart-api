  Seated Leg Curl (Machine):
    name: Leg curl assis (machine)
    instructions: |
      ## Aperçu
      Le leg curl assis est un exercice d'isolation qui cible principalement les ischio-jambiers. Il sollicite aussi les mollets, en utilisant une position assise sur une machine guidée pour isoler et renforcer les muscles de l'arrière de la cuisse par la flexion du genou.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur la machine à leg curl, le dos fermement appuyé contre le dossier
      - Placez le boudin contre l'arrière des jambes, juste au-dessus des chevilles
      - Réglez la machine de façon à aligner vos genoux avec l'axe de rotation
      - Saisissez les poignées pour vous stabiliser
      - Gardez les cuisses maintenues sous le boudin de cuisses

      ### 2. Mouvement
      1. Fléchissez les jambes vers le bas et vers l'arrière en pliant les genoux
      2. Continuez jusqu'à ce que le boudin touche presque l'arrière du siège
      3. Marquez une pause et contractez les ischio-jambiers en pleine flexion
      4. Ramenez lentement la charge à la position de départ, en contrôlant le mouvement
      5. Arrêtez-vous juste avant que la pile de poids ne se repose, afin de maintenir la tension
      6. Répétez le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en fléchissant les jambes vers le bas
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez le dos fermement appuyé contre le dossier
      - Concentrez-vous sur la contraction des ischio-jambiers en pleine flexion
      - Contrôlez à la fois la phase de flexion et la phase d'extension
      - Maintenez une tension constante en ne laissant pas la pile de poids se reposer
      - Évitez d'utiliser l'élan ou de tirer la charge par à-coups

      ### 5. Erreurs fréquentes
      - Décoller les fessiers du siège pendant la flexion
      - Utiliser l'élan ou balancer la charge
      - Ne pas atteindre l'amplitude complète
      - Laisser la pile de poids se reposer entre les répétitions
      - Enchaîner les répétitions trop rapidement
      - Utiliser une charge trop lourde au détriment de la technique

      ### 6. Sécurité et adaptations
      - Réglez le boudin et le siège pour un bon alignement des genoux
      - Commencez avec une charge légère pour installer une bonne technique
      - La position assise peut être plus confortable que les variantes allongées
      - Variante avancée : travaillez une jambe à la fois ou ajoutez une pause en pleine flexion
