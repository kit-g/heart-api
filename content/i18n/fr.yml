      - Gardez le buste stable et limitez la rotation
      - Menez avec le coude, en le tirant vers le bas et l'arrière
      - Concentrez-vous sur le serrage de l'omoplate vers la colonne
      - Maintenez une tension constante tout au long du mouvement
      - Contrôlez la charge dans les deux sens

