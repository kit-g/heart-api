  Front Squat (Barbell):
    name: Squat avant (barre)
    instructions: |
      ## Aperçu
      Le squat avant avec barre est un exercice polyarticulaire du bas du corps qui cible principalement les quadriceps, avec un accent plus marqué que le squat arrière. Il sollicite aussi les fessiers, les ischio-jambiers, la sangle abdominale et le haut du dos, la barre placée à l'avant favorisant un buste redressé.

      ## Exécution
      ### 1. Position de départ
      - Placez une barre dans un rack à hauteur du haut de la poitrine
      - Passez sous la barre et positionnez-la sur l'avant de vos deltoïdes
      - Créez une étagère avec vos épaules, coudes hauts et pointés vers l'avant
      - Utilisez la prise clean (doigts sous la barre) ou la prise bras croisés
      - Tenez-vous debout, pieds écartés à la largeur des épaules, pointes légèrement vers l'extérieur

      ### 2. Mouvement
      1. Décrochez la barre et reculez, pieds écartés à la largeur des épaules
      2. Amorcez le squat en fléchissant simultanément les genoux et les hanches
      3. Gardez le buste droit et les coudes hauts tout au long du mouvement
      4. Descendez jusqu'à ce que les cuisses soient au moins parallèles au sol
      5. Poussez dans les talons pour revenir à la position debout
      6. Gardez les coudes hauts et la poitrine fière, puis répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Inspirez profondément et gainez votre sangle abdominale avant de descendre
      - Retenez votre respiration pendant la descente et la position basse
      - Expirez pendant la remontée ou en haut

      ### 4. Conseils
      - Gardez les coudes aussi hauts que possible tout au long du mouvement
      - La charge placée à l'avant impose un buste plus redressé
      - Concentrez-vous sur une poitrine haute et une sangle abdominale gainée
      - Poussez les genoux vers l'extérieur pendant la descente
      - Le squat avant sollicite les quadriceps davantage que le squat arrière

      ### 5. Erreurs fréquentes
      - Laisser tomber les coudes, ce qui fait rouler la barre vers l'avant
      - Se pencher trop en avant et perdre la position redressée
      - Ne pas atteindre une profondeur suffisante
      - Laisser les genoux rentrer vers l'intérieur
      - Utiliser une charge trop lourde avant de maîtriser la position
      - Ne pas maintenir la tension de la sangle abdominale tout au long du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser la position de la barre sur les épaules
      - Utilisez la prise bras croisés si la prise clean est inconfortable
      - Entraînez-vous d'abord au squat avant avec la barre seule
      - Variante avancée : ajoutez une pause en bas ou réalisez des squats avant en tempo
