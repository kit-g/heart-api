  Toes To Bar:
    name: Orteils à la barre
    instructions: |
      ## Aperçu
      Les orteils à la barre sont un exercice avancé de gainage en suspension qui cible principalement l'ensemble du grand droit de l'abdomen et les fléchisseurs de hanche. Il sollicite aussi les obliques, le transverse de l'abdomen, les grands dorsaux, la force de préhension et les stabilisateurs des épaules, ce qui en fait l'un des exercices d'abdominaux au poids du corps les plus exigeants.

      ## Exécution
      ### 1. Position de départ
      - Suspendez-vous à une barre de traction, mains écartées à la largeur des épaules, en prise pronation
      - Laissez le corps pendre complètement tendu, pieds décollés du sol
      - Gainez votre sangle abdominale et gardez les épaules abaissées et tirées vers l'arrière
      - Gardez les jambes jointes et complètement tendues
      - Limitez le balancement en stabilisant votre corps

      ### 2. Mouvement
      1. Montez les jambes et amenez simultanément les orteils vers la barre
      2. Gardez les jambes tendues en les levant dans un arc de cercle fluide
      3. Utilisez la force de la sangle abdominale et une légère impulsion des hanches pour amener les orteils à la barre
      4. Touchez la barre avec les orteils en haut du mouvement
      5. Contrôlez la descente en redescendant les jambes
      6. Revenez à la position de suspension de départ et répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Expirez de façon marquée en montant les jambes vers la barre
      - Inspirez en redescendant les jambes vers la position de départ

      ### 4. Conseils
      - Générez l'élan depuis les épaules et la sangle abdominale, pas seulement depuis les jambes
      - Pensez à amener les orteils vers la barre en arc de cercle, pas tout droit vers le haut
      - Gardez les bras tendus et les épaules engagées tout au long du mouvement
      - Utilisez un balancement contrôlé plutôt que de lutter contre lui
      - Contractez fortement les abdominaux en haut du mouvement

      ### 5. Erreurs fréquentes
      - Fléchir les genoux pour faciliter l'exercice
      - Se balancer de façon excessive et incontrôlée
      - Ne pas amener les orteils jusqu'à la barre
      - Laisser les épaules remonter vers les oreilles
      - Laisser tomber les jambes trop vite pendant la descente
      - Ne pas engager les grands dorsaux pour aider à contrôler le mouvement

      ### 6. Sécurité et adaptations
      - Maîtrisez les relevés de jambes suspendus et les genoux aux coudes avant de tenter cet exercice
      - Utilisez des sangles de poignet si la force de préhension vous limite
      - Les débutants peuvent travailler le mouvement de kipping séparément avant de le combiner
      - Variante avancée : réalisez des orteils à la barre stricts, sans balancement ni kipping
    validated: false
    source_digest: 60e2720420df
  Torso Rotation (Machine):
    name: Rotation du buste (machine)
    instructions: |
      ## Aperçu
      La rotation du buste à la machine est un exercice de résistance pour la sangle abdominale qui cible principalement les obliques et le transverse de l'abdomen. Il sollicite aussi le grand droit de l'abdomen et les stabilisateurs profonds du tronc grâce à un mouvement de rotation contrôlé, permettant une surcharge progressive de la force en rotation.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur la machine de rotation du buste, le dos contre le dossier
      - Réglez la hauteur du siège pour que le point de pivot soit aligné avec le milieu de votre buste
      - Placez les pieds à plat sur les repose-pieds et calez les cuisses sous les coussins
      - Saisissez les poignées à hauteur de poitrine de chaque côté
      - Gainez votre sangle abdominale et gardez une posture bien droite

      ### 2. Mouvement
      1. Faites pivoter le buste d'un côté en contractant les obliques
      2. Gardez les hanches stables et face à l'avant tout au long du mouvement
      3. Tournez aussi loin que la machine le permet, en gardant le contrôle
      4. Marquez une courte pause en fin de rotation
      5. Revenez à la position centrale de départ avec contrôle
      6. Effectuez toutes les répétitions d'un côté, puis réglez la machine et répétez de l'autre côté

      ### 3. Respiration
      - Expirez en tournant sur le côté
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur une rotation venant de la sangle abdominale, sans tirer avec les bras
      - Gardez les hanches et le bas du corps parfaitement stables
      - Bougez lentement et avec contrôle pour maximiser le travail des obliques
      - Maintenez une posture droite tout au long du mouvement
      - Gardez la tension sur la pile de poids en ne la laissant pas se poser entre les répétitions

      ### 5. Erreurs fréquentes
      - Utiliser une charge trop lourde au détriment de la technique
      - Faire tourner les hanches avec le buste
      - Utiliser l'élan ou tirer la charge par à-coups
      - Tirer avec les bras au lieu de tourner avec la sangle abdominale
      - Parcourir l'amplitude trop rapidement
      - Se pencher vers l'avant ou vers l'arrière au lieu de rester droit

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser le schéma de rotation
      - Effectuez le même nombre de répétitions des deux côtés pour un développement équilibré
      - Variante avancée : marquez une pause de 2-3 secondes au pic de rotation
      - En cas de gêne dans le bas du dos, réduisez la charge et vérifiez votre technique
    validated: false
    source_digest: 735f0c747832
  V Up:
    name: V-up
    instructions: |
      ## Aperçu
      Le V-up est un exercice avancé au poids du corps pour la sangle abdominale qui cible principalement l'ensemble du grand droit de l'abdomen. Il sollicite aussi les fléchisseurs de hanche, les obliques et le transverse de l'abdomen lorsque vous soulevez simultanément le haut et le bas du corps en position de V, créant une contraction abdominale intense.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur le dos sur un tapis, bras tendus au-dessus de la tête
      - Gardez les jambes droites et jointes, complètement tendues sur le tapis
      - Gainez votre sangle abdominale et plaquez le bas du dos contre le tapis
      - Gardez la tête en position neutre, alignée avec la colonne

      ### 2. Mouvement
      1. Décollez simultanément les jambes et le haut du corps du tapis
      2. Gardez les bras et les jambes tendus en amenant les mains vers les orteils
      3. Formez un V avec votre corps, en équilibre sur les fessiers
      4. Touchez vos orteils ou tendez les mains vers eux au sommet du mouvement
      5. Marquez une courte pause en position de V
      6. Redescendez lentement le haut et le bas du corps avec contrôle
      7. Revenez à la position de départ et répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Expirez en vous repliant en position de V
      - Inspirez en redescendant vers la position de départ

      ### 4. Conseils
      - Utilisez votre sangle abdominale pour replier le corps, pas l'élan
      - Gardez les jambes et les bras tendus pendant tout le mouvement
      - Gardez le contrôle aussi bien en montée qu'en descente
      - Tenez-vous en équilibre sur les fessiers en haut du mouvement
      - Maintenez une tension constante sur les abdominaux en bougeant lentement

      ### 5. Erreurs fréquentes
      - Utiliser l'élan pour se balancer vers le haut au lieu d'une contraction contrôlée de la sangle abdominale
      - Fléchir les genoux ou les bras pour faciliter l'exercice
      - Laisser les bras tirer au lieu de laisser la sangle abdominale piloter le mouvement
      - Aller trop vite et perdre le contrôle
      - Ne pas revenir complètement en extension à la position de départ
      - Retenir sa respiration pendant le mouvement

      ### 6. Sécurité et adaptations
      - Les débutants devraient maîtriser séparément les crunchs et les relevés de jambes avant de les combiner
      - Réalisez une variante genoux fléchis (tuck V-up) si les jambes tendues sont trop difficiles
      - Variante avancée : tenez un poids léger entre les pieds pour ajouter de la résistance
      - En cas de gêne dans le bas du dos, réduisez l'amplitude ou passez à des variantes plus faciles
