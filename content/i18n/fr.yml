      - Saisissez la barre juste à l'extérieur de vos jambes, mains écartées à la largeur des épaules
      - Fléchissez les hanches et les genoux pour atteindre la barre
      - Gardez la poitrine sortie, le dos plat et les épaules légèrement en avant de la barre
      - Gainez votre sangle abdominale et engagez les grands dorsaux avant de soulever

      ### 2. Mouvement
      1. Poussez dans les talons et étendez simultanément les hanches et les genoux
      2. Gardez la barre près du corps pendant la montée
      3. Redressez-vous complètement en étendant les hanches et les genoux
      4. Gardez les épaules en arrière et la poitrine sortie en haut du mouvement
      5. Redescendez la barre en poussant les hanches vers l'arrière et en fléchissant les genoux
      6. Reposez la barre au sol avec contrôle, puis répétez

      ### 3. Respiration
      - Prenez une grande inspiration et gainez votre sangle abdominale avant de soulever
      - Bloquez votre respiration pendant l'effort
      - Expirez en haut du mouvement ou en redescendant la barre

      ### 4. Conseils
      - Gardez la barre près des tibias et des cuisses tout au long du mouvement
      - Menez le redressement avec la poitrine
      - Gardez la colonne neutre, en évitant de l'arrondir ou de l'hyperétendre
      - Poussez avec tout le pied, pas seulement avec les orteils
      - Imaginez que vous repoussez le sol plutôt que de soulever la barre

      ### 5. Erreurs fréquentes
      - Arrondir le bas du dos pendant l'effort
      - Démarrer avec les hanches trop hautes ou trop basses
      - Laisser la barre s'éloigner du corps
      - Ne pas étendre complètement les hanches en haut du mouvement
      - Regarder vers le haut ou vers le bas au lieu de garder la nuque neutre
      - Tirer avec les bras au lieu de pousser avec les jambes et les hanches

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser la technique et la flexion de hanches
      - Utilisez des sangles de tirage si la force de préhension vous limite
      - Variante avancée : faites des soulevés de terre en déficit ou des soulevés de terre roumains
      - En cas de gêne dans le bas du dos, réduisez la charge et faites vérifier votre technique par un professionnel
