  Calf Press on Leg Press:
    name: Extension des mollets à la presse
    instructions: |
      ## Aperçu
      L'extension des mollets à la presse est un exercice d'isolation qui cible principalement les gastrocnémiens et le soléaire, muscles des mollets. Elle utilise la presse à cuisses pour offrir une résistance stable tout en permettant une charge lourde et une amplitude complète de la cheville.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous dans la presse à cuisses, le dos fermement appuyé contre le dossier
      - Placez uniquement l'avant des pieds sur le bord inférieur de la plateforme
      - Laissez les talons dans le vide, jambes complètement tendues
      - Déverrouillez les sécurités
      - Gardez les genoux tendus mais non verrouillés tout au long du mouvement

      ### 2. Mouvement
      1. Abaissez la plateforme en fléchissant les chevilles et en laissant descendre les talons
      2. Laissez les mollets s'étirer complètement en bas
      3. Marquez une brève pause en position d'étirement
      4. Poussez avec l'avant des pieds pour étendre les chevilles
      5. Élevez les talons aussi haut que possible
      6. Contractez fortement les mollets en haut, puis recommencez

      ### 3. Respiration
      - Inspirez pendant la descente des talons
      - Expirez en poussant sur la pointe des pieds

      ### 4. Conseils
      - Gardez les jambes tendues tout au long du mouvement pour isoler les mollets
      - Recherchez une amplitude complète, de l'étirement profond à la contraction maximale
      - Concentrez-vous sur la contraction des mollets en haut
      - Contrôlez la charge dans les deux phases
      - Gardez la sangle abdominale gainée pour la stabilité

      ### 5. Erreurs fréquentes
      - Fléchir les genoux pendant le mouvement
      - Ne pas atteindre l'amplitude complète en haut ou en bas
      - Rebondir en bas au lieu d'un étirement contrôlé
      - Utiliser une charge trop lourde au détriment de la technique
      - Enchaîner les répétitions trop rapidement
      - Ne pas contracter au sommet du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une charge modérée pour maîtriser l'amplitude complète
      - Variez la position des pieds (neutre, pointes vers l'intérieur, pointes vers l'extérieur) pour un développement complet des mollets
      - Variante avancée : réalisez des extensions des mollets sur une jambe
      - Marquez une pause de 2-3 secondes au pic de contraction pour augmenter l'intensité
