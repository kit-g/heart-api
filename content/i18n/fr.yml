  Deficit Squat:
    name: Squat en déficit
    instructions: |
      ## Aperçu
      Le squat en déficit est un exercice polyarticulaire avancé qui cible principalement les quadriceps, les fessiers et les ischio-jambiers avec une amplitude de mouvement accrue. Il utilise une plateforme surélevée pour augmenter la profondeur et la difficulté du squat, renforçant la position basse et améliorant la mobilité.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous sur une plateforme surélevée de 1 à 3 pouces (2,5 à 7,5 cm), pieds écartés à la largeur des épaules
      - Tenez des haltères le long du corps ou une barre sur le haut du dos
      - Gardez la poitrine haute, la sangle abdominale gainée et le regard vers l'avant
      - Maintenez une bonne posture tout au long du mouvement

      ### 2. Mouvement
      1. Amorcez le squat en fléchissant simultanément les genoux et les hanches
      2. Gardez la poitrine haute et le poids sur les talons
      3. Descendez plus bas qu'un squat classique grâce à la plateforme surélevée
      4. Marquez une brève pause en bas
      5. Poussez sur vos talons pour revenir à la position debout
      6. Étendez complètement les hanches et les genoux en haut, puis répétez

      ### 3. Respiration
      - Inspirez en descendant en squat
      - Expirez en remontant vers la position debout

      ### 4. Conseils
      - Le déficit augmente l'amplitude de mouvement et la difficulté
      - Gardez les genoux alignés avec les orteils
      - Maintenez le buste droit tout au long du mouvement
      - Utilisez une charge plus légère que pour votre squat habituel
      - Cette variante renforce la position basse du squat

      ### 5. Erreurs fréquentes
      - Utiliser une plateforme trop haute pour votre mobilité
      - Ne pas exploiter la profondeur supplémentaire que permet le déficit
      - Laisser les genoux rentrer vers l'intérieur
      - Monter sur les orteils au lieu de garder le poids sur les talons
      - Utiliser une charge trop lourde avant de s'adapter à l'amplitude accrue
      - Perdre la colonne neutre en bas du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec un déficit de 1 pouce (2,5 cm) et progressez graduellement
      - Assurez-vous d'avoir une mobilité suffisante pour l'amplitude accrue
      - Utilisez moins de charge que pour votre squat habituel
      - Si vous ressentez une gêne aux genoux, réduisez la hauteur du déficit ou la charge
    validated: false
    source_digest: c738865627e9
  Trap Bar Deadlift:
    name: Soulevé de terre à la barre hexagonale
    instructions: |
      ## Aperçu
      Le soulevé de terre à la barre hexagonale est un exercice polyarticulaire qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite également les érecteurs du rachis, les grands dorsaux et les trapèzes, en utilisant une barre de forme hexagonale qui permet une position de colonne plus neutre et réduit les contraintes sur le bas du dos.

      ## Exécution
      ### 1. Position de départ
      - Placez-vous à l'intérieur de la barre hexagonale, pieds écartés à la largeur des hanches
      - Saisissez les poignées de chaque côté avec une prise neutre
      - Effectuez une flexion de hanches et fléchissez les genoux pour atteindre les poignées
      - Gardez la poitrine haute, le dos plat et les épaules au-dessus de la barre
      - Gainez votre sangle abdominale et engagez vos grands dorsaux avant de soulever

      ### 2. Mouvement
      1. Poussez sur vos talons et étendez simultanément les hanches et les genoux
      2. Gardez la barre près de votre corps pendant la montée
      3. Redressez-vous complètement en étendant les hanches et les genoux
      4. Gardez les épaules en arrière et la poitrine haute en haut
      5. Redescendez la barre en poussant les hanches vers l'arrière et en fléchissant les genoux
      6. Reposez la barre au sol avec contrôle et répétez

      ### 3. Respiration
      - Prenez une grande inspiration et gainez votre sangle abdominale avant de soulever
      - Retenez votre souffle pendant la montée
      - Expirez en haut ou en redescendant la barre

      ### 4. Conseils
      - La barre hexagonale permet une prise plus naturelle et neutre
      - La trajectoire de la barre est plus verticale qu'avec un soulevé de terre classique
      - Cette variante est souvent plus douce pour le bas du dos
      - Poussez avec l'ensemble du pied, pas seulement les orteils
      - Pensez à repousser le sol plutôt qu'à soulever la barre

      ### 5. Erreurs fréquentes
      - Arrondir le bas du dos pendant la montée
      - Commencer avec les hanches trop hautes ou trop basses
      - Ne pas étendre complètement les hanches en haut
      - Regarder vers le haut ou vers le bas au lieu de garder la nuque neutre
      - Tirer avec les bras au lieu de pousser avec les jambes et les hanches
      - Ne pas tirer parti de la prise neutre

      ### 6. Sécurité et adaptations
      - Commencez avec une charge plus légère pour vous adapter à la barre hexagonale
      - Beaucoup de barres hexagonales ont des poignées hautes et basses ; commencez par les poignées hautes
      - Cette variante est excellente pour les personnes ayant des préoccupations au niveau du bas du dos
      - Si vous ressentez une gêne dans le bas du dos, vérifiez votre technique et réduisez la charge
    validated: false
    source_digest: a928a23446da
  Zercher Squat (Barbell):
    name: Squat Zercher (barre)
    instructions: |
      ## Aperçu
      Le squat Zercher est un exercice polyarticulaire avancé qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite aussi fortement la sangle abdominale, le haut du dos et les biceps, en utilisant une barre tenue dans le creux des coudes pour créer un schéma de charge unique qui favorise une posture droite.

      ## Exécution
      ### 1. Position de départ
      - Placez une barre dans un rack à hauteur des coudes
      - Glissez-vous sous la barre et placez-la dans le creux de vos coudes
      - Joignez vos mains devant votre poitrine
      - Tenez-vous debout, pieds écartés à la largeur des épaules
      - Gardez la poitrine haute, la sangle abdominale gainée et les coudes serrés

      ### 2. Mouvement
      1. Amorcez le squat en fléchissant simultanément les genoux et les hanches
      2. Gardez le buste droit et les coudes serrés tout au long du mouvement
      3. Descendez jusqu'à ce que les cuisses soient au moins parallèles au sol
      4. Maintenez une posture droite, la barre bien calée dans vos coudes
      5. Poussez sur vos talons pour revenir à la position debout
      6. Étendez complètement les hanches et les genoux en haut, puis répétez

      ### 3. Respiration
      - Prenez une grande inspiration et gainez votre sangle abdominale avant de descendre
      - Retenez votre souffle pendant la descente et en position basse
      - Expirez en remontant ou en haut du mouvement

      ### 4. Conseils
      - La position de charge à l'avant impose un buste extrêmement droit
      - Gardez les coudes serrés pour empêcher la barre de glisser
      - Utilisez un coussinet ou une serviette pour le confort dans le creux des coudes
      - Cette variante met fortement l'accent sur la sangle abdominale et le haut du dos
      - Commencez avec une charge légère pour vous adapter à cette position de barre unique

      ### 5. Erreurs fréquentes
      - Laisser la barre glisser hors des coudes
      - Se pencher trop en avant malgré la charge à l'avant
      - Ne pas descendre suffisamment bas
      - Laisser les coudes s'écarter
      - Utiliser une charge trop lourde avant de maîtriser la position
      - Ne pas maintenir la tension de la sangle abdominale tout au long du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une barre très légère, voire une barre d'entraînement
      - Utilisez un coussinet épais ou une serviette dans le creux des coudes pour le confort
      - C'est une variante avancée ; maîtrisez d'abord le squat avant
      - Si vous ressentez une gêne, réduisez la charge ou essayez une autre variante de squat
