  Snatch Pull (Barbell):
    name: Tirage d'arraché (barre)
    instructions: |
      ## Aperçu
      Le tirage d'arraché est un exercice accessoire d'haltérophilie qui cible la chaîne postérieure, les trapèzes et les épaules. Il isole la phase de tirage de l'arraché sans la réception, permettant des charges plus lourdes pour développer la force de tirage et renforcer une bonne trajectoire de barre.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, la barre au-dessus du milieu des pieds
      - Saisissez la barre avec une prise large d'arraché
      - Effectuez une flexion de hanches et pliez les genoux pour saisir la barre
      - Gardez le dos plat, la poitrine haute et les épaules au-dessus de la barre
      - Engagez les grands dorsaux et la sangle abdominale avant de tirer

      ### 2. Mouvement
      1. Poussez explosivement avec les jambes pour décoller la barre du sol
      2. Gardez la barre proche du corps pendant qu'elle monte
      3. Étendez puissamment hanches et genoux à mi-cuisse
      4. Haussez les épaules et montez sur la pointe des pieds en extension complète
      5. Reposez la barre au sol de façon contrôlée
      6. Répétez pour le nombre souhaité de répétitions explosives

      ### 3. Respiration
      - Prenez une grande inspiration avant le tirage
      - Bloquez votre respiration pendant le tirage
      - Expirez en reposant la barre

      ### 4. Conseils
      - Recherchez un maximum de puissance et de vitesse dans le tirage
      - Gardez la barre proche du corps tout au long du mouvement
      - Cet exercice permet des charges plus lourdes que l'arraché complet
      - Insistez sur la triple extension à la position de puissance
      - Utilisez-le pour développer la force de tirage de l'arraché

      ### 5. Erreurs fréquentes
      - Tirer avec les bras trop tôt
      - Ne pas étendre complètement hanches et chevilles
      - Laisser la barre s'éloigner du corps
      - Utiliser trop de charge et perdre de la vitesse de barre
      - Arrondir le dos pendant le tirage
      - Ne pas maintenir une bonne trajectoire de barre

      ### 6. Sécurité et adaptations
      - Maîtrisez le soulevé de terre d'arraché avant d'ajouter le tirage complet
      - Utilisez 100 à 110 % de votre maximum à l'arraché pour cet exercice accessoire
      - Utilisez des sangles si la prise vous limite
      - C'est un accessoire clé pour développer la force à l'arraché
