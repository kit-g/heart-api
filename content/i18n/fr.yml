      4. Marquez une pause et contractez les biceps en haut du mouvement
      5. Redescendez lentement les poignées jusqu'à la position de départ, en contrôlant le geste
      6. Arrêtez-vous juste avant que la charge ne se repose afin de maintenir la tension, puis répétez

      ### 3. Respiration
      - Expirez en montant les poignées
      - Inspirez en les redescendant

      ### 4. Conseils
