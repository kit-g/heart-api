    instructions: |
      ## Aperçu
      La barre au front est un exercice d'isolation qui cible principalement les triceps, en particulier le chef long. Il sollicite également les chefs médial et latéral du triceps, la position allongée maximisant l'étirement et la contraction tout au long du mouvement.

