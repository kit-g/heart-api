  Bench Press (Cable):
    name: Développé couché (poulie)
    instructions: |
      ## Aperçu
      Le développé couché à la poulie est un exercice de développé sur appareil qui cible principalement le grand pectoral. Il sollicite également les deltoïdes antérieurs et les triceps ; les câbles fournissent une tension constante tout au long du mouvement pour une activation régulière des pectoraux.

      ## Exécution
      ### 1. Position de départ
      - Placez un banc plat entre deux poulies basses
      - Fixez des poignées aux deux poulies basses et réglez une charge appropriée
      - Allongez-vous à plat sur le banc, pieds bien ancrés au sol
      - Saisissez les deux poignées, bras tendus, mains à hauteur de poitrine
      - Gardez les omoplates serrées et plaquées contre le banc

      ### 2. Mouvement
      1. Descendez lentement les poignées vers la poitrine en pliant les coudes
      2. Gardez les coudes à environ 45 degrés du corps
      3. Descendez jusqu'à ce que vos mains soient à côté de votre poitrine
      4. Marquez une brève pause en bas
      5. Repoussez les poignées vers le haut en tendant les bras
      6. Arrêtez-vous juste avant l'extension complète pour maintenir la tension, puis répétez

      ### 3. Respiration
      - Inspirez en descendant les poignées vers la poitrine
      - Expirez en repoussant les poignées

      ### 4. Conseils
      - Maintenez une tension constante en ne tendant pas complètement les bras en haut
      - Gardez les omoplates serrées tout au long du mouvement
      - Contrôlez autant la descente que la poussée
      - Gardez les pieds à plat et la sangle abdominale gainée pour la stabilité
      - Concentrez-vous sur la contraction des pectoraux en haut de chaque répétition

      ### 5. Erreurs fréquentes
      - Tendre complètement les bras et perdre la tension sur les pectoraux
      - Laisser les coudes s'écarter excessivement
      - Utiliser l'élan au lieu d'un mouvement contrôlé
      - Décoller les fessiers du banc
      - Ne pas garder les omoplates serrées
      - Cambrer excessivement le bas du dos

      ### 6. Sécurité et adaptations
      - Commencez léger pour maîtriser le schéma de développé à la poulie
      - Ajustez la hauteur des poulies pour varier les angles (basse, moyenne, haute)
      - Réalisez l'exercice sur un banc incliné ou décliné pour varier le travail musculaire
      - Travaillez un bras à la fois pour un entraînement unilatéral
