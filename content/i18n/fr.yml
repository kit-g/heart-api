  Landmine Press:
    name: Développé landmine
    instructions: |
      ## Aperçu
      Le développé landmine est un exercice de poussée qui cible principalement les épaules, surtout les deltoïdes antérieurs. Les triceps, le haut des pectoraux et la sangle abdominale assistent le mouvement, et l'arc de la barre ancrée en fait une alternative plus douce pour les épaules que le développé vertical strict.

      ## Exécution
      ### 1. Position de départ
      - Ancrez une extrémité d'une barre dans un support landmine ou dans un coin de mur
      - Tenez-vous face à la barre, pieds écartés à la largeur des épaules
      - Tenez l'extrémité libre à hauteur d'épaule, à deux mains, ou à une main pour la version unilatérale
      - Gainez votre sangle abdominale et gardez les côtes basses

      ### 2. Mouvement
      1. Poussez la barre vers le haut et vers l'avant en suivant son arc naturel
      2. Continuez jusqu'à l'extension complète des bras
      3. Marquez une brève pause en haut
      4. Redescendez la barre à hauteur d'épaule en contrôlant
      5. Répétez le nombre souhaité de répétitions contrôlées; si vous poussez à une main, répétez de l'autre côté

      ### 3. Respiration
      - Expirez pendant la poussée
      - Inspirez pendant la descente

      ### 4. Conseils
      - Gardez tout le corps gainé; ne laissez pas le bas du dos se cambrer
      - Poussez en suivant l'arc de la barre plutôt qu'en luttant contre lui
      - Reculez légèrement un pied pour une position plus solide

      ### 5. Erreurs fréquentes
      - Cambrer le dos pour terminer la poussée
      - Hausser l'épaule vers l'oreille
      - Se tenir trop loin ou trop près de l'extrémité ancrée

      ### 6. Sécurité et adaptations
      - Agenouillez-vous sur un ou deux genoux pour exclure le bas du corps du mouvement
      - Commencez avec la barre à vide; l'extrémité ancrée réduit déjà la charge
