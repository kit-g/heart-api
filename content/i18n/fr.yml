exercises:
  Ab Wheel:
    name: Roue abdominale
    instructions: |
      ## Aperçu
      La roue abdominale est un exercice de gainage exigeant qui cible principalement le grand droit de l'abdomen et le transverse. Elle sollicite également les obliques, les fléchisseurs de hanche et les épaules comme stabilisateurs tout au long du mouvement.

      ## Exécution
      ### 1. Position de départ
      - Agenouillez-vous sur un tapis avec la roue abdominale placée juste devant vous
      - Saisissez fermement les poignées des deux mains, écartées de la largeur des épaules
      - Placez vos épaules directement au-dessus de la roue
      - Gardez le dos droit et la sangle abdominale engagée
      - Regardez le sol pour garder la nuque en position neutre

      ### 2. Mouvement
      1. Faites rouler lentement la roue vers l'avant en étendant les bras et les hanches
      2. Gardez la sangle abdominale contractée et ne laissez pas le bas du dos s'affaisser
      3. Avancez aussi loin que possible tout en gardant le contrôle et le dos plat
      4. Marquez une brève pause en position d'extension complète
      5. Ramenez la roue vers vos genoux en contractant vos abdominaux
      6. Revenez à la position de départ de manière contrôlée

      ### 3. Respiration
      - Expirez pendant que vous déroulez et étendez votre corps
      - Inspirez pendant que vous ramenez la roue à la position de départ

      ### 4. Conseils
      - Maintenez une tension constante dans la sangle abdominale pendant tout le mouvement
      - Bougez lentement et avec contrôle ; la vitesse réduit l'efficacité
      - Concentrez-vous sur vos abdominaux pour revenir, pas sur vos bras
      - Gardez les hanches stables et évitez de cambrer excessivement

      ### 5. Erreurs fréquentes
      - Laisser le bas du dos s'affaisser ou partir en hyperextension
      - Dérouler trop loin avant d'avoir acquis une force suffisante
      - Utiliser l'élan plutôt qu'un mouvement contrôlé
      - Laisser les hanches remonter en pique au retour
      - Retenir sa respiration pendant le mouvement

      ### 6. Sécurité et adaptations
      - Commencez par des déroulés partiels face à un mur pour limiter l'amplitude
      - Travaillez depuis les genoux avant de tenter l'exercice debout
      - En cas de gêne dans le bas du dos, réduisez votre amplitude de mouvement
      - Ne passez aux déroulés debout qu'après avoir maîtrisé la version à genoux
