  Chest Dip (Assisted):
    name: Dips pectoraux (assistés)
    instructions: |
      ## Aperçu
      Les dips pectoraux assistés sont un exercice de poussée sur machine qui cible principalement la partie inférieure du grand pectoral, avec un soutien. Ils sollicitent également les triceps et les deltoïdes antérieurs ; le contrepoids d'assistance rend le mouvement de dips plus accessible tout en construisant la force nécessaire aux dips sans assistance.

      ## Exécution
      ### 1. Position de départ
      - Réglez la charge sur la machine à dips assistée (plus de poids = plus d'assistance)
      - Saisissez les poignées, mains légèrement plus écartées que la largeur des épaules
      - Placez les genoux ou les pieds sur le coussin d'assistance
      - Commencez bras complètement tendus, buste incliné vers l'avant
      - Gainez votre sangle abdominale et gardez les épaules abaissées

      ### 2. Mouvement
      1. Descendez en pliant les coudes jusqu'à environ 90 degrés
      2. Gardez le buste incliné vers l'avant tout au long du mouvement
      3. Restez maître du mouvement pendant que le coussin d'assistance soutient votre poids
      4. Marquez une brève pause en bas du mouvement
      5. Poussez dans les paumes pour tendre les bras et revenir à la position de départ
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant
      - Expirez en remontant vers la position de départ

      ### 4. Conseils
      - Restez incliné vers l'avant pour mettre l'accent sur les pectoraux plutôt que sur les triceps
      - Réduisez progressivement l'assistance à mesure que vous gagnez en force
      - Concentrez-vous sur un mouvement contrôlé sur toute l'amplitude
      - Gardez les coudes légèrement écartés pour accentuer le travail des pectoraux
      - Évitez de trop vous reposer sur l'assistance

      ### 5. Erreurs fréquentes
      - Utiliser trop d'assistance et ne pas se challenger suffisamment
      - Rester trop redressé au lieu de s'incliner vers l'avant
      - Laisser les coudes s'écarter excessivement
      - Utiliser l'élan au lieu d'un mouvement contrôlé
      - Ne pas travailler sur une amplitude complète
      - Ne pas réduire progressivement l'assistance au fil du temps

      ### 6. Sécurité et adaptations
      - Commencez avec plus d'assistance et diminuez-la progressivement à mesure que vous devenez plus fort
      - Privilégiez la technique plutôt qu'une réduction trop rapide de l'assistance
      - Progressez vers des dips assistés par bande ou en négatives avant de tenter les dips sans assistance
      - Réduisez l'amplitude en cas de gêne aux épaules
