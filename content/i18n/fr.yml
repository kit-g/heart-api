  Battle Ropes:
    name: Cordes ondulatoires
    instructions: |
      ## Aperçu
      Les cordes ondulatoires sont un exercice cardiovasculaire et de renforcement à haute intensité qui cible les épaules, les bras, la sangle abdominale et les jambes. À l'aide de cordes épaisses et lourdes agitées en vagues et en motifs variés, elles développent puissance, endurance et force de préhension, et offrent un travail métabolique efficace pour tout le corps.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous face au point d'ancrage, pieds écartés à la largeur des épaules
      - Tenez une extrémité de corde dans chaque main
      - Gardez les genoux légèrement fléchis et la sangle abdominale engagée
      - Gardez le dos droit et la poitrine haute
      - Placez-vous à une distance laissant un léger mou dans les cordes

      ### 2. Mouvement
      1. Choisissez un motif de vagues (vagues alternées, vagues doubles, slams, etc.)
      2. Créez des vagues puissantes et rythmées avec vos bras
      3. Maintenez le mouvement pendant l'intervalle prévu
      4. Gardez la sangle abdominale engagée et utilisez tout votre corps
      5. Générez des vagues continues sans vous arrêter
      6. Continuez pendant l'intervalle de travail souhaité (généralement 20 à 60 secondes)

      ### 3. Respiration
      - Respirez de façon régulière et rythmée tout au long de l'effort
      - Expirez pendant les portions intenses
      - Évitez de retenir votre respiration

      ### 4. Conseils
      - Engagez votre sangle abdominale pour protéger le bas du dos
      - Utilisez vos hanches et vos jambes, pas seulement les bras
      - Commencez par des intervalles courts et construisez l'endurance
      - Les différents motifs de vagues ciblent différents groupes musculaires
      - Excellent pour l'entraînement par intervalles à haute intensité

      ### 5. Erreurs fréquentes
      - Utiliser uniquement les bras au lieu de tout le corps
      - Rester trop droit, sans posture athlétique
      - Ne pas créer de vagues régulières
      - Retenir sa respiration pendant l'effort
      - Commencer avec des intervalles trop longs
      - Mauvaise posture, dos arrondi

      ### 6. Sécurité et adaptations
      - Commencez avec des cordes plus légères ou des intervalles plus courts
      - Réduisez l'intensité en créant des vagues plus petites
      - Alternez entre différents motifs de vagues
      - Récupérez suffisamment entre les intervalles
    validated: false
    source_digest: 39ab652bdaaf
  Climbing:
    name: Escalade
    instructions: |
      ## Aperçu
      L'escalade est une activité cardiovasculaire et de renforcement pour tout le corps qui cible le dos, les bras, la sangle abdominale et les jambes. Qu'il s'agisse d'escalade en falaise, sur mur ou de grimper de corde, elle développe force de préhension, endurance musculaire, sens de la résolution de problèmes et condition cardiovasculaire.

      ## Exécution
      ### 1. Position de départ
      - Approchez le mur ou la paroi avec l'équipement de sécurité approprié
      - Étudiez votre voie avant de commencer
      - Portez des chaussons d'escalade et utilisez de la magnésie si besoin
      - Assurez-vous d'un dispositif d'assurage correct le cas échéant
      - Partez d'une position stable

      ### 2. Mouvement
      1. Planifiez votre voie et repérez les prises de mains et de pieds
      2. Poussez avec les jambes plutôt que de tirer uniquement avec les bras
      3. Conservez trois points de contact quand c'est possible
      4. Transférez votre poids efficacement d'une prise à l'autre
      5. Gérez votre rythme pour garder de l'endurance sur toute la voie
      6. Continuez de grimper pendant la durée ou la voie souhaitée

      ### 3. Respiration
      - Respirez régulièrement tout au long de la voie
      - Faites de courtes pauses sur des prises stables si nécessaire
      - Évitez de retenir votre respiration dans les sections difficiles

      ### 4. Conseils
      - Poussez avec les jambes, ne tirez pas seulement avec les bras
      - Gardez les hanches proches du mur pour un meilleur équilibre
      - Regardez devant pour anticiper vos prochains mouvements
      - Reposez-vous sur les bonnes prises quand vous en trouvez
      - Privilégiez la technique à la force pure

      ### 5. Erreurs fréquentes
      - Serrer les prises trop fort et gaspiller de l'énergie
      - Trop compter sur les bras plutôt que sur les jambes
      - Ne pas anticiper et se retrouver bloqué
      - Grimper trop vite et s'épuiser
      - Mauvais placement du corps, trop loin du mur
      - Ne pas se reposer sur les bonnes prises

      ### 6. Sécurité et adaptations
      - Grimpez toujours avec un équipement de sécurité adapté et un encadrement
      - Commencez par des voies plus faciles et progressez graduellement
      - Envisagez le bloc (faible hauteur, tapis de réception) pour débuter
      - Apprenez la bonne technique auprès de grimpeurs expérimentés ou d'instructeurs
    validated: false
    source_digest: f2d56b2a68a1
