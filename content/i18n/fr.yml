  Triceps Dip:
    name: Dips
    instructions: |
      ## Aperçu
      Les dips sont un exercice au poids du corps qui cible principalement les triceps. Ils sollicitent également les pectoraux et l'avant des épaules comme muscles secondaires, ce qui en fait un mouvement polyarticulaire efficace pour développer la force de poussée du haut du corps et la masse des triceps.

      ## Exécution
      ### 1. Position de départ
      - Placez-vous sur des barres parallèles, bras complètement tendus
      - Saisissez fermement les barres, mains légèrement plus écartées que la largeur des épaules
      - Gardez le corps droit avec une légère inclinaison vers l'avant
      - Croisez les chevilles derrière vous ou gardez les jambes tendues
      - Gainez votre sangle abdominale et gardez les épaules basses

      ### 2. Mouvement
      1. Descendez en fléchissant les coudes jusqu'à environ 90 degrés
      2. Gardez les coudes pointés vers l'arrière, sans les écarter excessivement
      3. Maintenez le buste droit pour privilégier les triceps plutôt que les pectoraux
      4. Marquez une brève pause en bas du mouvement
      5. Poussez dans les paumes pour tendre les bras et revenir à la position de départ
      6. Répétez le mouvement de façon contrôlée pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Inspirez pendant la descente
      - Expirez en remontant vers la position de départ

      ### 4. Conseils
      - Gardez le corps relativement droit pour maximiser le travail des triceps
      - Gardez les coudes serrés le long du corps du début à la fin
      - Soulevez-vous avec les triceps plutôt qu'avec l'élan
      - Évitez de descendre trop bas et de solliciter excessivement les épaules
      - Gardez le contrôle sur toute l'amplitude du mouvement

      ### 5. Erreurs fréquentes
      - Se pencher trop en avant, ce qui déplace le travail vers les pectoraux
      - Laisser les coudes s'écarter excessivement
      - Descendre trop bas et forcer sur les épaules
      - Utiliser l'élan ou rebondir en bas
      - Ne pas tendre complètement les coudes en haut
      - Enrouler les épaules vers l'avant

      ### 6. Sécurité et adaptations
      - Utilisez une machine à dips assistés ou une bande élastique comme soutien si nécessaire
      - Réduisez l'amplitude du mouvement en cas de gêne aux épaules
      - Variante avancée : ajoutez du lest avec une ceinture à dips ou un gilet lesté
      - Progressez graduellement pour éviter de solliciter excessivement les épaules
