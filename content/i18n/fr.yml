  Bulgarian Split Squat:
    name: Squat bulgare
    instructions: |
      ## Aperçu
      Le squat bulgare est un exercice unilatéral du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite aussi la sangle abdominale et les stabilisateurs de hanche ; le pied arrière surélevé augmente l'amplitude et met l'équilibre à l'épreuve tout en développant la force sur une jambe.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, dos à un banc ou à une surface surélevée
      - Posez le dessus de votre pied arrière sur le banc derrière vous
      - Avancez suffisamment le pied avant pour permettre une fente profonde
      - Gardez la poitrine haute, la sangle abdominale gainée et le buste droit
      - Tenez des haltères le long du corps ou une barre sur le haut du dos

      ### 2. Mouvement
      1. Descendez en fléchissant le genou et la hanche de la jambe avant
      2. Gardez le genou avant aligné avec vos orteils
      3. Continuez à descendre jusqu'à ce que votre cuisse avant soit parallèle au sol
      4. Marquez une brève pause en bas
      5. Poussez dans le talon avant pour revenir à la position de départ
      6. Terminez toutes les répétitions d'un côté, puis changez de côté

      ### 3. Respiration
      - Inspirez en descendant
      - Expirez en remontant à la position de départ

      ### 4. Conseils
      - Gardez l'essentiel de votre poids sur la jambe avant
      - Maintenez le buste droit pendant tout le mouvement
      - Trouvez la position de pied avant adaptée à votre souplesse
      - Concentrez-vous sur une descente contrôlée et une remontée explosive
      - Gardez le genou avant aligné avec vos orteils

      ### 5. Erreurs fréquentes
      - Placer le pied avant trop près du banc
      - Laisser le genou avant rentrer vers l'intérieur
      - Se pencher trop en avant pendant le mouvement
      - Mettre trop de poids sur le pied arrière
      - Ne pas descendre suffisamment
      - Enchaîner les répétitions sans contrôler le mouvement

      ### 6. Sécurité et adaptations
      - Commencez au poids du corps seulement, pour maîtriser l'équilibre et la technique
      - Utilisez une surface plus basse pour le pied arrière si nécessaire
      - Tenez-vous à un support pour l'équilibre au début
      - Variante avancée : ajoutez de la charge avec des haltères, une barre ou un gilet lesté
