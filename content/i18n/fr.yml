      Le tirage vertical en supination avec bande est un exercice de tirage à résistance élastique qui cible principalement le grand dorsal avec une plus grande sollicitation des biceps. Il sollicite aussi les rhomboïdes et les trapèzes moyens, la prise en supination s'accompagnant d'une résistance progressive de la bande tout au long du mouvement.

