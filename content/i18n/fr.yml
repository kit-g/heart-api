  Upright Row (Smith Machine):
    name: Tirage menton (machine Smith)
    instructions: |
      ## Aperçu
      Le tirage menton à la machine Smith est un exercice de tirage qui cible principalement les épaules et le haut du dos, en particulier les deltoïdes latéraux et les trapèzes. Les biceps assistent le mouvement, et la trajectoire fixe de la barre stabilise le geste pour vous laisser vous concentrer sur le tirage.

