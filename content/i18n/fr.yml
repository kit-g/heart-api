  Cable Crunch:
    name: Crunch à la poulie
    instructions: |
      ## Aperçu
      Le crunch à la poulie est un exercice de gainage efficace qui cible principalement le grand droit de l'abdomen avec une tension constante tout au long du mouvement. Il sollicite également les obliques et le transverse comme stabilisateurs, ce qui en fait un choix populaire pour développer la force et le dessin des abdominaux.

      ## Exécution
      ### 1. Position de départ
      - Agenouillez-vous face à une poulie haute équipée d'une corde
      - Saisissez les extrémités de la corde et placez-les de chaque côté de la tête ou en haut de la poitrine
      - Gardez les hanches immobiles et maintenez une légère inclinaison vers l'avant
      - Engagez la sangle abdominale et abaissez les omoplates vers l'arrière
      - Placez-vous assez près pour que la pile de poids ne repose pas entre les répétitions

      ### 2. Mouvement
      1. Expirez et enroulez le buste vers le bas en contractant les abdominaux et en amenant les coudes vers les cuisses
      2. Concentrez-vous sur l'enroulement du buste vers l'avant, pas seulement sur la traction des bras
      3. Contractez fortement les abdominaux en bas du mouvement pendant 1 à 2 secondes
      4. Revenez lentement à la position de départ de manière contrôlée en maintenant la tension
      5. Arrêtez-vous juste avant que la pile de poids ne se repose afin de garder une tension constante sur la sangle abdominale
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez avec force pendant que vous vous enroulez et contractez les abdominaux
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez les hanches fixes pendant tout le mouvement ; seul le buste doit bouger
      - Pensez à rapprocher votre cage thoracique de votre bassin plutôt qu'à simplement vous pencher en avant
      - Maintenez un tempo contrôlé ; évitez les à-coups et l'élan
      - Gardez la tension sur les abdominaux en ne laissant pas le poids se reposer entre les répétitions
      - Vos bras doivent rester dans une position fixe par rapport à votre tête

      ### 5. Erreurs fréquentes
      - Tirer avec les bras et les épaules au lieu de contracter les abdominaux
      - Laisser les hanches osciller d'avant en arrière
      - Aller trop vite et compter sur l'élan
      - Laisser la pile de poids se reposer complètement entre les répétitions
      - Choisir une charge trop lourde qui compromet la technique
      - Étendre la colonne trop loin au retour, ce qui peut solliciter le bas du dos

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser la technique et la connexion esprit-muscle
      - En cas de gêne à la nuque, essayez de tenir la corde au niveau de la poitrine plutôt qu'à côté de la tête
      - Variante avancée : marquez une pause de 3 à 5 secondes au pic de contraction pour plus d'intensité
      - Régression : effectuez des crunchs classiques au poids du corps jusqu'à développer une force suffisante
