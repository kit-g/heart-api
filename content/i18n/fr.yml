  Aerobics:
    name: Aérobic
    instructions: |
      ## Aperçu
      L'aérobic est une forme d'exercice cardiovasculaire qui combine des mouvements rythmés et de la musique. Elle sollicite le système cardiovasculaire et divers groupes musculaires, améliorant la santé cardiaque, l'endurance, la coordination et la condition physique générale grâce à une activité soutenue d'intensité modérée à vigoureuse.
