  Kipping Pull Up:
    name: Tractions kipping
    instructions: |
      ## Aperçu
      Les tractions kipping sont un exercice de tirage dynamique au poids du corps qui cible principalement le grand dorsal en utilisant l'élan. Elles sollicitent aussi les épaules, la sangle abdominale et les fléchisseurs de hanche par un balancement coordonné, ce qui en fait un mouvement fonctionnel pour le CrossFit et l'entraînement athlétique.

      ## Exécution
      ### 1. Position de départ
      - Suspendez-vous à une barre de traction en pronation, mains un peu plus écartées que la largeur des épaules
      - Laissez votre corps pendre en extension complète, bras tendus
      - Gainez votre sangle abdominale et préparez-vous à amorcer le mouvement de kipping
      - Gardez les épaules actives, sans pendre passivement

      ### 2. Mouvement
      1. Créez de l'élan en poussant vers l'avant puis en tirant votre corps vers l'arrière en arche
      2. Quand votre corps se balance vers l'avant, propulsez vos hanches vers la barre
      3. Utilisez l'élan ascendant pour amener votre menton au-dessus de la barre
      4. Repoussez-vous de la barre en haut pour amorcer le kip suivant
      5. Laissez votre corps revenir en position d'arche
      6. Répétez le mouvement de kipping dans un rythme fluide et continu

      ### 3. Respiration
      - Respirez de façon rythmée tout au long du mouvement continu
      - Évitez de bloquer votre respiration pendant le mouvement

      ### 4. Conseils
      - Maîtrisez les tractions strictes avant de tenter les variantes kipping
      - Générez l'élan à partir des hanches, pas seulement des bras
      - Gardez le mouvement fluide et continu
      - Pensez au mouvement comme à un balancement coordonné de tout le corps
      - Travaillez séparément les positions creuse (hollow) et arquée avant de les combiner

      ### 5. Erreurs fréquentes
      - Tenter le kipping sans force suffisante en tractions strictes
      - Utiliser un balancement excessif et incontrôlé
      - Ne pas coordonner la poussée des hanches avec le tirage
      - Casser le rythme entre les répétitions
      - Laisser les épaules se relâcher en bas
      - Pratiquer le kipping sans respecter une progression appropriée

      ### 6. Sécurité et adaptations
      - Construisez une base de 5-10 tractions strictes avant le kipping
      - Travaillez séparément les balancements en position creuse et arquée
      - Utilisez une machine à tractions assistées pour bâtir la force de base
      - Faites-vous accompagner par un coach pour apprendre la mécanique du kipping en toute sécurité
