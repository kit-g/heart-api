  Split Jerk (Barbell):
    name: Jeté en fente (barre)
    instructions: |
      ## Aperçu
      Le jeté en fente est un mouvement d'haltérophilie qui cible les épaules, les triceps et les jambes. Il consiste à propulser la barre des épaules jusqu'au-dessus de la tête en fendant les pieds vers l'avant et vers l'arrière, offrant plus de stabilité et des charges plus lourdes que le jeté en puissance.

      ## Exécution
      ### 1. Position de départ
      - Commencez avec la barre posée sur l'avant des épaules
      - Tenez-vous debout, pieds écartés à la largeur des hanches
      - Gardez les coudes hauts et légèrement en avant
      - Gainez votre sangle abdominale et maintenez le buste droit
      - Préparez-vous à une flexion contrôlée

      ### 2. Mouvement
      1. Fléchissez légèrement les genoux en gardant le buste vertical
      2. Poussez explosivement vers le haut en étendant les jambes
      3. Fendez les pieds vers l'avant et vers l'arrière tout en poussant la barre au-dessus de la tête
      4. Réceptionnez avec le genou avant fléchi et la jambe arrière tendue
      5. Verrouillez les bras, la barre stable au-dessus de la tête
      6. Revenez en ramenant d'abord le pied avant, puis le pied arrière

      ### 3. Respiration
      - Inspirez avant la flexion
      - Bloquez votre respiration pendant la flexion, la poussée et la fente
      - Expirez une fois la barre verrouillée et stable

      ### 4. Conseils
      - La position fendue offre plus de stabilité que les autres jetés
      - La flexion doit être verticale, sans inclinaison vers l'avant
      - Poussez énergiquement avec les jambes avant que les bras n'interviennent
      - Le tibia avant doit être vertical en position de réception
      - C'est la variante de jeté la plus courante en compétition

      ### 5. Erreurs fréquentes
      - Fléchir vers l'avant au lieu de rester vertical
      - Ne pas fendre les pieds suffisamment
      - Pousser avec les bras avant la poussée des jambes
      - Réceptionner avec le genou avant au-delà des orteils
      - Mauvaise trajectoire de barre pendant la poussée
      - Ne pas verrouiller complètement les bras au-dessus de la tête

      ### 6. Sécurité et adaptations
      - Exige l'encadrement d'un entraîneur d'haltérophilie qualifié
      - Travaillez d'abord le jeu de pieds de la fente sans charge
      - Maîtrisez le jeté en puissance avant d'apprendre le jeté en fente
      - Utilisez des blocs pour travailler la position de réception
    validated: false
    source_digest: cd79be31037d
  Ball Slams:
    name: Lancers de balle au sol
    instructions: |
      ## Aperçu
      Les lancers de balle au sol sont un exercice explosif pour tout le corps qui cible principalement la sangle abdominale, les épaules et les grands dorsaux. Ils sollicitent aussi toute la chaîne postérieure et le système cardiovasculaire, en utilisant une médecine-ball pour développer la puissance, évacuer le stress et bâtir une force explosive.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des épaules, une médecine-ball en mains
      - Tenez la balle à hauteur de poitrine avec les deux mains
      - Gardez la poitrine haute, la sangle abdominale engagée et les genoux légèrement fléchis
      - Maintenez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Montez la balle au-dessus de la tête en vous grandissant
      2. Projetez violemment la balle droit vers le sol
      3. Utilisez tout votre corps pour générer la puissance du lancer
      4. Fléchissez genoux et hanches pendant le lancer
      5. Rattrapez ou ramassez la balle au rebond
      6. Enchaînez immédiatement pour le nombre souhaité de répétitions explosives

      ### 3. Respiration
      - Inspirez en montant la balle au-dessus de la tête
      - Expirez avec force en projetant la balle au sol

      ### 4. Conseils
      - Utilisez tout votre corps, pas seulement les bras
      - Lancez avec un maximum de force et d'engagement
      - Cet exercice est excellent pour développer la puissance et évacuer le stress
      - Gardez le contrôle du mouvement malgré son caractère explosif
      - Utilisez une balle conçue pour les lancers au sol

      ### 5. Erreurs fréquentes
      - Utiliser uniquement les bras au lieu de tout le corps
      - Ne pas lancer avec toute sa force
      - Laisser la balle rebondir sans contrôle
      - Rester trop droit sans engager la sangle abdominale
      - Utiliser une balle qui rebondit trop
      - Mauvaise posture pendant le mouvement

      ### 6. Sécurité et adaptations
      - Utilisez une slam ball conçue à cet effet
      - Commencez avec une balle plus légère pour maîtriser le mouvement explosif
      - Travaillez sur une surface capable d'encaisser l'impact
      - Variez le tempo, d'explosif à contrôlé, selon vos objectifs
