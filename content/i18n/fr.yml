  Deadlift (Band):
    name: Soulevé de terre (bande)
    instructions: |
      ## Aperçu
      Le soulevé de terre avec bande est un exercice polyarticulaire à résistance élastique qui cible principalement les fessiers, les ischio-jambiers et les érecteurs du rachis. Il sollicite aussi les quadriceps, les grands dorsaux et la sangle abdominale, la résistance progressive de la bande permettant d'apprendre une bonne mécanique de soulevé de terre avec une charge plus légère.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, sur le centre d'une bande élastique
      - Saisissez les deux extrémités de la bande, mains juste à l'extérieur des jambes
      - Fléchissez les hanches et pliez les genoux pour atteindre la bande
      - Gardez la poitrine haute, le dos plat et les épaules légèrement en avant des mains
      - Gainez votre sangle abdominale et engagez les grands dorsaux avant de soulever

      ### 2. Mouvement
      1. Poussez dans les talons et étendez simultanément les hanches et les genoux
      2. Gardez la bande près du corps pendant la montée
      3. Redressez-vous complètement en étendant les hanches et les genoux
      4. Gardez les épaules en arrière et la poitrine haute en haut
      5. Redescendez en poussant les hanches vers l'arrière et en pliant les genoux
      6. Revenez à la position de départ de façon contrôlée et recommencez

      ### 3. Respiration
      - Inspirez profondément et gainez votre sangle abdominale avant de soulever
      - Retenez votre respiration pendant la montée
      - Expirez en haut ou pendant la descente

      ### 4. Conseils
      - Gardez la bande près des tibias et des cuisses tout au long du mouvement
      - Menez le mouvement avec la poitrine en vous redressant
      - Gardez la colonne neutre, sans arrondir ni cambrer excessivement
      - La bande offre une résistance croissante à mesure que vous vous redressez
      - Concentrez-vous sur le schéma de flexion de hanches

      ### 5. Erreurs fréquentes
      - Arrondir le bas du dos pendant la montée
      - Commencer avec les hanches trop hautes ou trop basses
      - Laisser la bande s'éloigner du corps
      - Ne pas étendre complètement les hanches en haut
      - Regarder vers le haut ou vers le bas au lieu de garder la nuque neutre
      - Tirer avec les bras au lieu de pousser avec les jambes et les hanches

      ### 6. Sécurité et adaptations
      - Commencez avec une bande de résistance plus légère pour maîtriser la technique
      - Ajustez la position des pieds sur la bande pour modifier la résistance
      - Utilisez cette variante pour apprendre la mécanique du soulevé de terre avant de passer à la barre
      - Variante avancée : utilisez une bande de résistance plus forte ou réalisez des soulevés de terre avec bande sur une jambe
