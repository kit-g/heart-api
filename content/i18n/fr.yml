  Around the World:
    name: Tour du monde
    instructions: |
      ## Aperçu
      Le tour du monde est un exercice dynamique pour la poitrine qui cible principalement le grand pectoral sur un large arc de mouvement. Il sollicite également les deltoïdes antérieurs et la sangle abdominale comme stabilisateurs ; les haltères créent une tension constante tout au long d'un mouvement circulaire.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur un banc, pieds bien ancrés au sol
      - Tenez un haltère dans chaque main, bras tendus à la verticale au-dessus de la poitrine
      - Gardez une légère flexion des coudes tout au long du mouvement
      - Gainez votre sangle abdominale et plaquez le dos contre le banc
      - Placez les haltères paumes face à face

      ### 2. Mouvement
      1. Abaissez les haltères sur les côtés et vers le bas en décrivant un large arc
      2. Poursuivez l'arc jusqu'à ce que les haltères arrivent à côté de vos hanches
      3. Inversez le mouvement en ramenant les haltères vers le haut et en arc jusqu'à la position de départ
      4. Gardez une légère flexion des coudes tout au long du trajet circulaire
      5. Maintenez le contrôle et la tension sur les pectoraux
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Inspirez en abaissant les haltères vers le bas et en arc
      - Expirez en ramenant les haltères à la position de départ

      ### 4. Conseils
      - Gardez une légère flexion constante des coudes tout au long du mouvement
      - Concentrez-vous sur un arc fluide et contrôlé
      - Maintenez une tension constante sur les pectoraux
      - Évitez de verrouiller les coudes à quelque moment que ce soit
      - Utilisez une charge plus légère que pour les exercices de pectoraux classiques

      ### 5. Erreurs fréquentes
      - Charger trop lourd au détriment de l'arc de mouvement
      - Tendre complètement les coudes pendant le mouvement
      - Aller trop vite et perdre le contrôle
      - Ne pas maintenir une tension constante sur les pectoraux
      - Cambrer excessivement le bas du dos en le décollant du banc
      - S'arrêter en bas au lieu de maintenir un mouvement continu

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères légers pour maîtriser le mouvement circulaire
      - Gardez les coudes légèrement fléchis pour protéger les articulations des épaules
      - Réalisez le mouvement dans le sens inverse pour varier
      - En cas de gêne aux épaules, réduisez l'amplitude ou la charge
