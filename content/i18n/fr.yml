  Cable Crossover:
    name: Écartés à la poulie vis-à-vis
    instructions: |
      ## Aperçu
      Les écartés à la poulie vis-à-vis sont un exercice d'isolation qui cible principalement le grand pectoral, en particulier la partie interne. Ils sollicitent également les deltoïdes antérieurs comme stabilisateurs ; les câbles fournissent une tension constante tout au long d'un large arc de mouvement.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous au centre, entre deux poulies hautes
      - Saisissez une poignée dans chaque main, bras étendus sur les côtés
      - Avancez d'un pas en position décalée pour plus de stabilité
      - Penchez-vous légèrement en avant depuis les hanches, poitrine haute
      - Gardez une légère flexion des coudes tout au long du mouvement

      ### 2. Mouvement
      1. Amenez les deux poignées vers le bas et l'une vers l'autre devant votre poitrine
      2. Gardez les coudes légèrement fléchis, comme pour enlacer quelque chose
      3. Continuez jusqu'à ce que vos mains se rejoignent ou se croisent à hauteur de poitrine
      4. Contractez fort les pectoraux au pic de la contraction
      5. Ramenez lentement les bras à la position de départ, en contrôlant
      6. Arrêtez-vous avant de perdre la tension des câbles, puis répétez

      ### 3. Respiration
      - Expirez en rapprochant les poignées
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez une flexion des coudes constante tout au long du mouvement
      - Concentrez-vous sur la contraction des pectoraux, sans tirer avec les bras
      - Maintenez une tension constante en contrôlant les deux phases
      - Gardez la sangle abdominale gainée pour éviter de trop vous pencher en avant
      - Ajustez la hauteur des poulies pour cibler différents angles des pectoraux

      ### 5. Erreurs fréquentes
      - Tendre complètement les bras pendant le mouvement
      - Utiliser l'élan ou balancer le corps
      - Ne pas maintenir une tension constante sur les câbles
      - Se pencher trop en avant
      - Aller trop vite et perdre la contraction
      - Charger trop lourd et plier excessivement les coudes

      ### 6. Sécurité et adaptations
      - Commencez léger pour maîtriser l'arc de mouvement
      - Ajustez la hauteur des poulies (haute, moyenne, basse) pour varier l'accent sur les pectoraux
      - Travaillez un bras à la fois pour un travail unilatéral
      - Variante avancée : marquez une pause de 2 à 3 secondes au pic de la contraction
