  Elliptical Machine:
    name: Elliptique
    instructions: |
      ## Aperçu
      L'elliptique est un exercice cardiovasculaire à faible impact qui cible les jambes, les fessiers et le système cardiovasculaire. Il reproduit le mouvement de la course sans stress d'impact sur les articulations, offrant un travail aérobie efficace avec la possibilité de solliciter le haut du corps.

      ## Exécution
      ### 1. Position de départ
      - Montez sur l'elliptique et placez les pieds sur les pédales
      - Saisissez les poignées fixes ou mobiles
      - Tenez-vous droit, sangle abdominale engagée
      - Commencez avec une résistance faible
      - Débutez avec une longueur de foulée confortable

      ### 2. Mouvement
      1. Commencez le mouvement elliptique vers l'avant
      2. Poussez avec tout le pied, pas seulement les orteils
      3. Utilisez les poignées mobiles pour solliciter le haut du corps si vous le souhaitez
      4. Maintenez une posture droite tout au long de l'exercice
      5. Ajustez résistance et inclinaison selon l'intensité voulue
      6. Continuez pendant la durée souhaitée

      ### 3. Respiration
      - Respirez de façon régulière et rythmée tout au long de l'exercice
      - Augmentez le rythme respiratoire avec l'intensité
      - Ne retenez jamais votre respiration

      ### 4. Conseils
      - Gardez les pieds à plat sur les pédales en permanence
      - Maintenez une posture droite, évitez de vous pencher en avant
      - Utilisez les poignées mobiles pour engager le haut du corps
      - Variez longueur de foulée, inclinaison et résistance
      - Excellent pour un travail cardio à faible impact

      ### 5. Erreurs fréquentes
      - S'appuyer trop lourdement sur les poignées
      - Laisser les talons décoller des pédales
      - Mauvaise posture, épaules arrondies
      - Pousser uniquement avec les orteils au lieu de tout le pied
      - Régler la résistance trop haut au départ
      - Ne pas engager la sangle abdominale pendant le mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une résistance faible et une durée courte
      - Augmentez progressivement l'intensité et la durée
      - Idéal en cas de fragilité articulaire ou de retour de blessure
      - Variez inclinaison et résistance pour des effets d'entraînement différents
