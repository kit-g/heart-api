  Overhead Press (Barbell):
    name: Développé militaire (barre)
    instructions: |
      ## Aperçu
      Le développé militaire à la barre est un exercice polyarticulaire du haut du corps qui cible principalement les trois faisceaux des deltoïdes. Il sollicite aussi les triceps, le haut des pectoraux et la sangle abdominale, ce qui en fait l'un des exercices les plus efficaces pour développer la force globale des épaules et la puissance de poussée du haut du corps.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des épaules, la barre posée sur les supports à hauteur du haut de la poitrine
      - Saisissez la barre légèrement plus large que les épaules, paumes vers l'avant
      - Sortez la barre des supports et tenez-la à hauteur d'épaules
      - Gardez la poitrine haute, la sangle abdominale gainée et les coudes légèrement en avant
      - Maintenez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Poussez la barre bien verticalement au-dessus de la tête en tendant les bras
      2. Reculez légèrement la tête pour laisser passer la barre
      3. Continuez la poussée jusqu'à l'extension complète des bras au-dessus de la tête
      4. Verrouillez les coudes en haut, la barre à l'aplomb du milieu des pieds
      5. Redescendez la barre à hauteur d'épaules en contrôlant
      6. Répétez le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Inspirez et gainez votre sangle abdominale avant de pousser
      - Bloquez votre respiration pendant la poussée
      - Expirez en haut ou pendant la descente de la barre

      ### 4. Conseils
      - Poussez la barre selon une trajectoire bien verticale
      - Gardez la sangle abdominale bien gainée pour éviter de cambrer le bas du dos
      - Tendez complètement les bras en haut
      - Gardez la trajectoire de la barre près du visage
      - Cet exercice peut se faire debout ou assis

      ### 5. Erreurs fréquentes
      - Cambrer excessivement le bas du dos pendant la poussée
      - Pousser la barre vers l'avant plutôt que bien verticalement
      - Ne pas atteindre l'extension complète en haut
      - Écarter exagérément les coudes
      - Utiliser l'élan des jambes (ce qui transforme l'exercice en push press)
      - Ne pas maintenir le gainage tout au long du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser la trajectoire verticale
      - Utilisez un rack avec barres de sécurité si vous vous entraînez seul
      - Effectuez le développé militaire assis pour plus de stabilité
      - En cas de gêne à l'épaule, vérifiez la largeur de votre prise et la trajectoire de la barre
