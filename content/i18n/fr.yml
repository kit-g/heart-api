  Incline Bench Press (Barbell):
    name: Développé incliné (barre)
    instructions: |
      ## Aperçu
      Le développé incliné à la barre est un exercice de poussée polyarticulaire qui cible principalement la partie supérieure du grand pectoral. Il sollicite aussi les deltoïdes antérieurs et les triceps ; la position inclinée du banc met l'accent sur le haut des pectoraux et développe la force de poussée globale.

      ## Exécution
      ### 1. Position de départ
      - Réglez un banc ajustable sur une inclinaison de 30 à 45 degrés
      - Allongez-vous sur le banc, pieds bien à plat au sol
      - Placez-vous de façon que vos yeux soient sous la barre
      - Saisissez la barre avec les mains un peu plus écartées que la largeur des épaules
      - Sortez la barre des supports et tenez-la bras tendus au-dessus du haut de votre poitrine

      ### 2. Mouvement
      1. Descendez la barre lentement vers le haut de votre poitrine ou vos clavicules
      2. Gardez les coudes à environ 45 degrés du corps
      3. Touchez légèrement la poitrine avec la barre
      4. Marquez une brève pause en bas
      5. Repoussez la barre vers le haut en tendant les bras
      6. Tendez complètement les coudes en haut et répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant la barre vers la poitrine
      - Expirez en repoussant la barre vers le haut

      ### 4. Conseils
      - Gardez les omoplates serrées pendant tout le mouvement
      - Maintenez une inclinaison de 30 à 45 degrés pour un engagement optimal du haut des pectoraux
      - Contrôlez la descente et évitez de faire rebondir la barre
      - Gardez les pieds à plat et la sangle abdominale gainée pour rester stable
      - Concentrez-vous sur la contraction du haut des pectoraux en haut du mouvement

      ### 5. Erreurs fréquentes
      - Régler une inclinaison trop forte (plus de 45 degrés), ce qui reporte l'effort sur les épaules
      - Faire rebondir la barre sur la poitrine
      - Laisser les coudes s'écarter excessivement
      - Décoller les fessiers du banc
      - Ne pas travailler sur une amplitude complète
      - Utiliser une charge trop lourde au détriment de la technique

      ### 6. Sécurité et adaptations
      - Faites-vous toujours parer par un partenaire pour les charges lourdes
      - Commencez plus léger qu'à votre développé couché à plat
      - Ajustez l'inclinaison entre 30 et 45 degrés selon votre confort
      - En cas de gêne à l'épaule, ajustez la largeur de prise ou l'angle d'inclinaison
