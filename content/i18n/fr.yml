      ### 4. Conseils
      - Concentrez-vous sur la puissance latérale explosive des jambes
      - Atterrissez en douceur, genoux fléchis, pour absorber l'impact
      - Gardez la poitrine haute et les yeux sur la box
      - Servez-vous des bras pour générer de l'élan latéral
      - Commencez avec une box basse et progressez graduellement

      ### 5. Erreurs fréquentes
      - Atterrir jambes tendues, ce qui augmente le risque de blessure
      - Utiliser une box trop haute pour votre niveau actuel
      - Ne pas atterrir avec les deux pieds en même temps
      - Sauter pour redescendre au lieu de descendre en marchant
      - Perdre l'équilibre pendant le saut latéral
      - Enchaîner les répétitions sans se replacer correctement entre les sauts

      ### 6. Sécurité et adaptations
      - Commencez avec une box basse et stable (30 à 45 cm) pour maîtriser la technique
      - Vérifiez que la box est stable et ne risque pas de glisser ni de basculer
      - Entraînez-vous aux sauts latéraux au sol avant d'ajouter la hauteur de la box
      - Variante avancée : augmentez la hauteur de la box ou enchaînez des sauts latéraux continus sans pause
