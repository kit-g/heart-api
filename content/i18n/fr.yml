      ### 1. Position de départ
      - Ancrez une bande élastique en hauteur à un point solide
      - Tenez-vous debout ou à genoux face au point d'ancrage
      - Saisissez la bande à deux mains en supination (paumes vers vous)
      - Tendez les bras au-dessus de la tête, bande sous tension
      - Gardez la sangle abdominale gainée et le buste droit

      ### 2. Mouvement
      1. Tirez la bande vers votre poitrine en amenant les coudes vers le bas et l'arrière
      2. Gardez le buste droit tout au long du mouvement
      3. Continuez jusqu'à ce que vos mains atteignent le haut de la poitrine ou les épaules
      4. Serrez les omoplates en bas du mouvement
      5. Ramenez lentement les bras au-dessus de la tête, en contrôlant
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en tirant la bande vers le bas
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - La prise en supination permet de garder les coudes plus près du corps
      - Concentrez-vous sur le tirage avec les muscles du dos, pas seulement les bras
      - Gardez la poitrine haute et les épaules en arrière tout au long du mouvement
      - Maintenez une tension constante dans la bande
      - Contrôlez la résistance aussi bien en tirant qu'en relâchant

