  Clean (Barbell):
    name: Épaulé (barre)
    instructions: |
      ## Aperçu
      L'épaulé à la barre est un mouvement explosif d'haltérophilie qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite aussi l'ensemble de la chaîne postérieure, les trapèzes et les épaules, en utilisant une extension de hanches puissante et un tirage pour amener la barre du sol aux épaules.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés de la largeur des hanches, la barre à l'aplomb du milieu du pied
      - Saisissez la barre juste à l'extérieur de vos jambes avec une prise crochet
      - Fléchissez les hanches et les genoux pour atteindre la barre
      - Gardez le dos plat, la poitrine haute et les épaules au-dessus de la barre
      - Engagez vos grands dorsaux et gainez votre sangle abdominale avant de tirer

      ### 2. Mouvement
      1. Poussez explosivement avec les jambes pour décoller la barre du sol
      2. Gardez la barre près de votre corps pendant sa montée
      3. Étendez puissamment les hanches et les genoux quand la barre atteint la mi-cuisse
      4. Passez sous la barre pendant qu'elle monte
      5. Réceptionnez la barre sur vos épaules en position de squat avant
      6. Relevez-vous complètement pour terminer la répétition

      ### 3. Respiration
      - Prenez une profonde inspiration avant de tirer
      - Bloquez votre respiration pendant le tirage et la réception
      - Expirez après vous être relevé

      ### 4. Conseils
      - C'est un mouvement technique avancé qui demande un encadrement
      - Concentrez-vous sur une extension de hanches explosive au bon moment
      - Gardez la trajectoire de la barre près de votre corps tout du long
      - Réceptionnez la barre avec les coudes hauts et vers l'avant
      - Maîtrisez le mouvement avec une charge légère avant de charger

      ### 5. Erreurs fréquentes
      - Démarrer avec les hanches trop hautes ou trop basses
      - Tirer avec les bras trop tôt au lieu d'utiliser les jambes
      - Laisser la barre s'éloigner du corps
      - Ne pas étendre complètement les hanches avant de passer dessous
      - Réceptionner avec les coudes bas ou sans bonne réception
      - Tenter des charges lourdes sans technique adéquate

      ### 6. Sécurité et adaptations
      - Apprenez auprès d'un coach d'haltérophilie qualifié
      - Maîtrisez l'épaulé en suspension avant l'épaulé complet depuis le sol
      - Entraînez-vous d'abord avec un tube en PVC ou une barre à vide
      - Utilisez des disques amortisseurs et un plateau d'haltérophilie pour lâcher la barre en sécurité
