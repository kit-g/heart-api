  Kettlebell Swing:
    name: Swing avec kettlebell
    instructions: |
      ## Aperçu
      Le swing avec kettlebell est un exercice dynamique pour tout le corps qui cible principalement les fessiers, les ischio-jambiers et la sangle abdominale. Il sollicite aussi les épaules, le dos et le système cardiovasculaire, en utilisant une flexion de hanches explosive pour développer puissance, endurance et force de la chaîne postérieure.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds légèrement plus écartés que la largeur des épaules
      - Posez une kettlebell au sol à environ 30 cm devant vous
      - Effectuez une flexion de hanches et saisissez la kettlebell à deux mains
      - Gardez le dos plat, la poitrine haute et la sangle abdominale engagée
      - Ramenez légèrement la kettlebell en arrière entre vos jambes

      ### 2. Mouvement
      1. Poussez explosivement les hanches vers l'avant pour faire monter la kettlebell
      2. Laissez la kettlebell monter jusqu'à hauteur de poitrine ou d'épaules
      3. Gardez les bras tendus et laissez les hanches faire le travail
      4. Quand la kettlebell redescend, refaites une flexion de hanches
      5. Laissez la kettlebell repasser entre vos jambes
      6. Repoussez immédiatement les hanches vers l'avant pour poursuivre le swing

      ### 3. Respiration
      - Expirez avec force en poussant les hanches vers l'avant
      - Inspirez pendant la descente de la kettlebell

      ### 4. Conseils
      - C'est une flexion de hanches, pas un squat
      - La puissance vient des hanches, pas des bras
      - Gardez la sangle abdominale serrée tout au long du mouvement
      - La kettlebell doit sembler sans poids au sommet
      - Maintenez une colonne neutre en permanence

      ### 5. Erreurs fréquentes
      - Faire un squat au lieu d'une flexion de hanches
      - Soulever la kettlebell avec les bras plutôt qu'avec les hanches
      - Cambrer excessivement le dos au sommet du swing
      - Ne pas pousser les hanches vers l'avant de façon explosive
      - Laisser la kettlebell descendre trop bas entre les jambes
      - Arrondir le dos pendant la flexion de hanches

      ### 6. Sécurité et adaptations
      - Commencez avec une kettlebell plus légère pour maîtriser la flexion de hanches
      - Maîtrisez le soulevé de terre avant de tenter les swings avec kettlebell
      - Arrêtez en cas de gêne au bas du dos
      - Variante avancée : swings à un bras ou swings américains (au-dessus de la tête)
