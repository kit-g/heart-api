  Shrug (Barbell):
    name: Haussements d'épaules (barre)
    instructions: |
      ## Aperçu
      Le haussement d'épaules à la barre est un exercice d'isolation qui cible principalement le trapèze supérieur. Il sollicite aussi l'élévateur de la scapula et les rhomboïdes, la barre permettant une charge lourde pour construire des trapèzes épais et puissants et améliorer la stabilité des épaules.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés de la largeur des hanches, une barre en mains
      - Saisissez la barre, mains un peu plus larges que les épaules, paumes vers votre corps
      - Laissez la barre pendre à bout de bras devant vos cuisses
      - Gardez les bras tendus avec une légère flexion des coudes
      - Tenez-vous droit, poitrine haute et sangle abdominale gainée

      ### 2. Mouvement
      1. Élevez vos épaules verticalement vers vos oreilles
      2. Gardez les bras tendus pendant tout le mouvement
      3. Haussez les épaules aussi haut que possible, en vous concentrant sur vos trapèzes
      4. Marquez une pause et contractez vos trapèzes en haut
      5. Redescendez lentement vos épaules à la position de départ
      6. Répétez le nombre de répétitions contrôlées souhaité

      ### 3. Respiration
      - Expirez en haussant les épaules
      - Inspirez en redescendant les épaules

      ### 4. Conseils
      - Concentrez-vous sur une élévation verticale des épaules, sans les faire rouler
      - Gardez les bras tendus pendant tout le mouvement
      - Contractez fortement vos trapèzes en haut de chaque répétition
      - Évitez l'élan et les à-coups sur la charge
      - La barre permet de charger lourdement les trapèzes

      ### 5. Erreurs fréquentes
      - Faire rouler les épaules au lieu de les hausser verticalement
      - Fléchir les coudes et transformer l'exercice en rowing
      - Utiliser l'élan ou tirer la charge par à-coups
      - Ne pas atteindre l'amplitude complète
      - Hausser les épaules vers l'avant ou l'arrière au lieu de la verticale
      - Utiliser une charge trop lourde au détriment de la technique

      ### 6. Sécurité et adaptations
      - Commencez avec une charge modérée pour maîtriser le haussement vertical
      - Utilisez des sangles de tirage si votre prise limite l'exercice
      - Effectuez des haussements d'épaules barre derrière le dos pour varier
      - En cas de gêne à la nuque, réduisez la charge et vérifiez votre technique
