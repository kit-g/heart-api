  Pendlay Row (Barbell):
    name: Rowing Pendlay (barre)
    instructions: |
      ## Aperçu
      Le rowing Pendlay est un exercice de rowing explosif à la barre qui cible principalement le grand dorsal, les rhomboïdes et les trapèzes moyens. Il sollicite aussi le bas du dos et les ischio-jambiers, l'arrêt complet au sol entre les répétitions éliminant l'élan et maximisant le développement de la puissance.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés de la largeur des hanches, barre au sol au-dessus du milieu du pied
      - Penchez-vous par une flexion de hanches jusqu'à ce que votre buste soit parallèle au sol
      - Saisissez la barre en pronation, mains un peu plus écartées que la largeur des épaules
      - Gardez le dos plat, la poitrine tournée vers le sol et les bras complètement tendus
      - Gainez votre sangle abdominale et engagez vos grands dorsaux avant chaque répétition

      ### 2. Mouvement
      1. Tirez la barre de façon explosive vers le bas de la poitrine ou le haut de l'abdomen
      2. Amenez les coudes vers l'arrière et le haut dans un mouvement puissant
      3. Touchez votre buste avec la barre en haut du mouvement
      4. Serrez brièvement les omoplates
      5. Reposez la barre au sol en contrôlant
      6. Laissez la barre s'immobiliser complètement au sol avant d'entamer la répétition suivante

      ### 3. Respiration
      - Inspirez et gainez avant chaque répétition
      - Expirez pendant le tirage ou après avoir terminé la répétition

      ### 4. Conseils
      - Gardez le buste parallèle au sol tout au long du mouvement
      - Chaque répétition doit partir d'un arrêt complet au sol
      - Tirez de façon explosive tout en gardant le contrôle
      - Gardez le dos plat et la sangle abdominale gainée
      - Concentrez-vous sur la production de puissance avec les muscles du dos

      ### 5. Erreurs fréquentes
      - Ne pas ramener la barre à un arrêt complet au sol
      - Redresser le buste pendant le tirage au lieu de rester parallèle au sol
      - Profiter du rebond de la barre au sol pour créer de l'élan
      - Arrondir le dos pendant le mouvement
      - Ne pas tirer la barre assez haut pour toucher le buste
      - Exécuter trop lentement et perdre le caractère explosif

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser la technique de l'arrêt complet
      - Veillez à garder le dos plat tout au long du mouvement pour protéger votre colonne
      - Utilisez de petits disques posés sur une plateforme si besoin pour obtenir la bonne hauteur de départ
      - En cas de gêne dans le bas du dos, réduisez la charge et vérifiez votre technique
