      ### 2. Mouvement
      1. Étendez les jambes en contractant les quadriceps
      2. Continuez jusqu'à l'extension complète des jambes
      3. Marquez une pause et contractez les quadriceps en pleine extension
      4. Redescendez lentement la charge à la position de départ, en contrôlant le mouvement
      5. Arrêtez-vous juste avant que la pile de poids ne se repose, afin de maintenir la tension
      6. Répétez le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en étendant les jambes
      - Inspirez en redescendant la charge

      ### 4. Conseils
      - Gardez le dos fermement appuyé contre le dossier
      - Concentrez-vous sur la contraction des quadriceps en pleine extension
      - Contrôlez à la fois la phase d'extension et la phase de descente
      - Maintenez une tension constante en ne laissant pas la pile de poids se reposer
      - Pointez les orteils droit devant ou légèrement vers le haut

