  Pull Up:
    name: Tractions
    instructions: |
      ## Aperçu
      Les tractions sont un exercice de tirage au poids du corps qui cible principalement le grand dorsal. Elles sollicitent aussi les rhomboïdes, les trapèzes moyens, les biceps et la sangle abdominale, ce qui en fait l'un des exercices les plus efficaces pour le haut du corps, pour développer la largeur du dos et la force de tirage.

      ## Exécution
      ### 1. Position de départ
      - Suspendez-vous à une barre de traction en pronation, mains un peu plus écartées que la largeur des épaules
      - Laissez votre corps pendre en extension complète, bras tendus
      - Gainez votre sangle abdominale et gardez les épaules tirées vers le bas
      - Croisez les chevilles ou gardez les jambes tendues
      - Évitez les balancements excessifs

      ### 2. Mouvement
      1. Hissez-vous en amenant les coudes vers le bas et l'arrière
      2. Menez avec la poitrine et gardez les épaules en arrière
      3. Continuez à tirer jusqu'à ce que votre menton dépasse la barre
      4. Gardez la sangle abdominale gainée tout au long du mouvement
      5. Marquez une brève pause en haut
      6. Redescendez lentement jusqu'à la position de départ, bras complètement tendus

      ### 3. Respiration
      - Expirez en vous hissant
      - Inspirez en redescendant

      ### 4. Conseils
      - Pensez à tirer les coudes vers le bas plutôt qu'à monter le menton
      - Gardez les épaules engagées et évitez qu'elles remontent en haussement
      - Contrôlez la descente pour un engagement musculaire maximal
      - Visez l'amplitude complète, de la suspension bras tendus au menton au-dessus de la barre
      - Gardez la sangle abdominale gainée pour limiter les balancements

      ### 5. Erreurs fréquentes
      - Utiliser l'élan ou le kipping au lieu d'une exécution stricte
      - Ne pas atteindre l'amplitude complète en haut ou en bas
      - Laisser les épaules remonter vers les oreilles
      - Se balancer excessivement pendant le mouvement
      - Ne pas tendre complètement les bras en bas
      - Tirer uniquement avec les bras au lieu d'engager le dos

      ### 6. Sécurité et adaptations
      - Utilisez une machine à tractions assistées ou une bande élastique en soutien
      - Réalisez des tractions négatives (sautez en haut et redescendez lentement) pour gagner en force
      - Variante avancée : ajoutez du lest avec une ceinture de lest ou un gilet lesté
      - Progressez graduellement pour éviter de contraindre les épaules
