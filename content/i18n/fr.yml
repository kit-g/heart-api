  Wrist Roller:
    name: Rouleau de poignets
    instructions: |
      ## Aperçu
      Le rouleau de poignets est un exercice pour les avant-bras qui cible principalement les fléchisseurs et extenseurs des poignets. Il sollicite aussi les muscles de la préhension et les avant-bras grâce à un mouvement d'enroulement continu, ce qui en fait un exercice efficace pour développer la force et l'endurance des avant-bras.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous droit, un rouleau de poignets dans les deux mains
      - Saisissez la poignée en pronation, paumes vers le bas
      - Tendez les bras droit devant vous à hauteur des épaules
      - Gardez les pieds écartés à la largeur des épaules et la sangle abdominale gainée
      - Assurez-vous que la charge pend librement au bout de la corde

      ### 2. Mouvement
      1. Commencez à enrouler la poignée en fléchissant alternativement chaque poignet
      2. Enroulez la corde vers le haut, en remontant la charge vers la poignée
      3. Gardez les bras tendus et parallèles au sol tout au long du mouvement
      4. Continuez à enrouler jusqu'à ce que la charge arrive en haut
      5. Inversez le mouvement en déroulant lentement la corde vers le bas
      6. Restez maître du mouvement pendant l'enroulement comme pendant le déroulement

      ### 3. Respiration
      - Respirez de façon régulière et naturelle tout au long du mouvement
      - Évitez de retenir votre souffle pendant le mouvement d'enroulement continu

      ### 4. Conseils
      - Gardez les bras tendus à hauteur des épaules tout au long de l'exercice
      - Privilégiez des mouvements de poignets contrôlés plutôt que l'élan
      - Maintenez un mouvement régulier et continu, sans pause
      - Gardez les poignets alignés avec les avant-bras
