  Bent Over One Arm Row (Dumbbell):
    name: Rowing à un bras (haltère)
    instructions: |
      ## Aperçu
      Le rowing à un bras avec haltère est un exercice de tirage unilatéral qui cible principalement le grand dorsal, les rhomboïdes et la partie moyenne des trapèzes. Il sollicite aussi les biceps et les deltoïdes postérieurs, et permet de corriger les déséquilibres de force tout en offrant une amplitude supérieure à celle des rowings bilatéraux.

      ## Exécution
      ### 1. Position de départ
      - Placez un genou et la main du même côté sur un banc plat pour vous appuyer
      - Posez l'autre pied au sol, genou légèrement fléchi
      - Tenez un haltère dans la main libre, bras tendu vers le sol
      - Gardez le dos plat et parallèle au sol
      - Gainez votre sangle abdominale et maintenez une colonne neutre

      ### 2. Mouvement
      1. Tirez l'haltère vers le haut en dirigeant votre coude vers le plafond
      2. Gardez le coude près du corps pendant le tirage
      3. Continuez jusqu'à ce que l'haltère atteigne votre hanche ou le bas de vos côtes
      4. Serrez l'omoplate vers la colonne en haut du mouvement
      5. Redescendez lentement l'haltère à la position de départ, en contrôlant le mouvement
      6. Effectuez toutes les répétitions d'un côté, puis passez à l'autre côté

      ### 3. Respiration
      - Expirez en tirant l'haltère vers le haut
      - Inspirez en le redescendant

      ### 4. Conseils
      - Menez le mouvement avec le coude, pas avec la main
      - Gardez le buste stable et évitez toute rotation
      - Concentrez-vous sur la contraction des muscles du dos en haut du mouvement
      - Maintenez le dos plat tout au long de l'exercice
      - Contrôlez la charge dans les deux sens

      ### 5. Erreurs fréquentes
      - Faire pivoter le buste au lieu de le garder stable
      - Utiliser l'élan pour balancer la charge vers le haut
      - Ne pas travailler sur l'amplitude complète
      - Arrondir le dos au lieu de le garder plat
      - Tirer avec le bras plutôt qu'avec les muscles du dos
      - Bouger trop vite et perdre le contrôle

      ### 6. Sécurité et adaptations
      - Commencez avec une charge modérée pour maîtriser la technique
      - Sans banc, penchez-vous en fléchissant les hanches et posez la main libre sur votre cuisse
      - Variante avancée : marquez une pause de 2 à 3 secondes en haut de chaque répétition
      - Effectuez le même nombre de répétitions de chaque côté pour un développement équilibré
