  Superman:
    name: Superman
    instructions: |
      ## Aperçu
      Le superman est un exercice au poids du corps pour le tronc qui cible principalement le bas du dos (érecteurs du rachis) et les fessiers. Il sollicite aussi le haut du dos, les épaules et les ischio-jambiers, ce qui en fait un exercice efficace pour renforcer la chaîne postérieure et améliorer l'extension de la colonne.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous face contre sol sur un tapis, bras tendus au-dessus de la tête
      - Gardez les jambes droites et jointes, complètement tendues derrière vous
      - Posez le front sur le tapis, nuque en position neutre
      - Contractez la sangle abdominale et les fessiers avant de commencer le mouvement
      - Gardez les pointes de pieds étirées tout au long de l'exercice

      ### 2. Mouvement
      1. Décollez simultanément les bras, la poitrine et les jambes du tapis
      2. Montez-les aussi haut que le confort le permet, en contractant le bas du dos et les fessiers
      3. Gardez les bras et les jambes tendus tout au long du mouvement
      4. Marquez une courte pause en haut, en serrant la chaîne postérieure
      5. Redescendez lentement les bras, la poitrine et les jambes sur le tapis avec contrôle
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en décollant les bras, la poitrine et les jambes du tapis
      - Inspirez en redescendant vers la position de départ

      ### 4. Conseils
      - Concentrez-vous sur la contraction du bas du dos et des fessiers en haut du mouvement
      - Gardez la nuque neutre en regardant vers le tapis
      - Montez avec contrôle plutôt qu'avec de l'élan
      - Gardez les bras et les jambes tendus tout au long du mouvement
      - Imaginez que vous allongez votre corps du bout des doigts jusqu'aux orteils

      ### 5. Erreurs fréquentes
      - Lever la tête et le cou trop haut, ce qui peut créer des tensions
      - Fléchir les bras ou les jambes pendant le mouvement
      - Utiliser l'élan au lieu d'une contraction musculaire contrôlée
      - Ne pas engager les fessiers et ne compter que sur le bas du dos
      - Aller trop vite au détriment de la technique
      - Retenir sa respiration pendant l'exercice

      ### 6. Sécurité et adaptations
      - Les débutants peuvent ne lever que les bras ou que les jambes le temps de se renforcer
      - Réduisez l'amplitude si vous ressentez une gêne dans le bas du dos
      - Variante avancée : maintenez la position haute 3-5 secondes pour plus d'intensité
      - Progressez vers le superman alterné (bras et jambe opposés) pour varier
