    instructions: |
      ## Aperçu
      Le curl sur banc incliné avec haltères est un exercice d'isolation qui cible principalement le biceps brachial avec une amplitude accrue. Il sollicite également le brachial antérieur et le brachio-radial, la position inclinée créant un étirement plus important du biceps au départ de chaque répétition.

      ## Exécution
      ### 1. Position de départ
      - Réglez un banc ajustable sur une inclinaison de 45 à 60 degrés
      - Asseyez-vous, le dos fermement appuyé contre le dossier
      - Tenez un haltère dans chaque main, bras tendus vers le bas
      - Gardez les paumes vers l'avant et les coudes légèrement en arrière du buste
      - Maintenez la poitrine haute et la sangle abdominale gainée

      ### 2. Mouvement
      1. Montez les deux haltères en fléchissant les coudes et en contractant les biceps
      2. Gardez les bras immobiles et perpendiculaires au sol
      3. Continuez à monter jusqu'à ce que les haltères atteignent la hauteur des épaules
      4. Marquez une pause et contractez les biceps en haut du mouvement
      5. Redescendez lentement les haltères jusqu'à la position de départ, bras complètement tendus
      6. Répétez le mouvement de façon contrôlée pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Expirez en montant les haltères
      - Inspirez en les redescendant

      ### 4. Conseils
      - Gardez les bras immobiles et perpendiculaires au sol pendant tout le mouvement
      - Laissez les bras se tendre complètement en bas pour un étirement maximal
      - Évitez tout balancement ou recours à l'élan pour soulever la charge
      - Gardez le dos fermement appuyé contre le banc
      - Concentrez-vous sur l'étirement en bas et la contraction en haut

      ### 5. Erreurs fréquentes
      - Laisser les coudes avancer pendant le curl
      - Ne pas tendre complètement les bras en bas
      - Décoller les épaules du banc
      - Utiliser l'élan ou balancer les haltères
      - Choisir une inclinaison trop forte ou trop faible
      - Utiliser une charge trop lourde au détriment de la technique

      ### 6. Sécurité et adaptations
      - Commencez plus léger que pour des curls classiques en raison de l'amplitude accrue
      - Ajustez l'angle du banc entre 45 et 60 degrés pour trouver votre position optimale
      - Effectuez des curls alternés (un bras à la fois) pour une meilleure concentration
      - Variante avancée : ajoutez une phase négative de 3 à 5 secondes pour augmenter l'intensité
