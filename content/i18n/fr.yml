      - Expirez en poussant les hanches vers l'avant pour vous redresser

      ### 4. Conseils
      - Gardez les jambes presque tendues tout au long du mouvement
      - Concentrez-vous sur la flexion de hanches, pas sur un squat
      - Gardez le dos plat et la poitrine haute tout au long du mouvement
      - Poussez les hanches vers l'arrière aussi loin que possible
      - Ressentez l'étirement dans les ischio-jambiers en bas du mouvement

      ### 5. Erreurs fréquentes
      - Arrondir le dos au lieu de maintenir une colonne plate
      - Fléchir trop les genoux, ce qui transforme l'exercice en soulevé de terre roumain
      - Ne pas pousser les hanches assez loin vers l'arrière
      - Abaisser les haltères trop bas, au-delà du point d'étirement des ischio-jambiers
      - Utiliser une charge trop lourde au détriment de la technique
      - Regarder vers le haut au lieu de garder la nuque en position neutre

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères légers pour maîtriser la flexion de hanches jambes tendues
      - Progressez à partir des soulevés de terre roumains si cette variante semble trop intense
      - La variante avec haltères permet une prise plus naturelle qu'avec une barre
      - Si vous ressentez une gêne dans le bas du dos, réduisez la charge et vérifiez votre technique
