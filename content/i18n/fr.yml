  Step-up (Bodyweight):
    name: Montées sur box (poids du corps)
    instructions: |
      ## Aperçu
      La montée sur box au poids du corps est un exercice unilatéral du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite également la sangle abdominale et les muscles stabilisateurs, en utilisant le poids du corps et une plateforme surélevée pour développer la force sur une jambe, l'équilibre et des schémas de mouvement fonctionnels.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous face à un box stable ou à un banc à hauteur de genou ou plus bas
      - Gardez la poitrine haute, la sangle abdominale gainée et le regard vers l'avant
      - Placez vos bras le long du corps ou sur vos hanches
      - Maintenez une bonne posture tout au long du mouvement

      ### 2. Mouvement
      1. Posez un pied entièrement sur le box
      2. Poussez sur le talon du pied surélevé pour monter
      3. Amenez l'autre pied à côté du premier sur le box
      4. Redressez-vous complètement debout sur le box
      5. Redescendez avec la jambe qui est montée en premier
      6. Répétez pour le nombre de répétitions souhaité, puis changez de jambe

      ### 3. Respiration
      - Inspirez avant de monter
      - Expirez en poussant pour monter sur le box

      ### 4. Conseils
      - Poussez sur le talon de la jambe surélevée, pas sur les orteils
      - Évitez de vous propulser avec la jambe arrière
      - Gardez la poitrine haute et le buste droit tout au long du mouvement
      - Concentrez-vous sur un mouvement contrôlé dans les deux sens
      - Commencez avec un box bas et progressez graduellement

      ### 5. Erreurs fréquentes
      - Utiliser l'élan de la jambe arrière pour se propulser
      - Se pencher trop en avant pendant la montée
      - Ne pas poser le pied entier sur le box
      - Laisser le genou rentrer vers l'intérieur
      - Utiliser un box trop haut pour une technique correcte
      - Ne pas se redresser complètement sur le box

      ### 6. Sécurité et adaptations
      - Assurez-vous que le box est stable et ne peut ni glisser ni basculer
      - Commencez avec un box bas (12-18 pouces, soit environ 30-45 cm) pour maîtriser la technique
      - Tenez-vous à un support pour l'équilibre au début
      - Variante avancée : ajoutez des haltères, une barre, ou augmentez la hauteur du box
