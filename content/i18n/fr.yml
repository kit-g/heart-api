      ### 1. Position de départ
      - Allongez-vous à plat sur le dos sur un tapis, jambes tendues
      - Placez les mains le long des hanches ou sous les fessiers pour vous soutenir
      - Plaquez le bas du dos contre le tapis et engagez la sangle abdominale
      - Gardez la tête et les épaules détendues sur le tapis
      - Maintenez la nuque en position neutre en regardant le plafond

      ### 2. Mouvement
      1. Fléchissez les genoux et remontez-les vers la poitrine en contractant le bas des abdominaux
      2. Continuez jusqu'à ce que les genoux soient directement au-dessus des hanches ou légèrement au-delà
      3. Gardez le bas du dos plaqué contre le tapis pendant tout le mouvement
      4. Marquez une brève pause en haut du mouvement
      5. Redescendez lentement les genoux de manière contrôlée
      6. Arrêtez-vous juste avant que les pieds ne touchent le sol pour maintenir la tension, puis répétez

      ### 3. Respiration
      - Expirez pendant que vous remontez les genoux vers la poitrine
      - Inspirez en redescendant les genoux à la position de départ

