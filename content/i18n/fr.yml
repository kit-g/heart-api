  Hammer Curl (Band):
    name: Curl marteau (bande)
    instructions: |
      ## Aperçu
      Le curl marteau avec bande est un exercice d'isolation qui cible principalement le brachial antérieur et le brachio-radial. Il sollicite aussi le biceps brachial, la prise neutre mettant l'accent sur le développement des avant-bras et de la partie externe des biceps avec une résistance progressive.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, en marchant sur le centre d'une bande élastique
      - Saisissez chaque extrémité de la bande, paumes face à face (prise neutre)
      - Laissez les bras pendre le long du corps avec une légère tension sur la bande
      - Gardez les coudes près du corps tout au long du mouvement
      - Maintenez une posture droite avec la sangle abdominale gainée

      ### 2. Mouvement
      1. Montez la bande en fléchissant les coudes tout en gardant les paumes face à face
      2. Gardez le haut des bras immobile et collé au buste
      3. Continuez à monter jusqu'à ce que les mains atteignent la hauteur des épaules
      4. Marquez une pause et contractez en haut du mouvement
      5. Redescendez lentement les mains vers la position de départ avec contrôle
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en montant la bande
      - Inspirez en redescendant les mains

      ### 4. Conseils
      - Maintenez la prise neutre (marteau) pendant tout le mouvement
      - Gardez les coudes immobiles et près du corps
      - Évitez tout balancement ou élan pour monter la bande
      - Concentrez-vous sur la contraction en haut de chaque répétition
      - Contrôlez la résistance aussi bien en montée qu'en descente

      ### 5. Erreurs fréquentes
      - Faire pivoter les poignets au lieu de garder la prise neutre
      - Laisser les coudes avancer pendant le curl
      - Utiliser l'élan ou le balancement du corps pour monter la bande
      - Ne pas travailler sur une amplitude complète
      - Relâcher la tension de la bande en bas
      - Enchaîner les répétitions trop rapidement

      ### 6. Sécurité et adaptations
      - Commencez avec une bande de résistance plus légère pour maîtriser le schéma en prise neutre
      - Réalisez des curls marteau alternés (un bras à la fois) pour une meilleure concentration
      - Variante avancée : utilisez une bande plus résistante ou marquez une pause en haut
      - Ajustez la position de vos pieds sur la bande pour moduler la résistance
