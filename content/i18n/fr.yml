  Arnold Press (Dumbbell):
    name: Développé Arnold (haltères)
    instructions: |
      ## Aperçu
      Le développé Arnold est un exercice polyarticulaire pour les épaules qui cible principalement les trois faisceaux des deltoïdes. Il sollicite également les triceps et le haut des pectoraux, en utilisant un développé avec haltères et rotation pour offrir un développement complet des épaules grâce à une amplitude de mouvement unique.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur un banc avec dossier, un haltère dans chaque main
      - Placez les haltères à hauteur des épaules, paumes tournées vers votre corps
      - Gardez les coudes devant votre buste
      - Gainez votre sangle abdominale et gardez le dos plaqué contre le dossier
      - Posez les pieds à plat sur le sol

      ### 2. Mouvement
      1. Poussez les haltères vers le haut tout en tournant les paumes vers l'extérieur
      2. Continuez à pousser et à tourner jusqu'à ce que les bras soient complètement tendus au-dessus de la tête
      3. En haut, les paumes doivent être tournées vers l'avant
      4. Marquez une brève pause en haut
      5. Inversez le mouvement en tournant les paumes vers l'intérieur pendant la descente
      6. Revenez à la position de départ, paumes tournées vers votre corps, et répétez

      ### 3. Respiration
      - Inspirez en position de départ
      - Expirez en poussant les haltères vers le haut
      - Inspirez en redescendant les haltères

      ### 4. Conseils
      - La rotation doit être fluide et contrôlée tout au long du mouvement
      - Gardez la sangle abdominale gainée pour protéger le bas du dos
      - Concentrez-vous autant sur la rotation que sur le développé
      - Contrôlez également les phases de poussée et de descente
      - Cette rotation unique cible les trois faisceaux des deltoïdes

      ### 5. Erreurs fréquentes
      - Tourner trop rapidement et perdre le contrôle
      - Cambrer excessivement le bas du dos
      - Ne pas effectuer la rotation complète
      - Utiliser une charge trop lourde au détriment de la technique
      - Laisser les coudes s'écarter trop tôt
      - Précipiter le mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères plus légers que pour un développé épaules classique
      - Maîtrisez le schéma de rotation avant d'ajouter de la charge
      - Effectuez l'exercice debout pour un défi supplémentaire de gainage
      - Si vous ressentez une gêne à l'épaule, réduisez la charge ou l'amplitude de mouvement
    validated: false
    source_digest: d8f0bdd24d23
  Halo:
    name: Halo
    instructions: |
      ## Aperçu
      Le halo est un exercice dynamique de mobilité des épaules qui cible principalement les deltoïdes et les muscles de la coiffe des rotateurs. Il sollicite aussi la sangle abdominale et le haut du dos, en utilisant un mouvement circulaire autour de la tête pour améliorer la mobilité, la stabilité et la coordination des épaules.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des épaules, ou agenouillez-vous pour plus de stabilité
      - Tenez un haltère ou un kettlebell par les cornes, à hauteur de poitrine
      - Gardez la poitrine haute, la sangle abdominale gainée et le regard vers l'avant
      - Maintenez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Faites tourner la charge autour de votre tête d'un mouvement contrôlé
      2. Gardez la charge près de la tête pendant tout le trajet
      3. Maintenez le buste droit et le bas du corps stable
      4. Complétez le cercle et revenez à la position de départ
      5. Répétez le nombre de répétitions souhaité dans un sens
      6. Changez de sens et effectuez le même nombre de répétitions

      ### 3. Respiration
      - Respirez de façon régulière et rythmée tout au long du mouvement
      - Évitez de retenir votre souffle

      ### 4. Conseils
      - Gardez la charge près de la tête tout au long du cercle
      - Concentrez-vous sur un mouvement fluide et contrôlé
      - Gardez la sangle abdominale bien gainée pour empêcher la rotation du buste
      - Commencez avec une charge légère pour maîtriser le schéma de mouvement
      - Cet exercice est excellent pour l'échauffement et la mobilité des épaules

      ### 5. Erreurs fréquentes
      - Utiliser une charge trop lourde et perdre le contrôle
      - Laisser le buste tourner avec la charge
      - Effectuer les cercles trop rapidement
      - Ne pas garder la charge près de la tête
      - Cambrer le bas du dos pendant le mouvement
      - Retenir son souffle

      ### 6. Sécurité et adaptations
      - Commencez avec un haltère ou un kettlebell très léger
      - Agenouillez-vous pour plus de stabilité si l'équilibre pose problème
      - Utilisez cet exercice en échauffement avant l'entraînement des épaules
      - Réduisez l'amplitude si vous ressentez une gêne à l'épaule
