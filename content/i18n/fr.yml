  Skiing:
    name: Ski
    instructions: |
      ## Aperçu
      Le ski est une activité complète, cardiovasculaire et de renforcement, qui sollicite principalement les jambes, la sangle abdominale et le système cardiovasculaire. Qu'il s'agisse de ski alpin ou de ski de fond, il développe la force des jambes, l'équilibre et l'endurance, et offre un entraînement hivernal grisant en plein air.

      ## Exécution
      ### 1. Sécurité
      - Prenez des leçons avec des moniteurs qualifiés
      - Portez toujours un casque
      - Skiez selon votre niveau
      - Vérifiez la météo et les conditions d'avalanche
