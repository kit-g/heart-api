  Seated Leg Press (Machine):
    name: Presse à cuisses assise (machine)
    instructions: |
      ## Aperçu
      La presse à cuisses assise est un exercice polyarticulaire du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Elle utilise une machine assise avec un dossier plus redressé que les presses à cuisses classiques, offrant une résistance stable avec des contraintes réduites sur le bas du dos.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous dans la presse à cuisses assise, le dos fermement appuyé contre le dossier
      - Placez les pieds sur la plateforme, écartés à la largeur des épaules
      - Gardez les pieds à plat, orteils légèrement tournés vers l'extérieur
      - Déverrouillez les poignées de sécurité si la machine en est équipée
      - Gardez la sangle abdominale engagée et les mains sur les poignées

      ### 2. Mouvement
      1. Poussez la plateforme vers l'avant en étendant les jambes
      2. Continuez jusqu'à l'extension complète des jambes sans verrouiller les genoux
      3. Marquez une brève pause en pleine extension
      4. Fléchissez lentement les genoux pour ramener la plateforme à la position de départ
      5. Continuez jusqu'à ce que les genoux atteignent environ 90 degrés
      6. Répétez le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en poussant la plateforme vers l'avant
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez le dos et les hanches fermement appuyés contre les dossiers
      - Poussez avec tout le pied, pas seulement avec les orteils
      - Évitez de verrouiller complètement les genoux en pleine extension
      - Gardez les genoux alignés avec les orteils
      - Maintenez une tension constante tout au long du mouvement

      ### 5. Erreurs fréquentes
      - Décoller les fessiers ou le bas du dos du dossier
      - Verrouiller complètement les genoux en pleine extension
      - Laisser les genoux rentrer vers l'intérieur
      - Ne pas descendre suffisamment (au moins 90 degrés)
      - Utiliser une charge trop lourde au détriment de la technique
      - Placer les pieds trop bas sur la plateforme, ce qui augmente les contraintes sur les genoux

      ### 6. Sécurité et adaptations
      - Variez la position des pieds (plus haut, plus bas, plus large, plus serré) pour cibler différents muscles
      - Ne verrouillez jamais complètement les genoux afin de protéger l'articulation
      - Commencez avec une charge modérée pour maîtriser la technique
      - Variante avancée : travaillez sur une jambe ou ajoutez une pause en bas
