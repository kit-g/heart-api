  Hanging Knee Raise:
    name: Relevé de genoux suspendu
    instructions: |
      ## Aperçu
      Le relevé de genoux suspendu est un exercice de gainage au poids du corps qui cible principalement la partie basse du grand droit de l'abdomen et les fléchisseurs de hanche. Il sollicite également les obliques, le transverse et la force de préhension puisque vous êtes suspendu à une barre, ce qui le rend plus exigeant que les variantes au sol.

      ## Exécution
      ### 1. Position de départ
      - Suspendez-vous à une barre de traction, mains écartées de la largeur des épaules, en pronation
      - Laissez votre corps pendre en pleine extension, pieds décollés du sol
      - Engagez la sangle abdominale et gardez les épaules abaissées et tirées vers l'arrière
      - Gardez les jambes serrées avec les genoux légèrement fléchis
      - Évitez les balancements excessifs en stabilisant votre corps

      ### 2. Mouvement
      1. Remontez les genoux vers la poitrine en contractant le bas des abdominaux
      2. Continuez à monter les genoux au moins jusqu'au niveau des hanches, ou plus haut
      3. Gardez le mouvement contrôlé et évitez d'utiliser l'élan
      4. Marquez une brève pause en haut du mouvement
      5. Redescendez lentement les genoux à la position de départ de manière contrôlée
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez pendant que vous remontez les genoux vers la poitrine
      - Inspirez en redescendant les genoux à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur l'initiation du mouvement à partir de la sangle abdominale, pas seulement des fléchisseurs de hanche
      - Minimisez les balancements en gardant la sangle abdominale contractée et le mouvement contrôlé
      - Gardez les épaules engagées et évitez de pendre passivement
      - Pensez à amener les hanches vers l'avant et vers le haut, pas seulement les genoux
      - Respirez régulièrement pour éviter de retenir votre souffle

      ### 5. Erreurs fréquentes
      - Utiliser l'élan et se balancer au lieu d'une contraction musculaire contrôlée
      - Ne lever les genoux que partiellement sans engager pleinement le bas des abdominaux
      - Laisser les épaules remonter vers les oreilles
      - Aller trop vite et perdre le contrôle
      - Relâcher la tension de la prise, ce qui compromet la technique
      - Ne pas monter les genoux assez haut pour engager efficacement les abdominaux

      ### 6. Sécurité et adaptations
      - Les débutants peuvent utiliser des sangles de poignet pour un meilleur soutien de la prise
      - Utilisez une chaise romaine ou une station à dips pour une version assistée
      - Variante avancée : marquez une pause de 2 à 3 secondes en haut de chaque répétition
      - Passez au relevé de jambes suspendu une fois le relevé de genoux maîtrisé avec une bonne technique
