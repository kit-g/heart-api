  Jump Shrug (Barbell):
    name: Haussement d'épaules sauté (barre)
    instructions: |
      ## Aperçu
      Le haussement d'épaules sauté à la barre est un exercice accessoire explosif d'haltérophilie qui cible principalement les trapèzes, les mollets et les fessiers. Il enseigne la triple extension explosive (chevilles, genoux, hanches) essentielle aux mouvements d'haltérophilie tout en développant la puissance et les trapèzes.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés de la largeur des hanches, une barre en mains
      - Placez la barre à mi-cuisse, bras tendus
      - Gardez la poitrine haute, le dos plat et la sangle abdominale gainée
      - Saisissez la barre juste à l'extérieur de vos jambes
      - Conservez une légère flexion des genoux

      ### 2. Mouvement
      1. Fléchissez légèrement les genoux
      2. Étendez explosivement les chevilles, les genoux et les hanches pour sauter vers le haut
      3. Haussez puissamment les épaules au sommet du saut
      4. Atterrissez en douceur, genoux fléchis
      5. Replacez-vous en position de départ
      6. Répétez le nombre de répétitions explosives souhaité

      ### 3. Respiration
      - Inspirez pendant la flexion
      - Expirez explosivement pendant le saut et le haussement

      ### 4. Conseils
      - Recherchez une puissance explosive maximale à chaque répétition
      - Le haussement doit se produire à l'extension complète
      - Gardez les bras tendus pendant tout le mouvement
      - Cet exercice enseigne la triple extension pour l'haltérophilie
      - Utilisez une charge plus légère pour conserver la vitesse explosive

      ### 5. Erreurs fréquentes
      - Tirer avec les bras au lieu d'utiliser les jambes et le haussement
      - Ne pas étendre complètement les chevilles, les genoux et les hanches
      - Fléchir trop profondément avant le saut
      - Utiliser trop de charge et perdre la qualité explosive
      - Atterrir jambes tendues
      - Ne pas hausser les épaules au sommet du saut

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser le mouvement explosif
      - Atterrissez en douceur pour protéger vos articulations
      - C'est un exercice accessoire pour l'haltérophilie
      - Utilisez-le pour développer la puissance des épaulés et des arrachés
