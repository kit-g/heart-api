  Glute Kickback (Machine):
    name: Extension de la hanche vers l'arrière (machine)
    instructions: |
      ## Aperçu
      L'extension de la hanche vers l'arrière à la machine est un exercice d'isolation qui cible principalement les fessiers. Il sollicite aussi les ischio-jambiers, la trajectoire guidée offrant stabilité et résistance constante tout au long du mouvement d'extension de hanche.

      ## Exécution
      ### 1. Position de départ
      - Installez-vous sur la machine selon sa conception
      - Placez un pied sur la plateforme, genou fléchi
      - Saisissez les poignées pour la stabilité
      - Gardez le buste stable et la sangle abdominale gainée
      - Alignez la hanche travaillante avec l'axe de rotation de la machine

      ### 2. Mouvement
      1. Poussez la plateforme vers l'arrière en étendant la hanche
      2. Gardez le genou légèrement fléchi tout au long du mouvement
      3. Continuez jusqu'à ce que la jambe soit complètement étendue derrière vous
      4. Contractez fortement le fessier en pleine extension
      5. Ramenez lentement la plateforme à la position de départ de façon contrôlée
      6. Effectuez toutes les répétitions d'un côté, puis recommencez de l'autre côté

      ### 3. Respiration
      - Expirez en étendant la jambe vers l'arrière
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur le fessier pour conduire le mouvement
      - Gardez le buste stable et évitez de cambrer le dos
      - Contractez fortement le fessier en pleine extension
      - Contrôlez la phase d'extension comme la phase de retour
      - Maintenez une tension constante en ne laissant pas la charge se reposer

      ### 5. Erreurs fréquentes
      - Cambrer excessivement le bas du dos pendant l'extension
      - Utiliser l'élan au lieu d'une contraction contrôlée du fessier
      - Ne pas atteindre l'extension complète de la hanche
      - Laisser la charge se reposer entre les répétitions
      - Faire pivoter les hanches ou le buste pendant le mouvement
      - Utiliser une charge trop lourde au détriment de la technique

      ### 6. Sécurité et adaptations
      - Ajustez les réglages de la machine à votre morphologie
      - Commencez avec une charge légère pour établir une bonne technique
      - Concentrez-vous sur la contraction du fessier plutôt que sur la hauteur du mouvement
      - Variante avancée : marquez une pause de 2-3 secondes en pleine extension
