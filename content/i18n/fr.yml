  Push Up - Close Grip:
    name: Pompes prise serrée
    instructions: |
      ## Aperçu
      Les pompes prise serrée sont un exercice de poussée au poids du corps qui cible principalement les triceps. Le rapprochement des mains transfère le travail des pectoraux vers les bras, tandis que les pectoraux, les épaules et la sangle abdominale assistent le mouvement du début à la fin.

      ## Exécution
      ### 1. Position de départ
      - Placez-vous en planche, les mains directement sous la poitrine
      - Placez les mains plus serrées que la largeur des épaules, pouces presque en contact
      - Gardez le corps aligné de la tête aux talons
      - Gainez votre sangle abdominale et contractez les fessiers

      ### 2. Mouvement
      1. Fléchissez les coudes pour descendre la poitrine vers les mains
      2. Gardez les coudes serrés le long du corps pendant la descente
      3. Descendez jusqu'à ce que la poitrine frôle le sol
      4. Repoussez-vous jusqu'à la position de départ en tendant les bras
      5. Répétez le mouvement de façon contrôlée pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Inspirez pendant la descente
      - Expirez en vous repoussant vers le haut

      ### 4. Conseils
      - Gardez les coudes pointés vers l'arrière, sans les écarter
      - Maintenez une planche rigide de la tête aux talons
      - Bougez lentement et avec contrôle dans les deux sens

      ### 5. Erreurs fréquentes
      - Laisser les hanches s'affaisser ou remonter en pique
      - Écarter largement les coudes, ce qui détourne le travail des triceps
      - Écourter l'amplitude du mouvement

      ### 6. Sécurité et adaptations
      - Effectuez l'exercice sur les genoux pour réduire la charge
      - Surélevez les mains sur un banc pour faciliter le mouvement
      - Progressez en ralentissant la phase de descente ou en surélevant les pieds
