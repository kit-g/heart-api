  Heart Pump:
    name: Heart Pump
    instructions: |
      ## Aperçu
      Le heart pump est un exercice dynamique avec haltères qui cible principalement les biceps et les avant-bras par un mouvement de pompage continu. Il sollicite également les épaules et la force de préhension, grâce à un rythme soutenu qui maintient une tension constante pour développer l'endurance musculaire.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, haltères le long du corps
      - Gardez les coudes près du corps et la sangle abdominale gainée
      - Tenez les haltères en prise neutre (paumes tournées vers vous)
      - Maintenez une posture droite, épaules en arrière
      - Préparez-vous à un mouvement continu, sans pause

      ### 2. Mouvement
      1. Montez simultanément les deux haltères par petites impulsions courtes et rapides
      2. Travaillez sur une amplitude partielle, en pompant de la mi-hauteur jusqu'à près du sommet
      3. Gardez les coudes immobiles et maintenez une tension constante
      4. Poursuivez ce pompage rythmé pendant la durée ou le nombre de répétitions visé
      5. Veillez à garder un mouvement contrôlé et continu
      6. Terminez en redescendant les haltères à la position de départ

      ### 3. Respiration
      - Respirez de façon régulière et naturelle pendant tout le mouvement continu
      - Ne bloquez pas votre respiration ; gardez un rythme respiratoire constant

      ### 4. Conseils
      - Gardez un mouvement rapide mais contrôlé, sans à-coups
      - Maintenez une tension constante sur les biceps du début à la fin
      - Concentrez-vous sur la congestion et la sensation de brûlure dans les bras
      - Gardez la sangle abdominale contractée pour éviter tout balancement
      - Utilisez une charge plus légère que pour des curls classiques, le mouvement étant continu

      ### 5. Erreurs fréquentes
      - Utiliser une charge trop lourde et perdre le rythme de pompage
      - Balancer le corps ou utiliser l'élan
      - Travailler sur une amplitude complète au lieu d'impulsions partielles ciblées
      - Laisser les coudes avancer
      - Bloquer sa respiration pendant l'exercice
      - Faire des pauses ou se reposer pendant la série

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères légers pour maîtriser le pompage continu
      - Réduisez la durée en cas de fatigue excessive
      - Variante avancée : augmentez le tempo ou ajoutez des pauses à différentes positions
      - Effectuez l'exercice assis pour éliminer l'élan du bas du corps
