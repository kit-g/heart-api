  Yoga:
    name: Yoga
    instructions: |
      ## Aperçu
      Le yoga est une pratique corps-esprit qui vise la souplesse, la force, l'équilibre et le bien-être mental. Il combine postures physiques, techniques de respiration et méditation pour améliorer la condition physique globale, réduire le stress et développer la conscience et la maîtrise du corps.

      ## Exécution
      ### 1. Sécurité
      - Apprenez avec des professeurs de yoga qualifiés
      - Utilisez des accessoires pour rendre les postures accessibles
      - Informez le professeur de toute blessure ou limitation
      - Commencez par des cours pour débutants et progressez graduellement
