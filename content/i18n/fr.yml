  Triceps Extension (Cable):
    name: Extension des triceps (poulie)
    instructions: |
      ## Aperçu
      L'extension des triceps à la poulie est un exercice d'isolation qui cible principalement les trois chefs du triceps avec une tension constante. Il sollicite aussi les épaules et la sangle abdominale comme stabilisateurs, la position de la poulie au-dessus de la tête assurant une résistance continue tout au long du mouvement.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous dos à une poulie haute munie d'une corde
      - Saisissez les extrémités de la corde et avancez d'un pas pour mettre le câble sous tension
      - Placez vos bras au-dessus de la tête, coudes fléchis
      - Gardez les coudes pointés vers l'avant et relativement proches de la tête
      - Décalez vos appuis pour plus de stabilité et gainez votre sangle abdominale

      ### 2. Mouvement
      1. Étendez les coudes pour pousser vos mains vers l'avant et vers le haut
      2. Gardez le haut des bras immobile et proche de la tête
      3. Continuez jusqu'à l'extension complète des bras
      4. Marquez une pause et contractez les triceps en extension complète
      5. Revenez lentement à la position de départ, en contrôlant le mouvement
      6. Arrêtez-vous avant que la pile de poids ne se repose afin de maintenir une tension constante, puis répétez

      ### 3. Respiration
      - Expirez en étendant les bras vers l'avant
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez le haut des bras immobile pendant tout le mouvement
      - Maintenez une tension constante en ne laissant pas la pile de poids se reposer
      - Gardez les coudes relativement rapprochés
      - Évitez de cambrer le bas du dos pendant le mouvement
      - Concentrez-vous sur la contraction en extension complète

      ### 5. Erreurs fréquentes
      - Laisser les coudes s'écarter excessivement
      - Bouger le haut des bras au lieu de le garder immobile
      - Laisser la pile de poids se reposer entre les répétitions
      - Se pencher trop vers l'avant
      - Utiliser l'élan plutôt qu'un mouvement contrôlé
      - Ne pas atteindre l'extension complète des coudes

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser la position bras au-dessus de la tête à la poulie
      - Essayez différents accessoires (corde, barre droite, barre en V) pour varier
      - Variante avancée : travaillez un bras à la fois pour un accent unilatéral
      - Mettez-vous à genoux pour une position plus stable si nécessaire
