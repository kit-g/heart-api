  Burpee:
    name: Burpees
    instructions: |
      ## Aperçu
      Le burpee est un exercice au poids du corps pour tout le corps qui cible principalement les pectoraux, les épaules, la sangle abdominale et les jambes. Il enchaîne une pompe, un squat et un saut en un seul mouvement continu, développant endurance cardiovasculaire, force et puissance explosive.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des épaules
      - Gardez la poitrine haute et la sangle abdominale engagée
      - Préparez-vous à enchaîner rapidement toute la séquence

      ### 2. Mouvement
      1. Accroupissez-vous et posez les mains au sol
      2. Sautez ou reculez les pieds pour arriver en planche haute
      3. Effectuez une pompe en descendant la poitrine vers le sol
      4. Repoussez-vous en position de planche
      5. Ramenez les pieds vers les mains d'un saut ou d'un pas
      6. Sautez explosivement bras au-dessus de la tête, puis répétez

      ### 3. Respiration
      - Respirez tout au long du mouvement selon vos besoins
      - Expirez pendant la pompe et les phases de saut

      ### 4. Conseils
      - Maintenez un rythme régulier sur toutes les répétitions
      - Gardez la sangle abdominale serrée pendant la planche et la pompe
      - Amortissez la réception du saut
      - Des adaptations permettent de supprimer la pompe ou le saut
      - Privilégiez la technique à la vitesse pendant l'apprentissage

      ### 5. Erreurs fréquentes
      - Laisser les hanches s'affaisser en position de planche
      - Ne pas amener la poitrine jusqu'au sol lors de la pompe
      - Se réceptionner trop lourdement après le saut
      - Enchaîner trop vite et perdre la technique
      - Ne pas s'étendre complètement pendant le saut
      - Retenir sa respiration du début à la fin

      ### 6. Sécurité et adaptations
      - Reculez les pieds pas à pas au lieu de sauter pour réduire l'impact
      - Supprimez la pompe pour une version plus facile
      - Supprimez le saut final si nécessaire
      - Variante avancée : ajoutez une traction ou augmentez la vitesse
