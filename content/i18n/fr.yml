  Stretching:
    name: Étirements
    instructions: |
      ## Aperçu
      Les étirements sont un exercice de souplesse qui cible de nombreux groupes musculaires dans tout le corps. Ils aident à améliorer l'amplitude de mouvement, à réduire les tensions musculaires et à favoriser la récupération, ce qui les rend essentiels pour la mobilité globale et la prévention des blessures.

      ## Exécution
      ### 1. Position de départ
      - Choisissez un espace confortable avec assez de place pour bouger librement
      - Portez des vêtements confortables et non contraignants
      - Commencez par des mouvements légers pour échauffer vos muscles
      - Concentrez-vous sur les zones tendues ou qui seront sollicitées pendant votre séance

      ### 2. Mouvement
      1. Choisissez des étirements ciblant les groupes musculaires souhaités
      2. Entrez lentement dans chaque étirement jusqu'à ressentir une tension légère
      3. Maintenez chaque étirement 15 à 30 secondes sans à-coups
      4. Respirez profondément et relâchez-vous dans chaque position
      5. Relâchez lentement et passez à l'étirement suivant
      6. Continuez pendant la durée souhaitée

      ### 3. Respiration
      - Respirez lentement et profondément pendant chaque étirement
      - Expirez en approfondissant un étirement
      - Ne retenez jamais votre respiration pendant un étirement

      ### 4. Conseils
      - Étirez-vous après les séances, quand les muscles sont chauds
      - Concentrez-vous sur les grands groupes musculaires et les zones tendues
      - Un étirement doit rester confortable, jamais douloureux
      - Incluez des étirements du haut comme du bas du corps
      - La régularité compte plus que la durée

      ### 5. Erreurs fréquentes
      - Faire des mouvements de rebond ou des à-coups pendant les étirements
      - Forcer dans des amplitudes douloureuses
      - Retenir sa respiration pendant les étirements
      - Enchaîner les étirements sans respecter le temps de maintien
      - Étirer des muscles froids sans échauffement
      - Négliger certains groupes musculaires

      ### 6. Sécurité et adaptations
      - N'allez jamais jusqu'à une douleur vive
      - Utilisez des accessoires comme des briques ou des sangles de yoga si nécessaire
      - Réduisez l'intensité si vous vous remettez d'une blessure
      - Privilégiez les étirements dynamiques avant la séance et statiques après
