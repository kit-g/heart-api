  Kettlebell Turkish Get Up:
    name: Relevé turc (kettlebell)
    instructions: |
      ## Aperçu
      Le relevé turc est un mouvement complexe pour tout le corps qui cible les épaules, la sangle abdominale et les jambes. Il consiste à passer de la position allongée à la position debout en tenant une kettlebell au-dessus de la tête, développant stabilité des épaules, force du tronc, coordination et contrôle global du corps.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous sur le dos, une kettlebell à côté de votre épaule droite
      - Saisissez la kettlebell de la main droite et développez-la au-dessus de vous
      - Fléchissez le genou droit, pied à plat au sol
      - Étendez le bras gauche au sol à 45 degrés
      - Gardez les yeux sur la kettlebell tout au long du mouvement

      ### 2. Mouvement
      1. Roulez sur votre coude gauche en gardant la kettlebell au-dessus de vous
      2. Redressez-vous en appui sur votre main gauche
      3. Décollez les hanches du sol en position de pont
      4. Passez la jambe gauche en arrière sous vous pour arriver à genoux
      5. Relevez-vous depuis la position à genoux
      6. Inversez toutes les étapes pour revenir à la position de départ, puis répétez de l'autre côté

      ### 3. Respiration
      - Respirez régulièrement tout au long de ce mouvement en plusieurs étapes
      - Ne retenez jamais votre respiration, quelle que soit la phase

      ### 4. Conseils
      - C'est un mouvement très technique qui demande de la pratique
      - Gardez les yeux sur la kettlebell en permanence
      - Progressez lentement et délibérément à chaque phase
      - Chaque étape doit être distincte et contrôlée
      - Maîtrisez le mouvement sans charge avant d'ajouter une kettlebell

      ### 5. Erreurs fréquentes
      - Enchaîner les phases trop rapidement
      - Ne pas garder les yeux sur la kettlebell
      - Fléchir le bras qui tient la kettlebell
      - Mauvais enchaînement des étapes du mouvement
      - Tenter trop de charge trop tôt
      - Ne pas maintenir la stabilité de l'épaule tout au long du mouvement

      ### 6. Sécurité et adaptations
      - Apprenez d'abord le mouvement sans charge
      - Décomposez et travaillez chaque phase séparément
      - Commencez avec une kettlebell très légère
      - Envisagez de travailler au départ avec un instructeur qualifié
