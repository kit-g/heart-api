      - Gardez le bas du dos plaqué contre le tapis pour protéger votre colonne
      - Bougez lentement et avec contrôle sur toute l'amplitude du mouvement
      - Maintenez une tension constante en ne laissant pas les pieds toucher le sol entre les répétitions
      - Gardez le haut du corps détendu pour éviter les tensions dans la nuque

