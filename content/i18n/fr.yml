  Muscle Up:
    name: Muscle-up
    instructions: |
      ## Aperçu
      Le muscle-up est un exercice avancé au poids du corps qui combine une traction et un dips. Il cible principalement les grands dorsaux, les pectoraux, les épaules et les triceps, exigeant une force importante du haut du corps, de la puissance explosive et une maîtrise technique pour passer de dessous à au-dessus de la barre ou des anneaux.

      ## Exécution
      ### 1. Position de départ
      - Suspendez-vous à une barre de traction ou à des anneaux de gymnastique
      - Utilisez une fausse prise (pouces au-dessus de la barre) pour faciliter la transition
      - Gardez le corps en position gainée creuse (hollow)
      - Engagez votre sangle abdominale et préparez-vous à une traction explosive
      - Générez un léger balancement si besoin pour prendre de l'élan

      ### 2. Mouvement
      1. Tirez-vous explosivement vers la barre
      2. En montant, penchez-vous légèrement en arrière et amenez la poitrine au-dessus de la barre
      3. Faites passer énergiquement poitrine et épaules au-dessus de la barre
      4. Poussez vers le bas pour terminer le mouvement en appui
      5. Redescendez de façon contrôlée jusqu'à la suspension de départ
      6. Répétez pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Inspirez avant de tirer
      - Expirez explosivement pendant la traction et la transition
      - Inspirez pendant la descente

      ### 4. Conseils
      - C'est un mouvement avancé exigeant une force importante
      - La phase de transition est la partie la plus technique
      - Une puissance de tirage explosive est essentielle
      - Travaillez d'abord tractions et dips séparément
      - Envisagez des bandes élastiques en assistance pendant l'apprentissage

      ### 5. Erreurs fréquentes
      - Ne pas générer assez d'élan dans la traction explosive
      - Ne pas se pencher en arrière pendant la transition
      - Force insuffisante en tractions ou en dips
      - Mauvais timing de la phase de transition
      - Tenter le mouvement sans les prérequis de force
      - Utiliser trop de balancement ou d'élan

      ### 6. Sécurité et adaptations
      - Maîtrisez d'abord les tractions strictes (15+) et les dips (20+)
      - Utilisez l'assistance d'une bande élastique pendant l'apprentissage
      - Travaillez la phase de transition séparément
      - Le muscle-up aux anneaux est généralement plus facile à apprendre qu'à la barre
