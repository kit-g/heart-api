  Lunge (Barbell):
    name: Fentes (barre)
    instructions: |
      ## Aperçu
      La fente avec barre est un exercice unilatéral du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Elle sollicite aussi la sangle abdominale et les muscles stabilisateurs, en utilisant une barre posée sur le haut du dos pour ajouter de la résistance tout en mettant l'équilibre et la coordination à l'épreuve.

      ## Exécution
      ### 1. Position de départ
      - Placez une barre sur le haut de votre dos, comme pour un squat
      - Tenez-vous debout, pieds écartés à la largeur des hanches
      - Gardez la poitrine haute, la sangle abdominale engagée et le regard vers l'avant
      - Saisissez la barre avec les mains un peu plus écartées que la largeur des épaules
      - Maintenez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Faites un grand pas en avant avec une jambe
      2. Descendez les hanches en fléchissant les deux genoux
      3. Continuez jusqu'à ce que la cuisse avant soit parallèle au sol
      4. Gardez le genou avant aligné au-dessus de la cheville
      5. Poussez à travers le talon avant pour revenir en position debout
      6. Répétez sur la même jambe ou alternez les jambes pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Inspirez en avançant le pied et en descendant
      - Expirez en repoussant pour revenir debout

      ### 4. Conseils
      - Gardez le buste droit tout au long du mouvement
      - Veillez à ce que le genou avant ne dépasse pas les orteils
      - Poussez à travers le talon avant, pas les orteils
      - Faites un pas suffisamment long pour garder l'équilibre
      - Gardez la barre stable sur le haut du dos

      ### 5. Erreurs fréquentes
      - Se pencher trop en avant pendant la fente
      - Laisser le genou avant rentrer vers l'intérieur
      - Faire un pas trop court, ce qui crée des contraintes sur le genou
      - Ne pas descendre suffisamment
      - Laisser le genou arrière heurter le sol
      - Perdre l'équilibre ou vaciller pendant le mouvement

      ### 6. Sécurité et adaptations
      - Commencez par des fentes au poids du corps pour maîtriser l'équilibre avant d'ajouter une barre
      - Effectuez des fentes marchées pour conserver l'élan
      - Utilisez plutôt des haltères si la barre semble instable
      - Variante avancée : créez un déficit en posant le pied avant sur une plateforme
