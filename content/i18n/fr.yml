  Handstand Push Up:
    name: Pompes en équilibre sur les mains
    instructions: |
      ## Aperçu
      Les pompes en équilibre sur les mains sont un exercice de poussée au poids du corps de niveau avancé qui cible principalement les épaules. Elles sollicitent aussi les triceps, le haut des pectoraux et la sangle abdominale, en utilisant une position inversée pour charger au maximum les épaules par une poussée verticale.

      ## Exécution
      ### 1. Position de départ
      - Basculez en équilibre sur les mains contre un mur
      - Placez les mains légèrement plus écartées que la largeur des épaules
      - Gardez le corps aligné en ligne droite des mains aux pieds
      - Gainez votre sangle abdominale et gardez la tête en position neutre
      - Maintenez l'équilibre en vous aidant du mur

      ### 2. Mouvement
      1. Descendez le corps en fléchissant les coudes
      2. Descendez jusqu'à ce que le sommet de votre tête frôle le sol
      3. Gardez les coudes à environ 45 degrés par rapport au corps
      4. Marquez une brève pause en bas
      5. Poussez dans les paumes pour tendre les bras
      6. Revenez à la position d'équilibre de départ et répétez

      ### 3. Respiration
      - Inspirez pendant la descente
      - Expirez pendant la remontée

      ### 4. Conseils
      - C'est un exercice avancé qui exige une force importante
      - Gardez la sangle abdominale bien gainée pour maintenir l'alignement du corps
      - Contrôlez la descente pour maximiser le travail musculaire
      - Concentrez-vous sur une poussée bien verticale, sans vous éloigner du mur
      - Servez-vous du mur pour vous aider à garder l'équilibre

      ### 5. Erreurs fréquentes
      - Laisser le dos se cambrer excessivement
      - Ne pas travailler en amplitude complète
      - Écarter exagérément les coudes
      - Perdre le gainage et l'alignement du corps
      - Tenter cet exercice avant d'avoir acquis la force nécessaire
      - Aller trop vite et perdre le contrôle

      ### 6. Sécurité et adaptations
      - Progressez d'abord avec des pompes en pique (pike push-ups), au sol puis pieds surélevés
      - Utilisez une version assistée avec une bande élastique
      - Effectuez uniquement des répétitions négatives (descente seule) pour développer la force
      - Assurez-vous de tenir un équilibre contre le mur pendant au moins 30 secondes avant d'essayer
