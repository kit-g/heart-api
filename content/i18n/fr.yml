  Triceps Pushdown (Cable - Straight Bar):
    name: Extension des triceps à la poulie haute (barre droite)
    instructions: |
      ## Aperçu
      L'extension des triceps à la poulie haute est un exercice d'isolation qui cible principalement les trois chefs du triceps avec une tension constante. Il sollicite aussi très légèrement les épaules comme stabilisateurs, la poulie haute munie d'une barre droite assurant une résistance régulière tout au long du mouvement.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous face à une poulie haute munie d'une barre droite
      - Saisissez la barre en pronation, mains écartées à la largeur des épaules
      - Placez vos coudes près du corps, avant-bras parallèles au sol
      - Gardez les pieds écartés à la largeur des hanches, un pied légèrement en avant
      - Gainez votre sangle abdominale et maintenez une posture droite

      ### 2. Mouvement
      1. Poussez la barre vers le bas en étendant complètement les coudes
      2. Gardez le haut des bras immobile et plaqué contre les flancs
      3. Continuez à pousser jusqu'à l'extension complète des bras, au niveau des cuisses
      4. Marquez une pause et contractez les triceps en extension complète
      5. Laissez lentement la barre remonter à la position de départ, en contrôlant le mouvement
      6. Arrêtez-vous avant que la pile de poids ne se repose afin de maintenir une tension constante, puis répétez

      ### 3. Respiration
      - Expirez en poussant la barre vers le bas
      - Inspirez en laissant la barre revenir à la position de départ

      ### 4. Conseils
      - Gardez les coudes parfaitement immobiles et collés aux flancs
      - Cherchez à isoler les triceps en ne bougeant qu'au niveau de l'articulation du coude
      - Maintenez une tension constante en ne laissant pas la pile de poids se reposer
      - Évitez de vous pencher vers l'avant ou d'utiliser l'élan du corps
      - Contractez fortement les triceps en bas de chaque répétition

      ### 5. Erreurs fréquentes
      - Laisser les coudes dériver vers l'avant ou s'écarter
      - Se pencher vers l'avant et utiliser le poids du corps pour pousser la barre
      - Ne pas atteindre l'extension complète des coudes en bas
      - Laisser la pile de poids se reposer entre les répétitions
      - Utiliser l'élan plutôt qu'un mouvement contrôlé
      - Enchaîner les répétitions trop rapidement

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser l'isolation stricte des coudes
      - Essayez différents accessoires (corde, barre en V, poignée simple) pour varier
      - Variante avancée : travaillez un bras à la fois pour un accent unilatéral
      - Ajoutez une pause de 2 à 3 secondes en extension complète pour plus d'intensité
