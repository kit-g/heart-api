  Skating:
    name: Patinage
    instructions: |
      ## Aperçu
      Le patinage (sur glace, à roulettes ou en ligne) est une activité cardiovasculaire qui sollicite les jambes, les fessiers et la sangle abdominale. Il développe l'équilibre, la coordination et la force des jambes, et offre un conditionnement aérobie efficace tout en restant relativement doux pour les articulations.

      ## Exécution
      ### 1. Position de départ
      - Portez des patins adaptés et bien ajustés
      - Utilisez un équipement de protection (casque, genouillères, protège-poignets)
      - Partez d'une position stable et équilibrée
      - Gardez les genoux légèrement fléchis
      - Maintenez une posture athlétique

      ### 2. Mouvement
      1. Poussez avec une jambe en angle
      2. Glissez sur la jambe opposée
      3. Transférez votre poids et poussez avec l'autre jambe
      4. Maintenez un mouvement latéral rythmé
      5. Gardez la sangle abdominale engagée et les genoux fléchis
      6. Continuez à patiner pendant la durée souhaitée

      ### 3. Respiration
      - Respirez de façon régulière et rythmée tout au long de l'activité
      - Ajustez votre allure pour garder une respiration confortable
      - Faites des pauses si nécessaire pendant l'apprentissage

      ### 4. Conseils
      - Fléchissez les genoux pour un meilleur équilibre et plus de puissance
      - Poussez vers le côté, pas droit vers l'arrière
      - Gardez votre poids au-dessus de vos patins
      - Détendez-vous et trouvez votre rythme
      - Maîtrisez les techniques d'arrêt avant de prendre de la vitesse

      ### 5. Erreurs fréquentes
      - Se tenir trop droit avec les genoux verrouillés
      - Pousser droit vers l'arrière au lieu de pousser vers le côté
      - Ne pas porter d'équipement de protection adéquat
      - Patiner au-delà de son niveau actuel
      - Regarder ses pieds au lieu de regarder devant soi
      - Se crisper au lieu de rester détendu

      ### 6. Sécurité et adaptations
      - Portez toujours un équipement de protection approprié
      - Apprenez les techniques de chute
      - Commencez sur des surfaces lisses et planes
      - Prenez des leçons avec des moniteurs qualifiés pour progresser plus vite
