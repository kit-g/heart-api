  Press Under (Barbell):
    name: Développé en passant sous la barre
    instructions: |
      ## Aperçu
      Le press under est un exercice accessoire d'haltérophilie qui cible les épaules, les triceps et la sangle abdominale. Il enseigne le schéma moteur consistant à passer sous la barre pendant la phase de réception des arrachés et des jetés, développant vitesse, placement et confiance.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, une barre à hauteur de poitrine
      - Utilisez votre largeur de prise d'arraché ou de jeté selon le mouvement travaillé
      - Gardez la poitrine haute, la sangle abdominale engagée et les coudes légèrement sous la barre
      - Pour le travail du jeté, la barre repose sur l'avant des épaules

      ### 2. Mouvement
      1. Développez légèrement la barre au-dessus de la tête tout en descendant sous elle simultanément
      2. Déplacez vos pieds vers votre position de réception pendant la poussée
      3. Verrouillez complètement les bras en position au-dessus de la tête
      4. Réceptionnez en squat partiel, la barre stable au-dessus de la tête
      5. Redressez-vous complètement avec la barre au-dessus de la tête
      6. Ramenez la barre à la position de départ et répétez

      ### 3. Respiration
      - Inspirez avant d'amorcer la poussée
      - Bloquez votre respiration pendant la poussée et la descente sous la barre
      - Expirez une fois l'extension complète atteinte

      ### 4. Conseils
      - C'est un exercice accessoire d'apprentissage pour les mouvements olympiques
      - Concentrez-vous sur la vitesse de passage sous la barre, pas sur la force de poussée
      - La poussée est minimale ; l'accent est mis sur la descente sous la barre
      - Travaillez le jeu de pieds propre à votre jeté ou à votre arraché
      - Utilisez une charge légère pour développer vitesse et confiance

      ### 5. Erreurs fréquentes
      - Pousser trop au lieu de descendre sous la barre
      - Ne pas déplacer les pieds vers la bonne position de réception
      - Hésiter au lieu de s'engager dans le mouvement
      - Utiliser trop de charge et perdre en vitesse
      - Ne pas atteindre l'extension complète au-dessus de la tête
      - Mauvaise trajectoire de barre pendant la poussée

      ### 6. Sécurité et adaptations
      - Commencez avec un tube en PVC ou une barre vide pour apprendre le schéma
      - C'est un outil d'apprentissage, pas un exercice de force
      - Gardez une charge légère pour préserver la vitesse
      - Essentiel pour apprendre le jeté en fente et l'arraché
