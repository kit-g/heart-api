      4. Verrouillez les kettlebells au-dessus de la tête, bras complètement tendus
      5. Redescendez les kettlebells en position rack
      6. Enchaînez immédiatement le squat suivant et répétez

      ### 3. Respiration
      - Inspirez en descendant en squat
      - Expirez explosivement pendant la remontée et le développé

      ### 4. Conseils
      - Utilisez la poussée des jambes pour aider à développer les kettlebells
      - Gardez un mouvement fluide et continu
      - Maintenez le buste droit pendant le squat
      - Les kettlebells permettent une trajectoire de bras plus naturelle que la barre
