  Single Leg Bridge:
    name: Pont fessier à une jambe
    instructions: |
      ## Aperçu
      Le pont fessier à une jambe est un exercice unilatéral au poids du corps qui cible principalement les fessiers et les ischio-jambiers. Il sollicite aussi la sangle abdominale et les stabilisateurs de la hanche, en utilisant une position sur une jambe pour renforcer les fessiers, corriger les déséquilibres et améliorer la stabilité des hanches.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous sur le dos, genoux fléchis et pieds à plat au sol
      - Placez les pieds écartés à la largeur des hanches, près des fessiers
      - Tendez une jambe droite devant vous, alignée avec la cuisse
      - Gardez les bras le long du corps, au sol
      - Engagez la sangle abdominale tout au long de l'exercice

      ### 2. Mouvement
      1. Poussez à travers le talon du pied au sol pour soulever les hanches
      2. Montez les hanches jusqu'à ce que le corps forme une ligne droite des épaules aux genoux
      3. Gardez la jambe tendue droite et alignée avec la cuisse de travail
      4. Contractez fortement le fessier en haut du mouvement
      5. Redescendez lentement les hanches, en contrôlant le mouvement
      6. Effectuez toutes les répétitions d'un côté, puis répétez de l'autre côté

      ### 3. Respiration
      - Inspirez en redescendant les hanches
      - Expirez en montant les hanches

      ### 4. Conseils
      - Concentrez-vous sur la contraction du fessier en haut, pas sur la cambrure du dos
      - Gardez les hanches de niveau tout au long du mouvement
      - Poussez à travers le talon, pas les orteils
      - Gardez la jambe tendue droite et engagée
      - Contrôlez à la fois la phase de montée et la phase de descente

      ### 5. Erreurs fréquentes
      - Hyperétendre le bas du dos en haut au lieu d'utiliser les fessiers
      - Laisser les hanches pivoter ou basculer d'un côté
      - Ne pas atteindre l'extension complète des hanches en haut
      - Pousser avec les orteils au lieu du talon
      - Fléchir la jambe tendue pendant le mouvement
      - Aller trop vite et perdre le contrôle

      ### 6. Sécurité et adaptations
      - Maîtrisez le pont fessier classique avant de passer à la version à une jambe
      - Posez les mains sur les hanches pour vérifier qu'elles restent de niveau
      - Réduisez l'amplitude en cas de gêne dans le bas du dos
      - Variante avancée : surélevez le pied sur un banc ou ajoutez une pause en haut
