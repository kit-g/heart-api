  Glute Ham Raise:
    name: Glute ham raise (GHR)
    instructions: |
      ## Aperçu
      Le glute ham raise est un exercice avancé au poids du corps qui cible principalement les ischio-jambiers et les fessiers. Il sollicite aussi le bas du dos et les mollets, les contractions excentrique et concentrique des ischio-jambiers développant la force de la chaîne postérieure et la résistance aux blessures.

      ## Exécution
      ### 1. Position de départ
      - Placez-vous face au sol sur une machine à glute ham raise
      - Calez vos chevilles sous les coussins prévus, les cuisses sur le support
      - Commencez le buste droit, perpendiculaire au sol
      - Croisez les bras sur la poitrine ou placez les mains devant vous
      - Gardez la sangle abdominale et les fessiers engagés tout au long du mouvement

      ### 2. Mouvement
      1. Abaissez lentement le buste vers l'avant en étendant les genoux
      2. Gardez le corps aligné des genoux à la tête pendant la descente
      3. Contrôlez la descente avec les ischio-jambiers et les fessiers
      4. Descendez jusqu'à ce que le buste soit presque parallèle au sol
      5. Ramenez-vous à la position de départ avec les ischio-jambiers
      6. Répétez pour le nombre de répétitions contrôlées souhaité

      ### 3. Respiration
      - Inspirez pendant la descente du buste vers l'avant
      - Expirez en vous ramenant à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur le contrôle de la phase excentrique (descente)
      - Gardez le corps aligné tout au long du mouvement
      - Utilisez vos ischio-jambiers et vos fessiers, pas l'élan
      - Commencez avec une amplitude partielle si les répétitions complètes sont trop difficiles
      - Cet exercice développe considérablement la force des ischio-jambiers

      ### 5. Erreurs fréquentes
      - Plier les hanches au lieu de garder le corps aligné
      - Descendre trop vite pendant la phase excentrique
      - Utiliser l'élan pour remonter
      - Ne pas engager les fessiers tout au long du mouvement
      - Cambrer excessivement le bas du dos
      - Tenter l'amplitude complète avant d'avoir acquis la force suffisante

      ### 6. Sécurité et adaptations
      - Utilisez une bande élastique en assistance si nécessaire
      - Commencez par des répétitions excentriques seules (descente uniquement, puis repositionnement)
      - Poussez au sol avec les mains pour vous aider à revenir au départ
      - Variante avancée : tenez un disque contre la poitrine pour ajouter de la résistance
