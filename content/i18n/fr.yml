      1. Poussez la barre vers le haut avec le pied en étendant la hanche
      2. Gardez le genou fléchi à 90 degrés tout au long du mouvement
      3. Continuez jusqu'à ce que la cuisse soit alignée avec le buste ou légèrement plus haut
      4. Contractez fortement le fessier en haut du mouvement
      5. Redescendez lentement la barre à la position de départ de façon contrôlée
      6. Effectuez toutes les répétitions d'un côté, puis recommencez de l'autre côté

