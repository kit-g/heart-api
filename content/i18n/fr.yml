  Face Pull (Cable):
    name: Face pull (poulie)
    instructions: |
      ## Aperçu
      Le face pull à la poulie est un exercice d'isolation qui cible principalement les deltoïdes postérieurs et le haut du dos. Il sollicite aussi les rhomboïdes et le trapèze moyen, en utilisant une corde pour améliorer la santé des épaules, la posture et le développement des deltoïdes postérieurs.

      ## Exécution
      ### 1. Position de départ
      - Fixez une corde à une poulie réglée à hauteur du haut de la poitrine
      - Tenez-vous face à la poulie, pieds écartés à la largeur des épaules
      - Saisissez la corde à deux mains en prise neutre
      - Reculez pour mettre le câble en tension
      - Gardez la poitrine haute et la sangle abdominale gainée

      ### 2. Mouvement
      1. Tirez la corde vers votre visage en amenant les coudes vers l'arrière et vers l'extérieur
      2. Écartez les extrémités de la corde en tirant, en les amenant de part et d'autre des oreilles
      3. Concentrez-vous sur le serrage des omoplates
      4. Continuez jusqu'à ce que vos mains soient à côté de vos oreilles
      5. Marquez une pause et contractez les deltoïdes postérieurs et le haut du dos
      6. Revenez lentement à la position de départ en contrôlant et répétez

      ### 3. Respiration
      - Expirez en tirant la corde vers le visage
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur le tirage avec les deltoïdes postérieurs et le haut du dos, pas avec les bras
      - Gardez les coudes hauts et écartés pendant le tirage
      - Écartez les extrémités de la corde pour maximiser la contraction des deltoïdes postérieurs
      - Maintenez une tension constante sur le câble tout au long du mouvement
      - Cet exercice est excellent pour la santé des épaules et la posture

      ### 5. Erreurs fréquentes
      - Tirer trop bas, vers la poitrine plutôt que vers le visage
      - Ne pas écarter les extrémités de la corde en fin de mouvement
      - Utiliser de l'élan ou tirer par à-coups
      - Laisser les coudes tomber pendant le tirage
      - Utiliser une charge trop lourde au détriment de la technique
      - Ne pas serrer les omoplates

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser le schéma de mouvement
      - Réglez la hauteur de la poulie entre le haut de la poitrine et le visage
      - Effectuez l'exercice avec une bande élastique si vous n'avez pas de poulie
      - Privilégiez des répétitions contrôlées et une bonne technique plutôt que la charge
