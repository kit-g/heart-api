  Jump Rope:
    name: Corde à sauter
    instructions: |
      ## Aperçu
      La corde à sauter est un exercice cardiovasculaire à haute intensité qui sollicite les mollets, les épaules et le système cardiovasculaire. Elle développe la coordination, l'agilité et l'endurance, et offre un entraînement efficace de tout le corps avec un équipement minimal.

      ## Exécution
      ### 1. Position de départ
      - Tenez les poignées de la corde, mains à hauteur des hanches
      - Placez la corde derrière vos talons
      - Tenez-vous debout, pieds joints ou légèrement écartés
      - Gardez les coudes près du corps
      - Maintenez une posture droite, sangle abdominale engagée

      ### 2. Mouvement
      1. Faites passer la corde au-dessus de votre tête en utilisant vos poignets
      2. Sautez avec les deux pieds pour laisser passer la corde sous vous
      3. Atterrissez en douceur sur la pointe des pieds
      4. Gardez des sauts bas, juste assez hauts pour laisser passer la corde
      5. Maintenez un rythme régulier
      6. Continuez pendant la durée ou le nombre de répétitions souhaité

      ### 3. Respiration
      - Respirez de façon rythmée et régulière tout au long de l'exercice
      - Trouvez un schéma respiratoire qui s'accorde à votre rythme
      - Évitez de retenir votre souffle

      ### 4. Conseils
      - Utilisez vos poignets pour faire tourner la corde, pas vos bras
      - Gardez des sauts petits et efficaces
      - Atterrissez en douceur pour réduire l'impact sur les articulations
      - Commencez par des intervalles courts et développez votre endurance
      - Diverses techniques (sur une jambe, double-unders) apportent de la variété

      ### 5. Erreurs fréquentes
      - Sauter inutilement trop haut
      - Utiliser les bras au lieu des poignets pour faire tourner la corde
      - Atterrir trop lourdement sur les talons
      - Tenir les poignées trop loin du corps
      - Mauvaise posture avec les épaules arrondies
      - Longueur de corde mal ajustée à la taille

      ### 6. Sécurité et adaptations
      - Ajustez la longueur de la corde en fonction de votre taille
      - Commencez par le saut de base et progressez vers les variantes
      - Pratiquez sur une surface appropriée (pas sur du béton)
      - Portez des chaussures de sport offrant un bon maintien
    validated: false
    source_digest: cba52d158006
  Rowing (Machine):
    name: Rameur
    instructions: |
      ## Aperçu
      Le rameur est un exercice cardiovasculaire complet qui sollicite les jambes, le dos, la sangle abdominale et les bras. Il offre un conditionnement aérobie à faible impact tout en développant force et endurance grâce à un mouvement de rame qui engage environ 85 % des muscles du corps.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur le rameur, pieds fixés dans les sangles
      - Saisissez la poignée en prise pronation
      - Commencez tibias verticaux, buste légèrement incliné vers l'avant
      - Gardez le dos droit et la sangle abdominale engagée
      - Les bras doivent être tendus vers la poignée

      ### 2. Mouvement
      1. Poussez avec les jambes pour amorcer la phase de propulsion
      2. Une fois les jambes tendues, inclinez-vous légèrement vers l'arrière et tirez la poignée vers la poitrine
      3. Inversez le mouvement : tendez les bras, penchez-vous vers l'avant, fléchissez les genoux
      4. Maintenez un rythme fluide et continu
      5. La propulsion doit être puissante, le retour contrôlé
      6. Continuez à ramer pendant la durée ou la distance souhaitée

      ### 3. Respiration
      - Expirez pendant la propulsion (phase de puissance)
      - Inspirez pendant le retour

      ### 4. Conseils
      - La puissance vient des jambes (60 %), de la sangle abdominale (20 %), puis des bras (20 %)
      - Maintenez une bonne posture tout au long du coup de rame
      - Gardez un mouvement de poignée fluide et régulier
      - Visez une cadence constante (20 à 30 coups par minute)
      - Consultez l'écran pour suivre votre allure et votre puissance

      ### 5. Erreurs fréquentes
      - Utiliser uniquement les bras au lieu des jambes pour la puissance
      - Arrondir le dos pendant le coup de rame
      - Tirer avec les bras fléchis avant que les jambes soient tendues
      - Serrer la poignée trop fort
      - Précipiter la phase de retour
      - S'incliner trop loin vers l'arrière en fin de mouvement

      ### 6. Sécurité et adaptations
      - Commencez par des séances courtes pour apprendre la bonne technique
      - Ajustez la position des sangles de pieds pour votre confort
      - Réduisez la résistance (réglage du damper) pour les séances plus longues
      - Cet exercice offre un excellent cardio complet à faible impact
