  Bench Press (Barbell):
    name: Développé couché (barre)
    instructions: |
      ## Aperçu
      Le développé couché à la barre est un exercice polyarticulaire du haut du corps qui cible principalement le grand pectoral. Il sollicite également les deltoïdes antérieurs et les triceps, ce qui en fait l'un des exercices les plus efficaces pour développer la force globale des pectoraux et la puissance de poussée du haut du corps.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur un banc, pieds bien ancrés au sol
      - Placez-vous de façon que vos yeux soient directement sous la barre
      - Saisissez la barre, mains légèrement plus écartées que la largeur des épaules
      - Décrochez la barre et tenez-la bras complètement tendus au-dessus de la poitrine
      - Gardez les omoplates serrées et plaquées contre le banc

      ### 2. Mouvement
      1. Descendez lentement la barre vers le milieu ou le bas de la poitrine
      2. Gardez les coudes à environ 45 degrés du corps
      3. Effleurez la poitrine avec la barre
      4. Marquez une brève pause en bas
      5. Repoussez la barre vers le haut en tendant les bras
      6. Tendez complètement les coudes en haut et répétez des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant la barre vers la poitrine
      - Expirez en repoussant la barre

      ### 4. Conseils
      - Gardez les omoplates serrées tout au long du mouvement
      - Conservez une cambrure naturelle du bas du dos
      - Gardez les pieds à plat et poussez dedans pour plus de stabilité
      - Contrôlez la descente et évitez de faire rebondir la barre sur la poitrine
      - Gardez les poignets droits, alignés au-dessus des avant-bras

      ### 5. Erreurs fréquentes
      - Faire rebondir la barre sur la poitrine au lieu d'un contact léger suivi d'une poussée contrôlée
      - Laisser les coudes s'écarter excessivement
      - Décoller les fessiers du banc pendant la poussée
      - Ne pas travailler sur une amplitude complète
      - Charger trop lourd au détriment de la technique
      - Ne pas garder les omoplates serrées

      ### 6. Sécurité et adaptations
      - Faites-vous toujours assurer par un pareur pour les charges lourdes
      - Commencez léger pour maîtriser la technique
      - Utilisez une prise plus large ou plus serrée selon votre confort et vos objectifs
      - Variante avancée : ajoutez des chaînes ou des bandes pour une résistance progressive
