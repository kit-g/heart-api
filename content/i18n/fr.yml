  Incline Row (Dumbbell):
    name: Rowing sur banc incliné (haltères)
    instructions: |
      ## Aperçu
      Le rowing sur banc incliné avec haltères est un exercice de tirage avec appui de la poitrine qui cible principalement le grand dorsal, les rhomboïdes et la partie moyenne des trapèzes. Il sollicite aussi les biceps et les deltoïdes postérieurs, le banc incliné supprimant les contraintes sur le bas du dos et vous permettant de vous concentrer pleinement sur la contraction des muscles dorsaux.

      ## Exécution
      ### 1. Position de départ
      - Réglez un banc ajustable à une inclinaison de 30 à 45 degrés
      - Allongez-vous face contre le banc, la poitrine contre le dossier
      - Tenez un haltère dans chaque main, bras pendants et tendus
      - Gardez les pieds à plat au sol pour la stabilité
      - Gainez votre sangle abdominale et maintenez une colonne neutre

      ### 2. Mouvement
      1. Tirez les deux haltères vers vos hanches ou le bas de vos côtes
      2. Amenez les coudes vers l'arrière et le haut, en les gardant près du corps
      3. Continuez jusqu'à ce que les haltères atteignent votre buste
      4. Serrez les omoplates en haut du mouvement
      5. Redescendez lentement les haltères à la position de départ, en contrôlant le mouvement
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en tirant les haltères vers le haut
      - Inspirez en les redescendant

      ### 4. Conseils
      - Gardez la poitrine fermement plaquée contre le banc
      - Menez le mouvement avec les coudes, pas avec les mains
      - Concentrez-vous sur le serrage des omoplates
      - Évitez d'utiliser l'élan ou de balancer les charges
      - Contrôlez la charge sur toute l'amplitude du mouvement

      ### 5. Erreurs fréquentes
      - Décoller la poitrine du banc pendant le tirage
      - Utiliser l'élan pour balancer les charges vers le haut
      - Ne pas travailler sur l'amplitude complète
      - Laisser les coudes s'écarter excessivement
      - Bouger trop vite et perdre le contrôle
      - Ne pas serrer les omoplates en haut du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères modérés pour maîtriser la position avec appui de la poitrine
      - Ajustez l'inclinaison du banc entre 30 et 60 degrés pour varier l'accent musculaire
      - Travaillez un bras à la fois pour un accent unilatéral
      - Variante avancée : marquez une pause de 2 à 3 secondes en haut de chaque répétition
