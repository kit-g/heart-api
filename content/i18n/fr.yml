  Chest Fly:
    name: Écartés
    instructions: |
      ## Aperçu
      Les écartés à la machine sont un exercice d'isolation qui cible principalement le grand pectoral. Ils sollicitent également, de façon minime, les deltoïdes antérieurs ; la trajectoire fixe offre de la stabilité et une résistance constante tout au long du mouvement d'écarté.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur la machine à écartés, le dos fermement appuyé contre le dossier
      - Réglez la hauteur du siège pour que les poignées soient alignées avec le milieu de votre poitrine
      - Saisissez les poignées, bras étendus sur les côtés
      - Gardez une légère flexion des coudes tout au long du mouvement
      - Posez les pieds à plat au sol et gainez votre sangle abdominale

      ### 2. Mouvement
      1. Rapprochez les deux poignées devant votre poitrine
      2. Gardez les coudes légèrement fléchis, comme pour enlacer quelque chose
      3. Continuez jusqu'à ce que les poignées se rejoignent ou se touchent presque
      4. Contractez fort les pectoraux au pic de la contraction
      5. Ramenez lentement les bras à la position de départ, en contrôlant
      6. Arrêtez-vous juste avant que la pile de poids ne se pose afin de maintenir la tension, puis répétez

      ### 3. Respiration
      - Expirez en rapprochant les poignées
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez une flexion des coudes constante tout au long du mouvement
      - Concentrez-vous sur la contraction des pectoraux au pic
      - Maintenez une tension constante en ne laissant pas la pile de poids se poser
      - Gardez le dos fermement appuyé contre le dossier
      - Contrôlez autant la phase de serrage que la phase d'ouverture

      ### 5. Erreurs fréquentes
      - Tendre complètement les bras pendant le mouvement
      - Utiliser l'élan au lieu d'une contraction musculaire contrôlée
      - Laisser la pile de poids se poser entre les répétitions
      - Décoller le dos du dossier
      - Aller trop vite et perdre la contraction
      - Charger trop lourd et plier excessivement les coudes

      ### 6. Sécurité et adaptations
      - Réglez la hauteur du siège pour que les poignées soient alignées avec votre poitrine
      - Commencez léger pour établir la connexion esprit-muscle
      - Variante avancée : marquez une pause de 2 à 3 secondes au pic de la contraction
      - Ajustez la position des poignées pour varier la profondeur d'étirement
