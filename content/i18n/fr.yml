  Push Press:
    name: Push press
    instructions: |
      ## Aperçu
      Le push press est un exercice de puissance polyarticulaire qui cible principalement les deltoïdes avec l'aide de la poussée des jambes. Il sollicite aussi les triceps, le haut des pectoraux, les quadriceps et la sangle abdominale, en utilisant une impulsion explosive des jambes pour pousser au-dessus de la tête des charges plus lourdes qu'en développé strict.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des épaules, la barre posée sur les supports à hauteur du haut de la poitrine
      - Saisissez la barre légèrement plus large que les épaules, paumes vers l'avant
      - Sortez la barre des supports et tenez-la à hauteur d'épaules
      - Gardez la poitrine haute, la sangle abdominale gainée et les coudes légèrement en avant
      - Maintenez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Fléchissez légèrement les genoux et les hanches pour amorcer la flexion
      2. Poussez explosivement avec les jambes tout en développant la barre au-dessus de la tête
      3. Servez-vous de l'élan des jambes pour aider la poussée de la barre
      4. Continuez la poussée jusqu'à l'extension complète des bras
      5. Verrouillez les coudes en haut, la barre au-dessus de la tête
      6. Redescendez la barre à hauteur d'épaules en contrôlant et répétez

      ### 3. Respiration
      - Inspirez pendant la phase de flexion
      - Expirez de façon explosive pendant la poussée

      ### 4. Conseils
      - La poussée des jambes doit être explosive et puissante
      - Synchronisez la poussée des jambes avec celle des bras pour une efficacité maximale
      - Gardez la sangle abdominale bien gainée tout au long du mouvement
      - Cet exercice permet des charges plus lourdes que le développé strict
      - Recherchez une coordination fluide entre les jambes et les bras

      ### 5. Erreurs fréquentes
      - Fléchir trop profondément, ou pas assez
      - Ne pas coordonner la poussée des jambes avec celle des bras
      - Pousser vers l'avant plutôt que bien verticalement
      - Cambrer excessivement le bas du dos
      - Ne pas atteindre l'extension complète en haut
      - Laisser les jambes faire tout le travail au lieu de simplement assister

      ### 6. Sécurité et adaptations
      - Maîtrisez d'abord le développé militaire strict avant de passer au push press
      - Commencez avec une charge modérée pour apprendre le timing de la poussée des jambes
      - Utilisez un rack avec barres de sécurité si vous vous entraînez seul
      - Cet exercice est excellent pour développer la puissance explosive
