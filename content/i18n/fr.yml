  Walking:
    name: Marche
    instructions: |
      ## Aperçu
      La marche est un exercice cardiovasculaire à faible impact qui sollicite les jambes, les fessiers et le système cardiovasculaire. Elle offre un conditionnement aérobie accessible à tous les niveaux de forme physique, améliore la santé globale et ne nécessite ni équipement particulier ni apprentissage.
