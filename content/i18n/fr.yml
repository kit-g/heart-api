  Pistol Squat:
    name: Pistol squat
    instructions: |
      ## Aperçu
      Le pistol squat est un exercice unilatéral avancé du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite aussi la sangle abdominale, les fléchisseurs de hanche et les stabilisateurs de l'équilibre, en utilisant un squat complet sur une jambe pour développer une force des jambes, une mobilité et un équilibre exceptionnels.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous sur une jambe, l'autre jambe tendue droit devant vous
      - Gardez la poitrine haute, la sangle abdominale engagée et les bras tendus vers l'avant pour l'équilibre
      - Maintenez une bonne posture et fixez un point devant vous

      ### 2. Mouvement
      1. Descendez en fléchissant le genou et la hanche de la jambe d'appui
      2. Gardez la jambe tendue droite et parallèle au sol
      3. Continuez à descendre aussi bas que possible tout en gardant l'équilibre
      4. Gardez le talon au sol et la poitrine haute
      5. Poussez à travers le talon pour revenir en position debout
      6. Effectuez toutes les répétitions d'un côté, puis répétez de l'autre côté

      ### 3. Respiration
      - Inspirez en descendant
      - Expirez en remontant vers la position debout

      ### 4. Conseils
      - Cet exercice exige beaucoup de force, de mobilité et d'équilibre
      - Gardez la poitrine haute et la sangle abdominale contractée tout au long de l'exercice
      - La jambe tendue doit rester droite et ne pas toucher le sol
      - Concentrez-vous sur un mouvement contrôlé dans les deux sens
      - Servez-vous des bras comme contrepoids

      ### 5. Erreurs fréquentes
      - Ne pas descendre suffisamment à cause de limitations de mobilité
      - Laisser le genou rentrer vers l'intérieur
      - Perdre l'équilibre et poser la jambe tendue au sol
      - Arrondir le dos ou se pencher trop en avant
      - Ne pas garder la jambe tendue droite
      - Tenter des pistol squats avant d'avoir acquis la force nécessaire

      ### 6. Sécurité et adaptations
      - Progressez vers le pistol squat en commençant par des variantes assistées
      - Tenez-vous à un support pour vous aider à garder l'équilibre
      - Effectuez des pistol squats sur box (en vous asseyant vers l'arrière sur une box)
      - Commencez par des pistol squats surélevés (debout sur une marche)
      - En cas de gêne au genou, améliorez d'abord votre mobilité avant de progresser
