      - Relâcher toute la tension à la position de départ

      ### 6. Sécurité et adaptations
      - Commencez avec une bande plus légère pour maîtriser le mouvement
      - Ajustez la distance par rapport au point d'ancrage pour modifier le niveau de résistance
      - Travaillez un bras à la fois pour un travail unilatéral
      - Variante avancée : marquez une pause de 2 à 3 secondes au pic de la contraction
