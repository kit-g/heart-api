  Floor Press (Barbell):
    name: Développé au sol (barre)
    instructions: |
      ## Aperçu
      Le développé au sol à la barre est un exercice de poussée à amplitude partielle qui cible principalement le grand pectoral et les triceps. Il sollicite aussi les deltoïdes antérieurs ; le sol limite l'amplitude du mouvement et réduit la contrainte sur les épaules tout en permettant de pousser lourd.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous au sol, genoux fléchis et pieds à plat
      - Placez-vous sous une barre posée sur un rack, ou faites-vous passer la barre par des partenaires
      - Saisissez la barre avec les mains un peu plus écartées que la largeur des épaules
      - Tenez la barre bras complètement tendus au-dessus de la poitrine
      - Gardez les omoplates serrées contre le sol

      ### 2. Mouvement
      1. Descendez la barre lentement jusqu'à ce que vos coudes touchent le sol
      2. Gardez les coudes à environ 45 degrés du corps
      3. Marquez une brève pause quand vos triceps entrent en contact avec le sol
      4. Repoussez la barre vers le haut en tendant les bras
      5. Tendez complètement les coudes en haut
      6. Répétez avec des répétitions contrôlées, sans faire rebondir les coudes sur le sol

      ### 3. Respiration
      - Inspirez en descendant la barre
      - Expirez en repoussant la barre vers le haut

      ### 4. Conseils
      - Le sol limite votre amplitude et réduit le stress sur les épaules
      - Marquez une brève pause quand les coudes touchent le sol, sans rebondir
      - Concentrez-vous sur une poussée explosive depuis la position basse
      - Gardez les omoplates serrées pendant tout le mouvement
      - Cette variante permet des charges plus lourdes que le développé à amplitude complète

      ### 5. Erreurs fréquentes
      - Faire rebondir les coudes sur le sol pour créer de l'élan
      - Laisser les coudes s'écarter excessivement
      - Ne pas marquer de pause quand les coudes touchent le sol
      - Cambrer excessivement le dos
      - Utiliser une charge trop lourde au détriment du contrôle
      - Décoller les fessiers du sol

      ### 6. Sécurité et adaptations
      - Utilisez une cage à squat avec les barres de sécurité réglées à la bonne hauteur
