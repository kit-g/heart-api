      ## Aperçu
      Le snowboard est une activité complète, cardiovasculaire et de renforcement, qui sollicite les jambes, la sangle abdominale et le système cardiovasculaire. Il développe la force des jambes, l'équilibre et la stabilité du tronc, et offre un entraînement hivernal stimulant qui engage tout le corps.

      ## Exécution
      ### 1. Sécurité
      - Portez toujours un casque et des protège-poignets
      - Prenez des leçons avec des moniteurs qualifiés
