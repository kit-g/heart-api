      ### 1. Position de départ
      - Réglez la barre à environ hauteur des hanches et chargez-la légèrement
      - Tenez-vous près de la barre, pieds écartés de la largeur des épaules
      - Saisissez la barre en pronation, mains écartées d'environ la largeur des épaules
      - Sortez la barre des crochets et laissez-la pendre à bout de bras

      ### 2. Mouvement
      1. Tirez la barre verticalement le long des rails vers votre clavicule
      2. Menez le mouvement avec les coudes, en les gardant plus hauts que les poignets
      3. Arrêtez-vous quand vos coudes atteignent environ la hauteur des épaules
      4. Redescendez la barre lentement en contrôlant
      5. Répétez le nombre de répétitions contrôlées souhaité

      ### 3. Respiration
      - Expirez en tirant vers le haut
      - Inspirez en redescendant

      ### 4. Conseils
      - Gardez la barre près de votre corps tout au long du mouvement
      - Gardez le buste droit ; évitez de vous pencher en arrière
      - Une prise un peu plus large est souvent plus confortable pour les épaules

      ### 5. Erreurs fréquentes
      - Tirer la barre trop haut, au-dessus de la clavicule
      - Balancer le corps pour hisser la charge
      - Prendre une prise trop serrée, ce qui peut pincer les épaules

      ### 6. Sécurité et adaptations
