  Bicep Curl (Barbell):
    name: Curl biceps (barre)
    instructions: |
      ## Aperçu
      Le curl biceps à la barre est un exercice d'isolation classique qui cible principalement le biceps brachial. Il sollicite aussi le brachial antérieur et le brachio-radial comme muscles secondaires, ce qui en fait l'un des exercices les plus efficaces pour développer le volume et la force des bras.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, une barre en mains en prise supination
      - Placez les mains légèrement plus écartées que la largeur des épaules
      - Laissez la barre pendre à bout de bras devant les cuisses
      - Gardez les coudes près du corps tout au long du mouvement
      - Gainez votre sangle abdominale et maintenez une posture droite

      ### 2. Mouvement
      1. Montez la barre en fléchissant les coudes et en contractant les biceps
      2. Gardez le haut des bras immobile et près du buste
      3. Continuez à monter jusqu'à ce que la barre atteigne la hauteur des épaules
      4. Marquez une pause et contractez les biceps en haut du mouvement
      5. Redescendez lentement la barre vers la position de départ avec contrôle
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Expirez en montant la barre
      - Inspirez en redescendant la barre

      ### 4. Conseils
      - Gardez les coudes collés au corps tout au long du mouvement
      - Évitez tout balancement ou élan pour soulever la charge
      - Concentrez-vous sur la contraction des biceps en haut de chaque répétition
      - Gardez le dos droit et la sangle abdominale stable
      - Contrôlez aussi bien la phase de montée que la phase de descente

      ### 5. Erreurs fréquentes
      - Balancer le corps ou utiliser l'élan pour soulever la charge
      - Laisser les coudes avancer pendant le curl
      - Ne pas tendre complètement les bras en bas
      - Monter la charge trop vite
      - Laisser tomber la charge trop vite en descente
      - Utiliser une charge trop lourde au détriment de la technique

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser la technique
      - Utilisez une barre EZ en cas de gêne aux poignets
      - Variante avancée : réalisez des négatives lentes (3-5 secondes) sur la phase de descente
      - Les débutants peuvent utiliser des haltères pour un positionnement plus naturel des poignets
