  Curtsey Lunges (Barbell):
    name: Fentes croisées (barre)
    instructions: |
      ## Aperçu
      La fente croisée est un exercice unilatéral du bas du corps qui cible principalement les fessiers, les quadriceps et les abducteurs de hanche. Il sollicite également la sangle abdominale et les muscles stabilisateurs, en utilisant un pas en diagonale vers l'arrière pour mettre l'accent sur les fessiers et l'extérieur des hanches.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, des haltères le long du corps
      - Gardez la poitrine haute, la sangle abdominale gainée et le regard vers l'avant
      - Maintenez une bonne posture tout au long du mouvement

      ### 2. Mouvement
      1. Reculez une jambe en la croisant derrière l'autre, dans un mouvement de révérence
      2. Abaissez vos hanches en fléchissant les deux genoux
      3. Continuez jusqu'à ce que votre cuisse avant soit presque parallèle au sol
      4. Gardez la poitrine haute et le buste droit
      5. Poussez sur votre talon avant pour revenir à la position debout
      6. Répétez sur la même jambe ou alternez les jambes pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Inspirez en reculant et en descendant
      - Expirez en poussant pour revenir debout

      ### 4. Conseils
      - Le pas en diagonale met l'accent sur les fessiers et l'extérieur des hanches
      - Gardez le buste droit tout au long du mouvement
      - Concentrez-vous sur l'équilibre et le contrôle pendant le pas croisé vers l'arrière
      - Poussez sur votre talon avant pour revenir debout
      - Laissez les haltères pendre naturellement le long du corps

      ### 5. Erreurs fréquentes
      - Se pencher trop en avant pendant la fente
      - Laisser le genou avant rentrer vers l'intérieur
      - Ne pas reculer et croiser suffisamment la jambe
      - Ne pas descendre suffisamment bas
      - Perdre l'équilibre pendant le pas en diagonale
      - Utiliser l'élan au lieu d'un mouvement contrôlé

      ### 6. Sécurité et adaptations
      - Commencez au poids du corps pour maîtriser le pas en diagonale
      - Tenez-vous à un support pour l'équilibre au début
      - Utilisez des haltères légers lorsque vous ajoutez une charge pour la première fois
      - Variante avancée : augmentez le poids des haltères ou ajoutez un petit rebond en bas du mouvement
    validated: false
