  Triceps Extension (Machine):
    name: Extension des triceps (machine)
    instructions: |
      ## Aperçu
      L'extension des triceps à la machine est un exercice d'isolation qui cible principalement les trois chefs du triceps avec une trajectoire guidée. Il sollicite aussi très légèrement les épaules, la machine fixe assurant stabilité et résistance constante tout au long de l'extension.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur la machine, le dos fermement appuyé contre le dossier
      - Réglez la hauteur du siège afin que vos coudes soient alignés avec l'axe de rotation de la machine
      - Saisissez les poignées en pronation ou en prise neutre, selon la machine
      - Placez vos coudes à environ 90 degrés pour commencer
      - Gardez le haut des bras plaqué contre le support, le cas échéant

      ### 2. Mouvement
      1. Étendez les bras en poussant les poignées vers le bas ou vers l'avant
      2. Gardez le haut des bras immobile contre le support tout au long du mouvement
      3. Continuez jusqu'à l'extension complète des bras
      4. Marquez une pause et contractez les triceps en extension complète
      5. Revenez lentement à la position de départ, en contrôlant le mouvement
      6. Arrêtez-vous juste avant que la pile de poids ne se repose afin de maintenir la tension, puis répétez

      ### 3. Respiration
      - Expirez en étendant les bras
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez le haut des bras parfaitement immobile tout au long du mouvement
      - Maintenez une tension constante en ne laissant pas la pile de poids se reposer
      - Concentrez-vous sur la contraction des triceps en extension complète
      - Contrôlez aussi bien la phase d'extension que le retour
      - Évitez de recourir à l'élan ou aux mouvements du corps

      ### 5. Erreurs fréquentes
      - Décoller le haut des bras ou les coudes du support
      - Utiliser l'élan plutôt qu'une contraction musculaire contrôlée
      - Laisser la pile de poids se reposer complètement entre les répétitions
      - Ne pas atteindre l'extension complète des bras
      - Utiliser une charge trop lourde au détriment de la technique
      - Enchaîner les répétitions trop rapidement

      ### 6. Sécurité et adaptations
      - Réglez la hauteur du siège pour assurer un bon alignement des coudes avec l'axe de rotation
      - Commencez avec une charge légère pour établir la connexion esprit-muscle
      - Variante avancée : ajoutez une pause de 2 à 3 secondes en extension complète
      - Travaillez un bras à la fois si la machine permet un travail unilatéral
