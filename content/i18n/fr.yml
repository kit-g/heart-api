  Overhead Squat (Barbell):
    name: Squat bras tendus (barre)
    instructions: |
      ## Aperçu
      Le squat bras tendus à la barre est un exercice accessoire d'haltérophilie qui cible les quadriceps, les fessiers et l'ensemble de la sangle abdominale. Il exige aussi une mobilité et une stabilité d'épaules importantes, construisant la force globale, l'équilibre et la position de réception utilisée dans les arrachés.

      ## Exécution
      ### 1. Position de départ
      - Commencez avec la barre au-dessus de la tête, en prise large d'arraché
      - Tenez-vous debout, pieds écartés de la largeur des épaules, pointes légèrement vers l'extérieur
      - Verrouillez complètement vos bras, la barre à l'aplomb du milieu du pied
      - Gardez la poitrine haute, la sangle abdominale gainée et le regard vers l'avant
      - Maintenez des épaules actives, en poussant vers le haut dans la barre

      ### 2. Mouvement
      1. Amorcez le squat en fléchissant simultanément les genoux et les hanches
      2. Gardez la barre directement à l'aplomb du milieu du pied pendant la descente
      3. Maintenez les bras verrouillés et les épaules actives tout du long
      4. Descendez jusqu'à ce que les cuisses soient au moins parallèles au sol
      5. Poussez dans les talons pour revenir debout
      6. Gardez la barre au-dessus de la tête et stable tout du long, puis répétez

      ### 3. Respiration
      - Inspirez avant de descendre
      - Bloquez votre respiration pendant la descente et la position basse
      - Expirez en remontant

      ### 4. Conseils
      - Cet exercice exige une excellente mobilité des épaules et des hanches
      - La barre doit rester à l'aplomb du milieu du pied tout du long
      - Gardez les bras verrouillés et poussez constamment vers le haut dans la barre
      - Commencez avec un tube en PVC ou une barre à vide pour apprendre le mouvement
      - Cet exercice construit la position de réception des arrachés

      ### 5. Erreurs fréquentes
      - Laisser les bras fléchir pendant le squat
      - Laisser la barre dériver vers l'avant ou l'arrière
      - Ne pas maintenir des épaules actives poussant dans la barre
      - Mobilité de hanches ou d'épaules insuffisante pour une profondeur correcte
      - Regarder vers le bas au lieu de vers l'avant
      - Tenter le mouvement sans préparation de mobilité adéquate

      ### 6. Sécurité et adaptations
      - Maîtrisez le mouvement avec un tube en PVC avant d'ajouter de la charge
      - Travaillez séparément la mobilité des épaules et des hanches
      - Faites-vous assister d'un pareur lors de l'apprentissage avec charge
      - C'est une préparation essentielle à l'entraînement de l'arraché
