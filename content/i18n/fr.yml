  Incline Chest Fly (Dumbbell):
    name: Écartés inclinés (haltères)
    instructions: |
      ## Aperçu
      Les écartés inclinés avec haltères sont un exercice d'isolation qui cible principalement la partie supérieure du grand pectoral. Ils sollicitent aussi les deltoïdes antérieurs comme stabilisateurs ; la position inclinée avec haltères crée un large arc de mouvement qui étire puis contracte le haut des pectoraux.

      ## Exécution
      ### 1. Position de départ
      - Réglez un banc ajustable sur une inclinaison de 30 à 45 degrés
      - Allongez-vous sur le banc, pieds bien à plat au sol
      - Tenez un haltère dans chaque main, bras tendus au-dessus du haut de votre poitrine
      - Orientez les paumes l'une vers l'autre
      - Gardez une légère flexion des coudes pendant tout le mouvement

      ### 2. Mouvement
      1. Descendez les deux haltères sur les côtés en décrivant un large arc de cercle
      2. Gardez les coudes légèrement fléchis tout au long du mouvement
      3. Continuez à descendre jusqu'à sentir un étirement dans le haut des pectoraux
      4. Marquez une brève pause en bas
      5. Ramenez les haltères l'un vers l'autre au-dessus de la poitrine, dans un mouvement d'enlacement
      6. Contractez le haut des pectoraux en haut et répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en écartant les haltères sur les côtés
      - Expirez en ramenant les haltères l'un vers l'autre

      ### 4. Conseils
      - Conservez la même légère flexion des coudes du début à la fin
      - Concentrez-vous sur l'étirement en bas et la contraction en haut
      - Maintenez les omoplates serrées pendant tout le mouvement
      - L'inclinaison met l'accent sur les fibres du haut des pectoraux
      - Contrôlez la charge tout au long de l'arc de cercle

      ### 5. Erreurs fréquentes
      - Tendre complètement les bras, ce qui transforme l'exercice en développé
      - Trop fléchir les coudes, ce qui réduit le travail des pectoraux
      - Descendre les haltères trop bas et solliciter excessivement les épaules
      - Régler une inclinaison trop forte, ce qui reporte l'effort sur les épaules
      - Utiliser une charge trop lourde et perdre le mouvement en arc de cercle
      - Ne pas contracter en haut du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères légers pour maîtriser l'arc de mouvement sur banc incliné
      - Gardez les coudes légèrement fléchis pour protéger les articulations des épaules
      - Ajustez l'inclinaison entre 30 et 45 degrés selon votre confort
      - Variante avancée : marquez une pause de 2-3 secondes en position étirée, en bas
