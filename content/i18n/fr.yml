      - Décollez le corps du sol pour former une ligne droite de la tête aux talons
      - Engagez la sangle abdominale, serrez les fessiers et gardez la nuque neutre

      ### 2. Mouvement
      1. Tenez cette position statique en maintenant un bon alignement
      2. Gardez le corps en ligne droite, sans affaissement ni élévation des hanches
      3. Respirez régulièrement et maintenez la tension de la sangle abdominale
      4. Concentrez-vous sur des hanches à niveau et stables
      5. Tenez la durée cible, généralement de 20 à 60 secondes ou plus
      6. Redescendez au sol de manière contrôlée une fois terminé

      ### 3. Respiration
      - Respirez régulièrement et naturellement pendant tout le maintien
      - Évitez de retenir votre souffle ; gardez une respiration constante et calme

      ### 4. Conseils
      - Gardez le corps en ligne droite de la tête aux talons
      - Serrez les fessiers pour empêcher le bas du dos de s'affaisser
      - Rentrez le nombril vers la colonne pour activer les muscles profonds de la sangle abdominale
      - Gardez la nuque neutre en fixant un point au sol
      - Répartissez votre poids uniformément entre les avant-bras et les orteils

      ### 5. Erreurs fréquentes
      - Laisser les hanches s'affaisser, ce qui sollicite le bas du dos
      - Monter les hanches trop haut en pique, ce qui réduit l'engagement de la sangle abdominale
      - Retenir son souffle au lieu de respirer naturellement
      - Laisser les épaules remonter vers les oreilles
      - Laisser tomber la tête ou regarder devant soi au lieu de garder la nuque neutre
      - Tenir la position avec une mauvaise technique au lieu de réduire la durée

      ### 6. Sécurité et adaptations
      - Les débutants peuvent commencer sur les genoux plutôt que sur les orteils
      - Réduisez la durée du maintien et visez une technique parfaite avant de l'augmenter
      - Variante avancée : levez une jambe ou un bras pour augmenter la difficulté
      - En cas de gêne dans le bas du dos, vérifiez votre technique et réduisez la durée du maintien
