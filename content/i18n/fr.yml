  Chest Fly (Dumbbell):
    name: Écartés couchés (haltères)
    instructions: |
      ## Aperçu
      Les écartés couchés avec haltères sont un exercice d'isolation qui cible principalement le grand pectoral. Ils sollicitent également les deltoïdes antérieurs comme stabilisateurs ; les haltères créent un large arc de mouvement qui étire puis contracte les muscles pectoraux.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur un banc, pieds bien ancrés au sol
      - Tenez un haltère dans chaque main, bras tendus au-dessus de la poitrine
      - Placez les haltères paumes face à face
      - Gardez une légère flexion des coudes tout au long du mouvement
      - Gardez les omoplates serrées et plaquées contre le banc

      ### 2. Mouvement
      1. Abaissez les deux haltères sur les côtés en décrivant un large arc
      2. Gardez les coudes légèrement fléchis tout au long du mouvement
      3. Continuez à descendre jusqu'à sentir un étirement dans les pectoraux
      4. Marquez une brève pause en bas
      5. Ramenez les haltères l'un vers l'autre au-dessus de la poitrine, comme pour enlacer quelque chose
      6. Contractez les pectoraux en haut et répétez des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en abaissant les haltères sur les côtés
      - Expirez en ramenant les haltères l'un vers l'autre

      ### 4. Conseils
      - Gardez une légère flexion constante des coudes tout au long du mouvement
      - Concentrez-vous sur l'étirement en bas et la contraction en haut
      - Maintenez le serrage des omoplates tout au long du mouvement
      - Imaginez que vous enlacez un gros arbre pendant le mouvement
      - Contrôlez la charge sur tout l'arc de mouvement

      ### 5. Erreurs fréquentes
      - Tendre complètement les bras, ce qui transforme l'exercice en développé
      - Trop plier les coudes, ce qui réduit le travail des pectoraux
      - Descendre les haltères trop bas et solliciter excessivement les épaules
      - Charger trop lourd et perdre l'arc de mouvement
      - Faire rebondir les haltères en bas
      - Ne pas contracter en haut du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec des haltères légers pour maîtriser l'arc de mouvement
      - Gardez les coudes légèrement fléchis pour protéger les articulations des épaules
      - Réalisez l'exercice sur un banc incliné ou décliné pour varier
      - Variante avancée : marquez une pause de 2 à 3 secondes en position d'étirement en bas
