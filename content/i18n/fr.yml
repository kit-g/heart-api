  Standing Leg Curl (Machine):
    name: Leg curl debout (machine)
    instructions: |
      ## Aperçu
      Le leg curl debout est un exercice d'isolation qui cible principalement les ischio-jambiers, en travaillant une jambe à la fois. Les mollets assistent le mouvement, et la position debout permet d'entraîner chaque jambe sur une amplitude complète pendant que la machine soutient votre corps.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous face à la machine et appuyez votre cuisse contre le coussinet de soutien
      - Placez le rouleau derrière une cheville
      - Tenez les poignées pour l'équilibre
      - Gardez le buste droit et la jambe d'appui légèrement fléchie

      ### 2. Mouvement
      1. Remontez votre talon vers vos fessiers en fléchissant le genou
      2. Contractez l'ischio-jambier en haut du mouvement
      3. Redescendez lentement le rouleau jusqu'à la position de départ, en contrôlant
      4. Effectuez le nombre souhaité de répétitions contrôlées
      5. Répétez de l'autre côté

      ### 3. Respiration
      - Expirez en remontant le talon
      - Inspirez en redescendant

      ### 4. Conseils
      - Gardez les hanches immobiles ; seul le genou doit bouger
      - Marquez une brève pause en haut de chaque répétition
      - Effectuez les mêmes répétitions et la même charge des deux côtés

      ### 5. Erreurs fréquentes
      - Balancer la jambe et utiliser l'élan
      - Soulever la hanche pour aider la jambe à monter
      - Laisser tomber la charge pendant la descente

      ### 6. Sécurité et adaptations
      - Commencez léger pour trouver la position du rouleau qui reste confortable pour votre genou
      - Le leg curl assis ou allongé est une alternative plus facile pour les débutants
