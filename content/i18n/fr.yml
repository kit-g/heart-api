      Le tirage haut à la machine est un exercice de tirage qui cible principalement le dos, en particulier les grands dorsaux. Tirer d'une position haute vers le bas et l'arrière fait aussi travailler l'arrière des épaules et les biceps, le support de poitrine maintenant votre buste soutenu tout au long du mouvement.

