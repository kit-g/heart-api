      - Les débutants peuvent effectuer des relevés plus petits, sans monter les genoux aussi haut
      - Placez les mains sous les fessiers pour un soutien supplémentaire du bas du dos
      - Variante avancée : marquez une pause de 2 à 3 secondes en haut de chaque répétition
