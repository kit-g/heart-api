  Upright Row (Dumbbell):
    name: Tirage menton (haltères)
    instructions: |
      ## Aperçu
      Le tirage menton avec haltères est un exercice composé du haut du corps qui cible principalement les deltoïdes moyens et le trapèze supérieur. Il sollicite aussi les deltoïdes antérieurs et les biceps, les haltères permettant un mouvement indépendant de chaque bras pour élargir les épaules et développer le haut des trapèzes.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés de la largeur des épaules, un haltère dans chaque main
      - Laissez les haltères pendre à bout de bras devant vos cuisses
      - Gardez les paumes tournées vers votre corps
      - Tenez-vous droit, poitrine haute et sangle abdominale gainée
      - Conservez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Tirez les haltères verticalement le long de votre corps
      2. Menez le mouvement avec les coudes, en les gardant plus hauts que les mains
      3. Continuez à tirer jusqu'à ce que les haltères atteignent le haut de la poitrine ou la hauteur des épaules
      4. Marquez une brève pause en haut
      5. Redescendez lentement les haltères à la position de départ en contrôlant
      6. Répétez le nombre de répétitions contrôlées souhaité

      ### 3. Respiration
      - Expirez en tirant les haltères vers le haut
      - Inspirez en redescendant les haltères

      ### 4. Conseils
      - Gardez les haltères près de votre corps pendant le tirage
      - Menez le mouvement avec les coudes tout au long de l'exercice
      - Concentrez-vous sur la traction avec les épaules et les trapèzes
      - Contrôlez aussi bien la phase de tirage que la phase de descente
      - Les haltères permettent une trajectoire de bras plus naturelle

      ### 5. Erreurs fréquentes
      - Tirer trop haut et sursolliciter les épaules
      - Laisser les coudes descendre sous les poignets
      - Utiliser l'élan ou balancer le corps
      - Se pencher en arrière pendant le tirage
      - Utiliser une prise trop large, ce qui peut provoquer un conflit d'épaule
      - Aller trop vite et perdre le contrôle

      ### 6. Sécurité et adaptations
      - Utilisez une largeur de prise modérée pour éviter la gêne aux épaules
      - Arrêtez-vous à hauteur des épaules si vous ressentez la moindre douleur à l'épaule
      - Commencez avec des haltères légers pour maîtriser le schéma de mouvement
      - En cas de gêne à l'épaule, envisagez le face pull comme alternative
