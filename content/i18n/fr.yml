  Squat Row (Band):
    name: Squat avec tirage (bande)
    instructions: |
      ## Aperçu
      Le squat avec tirage à la bande est un exercice composé pour tout le corps qui combine un squat et un mouvement de rowing. Il cible principalement les jambes, le dos et la sangle abdominale, en utilisant une bande élastique pour coordonner le bas et le haut du corps tout en développant force et coordination.

      ## Exécution
      ### 1. Position de départ
      - Fixez une bande élastique à hauteur de poitrine
      - Tenez-vous face au point d'ancrage, une extrémité de la bande dans chaque main
      - Reculez jusqu'à ce que la bande soit tendue, bras tendus
      - Placez les pieds à la largeur des épaules
      - Gardez la poitrine haute et la sangle abdominale engagée

      ### 2. Mouvement
      1. Descendez en squat tout en laissant vos bras s'étendre vers l'avant
      2. En bas du squat, commencez à tirer la bande vers vous
      3. Tirez la bande vers votre poitrine pendant que vous remontez du squat
      4. Terminez debout, la bande tirée contre la poitrine
      5. Étendez les bras en redescendant dans le squat suivant
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant en squat
      - Expirez pendant le tirage et la remontée

      ### 4. Conseils
      - Coordonnez le squat et le tirage de façon fluide
      - Maintenez une tension constante sur la bande
      - Engagez votre sangle abdominale pour rester stable
      - Faites travailler ensemble le bas et le haut du corps
      - Cet exercice développe la coordination de tout le corps

      ### 5. Erreurs fréquentes
      - Ne pas coordonner le squat et le tirage
      - Laisser la tension de la bande retomber
      - Arrondir le dos pendant le squat
      - Tirer uniquement avec les bras sans engager le dos
      - Profondeur de squat insuffisante
      - Aller trop vite et perdre le contrôle

      ### 6. Sécurité et adaptations
      - Ajustez la résistance en vous rapprochant ou en vous éloignant de l'ancrage
      - Privilégiez la technique à la vitesse ou à la résistance
      - Travaillez d'abord squats et tirages séparément pour maîtriser chacun
      - Fixez solidement la bande avant de commencer
