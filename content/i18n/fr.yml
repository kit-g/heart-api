      6. Arrêtez-vous juste avant que la charge ne se repose sur la pile pour garder la tension, puis répétez

      ### 3. Respiration
      - Expirez en tirant les bras vers le bas et l'avant
      - Inspirez en revenant à la position de départ

      ### 4. Conseils
      - Gardez le dos fermement appuyé contre le dossier
      - Concentrez-vous sur la traction des grands dorsaux et des pectoraux, pas des bras
      - Maintenez une tension constante en ne laissant pas la charge se reposer sur la pile
      - Gardez les coudes en place sur les coussins pendant tout le mouvement
      - Contrôlez aussi bien la traction que le retour

      ### 5. Erreurs fréquentes
      - Décoller le dos du dossier pendant la traction
      - Utiliser l'élan plutôt qu'une contraction musculaire contrôlée
      - Laisser la charge se reposer sur la pile entre les répétitions
      - Tirer avec les bras au lieu des grands dorsaux et des pectoraux
      - Ne pas travailler sur une amplitude complète
      - Enchaîner les répétitions trop rapidement

      ### 6. Sécurité et adaptations
      - Réglez la hauteur du siège pour aligner vos épaules avec l'axe de rotation
      - Commencez léger pour installer la connexion esprit-muscle
      - Variante avancée : marquez une pause de 2-3 secondes en position basse, en contraction
      - Concentrez-vous sur l'étirement en haut et la contraction en bas
