  Concentration Curl (Dumbbell):
    name: Curl concentré (haltère)
    instructions: |
      ## Aperçu
      Le curl concentré est un exercice d'isolation qui cible principalement le biceps brachial avec une concentration maximale sur le muscle. Il sollicite aussi le brachial antérieur et le brachio-radial, la position assise et calée éliminant l'élan pour une isolation stricte des biceps.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur un banc, jambes bien écartées
      - Tenez un haltère dans une main, bras pendant à la verticale
      - Placez l'arrière du haut du bras contre l'intérieur de la cuisse
      - Penchez-vous légèrement vers l'avant et prenez appui avec la main libre sur la cuisse opposée
      - Gardez la poitrine relevée et la sangle abdominale gainée

      ### 2. Mouvement
      1. Montez l'haltère en contractant le biceps
      2. Gardez le haut du bras fermement appuyé contre l'intérieur de la cuisse tout au long du mouvement
      3. Continuez à monter jusqu'à ce que l'haltère atteigne la hauteur de l'épaule
      4. Marquez une pause et contractez fortement le biceps en haut
      5. Redescendez lentement l'haltère vers la position de départ avec contrôle
      6. Effectuez toutes les répétitions d'un côté, puis répétez de l'autre côté

      ### 3. Respiration
      - Expirez en montant l'haltère
      - Inspirez en redescendant l'haltère

      ### 4. Conseils
      - Gardez le haut du bras parfaitement immobile contre la cuisse
      - Recherchez une contraction pure du biceps, sans aucun mouvement du corps
      - Contractez fortement le biceps en haut de chaque répétition
      - Ne laissez pas l'haltère se balancer et n'utilisez pas d'élan
      - Contrôlez la charge sur toute l'amplitude du mouvement

      ### 5. Erreurs fréquentes
      - Décoller le coude de la cuisse pendant le curl
      - Utiliser l'élan ou balancer la charge
      - Ne pas atteindre l'amplitude complète en haut ou en bas
      - Se pencher en arrière ou balancer le buste
      - Utiliser une charge trop lourde au détriment d'une technique stricte
      - Enchaîner les répétitions à la hâte au lieu de se concentrer sur la contraction musculaire

      ### 6. Sécurité et adaptations
      - Commencez avec une charge modérée pour garantir une technique stricte
      - Gardez le dos droit pour éviter de solliciter excessivement le bas du dos
      - Variante avancée : ajoutez une pause de 3-5 secondes au pic de contraction
      - Réalisez l'exercice avec le bras calé sur un banc incliné pour varier l'angle
