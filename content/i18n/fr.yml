      La ruade à quatre pattes à la machine Smith est un exercice d'isolation qui cible principalement les fessiers. Elle sollicite aussi les ischio-jambiers, la trajectoire verticale fixe de la barre offrant une résistance stable pour le mouvement d'extension de hanche.

