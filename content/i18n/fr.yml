  Bicycle Crunch:
    name: Crunch bicyclette
    instructions: |
      ## Aperçu
      Le crunch bicyclette est un exercice de gainage dynamique qui cible principalement le grand droit de l'abdomen et les obliques. Il sollicite également les fléchisseurs de hanche et le transverse pendant que vous coordonnez la rotation du buste avec le mouvement alterné des jambes.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous sur le dos sur un tapis, genoux fléchis et pieds à plat au sol
      - Placez les mains légèrement derrière la tête, coudes pointés vers l'extérieur
      - Décollez légèrement les épaules du tapis et engagez la sangle abdominale
      - Levez les pieds du sol, genoux fléchis à 90 degrés
      - Gardez le bas du dos plaqué contre le tapis

      ### 2. Mouvement
      1. Amenez simultanément votre coude droit vers votre genou gauche tout en tendant la jambe droite
      2. Tournez le buste de façon à amener l'épaule (pas seulement le coude) vers le côté opposé
      3. Marquez une brève pause lorsque le coude et le genou se rapprochent
      4. Revenez au centre, les deux genoux fléchis
      5. Répétez de l'autre côté, en amenant le coude gauche vers le genou droit tout en tendant la jambe gauche
      6. Continuez à alterner les côtés dans un mouvement de pédalage fluide et contrôlé

      ### 3. Respiration
      - Expirez pendant la rotation, en amenant le coude vers le genou
      - Inspirez en revenant au centre et en changeant de côté

      ### 4. Conseils
      - Concentrez-vous sur la rotation de tout le buste, pas seulement sur le déplacement des coudes
      - Gardez la nuque détendue et évitez de tirer sur votre tête avec les mains
      - Maintenez une tension constante dans la sangle abdominale pendant tout le mouvement
      - Privilégiez le contrôle plutôt que la vitesse pour une efficacité maximale
      - Gardez le bas du dos plaqué contre le tapis pour protéger votre colonne

      ### 5. Erreurs fréquentes
      - Tirer sur la nuque ou la tête au lieu d'engager la sangle abdominale
      - Aller trop vite et perdre la bonne technique
      - Ne bouger que les coudes au lieu de faire pivoter le buste
      - Laisser le bas du dos se cambrer et décoller du tapis
      - Ne pas tendre complètement les jambes à chaque répétition
      - Retenir sa respiration pendant le mouvement

      ### 6. Sécurité et adaptations
      - Les débutants peuvent garder les pieds au sol et effectuer la rotation sans le mouvement des jambes
      - Réduisez l'amplitude en cas de gêne à la nuque ou au bas du dos
      - Progressez en ralentissant le tempo pour augmenter le temps sous tension
      - Variante avancée : marquez une pause de 2 à 3 secondes à chaque rotation
