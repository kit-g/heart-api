  Clean and Jerk (Barbell):
    name: Épaulé-jeté (barre)
    instructions: |
      ## Aperçu
      L'épaulé-jeté est un mouvement complet d'haltérophilie qui sollicite tout le corps. Il combine l'épaulé (du sol aux épaules) et le jeté (des épaules au-dessus de la tête), engageant les jambes, les hanches, le dos, les épaules et la sangle abdominale dans l'un des exercices complets les plus exigeants.

      ## Exécution
      ### 1. Position de départ
      - Effectuez un épaulé complet pour amener la barre à vos épaules
      - Ajustez vos pieds à la largeur des épaules ou un peu plus
      - Gardez les coudes hauts, la barre posée sur vos deltoïdes antérieurs
      - Tenez-vous droit, sangle abdominale gainée, prêt à fléchir

      ### 2. Mouvement
      1. Effectuez un épaulé pour amener la barre à vos épaules
      2. Fléchissez légèrement les genoux en gardant le buste vertical
      3. Poussez explosivement vers le haut en étendant les jambes
      4. Poussez la barre au-dessus de la tête en fendant les jambes ou en les écartant
      5. Verrouillez vos bras, la barre stable au-dessus de la tête
      6. Terminez en ramenant vos pieds sous la barre

      ### 3. Respiration
      - Respirez pendant la mise en place et entre les phases
      - Bloquez votre respiration pendant la flexion et la poussée
      - Expirez une fois la barre verrouillée au-dessus de la tête

      ### 4. Conseils
      - C'est le mouvement d'haltérophilie le plus exigeant techniquement
      - La flexion doit être contrôlée et verticale
      - Utilisez la poussée des jambes, pas seulement les bras, pour amener la barre au-dessus de la tête
      - Travaillez séparément le jeu de jambes du jeté en fente ou du jeté en puissance
      - Maîtrisez d'abord l'épaulé et le mouvement au-dessus de la tête indépendamment

      ### 5. Erreurs fréquentes
      - Fléchir vers l'avant au lieu de rester vertical
      - Ne pas utiliser assez la poussée des jambes dans le jeté
      - Pousser avec les bras avant de pousser avec les jambes
      - Mauvaise trajectoire de barre pendant la phase de jeté
      - Ne pas verrouiller complètement les bras au-dessus de la tête
      - Tenter le mouvement sans base technique adéquate

      ### 6. Sécurité et adaptations
      - Exige un encadrement poussé par un instructeur d'haltérophilie qualifié
      - Maîtrisez l'épaulé et le jeté séparément avant de les combiner
      - Utilisez des disques amortisseurs et un plateau d'haltérophilie adapté
      - Progressez très graduellement dans les charges
