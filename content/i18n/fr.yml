  Push Up (Band):
    name: Pompes (bande)
    instructions: |
      ## Aperçu
      Les pompes avec bande élastique sont un exercice au poids du corps à résistance accrue qui cible principalement le grand pectoral. Elles sollicitent aussi les deltoïdes antérieurs, les triceps et la sangle abdominale ; la bande élastique ajoute une résistance progressive tout au long du mouvement pour augmenter la difficulté.

      ## Exécution
      ### 1. Position de départ
      - Passez une bande élastique en travers du haut de votre dos
      - Tenez une extrémité de la bande dans chaque main
      - Placez-vous en planche haute, mains un peu plus écartées que la largeur des épaules
      - Coincez la bande sous vos paumes, au sol
      - Gardez le corps aligné de la tête aux talons

      ### 2. Mouvement
      1. Descendez votre corps en fléchissant les coudes contre la résistance de la bande
      2. Gardez les coudes à environ 45 degrés du corps
      3. Continuez à descendre jusqu'à ce que votre poitrine frôle le sol
      4. Marquez une brève pause en bas
      5. Poussez dans vos paumes contre la résistance de la bande pour revenir à la position de départ
      6. Répétez le nombre de répétitions souhaité de façon contrôlée

      ### 3. Respiration
      - Inspirez en descendant
      - Expirez en repoussant vers la position de départ

      ### 4. Conseils
      - La bande offre plus de résistance en haut du mouvement
      - Maintenez le corps aligné de la tête aux talons pendant tout le mouvement
      - Gardez la sangle abdominale et les fessiers contractés pour éviter tout affaissement
      - Concentrez-vous sur un mouvement contrôlé dans les deux sens
      - Ajustez l'épaisseur de la bande pour moduler la résistance

      ### 5. Erreurs fréquentes
      - Laisser les hanches s'affaisser ou monter en pique
      - Écarter excessivement les coudes
      - Ne pas travailler sur une amplitude complète
      - Laisser la bande glisser de sa position
      - Utiliser l'élan plutôt qu'un mouvement contrôlé
      - Retenir sa respiration pendant le mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une bande de résistance plus légère pour maîtriser le mouvement
      - Faites des pompes sur les genoux avec la bande si nécessaire
      - Ajustez la tension en modifiant la position des mains ou l'épaisseur de la bande
      - Variante avancée : utilisez une bande plus résistante ou ajoutez une pause en bas
