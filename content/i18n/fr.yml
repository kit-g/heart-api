  Upright Row (Cable):
    name: Tirage menton (poulie)
    instructions: |
      ## Aperçu
      Le tirage menton à la poulie est un exercice polyarticulaire qui cible principalement les deltoïdes latéraux et le haut des trapèzes. Il sollicite aussi les biceps, les avant-bras et la partie moyenne des trapèzes, la poulie basse assurant une tension constante tout au long de ce mouvement de tirage vertical.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous face à une poulie basse munie d'une barre droite ou d'une corde
      - Saisissez l'accessoire en pronation, mains légèrement plus rapprochées que la largeur des épaules
      - Tenez-vous droit, pieds écartés à la largeur des hanches
      - Laissez vos bras pendre tendus, le câble sous tension
      - Gardez les épaules en arrière et la sangle abdominale gainée

      ### 2. Mouvement
      1. Tirez l'accessoire vers le haut le long du corps en élevant les coudes
      2. Menez le mouvement avec les coudes, en les gardant plus hauts que les poignets
      3. Continuez à tirer jusqu'à ce que l'accessoire atteigne le haut de la poitrine ou le menton
      4. Gardez l'accessoire près du corps tout au long du mouvement
      5. Marquez une brève pause en haut du mouvement
      6. Redescendez lentement l'accessoire à la position de départ, en contrôlant le mouvement

      ### 3. Respiration
      - Expirez en tirant l'accessoire vers le haut
      - Inspirez en le redescendant

      ### 4. Conseils
      - Menez le mouvement avec les coudes, pas avec les mains
      - Gardez l'accessoire près du corps tout au long du mouvement
      - Évitez de hausser les épaules en haut du mouvement
      - Maintenez une tension constante en ne laissant pas la pile de poids se reposer
      - Contrôlez aussi bien la montée que la descente

      ### 5. Erreurs fréquentes
      - Tirer trop haut et solliciter excessivement les épaules
      - Laisser les coudes descendre sous les poignets
      - Utiliser l'élan ou balancer le corps
      - Laisser la pile de poids se reposer entre les répétitions
      - Se pencher vers l'arrière pendant le tirage
      - Utiliser une prise trop large, ce qui peut provoquer un conflit à l'épaule

      ### 6. Sécurité et adaptations
      - Utilisez une largeur de prise modérée pour éviter toute gêne aux épaules
      - Arrêtez-vous à hauteur des épaules en cas de douleur à l'épaule
      - Essayez la corde pour une position des mains plus naturelle
      - Variante avancée : travaillez un bras à la fois pour un accent unilatéral
