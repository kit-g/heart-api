  Mountain Climber:
    name: Mountain climbers
    instructions: |
      ## Aperçu
      Le mountain climber est un exercice dynamique complet qui cible principalement la sangle abdominale, les fléchisseurs de hanche et les épaules. Il sollicite aussi les quadriceps et le système cardiovasculaire, en utilisant un mouvement de course depuis la position de planche pour développer l'endurance, la coordination et la stabilité de la sangle abdominale.

      ## Exécution
      ### 1. Position de départ
      - Commencez en planche haute, les mains directement sous les épaules
      - Gardez le corps aligné en ligne droite de la tête aux talons
      - Engagez la sangle abdominale et gardez les hanches stables
      - Placez les pieds écartés à la largeur des hanches

      ### 2. Mouvement
      1. Ramenez un genou vers la poitrine dans un mouvement de course
      2. Changez rapidement de jambe en tendant la jambe fléchie vers l'arrière et en ramenant l'autre genou vers l'avant
      3. Continuez à alterner les jambes dans un mouvement de course rythmé
      4. Gardez la sangle abdominale contractée et les hanches stables tout au long de l'exercice
      5. Maintenez un rythme régulier ou accélérez pour augmenter l'intensité
      6. Continuez pendant le nombre de répétitions ou la durée souhaités

      ### 3. Respiration
      - Respirez de façon rythmée et régulière tout au long du mouvement
      - Évitez de retenir votre respiration

      ### 4. Conseils
      - Gardez la sangle abdominale engagée pour empêcher les hanches de s'affaisser ou de remonter
      - Maintenez la position de planche tout au long du mouvement
      - Concentrez-vous sur le rapprochement des genoux vers la poitrine, pas seulement sur le déplacement des jambes
      - Commencez lentement pour maîtriser la technique avant d'accélérer
      - Gardez les mains fermement ancrées au sol et les épaules stables

      ### 5. Erreurs fréquentes
      - Laisser les hanches s'affaisser ou remonter en pique
      - Faire rebondir les hanches de haut en bas à chaque répétition
      - Ne pas ramener les genoux assez près de la poitrine
      - Laisser les épaules s'arrondir vers l'avant
      - Aller trop vite et perdre la bonne posture
      - Retenir sa respiration pendant l'exercice

      ### 6. Sécurité et adaptations
      - Commencez par des mountain climbers lents pour maîtriser la technique
      - Surélevez les mains sur un banc pour une variante plus facile
      - Effectuez des répétitions lentes et contrôlées pour renforcer l'engagement de la sangle abdominale
      - Variante avancée : ajoutez une rotation en amenant le genou vers le coude opposé, ou augmentez la vitesse
