  Goblet Squat (Kettlebell):
    name: Goblet squat (kettlebell)
    instructions: |
      ## Aperçu
      Le goblet squat est un exercice polyarticulaire du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite aussi la sangle abdominale et le haut du dos, la kettlebell ou l'haltère tenu devant la poitrine favorisant une bonne mécanique de squat et un buste redressé.

      ## Exécution
      ### 1. Position de départ
      - Tenez une kettlebell par les cornes (poignées) ou un haltère à la verticale à hauteur de poitrine
      - Tenez-vous debout, pieds écartés un peu plus que la largeur des épaules
      - Orientez les pointes de pieds légèrement vers l'extérieur
      - Gardez la poitrine haute, la sangle abdominale gainée et les coudes pointés vers le bas
      - Maintenez le buste droit tout au long du mouvement

      ### 2. Mouvement
      1. Amorcez le squat en fléchissant simultanément les genoux et les hanches
      2. Gardez la kettlebell près de la poitrine tout au long du mouvement
      3. Descendez jusqu'à ce que vos coudes touchent l'intérieur de vos genoux, ou plus bas
      4. Gardez la poitrine haute et le poids sur les talons
      5. Poussez dans les talons pour revenir à la position debout
      6. Étendez complètement les hanches et les genoux en haut, puis recommencez

      ### 3. Respiration
      - Inspirez pendant la descente en squat
      - Expirez pendant la remontée

      ### 4. Conseils
      - La charge tenue à l'avant favorise une bonne technique de squat
      - Utilisez la kettlebell comme contrepoids pour vous asseoir plus profondément
      - Gardez les coudes à l'intérieur des genoux en position basse
      - Poussez les genoux vers l'extérieur à la descente comme à la remontée
      - Cette variante est excellente pour apprendre la mécanique du squat

      ### 5. Erreurs fréquentes
      - Laisser la poitrine s'affaisser vers l'avant
      - Ne pas atteindre une profondeur suffisante
      - Laisser les genoux rentrer vers l'intérieur
      - Laisser la kettlebell s'éloigner de la poitrine
      - Monter sur la pointe des pieds au lieu de garder le poids sur les talons
      - Précipiter les répétitions au lieu d'un mouvement contrôlé

      ### 6. Sécurité et adaptations
      - Commencez avec une kettlebell légère pour maîtriser le schéma de mouvement
      - Utilisez un haltère si vous n'avez pas de kettlebell
      - Placez un box derrière vous pour assurer une profondeur constante
      - Variante avancée : ajoutez une pause en bas ou réalisez des goblet squats en tempo
