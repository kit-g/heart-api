      1. Tirez la poignée vers votre épaule en amenant le coude vers le bas et l'arrière
      2. Gardez le buste stable et évitez toute rotation excessive
      3. Continuez jusqu'à ce que la poignée atteigne l'épaule ou le haut de la poitrine
      4. Serrez l'omoplate vers le bas et l'arrière en bas du mouvement
      5. Ramenez lentement la poignée à la position de départ, en contrôlant
      6. Effectuez toutes les répétitions d'un côté, puis passez à l'autre côté

      ### 3. Respiration
      - Expirez en tirant la poignée vers le bas
      - Inspirez en revenant à la position de départ

