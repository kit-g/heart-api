  Deadlift High Pull (Barbell):
    name: Soulevé de terre avec tirage haut (barre)
    instructions: |
      ## Aperçu
      Le soulevé de terre avec tirage haut à la barre est un exercice accessoire d'haltérophilie qui cible l'ensemble de la chaîne postérieure, les trapèzes et les épaules. Il combine un soulevé de terre et un tirage vertical explosif, développant la puissance et enseignant la mécanique du deuxième tirage utilisée dans les épaulés et les arrachés.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés de la largeur des hanches, la barre à l'aplomb du milieu du pied
      - Saisissez la barre un peu plus large que la largeur des épaules
      - Fléchissez les hanches et les genoux pour atteindre la barre
      - Gardez le dos plat, la poitrine haute et les épaules au-dessus de la barre
      - Gainez votre sangle abdominale et engagez vos grands dorsaux avant de tirer

      ### 2. Mouvement
      1. Effectuez un soulevé de terre en poussant avec les jambes
      2. Quand la barre atteint la mi-cuisse, étendez explosivement les hanches et les genoux
      3. Haussez les épaules et tirez la barre vers le haut, coudes hauts
      4. Continuez à tirer jusqu'à ce que la barre atteigne la poitrine ou le bas des côtes
      5. Redescendez la barre à la position de départ en contrôlant
      6. Répétez le nombre de répétitions explosives souhaité

      ### 3. Respiration
      - Inspirez avant de commencer le tirage
      - Bloquez votre respiration pendant le tirage explosif
      - Expirez en redescendant la barre

      ### 4. Conseils
      - Concentrez-vous sur une extension de hanches explosive à mi-cuisse
      - Menez le tirage haut avec les coudes
      - Gardez la barre près de votre corps tout du long
      - Cet exercice enseigne le deuxième tirage des mouvements d'haltérophilie
      - Utilisez une charge plus légère que votre maximum au soulevé de terre

      ### 5. Erreurs fréquentes
      - Tirer avec les bras trop tôt, avant l'extension des hanches
      - Ne pas étendre complètement les hanches et les chevilles à la position de puissance
      - Laisser la barre s'éloigner du corps
      - Utiliser trop de charge et perdre la vitesse explosive
      - Arrondir le dos pendant le tirage
      - Ne pas garder les coudes hauts pendant la phase de tirage

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser le mouvement explosif
      - C'est un exercice accessoire pour l'haltérophilie
      - Maîtrisez le soulevé de terre avant d'ajouter le tirage haut
      - Utilisez-le pour développer la puissance des épaulés et des arrachés
