  Reverse Crunch:
    name: Crunch inversé
    instructions: |
      ## Aperçu
      Le crunch inversé est un exercice de gainage au poids du corps qui cible principalement la partie basse du grand droit de l'abdomen. Il sollicite également les fléchisseurs de hanche, les obliques et le transverse comme stabilisateurs, ce qui le rend efficace pour renforcer le bas des abdominaux avec moins de tension sur la nuque que les crunchs traditionnels.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur le dos sur un tapis, genoux fléchis à 90 degrés
      - Levez les pieds du sol de sorte que vos cuisses soient perpendiculaires au sol
      - Placez les bras le long du corps, paumes vers le bas, pour vous soutenir
      - Plaquez le bas du dos contre le tapis et engagez la sangle abdominale
      - Gardez la tête et le haut du dos détendus sur le tapis

      ### 2. Mouvement
      1. Décollez les hanches du tapis en contractant le bas des abdominaux
      2. Enroulez le bassin vers la cage thoracique, en amenant les genoux vers la poitrine
      3. Concentrez-vous sur vos abdominaux pour soulever les hanches, pas sur l'élan
      4. Marquez une brève pause en haut, lorsque les hanches sont complètement soulevées
      5. Redescendez lentement les hanches à la position de départ de manière contrôlée
      6. Arrêtez-vous juste avant que les pieds ne touchent le sol pour maintenir la tension, puis répétez

      ### 3. Respiration
      - Expirez pendant que vous soulevez les hanches et enroulez le bassin
      - Inspirez en redescendant à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur l'enroulement du bassin plutôt que sur le simple soulèvement des jambes
      - Gardez le bas du dos plaqué contre le tapis tout au long de l'exercice
      - Bougez lentement et avec contrôle pour maximiser l'engagement des abdominaux
      - Utilisez vos mains seulement pour l'équilibre, pas pour vous pousser
      - Maintenez une tension constante sur les abdominaux en ne relâchant pas complètement entre les répétitions

      ### 5. Erreurs fréquentes
      - Utiliser l'élan pour balancer les jambes au lieu d'une contraction contrôlée
      - Ne pas décoller les hanches du tapis et se contenter de bouger les jambes
      - Laisser le bas du dos se cambrer pendant le mouvement
      - Aller trop vite et sacrifier la technique
      - Pousser avec les bras au lieu d'utiliser la sangle abdominale
      - Se relâcher complètement entre les répétitions et perdre la tension de la sangle abdominale

      ### 6. Sécurité et adaptations
      - Les débutants peuvent réduire l'amplitude en n'amenant pas les genoux aussi près de la poitrine
      - Placez les mains sous les fessiers pour un soutien supplémentaire du bas du dos
      - Variante avancée : tenez un médecine-ball entre les genoux pour ajouter de la résistance
      - En cas de gêne dans le bas du dos, privilégiez des mouvements plus petits et mieux contrôlés
    validated: false
    source_digest: 43d83c25c206
  Reverse Plank:
    name: Planche inversée
    instructions: |
      ## Aperçu
      La planche inversée est un exercice de gainage isométrique qui cible principalement le transverse, le bas du dos et les fessiers. Elle sollicite également les épaules, les ischio-jambiers et les stabilisateurs du haut du dos, ce qui la rend efficace pour renforcer la chaîne postérieure et améliorer la posture.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur un tapis, jambes tendues devant vous
      - Placez les mains au sol derrière vous, doigts pointés vers les pieds
      - Écartez les mains de la largeur des épaules, bras tendus
      - Engagez la sangle abdominale et préparez-vous à soulever les hanches
      - Gardez les pieds serrés ou écartés de la largeur des hanches

      ### 2. Mouvement
      1. Poussez dans les mains et les talons pour décoller les hanches du sol
      2. Montez les hanches jusqu'à ce que votre corps forme une ligne droite de la tête aux talons
      3. Gardez les bras tendus et les épaules abaissées
      4. Engagez les fessiers et la sangle abdominale pour maintenir la position
      5. Tenez cette position statique pendant la durée cible, généralement de 20 à 45 secondes
      6. Redescendez les hanches au sol de manière contrôlée une fois terminé

      ### 3. Respiration
      - Respirez régulièrement et naturellement pendant tout le maintien
      - Évitez de retenir votre souffle ; gardez une respiration constante et calme

      ### 4. Conseils
      - Gardez le corps en ligne droite, sans affaissement ni élévation des hanches
      - Serrez les fessiers pendant tout le maintien pour protéger le bas du dos
      - Poussez la poitrine vers le haut et ouvrez-la pour engager le haut du dos
      - Gardez la nuque neutre en regardant légèrement vers le haut
      - Répartissez votre poids uniformément entre les mains et les talons

      ### 5. Erreurs fréquentes
      - Laisser les hanches s'affaisser, ce qui sollicite le bas du dos
      - Fléchir les bras au lieu de les garder tendus
      - Laisser tomber la tête trop loin en arrière, ce qui sollicite la nuque
      - Retenir son souffle au lieu de respirer naturellement
      - Ne pas engager les fessiers, ce qui reporte une contrainte excessive sur le bas du dos
      - Tenir la position avec une mauvaise technique au lieu de réduire la durée

      ### 6. Sécurité et adaptations
      - Les débutants peuvent commencer genoux fléchis (position de table inversée)
      - Réduisez la durée du maintien et visez une technique parfaite avant de l'augmenter
      - Variante avancée : levez une jambe pour augmenter la difficulté
      - En cas de gêne aux poignets, effectuez l'exercice sur les avant-bras
    validated: false
    source_digest: aadf60e05173
  Russian Twist:
    name: Rotations russes
    instructions: |
      ## Aperçu
      Les rotations russes sont un exercice de rotation dynamique pour la sangle abdominale qui cible principalement les obliques et le transverse de l'abdomen. Il sollicite aussi le grand droit de l'abdomen et les fléchisseurs de hanche comme stabilisateurs, ce qui en fait un exercice efficace pour développer la force en rotation et la stabilité de la sangle abdominale.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur un tapis, genoux fléchis et pieds à plat au sol
      - Penchez-vous légèrement en arrière pour engager votre sangle abdominale, en formant un V entre le buste et les cuisses
      - Décollez légèrement les pieds du sol pour augmenter la difficulté, ou gardez-les au sol
      - Joignez les mains devant la poitrine
      - Gardez le dos droit et la sangle abdominale gainée tout au long du mouvement

      ### 2. Mouvement
      1. Tournez le buste vers la droite, en amenant les mains vers le sol à côté de la hanche
      2. Gardez les hanches face à l'avant pendant que le haut du corps pivote
      3. Marquez une courte pause lorsque vos mains touchent le sol ou s'en approchent
      4. Repassez par le centre pour tourner du côté opposé
      5. Amenez les mains vers le sol à côté de la hanche gauche
      6. Continuez à alterner les côtés dans un mouvement contrôlé et rythmé pendant le nombre de répétitions souhaité

      ### 3. Respiration
      - Expirez en tournant de chaque côté
      - Inspirez en repassant par le centre

      ### 4. Conseils
      - Initiez la rotation depuis la sangle abdominale, pas depuis les bras
      - Gardez la poitrine relevée et le dos droit tout au long du mouvement
      - Maintenez une inclinaison arrière constante sans vous affaisser vers l'avant
      - Privilégiez le contrôle plutôt que la vitesse pour une efficacité maximale
      - Gardez les hanches stables et face à l'avant

      ### 5. Erreurs fréquentes
      - Faire tourner les hanches avec le buste au lieu de les garder stables
      - Arrondir le dos et s'affaisser vers l'avant
      - Aller trop vite et utiliser l'élan au lieu du contrôle
      - Ne bouger que les bras au lieu de faire pivoter tout le buste
      - Retenir sa respiration pendant le mouvement
      - Se pencher trop en arrière, ce qui peut solliciter excessivement le bas du dos

      ### 6. Sécurité et adaptations
      - Les débutants peuvent garder les pieds au sol pour plus de stabilité
      - Variante avancée : tenez un disque, un haltère ou un ballon lesté pour ajouter de la résistance
      - Réduisez l'amplitude si vous ressentez une gêne dans le bas du dos
      - Progressez en levant les pieds plus haut ou en ajoutant une pause de chaque côté
