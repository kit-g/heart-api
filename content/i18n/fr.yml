  Hang Clean (Barbell):
    name: Épaulé en suspension (barre)
    instructions: |
      ## Aperçu
      L'épaulé en suspension est une variante d'haltérophilie qui cible les quadriceps, les fessiers, les ischio-jambiers et le haut du dos. Il démarre debout plutôt qu'au sol, en se concentrant sur l'extension de hanches explosive et les phases de réception tout en réduisant la complexité technique.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, une barre à bout de bras
      - Placez la barre à mi-cuisse, pieds écartés de la largeur des hanches
      - Gardez la poitrine haute, le dos plat et la sangle abdominale gainée
      - Fléchissez légèrement les hanches, genoux fléchis
      - Saisissez la barre juste à l'extérieur de vos jambes, avec une prise crochet si possible

      ### 2. Mouvement
      1. Descendez la barre légèrement sous les genoux en contrôlant
      2. Étendez explosivement les hanches et les genoux pour sauter vers le haut
      3. Haussez les épaules et passez sous la barre
      4. Réceptionnez la barre sur l'avant des épaules en position de squat avant
      5. Relevez-vous complètement, la barre sur les épaules
      6. Redescendez la barre en position de suspension et répétez

      ### 3. Respiration
      - Inspirez pendant la phase de descente
      - Bloquez votre respiration pendant le tirage explosif et la réception
      - Expirez après vous être relevé

      ### 4. Conseils
      - Cette variante se concentre sur la position de puissance de l'épaulé
      - Gardez la barre près de votre corps pendant le tirage
      - Réceptionnez la barre avec les coudes hauts et vers l'avant
      - La position en suspension réduit les exigences techniques par rapport à l'épaulé depuis le sol
      - Concentrez-vous sur une extension de hanches explosive

      ### 5. Erreurs fréquentes
      - Descendre la barre trop lentement et perdre la tension
      - Tirer avec les bras au lieu de pousser avec les hanches
      - Laisser la barre s'éloigner du corps
      - Réceptionner avec les coudes bas ou en mauvaise position
      - Ne pas étendre complètement les hanches avant de passer dessous
      - Utiliser trop de charge avant de maîtriser la technique

      ### 6. Sécurité et adaptations
      - Apprenez cette variante avant de progresser vers l'épaulé complet depuis le sol
      - Maîtrisez l'épaulé en puissance (réception haute) avant l'épaulé complet en squat
      - Utilisez des disques amortisseurs pour lâcher la barre en sécurité si nécessaire
      - Faites-vous encadrer pour une bonne technique d'haltérophilie
