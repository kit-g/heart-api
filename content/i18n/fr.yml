  Jackknife Sit Up:
    name: Jackknife (couteau suisse)
    instructions: |
      ## Aperçu
      Le jackknife est un exercice de gainage dynamique qui cible principalement l'ensemble du grand droit de l'abdomen. Il sollicite également les fléchisseurs de hanche, les obliques et le transverse pendant que vous soulevez simultanément le haut et le bas du corps, créant une contraction intense de toute la sangle abdominale.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur le dos sur un tapis, bras tendus au-dessus de la tête
      - Gardez les jambes tendues et serrées, en pleine extension sur le tapis
      - Engagez la sangle abdominale et plaquez le bas du dos contre le tapis
      - Gardez la tête en position neutre, alignée avec la colonne

      ### 2. Mouvement
      1. Soulevez simultanément les jambes et le haut du corps du tapis
      2. Tendez les mains vers les orteils en gardant les jambes tendues
      3. Cherchez à rapprocher la cage thoracique et les hanches en haut du mouvement
      4. Tenez en équilibre sur les fessiers au sommet du mouvement
      5. Marquez une brève pause lorsque vos mains touchent ou s'approchent de vos pieds
      6. Redescendez lentement le haut et le bas du corps de manière contrôlée
      7. Revenez à la position de départ et répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Expirez pendant que vous vous repliez et rapprochez les deux moitiés du corps
      - Inspirez en redescendant à la position de départ

      ### 4. Conseils
      - Concentrez-vous sur la sangle abdominale pour replier votre corps, pas sur l'élan
      - Gardez les jambes tendues pendant tout le mouvement
      - Maintenez le contrôle pendant la montée comme pendant la descente
      - Évitez de tirer avec les bras ; laissez la sangle abdominale faire le travail
      - Maintenez une tension constante sur les abdominaux en bougeant lentement

      ### 5. Erreurs fréquentes
      - Utiliser l'élan pour se balancer vers le haut au lieu d'une contraction contrôlée
      - Fléchir les genoux pour faciliter l'exercice
      - Laisser les bras tirer au lieu de laisser la sangle abdominale piloter le mouvement
      - Aller trop vite et perdre le contrôle
      - Ne pas revenir en extension complète à la position de départ
      - Retenir sa respiration pendant le mouvement

      ### 6. Sécurité et adaptations
      - Les débutants devraient commencer par des crunchs et des relevés de jambes séparément avant de les combiner
      - Effectuez une variante genoux fléchis si les jambes tendues sont trop difficiles
      - Variante avancée : tenez un poids léger au-dessus de la tête pour ajouter de la résistance
      - En cas de gêne dans le bas du dos, réduisez votre amplitude de mouvement
