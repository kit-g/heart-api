  Straight Leg Deadlift (Band):
    name: Soulevé de terre jambes droites (bande)
    instructions: |
      ## Aperçu
      Le soulevé de terre jambes droites avec bande est un exercice de flexion de hanches à résistance élastique qui cible principalement les ischio-jambiers et les érecteurs du rachis. Il sollicite également les fessiers et les grands dorsaux, en utilisant la résistance progressive de la bande avec une flexion minimale des genoux pour mettre l'accent sur la chaîne postérieure.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, sur le centre d'une bande élastique
      - Saisissez les deux extrémités de la bande, mains juste à l'extérieur des jambes
      - Tenez-vous droit, poitrine haute, épaules en arrière et sangle abdominale gainée
      - Maintenez une très légère flexion des genoux tout au long du mouvement

      ### 2. Mouvement
      1. Effectuez une flexion de hanches en les poussant vers l'arrière et en abaissant le buste
      2. Gardez le dos plat et la bande près de vos jambes
      3. Gardez les jambes presque tendues, avec une flexion minimale des genoux
      4. Descendez jusqu'à sentir un étirement dans les ischio-jambiers
      5. Poussez les hanches vers l'avant pour revenir à la position de départ
      6. Contractez les fessiers en haut et répétez pour des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en basculant le buste vers l'avant
      - Expirez en poussant les hanches vers l'avant pour vous redresser

      ### 4. Conseils
      - Gardez les jambes presque tendues tout au long du mouvement
      - Concentrez-vous sur la flexion de hanches, pas sur un squat
      - Gardez le dos plat et la poitrine haute tout au long du mouvement
      - Poussez les hanches vers l'arrière aussi loin que possible
      - La bande offre une résistance croissante à mesure que vous vous redressez

      ### 5. Erreurs fréquentes
      - Arrondir le dos au lieu de maintenir une colonne plate
      - Fléchir trop les genoux, ce qui transforme l'exercice en soulevé de terre roumain
      - Ne pas pousser les hanches assez loin vers l'arrière
      - Descendre trop bas, au-delà du point d'étirement des ischio-jambiers
      - Ne pas maintenir une tension constante sur la bande
      - Regarder vers le haut au lieu de garder la nuque en position neutre

      ### 6. Sécurité et adaptations
      - Commencez avec une bande de résistance plus légère pour maîtriser la flexion de hanches jambes tendues
      - Ajustez la position des pieds sur la bande pour modifier la résistance
      - Progressez à partir des soulevés de terre roumains si cette variante semble trop intense
      - Si vous ressentez une gêne dans le bas du dos, réduisez la résistance et vérifiez votre technique
