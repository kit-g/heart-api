  Bench Dip:
    name: Dips entre bancs
    instructions: |
      ## Aperçu
      Les dips entre bancs sont un exercice au poids du corps qui cible principalement les triceps. Il sollicite aussi les épaules et les pectoraux comme muscles secondaires, ce qui en fait un mouvement de poussée efficace pour le haut du corps, réalisable avec un minimum de matériel.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous au bord d'un banc stable, mains agrippant le bord de part et d'autre des hanches
      - Placez les mains à la largeur des épaules, doigts pointés vers l'avant
      - Tendez les jambes devant vous, talons au sol
      - Faites glisser les fessiers hors du banc en gardant les mains en place
      - Gardez le dos près du banc et les épaules abaissées

      ### 2. Mouvement
      1. Descendez le corps en fléchissant les coudes jusqu'à environ 90 degrés
      2. Gardez les coudes pointés vers l'arrière, sans les laisser s'écarter sur les côtés
      3. Maintenez le buste droit et évitez de voûter les épaules
      4. Marquez une courte pause en bas du mouvement
      5. Poussez dans les paumes pour tendre les bras et revenir à la position de départ
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant le corps
      - Expirez en remontant vers la position de départ

      ### 4. Conseils
      - Gardez les coudes serrés près du corps tout au long du mouvement
      - Utilisez vos triceps pour vous soulever plutôt que de pousser avec les jambes
      - Gardez la sangle abdominale gainée pour rester stable
      - Ne laissez pas les épaules remonter vers les oreilles
      - Travaillez sur une amplitude complète tout en gardant le contrôle

      ### 5. Erreurs fréquentes
      - Laisser les coudes s'écarter excessivement sur les côtés
      - Descendre trop bas et imposer une contrainte excessive aux épaules
      - Pousser avec les jambes au lieu d'isoler les triceps
      - Aller trop vite et utiliser l'élan
      - Voûter les épaules vers l'avant
      - Ne pas descendre assez bas pour bien solliciter les triceps

      ### 6. Sécurité et adaptations
      - Les débutants peuvent fléchir les genoux et rapprocher les pieds du banc pour un meilleur levier
      - Variante avancée : surélevez les pieds sur un autre banc pour augmenter la difficulté
      - Posez un disque sur vos cuisses pour ajouter de la résistance
      - En cas de gêne aux épaules, réduisez l'amplitude
    validated: false
    source_digest: 393c27caa822
  Bench Press - Close Grip (Barbell):
    name: Développé couché prise serrée (barre)
    instructions: |
      ## Aperçu
      Le développé couché prise serrée est un exercice à la barre qui cible principalement les triceps. Il sollicite aussi les pectoraux et l'avant des épaules comme muscles secondaires, ce qui en fait un mouvement polyarticulaire efficace pour développer la force de poussée du haut du corps en accentuant le travail des triceps.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur un banc, pieds fermement ancrés au sol
      - Saisissez la barre avec les mains légèrement plus rapprochées que la largeur des épaules
      - Placez-vous de façon à ce que la barre soit directement au-dessus du haut de la poitrine
      - Décrochez la barre et tenez-la bras complètement tendus
      - Gardez les omoplates serrées et plaquées contre le banc

      ### 2. Mouvement
      1. Descendez lentement la barre vers le bas de la poitrine ou le haut de l'abdomen
      2. Gardez les coudes serrés près du corps, à environ 45 degrés du buste
      3. Descendez la barre jusqu'à ce qu'elle touche légèrement le torse
      4. Marquez une courte pause en bas
      5. Repoussez la barre vers le haut en tendant les bras
      6. Verrouillez les coudes en extension complète en haut et répétez avec des répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant la barre vers la poitrine
      - Expirez en repoussant la barre vers le haut

      ### 4. Conseils
      - Gardez les coudes serrés tout au long du mouvement pour maximiser le travail des triceps
      - Maintenez un dos stable et à plat sur le banc
      - Utilisez une prise confortable, mais plus serrée que votre prise de développé couché habituelle
      - Gardez les poignets droits et alignés avec les avant-bras
      - Contrôlez la descente et évitez de faire rebondir la barre sur la poitrine

      ### 5. Erreurs fréquentes
      - Utiliser une prise trop serrée, ce qui peut solliciter excessivement les poignets
      - Laisser les coudes s'écarter excessivement
      - Faire rebondir la barre sur la poitrine au lieu d'un contact contrôlé suivi de la poussée
      - Cambrer excessivement le dos
      - Utiliser une charge trop lourde au détriment de la technique
      - Ne pas descendre la barre jusqu'à la poitrine

      ### 6. Sécurité et adaptations
      - Faites-vous assurer par un partenaire lorsque vous soulevez lourd
      - Commencez avec une charge légère pour maîtriser la technique coudes serrés
      - En cas de gêne aux poignets, élargissez légèrement la prise
      - Variante avancée : ajoutez des chaînes ou des bandes élastiques pour une résistance variable
