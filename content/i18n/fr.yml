  Deficit Deadlift (Barbell):
    name: Soulevé de terre en déficit (barre)
    instructions: |
      ## Aperçu
      Le soulevé de terre en déficit avec barre est un exercice polyarticulaire avancé qui cible principalement les fessiers, les ischio-jambiers et les érecteurs du rachis avec une amplitude accrue. Il sollicite les quadriceps davantage que le soulevé de terre classique, l'utilisation d'une plateforme surélevée augmentant la difficulté et renforçant la position basse.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous sur une plateforme surélevée de 1 à 3 pouces (2,5 à 7,5 cm), pieds écartés à la largeur des hanches
      - Placez une barre au sol, au-dessus du milieu des pieds
      - Saisissez la barre juste à l'extérieur des jambes, en pronation ou en prise mixte
      - Fléchissez les hanches et pliez davantage les genoux pour atteindre la barre
      - Gardez la poitrine haute, le dos plat et les épaules légèrement en avant de la barre

      ### 2. Mouvement
      1. Poussez dans les talons et étendez simultanément les hanches et les genoux
      2. Gardez la barre près du corps en soulevant depuis cette position plus basse
      3. Redressez-vous complètement en étendant les hanches et les genoux
      4. Gardez les épaules en arrière et la poitrine haute en haut
      5. Redescendez la barre en poussant les hanches vers l'arrière et en pliant les genoux
      6. Reposez la barre au sol de façon contrôlée et recommencez

      ### 3. Respiration
      - Inspirez profondément et gainez votre sangle abdominale avant de soulever
      - Retenez votre respiration pendant la montée
      - Expirez en haut ou pendant la descente de la barre

      ### 4. Conseils
      - Le déficit augmente l'amplitude et la difficulté
      - Gardez la barre près des tibias et des cuisses tout au long du mouvement
      - Concentrez-vous sur une poussée explosive depuis la position basse
      - Utilisez une charge plus légère que pour votre soulevé de terre classique
      - Cette variante développe la force dans la partie la plus difficile du mouvement

      ### 5. Erreurs fréquentes
      - Utiliser une plateforme trop haute pour votre mobilité
      - Arrondir le bas du dos à cause de l'amplitude accrue
      - Commencer avec les hanches trop hautes pour compenser le déficit
      - Utiliser une charge trop lourde au détriment de la technique
      - Ne pas maintenir la trajectoire de la barre près du corps
      - Perdre la colonne neutre en position basse

      ### 6. Sécurité et adaptations
      - Commencez avec un déficit de 1 pouce (2,5 cm) et progressez graduellement
      - Utilisez 10 à 20 % de charge en moins que pour votre soulevé de terre classique
      - Assurez-vous d'avoir la mobilité nécessaire pour l'amplitude accrue
      - En cas de gêne dans le bas du dos, réduisez la hauteur du déficit ou la charge
