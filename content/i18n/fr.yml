  Squat (Band):
    name: Squat (bande)
    instructions: |
      ## Aperçu
      Le squat avec bande est un exercice polyarticulaire à résistance qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite aussi la sangle abdominale, en utilisant la résistance progressive de la bande pour apprendre la bonne mécanique du squat avec une charge plus légère et une tension constante.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des épaules, sur le centre d'une bande élastique
      - Tenez les poignées de la bande à hauteur d'épaules, ou passez la bande par-dessus vos épaules
      - Gardez la poitrine haute, la sangle abdominale engagée et le regard vers l'avant
      - Maintenez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Amorcez le squat en fléchissant les genoux et les hanches simultanément
      2. Gardez la poitrine haute et le poids sur les talons
      3. Descendez jusqu'à ce que les cuisses soient au moins parallèles au sol
      4. Marquez une brève pause en bas
      5. Poussez à travers les talons pour revenir en position debout
      6. Étendez complètement les hanches et les genoux en haut, puis répétez

      ### 3. Respiration
      - Inspirez en descendant en squat
      - Expirez en remontant vers la position debout

      ### 4. Conseils
      - La bande offre une résistance croissante à mesure que vous vous redressez
      - Gardez les genoux alignés avec les orteils
      - Maintenez le buste droit tout au long de l'exercice
      - Poussez avec tout le pied, pas seulement avec les orteils
      - Concentrez-vous sur un mouvement contrôlé dans les deux sens

      ### 5. Erreurs fréquentes
      - Laisser les genoux rentrer vers l'intérieur
      - Ne pas descendre suffisamment
      - Monter sur la pointe des pieds au lieu de garder le poids sur les talons
      - Arrondir le dos pendant la descente
      - Utiliser l'élan au lieu d'un mouvement contrôlé
      - Ne pas maintenir une tension constante sur la bande

      ### 6. Sécurité et adaptations
      - Commencez avec une bande de résistance plus légère pour maîtriser le schéma de mouvement
      - Ajustez la position des pieds sur la bande pour modifier la résistance
      - Utilisez cette variante pour apprendre la mécanique du squat avant de passer à la barre
      - Variante avancée : utilisez une bande de résistance plus forte ou ajoutez une pause en bas
