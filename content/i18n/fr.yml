  Sumo Deadlift High Pull (Barbell):
    name: Tirage haut sumo (barre)
    instructions: |
      ## Aperçu
      Le tirage haut sumo est un exercice composé pour tout le corps qui reprend des éléments de l'haltérophilie. Il cible principalement les jambes, les fessiers, les trapèzes et les épaules, en combinant une position sumo large et un tirage explosif pour développer la puissance et la coordination de tout le corps.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds plus écartés que les épaules, pointes vers l'extérieur
      - Placez une barre au-dessus du milieu des pieds
      - Saisissez la barre mains à l'intérieur des jambes, bras tendus
      - Gardez le dos plat, la poitrine haute et les hanches basses
      - Engagez la sangle abdominale et les grands dorsaux avant de tirer

      ### 2. Mouvement
      1. Poussez explosivement avec les jambes pour soulever la barre
      2. Étendez puissamment hanches et genoux pendant que la barre monte
      3. Une fois en extension complète, tirez la barre vers le haut, coudes hauts
      4. Continuez de tirer jusqu'à ce que la barre atteigne la hauteur de la poitrine
      5. Reposez la barre au sol de façon contrôlée
      6. Replacez-vous et répétez pour le nombre souhaité de répétitions explosives

      ### 3. Respiration
      - Inspirez avant de commencer le mouvement
      - Bloquez votre respiration pendant le tirage
      - Expirez en reposant la barre

      ### 4. Conseils
      - La position large met l'accent sur les jambes et les fessiers
      - Réalisez le mouvement de façon explosive, avec un maximum de puissance
      - Menez le tirage haut avec les coudes
      - Cet exercice combine développement de la force et de la puissance
      - Gardez la barre proche du corps tout au long du mouvement

      ### 5. Erreurs fréquentes
      - Ne pas ouvrir complètement les hanches avant de tirer
      - Tirer avec les bras avant d'avoir terminé la poussée des jambes
      - Utiliser trop de charge et perdre la vitesse explosive
      - Arrondir le dos pendant le tirage
      - Ne pas garder les coudes hauts pendant le tirage
      - Laisser la barre s'éloigner du corps

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser le mouvement explosif
      - Assurez-vous d'une mobilité de hanches suffisante pour la position large
      - Maîtrisez le soulevé de terre sumo avant d'ajouter le tirage haut
      - Excellent exercice pour le CrossFit et l'entraînement fonctionnel
