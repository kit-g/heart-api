    source_digest: 7bf053c9b531
  Triceps Dip (Assisted):
    name: Dips (assistés)
    instructions: |
      ## Aperçu
      Les dips assistés sont un exercice sur machine qui cible principalement les triceps avec un soutien. Ils sollicitent également les pectoraux et l'avant des épaules, le contrepoids d'assistance rendant le mouvement plus accessible tout en développant la force nécessaire aux dips sans assistance.

      ## Exécution
      ### 1. Position de départ
      - Réglez la charge sur la machine à dips assistés (plus de charge = plus d'assistance)
      - Montez sur la plateforme et saisissez les poignées
      - Placez les genoux ou les pieds sur le support d'assistance
      - Commencez bras complètement tendus, corps droit
      - Gainez votre sangle abdominale et gardez les épaules basses

      ### 2. Mouvement
      1. Descendez en fléchissant les coudes jusqu'à environ 90 degrés
      2. Gardez les coudes pointés vers l'arrière et le corps relativement droit
      3. Restez maître du mouvement pendant que le support d'assistance soutient votre poids
      4. Marquez une brève pause en bas du mouvement
      5. Poussez dans les paumes pour tendre les bras et revenir à la position de départ
      6. Répétez le mouvement de façon contrôlée pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Inspirez pendant la descente
      - Expirez en remontant vers la position de départ

      ### 4. Conseils
      - Gardez le corps relativement droit pour maximiser le travail des triceps
      - Réduisez progressivement l'assistance à mesure que vous gagnez en force
      - Concentrez-vous sur un mouvement contrôlé sur toute l'amplitude
      - Gardez les coudes relativement près du corps
      - Évitez de trop vous reposer sur l'assistance

      ### 5. Erreurs fréquentes
      - Utiliser trop d'assistance et ne pas se challenger
      - Se pencher trop en avant, ce qui déplace le travail vers les pectoraux
      - Laisser les coudes s'écarter excessivement
      - Utiliser l'élan au lieu d'un mouvement contrôlé
      - Ne pas travailler sur une amplitude complète
      - Enrouler les épaules vers l'avant

      ### 6. Sécurité et adaptations
      - Commencez avec une assistance élevée et diminuez-la progressivement à mesure que vous devenez plus fort
      - Réduisez l'amplitude du mouvement en cas de gêne aux épaules
      - Progressez vers les dips sans assistance en réduisant régulièrement la charge d'assistance
      - Privilégiez la technique plutôt qu'une réduction trop rapide de l'assistance
    validated: false
    source_digest: cb26283a6d1d
  Triceps Extension:
    name: Extension des triceps
    instructions: |
      ## Aperçu
      L'extension des triceps avec barre est un exercice d'isolation qui cible principalement les trois chefs du triceps. Il sollicite également les épaules et la sangle abdominale comme stabilisateurs, la position au-dessus de la tête maximisant l'étirement et la contraction des triceps tout au long du mouvement.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des épaules, ou asseyez-vous sur un banc avec dossier
      - Tenez une barre en pronation, prise serrée
      - Développez la barre au-dessus de la tête jusqu'à extension complète des bras
      - Gardez les coudes pointés vers l'avant et près de la tête
      - Gainez votre sangle abdominale pour la stabilité

      ### 2. Mouvement
      1. Descendez la barre derrière la tête en fléchissant les coudes
      2. Gardez les bras immobiles et verticaux du début à la fin
      3. Descendez jusqu'à ressentir un étirement profond dans les triceps
      4. Marquez une brève pause en position basse
      5. Tendez les coudes pour ramener la barre à la position de départ
      6. Répétez le mouvement de façon contrôlée pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Inspirez en descendant la barre derrière la tête
      - Expirez en repoussant la barre vers le haut

      ### 4. Conseils
      - Gardez les bras immobiles et verticaux du début à la fin
      - Gardez les coudes aussi serrés que le confort le permet
      - Évitez de cambrer le bas du dos pendant le mouvement
      - Concentrez-vous sur l'étirement en bas et la contraction en haut
      - Contrôlez la charge sur toute l'amplitude du mouvement

      ### 5. Erreurs fréquentes
      - Laisser les coudes s'écarter excessivement
      - Bouger les bras au lieu de les garder immobiles
      - Cambrer excessivement le bas du dos
      - Utiliser une charge trop lourde au détriment de la technique
      - Ne pas travailler sur une amplitude complète
      - Se pencher en avant ou en arrière pendant le mouvement

      ### 6. Sécurité et adaptations
      - Utilisez une barre EZ en cas de gêne aux poignets ou aux coudes
      - Commencez léger pour maîtriser la position au-dessus de la tête
      - Effectuez l'exercice assis avec dossier pour plus de stabilité
      - Variante avancée : effectuez l'exercice debout pour solliciter davantage la sangle abdominale
    validated: false
    source_digest: 8d8afa6593c4
