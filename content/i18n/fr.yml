      3. Gardez le bas du dos en contact avec le ballon pour la stabilité
      4. Contractez les abdominaux en haut du mouvement pendant 1 à 2 secondes
      5. Redescendez lentement de manière contrôlée, en laissant un léger étirement par-dessus le ballon
