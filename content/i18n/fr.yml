    instructions: |
      ## Aperçu
      La randonnée est une activité cardiovasculaire de plein air qui sollicite les jambes, les fessiers et le système cardiovasculaire. Marcher sur des terrains variés, surtout avec du dénivelé, développe l'endurance et la force des jambes, et procure des bienfaits pour la santé mentale grâce au contact avec la nature.

