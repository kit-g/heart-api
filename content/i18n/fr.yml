  Snatch (Barbell):
    name: Arraché (barre)
    instructions: |
      ## Aperçu
      L'arraché est un mouvement complet d'haltérophilie olympique qui sollicite l'ensemble du corps. Il consiste à amener la barre du sol jusqu'au-dessus de la tête, bras verrouillés, en un seul mouvement explosif continu, exigeant puissance maximale, vitesse, mobilité et précision technique.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, la barre au-dessus du milieu des pieds
      - Saisissez la barre avec une prise large d'arraché (mains presque contre les colliers)
      - Effectuez une flexion de hanches et pliez les genoux pour saisir la barre
      - Gardez le dos plat, la poitrine haute et les épaules au-dessus de la barre
      - Les bras restent tendus et relâchés

      ### 2. Mouvement
      1. Poussez explosivement avec les jambes pour décoller la barre du sol
      2. Gardez la barre proche pendant qu'elle remonte le long des jambes
      3. Étendez puissamment hanches et genoux à mi-cuisse
      4. Tirez-vous sous la barre pendant qu'elle monte
      5. Réceptionnez la barre au-dessus de la tête en squat complet, bras verrouillés
      6. Redressez-vous complètement avec la barre au-dessus de la tête pour terminer le mouvement

      ### 3. Respiration
      - Prenez une grande inspiration avant le tirage
      - Bloquez votre respiration pendant le tirage, la réception et le relevé
      - Expirez une fois debout avec la barre au-dessus de la tête

      ### 4. Conseils
      - C'est le mouvement le plus technique de l'haltérophilie
      - La prise large raccourcit la distance de tirage
      - La vitesse et la technique comptent plus que la force
      - Chaque phase doit être parfaite pour réussir le mouvement
      - Exige un encadrement et une pratique approfondis

      ### 5. Erreurs fréquentes
      - Utiliser une largeur de prise incorrecte
      - Tirer avec les bras avant d'avoir terminé la poussée des jambes
      - Pousser la barre à bout de bras au lieu de se tirer dessous
      - Mauvaise position de réception et manque d'équilibre
      - Mobilité insuffisante pour le squat profond bras tendus
      - Tenter le mouvement sans base technique solide

      ### 6. Sécurité et adaptations
      - Exige l'encadrement d'un entraîneur d'haltérophilie qualifié
      - Maîtrisez chaque composante avant de tenter des arrachés complets
      - Utilisez des disques amortisseurs et un plateau d'haltérophilie adapté
      - Ce mouvement demande des années de pratique pour être maîtrisé
