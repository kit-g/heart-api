      1. Poussez la barre verticalement au-dessus de la tête en tendant les bras
      2. Continuez à pousser jusqu'à l'extension complète des bras
      3. Verrouillez les coudes en haut
      4. Marquez une brève pause en haut
      5. Redescendez la barre à hauteur des épaules en contrôlant
      6. Répétez le nombre de répétitions contrôlées souhaité

      ### 3. Respiration
      - Inspirez et gainez-vous avant de pousser
      - Bloquez votre respiration pendant la poussée
      - Expirez en haut ou pendant la descente de la barre

      ### 4. Conseils
      - Gardez le dos fermement appuyé contre le dossier
      - La position assise élimine la poussée des jambes pour un travail strict des épaules
      - Poussez verticalement, pas vers l'avant
      - Recherchez une amplitude complète
      - Cette variante est excellente pour isoler les épaules

      ### 5. Erreurs fréquentes
      - Cambrer le bas du dos en le décollant du dossier pendant la poussée
      - Pousser vers l'avant au lieu de pousser verticalement
      - Ne pas atteindre l'extension complète en haut
      - Utiliser l'élan en décollant les fessiers du siège
      - Écarter excessivement les coudes
      - Ne pas maintenir la tension de la sangle abdominale

      ### 6. Sécurité et adaptations
      - Faites-vous assister d'un pareur pour les charges lourdes
      - Commencez avec une charge plus légère que votre développé debout
      - Ajustez l'inclinaison du dossier si possible pour votre confort
      - En cas de gêne à l'épaule, vérifiez la largeur de votre prise et la trajectoire de la barre
