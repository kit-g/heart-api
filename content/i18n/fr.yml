      - Utilisez votre sangle abdominale pour vous soulever, sans tirer sur la nuque
      - Gardez les pieds à plat au sol tout au long du mouvement
      - Privilégiez le contrôle plutôt que l'élan
      - Ne tirez pas sur la tête ou la nuque si les mains sont derrière la tête
      - Évitez de cambrer excessivement le bas du dos

      ### 5. Erreurs fréquentes
      - Tirer sur la nuque ou la tête, ce qui peut créer des tensions
      - Utiliser l'élan pour se balancer vers le haut au lieu d'une contraction musculaire contrôlée
      - Laisser les pieds décoller du sol
      - Cambrer excessivement le bas du dos pendant le mouvement
      - Aller trop vite au détriment de la technique
      - Ne pas redescendre complètement entre les répétitions

      ### 6. Sécurité et adaptations
      - Les débutants peuvent faire des crunchs jusqu'à développer une force suffisante
      - Posez les mains sur les cuisses et faites-les glisser vers les genoux pour une variante plus facile
      - Variante avancée : tenez un disque sur la poitrine pour ajouter de la résistance
      - En cas de gêne dans le bas du dos, passez aux crunchs ou réduisez l'amplitude
