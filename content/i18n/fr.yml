  Deadlift (Smith Machine):
    name: Soulevé de terre (machine Smith)
    instructions: |
      ## Aperçu
      Le soulevé de terre à la machine Smith est un exercice polyarticulaire guidé qui cible principalement les fessiers, les ischio-jambiers et les érecteurs du rachis. Il sollicite aussi les quadriceps, les grands dorsaux et les trapèzes, la trajectoire verticale fixe de la barre offrant de la stabilité et permettant de se concentrer sur le mouvement de tirage.

      ## Exécution
      ### 1. Position de départ
      - Placez la barre de la machine Smith à mi-hauteur des tibias
      - Tenez-vous dans la machine, pieds écartés à la largeur des hanches, la barre au-dessus du milieu des pieds
      - Saisissez la barre juste à l'extérieur des jambes, en pronation ou en prise mixte
      - Fléchissez les hanches et pliez les genoux pour atteindre la barre
      - Gardez la poitrine haute, le dos plat et les épaules légèrement en avant de la barre

      ### 2. Mouvement
      1. Décrochez la barre en la faisant pivoter, puis poussez dans les talons
      2. Étendez simultanément les hanches et les genoux pour vous redresser
      3. Gardez la barre près du corps pendant la montée
      4. Redressez-vous complètement, épaules en arrière et poitrine haute
      5. Redescendez la barre en poussant les hanches vers l'arrière et en pliant les genoux
      6. Ramenez la barre à la position de départ et recommencez

      ### 3. Respiration
      - Inspirez profondément et gainez votre sangle abdominale avant de soulever
      - Retenez votre respiration pendant la montée
      - Expirez en haut ou pendant la descente de la barre

      ### 4. Conseils
      - La trajectoire fixe de la barre peut aider à maintenir une bonne technique
      - Gardez la barre près des tibias et des cuisses tout au long du mouvement
      - Menez le mouvement avec la poitrine en vous redressant
      - Gardez la colonne neutre tout au long du mouvement
      - Utilisez les butées de sécurité pour plus de sûreté

      ### 5. Erreurs fréquentes
      - Arrondir le bas du dos pendant la montée
      - Commencer avec les hanches trop hautes ou trop basses
      - Ne pas ajuster la position des pieds par rapport à la trajectoire fixe de la barre
      - Ne pas étendre complètement les hanches en haut
      - Regarder vers le haut ou vers le bas au lieu de garder la nuque neutre
      - Se reposer excessivement sur le guidage de la machine

      ### 6. Sécurité et adaptations
      - Réglez la hauteur de départ de la barre à mi-tibias pour une technique optimale
      - Placez les butées de sécurité à la hauteur appropriée
      - Expérimentez la position des pieds pour trouver votre placement optimal par rapport à la barre
      - En cas de gêne dans le bas du dos, réduisez la charge et vérifiez votre technique
