  Wide Pull Up:
    name: Tractions prise large
    instructions: |
      ## Aperçu
      Les tractions prise large sont un exercice de tirage au poids du corps qui cible principalement le grand dorsal, avec un accent sur la largeur du dos. Elles sollicitent également les rhomboïdes, le trapèze moyen et les biceps ; la prise plus large cible la partie externe des grands dorsaux pour donner au dos une apparence plus large.

      ## Exécution
      ### 1. Position de départ
      - Suspendez-vous à une barre de traction en pronation, mains nettement plus écartées que la largeur des épaules
      - Laissez votre corps pendre en extension complète, bras tendus
      - Gainez votre sangle abdominale et gardez les épaules abaissées
      - Croisez les chevilles ou gardez les jambes tendues
      - Évitez tout balancement excessif

      ### 2. Mouvement
      1. Hissez-vous en amenant les coudes vers le bas et sur les côtés
      2. Concentrez-vous sur le tirage avec les grands dorsaux plutôt qu'avec les bras
      3. Continuez à tirer jusqu'à ce que le menton dépasse la barre
      4. Gardez la sangle abdominale gainée tout au long du mouvement
      5. Marquez une brève pause en haut
      6. Redescendez lentement à la position de départ, jusqu'à l'extension complète des bras

      ### 3. Respiration
      - Expirez en vous hissant
      - Inspirez en redescendant

      ### 4. Conseils
      - Gardez les coudes plus écartés, en raison de la largeur de la prise
      - Concentrez-vous sur le fait de tirer les coudes vers le bas, vers vos flancs
      - Menez avec la poitrine et gardez une bonne posture
      - Contrôlez la descente pour maximiser le travail musculaire
      - Pensez à amener vos coudes vers vos flancs plutôt que vos mains vers la barre

      ### 5. Erreurs fréquentes
      - Utiliser une prise trop large, ce qui limite l'amplitude
      - Ne pas atteindre l'amplitude complète en haut ou en bas
      - Utiliser l'élan ou le kipping au lieu d'une exécution stricte
      - Laisser les épaules remonter vers les oreilles
      - Ne pas tendre complètement les bras en bas
      - Tirer uniquement avec les bras au lieu de solliciter les grands dorsaux

      ### 6. Sécurité et adaptations
      - Utilisez une machine de tractions assistées ou une bande élastique en soutien
      - Réalisez des tirages verticaux pour construire une force de base
      - Variante avancée : ajoutez du lest avec une ceinture de lest ou un gilet lesté
      - En cas de gêne aux épaules, resserrez légèrement votre prise
