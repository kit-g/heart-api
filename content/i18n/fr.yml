      - Maintenez une très légère flexion des genoux tout au long du mouvement

      ### 2. Mouvement
      1. Effectuez une flexion de hanches en les poussant vers l'arrière et en abaissant les haltères
      2. Gardez le dos plat et les haltères près de vos jambes
      3. Gardez les jambes presque tendues, avec une flexion minimale des genoux
      4. Descendez jusqu'à sentir un étirement dans les ischio-jambiers, généralement à mi-tibia
      5. Poussez les hanches vers l'avant pour revenir à la position de départ
