  High Knee Skips:
    name: Montées de genoux sautillées
    instructions: |
      ## Aperçu
      Les montées de genoux sautillées sont un exercice cardio pliométrique qui cible principalement les fléchisseurs de hanche, les quadriceps et les mollets. Elles sollicitent aussi la sangle abdominale et améliorent la coordination, les sautillements explosifs développant la puissance du bas du corps et l'endurance cardiovasculaire.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous droit, pieds écartés à la largeur des hanches
      - Gardez la poitrine haute, la sangle abdominale gainée et les bras le long du corps
      - Préparez-vous à avancer avec un sautillement explosif
      - Maintenez une bonne posture tout au long de l'exercice

      ### 2. Mouvement
      1. Sautillez vers l'avant en montant un genou vers la poitrine
      2. Balancez le bras opposé vers l'avant pendant la montée du genou
      3. Atterrissez sur l'avant du pied et enchaînez immédiatement avec l'autre jambe
      4. Continuez à alterner les jambes avec un sautillement explosif et exagéré
      5. Montez les genoux aussi haut que possible à chaque sautillement
      6. Maintenez le rythme et continuez pour le nombre de répétitions ou la durée souhaités

      ### 4. Conseils
      - Concentrez-vous sur la puissance explosive à chaque sautillement
      - Montez les genoux aussi haut que possible
      - Utilisez vos bras pour générer de l'élan
      - Atterrissez en douceur sur l'avant des pieds
      - Maintenez une posture droite tout au long de l'exercice

      ### 5. Erreurs fréquentes
      - Ne pas monter les genoux assez haut
      - Atterrir à plat au lieu de l'avant des pieds
      - Se pencher trop en avant ou en arrière
      - Ne pas utiliser les bras pour aider l'élan
      - Aller trop lentement, sans puissance explosive
      - Retenir sa respiration pendant l'exercice

      ### 6. Sécurité et adaptations
      - Commencez par des montées de genoux classiques sur place avant d'ajouter le sautillement
      - Réduisez la hauteur et la vitesse en cas de gêne aux genoux ou aux hanches
      - Pratiquez sur une surface plus souple pour réduire l'impact
      - Variante avancée : ajoutez un gilet lesté ou augmentez la vitesse et la hauteur
