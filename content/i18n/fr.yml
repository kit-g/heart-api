  Squat (Barbell):
    name: Squat (barre)
    instructions: |
      ## Aperçu
      Le squat avec barre est un exercice polyarticulaire du bas du corps qui cible principalement les quadriceps, les fessiers et les ischio-jambiers. Il sollicite aussi la sangle abdominale, le bas du dos et le haut du dos, ce qui en fait l'un des exercices de force les plus efficaces pour développer la puissance globale du bas du corps.

      ## Exécution
      ### 1. Position de départ
      - Placez une barre dans un rack à hauteur du haut de la poitrine
      - Passez sous la barre et positionnez-la sur le haut du dos (position haute) ou plus bas sur l'arrière des deltoïdes (position basse)
      - Saisissez la barre avec les mains un peu plus écartées que la largeur des épaules
      - Sortez la barre des supports et reculez, pieds écartés à la largeur des épaules
      - Gardez la poitrine haute, la sangle abdominale engagée et le regard vers l'avant

      ### 2. Mouvement
      1. Amorcez le squat en fléchissant les genoux et les hanches simultanément
      2. Gardez la poitrine haute et le poids sur les talons
      3. Descendez jusqu'à ce que les cuisses soient au moins parallèles au sol
      4. Maintenez une colonne neutre tout au long du mouvement
      5. Poussez à travers les talons pour revenir en position debout
      6. Étendez complètement les hanches et les genoux en haut, puis répétez

      ### 3. Respiration
      - Prenez une grande inspiration et gainez votre sangle abdominale avant de descendre
      - Retenez votre respiration pendant la descente et en position basse
      - Expirez en remontant ou une fois en haut

      ### 4. Conseils
      - Gardez les genoux alignés avec les orteils
      - Maintenez le buste droit tout au long de l'exercice
      - Poussez avec tout le pied, pas seulement avec les orteils
      - Gardez une trajectoire de barre verticale au-dessus du milieu du pied
      - Concentrez-vous sur une descente contrôlée et une remontée explosive

      ### 5. Erreurs fréquentes
      - Laisser les genoux rentrer vers l'intérieur
      - Ne pas descendre suffisamment (au moins jusqu'à la parallèle)
      - Monter sur la pointe des pieds au lieu de garder le poids sur les talons
      - Arrondir le dos ou perdre la colonne neutre
      - Laisser la barre dériver vers l'avant pendant la descente
      - Charger trop lourd avant d'avoir maîtrisé la technique

      ### 6. Sécurité et adaptations
      - Utilisez toujours des barres de sécurité ou un pareur pour les charges lourdes
      - Commencez avec une charge légère pour maîtriser la technique
      - Ajustez la position de la barre (haute ou basse) selon votre confort et vos objectifs
      - Variante avancée : ajoutez des chaînes ou des bandes, ou effectuez des squats avec pause
