  Flutter Kick:
    name: Battements de jambes
    instructions: |
      ## Aperçu
      Les battements de jambes sont un exercice dynamique au poids du corps pour la sangle abdominale qui cible principalement la partie inférieure du grand droit de l'abdomen et les fléchisseurs de hanche. Il sollicite aussi le transverse de l'abdomen et les obliques comme stabilisateurs, et développe l'endurance du bas des abdominaux grâce à des mouvements de jambes alternés et continus.

      ## Exécution
      ### 1. Position de départ
      - Allongez-vous à plat sur le dos sur un tapis, jambes complètement tendues
      - Placez les mains à côté des hanches ou sous les fessiers en soutien
      - Plaquez le bas du dos contre le tapis et gainez votre sangle abdominale
      - Décollez légèrement les jambes du sol, à environ 6 à 12 pouces (15 à 30 cm)
      - Gardez la tête et les épaules détendues sur le tapis

      ### 2. Mouvement
      1. Montez et descendez chaque jambe en alternance, en petits battements rapides
      2. Gardez les jambes tendues et les pointes de pieds étirées tout au long du mouvement
      3. Maintenez un rythme régulier et contrôlé sans toucher le sol
      4. Gardez le bas du dos fermement plaqué contre le tapis
      5. Poursuivez les battements alternés pendant le nombre de répétitions ou la durée souhaités
      6. Privilégiez de petits mouvements rapides plutôt que de grands balancements de jambes

      ### 3. Respiration
      - Respirez de façon régulière et naturelle tout au long du mouvement
      - Ne retenez pas votre respiration ; gardez un rythme respiratoire constant

      ### 4. Conseils
      - Gardez les jambes relativement basses pour accentuer le travail du bas des abdominaux
      - Plaquez le bas du dos contre le tapis pour protéger votre colonne
      - Le mouvement part des hanches, pas des genoux
      - Gardez la sangle abdominale contractée pendant toute la série
      - Concentrez-vous sur des mouvements rapides et contrôlés plutôt que sur de grands battements

      ### 5. Erreurs fréquentes
      - Laisser le bas du dos se cambrer et décoller du tapis
      - Faire des mouvements de jambes trop amples, ce qui réduit le travail de la sangle abdominale
      - Laisser les jambes descendre trop bas ou toucher le sol entre les battements
      - Crisper inutilement le cou et le haut du corps
      - Bouger trop lentement ou de façon irrégulière
      - Retenir sa respiration pendant l'exercice

      ### 6. Sécurité et adaptations
      - Les débutants peuvent lever les jambes plus haut pour réduire l'intensité
      - Placez les mains sous les fessiers pour mieux soutenir le bas du dos
      - Variante avancée : réalisez l'exercice tête et épaules décollées, en position de crunch
      - En cas de gêne dans le bas du dos, levez les jambes plus haut ou réduisez la durée
