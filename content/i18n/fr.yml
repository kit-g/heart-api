  Reverse Curl (Band):
    name: Curl inversé (bande)
    instructions: |
      ## Aperçu
      Le curl inversé avec bande est un exercice d'isolation qui cible principalement le brachio-radial et le brachial antérieur. Il sollicite également le biceps brachial et les extenseurs de l'avant-bras, la prise en pronation mettant l'accent sur le développement des avant-bras avec une résistance progressive.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous debout, pieds écartés à la largeur des hanches, sur le centre d'une bande élastique
      - Saisissez chaque extrémité de la bande en pronation (paumes vers le bas)
      - Laissez les bras pendre le long du corps, avec une légère tension sur la bande
      - Gardez les coudes près du corps du début à la fin
      - Maintenez une posture droite, sangle abdominale gainée

      ### 2. Mouvement
      1. Montez la bande en fléchissant les coudes, paumes toujours vers le bas
      2. Gardez les bras immobiles et collés au corps
      3. Continuez à monter jusqu'à ce que vos avant-bras soient presque à la verticale
      4. Marquez une pause et contractez en haut du mouvement
      5. Redescendez lentement les mains jusqu'à la position de départ, en contrôlant le geste
      6. Répétez le mouvement de façon contrôlée pour le nombre de répétitions souhaité

      ### 3. Respiration
      - Expirez en montant la bande
      - Inspirez en redescendant les mains

      ### 4. Conseils
      - Maintenez la prise en pronation pendant tout le mouvement
      - Gardez les coudes immobiles et près du corps
      - Évitez tout balancement ou recours à l'élan pour monter la bande
      - Concentrez-vous sur la contraction des avant-bras en haut
      - Contrôlez la résistance à la montée comme à la descente

      ### 5. Erreurs fréquentes
      - Laisser les poignets se fléchir vers le haut au lieu de rester alignés
      - Laisser les coudes avancer pendant le curl
      - Utiliser l'élan ou un balancement du corps pour monter la bande
      - Ne pas maintenir une tension constante sur la bande
      - Serrer trop fort et créer des tensions inutiles
      - Enchaîner les répétitions trop rapidement

      ### 6. Sécurité et adaptations
      - Commencez avec une bande plus légère pour maîtriser la prise en pronation
      - Gardez les poignets en position neutre pour éviter les tensions
      - Variante avancée : utilisez une bande plus résistante ou marquez une pause en haut
      - Ajustez la position de vos pieds sur la bande pour moduler la résistance
