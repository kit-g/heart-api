  Swimming:
    name: Natation
    instructions: |
      ## Aperçu
      La natation est un exercice cardiovasculaire complet et sans impact qui sollicite tous les grands groupes musculaires. Elle offre un excellent conditionnement aérobie tout en développant force et endurance sans aucun impact sur les articulations, ce qui la rend idéale pour tous les niveaux de forme physique.

      ## Exécution
      ### 1. Sécurité
      - Ne nagez jamais seul
      - Apprenez la bonne technique avec des moniteurs qualifiés
      - Commencez par des nages plus faciles et des distances plus courtes
      - Utilisez des dispositifs de flottaison si nécessaire pendant l'apprentissage
    validated: false
