  Standing Calf Raise (Barbell):
    name: Élévation des mollets debout (barre)
    instructions: |
      ## Aperçu
      L'élévation des mollets debout avec barre est un exercice d'isolation qui cible principalement le gastrocnémien, muscle du mollet. Il sollicite également le soléaire, en utilisant une barre placée sur le haut du dos pour fournir une résistance lourde et développer la force et le volume des mollets.

      ## Exécution
      ### 1. Position de départ
      - Placez une barre sur le haut du dos, comme pour un squat
      - Placez l'avant de vos pieds sur une surface surélevée ou une plateforme
      - Laissez vos talons dépasser dans le vide
      - Tenez-vous droit, pieds écartés à la largeur des hanches
      - Gardez les jambes tendues mais sans verrouiller les genoux

      ### 2. Mouvement
      1. Abaissez vos talons en fléchissant les chevilles aussi loin que possible
      2. Laissez vos mollets s'étirer complètement en bas
      3. Marquez une brève pause dans la position étirée
      4. Poussez sur l'avant de vos pieds pour élever vos talons aussi haut que possible
      5. Contractez fortement vos mollets en haut
      6. Répétez pour le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Inspirez en abaissant vos talons
      - Expirez en montant sur la pointe des pieds

      ### 4. Conseils
      - Gardez les jambes tendues tout au long du mouvement pour isoler les mollets
      - Réalisez une amplitude complète, de l'étirement profond à la contraction maximale
      - Concentrez-vous sur la contraction des mollets en haut
      - Contrôlez la charge dans les deux phases du mouvement
      - Gardez la sangle abdominale gainée pour la stabilité

      ### 5. Erreurs fréquentes
      - Fléchir les genoux pendant le mouvement
      - Ne pas réaliser une amplitude complète en haut ou en bas
      - Rebondir en bas au lieu d'un étirement contrôlé
      - Utiliser une charge trop lourde au détriment de la technique
      - Effectuer les répétitions trop rapidement
      - Ne pas contracter les mollets en haut du mouvement

      ### 6. Sécurité et adaptations
      - Commencez avec une charge modérée pour maîtriser l'amplitude complète
      - Utilisez un rack avec barres de sécurité pour plus de sûreté
      - Variez la position des pieds (neutre, pointes vers l'intérieur, pointes vers l'extérieur) pour un développement complet des mollets
      - Variante avancée : effectuez des élévations des mollets avec barre sur une jambe
