  Seated Calf Raise (Machine):
    name: Élévation des mollets assis (machine)
    instructions: |
      ## Aperçu
      L'élévation des mollets assis est un exercice d'isolation qui cible principalement le soléaire, muscle du mollet. Elle sollicite aussi les gastrocnémiens, en utilisant une position assise avec genoux fléchis pour mettre l'accent sur le soléaire et développer les mollets de façon complète.

      ## Exécution
      ### 1. Position de départ
      - Asseyez-vous sur la machine à élévation des mollets assis, le boudin posé sur le bas des cuisses
      - Placez la plante des pieds sur la plateforme, talons dans le vide
      - Réglez la hauteur du boudin pour qu'il repose confortablement sur les cuisses
      - Déverrouillez le levier de sécurité
      - Gardez les genoux fléchis à 90 degrés tout au long de l'exercice

      ### 2. Mouvement
      1. Descendez les talons en fléchissant les chevilles aussi loin que possible
      2. Laissez les mollets s'étirer complètement en bas
      3. Marquez une brève pause en position d'étirement
      4. Poussez sur la plante des pieds pour monter les talons aussi haut que possible
      5. Contractez fortement les mollets en haut
      6. Répétez le nombre souhaité de répétitions contrôlées

      ### 3. Respiration
      - Inspirez en descendant les talons
      - Expirez en montant sur la pointe des pieds

      ### 4. Conseils
      - Gardez les genoux immobiles et fléchis tout au long de l'exercice
      - La position assise met l'accent sur le soléaire
      - Recherchez l'amplitude complète, de l'étirement profond à la contraction haute
      - Concentrez-vous sur la contraction des mollets en haut
      - Contrôlez la charge dans les deux phases

      ### 5. Erreurs fréquentes
      - Ne pas atteindre l'amplitude complète en haut ou en bas
      - Rebondir en bas au lieu d'un étirement contrôlé
      - Utiliser une charge trop lourde au détriment de la technique
      - Enchaîner les répétitions trop rapidement
      - Ne pas contracter en haut du mouvement
      - Étendre ou bouger les genoux pendant le mouvement

      ### 6. Sécurité et adaptations
      - Réglez la hauteur du boudin pour le confort et un bon positionnement
      - Variez la position des pieds (neutre, orteils vers l'intérieur, orteils vers l'extérieur) pour un développement complet des mollets
      - Combinez avec des élévations des mollets debout pour un entraînement complet des mollets
      - Variante avancée : maintenez la contraction maximale pendant 2 à 3 secondes
