    source_digest: 81ed0973540a
  Thruster (Barbell):
    name: Thruster (barre)
    instructions: |
      ## Aperçu
      Le thruster à la barre est un exercice composé pour tout le corps qui combine un squat avant et un développé au-dessus de la tête. Il cible principalement les jambes, les épaules et la sangle abdominale, en un seul mouvement explosif continu qui développe puissance, endurance et force globale.

      ## Exécution
      ### 1. Position de départ
      - Tenez une barre en position front rack, à hauteur d'épaules
      - Placez les pieds à la largeur des épaules
      - Gardez les coudes hauts et la poitrine haute
      - Gainez votre sangle abdominale en permanence

      ### 2. Mouvement
      1. Descendez en squat avant jusqu'à ce que les cuisses soient parallèles au sol ou plus bas
      2. Remontez explosivement du squat
      3. Profitez de l'élan pour développer la barre au-dessus de la tête en vous redressant
      4. Verrouillez la barre au-dessus de la tête, bras complètement tendus
      5. Redescendez la barre en position front rack
      6. Enchaînez immédiatement le squat suivant et répétez

      ### 3. Respiration
      - Inspirez en descendant en squat
      - Expirez explosivement pendant la remontée et le développé

      ### 4. Conseils
      - Utilisez la poussée des jambes pour aider à développer la barre
      - Gardez un mouvement fluide et continu
      - Maintenez le buste droit pendant le squat
      - C'est l'un des exercices les plus exigeants pour tout le corps
      - Commencez léger pour maîtriser la coordination

      ### 5. Erreurs fréquentes
      - Ne pas utiliser la poussée des jambes pour aider le développé
      - Marquer une pause entre le squat et le développé
      - Laisser la poitrine s'affaisser pendant le squat
      - Ne pas atteindre l'extension complète au-dessus de la tête
      - Mauvaise position front rack, coudes bas
      - Utiliser trop de charge avant de maîtriser la technique

      ### 6. Sécurité et adaptations
      - Maîtrisez d'abord séparément le squat avant et le développé militaire
      - Commencez avec une barre vide ou des haltères légers
      - Cet exercice est populaire en CrossFit et en conditionnement métabolique
      - Réduisez la charge pour les séries longues d'endurance
    validated: false
    source_digest: 2919114fce9d
