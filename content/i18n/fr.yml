  Cable Pull Through:
    name: Pull through à la poulie
    instructions: |
      ## Aperçu
      Le pull through à la poulie est un exercice de flexion de hanches qui cible principalement les fessiers et les ischio-jambiers. Il sollicite aussi le bas du dos et la sangle abdominale, la poulie fournissant une tension constante tout au long du mouvement tout en enseignant une bonne mécanique de flexion de hanches.

      ## Exécution
      ### 1. Position de départ
      - Fixez une poignée corde à une poulie basse
      - Tenez-vous dos à la poulie, pieds écartés à la largeur des épaules
      - Passez les mains entre vos jambes et saisissez la corde à deux mains
      - Avancez d'un pas pour mettre le câble en tension
      - Gardez la poitrine haute et la sangle abdominale gainée

      ### 2. Mouvement
      1. Effectuez une flexion de hanches en poussant celles-ci vers l'arrière
      2. Laissez le câble tirer vos bras entre vos jambes
      3. Gardez le dos plat et les genoux légèrement fléchis
      4. Continuez jusqu'à sentir un étirement dans les ischio-jambiers
      5. Poussez les hanches vers l'avant de façon explosive pour revenir debout
      6. Contractez fortement les fessiers en haut, puis recommencez

      ### 3. Respiration
      - Inspirez pendant la flexion vers l'avant
      - Expirez en poussant les hanches vers l'avant

      ### 4. Conseils
      - Concentrez-vous sur la flexion de hanches, pas sur un squat
      - Poussez dans les talons pour vous redresser
      - Contractez fortement les fessiers en haut de chaque répétition
      - Maintenez une tension constante sur le câble
      - Conservez une colonne neutre et un dos plat

      ### 5. Erreurs fréquentes
      - Faire un squat au lieu d'une flexion de hanches
      - Arrondir le dos pendant le mouvement
      - Ne pas pousser les hanches assez loin vers l'arrière
      - Utiliser une charge trop lourde au détriment de la technique
      - Ne pas étendre complètement les hanches en haut
      - Laisser les genoux rentrer vers l'intérieur

      ### 6. Sécurité et adaptations
      - Commencez avec une charge légère pour maîtriser le schéma de flexion de hanches
      - Gardez une légère flexion des genoux tout au long du mouvement
      - Utilisez cet exercice pour apprendre une bonne mécanique de soulevé de terre
      - Variante avancée : réalisez des pull through à la poulie sur une jambe
