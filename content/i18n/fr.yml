    instructions: |
      ## Aperçu
      La planche est un exercice de gainage isométrique qui cible principalement le transverse et le grand droit de l'abdomen. Elle sollicite également les épaules, les fessiers et les stabilisateurs du bas du dos pendant toute la durée du maintien, ce qui en fait l'un des exercices les plus efficaces pour développer la stabilité et l'endurance globales de la sangle abdominale.

