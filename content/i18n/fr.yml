  Strict Military Press (Barbell):
    name: Développé militaire strict (barre)
    instructions: |
      ## Aperçu
      Le développé militaire strict est un exercice composé du haut du corps qui cible principalement les trois faisceaux des deltoïdes. Il sollicite aussi les triceps, le haut des pectoraux et la sangle abdominale ; la position debout stricte, sans aucune poussée des jambes, construit une force de poussée pure des épaules.

      ## Exécution
      ### 1. Position de départ
      - Tenez-vous au garde-à-vous, pieds joints ou très rapprochés, la barre au haut de la poitrine
      - Saisissez la barre un peu plus large que la largeur des épaules, paumes vers l'avant
      - Sortez la barre des supports et tenez-la à hauteur des épaules
      - Gardez le corps rigide : poitrine haute, sangle abdominale gainée et fessiers contractés
      - Conservez une posture militaire tout au long de l'exercice

      ### 2. Mouvement
      1. Poussez la barre verticalement au-dessus de la tête en tendant les bras
      2. Gardez le corps parfaitement rigide, sans poussée des jambes ni élan
      3. Continuez à pousser jusqu'à l'extension complète des bras au-dessus de la tête
      4. Verrouillez les coudes en haut, la barre à l'aplomb du milieu du pied
      5. Redescendez la barre à hauteur des épaules en contrôlant
      6. Répétez le nombre de répétitions contrôlées souhaité

      ### 3. Respiration
      - Inspirez et gainez votre sangle abdominale avant de pousser
      - Bloquez votre respiration pendant la poussée
      - Expirez en haut ou pendant la descente de la barre

      ### 4. Conseils
      - Conservez une posture militaire stricte, sans la moindre poussée des jambes
      - Gardez tout le corps rigide, des pieds aux épaules
      - Poussez la barre sur une trajectoire verticale rectiligne
      - La forme stricte construit une force pure des épaules
      - Cette variante demande une charge plus légère que le développé militaire classique

      ### 5. Erreurs fréquentes
      - Utiliser la moindre poussée des jambes ou de l'élan
      - Cambrer excessivement le bas du dos pendant la poussée
      - Pousser la barre vers l'avant au lieu de la verticale
      - Ne pas maintenir une position du corps rigide
      - Écarter les pieds au-delà de la position de garde-à-vous
      - Utiliser une charge trop lourde avant de maîtriser la forme stricte

      ### 6. Sécurité et adaptations
      - Commencez avec une charge nettement plus légère que votre développé militaire classique
      - Maîtrisez le développé militaire classique avant de tenter le développé militaire strict
      - Utilisez un rack avec barres de sécurité si vous vous entraînez seul
      - Cette variante avancée met l'accent sur la rigueur et le contrôle
