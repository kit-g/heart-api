  Lying Leg Curl (Machine):
    name: Curl femoral tumbado (máquina)
    instructions: |
      ## Resumen
      El curl femoral tumbado es un ejercicio de aislamiento que trabaja principalmente los isquiotibiales. También activa las pantorrillas, usando una máquina guiada para aislar y fortalecer los músculos de la parte posterior del muslo mediante la flexión de rodilla.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca abajo en la máquina de curl femoral
      - Coloca el rodillo contra la parte posterior de tus piernas, justo por encima de los tobillos
      - Alinea las rodillas con el punto de giro de la máquina
      - Sujeta las asas para mayor estabilidad
      - Mantén las caderas presionadas contra el banco

      ### 2. Movimiento
      1. Flexiona las rodillas para subir las piernas
      2. Continúa hasta que el rodillo casi toque tus glúteos
      3. Haz una pausa y aprieta los isquiotibiales en la flexión completa
      4. Baja lentamente el peso a la posición inicial con control
      5. Detente justo antes de que la placa de peso toque para mantener la tensión
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir las piernas
      - Inhala al bajar el peso

      ### 4. Consejos
      - Mantén las caderas firmemente presionadas contra el banco
      - Concéntrate en apretar los isquiotibiales en la flexión completa
      - Controla tanto la fase de flexión como la de bajada
      - Mantén tensión constante sin dejar que la placa de peso descanse
      - Evita usar impulso o balancear las piernas

      ### 5. Errores comunes
      - Levantar las caderas del banco durante el curl
      - Usar impulso o balancear el peso hacia arriba
      - No lograr el rango completo de movimiento
      - Dejar que la placa de peso descanse entre repeticiones
      - Hacer las repeticiones demasiado rápido
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Ajusta la posición del rodillo para asegurar una alineación correcta de la rodilla
      - Empieza con poco peso para establecer una técnica correcta
      - Apunta los dedos de los pies al frente, hacia dentro o hacia fuera para enfatizar distintas zonas de los isquiotibiales
      - Variante avanzada: trabaja una pierna a la vez o añade una pausa en la flexión completa
