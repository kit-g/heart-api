  Chest Dip:
    name: Fondos para pecho
    instructions: |
      ## Resumen
      Los fondos para pecho son un ejercicio de empuje con peso corporal que trabaja principalmente la parte inferior del pectoral mayor. También involucran los tríceps y los deltoides frontales, y utilizan una inclinación del torso hacia delante para desplazar el énfasis de los tríceps al pecho y desarrollar eficazmente la parte baja del pecho.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate en las barras paralelas con los brazos completamente extendidos
      - Sujeta las barras con firmeza, con las manos algo más separadas que el ancho de los hombros si es posible
      - Inclina el torso hacia delante unos 30-45 grados
      - Cruza los tobillos por detrás o mantén las piernas rectas
      - Activa el core y mantén los hombros hacia abajo

      ### 2. Movimiento
      1. Baja el cuerpo doblando los codos hasta llegar a unos 90 grados
      2. Mantén los codos ligeramente abiertos y el torso inclinado hacia delante
      3. Continúa bajando hasta sentir un estiramiento en el pecho
      4. Haz una breve pausa en la parte baja del movimiento
      5. Empuja con las palmas para extender los brazos y volver a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar el cuerpo
      - Exhala al empujar de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén la inclinación hacia delante para conservar el énfasis en el pecho
      - Mantén los codos más abiertos que en los fondos para tríceps
      - Concéntrate en el estiramiento del pecho en la parte baja
      - Evita bajar demasiado y forzar los hombros
      - Mantén el control durante todo el rango de movimiento

      ### 5. Errores comunes
      - Mantenerse demasiado erguido, lo que desplaza el énfasis a los tríceps
      - No inclinarse lo suficiente hacia delante
      - Bajar demasiado y forzar los hombros
      - Usar impulso o rebotar abajo
      - No extender por completo los codos arriba
      - Dejar que los hombros se encojan hacia arriba

      ### 6. Seguridad y modificaciones
      - Usa una máquina de fondos asistidos o una banda como apoyo
      - Reduce el rango de movimiento si sientes molestias en los hombros
      - Variante avanzada: añade peso con un cinturón de lastre o un chaleco lastrado
      - Progresa de forma gradual para evitar sobrecargar los hombros
