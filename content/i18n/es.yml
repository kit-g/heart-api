      - Da un pequeño paso atrás para crear tensión en el cable
      - Mantén los codos pegados a los costados y una postura erguida

      ### 2. Movimiento
      1. Sube la barra flexionando los codos y contrayendo los bíceps
      2. Mantén los brazos quietos y pegados al torso
      3. Continúa subiendo hasta que la barra llegue a la altura de los hombros
      4. Haz una pausa y aprieta los bíceps en la parte alta del movimiento
      5. Baja la barra lentamente a la posición inicial con control
      6. Detente justo antes de que la placa de pesas se apoye para mantener la tensión constante, y repite

      ### 3. Respiración
      - Exhala al subir la barra
      - Inhala al bajar la barra

      ### 4. Consejos
      - Mantén los codos fijos a los costados durante todo el movimiento
      - Evita inclinarte hacia atrás o usar impulso para levantar el peso
      - Mantén la tensión constante sin dejar que la placa de pesas descanse entre repeticiones
      - Concéntrate en apretar los bíceps en la parte alta de cada repetición
      - Controla tanto la fase de subida como la de bajada

      ### 5. Errores comunes
      - Balancear el cuerpo o usar impulso para levantar el peso
