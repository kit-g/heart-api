  Triceps Pushdown (Cable - Straight Bar):
    name: Empuje de tríceps hacia abajo (polea, barra recta)
    instructions: |
      ## Resumen
      El empuje de tríceps hacia abajo en polea es un ejercicio de aislamiento que trabaja principalmente las tres cabezas del tríceps con tensión constante. También involucra mínimamente los hombros como estabilizadores, y utiliza una polea alta con barra recta para ofrecer una resistencia uniforme durante todo el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de frente a una polea alta con una barra recta acoplada
      - Sujeta la barra con agarre prono, con las manos separadas al ancho de los hombros
      - Coloca los codos pegados a los costados con los antebrazos paralelos al suelo
      - Mantén los pies separados al ancho de las caderas con una postura ligeramente adelantada
      - Activa el core y mantén una postura erguida

      ### 2. Movimiento
      1. Empuja la barra hacia abajo extendiendo los codos por completo
      2. Mantén la parte superior de los brazos inmóvil y pegada a los costados
      3. Continúa empujando hasta que los brazos queden completamente extendidos a la altura de los muslos
      4. Haz una pausa y contrae los tríceps en la extensión completa
      5. Deja que la barra suba lentamente de vuelta a la posición inicial con control
      6. Detente antes de que la placa toque la torre de pesas para mantener la tensión constante y repite

      ### 3. Respiración
      - Exhala al empujar la barra hacia abajo
      - Inhala al dejar que la barra vuelva a la posición inicial

      ### 4. Consejos
      - Mantén los codos completamente inmóviles y pegados a los costados
      - Concéntrate en aislar los tríceps moviendo únicamente la articulación del codo
      - Mantén la tensión constante sin dejar que la torre de pesas descanse
      - Evita inclinarte hacia adelante o usar el impulso del cuerpo
      - Contrae los tríceps con fuerza al final de cada repetición

      ### 5. Errores comunes
      - Dejar que los codos se desplacen hacia adelante o se abran
      - Inclinarse hacia adelante y usar el peso corporal para empujar la barra
      - No lograr la extensión completa de los codos abajo
      - Dejar que la torre de pesas descanse entre repeticiones
      - Usar impulso en lugar de un movimiento controlado
      - Hacer las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el aislamiento estricto de los codos
      - Prueba distintos accesorios (cuerda, barra en V, empuñadura individual) para variar
      - Variación avanzada: trabaja un brazo a la vez para un enfoque unilateral
      - Añade una pausa de 2-3 segundos en la extensión completa para mayor intensidad
