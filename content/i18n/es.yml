      El encogimiento de hombros en máquina Smith es un ejercicio de aislamiento que trabaja principalmente el trapecio superior. También involucra el elevador de la escápula y los romboides, y utiliza un recorrido vertical fijo de la barra que aporta estabilidad y permite cargar mucho peso con un movimiento controlado.

