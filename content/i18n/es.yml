  Concentration Curl (Dumbbell):
    name: Curl concentrado (mancuerna)
    instructions: |
      ## Resumen
      El curl concentrado es un ejercicio de aislamiento que trabaja principalmente el bíceps braquial con máxima concentración en el músculo. También involucra el braquial y el braquiorradial, y la posición sentada con apoyo elimina el impulso para un aislamiento estricto del bíceps.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en un banco con las piernas bien abiertas
      - Sostén una mancuerna en una mano con el brazo colgando recto hacia abajo
      - Apoya la parte posterior del brazo contra la cara interna del muslo
      - Inclínate ligeramente hacia delante y apoya la mano libre en el muslo contrario
      - Mantén el pecho erguido y el core activado

      ### 2. Movimiento
      1. Sube la mancuerna contrayendo el bíceps
      2. Mantén el brazo firmemente presionado contra la cara interna del muslo en todo momento
      3. Continúa subiendo hasta que la mancuerna llegue a la altura del hombro
      4. Haz una pausa y aprieta fuerte el bíceps arriba
      5. Baja la mancuerna lentamente a la posición inicial con control
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Exhala al subir la mancuerna
      - Inhala al bajar la mancuerna

      ### 4. Consejos
      - Mantén el brazo completamente quieto contra el muslo
      - Concéntrate en una contracción pura del bíceps sin ningún movimiento del cuerpo
      - Aprieta fuerte el bíceps en la parte alta de cada repetición
      - Evita que la mancuerna se balancee o usar impulso
      - Controla el peso durante todo el rango de movimiento

      ### 5. Errores comunes
      - Levantar el codo del muslo durante el curl
      - Usar impulso o balancear el peso
      - No completar el rango de movimiento arriba o abajo
      - Inclinarse hacia atrás o balancear el torso
      - Usar demasiado peso y comprometer la técnica estricta
      - Apresurar las repeticiones en lugar de concentrarse en la contracción muscular

      ### 6. Seguridad y modificaciones
      - Empieza con un peso moderado para asegurar una técnica estricta
      - Mantén la espalda recta para evitar sobrecargar la zona lumbar
      - Variante avanzada: añade una pausa de 3-5 segundos en la contracción máxima
      - Realízalo con el brazo apoyado en un banco inclinado para un ángulo diferente
