  Floor Press (Barbell):
    name: Press en el suelo (barra)
    instructions: |
      ## Resumen
      El press en el suelo con barra es un ejercicio de empuje de rango parcial que trabaja principalmente el pectoral mayor y los tríceps. También involucra los deltoides frontales, y utiliza el suelo para limitar el rango de movimiento y reducir la tensión en los hombros, a la vez que permite empujar cargas pesadas.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en el suelo con las rodillas flexionadas y los pies apoyados
      - Colócate bajo una barra apoyada en el rack o pide a asistentes que te la entreguen
      - Agarra la barra con las manos un poco más abiertas que el ancho de los hombros
      - Sostén la barra con los brazos completamente extendidos sobre el pecho
      - Mantén las escápulas retraídas contra el suelo

      ### 2. Movimiento
      1. Baja la barra lentamente hasta que los codos toquen el suelo
      2. Mantén los codos a unos 45 grados respecto al cuerpo
      3. Haz una breve pausa cuando los tríceps contacten con el suelo
      4. Empuja la barra hacia arriba extendiendo los brazos
      5. Llega a la extensión completa de los codos arriba
      6. Repite con repeticiones controladas sin rebotar los codos contra el suelo

      ### 3. Respiración
      - Inhala mientras bajas la barra
      - Exhala mientras empujas la barra hacia arriba

      ### 4. Consejos
      - El suelo limita tu rango de movimiento y reduce el estrés en los hombros
      - Haz una breve pausa cuando los codos toquen el suelo; no rebotes
      - Concéntrate en empujar de forma explosiva desde la posición baja
      - Mantén las escápulas retraídas durante todo el ejercicio
      - Esta variante permite cargas más pesadas que el press de rango completo

      ### 5. Errores comunes
      - Rebotar los codos contra el suelo para generar impulso
      - Dejar que los codos se abran en exceso
      - No hacer pausa cuando los codos tocan el suelo
      - Arquear la espalda en exceso
      - Usar demasiado peso y comprometer el control
      - Levantar los glúteos del suelo

      ### 6. Seguridad y modificaciones
      - Usa un rack de potencia con los pasadores de seguridad a la altura adecuada
      - Con pesos pesados, pide a asistentes que te ayuden a entrar y salir de la posición
      - Empieza con un peso moderado para adaptarte al rango limitado
      - Variación avanzada: añade cadenas o usa negativas lentas
