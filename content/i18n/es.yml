  Crunch:
    name: Crunch
    instructions: |
      ## Resumen
      El crunch es un ejercicio fundamental de core que trabaja principalmente el recto abdominal. También involucra el transverso abdominal y los oblicuos como estabilizadores, lo que lo convierte en un ejercicio accesible y eficaz para desarrollar fuerza y resistencia abdominal.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba sobre una colchoneta con las rodillas flexionadas y los pies apoyados en el suelo
      - Coloca las manos suavemente detrás de la cabeza o cruzadas sobre el pecho
      - Mantén los codos apuntando hacia los lados si tienes las manos detrás de la cabeza
      - Activa el core y presiona la zona lumbar contra la colchoneta
      - Deja un pequeño espacio entre la barbilla y el pecho

      ### 2. Movimiento
      1. Despega las escápulas de la colchoneta contrayendo los músculos abdominales
      2. Enrolla el torso hacia las rodillas, concentrándote en llevar la caja torácica hacia la pelvis
      3. Exhala y aprieta los abdominales en la parte alta del movimiento durante 1-2 segundos
      4. Baja lentamente los hombros con control
      5. Detente justo antes de que los hombros toquen la colchoneta para mantener la tensión
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala con fuerza mientras subes en el crunch y contraes los abdominales
      - Inhala mientras bajas a la posición inicial

      ### 4. Consejos
      - Concéntrate en enrollar el torso en lugar de solo levantar la cabeza y el cuello
      - Mantén la zona lumbar presionada contra la colchoneta en todo momento
      - Evita tirar de la cabeza o el cuello con las manos
      - Muévete despacio y con control para maximizar la activación muscular
      - Mantén tensión constante en los abdominales sin relajarte por completo entre repeticiones

      ### 5. Errores comunes
      - Tirar del cuello con las manos, lo que puede causar sobrecarga
      - Usar impulso en lugar de una contracción muscular controlada
      - Subir demasiado o usar los flexores de cadera en lugar de los abdominales
      - Dejar que la zona lumbar se arquee y se despegue de la colchoneta
      - Moverse demasiado rápido y sacrificar la técnica por la velocidad
      - Relajarse por completo entre repeticiones, perdiendo la tensión del core

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden colocar las manos sobre los muslos y deslizarlas hacia las rodillas durante el crunch
      - Variante avanzada: sostén un disco sobre el pecho para añadir resistencia
      - Si sientes molestias en el cuello, mantén la mirada fija en un punto del techo
      - Progresa añadiendo una pausa de 3-5 segundos en la contracción máxima
