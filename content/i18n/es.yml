  Squat (Barbell):
    name: Sentadilla (barra)
    instructions: |
      ## Resumen
      La sentadilla con barra es un ejercicio compuesto de tren inferior que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También activa el core, la zona lumbar y la parte alta de la espalda, lo que la convierte en uno de los ejercicios de fuerza más eficaces para desarrollar la potencia general del tren inferior.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca una barra en un soporte a la altura de la parte alta del pecho
      - Métete bajo la barra y colócala sobre la parte alta de tu espalda (barra alta) o más abajo, sobre los deltoides posteriores (barra baja)
      - Sujeta la barra con las manos algo más abiertas que el ancho de los hombros
      - Saca la barra del soporte y da un paso atrás con los pies separados al ancho de los hombros
      - Mantén el pecho erguido, el core activado y la mirada al frente

      ### 2. Movimiento
      1. Inicia la sentadilla flexionando rodillas y caderas a la vez
      2. Mantén el pecho erguido y el peso sobre los talones
      3. Desciende hasta que los muslos queden al menos paralelos al suelo
      4. Mantén la columna neutra durante todo el movimiento
      5. Empuja con los talones para volver a la posición de pie
      6. Extiende por completo caderas y rodillas arriba y repite

      ### 3. Respiración
      - Toma una respiración profunda y activa el core antes de descender
      - Mantén la respiración durante el descenso y la posición baja
      - Exhala al empujar de vuelta arriba o al llegar arriba

      ### 4. Consejos
      - Mantén las rodillas alineadas sobre los dedos de los pies
      - Mantén el torso erguido en todo momento
      - Empuja con todo el pie, no solo con las puntas
      - Mantén la trayectoria de la barra vertical sobre la mitad del pie
      - Concéntrate en un descenso controlado y un ascenso explosivo

      ### 5. Errores comunes
      - Dejar que las rodillas se metan hacia dentro
      - No lograr la profundidad adecuada (al menos hasta la paralela)
      - Subir sobre las puntas en lugar de mantener el peso en los talones
      - Redondear la espalda o perder la columna neutra
      - Dejar que la barra se desplace hacia delante durante el descenso
      - Usar demasiado peso antes de dominar la técnica

      ### 6. Seguridad y modificaciones
      - Usa siempre barras de seguridad o un asistente al levantar pesos altos
      - Empieza con poco peso para dominar la técnica
      - Ajusta la posición de la barra (alta o baja) según tu comodidad y objetivos
      - Variante avanzada: añade cadenas, bandas o realiza sentadillas con pausa
