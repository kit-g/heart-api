  Bench Dip:
    name: Fondos entre bancos
    instructions: |
      ## Resumen
      Los fondos entre bancos son un ejercicio con peso corporal que trabaja principalmente los tríceps. También involucran los hombros y el pecho como músculos secundarios, lo que los convierte en un movimiento de empuje eficaz para el tren superior que se puede realizar con un equipamiento mínimo.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en el borde de un banco firme con las manos agarrando el borde junto a las caderas
      - Coloca las manos separadas al ancho de los hombros con los dedos apuntando hacia delante
      - Extiende las piernas al frente con los talones apoyados en el suelo
      - Desliza los glúteos fuera del banco manteniendo las manos en su sitio
      - Mantén la espalda cerca del banco y los hombros hacia abajo

      ### 2. Movimiento
      1. Baja el cuerpo flexionando los codos hasta que lleguen a unos 90 grados
      2. Mantén los codos apuntando hacia atrás, sin abrirlos hacia los lados
      3. Mantén el torso erguido y evita encorvar los hombros
      4. Haz una pausa breve en la parte baja del movimiento
      5. Empuja con las palmas para extender los brazos y volver a la posición inicial
      6. Repite durante el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar el cuerpo
      - Exhala al empujar hacia arriba a la posición inicial

      ### 4. Consejos
      - Mantén los codos pegados al cuerpo durante todo el movimiento
      - Concéntrate en usar los tríceps para levantarte, sin empujar con las piernas
      - Mantén el core activado para conservar la estabilidad
      - Evita que los hombros se encojan hacia las orejas
      - Trabaja en un rango completo de movimiento manteniendo el control

      ### 5. Errores comunes
      - Dejar que los codos se abran excesivamente hacia los lados
      - Bajar demasiado y sobrecargar los hombros
      - Empujar con las piernas en lugar de aislar los tríceps
      - Moverse demasiado rápido y usar impulso
      - Encorvar los hombros hacia delante
      - No bajar lo suficiente para trabajar bien los tríceps

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden flexionar las rodillas y acercar los pies al banco para una palanca más fácil
      - Variante avanzada: eleva los pies sobre otro banco para aumentar la dificultad
      - Coloca un disco sobre el regazo para añadir resistencia
      - Si sientes molestias en los hombros, reduce el rango de movimiento
