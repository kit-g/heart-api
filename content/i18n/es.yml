  Mountain Climber:
    name: Escaladores
    instructions: |
      ## Resumen
      El escalador es un ejercicio dinámico de cuerpo completo que trabaja principalmente el core, los flexores de cadera y los hombros. También activa los cuádriceps y el sistema cardiovascular, usando un movimiento de carrera desde la posición de plancha para desarrollar resistencia, coordinación y estabilidad del core.

      ## Ejecución
      ### 1. Posición inicial
      - Comienza en posición de plancha alta con las manos directamente bajo los hombros
      - Mantén el cuerpo en línea recta de la cabeza a los talones
      - Activa el core y mantén las caderas niveladas
      - Coloca los pies separados al ancho de las caderas

      ### 2. Movimiento
      1. Lleva una rodilla hacia el pecho en un movimiento de carrera
      2. Cambia rápidamente de pierna extendiendo la pierna flexionada hacia atrás y llevando la otra rodilla hacia delante
      3. Continúa alternando las piernas en un movimiento rítmico de carrera
      4. Mantén el core firme y las caderas niveladas en todo momento
      5. Mantén un ritmo constante o aumenta la velocidad para más intensidad
      6. Continúa durante el número de repeticiones o el tiempo deseado

      ### 3. Respiración
      - Respira de forma rítmica y constante durante el movimiento
      - Evita contener la respiración

      ### 4. Consejos
      - Mantén el core activado para evitar que las caderas se hundan o se eleven
      - Mantén la posición de plancha durante todo el movimiento
      - Concéntrate en llevar las rodillas hacia el pecho, no solo en mover las piernas
      - Empieza despacio para dominar la técnica antes de aumentar la velocidad
      - Mantén las manos firmemente apoyadas y los hombros estables

      ### 5. Errores comunes
      - Dejar que las caderas se hundan o se eleven en pico
      - Rebotar las caderas arriba y abajo con cada repetición
      - No llevar las rodillas lo suficientemente cerca del pecho
      - Dejar que los hombros se redondeen hacia delante
      - Moverse demasiado rápido y perder la técnica
      - Contener la respiración durante el ejercicio

      ### 6. Seguridad y modificaciones
      - Empieza con escaladores lentos para dominar la técnica
      - Eleva las manos sobre un banco para una variante más fácil
      - Realiza repeticiones lentas y controladas para mayor activación del core
      - Variante avanzada: añade un giro llevando la rodilla al codo opuesto o aumenta la velocidad
