  Preacher Curl (Barbell):
    name: Curl en banco Scott (barra)
    instructions: |
      ## Resumen
      El curl en banco Scott con barra es un ejercicio de aislamiento que trabaja principalmente el bíceps braquial, en particular su porción inferior. También involucra el braquial y el braquiorradial, usando un banco Scott para eliminar el impulso y mantener una tensión constante durante todo el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en un banco Scott con el pecho apoyado contra el respaldo acolchado
      - Ajusta la altura del asiento de modo que las axilas descansen cómodamente sobre el borde superior del apoyo
      - Sujeta una barra con agarre supino, con las manos separadas al ancho de los hombros
      - Extiende los brazos por completo sobre el apoyo con una ligera flexión de codos
      - Mantén la parte superior de los brazos plana contra el apoyo en todo momento

      ### 2. Movimiento
      1. Sube la barra contrayendo los bíceps
      2. Mantén la parte superior de los brazos firmemente apoyada contra el acolchado en todo momento
      3. Continúa subiendo hasta que los antebrazos queden casi verticales
      4. Haz una pausa y aprieta los bíceps en la parte alta del movimiento
      5. Baja lentamente la barra a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir la barra
      - Inhala al bajar la barra

      ### 4. Consejos
      - Mantén la parte superior de los brazos completamente inmóvil contra el apoyo
      - Evita despegar los codos o el pecho del acolchado durante el curl
      - Concéntrate en el estiramiento abajo y en apretar arriba
      - Controla el peso durante todo el rango de movimiento
      - Usa un peso que permita una técnica estricta sin impulso

      ### 5. Errores comunes
      - Despegar los codos o la parte superior de los brazos del apoyo
      - Usar impulso o balancear el peso
      - No lograr la extensión completa de los brazos abajo
      - Dejar caer el peso demasiado rápido en el descenso
      - Inclinarse hacia atrás o cambiar la posición del cuerpo
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el movimiento estricto y aislado
      - Usa una barra EZ si sientes molestias en las muñecas
      - Variante avanzada: añade una fase negativa de 3 a 5 segundos para mayor intensidad
      - Asegura la extensión completa de los brazos abajo sin hiperextender
