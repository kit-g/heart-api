  Upright Row (Cable):
    name: Remo al mentón (polea)
    instructions: |
      ## Resumen
      El remo al mentón en polea es un ejercicio compuesto que trabaja principalmente los deltoides laterales y la parte superior de los trapecios. También involucra los bíceps, los antebrazos y la porción media de los trapecios, y utiliza una polea baja para mantener la tensión constante durante todo el movimiento de tirón vertical.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de frente a una polea baja con una barra recta o cuerda acoplada
      - Sujeta el accesorio con agarre prono, con las manos algo más juntas que el ancho de los hombros
      - Mantente erguido con los pies separados al ancho de las caderas
      - Deja que los brazos cuelguen rectos con el cable en tensión
      - Mantén los hombros hacia atrás y el core activado

      ### 2. Movimiento
      1. Tira del accesorio hacia arriba pegado al cuerpo elevando los codos
      2. Guía el movimiento con los codos, manteniéndolos más altos que las muñecas
      3. Continúa tirando hasta que el accesorio llegue a la parte superior del pecho o a la altura del mentón
      4. Mantén el accesorio cerca del cuerpo en todo momento
      5. Haz una pausa breve en la parte alta del movimiento
      6. Baja lentamente el accesorio de vuelta a la posición inicial con control

      ### 3. Respiración
      - Exhala al tirar del accesorio hacia arriba
      - Inhala al bajarlo de vuelta

      ### 4. Consejos
      - Guía el movimiento con los codos, no con las manos
      - Mantén el accesorio cerca del cuerpo durante todo el movimiento
      - Evita encoger los hombros en la parte alta
      - Mantén la tensión constante sin dejar que la torre de pesas descanse
      - Controla tanto la fase de subida como la de bajada

      ### 5. Errores comunes
      - Tirar demasiado alto y forzar los hombros
      - Dejar que los codos queden por debajo de las muñecas
      - Usar impulso o balancear el cuerpo
      - Dejar que la torre de pesas descanse entre repeticiones
      - Inclinarse hacia atrás durante el tirón
      - Usar un agarre demasiado amplio, que puede causar pinzamiento en el hombro

      ### 6. Seguridad y modificaciones
      - Usa un ancho de agarre moderado para evitar molestias en los hombros
      - Detente a la altura de los hombros si sientes cualquier dolor en ellos
      - Prueba el accesorio de cuerda para una posición de manos más natural
      - Variación avanzada: trabaja un brazo a la vez para un enfoque unilateral
