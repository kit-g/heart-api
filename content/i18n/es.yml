  Stretching:
    name: Estiramientos
    instructions: |
      ## Resumen
      Los estiramientos son un ejercicio de flexibilidad que trabaja múltiples grupos musculares de todo el cuerpo. Ayudan a mejorar el rango de movimiento, reducir la tensión muscular y favorecer la recuperación, por lo que son esenciales para la movilidad general y la prevención de lesiones.

      ## Ejecución
      ### 1. Posición inicial
      - Elige un espacio cómodo con suficiente sitio para moverte con libertad
      - Usa ropa cómoda que no restrinja el movimiento
      - Empieza con movimiento suave para calentar los músculos
      - Concéntrate en las zonas que sientas tensas o que vayas a usar en tu entrenamiento

      ### 2. Movimiento
      1. Elige estiramientos dirigidos a los grupos musculares que quieras trabajar
      2. Entra lentamente en cada estiramiento hasta sentir una tensión suave
      3. Mantén cada estiramiento de 15 a 30 segundos sin rebotar
      4. Respira profundamente y relájate en cada posición
      5. Suelta lentamente y pasa al siguiente estiramiento
      6. Continúa durante el tiempo que desees

      ### 3. Respiración
      - Respira lenta y profundamente durante cada estiramiento
      - Exhala mientras profundizas en un estiramiento
      - Nunca contengas la respiración mientras estiras

      ### 4. Consejos
      - Estira después de entrenar, cuando los músculos están calientes
      - Concéntrate en los grupos musculares principales y en las zonas de tensión
      - Estirar debe sentirse cómodo, nunca doloroso
      - Incluye estiramientos tanto del tren superior como del inferior
      - La constancia es más importante que la duración

      ### 5. Errores comunes
      - Rebotar o dar tirones durante los estiramientos
      - Forzar rangos de movimiento dolorosos
      - Contener la respiración durante los estiramientos
      - Apresurar los estiramientos sin mantenerlos el tiempo adecuado
      - Estirar los músculos en frío sin calentar
      - Descuidar ciertos grupos musculares

      ### 6. Seguridad y modificaciones
      - Nunca estires hasta el punto de sentir dolor agudo
      - Usa accesorios como bloques de yoga o correas si lo necesitas
      - Reduce la intensidad si te estás recuperando de una lesión
      - Considera estiramientos dinámicos antes de entrenar y estáticos después
