  Shrug (Machine):
    name: Encogimientos de hombros (máquina)
    instructions: |
      ## Resumen
      El encogimiento de hombros en máquina es un ejercicio de aislamiento que trabaja principalmente el trapecio superior. También involucra el elevador de la escápula y los romboides, y usa una trayectoria fija que aporta estabilidad y permite concentrarse solo en el gesto de encoger los hombros.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate en la máquina de encogimientos según su diseño
      - Sujeta las asas con ambas manos
      - Mantente de pie o sentado erguido, con los brazos colgando rectos
      - Mantén los pies al ancho de hombros si estás de pie
      - Activa el core y mantén la columna neutra

      ### 2. Movimiento
      1. Eleva los hombros en línea recta hacia las orejas
      2. Mantén los brazos rectos durante todo el movimiento
      3. Continúa hasta la máxima elevación de los hombros
      4. Haz una pausa y contrae los trapecios arriba
      5. Baja los hombros lentamente a la posición inicial con control
      6. Detente justo antes de que las placas se apoyen para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala al elevar los hombros
      - Inhala al bajarlos

      ### 4. Consejos
      - Concéntrate en subir los hombros en línea recta, sin rotarlos
      - Mantén los brazos rectos y relajados en todo momento
      - Evita usar impulso o rebotar
      - Contrae con fuerza los trapecios en la parte alta de cada repetición
      - Mantén la tensión constante sin dejar que las placas se apoyen

      ### 5. Errores comunes
      - Rotar los hombros en lugar de subirlos en línea recta
      - Doblar los codos durante el encogimiento
      - Usar impulso o rebotar el peso
      - No completar el rango completo de movimiento
      - Dejar que las placas se apoyen entre repeticiones
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Empieza con un peso moderado para dominar el gesto de subida vertical
      - Ajusta la máquina para que se adapte bien a tu cuerpo
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte alta de cada repetición
      - Hazlo con una fase negativa lenta de 3-5 segundos para mayor intensidad
