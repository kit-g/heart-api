  Chest Dip (Assisted):
    name: Fondos para pecho (asistidos)
    instructions: |
      ## Resumen
      Los fondos para pecho asistidos son un ejercicio de empuje en máquina que trabaja principalmente la parte inferior del pectoral mayor con ayuda. También involucran los tríceps y los deltoides frontales, y utilizan un contrapeso de asistencia para hacer el movimiento de fondos más accesible mientras desarrollas fuerza hacia los fondos sin ayuda.

      ## Ejecución
      ### 1. Posición inicial
      - Ajusta el peso en la máquina de fondos asistidos (más peso = más asistencia)
      - Sujeta las asas con las manos algo más separadas que el ancho de los hombros
      - Apoya las rodillas o los pies en la plataforma de asistencia
      - Empieza con los brazos completamente extendidos y el torso inclinado hacia delante
      - Activa el core y mantén los hombros hacia abajo

      ### 2. Movimiento
      1. Baja el cuerpo doblando los codos hasta llegar a unos 90 grados
      2. Mantén el torso inclinado hacia delante durante todo el movimiento
      3. Mantén el control mientras la plataforma de asistencia soporta tu peso
      4. Haz una breve pausa en la parte baja del movimiento
      5. Empuja con las palmas para extender los brazos y volver a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar el cuerpo
      - Exhala al empujar de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén la inclinación hacia delante para enfatizar el pecho sobre los tríceps
      - Reduce gradualmente el peso de asistencia a medida que ganes fuerza
      - Concéntrate en un movimiento controlado en todo el rango
      - Mantén los codos ligeramente abiertos para enfatizar el pecho
      - Evita depender demasiado de la asistencia

      ### 5. Errores comunes
      - Usar demasiada asistencia y no exigirte
      - Mantenerse demasiado erguido en lugar de inclinarse hacia delante
      - Dejar que los codos se abran en exceso
      - Usar impulso en lugar de un movimiento controlado
      - No completar el rango completo de movimiento
      - No reducir gradualmente el peso de asistencia con el tiempo

      ### 6. Seguridad y modificaciones
      - Empieza con más asistencia y redúcela gradualmente a medida que te fortalezcas
      - Prioriza la técnica antes que reducir la asistencia demasiado rápido
      - Progresa hacia fondos asistidos con banda o fondos negativos antes de intentarlos sin ayuda
      - Reduce el rango de movimiento si sientes molestias en los hombros
