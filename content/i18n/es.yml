  Jackknife Sit Up:
    name: Navaja (jackknife)
    instructions: |
      ## Resumen
      La navaja (jackknife) es un ejercicio dinámico de core que trabaja principalmente todo el recto abdominal. También involucra los flexores de cadera, los oblicuos y el transverso abdominal al elevar simultáneamente el tren superior y el inferior, generando una contracción intensa en todo el core.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba sobre una colchoneta con los brazos extendidos por encima de la cabeza
      - Mantén las piernas rectas y juntas, completamente extendidas sobre la colchoneta
      - Activa el core y presiona la zona lumbar contra la colchoneta
      - Mantén la cabeza en posición neutra, alineada con la columna

      ### 2. Movimiento
      1. Eleva simultáneamente las piernas y el tren superior de la colchoneta
      2. Lleva las manos hacia los pies manteniendo las piernas rectas
      3. Concéntrate en juntar la caja torácica y las caderas en la parte alta
      4. Mantén el equilibrio sobre los glúteos en el punto máximo del movimiento
      5. Haz una breve pausa cuando las manos toquen o se acerquen a los pies
      6. Baja lentamente el tren superior y el inferior con control
      7. Regresa a la posición inicial y repite con repeticiones controladas

      ### 3. Respiración
      - Exhala mientras pliegas el cuerpo y lo juntas
      - Inhala mientras bajas a la posición inicial

      ### 4. Consejos
      - Concéntrate en plegar el cuerpo con el core, no con impulso
      - Mantén las piernas rectas durante todo el movimiento
      - Mantén el control tanto en la fase de subida como en la de bajada
      - Evita tirar con los brazos; deja que el core haga el trabajo
      - Mantén tensión constante en los abdominales moviéndote despacio

      ### 5. Errores comunes
      - Usar impulso para subir en lugar de una contracción controlada del core
      - Flexionar las rodillas para facilitar el ejercicio
      - Dejar que los brazos tiren en lugar de que el core dirija el movimiento
      - Moverse demasiado rápido y perder el control
      - No volver a la extensión completa en la posición inicial
      - Contener la respiración durante el movimiento

      ### 6. Seguridad y modificaciones
      - Los principiantes deben empezar con crunches y elevaciones de piernas por separado antes de combinarlos
      - Realiza la variante con rodillas flexionadas si las piernas rectas resultan demasiado exigentes
      - Variante avanzada: sostén un peso ligero por encima de la cabeza para añadir resistencia
      - Si sientes molestias en la zona lumbar, reduce el rango de movimiento
