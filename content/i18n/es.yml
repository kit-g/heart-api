  Cable Crossover:
    name: Cruce de poleas
    instructions: |
      ## Resumen
      El cruce de poleas es un ejercicio de aislamiento que trabaja principalmente el pectoral mayor, en particular la parte interna del pecho. También involucra los deltoides frontales como estabilizadores, y utiliza poleas para ofrecer tensión constante a lo largo de un arco de movimiento amplio.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de pie en el centro, entre dos poleas altas
      - Sujeta un asa en cada mano con los brazos extendidos hacia los lados
      - Da un paso al frente y adopta una postura escalonada para mayor estabilidad
      - Inclínate ligeramente hacia delante desde las caderas con el pecho erguido
      - Mantén una ligera flexión de codos en todo momento

      ### 2. Movimiento
      1. Lleva ambas asas hacia abajo y al centro, frente al pecho
      2. Mantén los codos ligeramente flexionados, como en un abrazo
      3. Continúa hasta que las manos se junten o se crucen a la altura del pecho
      4. Contrae con fuerza el pecho en el punto de máxima contracción
      5. Devuelve lentamente los brazos a la posición inicial con control
      6. Detente antes de perder la tensión de las poleas y repite

      ### 3. Respiración
      - Exhala al juntar las asas
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén una flexión de codos constante durante todo el movimiento
      - Concéntrate en contraer el pecho, no en tirar con los brazos
      - Mantén la tensión constante controlando ambas fases
      - Mantén el core firme para evitar inclinarte demasiado hacia delante
      - Ajusta la altura de las poleas para trabajar distintos ángulos del pecho

      ### 5. Errores comunes
      - Estirar por completo los brazos durante el movimiento
      - Usar impulso o balancear el cuerpo
      - No mantener la tensión constante en las poleas
      - Inclinarse demasiado hacia delante
      - Moverse demasiado rápido y perder la contracción
      - Usar un peso excesivo y doblar demasiado los codos

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el arco del movimiento
      - Ajusta la altura de la polea (alta, media, baja) para variar el énfasis en el pecho
      - Trabaja un brazo a la vez para un enfoque unilateral
      - Variante avanzada: haz una pausa de 2 a 3 segundos en la máxima contracción
