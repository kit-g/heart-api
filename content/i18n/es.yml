  Jump Rope:
    name: Saltar la cuerda
    instructions: |
      ## Resumen
      Saltar la cuerda es un ejercicio cardiovascular de alta intensidad que trabaja los gemelos, los hombros y el sistema cardiovascular. Desarrolla la coordinación, la agilidad y la resistencia, y ofrece un entrenamiento eficiente de cuerpo completo con un equipamiento mínimo.

      ## Ejecución
      ### 1. Posición inicial
      - Sujeta los mangos de la cuerda con las manos a la altura de la cadera
      - Coloca la cuerda detrás de los talones
      - Ponte de pie con los pies juntos o ligeramente separados
      - Mantén los codos pegados a los costados
      - Mantén una postura erguida con el core activado

      ### 2. Movimiento
      1. Haz girar la cuerda por encima de la cabeza usando las muñecas
      2. Salta con ambos pies para dejar pasar la cuerda por debajo
      3. Aterriza suavemente sobre la parte delantera de los pies
      4. Mantén los saltos bajos, solo lo suficiente para dejar pasar la cuerda
      5. Mantén un ritmo constante
      6. Continúa durante el tiempo o el número de repeticiones deseado

      ### 3. Respiración
      - Respira de forma rítmica y constante durante todo el ejercicio
      - Encuentra un patrón de respiración que se ajuste a tu ritmo
      - Evita contener la respiración

      ### 4. Consejos
      - Usa las muñecas para girar la cuerda, no los brazos
      - Mantén los saltos pequeños y eficientes
      - Aterriza suavemente para reducir el impacto en las articulaciones
      - Comienza con intervalos cortos y desarrolla la resistencia
      - Las distintas técnicas (a una pierna, saltos dobles) añaden variedad

      ### 5. Errores comunes
      - Saltar más alto de lo necesario
      - Usar los brazos en lugar de las muñecas para girar la cuerda
      - Aterrizar con demasiado peso sobre los talones
      - Sujetar los mangos demasiado lejos del cuerpo
      - Mala postura con los hombros redondeados
      - Longitud de la cuerda mal ajustada a tu estatura

      ### 6. Seguridad y modificaciones
      - Ajusta la longitud de la cuerda adecuadamente a tu estatura
      - Comienza con el salto básico y progresa hacia las variaciones
      - Realiza el ejercicio sobre una superficie adecuada (no sobre concreto)
      - Usa calzado deportivo con buen soporte
    validated: false
