  Chest Fly:
    name: Aperturas
    instructions: |
      ## Resumen
      Las aperturas en máquina son un ejercicio de aislamiento que trabaja principalmente el pectoral mayor. También involucran mínimamente los deltoides frontales, y utilizan un recorrido fijo que aporta estabilidad y una resistencia constante durante todo el movimiento de apertura.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de aperturas con la espalda firme contra el respaldo
      - Ajusta la altura del asiento para que las asas queden a la altura de la mitad del pecho
      - Sujeta las asas con los brazos extendidos hacia los lados
      - Mantén una ligera flexión de codos en todo momento
      - Apoya los pies planos en el suelo y activa el core

      ### 2. Movimiento
      1. Junta ambas asas frente al pecho
      2. Mantén los codos ligeramente flexionados, como en un abrazo
      3. Continúa hasta que las asas se junten o casi se toquen
      4. Contrae con fuerza el pecho en el punto de máxima contracción
      5. Devuelve lentamente los brazos a la posición inicial con control
      6. Detente justo antes de que la carga se apoye para mantener la tensión y repite

      ### 3. Respiración
      - Exhala al juntar las asas
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén una flexión de codos constante durante todo el movimiento
      - Concéntrate en contraer el pecho en el punto máximo
      - Mantén la tensión constante sin dejar que la carga se apoye
      - Mantén la espalda firmemente apoyada contra el respaldo
      - Controla tanto la fase de cierre como la de apertura

      ### 5. Errores comunes
      - Estirar por completo los brazos durante el movimiento
      - Usar impulso en lugar de una contracción muscular controlada
      - Dejar que la carga se apoye entre repeticiones
      - Despegar la espalda del respaldo
      - Moverse demasiado rápido y perder la contracción
      - Usar demasiado peso y doblar los codos en exceso

