  Trap Bar Deadlift:
    name: Peso muerto con barra hexagonal
    instructions: |
      ## Resumen
      El peso muerto con barra hexagonal es un ejercicio compuesto que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También involucra los erectores espinales, los dorsales y los trapecios, usando un diseño de barra hexagonal que permite una posición de columna más neutra y reduce el estrés en la zona lumbar.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie dentro de la barra hexagonal con los pies separados al ancho de las caderas
      - Sujeta las asas a los lados con agarre neutro
      - Haz una bisagra de cadera y flexiona las rodillas para alcanzar las asas
      - Mantén el pecho erguido, la espalda plana y los hombros sobre la barra
      - Activa el core y los dorsales antes de levantar

      ### 2. Movimiento
      1. Empuja con los talones y extiende las caderas y las rodillas al mismo tiempo
      2. Mantén la barra cerca del cuerpo mientras la levantas
      3. Ponte completamente de pie extendiendo las caderas y las rodillas
      4. Mantén los hombros atrás y el pecho erguido arriba
      5. Baja la barra empujando las caderas hacia atrás y flexionando las rodillas
      6. Devuelve la barra al suelo con control y repite

      ### 3. Respiración
      - Toma una respiración profunda y activa el core antes de levantar
      - Aguanta la respiración durante el levantamiento
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - La barra hexagonal permite un agarre más natural y neutro
      - El recorrido de la barra es más vertical que en el peso muerto convencional
      - Esta variante suele ser más amable con la zona lumbar
      - Empuja con todo el pie, no solo con la punta
      - Piensa en empujar el suelo lejos de ti en lugar de levantar la barra

      ### 5. Errores comunes
      - Redondear la zona lumbar durante el levantamiento
      - Empezar con las caderas demasiado altas o demasiado bajas
      - No extender por completo las caderas arriba
      - Mirar hacia arriba o hacia abajo en lugar de mantener el cuello neutro
      - Tirar con los brazos en lugar de empujar con las piernas y las caderas
      - No aprovechar la posición de agarre neutro

      ### 6. Seguridad y modificaciones
      - Empieza con menos peso para adaptarte a la barra hexagonal
      - Muchas barras hexagonales tienen asas altas y bajas; empieza con las asas altas
      - Esta variante es excelente para quienes tienen molestias en la zona lumbar
      - Si sientes molestias en la zona lumbar, revisa tu técnica y reduce el peso
