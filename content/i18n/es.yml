  Hang Clean (Barbell):
    name: Cargada en suspensión (barra)
    instructions: |
      ## Resumen
      La cargada en suspensión es una variante de halterofilia que trabaja los cuádriceps, los glúteos, los isquiotibiales y la parte alta de la espalda. Comienza desde una posición de pie en lugar del suelo, centrándose en la extensión explosiva de cadera y las fases de recepción mientras reduce la complejidad técnica.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie sosteniendo una barra con los brazos extendidos
      - Coloca la barra a la mitad del muslo con los pies al ancho de caderas
      - Mantén el pecho arriba, la espalda plana y el core activado
      - Haz una ligera bisagra de cadera con las rodillas flexionadas
      - Sujeta la barra justo por fuera de tus piernas, con agarre de gancho si es posible

      ### 2. Movimiento
      1. Baja la barra con control hasta justo debajo de las rodillas
      2. Extiende explosivamente las caderas y las rodillas para saltar hacia arriba
      3. Encoge los hombros y métete debajo de la barra
      4. Recibe la barra sobre la parte delantera de los hombros en posición de sentadilla frontal
      5. Ponte de pie por completo con la barra sobre los hombros
      6. Baja la barra de vuelta a la posición de suspensión y repite

      ### 3. Respiración
      - Inhala durante la fase de bajada
      - Mantén el aire durante el tirón explosivo y la recepción
      - Exhala después de ponerte de pie

      ### 4. Consejos
      - Esta variante se centra en la posición de potencia de la cargada
      - Mantén la barra cerca de tu cuerpo durante el tirón
      - Recibe la barra con los codos altos y hacia adelante
      - La posición de suspensión reduce las exigencias técnicas frente a las cargadas desde el suelo
      - Concéntrate en la extensión explosiva de cadera

      ### 5. Errores comunes
      - Bajar la barra demasiado despacio y perder tensión
      - Tirar con los brazos en lugar de impulsar con las caderas
      - Dejar que la barra se aleje del cuerpo
      - Recibir con los codos bajos o la espalda en mala posición
      - No extender por completo las caderas antes de meterse debajo
      - Usar demasiado peso antes de dominar la técnica

      ### 6. Seguridad y modificaciones
      - Aprende esta variante antes de progresar a cargadas completas desde el suelo
      - Domina la cargada de potencia (recibiendo alto) antes de las cargadas con sentadilla completa
      - Usa discos de goma para soltar la barra con seguridad si es necesario
      - Busca supervisión de un entrenador para una técnica correcta de halterofilia
