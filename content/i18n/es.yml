  Bulgarian Split Squat:
    name: Sentadilla búlgara
    instructions: |
      ## Resumen
      La sentadilla búlgara es un ejercicio unilateral del tren inferior que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También involucra el core y los estabilizadores de la cadera, y utiliza el pie trasero elevado para aumentar el rango de movimiento y desafiar el equilibrio mientras desarrolla la fuerza a una pierna.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie de espaldas a un banco o superficie elevada
      - Apoya el empeine del pie trasero sobre el banco detrás de ti
      - Coloca el pie delantero lo bastante adelante como para permitir una zancada profunda
      - Mantén el pecho erguido, el core activado y el torso recto
      - Sostén mancuernas a los lados o una barra sobre la parte alta de la espalda

      ### 2. Movimiento
      1. Baja el cuerpo flexionando la rodilla y la cadera delanteras
      2. Mantén la rodilla delantera alineada sobre los dedos del pie
      3. Continúa bajando hasta que el muslo delantero quede paralelo al suelo
      4. Haz una breve pausa abajo
      5. Empuja con el talón delantero para volver a la posición inicial
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Inhala mientras bajas el cuerpo
      - Exhala mientras empujas de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén la mayor parte del peso sobre la pierna delantera
      - Mantén el torso erguido durante todo el movimiento
      - Encuentra la posición óptima del pie delantero según tu flexibilidad
      - Concéntrate en controlar el descenso y subir de forma explosiva
      - Mantén la rodilla delantera alineada con los dedos del pie

      ### 5. Errores comunes
      - Colocar el pie delantero demasiado cerca del banco
      - Dejar que la rodilla delantera se vaya hacia adentro
      - Inclinarse demasiado hacia adelante durante el movimiento
      - Cargar demasiado peso sobre el pie trasero
      - No lograr una profundidad adecuada
      - Acelerar las repeticiones en lugar de controlar el movimiento

      ### 6. Seguridad y modificaciones
      - Empieza solo con el peso corporal para dominar el equilibrio y la técnica
      - Usa una superficie más baja para el pie trasero si lo necesitas
      - Sujétate de un apoyo para mantener el equilibrio al principio
      - Variación avanzada: añade peso con mancuernas, barra o chaleco lastrado
