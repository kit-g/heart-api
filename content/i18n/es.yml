  Pull Up:
    name: Dominadas
    instructions: |
      ## Resumen
      Las dominadas son un ejercicio de tracción con el peso corporal que trabaja principalmente el dorsal ancho. También involucran los romboides, el trapecio medio, los bíceps y el core, lo que las convierte en uno de los ejercicios más efectivos del tren superior para desarrollar la amplitud de la espalda y la fuerza de tracción.

      ## Ejecución
      ### 1. Posición inicial
      - Cuélgate de una barra de dominadas con agarre prono, con las manos algo más separadas que el ancho de hombros
      - Deja el cuerpo completamente extendido, con los brazos rectos
      - Activa el core y mantén los hombros hacia abajo
      - Cruza los tobillos o mantén las piernas rectas
      - Evita balancearte en exceso

      ### 2. Movimiento
      1. Sube llevando los codos hacia abajo y atrás
      2. Guía el movimiento con el pecho y mantén los hombros atrás
      3. Continúa hasta que la barbilla supere la barra
      4. Mantén el core firme durante todo el movimiento
      5. Haz una breve pausa arriba
      6. Baja lentamente hasta la posición inicial con los brazos completamente extendidos

      ### 3. Respiración
      - Exhala al subir
      - Inhala al bajar

      ### 4. Consejos
      - Piensa en llevar los codos hacia abajo en lugar de subir la barbilla
      - Mantén los hombros activos y evita encogerlos
      - Controla el descenso para maximizar el trabajo muscular
      - Busca el rango completo de movimiento, desde el cuelgue total hasta la barbilla sobre la barra
      - Mantén el core firme para minimizar el balanceo

      ### 5. Errores comunes
      - Usar impulso o kipping en lugar de una ejecución estricta
      - No completar el rango de movimiento arriba o abajo
      - Encoger los hombros hacia las orejas
      - Balancearse en exceso durante el movimiento
      - No extender por completo los brazos abajo
      - Tirar solo con los brazos sin activar la espalda

      ### 6. Seguridad y modificaciones
      - Usa una máquina asistida de dominadas o una banda como ayuda
      - Haz dominadas negativas (salta hasta arriba y baja lento) para ganar fuerza
      - Variación avanzada: añade peso con un cinturón de lastre o un chaleco lastrado
      - Progresa de forma gradual para evitar sobrecargar los hombros
