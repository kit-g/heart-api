  Donkey Kick (Smith Machine):
    name: Patada de burro (máquina Smith)
    instructions: |
      ## Resumen
      La patada de burro en máquina Smith es un ejercicio de aislamiento que trabaja principalmente los glúteos. También involucra los isquiotibiales, y utiliza la trayectoria vertical fija de la barra para ofrecer una resistencia estable durante la extensión de cadera.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate a cuatro patas bajo la barra de la máquina Smith
      - Apoya la planta de un pie contra la parte inferior de la barra
      - Coloca las manos justo debajo de los hombros y la rodilla debajo de la cadera
      - Mantén el core activado y la espalda plana
      - Ajusta la barra a una altura inicial adecuada

      ### 2. Movimiento
      1. Empuja el pie hacia arriba contra la barra extendiendo la cadera
      2. Mantén la rodilla flexionada a 90 grados en todo momento
      3. Continúa hasta que el muslo quede en línea con el torso o un poco más arriba
      4. Aprieta el glúteo con fuerza en la parte alta del movimiento
      5. Baja lentamente la barra a la posición inicial con control
      6. Completa todas las repeticiones de un lado y luego cambia al otro

      ### 3. Respiración
      - Exhala al empujar la barra hacia arriba
      - Inhala al bajar la barra

      ### 4. Consejos
      - Mantén el core activado y la espalda plana en todo momento
      - Concéntrate en impulsar el movimiento con el glúteo
      - Mantén la rodilla flexionada a 90 grados
      - Evita arquear la zona lumbar en exceso
      - Mantén las caderas alineadas con el suelo

      ### 5. Errores comunes
      - Arquear la zona lumbar en exceso para subir más
      - Rotar las caderas en lugar de mantenerlas alineadas
      - Usar impulso en lugar de una contracción controlada del glúteo
      - Estirar la pierna de trabajo durante el movimiento
      - No lograr la extensión completa de la cadera
      - Hacer las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso o solo con la barra para dominar el movimiento
      - Ajusta la altura inicial de la barra a un rango de movimiento cómodo
      - Acolcha la rodilla de apoyo para mayor comodidad
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte alta de cada repetición
