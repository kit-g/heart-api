  Thruster (Barbell):
    name: Thruster (barra)
    instructions: |
      ## Resumen
      El thruster con barra es un ejercicio compuesto de cuerpo completo que combina una sentadilla frontal con un press por encima de la cabeza. Trabaja principalmente las piernas, los hombros y el core, en un solo movimiento explosivo y continuo que desarrolla potencia, resistencia y fuerza de todo el cuerpo.

      ## Ejecución
      ### 1. Posición inicial
      - Sostén la barra en posición de rack frontal a la altura de los hombros
      - Ponte de pie con los pies separados al ancho de los hombros
      - Mantén los codos altos y el pecho erguido
      - Mantén el core activado en todo momento

      ### 2. Movimiento
      1. Baja en sentadilla frontal hasta que los muslos queden paralelos al suelo o más abajo
      2. Empuja explosivamente hacia arriba desde la sentadilla
      3. Usa el impulso para presionar la barra por encima de la cabeza mientras te pones de pie
      4. Bloquea la barra en alto con los brazos totalmente extendidos
      5. Baja la barra de vuelta a la posición de rack frontal
      6. Baja de inmediato a la siguiente sentadilla y repite

      ### 3. Respiración
      - Inhala al bajar a la sentadilla
      - Exhala explosivamente al subir y presionar

      ### 4. Consejos
      - Usa el empuje de piernas para ayudar a llevar la barra arriba
      - Mantén el movimiento fluido y continuo
      - Mantén el torso erguido durante la sentadilla
      - Es uno de los ejercicios de cuerpo completo más exigentes
      - Empieza con poco peso para dominar la coordinación

      ### 5. Errores comunes
      - No usar el empuje de piernas para asistir el press
      - Hacer pausa entre la sentadilla y el press
      - Dejar que el pecho se hunda durante la sentadilla
      - No lograr la extensión completa por encima de la cabeza
      - Mala posición de rack frontal con los codos bajos
      - Usar demasiado peso antes de dominar la técnica

      ### 6. Seguridad y modificaciones
      - Domina antes por separado la sentadilla frontal y el press militar
      - Empieza con la barra vacía o con mancuernas ligeras
      - Este ejercicio es popular en CrossFit y en el acondicionamiento metabólico
      - Reduce el peso para series de resistencia con más repeticiones
