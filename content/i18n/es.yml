  Superman:
    name: Superman
    instructions: |
      ## Resumen
      El superman es un ejercicio de core con peso corporal que trabaja principalmente la zona lumbar (erectores espinales) y los glúteos. También involucra la parte alta de la espalda, los hombros y los isquiotibiales, lo que lo hace eficaz para fortalecer la cadena posterior y mejorar la extensión de la columna.

      ## Ejecución
      ### 1. Posición inicial
      - Acuéstate boca abajo en una colchoneta con los brazos extendidos por delante de la cabeza
      - Mantén las piernas rectas y juntas, completamente extendidas hacia atrás
      - Apoya la frente en la colchoneta con el cuello en posición neutra
      - Activa el core y los glúteos antes de iniciar el movimiento
      - Mantén las puntas de los pies estiradas en todo momento

      ### 2. Movimiento
      1. Levanta simultáneamente los brazos, el pecho y las piernas de la colchoneta
      2. Elévalos tanto como te resulte cómodo mientras aprietas la zona lumbar y los glúteos
      3. Mantén los brazos y las piernas rectos durante todo el movimiento
      4. Haz una pausa breve arriba, apretando la cadena posterior
      5. Baja lentamente los brazos, el pecho y las piernas a la colchoneta con control
      6. Repite durante el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al levantar los brazos, el pecho y las piernas de la colchoneta
      - Inhala al bajar a la posición inicial

      ### 4. Consejos
      - Concéntrate en apretar la zona lumbar y los glúteos en la parte alta
      - Mantén el cuello neutro mirando hacia la colchoneta
      - Levanta con control y no con impulso
      - Mantén los brazos y las piernas rectos en todo momento
      - Imagina alargar el cuerpo desde las puntas de los dedos hasta los pies

      ### 5. Errores comunes
      - Levantar demasiado la cabeza y el cuello, lo que puede causar molestias
      - Flexionar los brazos o las piernas durante el movimiento
      - Usar impulso en lugar de una contracción muscular controlada
      - No activar los glúteos y depender solo de la zona lumbar
      - Moverse demasiado rápido y sacrificar la técnica
      - Contener la respiración durante el ejercicio

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden levantar solo los brazos o solo las piernas hasta ganar fuerza
      - Reduce el rango de movimiento si sientes molestias en la zona lumbar
      - Variante avanzada: mantén la posición alta durante 3-5 segundos para mayor intensidad
      - Progresa al superman alterno (brazo y pierna opuestos) como variación
