  Hip Thrust (Barbell):
    name: Hip thrust (barra)
    instructions: |
      ## Resumen
      El hip thrust con barra es un ejercicio de aislamiento que trabaja principalmente los glúteos. También involucra los isquiotibiales y la zona lumbar, y utiliza una extensión horizontal de cadera con barra para desarrollar una gran fuerza y masa muscular en los glúteos.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en el suelo con la parte alta de la espalda apoyada en un banco
      - Rueda la barra sobre tus piernas y colócala sobre las caderas
      - Usa una almohadilla o una toalla para mayor comodidad si lo necesitas
      - Apoya los pies planos en el suelo, separados al ancho de las caderas
      - Mantén los hombros sobre el banco y el core activado

      ### 2. Movimiento
      1. Empuja con los talones para elevar las caderas y la barra
      2. Extiende las caderas hasta que el cuerpo forme una línea recta de los hombros a las rodillas
      3. Mantén la barbilla recogida y evita hiperextender la zona lumbar
      4. Aprieta los glúteos con fuerza en la parte alta del movimiento
      5. Baja lentamente las caderas con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar las caderas
      - Exhala al empujar las caderas hacia arriba

      ### 4. Consejos
      - Concéntrate en apretar los glúteos arriba, no en arquear la espalda
      - Mantén las costillas abajo y el core activado para evitar la hiperextensión
      - Empuja con los talones, no con las puntas de los pies
      - Mantén la barbilla recogida durante todo el movimiento
      - Coloca la barra en el pliegue de las caderas para una palanca óptima

      ### 5. Errores comunes
      - Hiperextender la zona lumbar arriba en lugar de usar los glúteos
      - Colocar los pies demasiado cerca o demasiado lejos del cuerpo
      - No lograr la extensión completa de cadera arriba
      - Arquear el cuello para mirar hacia arriba durante el movimiento
      - Usar impulso en lugar de una contracción controlada de los glúteos
      - No usar almohadilla, lo que causa molestias y distrae

      ### 6. Seguridad y modificaciones
      - Empieza con hip thrusts con el peso corporal para dominar el patrón de movimiento
      - Usa una almohadilla para barra o una toalla para proteger las caderas
      - Coloca una banda alrededor de las rodillas para aumentar la activación de los glúteos
      - Variación avanzada: realiza hip thrusts con barra a una pierna o añade una pausa arriba
    validated: false
