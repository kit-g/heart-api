  Romanian Deadlift (Dumbbell):
    name: Peso muerto rumano (mancuernas)
    instructions: |
      ## Resumen
      El peso muerto rumano con mancuernas es un ejercicio de bisagra de cadera que trabaja principalmente los isquiotibiales, los glúteos y los erectores espinales. También activa los dorsales y los trapecios como estabilizadores, usando mancuernas para un movimiento independiente de los brazos y una posición de manos más natural, con énfasis en la fase excéntrica.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas sosteniendo una mancuerna en cada mano
      - Coloca las mancuernas frente a tus muslos con las palmas mirando hacia tu cuerpo
      - Mantente erguido con el pecho arriba, los hombros atrás y el core activado
      - Mantén una ligera flexión de rodillas en todo momento

      ### 2. Movimiento
      1. Haz una bisagra de cadera empujando las caderas hacia atrás y bajando las mancuernas
      2. Mantén la espalda plana y las mancuernas cerca de las piernas
      3. Baja hasta sentir un estiramiento en los isquiotibiales, normalmente a media espinilla
      4. Mantén una ligera flexión de rodillas durante todo el movimiento
      5. Lleva las caderas hacia delante para volver a la posición inicial
      6. Aprieta los glúteos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar las mancuernas
      - Exhala al llevar las caderas hacia delante para incorporarte

      ### 4. Consejos
      - Concéntrate en la bisagra de cadera, no en hacer una sentadilla ni en flexionar las rodillas
      - Mantén la espalda plana y el pecho erguido en todo momento
      - Empuja las caderas hacia atrás tanto como puedas
      - Mantén las mancuernas cerca de las piernas durante todo el movimiento
      - Siente el estiramiento en los isquiotibiales en la parte baja

      ### 5. Errores comunes
      - Redondear la espalda en lugar de mantener la columna plana
      - Flexionar demasiado las rodillas, convirtiéndolo en una sentadilla
      - No empujar las caderas lo suficientemente atrás
      - Bajar las mancuernas más allá del punto de estiramiento de los isquiotibiales
      - Usar demasiado peso y comprometer la técnica
      - Mirar hacia arriba en lugar de mantener el cuello en posición neutra

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas ligeras para dominar el patrón de bisagra de cadera
      - Mantén una ligera flexión de rodillas para proteger los isquiotibiales
      - La variante con mancuernas permite un agarre más natural que la barra
      - Si sientes molestias en la zona lumbar, reduce el peso y asegúrate de mantener una técnica correcta
