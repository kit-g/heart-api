  Lateral Box Jump:
    name: Salto lateral al cajón
    instructions: |
      ## Resumen
      El salto lateral al cajón es un ejercicio pliométrico que trabaja principalmente los cuádriceps, los glúteos y las pantorrillas. También activa los abductores de cadera y los estabilizadores del core, mediante saltos laterales explosivos para desarrollar potencia del tren inferior, coordinación y capacidad atlética lateral.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie junto a un cajón o plataforma estable con los pies separados al ancho de las caderas
      - Colócate a unos 30 cm del cajón
      - Mantén el pecho erguido y el core activado
      - Flexiona ligeramente las rodillas y prepárate para un salto lateral
      - Mantén los brazos listos para generar impulso

      ### 2. Movimiento
      1. Balancea los brazos y salta lateralmente de forma explosiva sobre el cajón
      2. Aterriza suavemente sobre el cajón con ambos pies a la vez
      3. Absorbe el impacto aterrizando en una posición de media sentadilla
      4. Ponte de pie por completo encima del cajón
      5. Baja con un paso por el lado opuesto del cajón
      6. Salta de inmediato lateralmente de vuelta al lado inicial y repite

      ### 3. Respiración
      - Inhala durante la fase de preparación
      - Exhala de forma explosiva al saltar

      ### 4. Consejos
      - Concéntrate en la potencia lateral explosiva de las piernas
      - Aterriza suavemente con las rodillas flexionadas para absorber el impacto
      - Mantén el pecho erguido y la vista en el cajón
      - Usa los brazos para generar impulso lateral
      - Empieza con un cajón bajo y progresa gradualmente

      ### 5. Errores comunes
      - Aterrizar con las piernas rectas, lo que aumenta el riesgo de lesión
      - Usar un cajón demasiado alto para tu nivel actual
      - No aterrizar con ambos pies a la vez
      - Bajar del cajón saltando en lugar de dar un paso
      - Perder el equilibrio durante el salto lateral
      - Apresurar las repeticiones sin un reinicio adecuado entre saltos

      ### 6. Seguridad y modificaciones
      - Empieza con un cajón bajo y estable (12-18 pulgadas) para dominar la técnica
      - Asegúrate de que el cajón sea estable y no resbale ni vuelque
      - Practica saltos laterales en el suelo antes de añadir la altura del cajón
      - Variante avanzada: aumenta la altura del cajón o realiza saltos laterales continuos sin pausa
