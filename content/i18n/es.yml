  Lat Pulldown (Single Arm):
    name: Jalón al pecho a una mano
    instructions: |
      ## Resumen
      El jalón al pecho a una mano es un ejercicio de tracción unilateral que trabaja principalmente el dorsal ancho. También involucra los romboides, el trapecio medio y los estabilizadores del core, y usa el movimiento independiente de cada brazo para corregir desequilibrios de fuerza y mejorar el desarrollo general de la espalda.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la estación de jalón con los muslos sujetos bajo los soportes
      - Coloca un asa individual en la polea alta
      - Sujeta el asa con una mano, con agarre prono o neutro
      - Extiende el brazo por completo por encima de la cabeza manteniendo la tensión
      - Mantén el torso erguido y el core activado

      ### 2. Movimiento
      1. Tira del asa hacia el hombro llevando el codo hacia abajo y atrás
      2. Mantén el torso estable y evita rotar en exceso
      3. Continúa hasta que el asa llegue al hombro o a la parte alta del pecho
      4. Lleva la escápula hacia abajo y atrás en la parte baja
      5. Devuelve el asa lentamente a la posición inicial con control
      6. Completa todas las repeticiones de un lado y repite con el otro

      ### 3. Respiración
      - Exhala al tirar del asa hacia abajo
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén el torso estable y minimiza la rotación
      - Guía el movimiento con el codo, llevándolo hacia abajo y atrás
      - Concéntrate en llevar la escápula hacia la columna
      - Mantén la tensión constante durante todo el movimiento
      - Controla el peso en ambas direcciones

      ### 5. Errores comunes
      - Rotar el torso en exceso en lugar de estabilizarlo
      - Usar impulso para bajar el peso
      - No completar el rango completo de movimiento
      - Encoger el hombro hacia arriba
      - Dejar que las placas se apoyen entre repeticiones
      - No hacer el mismo número de repeticiones con cada lado

      ### 6. Seguridad y modificaciones
      - Empieza con menos peso que en el jalón bilateral
      - Apoya la mano libre en la máquina para mayor estabilidad
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte baja de cada repetición
      - Asegura el mismo número de repeticiones y atención en ambos lados para un desarrollo equilibrado
