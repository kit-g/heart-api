  Glute Ham Raise:
    name: Elevación glúteo-femoral (GHR)
    instructions: |
      ## Resumen
      La elevación glúteo-femoral (GHR) es un ejercicio avanzado con el peso corporal que trabaja principalmente los isquiotibiales y los glúteos. También involucra la zona lumbar y las pantorrillas, y utiliza la contracción excéntrica y concéntrica de los isquiotibiales para desarrollar fuerza en la cadena posterior y prevenir lesiones.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate boca abajo en una máquina de elevación glúteo-femoral
      - Fija los tobillos bajo las almohadillas, con los muslos sobre el soporte
      - Empieza con el torso erguido y perpendicular al suelo
      - Cruza los brazos sobre el pecho o mantén las manos al frente
      - Mantén activados el core y los glúteos en todo momento

      ### 2. Movimiento
      1. Baja lentamente el torso hacia delante extendiendo las rodillas
      2. Mantén el cuerpo recto desde las rodillas hasta la cabeza mientras desciendes
      3. Controla el descenso con los isquiotibiales y los glúteos
      4. Baja hasta que el torso quede casi paralelo al suelo
      5. Vuelve a la posición inicial tirando con los isquiotibiales
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar el torso hacia delante
      - Exhala al volver a la posición inicial

      ### 4. Consejos
      - Concéntrate en controlar la fase excéntrica (de bajada)
      - Mantén el cuerpo en línea recta en todo momento
      - Usa los isquiotibiales y los glúteos, no el impulso
      - Empieza con un rango parcial si las repeticiones completas son demasiado difíciles
      - Este ejercicio desarrolla una fuerza considerable en los isquiotibiales

      ### 5. Errores comunes
      - Flexionar las caderas en lugar de mantener el cuerpo recto
      - Dejarse caer demasiado rápido en la fase excéntrica
      - Usar impulso para volver a subir
      - No mantener los glúteos activados en todo momento
      - Arquear la zona lumbar en exceso
      - Intentar el rango completo antes de tener la fuerza suficiente

      ### 6. Seguridad y modificaciones
      - Usa una banda como asistencia si lo necesitas
      - Empieza con repeticiones solo excéntricas (baja y vuelve a colocarte)
      - Empuja el suelo con las manos para ayudarte a volver a la posición inicial
      - Variación avanzada: sujeta un disco contra el pecho para añadir resistencia
