      5. Detente justo antes de perder la tensión de las poleas
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras empujas los agarres hacia arriba
      - Inhala mientras los bajas

      ### 4. Consejos
      - Mantén tensión constante sin soltar el peso por completo
      - Mantén el core firme para evitar arquear la zona lumbar
      - Concéntrate en empujar en línea recta hacia arriba, no hacia adelante
      - Controla tanto la fase de empuje como la de bajada
      - Las poleas proporcionan una resistencia uniforme en todo el recorrido

      ### 5. Errores comunes
      - Soltar toda la tensión en la parte baja
      - Arquear la zona lumbar en exceso durante el empuje
      - Empujar hacia adelante en lugar de en línea recta hacia arriba
      - No alcanzar la extensión completa arriba
      - Usar impulso en lugar de un movimiento controlado
      - Dejar que la placa del peso descanse entre repeticiones

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón de empuje en polea
      - Realízalo con un brazo a la vez para un trabajo unilateral
      - Ajusta la altura y el ángulo de la polea según necesites
      - Si sientes molestias en el hombro, reduce el peso o revisa tu técnica
