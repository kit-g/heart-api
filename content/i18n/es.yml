  Triceps Extension:
    name: Extensión de tríceps
    instructions: |
      ## Resumen
      La extensión de tríceps con barra es un ejercicio de aislamiento que trabaja principalmente las tres cabezas del tríceps. También involucra los hombros y el core como estabilizadores, usando una posición por encima de la cabeza para maximizar el estiramiento y la contracción del tríceps durante todo el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de pie con los pies separados al ancho de los hombros o siéntate en un banco con respaldo
      - Sostén una barra con agarre prono estrecho
      - Empuja la barra por encima de la cabeza hasta extender los brazos por completo
      - Mantén los codos apuntando hacia delante y cerca de la cabeza
      - Activa el core para mayor estabilidad

      ### 2. Movimiento
      1. Baja la barra por detrás de la cabeza flexionando los codos
      2. Mantén la parte superior de los brazos inmóvil y vertical en todo momento
      3. Baja hasta sentir un estiramiento profundo en los tríceps
      4. Haz una pausa breve en la posición baja
      5. Extiende los codos para llevar la barra de vuelta a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la barra por detrás de la cabeza
      - Exhala al subir la barra

      ### 4. Consejos
      - Mantén la parte superior de los brazos inmóvil y vertical en todo momento
      - Mantén los codos tan juntos como te resulte cómodo
      - Evita arquear la zona lumbar durante el movimiento
      - Concéntrate en el estiramiento abajo y en apretar arriba
      - Controla el peso durante todo el rango de movimiento

      ### 5. Errores comunes
      - Dejar que los codos se abran en exceso
      - Mover la parte superior de los brazos en lugar de mantenerla inmóvil
      - Arquear la zona lumbar en exceso
      - Usar demasiado peso y comprometer la técnica
      - No completar el rango completo de movimiento
      - Inclinarse hacia delante o hacia atrás durante el movimiento

      ### 6. Seguridad y modificaciones
      - Usa una barra EZ si sientes molestias en las muñecas o los codos
      - Empieza con poco peso para dominar la posición por encima de la cabeza
      - Realízalo sentado con respaldo para mayor estabilidad
      - Variante avanzada: realízalo de pie para involucrar más el core
