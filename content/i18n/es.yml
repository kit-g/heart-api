  Face Pull (Cable):
    name: Face pull (polea)
    instructions: |
      ## Resumen
      El face pull en polea es un ejercicio de aislamiento que trabaja principalmente los deltoides posteriores y la parte alta de la espalda. También involucra los romboides y el trapecio medio, usando un accesorio de cuerda para mejorar la salud del hombro, la postura y el desarrollo del deltoides posterior.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca una cuerda en una polea a la altura de la parte alta del pecho
      - Ponte de pie frente a la polea con los pies separados al ancho de los hombros
      - Sujeta la cuerda con ambas manos usando un agarre neutro
      - Da un paso atrás para crear tensión en la polea
      - Mantén el pecho erguido y el core activado

      ### 2. Movimiento
      1. Tira de la cuerda hacia tu cara llevando los codos hacia atrás y hacia afuera
      2. Separa los extremos de la cuerda mientras tiras, llevándolos más allá de las orejas
      3. Concéntrate en juntar las escápulas
      4. Continúa hasta que las manos queden junto a las orejas
      5. Haz una pausa y contrae los deltoides posteriores y la parte alta de la espalda
      6. Vuelve lentamente a la posición inicial con control y repite

      ### 3. Respiración
      - Exhala mientras tiras de la cuerda hacia tu cara
      - Inhala mientras vuelves a la posición inicial

      ### 4. Consejos
      - Concéntrate en tirar con los deltoides posteriores y la parte alta de la espalda, no con los brazos
      - Mantén los codos altos y abiertos durante el tirón
      - Separa los extremos de la cuerda para maximizar la contracción del deltoides posterior
      - Mantén tensión constante en la polea en todo momento
      - Este ejercicio es excelente para la salud del hombro y la postura

      ### 5. Errores comunes
      - Tirar demasiado bajo, hacia el pecho en lugar de la cara
      - No separar los extremos de la cuerda al final
      - Usar impulso o tirar del peso con sacudidas
      - Dejar caer los codos durante el tirón
      - Usar demasiado peso y comprometer la técnica
      - No juntar las escápulas

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón de movimiento
      - Ajusta la altura de la polea entre la parte alta del pecho y el nivel de la cara
      - Realízalo con una banda si no tienes poleas disponibles
      - Prioriza las repeticiones controladas y la buena técnica sobre el peso elevado
