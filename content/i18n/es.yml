      - La posición sentada enfatiza el músculo sóleo
      - Logra un rango completo de movimiento, del estiramiento profundo a la contracción alta
      - Concéntrate en apretar las pantorrillas arriba
      - Usa una toalla o almohadilla bajo el peso para mayor comodidad

      ### 5. Errores comunes
      - No lograr el rango completo de movimiento arriba o abajo
      - Rebotar abajo en lugar de estirar con control
      - Usar demasiado peso y comprometer la técnica
      - Hacer las repeticiones demasiado rápido
      - No apretar en la contracción máxima
      - Dejar que el peso se desplace o pierda estabilidad

      ### 6. Seguridad y modificaciones
      - Usa una almohadilla o toalla bajo el peso para la comodidad de los muslos
      - Empieza con poco peso para establecer una técnica correcta
      - Varía la posición de los pies (neutra, puntas hacia dentro, puntas hacia fuera) para un desarrollo completo de las pantorrillas
      - Variante avanzada: haz una pausa de 2-3 segundos en la contracción máxima
