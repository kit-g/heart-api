  Cross Body Crunch:
    name: Crunch cruzado
    instructions: |
      ## Resumen
      El crunch cruzado es un ejercicio rotacional de core que trabaja principalmente los oblicuos y el recto abdominal. También involucra los flexores de cadera y el transverso abdominal al llevar el codo hacia la rodilla contraria, por lo que resulta eficaz para desarrollar fuerza rotacional del core.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba sobre una colchoneta con las rodillas flexionadas y los pies apoyados en el suelo
      - Coloca las manos suavemente detrás de la cabeza con los codos apuntando hacia los lados
      - Despega ligeramente los hombros de la colchoneta y activa el core
      - Mantén la zona lumbar presionada contra la colchoneta durante todo el movimiento

      ### 2. Movimiento
      1. Levanta el hombro derecho de la colchoneta mientras llevas la rodilla izquierda hacia el pecho
      2. Rota el torso para llevar el codo derecho hacia la rodilla izquierda
      3. Concéntrate en rotar todo el torso, no solo en mover el codo
      4. Haz una breve pausa cuando el codo y la rodilla se acerquen
      5. Baja a la posición inicial con control
      6. Repite hacia el otro lado, llevando el codo izquierdo hacia la rodilla derecha
      7. Continúa alternando lados durante el número deseado de repeticiones

      ### 3. Respiración
      - Exhala mientras haces el crunch y rotas hacia la rodilla
      - Inhala mientras regresas a la posición inicial

      ### 4. Consejos
      - Mantén el cuello relajado y evita tirar de la cabeza con las manos
      - Inicia el movimiento desde el core, no desde los brazos
      - Mantén tensión constante en los abdominales durante todo el movimiento
      - Mantén la zona lumbar presionada contra la colchoneta para proteger la columna
      - Muévete con control en lugar de velocidad para lograr la máxima efectividad

      ### 5. Errores comunes
      - Tirar del cuello o la cabeza en lugar de activar el core
      - Mover solo el codo en lugar de rotar todo el torso
      - Dejar que la zona lumbar se arquee y se despegue de la colchoneta
      - Moverse demasiado rápido y perder la técnica correcta
      - Usar impulso en lugar de una contracción muscular controlada
      - No activar por completo los oblicuos durante el giro

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden mantener ambos pies en el suelo y hacer el giro sin elevar la rodilla
      - Variante avanzada: mantén la posición de contracción durante 2-3 segundos en cada lado
      - Si sientes molestias en el cuello, sostén la cabeza con una mano y estira la otra
      - Progresa reduciendo el tempo para aumentar el tiempo bajo tensión
