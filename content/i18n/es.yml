  Pistol Squat:
    name: Sentadilla pistol
    instructions: |
      ## Resumen
      La sentadilla pistol es un ejercicio unilateral avanzado de tren inferior que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También activa el core, los flexores de cadera y los estabilizadores del equilibrio, usando una sentadilla a una pierna hasta profundidad completa para desarrollar una fuerza de piernas, movilidad y equilibrio excepcionales.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie sobre una pierna con la otra extendida recta frente a ti
      - Mantén el pecho erguido, el core activado y los brazos extendidos al frente para equilibrarte
      - Mantén una buena postura y fija la mirada en un punto al frente

      ### 2. Movimiento
      1. Baja flexionando la rodilla y la cadera de la pierna de apoyo
      2. Mantén la pierna extendida recta y paralela al suelo
      3. Continúa descendiendo tan bajo como puedas manteniendo el equilibrio
      4. Mantén el talón en el suelo y el pecho erguido
      5. Empuja con el talón para volver a la posición de pie
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Inhala al bajar
      - Exhala al empujar de vuelta a la posición de pie

      ### 4. Consejos
      - Este ejercicio requiere una fuerza, movilidad y equilibrio considerables
      - Mantén el pecho erguido y el core firme en todo momento
      - La pierna extendida debe permanecer recta y sin tocar el suelo
      - Concéntrate en un movimiento controlado en ambas direcciones
      - Usa los brazos como contrapeso

      ### 5. Errores comunes
      - No lograr la profundidad adecuada por limitaciones de movilidad
      - Dejar que la rodilla se meta hacia dentro
      - Perder el equilibrio y apoyar la pierna extendida
      - Redondear la espalda o inclinarse demasiado hacia delante
      - No mantener recta la pierna extendida
      - Intentar sentadillas pistol antes de desarrollar la fuerza suficiente

      ### 6. Seguridad y modificaciones
      - Progresa hacia la sentadilla pistol con variantes asistidas primero
      - Sujétate de un apoyo para ayudarte con el equilibrio
      - Realiza sentadillas pistol al cajón (sentándote hacia atrás sobre un cajón)
      - Empieza con sentadillas pistol elevadas (de pie sobre un escalón)
      - Si sientes molestias en la rodilla, mejora tu movilidad antes de progresar
