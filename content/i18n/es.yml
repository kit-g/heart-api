  Squat (Bodyweight):
    name: Sentadilla (peso corporal)
    instructions: |
      ## Resumen
      La sentadilla con peso corporal es un ejercicio compuesto fundamental que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También involucra el core y la zona lumbar, usando solo el peso del cuerpo para construir fuerza básica del tren inferior, movilidad y buenos patrones de movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros
      - Mantén el pecho erguido, el core activado y la mirada al frente
      - Coloca los brazos extendidos al frente o a los lados
      - Mantén una buena postura durante todo el ejercicio

      ### 2. Movimiento
      1. Inicia la sentadilla flexionando las rodillas y las caderas al mismo tiempo
      2. Mantén el pecho erguido y el peso sobre los talones
      3. Baja hasta que los muslos queden al menos paralelos al suelo
      4. Haz una breve pausa en la posición más baja
      5. Empuja con los talones para volver a la posición de pie
      6. Extiende por completo las caderas y las rodillas arriba y repite

      ### 3. Respiración
      - Inhala mientras bajas a la sentadilla
      - Exhala mientras empujas para volver a ponerte de pie

      ### 4. Consejos
      - Mantén las rodillas alineadas con la punta de los pies
      - Conserva el torso erguido durante todo el movimiento
      - Empuja con todo el pie, no solo con la punta
      - Concéntrate en un movimiento controlado en ambas direcciones
      - Busca una profundidad en la que los muslos queden paralelos o más abajo

      ### 5. Errores comunes
      - Dejar que las rodillas se vayan hacia adentro
      - No alcanzar la profundidad adecuada
      - Levantarte sobre la punta de los pies en lugar de mantener el peso en los talones
      - Redondear la espalda durante el descenso
      - Usar impulso en lugar de un movimiento controlado
      - Dejar que las rodillas sobrepasen en exceso la punta de los pies

      ### 6. Seguridad y modificaciones
      - Empieza con sentadillas parciales y aumenta la profundidad de forma gradual a medida que mejora tu movilidad
      - Sujétate de un apoyo para mantener el equilibrio al principio
      - Coloca un cajón detrás de ti para practicar una profundidad constante
      - Variante avanzada: agrega sentadillas con salto, sentadillas pistol o progresa a sentadillas con peso
