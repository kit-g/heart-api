      - Sujeta la barra con las manos algo más abiertas que el ancho de los hombros
      - Mantén una buena postura en todo momento

      ### 2. Movimiento
      1. Da un paso largo hacia delante con una pierna
      2. Baja las caderas flexionando ambas rodillas
      3. Continúa hasta que el muslo delantero quede paralelo al suelo
      4. Mantén la rodilla delantera alineada sobre el tobillo
      5. Empuja con el talón delantero para volver a la posición de pie
      6. Repite con la misma pierna o alterna las piernas según las repeticiones deseadas

      ### 3. Respiración
      - Inhala al dar el paso hacia delante y bajar
      - Exhala al empujar de vuelta a la posición de pie

      ### 4. Consejos
      - Mantén el torso erguido durante todo el movimiento
      - Asegúrate de que la rodilla delantera no sobrepase los dedos del pie
      - Empuja con el talón delantero, no con la punta
