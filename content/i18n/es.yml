      La zancada con barra es un ejercicio unilateral de tren inferior que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También activa el core y los músculos estabilizadores, usando una barra sobre la parte alta de la espalda para añadir resistencia mientras desafía el equilibrio y la coordinación.

