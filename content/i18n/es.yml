  Cable Pull Through:
    name: Tirón entre piernas en polea
    instructions: |
      ## Resumen
      El tirón entre piernas en polea es un ejercicio de bisagra de cadera que trabaja principalmente los glúteos y los isquiotibiales. También involucra la zona lumbar y el core, y utiliza una polea para ofrecer tensión constante durante todo el movimiento mientras enseña la mecánica correcta de la bisagra de cadera.

      ## Ejecución
      ### 1. Posición inicial
      - Sujeta un accesorio de cuerda a una polea baja
      - Colócate de espaldas a la polea con los pies separados al ancho de los hombros
      - Pasa las manos entre las piernas y agarra la cuerda con ambas manos
      - Da un paso hacia delante para crear tensión en la polea
      - Mantén el pecho erguido y el core activado

      ### 2. Movimiento
      1. Haz una bisagra de cadera empujando las caderas hacia atrás
      2. Deja que la polea lleve tus brazos entre las piernas
      3. Mantén la espalda plana y las rodillas ligeramente flexionadas
      4. Continúa hasta sentir un estiramiento en los isquiotibiales
      5. Empuja las caderas hacia delante de forma explosiva para volver a la posición de pie
      6. Aprieta los glúteos con fuerza arriba y repite

      ### 3. Respiración
      - Inhala al inclinarte hacia delante
      - Exhala al empujar las caderas hacia delante

      ### 4. Consejos
      - Concéntrate en el movimiento de bisagra de cadera, no en hacer una sentadilla
      - Empuja con los talones al incorporarte
      - Aprieta los glúteos con fuerza al final de cada repetición
      - Mantén constante la tensión de la polea en todo momento
      - Mantén la columna neutra y la espalda plana

      ### 5. Errores comunes
      - Hacer una sentadilla en lugar de una bisagra de cadera
      - Redondear la espalda durante el movimiento
      - No empujar las caderas lo suficiente hacia atrás
      - Usar demasiado peso y comprometer la técnica
      - No extender por completo las caderas arriba
      - Dejar que las rodillas se vayan hacia dentro

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón de bisagra de cadera
      - Mantén una ligera flexión de rodillas en todo momento
      - Usa este ejercicio para aprender la mecánica correcta del peso muerto
      - Variación avanzada: realiza el tirón entre piernas a una pierna
