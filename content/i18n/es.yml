  Shrug (Barbell):
    name: Encogimientos de hombros (barra)
    instructions: |
      ## Resumen
      El encogimiento de hombros con barra es un ejercicio de aislamiento que trabaja principalmente el trapecio superior. También involucra el elevador de la escápula y los romboides, usando una barra que permite cargas pesadas para construir trapecios gruesos y potentes y mejorar la estabilidad del hombro.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies al ancho de caderas sosteniendo una barra
      - Sujeta la barra con las manos un poco más abiertas que el ancho de hombros, con las palmas hacia tu cuerpo
      - Deja que la barra cuelgue con los brazos extendidos frente a tus muslos
      - Mantén los brazos rectos con una ligera flexión de codos
      - Mantente erguido con el pecho arriba y el core activado

      ### 2. Movimiento
      1. Eleva los hombros en línea recta hacia las orejas
      2. Mantén los brazos rectos durante todo el movimiento
      3. Encoge los hombros lo más alto posible, concentrándote en los trapecios
      4. Haz una pausa y contrae los trapecios arriba
      5. Baja lentamente los hombros de vuelta a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras encoges los hombros hacia arriba
      - Inhala mientras los bajas

      ### 4. Consejos
      - Concéntrate en mover los hombros en línea recta hacia arriba, sin rotarlos
      - Mantén los brazos rectos durante todo el movimiento
      - Contrae con fuerza los trapecios arriba en cada repetición
      - Evita usar impulso o dar tirones al peso
      - La barra permite cargar los trapecios con pesos elevados

      ### 5. Errores comunes
      - Rotar los hombros en lugar de encogerlos en línea recta hacia arriba
      - Flexionar los codos y convertirlo en un remo
      - Usar impulso o dar tirones al peso
      - No alcanzar el rango completo de movimiento
      - Encoger los hombros hacia adelante o hacia atrás en lugar de en línea recta hacia arriba
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Empieza con un peso moderado para dominar el encogimiento en línea recta hacia arriba
      - Usa correas de agarre si la fuerza de agarre te limita
      - Realiza encogimientos con la barra por detrás de la espalda como variante
      - Si sientes molestias en el cuello, reduce el peso y asegúrate de mantener una técnica correcta
