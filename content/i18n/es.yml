  Clean (Barbell):
    name: Cargada (barra)
    instructions: |
      ## Resumen
      La cargada con barra es un movimiento explosivo de halterofilia que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También involucra toda la cadena posterior, los trapecios y los hombros, usando una potente extensión de cadera y un tirón para llevar la barra del suelo a los hombros.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies al ancho de caderas, con la barra sobre el mediopié
      - Sujeta la barra justo por fuera de tus piernas con agarre de gancho
      - Haz bisagra de cadera y flexiona las rodillas para alcanzar la barra
      - Mantén la espalda plana, el pecho arriba y los hombros sobre la barra
      - Activa los dorsales y el core antes de tirar

      ### 2. Movimiento
      1. Empuja explosivamente con las piernas para despegar la barra del suelo
      2. Mantén la barra cerca de tu cuerpo mientras sube
      3. Extiende las caderas y las rodillas con potencia cuando la barra llegue a la mitad del muslo
      4. Métete debajo de la barra mientras sube
      5. Recibe la barra sobre los hombros en posición de sentadilla frontal
      6. Ponte de pie por completo para terminar la repetición

      ### 3. Respiración
      - Toma una respiración profunda antes de tirar
      - Mantén el aire durante el tirón y la recepción
      - Exhala después de ponerte de pie

      ### 4. Consejos
      - Este es un movimiento técnico avanzado que requiere supervisión de un entrenador
      - Concéntrate en la extensión explosiva de cadera en el momento justo
      - Mantén la trayectoria de la barra cerca de tu cuerpo en todo momento
      - Recibe la barra con los codos altos y hacia adelante
      - Domina el movimiento con poco peso antes de cargarlo

      ### 5. Errores comunes
      - Empezar con las caderas demasiado altas o demasiado bajas
      - Tirar con los brazos demasiado pronto en lugar de usar las piernas
      - Dejar que la barra se aleje del cuerpo
      - No extender por completo las caderas antes de meterse debajo
      - Recibir con los codos bajos o sin una recepción correcta
      - Intentar pesos elevados sin la técnica adecuada

      ### 6. Seguridad y modificaciones
      - Aprende con un entrenador cualificado de halterofilia
      - Domina la cargada en suspensión antes de las cargadas completas desde el suelo
      - Practica primero con un tubo de PVC o la barra sin discos
      - Usa discos de goma y una plataforma de levantamiento para soltar la barra con seguridad
