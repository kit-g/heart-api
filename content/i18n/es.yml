  Landmine Press:
    name: Press landmine
    instructions: |
      ## Resumen
      El press landmine es un ejercicio de empuje que trabaja principalmente los hombros, en especial los deltoides anteriores. Los tríceps, la parte superior del pecho y el core asisten, y el arco anclado de la barra lo convierte en una alternativa más amigable con los hombros que el press vertical por encima de la cabeza.

      ## Ejecución
      ### 1. Posición inicial
      - Ancla un extremo de la barra en un accesorio landmine o en una esquina
      - Ponte de pie frente a la barra con los pies separados al ancho de los hombros
      - Sujeta el extremo libre a la altura del hombro con ambas manos, o con una mano para la versión unilateral
      - Activa el core y mantén las costillas abajo

      ### 2. Movimiento
      1. Empuja la barra hacia arriba y adelante siguiendo su arco natural
      2. Continúa hasta que los brazos queden completamente extendidos
      3. Haz una breve pausa arriba
      4. Baja la barra hasta la altura del hombro con control
      5. Repite el número deseado de repeticiones controladas; si empujas con una mano, repite con el otro lado

      ### 3. Respiración
      - Exhala mientras empujas
      - Inhala mientras bajas

      ### 4. Consejos
      - Mantén todo el cuerpo firme; no dejes que la zona lumbar se arquee
      - Empuja siguiendo el arco de la barra en lugar de luchar contra él
      - Retrasa ligeramente un pie para una postura más sólida

      ### 5. Errores comunes
      - Arquear la espalda para terminar el empuje
      - Encoger el hombro hacia la oreja
      - Colocarse demasiado lejos o demasiado cerca del extremo anclado

      ### 6. Seguridad y modificaciones
      - Arrodíllate sobre una o ambas rodillas para excluir la parte inferior del cuerpo del movimiento
      - Empieza con la barra vacía; el extremo anclado ya reduce la carga
