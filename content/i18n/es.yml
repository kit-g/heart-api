  Split Jerk (Barbell):
    name: Envión con tijera (barra)
    instructions: |
      ## Resumen
      El envión con tijera es un movimiento de halterofilia que trabaja los hombros, los tríceps y las piernas. Consiste en impulsar la barra desde los hombros hasta por encima de la cabeza mientras separas los pies uno adelante y otro atrás, lo que aporta mayor estabilidad y permite más peso que los enviones de potencia.

      ## Ejecución
      ### 1. Posición inicial
      - Comienza con la barra apoyada sobre la parte delantera de los hombros
      - Ponte de pie con los pies separados al ancho de las caderas
      - Mantén los codos ligeramente adelantados y altos
      - Activa el core y mantén el torso erguido
      - Prepárate para una flexión de piernas (dip) controlada

      ### 2. Movimiento
      1. Haz el dip flexionando ligeramente las rodillas con el torso vertical
      2. Empuja explosivamente hacia arriba extendiendo las piernas
      3. Separa los pies uno adelante y otro atrás mientras presionas la barra sobre la cabeza
      4. Aterriza con la rodilla delantera flexionada y la pierna trasera extendida
      5. Bloquea los brazos con la barra estable por encima de la cabeza
      6. Recupera la posición llevando primero el pie delantero hacia atrás y luego el trasero hacia adelante

      ### 3. Respiración
      - Toma aire antes del dip
      - Mantén el aire durante el dip, el empuje y la tijera
      - Exhala una vez que la barra esté bloqueada y estable

      ### 4. Consejos
      - La posición en tijera aporta más estabilidad que otros enviones
      - El dip debe ser vertical, sin inclinarse hacia adelante
      - Empuja con agresividad con las piernas antes de que presionen los brazos
      - La espinilla delantera debe quedar vertical en la posición de recepción
      - Es la variante de envión más común en competición

      ### 5. Errores comunes
      - Hacer el dip hacia adelante en lugar de mantenerse vertical
      - No separar los pies lo suficiente
      - Presionar con los brazos antes de empujar con las piernas
      - Aterrizar con la rodilla delantera por delante de la punta del pie
      - Trayectoria de la barra deficiente durante el empuje
      - No bloquear por completo los brazos por encima de la cabeza

      ### 6. Seguridad y modificaciones
      - Requiere la enseñanza de un instructor cualificado de halterofilia
      - Practica primero el juego de pies de la tijera sin peso
      - Domina el envión de potencia antes de aprender el envión con tijera
      - Usa bloques para practicar la posición de recepción
