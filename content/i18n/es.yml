      ## Ejecución
      ### 1. Posición inicial
      - Pasa una banda por la parte alta de la espalda
      - Sujeta un extremo de la banda en cada mano
      - Comienza en posición de plancha alta con las manos un poco más abiertas que el ancho de los hombros
      - Coloca la banda bajo las palmas apoyadas en el suelo
      - Mantén el cuerpo en línea recta desde la cabeza hasta los talones

      ### 2. Movimiento
      1. Baja el cuerpo flexionando los codos contra la resistencia de la banda
      2. Mantén los codos a unos 45 grados respecto al cuerpo
      3. Continúa bajando hasta que el pecho casi toque el suelo
      4. Haz una breve pausa abajo
      5. Empuja con las palmas contra la resistencia de la banda para volver a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala mientras bajas el cuerpo
      - Exhala mientras empujas de vuelta a la posición inicial

      ### 4. Consejos
      - La banda ofrece más resistencia en la parte alta del movimiento
      - Mantén el cuerpo en línea recta desde la cabeza hasta los talones en todo momento
      - Mantén el core y los glúteos activados para evitar que las caderas caigan
      - Concéntrate en un movimiento controlado en ambas direcciones
      - Ajusta el grosor de la banda para modificar el nivel de resistencia

      ### 5. Errores comunes
      - Dejar que las caderas caigan o se eleven en pico
      - Abrir los codos en exceso
      - No lograr el rango completo de movimiento
      - Dejar que la banda se salga de su posición
      - Usar impulso en lugar de un movimiento controlado
      - Contener la respiración durante el movimiento

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar el movimiento
      - Realiza flexiones de rodillas con la banda si lo necesitas
      - Ajusta la tensión de la banda cambiando la posición de las manos o el grosor de la banda
      - Variación avanzada: usa una banda de mayor resistencia o añade una pausa en la posición baja
