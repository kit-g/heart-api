  Kneeling Pulldown (Band):
    name: Jalón de rodillas (banda)
    instructions: |
      ## Resumen
      El jalón de rodillas con banda es un ejercicio de tracción con resistencia elástica que trabaja principalmente el dorsal ancho. También involucra los romboides, el trapecio medio y los bíceps, y usa una posición de rodillas con bandas para ofrecer resistencia progresiva durante toda la tracción.

      ## Ejecución
      ### 1. Posición inicial
      - Ancla una banda por encima de la cabeza a un punto seguro
      - Arrodíllate en el suelo mirando hacia el punto de anclaje
      - Sujeta la banda con ambas manos, con los brazos extendidos por encima de la cabeza
      - Mantén el core activado y el torso erguido
      - Colócate lo bastante atrás para que la banda quede en tensión

      ### 2. Movimiento
      1. Tira de la banda hacia el pecho llevando los codos hacia abajo y atrás
      2. Mantén el torso erguido y el core activado en todo momento
      3. Continúa hasta que las manos lleguen a la altura del pecho o de los hombros
      4. Junta las escápulas en la parte baja
      5. Devuelve los brazos lentamente a la posición elevada con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al tirar de la banda hacia abajo
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén el torso erguido durante todo el movimiento
      - Guía el movimiento con los codos, llevándolos hacia abajo y atrás
      - Concéntrate en juntar las escápulas
      - Mantén la tensión constante en la banda
      - Controla la resistencia tanto en la fase de tracción como en la de retorno

      ### 5. Errores comunes
      - Inclinarse hacia atrás para usar el peso corporal en lugar de la espalda
      - No mantener la tensión constante en la banda
      - Usar impulso en lugar de un movimiento controlado
      - Encoger los hombros hacia arriba
      - No completar el rango completo de movimiento
      - Ejecutar las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar el patrón de movimiento
      - Ajusta la distancia al punto de anclaje para modificar la resistencia
      - Hazlo de pie si la posición de rodillas resulta incómoda
      - Variación avanzada: usa una banda de mayor resistencia o añade una pausa en la parte baja
