  Fire Hydrant:
    name: Hidrante
    instructions: |
      ## Resumen
      El hidrante es un ejercicio de aislamiento con peso corporal que trabaja principalmente el glúteo medio y el glúteo menor. También activa los abductores de cadera y los estabilizadores del core, mediante una elevación lateral de la pierna desde la posición de cuadrupedia para fortalecer la cadera externa y mejorar la estabilidad de la cadera.

      ## Ejecución
      ### 1. Posición inicial
      - Comienza en cuadrupedia con las manos directamente bajo los hombros
      - Coloca las rodillas directamente bajo las caderas
      - Mantén el core activado y la espalda plana
      - Mantén la columna neutra en todo momento
      - Mantén la cabeza alineada con la columna

      ### 2. Movimiento
      1. Eleva una rodilla hacia el lado manteniéndola flexionada a 90 grados
      2. Sube la pierna hasta que el muslo quede paralelo al suelo o tan alto como te resulte cómodo
      3. Mantén las caderas alineadas y evita rotar el torso
      4. Haz una pausa y aprieta el glúteo externo en la parte alta
      5. Baja lentamente la rodilla a la posición inicial con control
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Exhala al elevar la pierna hacia el lado
      - Inhala al bajar la pierna

      ### 4. Consejos
      - Mantén el core activado y la espalda plana en todo momento
      - Concéntrate en usar los músculos externos de la cadera para elevar la pierna
      - Mantén la rodilla flexionada a 90 grados
      - Evita rotar las caderas o el torso durante el movimiento
      - Mantén estables el brazo y la pierna de apoyo

      ### 5. Errores comunes
      - Rotar las caderas o el torso en lugar de mantenerlos alineados
      - Arquear o redondear la zona lumbar
      - Usar impulso en lugar de un movimiento controlado
      - No mantener la flexión de rodilla a 90 grados
      - Elevar la pierna demasiado alto y perder la técnica
      - Hacer las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Usa una colchoneta o acolchado bajo rodillas y manos para mayor comodidad
      - Añade tobilleras con peso o una banda para aumentar la dificultad
      - Realiza pequeños pulsos en la parte alta para intensificar el trabajo
      - Variante avanzada: mantén la posición 2-3 segundos en la parte alta de cada repetición
