  Seated Calf Raise (Machine):
    name: Elevación de talones sentado (máquina)
    instructions: |
      ## Resumen
      La elevación de talones sentado es un ejercicio de aislamiento que trabaja principalmente el sóleo de la pantorrilla. También activa el gastrocnemio, usando una posición sentada con las rodillas flexionadas para enfatizar el sóleo y lograr un desarrollo completo de las pantorrillas.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de elevación de talones con el apoyo descansando sobre la parte baja de tus muslos
      - Coloca la parte anterior de los pies en la plataforma con los talones por fuera
      - Ajusta la altura del apoyo para que descanse cómodamente sobre tus muslos
      - Libera la palanca de seguridad
      - Mantén las rodillas flexionadas a 90 grados en todo momento

      ### 2. Movimiento
      1. Baja los talones flexionando los tobillos tanto como puedas
      2. Permite un estiramiento completo de las pantorrillas abajo
      3. Haz una breve pausa en la posición de estiramiento
      4. Empuja con la parte anterior de los pies para elevar los talones lo más alto posible
      5. Aprieta con fuerza las pantorrillas arriba
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar los talones
      - Exhala al empujar hacia arriba sobre las puntas

      ### 4. Consejos
      - Mantén las rodillas inmóviles y flexionadas en todo momento
      - La posición sentada enfatiza el músculo sóleo
      - Logra un rango completo de movimiento, del estiramiento profundo a la contracción alta
      - Concéntrate en apretar las pantorrillas arriba
      - Controla el peso en ambas fases

      ### 5. Errores comunes
      - No lograr el rango completo de movimiento arriba o abajo
      - Rebotar abajo en lugar de estirar con control
      - Usar demasiado peso y comprometer la técnica
      - Hacer las repeticiones demasiado rápido
      - No apretar en la contracción máxima
      - Extender o mover las rodillas durante el movimiento

      ### 6. Seguridad y modificaciones
      - Ajusta la altura del apoyo para mayor comodidad y una posición correcta
      - Varía la posición de los pies (neutra, puntas hacia dentro, puntas hacia fuera) para un desarrollo completo de las pantorrillas
      - Combínalo con elevaciones de talones de pie para un entrenamiento integral de pantorrillas
      - Variante avanzada: haz una pausa de 2-3 segundos en la contracción máxima
