  Pull Up (Band):
    name: Dominadas (banda)
    instructions: |
      ## Resumen
      Las dominadas con banda son un ejercicio de tracción modificado que trabaja principalmente el dorsal ancho con ayuda elástica. También involucran los romboides, el trapecio medio y los bíceps, y usan bandas para ofrecer una asistencia variable durante el movimiento mientras construyes fuerza hacia las dominadas sin asistencia.

      ## Ejecución
      ### 1. Posición inicial
      - Pasa una banda por encima de la barra de dominadas
      - Introduce un extremo por el otro para fijarla a la barra
      - Sujeta la barra con agarre prono, con las manos algo más separadas que el ancho de hombros
      - Coloca una o ambas rodillas o pies en el lazo inferior de la banda
      - Cuélgate con los brazos completamente extendidos y los hombros activos

      ### 2. Movimiento
      1. Sube llevando los codos hacia abajo y atrás
      2. La banda te ayudará más en la parte baja y menos en la parte alta
      3. Continúa hasta que la barbilla supere la barra
      4. Mantén el core activado y el movimiento controlado
      5. Baja lentamente hasta la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir
      - Inhala al bajar

      ### 4. Consejos
      - Empieza con una banda más gruesa para tener más asistencia
      - Progresa gradualmente a bandas más finas a medida que ganes fuerza
      - Concéntrate en tirar con los músculos de la espalda, no solo con los brazos
      - Mantén los hombros abajo y atrás en todo momento
      - Controla tanto la fase de subida como la de bajada

      ### 5. Errores comunes
      - Usar una banda con demasiada asistencia
      - No completar el rango completo de movimiento
      - Encoger los hombros hacia arriba
      - Usar impulso o hacer kipping
      - No progresar gradualmente a bandas más ligeras
      - Tirar solo con los brazos sin activar la espalda

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de alta resistencia y progresa hacia otras más ligeras
      - Coloca ambos pies en la banda para máxima asistencia
      - Usa un solo pie para una asistencia moderada a medida que te fortalezcas
      - Combina las dominadas con banda con dominadas negativas para progresar más rápido
