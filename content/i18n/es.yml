  Seated Dip (Machine):
    name: Fondos sentado (máquina)
    instructions: |
      ## Resumen
      Los fondos sentado en máquina son un ejercicio de empuje que trabaja principalmente los tríceps. El pecho y la parte frontal de los hombros asisten, y la posición sentada y guiada te permite concentrarte en los brazos sin equilibrar todo el cuerpo como en unos fondos libres.

      ## Ejecución
      ### 1. Posición inicial
      - Ajusta el asiento de modo que las empuñaduras queden aproximadamente a la altura del pecho
      - Siéntate con la espalda firmemente apoyada en el respaldo
      - Sujeta las empuñaduras con las palmas enfrentadas y los codos flexionados
      - Apoya los pies planos en el suelo

      ### 2. Movimiento
      1. Empuja las empuñaduras hacia abajo estirando los brazos
      2. Continúa hasta extender por completo los brazos sin bloquear con fuerza los codos
      3. Haz una pausa breve y aprieta los tríceps
      4. Flexiona lentamente los codos para volver a la posición inicial
      5. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al empujar hacia abajo
      - Inhala al volver arriba

      ### 4. Consejos
      - Mantén la espalda y los hombros contra el respaldo
      - Mantén los codos cerca de los costados durante el recorrido
      - Controla el peso en la vuelta en lugar de dejarlo caer

      ### 5. Errores comunes
      - Encoger los hombros hacia las orejas
      - Usar impulso meciendo el torso
      - Dejar que las placas golpeen entre repeticiones

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para aprender la trayectoria de las empuñaduras
      - Acorta el rango de movimiento si sientes molestias en los hombros
      - Variante avanzada: añade una pausa en la extensión completa
