  Bench Press (Barbell):
    name: Press de banca (barra)
    instructions: |
      ## Resumen
      El press de banca con barra es un ejercicio compuesto del tren superior que trabaja principalmente el pectoral mayor. También involucra los deltoides frontales y los tríceps, lo que lo convierte en uno de los ejercicios más eficaces para desarrollar la fuerza general del pecho y la potencia de empuje del tren superior.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en un banco plano con los pies firmemente apoyados en el suelo
      - Colócate de modo que los ojos queden justo debajo de la barra
      - Sujeta la barra con las manos algo más separadas que el ancho de los hombros
      - Desengancha la barra y sostenla con los brazos completamente extendidos sobre el pecho
      - Mantén las escápulas retraídas y presionadas contra el banco

      ### 2. Movimiento
      1. Baja la barra lentamente hasta la parte media o baja del pecho
      2. Mantén los codos a unos 45 grados del cuerpo
      3. Toca ligeramente el pecho con la barra
      4. Haz una breve pausa abajo
      5. Empuja la barra hacia arriba extendiendo los brazos
      6. Extiende por completo los codos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la barra al pecho
      - Exhala al empujar la barra hacia arriba

      ### 4. Consejos
      - Mantén las escápulas retraídas durante todo el movimiento
      - Conserva el arco natural de la zona lumbar
      - Mantén los pies planos y empuja con ellos para ganar estabilidad
      - Controla el descenso y evita rebotar la barra en el pecho
      - Mantén las muñecas rectas y alineadas sobre los antebrazos

      ### 5. Errores comunes
      - Rebotar la barra en el pecho en lugar de tocar y empujar con control
      - Dejar que los codos se abran en exceso
      - Levantar los glúteos del banco durante el empuje
      - No completar el rango completo de movimiento
      - Usar demasiado peso y comprometer la técnica
      - No mantener las escápulas retraídas

      ### 6. Seguridad y modificaciones
      - Usa siempre un ayudante cuando levantes pesos altos
      - Empieza con poco peso para dominar la técnica correcta
      - Usa un agarre más amplio o más cerrado según tu comodidad y objetivos
      - Variante avanzada: añade cadenas o bandas para una resistencia acomodada
