  Curtsey Lunges (Barbell):
    name: Zancadas cruzadas (barra)
    instructions: |
      ## Resumen
      La zancada cruzada es un ejercicio unilateral del tren inferior que trabaja principalmente los glúteos, los cuádriceps y los abductores de cadera. También involucra el core y los estabilizadores, usando un paso diagonal hacia atrás para enfatizar los glúteos y la parte externa de las caderas.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas, sosteniendo mancuernas a los lados
      - Mantén el pecho erguido, el core activado y la mirada al frente
      - Mantén una buena postura durante todo el ejercicio

      ### 2. Movimiento
      1. Lleva una pierna hacia atrás y en diagonal por detrás de la otra, como en una reverencia
      2. Baja las caderas flexionando ambas rodillas
      3. Continúa hasta que el muslo delantero quede casi paralelo al suelo
      4. Mantén el pecho erguido y el torso vertical
      5. Empuja con el talón delantero para volver a la posición de pie
      6. Repite con la misma pierna o alterna las piernas según las repeticiones deseadas

      ### 3. Respiración
      - Inhala mientras das el paso atrás y bajas
      - Exhala mientras empujas para volver a ponerte de pie

      ### 4. Consejos
      - El paso en diagonal enfatiza los glúteos y la parte externa de las caderas
      - Mantén el torso erguido durante todo el movimiento
      - Concéntrate en el equilibrio y el control durante el paso cruzado por detrás
      - Empuja con el talón delantero para volver a la posición de pie
      - Deja que las mancuernas cuelguen de forma natural a los lados

      ### 5. Errores comunes
      - Inclinarte demasiado hacia adelante durante la zancada
      - Dejar que la rodilla delantera se vaya hacia adentro
      - No dar el paso suficientemente atrás y cruzado
      - No alcanzar la profundidad adecuada
      - Perder el equilibrio durante el paso en diagonal
      - Usar impulso en lugar de un movimiento controlado

      ### 6. Seguridad y modificaciones
      - Empieza con el peso corporal para dominar el paso en diagonal
      - Sujétate de un apoyo para mantener el equilibrio al principio
      - Usa mancuernas ligeras cuando empieces a añadir peso
      - Variante avanzada: aumenta el peso de las mancuernas o agrega un rebote corto abajo
