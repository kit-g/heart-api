  Sumo Deadlift High Pull (Barbell):
    name: Tirón alto sumo (barra)
    instructions: |
      ## Resumen
      El tirón alto sumo es un ejercicio compuesto de cuerpo completo que combina elementos de la halterofilia. Trabaja principalmente las piernas, los glúteos, los trapecios y los hombros, usando una postura sumo amplia con un tirón explosivo para desarrollar potencia y coordinación de todo el cuerpo.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies más separados que el ancho de los hombros y las puntas hacia afuera
      - Coloca la barra sobre el mediopié
      - Sujeta la barra con las manos por dentro de las piernas y los brazos rectos
      - Mantén la espalda plana, el pecho erguido y las caderas bajas
      - Activa el core y los dorsales antes de tirar

      ### 2. Movimiento
      1. Empuja explosivamente con las piernas para levantar la barra
      2. Extiende las caderas y las rodillas con potencia mientras la barra sube
      3. Una vez en extensión completa, tira de la barra hacia arriba con los codos altos
      4. Sigue tirando hasta que la barra llegue a la altura del pecho
      5. Baja la barra al suelo con control
      6. Recolócate y repite el número deseado de repeticiones explosivas

      ### 3. Respiración
      - Inhala antes de iniciar el levantamiento
      - Mantén el aire durante el tirón
      - Exhala mientras bajas la barra

      ### 4. Consejos
      - La postura amplia enfatiza las piernas y los glúteos
      - Explota en el levantamiento con máxima potencia
      - Guía el tirón alto con los codos
      - Este ejercicio combina el desarrollo de fuerza y potencia
      - Mantén la barra cerca del cuerpo en todo momento

      ### 5. Errores comunes
      - No abrir las caderas por completo antes de tirar
      - Tirar con los brazos antes de completar el empuje de piernas
      - Usar demasiado peso y perder velocidad explosiva
      - Redondear la espalda durante el tirón
      - No mantener los codos altos durante el tirón
      - Dejar que la barra se aleje del cuerpo

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el movimiento explosivo
      - Asegúrate de tener suficiente movilidad de cadera para la postura amplia
      - Domina el peso muerto sumo antes de añadir el tirón alto
      - Es un ejercicio excelente para CrossFit y entrenamiento funcional
