  Rowing (Machine):
    name: Máquina de remo
    instructions: |
      ## Resumen
      La máquina de remo es un ejercicio cardiovascular de cuerpo completo que trabaja las piernas, la espalda, el core y los brazos. Proporciona acondicionamiento aeróbico de bajo impacto mientras desarrolla fuerza y resistencia mediante un movimiento de remo que involucra aproximadamente el 85% de los músculos del cuerpo.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en el remo con los pies asegurados en las correas
      - Sujeta el mango con agarre prono
      - Comienza con las espinillas verticales y el cuerpo ligeramente inclinado hacia delante
      - Mantén la espalda recta y el core activado
      - Los brazos deben estar extendidos hacia el mango

      ### 2. Movimiento
      1. Empuja con las piernas para iniciar la fase de empuje
      2. Una vez extendidas las piernas, inclínate ligeramente hacia atrás y lleva el mango al pecho
      3. Invierte el movimiento: extiende los brazos, inclínate hacia delante y flexiona las rodillas
      4. Mantén un ritmo suave y continuo
      5. La fase de empuje debe ser potente; la recuperación, controlada
      6. Continúa remando durante el tiempo o la distancia deseados

      ### 3. Respiración
      - Exhala durante la fase de empuje (fase de potencia)
      - Inhala durante la recuperación

      ### 4. Consejos
      - La potencia proviene de las piernas (60%), el core (20%) y luego los brazos (20%)
      - Mantén una buena postura durante toda la remada
      - Mantén el mango moviéndose de forma suave y constante
      - Busca una cadencia constante (20-30 remadas por minuto)
      - Observa la pantalla para obtener información sobre ritmo y potencia

      ### 5. Errores comunes
      - Usar solo los brazos en lugar de las piernas para generar potencia
      - Redondear la espalda durante la remada
      - Tirar con los brazos flexionados antes de extender las piernas
      - Sujetar el mango con demasiada fuerza
      - Apresurar la fase de recuperación
      - Inclinarse demasiado hacia atrás al final del movimiento

      ### 6. Seguridad y modificaciones
      - Comienza con sesiones cortas para aprender la técnica correcta
      - Ajusta la posición de las correas de los pies para mayor comodidad
      - Reduce la resistencia (ajuste del damper) para sesiones más largas
      - Es un excelente cardio de cuerpo completo y bajo impacto
