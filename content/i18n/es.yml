  Knees to Elbows:
    name: Rodillas a los codos
    instructions: |
      ## Resumen
      Rodillas a los codos es un ejercicio avanzado de core en suspensión que trabaja principalmente todo el recto abdominal y los flexores de cadera. También involucra los oblicuos, el transverso abdominal, la fuerza de agarre y los estabilizadores del hombro, y requiere un control y una coordinación del core considerables.

      ## Ejecución
      ### 1. Posición inicial
      - Cuélgate de una barra de dominadas con las manos a la anchura de los hombros y agarre prono
      - Deja el cuerpo completamente extendido con los pies sin tocar el suelo
      - Activa el core y mantén los hombros hacia abajo y atrás
      - Minimiza el balanceo estabilizando el cuerpo
      - Mantén las piernas juntas durante todo el movimiento

      ### 2. Movimiento
      1. Eleva las rodillas hacia los codos contrayendo los abdominales
      2. Inclínate ligeramente hacia atrás y sube las rodillas lo más alto posible
      3. Intenta tocar o acercarte a los codos con las rodillas
      4. Mantén el movimiento controlado y evita el balanceo excesivo
      5. Haz una breve pausa en la parte alta del movimiento
      6. Baja lentamente las rodillas a la posición inicial con control
      7. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala con fuerza mientras elevas las rodillas hacia los codos
      - Inhala mientras bajas las rodillas a la posición inicial

      ### 4. Consejos
      - Concéntrate en llevar las rodillas hacia arriba y adelante, no solo hacia arriba
      - Permite una ligera inclinación hacia atrás para facilitar el contacto rodilla-codo
      - Mantén los hombros activos y evita colgarte de forma pasiva
      - Minimiza el balanceo manteniendo la tensión del core en todo momento
      - Piensa en enrollar todo el torso, no solo en subir las piernas

      ### 5. Errores comunes
      - Usar impulso excesivo y balancearse en lugar de una contracción controlada
      - No subir las rodillas lo suficiente para activar por completo el core
      - Dejar que los hombros se encojan hacia las orejas
      - Moverse demasiado rápido y perder el control
      - Aflojar la tensión del agarre, lo que compromete la técnica
      - No inclinarse ligeramente hacia atrás, lo que dificulta llegar a los codos

      ### 6. Seguridad y modificaciones
      - Domina la elevación de rodillas colgado antes de intentar esta variante avanzada
      - Usa correas de muñeca si el agarre es el factor limitante
      - Los principiantes pueden hacer el ejercicio en una silla romana como apoyo
      - Variante avanzada: añade un giro para llevar las rodillas alternadamente hacia el codo contrario
