exercises:
  Ab Wheel:
    name: Rueda abdominal
    instructions: |
      ## Resumen
      El rollout con rueda abdominal es un ejercicio de core exigente que trabaja principalmente el recto abdominal y el transverso abdominal. También involucra los oblicuos, los flexores de cadera y los hombros como estabilizadores durante todo el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Arrodíllate sobre una colchoneta con la rueda abdominal justo delante de ti
      - Sujeta firmemente las asas de la rueda con ambas manos, a la anchura de los hombros
      - Coloca los hombros directamente sobre la rueda
      - Mantén la espalda recta y el core activado
      - Mira hacia el suelo para mantener el cuello en posición neutra

      ### 2. Movimiento
      1. Rueda lentamente hacia adelante extendiendo los brazos y las caderas
      2. Mantén el core firme y evita que la zona lumbar se hunda
      3. Avanza tan lejos como puedas manteniendo el control y la espalda plana
      4. Haz una breve pausa en la posición de extensión completa
      5. Tira de la rueda de vuelta hacia las rodillas contrayendo los abdominales
      6. Regresa a la posición inicial con control

      ### 3. Respiración
      - Exhala mientras ruedas hacia adelante y extiendes el cuerpo
      - Inhala mientras llevas la rueda de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén tensión constante en el core durante todo el movimiento
      - Muévete despacio y con control; la velocidad reduce la efectividad
      - Concéntrate en usar los abdominales para volver, no los brazos
      - Mantén las caderas estables y evita arquear en exceso

      ### 5. Errores comunes
      - Dejar que la zona lumbar se hunda o se hiperextienda
      - Avanzar demasiado lejos antes de desarrollar la fuerza suficiente
      - Usar impulso en lugar de movimiento controlado
      - Dejar que las caderas se eleven en pico durante el regreso
      - Contener la respiración durante el movimiento

      ### 6. Seguridad y modificaciones
      - Empieza con rollouts parciales contra una pared para limitar el rango de movimiento
      - Practica desde las rodillas antes de intentarlo desde los pies
      - Si sientes molestias en la zona lumbar, reduce el rango de movimiento
      - Progresa a los rollouts de pie solo cuando domines la versión de rodillas
    validated: false
    source_digest: 88d0c5e76120
  Bicycle Crunch:
    name: Crunch bicicleta
    instructions: |
      ## Resumen
      El crunch bicicleta es un ejercicio dinámico de core que trabaja principalmente el recto abdominal y los oblicuos. También involucra los flexores de cadera y el transverso abdominal al coordinar el giro del torso con el movimiento alterno de las piernas.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba sobre una colchoneta con las rodillas flexionadas y los pies apoyados en el suelo
      - Coloca las manos suavemente detrás de la cabeza con los codos apuntando hacia los lados
      - Despega ligeramente los hombros de la colchoneta y activa el core
      - Levanta los pies del suelo con las rodillas flexionadas a 90 grados
      - Mantén la zona lumbar presionada contra la colchoneta

      ### 2. Movimiento
      1. Lleva simultáneamente el codo derecho hacia la rodilla izquierda mientras extiendes la pierna derecha
      2. Gira el torso para cruzar el hombro (no solo el codo) hacia el otro lado del cuerpo
      3. Haz una breve pausa cuando el codo y la rodilla se acerquen
      4. Regresa a la posición central con ambas rodillas flexionadas
      5. Repite hacia el otro lado, llevando el codo izquierdo hacia la rodilla derecha mientras extiendes la pierna izquierda
      6. Continúa alternando lados con un pedaleo suave y controlado

      ### 3. Respiración
      - Exhala mientras giras y llevas el codo hacia la rodilla
      - Inhala mientras regresas al centro y cambias de lado

      ### 4. Consejos
      - Concéntrate en rotar todo el torso, no solo en mover los codos
      - Mantén el cuello relajado y evita tirar de la cabeza con las manos
      - Mantén tensión constante en el core durante todo el movimiento
      - Muévete con control en lugar de velocidad para lograr la máxima efectividad
      - Mantén la zona lumbar presionada contra la colchoneta para proteger la columna

      ### 5. Errores comunes
      - Tirar del cuello o la cabeza en lugar de activar el core
      - Moverse demasiado rápido y perder la técnica correcta
      - Mover solo los codos en lugar de rotar el torso
      - Dejar que la zona lumbar se arquee y se despegue de la colchoneta
      - No extender por completo las piernas en cada repetición
      - Contener la respiración durante el movimiento

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden mantener los pies en el suelo y hacer el giro sin mover las piernas
      - Reduce el rango de movimiento si sientes molestias en el cuello o la zona lumbar
      - Progresa reduciendo el tempo para aumentar el tiempo bajo tensión
      - Variante avanzada: haz una pausa de 2-3 segundos en cada giro
