  Push Up (Knees):
    name: Flexiones de rodillas
    instructions: |
      ## Resumen
      Las flexiones de rodillas son un ejercicio de empuje con el peso corporal modificado que trabaja principalmente el pectoral mayor. También involucra los deltoides frontales, los tríceps y el core, y utiliza una posición de rodillas para reducir la carga y hacer el ejercicio más accesible para principiantes.

      ## Ejecución
      ### 1. Posición inicial
      - Comienza en posición de plancha alta y luego apoya las rodillas en el suelo
      - Coloca las manos un poco más abiertas que el ancho de los hombros
      - Mantén el cuerpo en línea recta desde la cabeza hasta las rodillas
      - Cruza los tobillos por detrás o mantenlos apoyados
      - Activa el core en todo momento

      ### 2. Movimiento
      1. Baja el cuerpo flexionando los codos
      2. Mantén los codos a unos 45 grados respecto al cuerpo
      3. Continúa bajando hasta que el pecho casi toque el suelo
      4. Haz una breve pausa abajo
      5. Empuja con las palmas para extender los brazos y volver a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala mientras bajas el cuerpo
      - Exhala mientras empujas de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén una línea recta desde la cabeza hasta las rodillas en todo momento
      - Mantén el core activado para evitar que las caderas caigan
      - Concéntrate en un movimiento controlado en ambas direcciones
      - Mantén el cuello neutro, mirando ligeramente por delante de las manos
      - Logra el rango completo de movimiento, desde el pecho cerca del suelo hasta los brazos completamente extendidos

      ### 5. Errores comunes
      - Dejar que las caderas caigan hacia abajo
      - Abrir los codos en exceso
      - No lograr el rango completo de movimiento
      - Dejar caer la cabeza o mirar hacia abajo
      - Usar impulso en lugar de un movimiento controlado
      - Colocar las rodillas demasiado adelante, reduciendo demasiado la dificultad

      ### 6. Seguridad y modificaciones
      - Usa una colchoneta o acolchado bajo las rodillas para mayor comodidad
      - Eleva las manos sobre un banco para una variante aún más fácil
      - Progresa a las flexiones estándar cuando puedas hacer 15-20 repeticiones controladas
      - Prueba distintas posiciones de manos para variar a medida que ganes fuerza
