  Hammer Curl (Band):
    name: Curl martillo (banda)
    instructions: |
      ## Resumen
      El curl martillo con banda es un ejercicio de aislamiento que trabaja principalmente el braquial y el braquiorradial. También involucra el bíceps braquial, usando un agarre neutro que enfatiza el desarrollo del antebrazo y la parte externa del bíceps con resistencia progresiva.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas, pisando el centro de una banda
      - Agarra cada extremo de la banda con las palmas enfrentadas (agarre neutro)
      - Deja los brazos colgando a los costados con una ligera tensión en la banda
      - Mantén los codos pegados a los costados en todo momento
      - Mantén una postura erguida con el core activado

      ### 2. Movimiento
      1. Sube la banda flexionando los codos y manteniendo las palmas enfrentadas
      2. Mantén los brazos quietos y fijos a los costados
      3. Continúa subiendo hasta que las manos lleguen a la altura de los hombros
      4. Haz una pausa y aprieta en la parte alta del movimiento
      5. Baja las manos lentamente a la posición inicial con control
      6. Repite durante el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir la banda
      - Inhala al bajar las manos

      ### 4. Consejos
      - Mantén el agarre neutro (martillo) durante todo el movimiento
      - Mantén los codos quietos y pegados al cuerpo
      - Evita balancearte o usar impulso para subir la banda
      - Concéntrate en el apretón en la parte alta de cada repetición
      - Controla la resistencia tanto en la fase de subida como en la de bajada

      ### 5. Errores comunes
      - Rotar las muñecas en lugar de mantener el agarre neutro
      - Dejar que los codos se desplacen hacia delante durante el curl
      - Usar impulso o balanceo del cuerpo para subir la banda
      - No completar el rango completo de movimiento
      - Perder la tensión de la banda abajo
      - Moverse demasiado rápido durante las repeticiones

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar el patrón de agarre neutro
      - Realiza curls martillo alternos (un brazo a la vez) para mayor concentración
      - Variante avanzada: usa una banda de mayor resistencia o haz una pausa arriba
      - Ajusta la posición de los pies sobre la banda para modificar el nivel de resistencia
