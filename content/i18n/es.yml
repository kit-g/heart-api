  High Row (Machine):
    name: Remo alto (máquina)
    instructions: |
      ## Resumen
      El remo alto en máquina es un ejercicio de tirón que trabaja principalmente la espalda, en especial los dorsales. Tirar desde una posición alta hacia abajo y atrás también trabaja los deltoides posteriores y los bíceps, mientras el cojín del pecho mantiene el torso apoyado en todo momento.

      ## Ejecución
      ### 1. Posición inicial
      - Ajusta el asiento para que las empuñaduras queden por encima de la altura de los hombros
      - Siéntate con el pecho firme contra el cojín
      - Estírate hacia arriba y sujeta las empuñaduras con ambas manos
      - Apoya los pies planos en el suelo

      ### 2. Movimiento
      1. Tira de las empuñaduras hacia abajo y atrás, hacia la parte superior del pecho
      2. Lleva los codos hacia abajo y por detrás de ti
      3. Junta las escápulas al final del tirón
      4. Regresa lentamente las empuñaduras a la posición inicial con control
      5. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al tirar
      - Inhala al volver

      ### 4. Consejos
      - Mantén el pecho contra el cojín durante toda la serie
      - Guía el tirón con los codos, no con las manos
      - Deja que los brazos se extiendan por completo entre repeticiones para trabajar el rango completo

      ### 5. Errores comunes
      - Inclinarse hacia atrás y tirar del peso con impulso
      - Tirar solo con los brazos, sin mover las escápulas
      - Dejar que la torre de pesas golpee entre repeticiones

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para encontrar la altura de asiento que se ajuste a tus brazos
      - Trabajar un brazo a la vez es una variación útil para igualar ambos lados
