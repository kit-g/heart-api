  Front Raise (Barbell):
    name: Elevaciones frontales (barra)
    instructions: |
      ## Resumen
      Las elevaciones frontales con barra son un ejercicio de aislamiento que trabaja principalmente los deltoides anteriores. También involucran la parte superior del pecho, usando una barra para ofrecer una resistencia bilateral estable con la que desarrollar fuerza y definición muscular en los hombros.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros sujetando una barra
      - Agarra la barra con las manos un poco más separadas que el ancho de los hombros, palmas hacia abajo
      - Coloca la barra frente a los muslos con los brazos rectos
      - Mantén el pecho erguido, el core activado y una buena postura
      - Mantén una ligera flexión de codos en todo momento

      ### 2. Movimiento
      1. Eleva la barra hacia adelante y hacia arriba frente a tu cuerpo
      2. Mantén los brazos rectos con solo una ligera flexión de codos
      3. Continúa elevando hasta que la barra llegue a la altura de los hombros
      4. Haz una breve pausa arriba
      5. Baja lentamente la barra hasta la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras elevas la barra
      - Inhala mientras la bajas

      ### 4. Consejos
      - Mantén el torso estable y evita usar impulso
      - Concéntrate en elevar con los deltoides anteriores, no con los brazos
      - Mantén una ligera flexión de codos en todo momento
      - Controla tanto la fase de subida como la de bajada
      - La barra permite manejar más carga que las mancuernas

      ### 5. Errores comunes
      - Usar impulso o balancear la barra
      - Inclinarse hacia atrás durante la elevación
      - Flexionar los codos en exceso
      - Elevar la barra demasiado por encima del nivel de los hombros
      - Usar demasiado peso y comprometer la técnica
      - No mantener tensión constante

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón de movimiento
      - Usa una barra EZ si la barra recta te causa molestias en las muñecas
      - Realízalo con mancuernas para un movimiento independiente de los brazos
      - Si sientes molestias en el hombro, reduce el peso o el rango de movimiento
