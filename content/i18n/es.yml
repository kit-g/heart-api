      - Mantén las escápulas retraídas y presionadas contra el banco
      - Extiende los brazos por completo con las mancuernas sobre el pecho

      ### 2. Movimiento
      1. Baja ambas mancuernas lentamente hacia el pecho doblando los codos
      2. Mantén los codos a unos 45 grados del cuerpo
      3. Baja hasta que las mancuernas queden junto al pecho
      4. Haz una breve pausa abajo
      5. Empuja las mancuernas hacia arriba extendiendo los brazos
      6. Junta las mancuernas arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar las mancuernas al pecho
      - Exhala al empujar las mancuernas hacia arriba

      ### 4. Consejos
      - Mantén las escápulas retraídas en todo momento
      - Conserva el arco natural de la zona lumbar
      - Controla el descenso para maximizar el estiramiento del pecho
