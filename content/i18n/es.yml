  Chest Fly (Band):
    name: Aperturas (banda)
    instructions: |
      ## Resumen
      Las aperturas con banda son un ejercicio de aislamiento con resistencia que trabaja principalmente el pectoral mayor. También involucran los deltoides frontales, y utilizan la resistencia progresiva de la banda para ofrecer una tensión creciente durante el movimiento de apertura.

      ## Ejecución
      ### 1. Posición inicial
      - Ancla una banda a la altura del pecho detrás de ti
      - Sujeta un extremo de la banda en cada mano
      - Da un paso al frente para crear tensión, con los brazos extendidos hacia los lados
      - Adopta una postura escalonada para mayor estabilidad
      - Mantén una ligera flexión de codos en todo momento

      ### 2. Movimiento
      1. Junta ambas manos frente al pecho
      2. Mantén los codos ligeramente flexionados, como en un abrazo
      3. Continúa hasta que las manos se junten a la altura del pecho
      4. Contrae con fuerza el pecho en el punto de máxima contracción
      5. Devuelve lentamente los brazos a la posición inicial con control
      6. Detente antes de perder la tensión de la banda y repite

      ### 3. Respiración
      - Exhala al juntar las manos
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén una flexión de codos constante durante todo el movimiento
      - Concéntrate en contraer el pecho, no en tirar con los brazos
      - Mantén la tensión constante controlando ambas fases
      - Mantén el core firme y el cuerpo estable
      - Ajusta tu distancia al punto de anclaje para modificar la resistencia

      ### 5. Errores comunes
      - Estirar por completo los brazos durante el movimiento
      - Usar impulso o balancear el cuerpo
      - No mantener la tensión constante en la banda
      - Inclinarse demasiado hacia delante
      - Moverse demasiado rápido y perder la contracción
      - Soltar toda la tensión en la posición inicial

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar el movimiento
      - Ajusta la distancia al punto de anclaje para modificar el nivel de resistencia
      - Trabaja un brazo a la vez para un enfoque unilateral
      - Variante avanzada: haz una pausa de 2 a 3 segundos en la máxima contracción
