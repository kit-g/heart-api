  Deficit Deadlift (Barbell):
    name: Peso muerto con déficit (barra)
    instructions: |
      ## Resumen
      El peso muerto con déficit con barra es un ejercicio compuesto avanzado que trabaja principalmente los glúteos, los isquiotibiales y los erectores espinales con un rango de movimiento ampliado. También involucra los cuádriceps más que el peso muerto estándar, y utiliza una plataforma elevada para aumentar la dificultad y fortalecer la posición inicial del levantamiento.

      ## Ejecución
      ### 1. Posición inicial
      - Súbete a una plataforma elevada de 1 a 3 pulgadas con los pies separados al ancho de las caderas
      - Coloca la barra sobre el mediopié, en el suelo
      - Agarra la barra justo por fuera de las piernas con agarre prono o mixto
      - Haz una bisagra de cadera y flexiona más las rodillas para alcanzar la barra
      - Mantén el pecho erguido, la espalda plana y los hombros ligeramente por delante de la barra

      ### 2. Movimiento
      1. Empuja con los talones y extiende caderas y rodillas al mismo tiempo
      2. Mantén la barra pegada al cuerpo mientras subes desde la posición más profunda
      3. Ponte de pie por completo extendiendo caderas y rodillas
      4. Mantén los hombros atrás y el pecho erguido arriba
      5. Baja la barra empujando las caderas hacia atrás y flexionando las rodillas
      6. Devuelve la barra al suelo con control y repite

      ### 3. Respiración
      - Inhala profundo y activa el core antes de levantar
      - Aguanta la respiración durante el levantamiento
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - El déficit aumenta el rango de movimiento y la dificultad
      - Mantén la barra pegada a las espinillas y los muslos en todo momento
      - Concéntrate en un empuje explosivo desde la posición más baja
      - Usa menos peso que en tu peso muerto estándar
      - Esta variante desarrolla fuerza en la parte más difícil del levantamiento

      ### 5. Errores comunes
      - Usar una plataforma demasiado alta para tu movilidad
      - Redondear la zona lumbar por el mayor rango de movimiento
      - Empezar con las caderas demasiado altas para compensar el déficit
      - Usar demasiado peso y comprometer la técnica
      - No mantener la trayectoria de la barra pegada al cuerpo
      - Perder la columna neutra en la posición más baja

      ### 6. Seguridad y modificaciones
      - Empieza con un déficit de 1 pulgada y progresa de forma gradual
      - Usa un 10-20% menos de peso que en tu peso muerto estándar
      - Asegúrate de tener la movilidad suficiente para el rango ampliado
      - Si sientes molestias en la zona lumbar, reduce la altura del déficit o el peso
