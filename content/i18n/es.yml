  Overhead Squat (Barbell):
    name: Sentadilla con barra sobre la cabeza
    instructions: |
      ## Resumen
      La sentadilla con barra sobre la cabeza es un ejercicio accesorio de halterofilia que trabaja los cuádriceps, los glúteos y todo el core. También requiere una movilidad y estabilidad de hombros considerables, desarrollando fuerza de cuerpo completo, equilibrio y la posición de recepción que se usa en los arranques.

      ## Ejecución
      ### 1. Posición inicial
      - Empieza con la barra por encima de la cabeza con un agarre amplio de arranque
      - Ponte de pie con los pies al ancho de hombros y las puntas ligeramente hacia afuera
      - Bloquea los brazos por completo con la barra sobre el mediopié
      - Mantén el pecho arriba, el core activado y la mirada al frente
      - Mantén los hombros activos empujando hacia arriba contra la barra

      ### 2. Movimiento
      1. Inicia la sentadilla flexionando las rodillas y las caderas a la vez
      2. Mantén la barra directamente sobre el mediopié mientras desciendes
      3. Conserva los brazos bloqueados y los hombros activos en todo momento
      4. Desciende hasta que los muslos queden al menos paralelos al suelo
      5. Empuja con los talones para volver a ponerte de pie
      6. Mantén la barra estable por encima de la cabeza en todo momento y repite

      ### 3. Respiración
      - Inhala antes de descender
      - Mantén el aire durante el descenso y la posición baja
      - Exhala mientras subes

      ### 4. Consejos
      - Este ejercicio requiere una excelente movilidad de hombros y caderas
      - La barra debe permanecer sobre el mediopié en todo momento
      - Mantén los brazos bloqueados y empuja constantemente hacia arriba contra la barra
      - Empieza con un tubo de PVC o la barra sin discos para aprender el movimiento
      - Desarrolla la posición de recepción para los arranques

      ### 5. Errores comunes
      - Dejar que los brazos se flexionen durante la sentadilla
      - Dejar que la barra se desplace hacia adelante o hacia atrás
      - No mantener los hombros activos empujando contra la barra
      - Movilidad insuficiente de cadera u hombro para una profundidad adecuada
      - Mirar hacia abajo en lugar de al frente
      - Intentarlo sin una preparación adecuada de movilidad

      ### 6. Seguridad y modificaciones
      - Domina el ejercicio con un tubo de PVC antes de añadir peso
      - Trabaja la movilidad de hombros y caderas por separado
      - Usa un asistente cuando estés aprendiendo con peso
      - Es una preparación esencial para el entrenamiento del arranque olímpico
