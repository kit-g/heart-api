  Pendlay Row (Barbell):
    name: Remo Pendlay (barra)
    instructions: |
      ## Resumen
      El remo Pendlay es un ejercicio explosivo de remo con barra que trabaja principalmente el dorsal ancho, los romboides y el trapecio medio. También involucra la zona lumbar y los isquiotibiales, y usa una parada completa en el suelo entre repeticiones para eliminar el impulso y maximizar el desarrollo de potencia.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies al ancho de caderas y la barra en el suelo sobre la mitad del pie
      - Inclínate desde la cadera hasta que el torso quede paralelo al suelo
      - Sujeta la barra con agarre prono, con las manos algo más separadas que el ancho de hombros
      - Mantén la espalda plana, el pecho mirando hacia abajo y los brazos completamente extendidos
      - Activa el core y los dorsales antes de cada repetición

      ### 2. Movimiento
      1. Tira de la barra de forma explosiva hacia la parte baja del pecho o la parte alta del abdomen
      2. Lleva los codos hacia atrás y arriba con un gesto potente
      3. Toca el torso con la barra en la parte alta del movimiento
      4. Junta las escápulas brevemente
      5. Baja la barra al suelo con control
      6. Deja que la barra quede completamente detenida en el suelo antes de empezar la siguiente repetición

      ### 3. Respiración
      - Inhala y activa el core antes de cada repetición
      - Exhala al tirar o al completar la repetición

      ### 4. Consejos
      - Mantén el torso paralelo al suelo en todo momento
      - Cada repetición debe partir de una parada completa en el suelo
      - Tira de forma explosiva sin perder el control
      - Mantén la espalda plana y el core firme
      - Concéntrate en generar la potencia con los músculos de la espalda

      ### 5. Errores comunes
      - No devolver la barra a una parada completa en el suelo
      - Levantar el torso durante la tracción en lugar de mantenerlo paralelo
      - Aprovechar el rebote de la barra contra el suelo
      - Redondear la espalda durante el movimiento
      - No subir la barra lo suficiente para tocar el torso
      - Moverse demasiado lento y perder el carácter explosivo

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la técnica de parada completa
      - Asegúrate de mantener la espalda plana para proteger la columna
      - Usa discos más pequeños sobre una plataforma si necesitas ajustar la altura inicial
      - Si notas molestias en la zona lumbar, reduce el peso y revisa tu técnica
