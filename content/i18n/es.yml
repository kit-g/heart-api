  Snatch (Barbell):
    name: Arranque (barra)
    instructions: |
      ## Resumen
      El arranque es un movimiento completo de halterofilia que trabaja todo el cuerpo. Requiere llevar la barra desde el suelo hasta quedar bloqueada por encima de la cabeza en un solo movimiento explosivo y continuo, y exige máxima potencia, velocidad, movilidad y precisión técnica.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas y la barra sobre el mediopié
      - Sujeta la barra con un agarre amplio de arranque (manos casi en los topes)
      - Haz bisagra de cadera y flexiona las rodillas para alcanzar la barra
      - Mantén la espalda plana, el pecho erguido y los hombros sobre la barra
      - Los brazos deben estar rectos y relajados

      ### 2. Movimiento
      1. Empuja explosivamente con las piernas para despegar la barra del suelo
      2. Mantén la barra cerca mientras sube por las piernas
      3. Extiende las caderas y las rodillas con potencia a la altura del medio muslo
      4. Tira de tu cuerpo hacia abajo, bajo la barra, mientras esta sube
      5. Recibe la barra por encima de la cabeza en sentadilla profunda con los brazos bloqueados
      6. Ponte de pie por completo con la barra en alto para completar el levantamiento

      ### 3. Respiración
      - Toma una respiración profunda antes de tirar
      - Mantén el aire durante el tirón, la recepción y la recuperación
      - Exhala después de ponerte de pie con la barra en alto

      ### 4. Consejos
      - Es el levantamiento más técnico de la halterofilia
      - El agarre amplio acorta la distancia del tirón
      - La velocidad y la técnica importan más que la fuerza
      - Cada fase debe ser perfecta para lograr un levantamiento exitoso
      - Requiere mucha práctica y la guía de un entrenador

      ### 5. Errores comunes
      - Usar una anchura de agarre incorrecta
      - Tirar con los brazos antes de completar el empuje de piernas
      - Empujar la barra hacia arriba en lugar de meterse debajo
      - Posición de recepción y equilibrio deficientes
      - Movilidad insuficiente para la sentadilla profunda con la barra sobre la cabeza
      - Intentarlo sin una base técnica adecuada

      ### 6. Seguridad y modificaciones
      - Requiere la enseñanza de un instructor cualificado de halterofilia
      - Domina todas las partes del movimiento antes de intentar arranques completos
      - Usa discos de rebote y una plataforma de levantamiento adecuada
      - Este levantamiento exige años de práctica para dominarse
