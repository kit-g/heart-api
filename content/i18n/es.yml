      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba sobre una colchoneta con las piernas completamente extendidas
      - Coloca las manos junto a las caderas o bajo los glúteos como apoyo
      - Presiona la zona lumbar contra la colchoneta y activa el core
      - Mantén la cabeza y los hombros relajados sobre la colchoneta
      - Apunta con los dedos de los pies y mantén las piernas rectas en todo momento

      ### 2. Movimiento
      1. Eleva ambas piernas hacia el techo contrayendo la parte baja del abdomen
      2. Mantén las piernas rectas y juntas mientras las subes
      3. Continúa hasta que las piernas queden perpendiculares al suelo o un poco más allá
      4. Mantén la zona lumbar presionada contra la colchoneta en todo momento
      5. Haz una breve pausa en la parte alta del movimiento
      6. Baja lentamente las piernas con control
      7. Detente justo antes de que los talones toquen el suelo para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala mientras elevas las piernas hacia el techo
      - Inhala mientras bajas las piernas

      ### 4. Consejos
      - Mantén las piernas rectas y juntas durante todo el movimiento
      - Concéntrate en usar la parte baja del abdomen en lugar de depender de los flexores de cadera
      - Presiona la zona lumbar firmemente contra la colchoneta para proteger la columna
      - Baja las piernas solo hasta donde puedas mantener el contacto lumbar con la colchoneta
      - Muévete con control; más lento es más exigente y más eficaz

      ### 5. Errores comunes
      - Dejar que la zona lumbar se arquee y se despegue de la colchoneta, sobre todo en la fase de bajada
      - Flexionar las rodillas para facilitar el ejercicio
      - Usar impulso para subir las piernas en lugar de una contracción controlada
      - Bajar demasiado las piernas y perder el contacto lumbar
      - Moverse demasiado rápido y sacrificar la técnica
      - Contener la respiración durante el movimiento

      ### 6. Seguridad y modificaciones
      - Los principiantes deben dominar la elevación de rodillas tumbado antes de intentar este ejercicio
      - Coloca las manos bajo los glúteos para dar soporte adicional a la zona lumbar
      - Reduce el rango de movimiento bajando menos las piernas si sientes sobrecarga lumbar
      - Variante avanzada: baja las piernas muy despacio (3-5 segundos) para aumentar la intensidad
