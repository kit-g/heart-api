  Single Leg Bridge:
    name: Puente de glúteos a una pierna
    instructions: |
      ## Resumen
      El puente de glúteos a una pierna es un ejercicio unilateral con peso corporal que trabaja principalmente los glúteos y los isquiotibiales. También activa el core y los estabilizadores de cadera, usando una posición a una pierna para desarrollar fuerza de glúteos, corregir desequilibrios y mejorar la estabilidad de la cadera.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba con las rodillas flexionadas y los pies planos en el suelo
      - Coloca los pies separados al ancho de las caderas, cerca de los glúteos
      - Extiende una pierna recta, manteniéndola en línea con el muslo
      - Mantén los brazos a los lados sobre el suelo
      - Activa el core en todo momento

      ### 2. Movimiento
      1. Empuja con el talón del pie apoyado para elevar las caderas hacia arriba
      2. Sube las caderas hasta que el cuerpo forme una línea recta de los hombros a las rodillas
      3. Mantén la pierna extendida recta y en línea con el muslo de trabajo
      4. Aprieta con fuerza el glúteo en la parte alta del movimiento
      5. Baja lentamente las caderas con control
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Inhala al bajar las caderas
      - Exhala al elevar las caderas

      ### 4. Consejos
      - Concéntrate en apretar el glúteo arriba, no en arquear la espalda
      - Mantén las caderas niveladas durante todo el movimiento
      - Empuja con el talón, no con la punta del pie
      - Mantén la pierna extendida recta y activa
      - Controla tanto la fase de subida como la de bajada

      ### 5. Errores comunes
      - Hiperextender la zona lumbar arriba en lugar de usar los glúteos
      - Dejar que las caderas roten o se inclinen hacia un lado
      - No lograr la extensión completa de cadera arriba
      - Empujar con la punta del pie en lugar del talón
      - Flexionar la pierna extendida durante el movimiento
      - Moverse demasiado rápido y perder el control

      ### 6. Seguridad y modificaciones
      - Domina el puente de glúteos normal antes de progresar a una pierna
      - Coloca las manos en las caderas para comprobar que están niveladas
      - Reduce el rango de movimiento si sientes molestias en la zona lumbar
      - Variante avanzada: eleva el pie sobre un banco o añade una pausa arriba
