  Ball Slams:
    name: Azotes con balón
    instructions: |
      ## Resumen
      Los azotes con balón son un ejercicio explosivo de cuerpo completo que trabaja principalmente el core, los hombros y los dorsales. También implican toda la cadena posterior y el sistema cardiovascular, usando un balón medicinal para desarrollar potencia, liberar estrés y ganar fuerza explosiva.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros sosteniendo un balón medicinal
      - Sujeta el balón a la altura del pecho con ambas manos
      - Mantén el pecho erguido, el core activado y las rodillas ligeramente flexionadas
      - Mantén una buena postura durante todo el ejercicio

      ### 2. Movimiento
      1. Eleva el balón por encima de la cabeza estirándote hacia arriba
      2. Azota el balón con fuerza directamente contra el suelo
      3. Usa todo el cuerpo para generar potencia en el azote
      4. Flexiona rodillas y caderas mientras azotas el balón
      5. Atrapa o recoge el balón cuando rebote
      6. Repite de inmediato el número deseado de repeticiones explosivas

      ### 3. Respiración
      - Inhala mientras elevas el balón por encima de la cabeza
      - Exhala con fuerza al azotar el balón contra el suelo

      ### 4. Consejos
      - Usa todo el cuerpo, no solo los brazos
      - Azota con máxima fuerza y agresividad
      - Es un ejercicio excelente para desarrollar potencia y liberar estrés
      - Mantén el control del movimiento a pesar de su explosividad
      - Usa un balón diseñado para azotes

      ### 5. Errores comunes
      - Usar solo los brazos en lugar de todo el cuerpo
      - No azotar con toda la fuerza
      - Dejar que el balón rebote sin control
      - Mantenerse demasiado erguido sin activar el core
      - Usar un balón que rebota demasiado
      - Mala postura durante el movimiento

      ### 6. Seguridad y modificaciones
      - Usa un balón de azote (slam ball) diseñado para este propósito
      - Empieza con un balón más ligero para dominar el movimiento explosivo
      - Hazlo sobre una superficie que soporte el impacto
      - Varía el ritmo de explosivo a controlado según tus objetivos
