  Calf Press on Leg Press:
    name: Elevación de talones en prensa
    instructions: |
      ## Resumen
      La elevación de talones en prensa es un ejercicio de aislamiento que trabaja principalmente el gastrocnemio y el sóleo, los músculos de las pantorrillas. Utiliza la prensa de piernas para ofrecer una resistencia estable, permitiendo cargas altas y un rango completo de movimiento en la articulación del tobillo.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la prensa de piernas con la espalda firme contra el respaldo
      - Coloca solo la parte anterior de los pies en el borde inferior de la plataforma
      - Deja los talones fuera de la plataforma con las piernas totalmente extendidas
      - Libera los seguros
      - Mantén las rodillas rectas pero sin bloquearlas en todo momento

      ### 2. Movimiento
      1. Baja la plataforma flexionando los tobillos y dejando caer los talones
      2. Permite un estiramiento completo de las pantorrillas abajo
      3. Haz una breve pausa en la posición de estiramiento
      4. Empuja con la parte anterior de los pies para extender los tobillos
      5. Eleva los talones lo más alto posible
      6. Aprieta las pantorrillas con fuerza arriba y repite

      ### 3. Respiración
      - Inhala al bajar los talones
      - Exhala al empujar hacia arriba sobre las puntas de los pies

      ### 4. Consejos
      - Mantén las piernas rectas en todo momento para aislar las pantorrillas
      - Busca el rango completo de movimiento, del estiramiento profundo a la contracción máxima
      - Concéntrate en apretar las pantorrillas arriba
      - Controla el peso en ambas fases
      - Mantén el core activado para mayor estabilidad

      ### 5. Errores comunes
      - Flexionar las rodillas durante el movimiento
      - No lograr el rango completo de movimiento arriba o abajo
      - Rebotar abajo en lugar de estirar de forma controlada
      - Usar demasiado peso y comprometer la técnica
      - Hacer las repeticiones demasiado rápido
      - No apretar en la contracción final

      ### 6. Seguridad y modificaciones
      - Empieza con un peso moderado para dominar el rango completo de movimiento
      - Varía la posición de los pies (neutra, puntas hacia dentro, puntas hacia fuera) para un desarrollo completo de las pantorrillas
      - Variación avanzada: realiza la elevación de talones a una pierna
      - Haz una pausa de 2-3 segundos en la contracción máxima para aumentar la intensidad
