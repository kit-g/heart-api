  Seated Overhead Press (Barbell):
    name: Press militar sentado (barra)
    instructions: |
      ## Resumen
      El press militar sentado con barra es un ejercicio compuesto del tren superior que trabaja principalmente las tres cabezas de los deltoides. También involucra los tríceps y la parte superior del pecho, usando una posición sentada con apoyo de espalda para eliminar el empuje de piernas y aislar los hombros.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en un banco con respaldo, con los pies apoyados en el suelo
      - Coloca una barra a la altura de la parte alta del pecho en un soporte
      - Sujeta la barra un poco más abierta que el ancho de hombros, con las palmas hacia adelante
      - Saca la barra del soporte y sostenla a la altura de los hombros
      - Mantén la espalda pegada al respaldo y el core activado

      ### 2. Movimiento
      1. Empuja la barra en línea recta por encima de la cabeza extendiendo los brazos
      2. Continúa empujando hasta que los brazos queden completamente extendidos
      3. Alcanza la extensión completa de los codos arriba
      4. Haz una pausa breve arriba
      5. Baja la barra de nuevo a la altura de los hombros con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Toma aire y activa el core antes de empujar
      - Mantén el aire durante el empuje
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - Mantén la espalda firmemente apoyada contra el respaldo
      - La posición sentada elimina el empuje de piernas para un trabajo estricto de hombros
      - Empuja en línea recta hacia arriba, no hacia adelante
      - Concéntrate en el rango completo de movimiento
      - Esta variante es excelente para aislar los hombros

      ### 5. Errores comunes
      - Arquear la zona lumbar despegándola del respaldo durante el empuje
      - Empujar hacia adelante en lugar de en línea recta hacia arriba
      - No alcanzar la extensión completa arriba
      - Usar impulso levantando los glúteos del asiento
      - Abrir los codos demasiado hacia los lados
      - No mantener la tensión del core

      ### 6. Seguridad y modificaciones
      - Usa un asistente cuando levantes pesos elevados
      - Empieza con menos peso que en tu press de pie
      - Ajusta el ángulo del respaldo, si es posible, para mayor comodidad
      - Si sientes molestias en el hombro, revisa la anchura del agarre y la trayectoria de la barra
