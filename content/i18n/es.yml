      ## Resumen
      El press de banca con mancuernas es un ejercicio compuesto de empuje que trabaja principalmente el pectoral mayor. También involucra los deltoides frontales y los tríceps, y permite un movimiento independiente de cada brazo y un rango de movimiento mayor que la variante con barra.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en un banco plano con los pies firmemente apoyados en el suelo
