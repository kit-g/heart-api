      - Ajusta la posición de los pies sobre la banda para modificar la resistencia
      - Variación avanzada: usa una banda de mayor resistencia o añade una pausa en la parte alta
      - Mantén las rodillas ligeramente flexionadas para proteger la zona lumbar
