  Reverse Grip Concentration Curl (Dumbbell):
    name: Curl concentrado con agarre invertido (mancuerna)
    instructions: |
      ## Resumen
      El curl concentrado con agarre invertido es un ejercicio de aislamiento que trabaja principalmente el braquiorradial y el braquial con máxima concentración. También involucra el bíceps braquial y los extensores del antebrazo, usando la posición sentada y apoyada con agarre prono para eliminar el impulso.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en un banco con las piernas bien abiertas
      - Sostén una mancuerna en una mano con agarre prono (palma hacia abajo)
      - Apoya la parte posterior del brazo contra la cara interna del muslo
      - Inclínate ligeramente hacia delante y apoya la mano libre en el muslo contrario
      - Mantén el pecho erguido y el core activado

      ### 2. Movimiento
      1. Sube la mancuerna manteniendo el agarre prono
      2. Mantén la parte superior del brazo firmemente apoyada contra la cara interna del muslo en todo momento
      3. Continúa subiendo hasta que el antebrazo quede casi vertical
      4. Haz una pausa y aprieta en la parte alta del movimiento
      5. Baja lentamente la mancuerna a la posición inicial con control
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Exhala al subir la mancuerna
      - Inhala al bajar la mancuerna

      ### 4. Consejos
      - Mantén la parte superior del brazo completamente inmóvil contra el muslo
      - Mantén el agarre prono durante todo el movimiento
      - Concéntrate en la contracción muscular pura sin mover el cuerpo
      - Mantén la muñeca en posición neutra
      - Controla el peso durante todo el rango de movimiento

      ### 5. Errores comunes
      - Despegar el codo del muslo durante el curl
      - Dejar que la muñeca se flexione hacia arriba en lugar de mantenerse neutra
      - Usar impulso o balancear el peso
      - No completar el rango completo de movimiento
      - Inclinarse hacia atrás o mecer el torso
      - Usar demasiado peso y comprometer la técnica estricta

      ### 6. Seguridad y modificaciones
      - Empieza con menos peso que en el curl concentrado tradicional
      - Mantén la espalda recta para evitar molestias en la zona lumbar
      - Variante avanzada: añade una pausa de 3 a 5 segundos en la contracción máxima
      - Concéntrate en la sensación de apretar el antebrazo y la parte externa del bíceps
