  Toes To Bar:
    name: Pies a la barra
    instructions: |
      ## Resumen
      Pies a la barra es un ejercicio avanzado de core en suspensión que trabaja principalmente todo el recto abdominal y los flexores de cadera. También involucra los oblicuos, el transverso abdominal, los dorsales, la fuerza de agarre y los estabilizadores del hombro, lo que lo convierte en uno de los ejercicios abdominales con peso corporal más exigentes.

      ## Ejecución
      ### 1. Posición inicial
      - Cuélgate de una barra de dominadas con las manos separadas al ancho de los hombros y agarre prono
      - Deja el cuerpo completamente extendido con los pies sin tocar el suelo
      - Activa el core y mantén los hombros hacia abajo y atrás
      - Mantén las piernas juntas y completamente extendidas
      - Minimiza el balanceo estabilizando el cuerpo

      ### 2. Movimiento
      1. Levanta las piernas y lleva las puntas de los pies hacia la barra
      2. Mantén las piernas rectas mientras las elevas en un arco fluido
      3. Usa la fuerza del core y un ligero impulso de cadera para llevar los pies a la barra
      4. Toca la barra con las puntas de los pies en la parte alta del movimiento
      5. Controla el descenso mientras bajas las piernas
      6. Vuelve a la posición inicial colgado y repite con repeticiones controladas

      ### 3. Respiración
      - Exhala con fuerza al subir las piernas hacia la barra
      - Inhala al bajar las piernas a la posición inicial

      ### 4. Consejos
      - Genera el impulso desde los hombros y el core, no solo desde las piernas
      - Piensa en llevar los pies a la barra en un arco, no en línea recta hacia arriba
      - Mantén los brazos rectos y los hombros activos en todo momento
      - Usa un balanceo controlado en lugar de luchar contra él
      - Aprieta fuerte los abdominales en la parte alta del movimiento

      ### 5. Errores comunes
      - Flexionar las rodillas para facilitar el ejercicio
      - Usar un balanceo excesivo y descontrolado
      - No llevar los pies hasta tocar la barra
      - Dejar que los hombros se encojan hacia las orejas
      - Dejar caer las piernas demasiado rápido en el descenso
      - No activar los dorsales para ayudar a controlar el movimiento

      ### 6. Seguridad y modificaciones
      - Domina la elevación de piernas colgado y las rodillas a los codos antes de intentar este ejercicio
      - Usa correas de muñeca si la fuerza de agarre te limita
      - Los principiantes pueden practicar el movimiento de kipping por separado antes de combinarlo
      - Variante avanzada: realiza pies a la barra estricto, sin balanceo ni kipping
