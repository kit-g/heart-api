  Battle Ropes:
    name: Cuerdas de batalla
    instructions: |
      ## Resumen
      Las cuerdas de batalla son un ejercicio cardiovascular y de fuerza de alta intensidad que trabaja los hombros, los brazos, el core y las piernas. Usando cuerdas gruesas y pesadas para crear ondas y patrones, desarrollan potencia, resistencia y fuerza de agarre, y ofrecen un entrenamiento metabólico eficaz de cuerpo completo.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de frente al punto de anclaje con los pies separados al ancho de los hombros
      - Sujeta un extremo de cuerda en cada mano
      - Mantén una ligera flexión de rodillas con el core activado
      - Mantén la espalda recta y el pecho erguido
      - Sitúate a una distancia en la que las cuerdas queden con una ligera holgura

      ### 2. Movimiento
      1. Elige un patrón de ondas (ondas alternas, ondas dobles, azotes, etc.)
      2. Crea ondas potentes y rítmicas moviendo los brazos
      3. Mantén el movimiento durante un intervalo de tiempo determinado
      4. Mantén el core activado y usa todo el cuerpo
      5. Genera ondas continuas sin detenerte
      6. Continúa durante el intervalo de trabajo deseado (normalmente 20-60 segundos)

      ### 3. Respiración
      - Respira de forma constante y rítmica durante todo el ejercicio
      - Exhala con el esfuerzo en las partes intensas
      - Evita aguantar la respiración

      ### 4. Consejos
      - Activa el core para proteger la zona lumbar
      - Usa las caderas y las piernas, no solo los brazos
      - Empieza con intervalos más cortos y construye resistencia
      - Los distintos patrones de ondas trabajan diferentes grupos musculares
      - Es excelente para el entrenamiento interválico de alta intensidad

      ### 5. Errores comunes
      - Usar solo los brazos en lugar de todo el cuerpo
      - Mantenerse demasiado erguido, sin postura atlética
      - No crear patrones de ondas consistentes
      - Aguantar la respiración durante el trabajo
      - Empezar con intervalos demasiado largos
      - Mala postura con la espalda redondeada

      ### 6. Seguridad y modificaciones
      - Empieza con cuerdas más ligeras o intervalos más cortos
      - Reduce la intensidad creando ondas más pequeñas
      - Alterna entre distintos patrones de ondas
      - Descansa lo suficiente entre intervalos
    validated: false
    source_digest: 39ab652bdaaf
  Climbing:
    name: Escalada
    instructions: |
      ## Resumen
      La escalada es una actividad cardiovascular y de fuerza de cuerpo completo que trabaja la espalda, los brazos, el core y las piernas. Ya sea escalada en roca, en muro o en cuerda, desarrolla fuerza de agarre, resistencia muscular, capacidad de resolución de problemas y condición cardiovascular.

      ## Ejecución
      ### 1. Posición inicial
      - Acércate al muro o superficie de escalada con el equipo de seguridad adecuado
      - Evalúa tu ruta antes de empezar
      - Usa pies de gato y magnesio si lo necesitas
      - Asegúrate de un montaje correcto del aseguramiento si corresponde
      - Comienza desde una posición estable

      ### 2. Movimiento
      1. Planifica tu ruta e identifica las presas para las manos y los apoyos para los pies
      2. Usa las piernas para empujar hacia arriba en lugar de tirar solo con los brazos
      3. Mantén tres puntos de contacto siempre que sea posible
      4. Transfiere el peso de forma eficiente entre las presas
      5. Dosifica el ritmo para mantener la resistencia durante toda la escalada
      6. Continúa escalando durante la duración o ruta deseada

      ### 3. Respiración
      - Respira de forma constante durante la escalada
      - Haz pausas breves en presas estables si lo necesitas
      - Evita aguantar la respiración en las secciones difíciles

      ### 4. Consejos
      - Usa las piernas para empujar, no solo los brazos para tirar
      - Mantén las caderas cerca de la pared para mejor equilibrio
      - Mira hacia adelante para planificar tus próximos movimientos
      - Descansa en las buenas presas cuando las encuentres
      - Prioriza la técnica sobre la fuerza pura

      ### 5. Errores comunes
      - Apretar las presas en exceso y desperdiciar energía
      - Depender demasiado de los brazos en lugar de las piernas
      - No planificar con antelación y quedarse atascado
      - Escalar demasiado rápido y agotarse
      - Mala posición corporal, alejado de la pared
      - No descansar en las buenas presas

      ### 6. Seguridad y modificaciones
      - Escala siempre con el equipo de seguridad adecuado y supervisión
      - Empieza con rutas más fáciles y progresa gradualmente
      - Considera el búlder (alturas bajas, con colchonetas) si eres principiante
      - Aprende la técnica correcta de escaladores o instructores con experiencia
