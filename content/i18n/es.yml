  Zercher Squat (Barbell):
    name: Sentadilla Zercher (barra)
    instructions: |
      ## Resumen
      La sentadilla Zercher es un ejercicio compuesto avanzado que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También involucra intensamente el core, la parte alta de la espalda y los bíceps, usando una barra sostenida en el pliegue de los codos para crear un patrón de carga único que favorece una postura erguida.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca una barra en un rack a la altura de los codos
      - Colócate bajo la barra y sitúala en el pliegue de los codos
      - Junta las manos entrelazadas frente al pecho
      - Ponte de pie con los pies separados al ancho de los hombros
      - Mantén el pecho erguido, el core activado y los codos pegados al cuerpo

      ### 2. Movimiento
      1. Inicia la sentadilla flexionando las rodillas y las caderas al mismo tiempo
      2. Mantén el torso erguido y los codos pegados durante todo el movimiento
      3. Baja hasta que los muslos queden al menos paralelos al suelo
      4. Mantén una postura erguida con la barra segura en los codos
      5. Empuja con los talones para volver a la posición de pie
      6. Extiende por completo las caderas y las rodillas arriba y repite

      ### 3. Respiración
      - Toma una respiración profunda y activa el core antes de bajar
      - Aguanta la respiración durante el descenso y la posición más baja
      - Exhala mientras subes o al llegar arriba

      ### 4. Consejos
      - La carga frontal obliga a mantener un torso extremadamente erguido
      - Mantén los codos pegados para evitar que la barra se resbale
      - Usa una almohadilla o toalla para mayor comodidad en el pliegue de los codos
      - Esta variante enfatiza intensamente el core y la parte alta de la espalda
      - Empieza con poco peso para adaptarte a la posición particular de la barra

      ### 5. Errores comunes
      - Dejar que la barra se resbale de los codos
      - Inclinarte demasiado hacia adelante a pesar de la carga frontal
      - No alcanzar la profundidad adecuada
      - Dejar que los codos se abran hacia afuera
      - Usar demasiado peso antes de dominar la posición
      - No mantener la tensión del core durante todo el ejercicio

      ### 6. Seguridad y modificaciones
      - Empieza con una barra muy ligera o incluso una barra de entrenamiento
      - Usa una almohadilla gruesa o una toalla en el pliegue de los codos para mayor comodidad
      - Es una variante avanzada; domina primero la sentadilla frontal
      - Si sientes molestias, reduce el peso o prueba otra variante de sentadilla
