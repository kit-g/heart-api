  Seated Row (Cable):
    name: Remo en polea baja
    instructions: |
      ## Resumen
      El remo en polea baja es un ejercicio de tracción horizontal que trabaja principalmente el dorsal ancho, los romboides y el trapecio medio. También involucra los bíceps y los deltoides posteriores, y usa una polea que ofrece tensión constante durante todo el remo para un desarrollo efectivo de la espalda.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de remo con los pies en los reposapiés
      - Sujeta el asa con ambas manos, con los brazos completamente extendidos
      - Mantén las rodillas ligeramente flexionadas y la espalda recta
      - Siéntate erguido con el pecho arriba y los hombros atrás
      - Activa el core durante todo el movimiento

      ### 2. Movimiento
      1. Tira del asa hacia el torso llevando los codos hacia atrás
      2. Mantén el torso erguido y evita inclinarte demasiado hacia atrás
      3. Continúa hasta que el asa llegue a la parte baja del pecho o la parte alta del abdomen
      4. Junta las escápulas al final del recorrido
      5. Extiende los brazos lentamente de vuelta a la posición inicial con control
      6. Detente justo antes de que las placas se apoyen para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala al tirar del asa hacia el torso
      - Inhala al extender los brazos de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén el torso erguido con una inclinación mínima
      - Guía el movimiento con los codos, llevándolos hacia atrás
      - Concéntrate en juntar las escápulas
      - Mantén la tensión constante sin dejar que las placas se apoyen
      - Controla el peso durante todo el rango de movimiento

      ### 5. Errores comunes
      - Inclinarse demasiado hacia atrás y usar impulso
      - Redondear la espalda durante el movimiento
      - No completar el rango completo de movimiento
      - Encoger los hombros hacia arriba
      - Dejar que las placas se apoyen entre repeticiones
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Ajusta la posición de los pies para mantener las rodillas ligeramente flexionadas
      - Prueba distintos accesorios (agarre amplio, cerrado o neutro) para variar
      - Trabaja un brazo a la vez para un enfoque unilateral
