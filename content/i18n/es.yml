  Lat Pulldown - Wide Grip (Cable):
    name: Jalón al pecho con agarre amplio (polea)
    instructions: |
      ## Resumen
      El jalón al pecho con agarre amplio en polea es un ejercicio de tracción en máquina que trabaja principalmente el dorsal ancho con énfasis en la amplitud de la espalda. También involucra los romboides y el trapecio medio, y usa un agarre más amplio para incidir en la parte externa de los dorsales y construir una espalda más ancha.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la estación de jalón con los muslos sujetos bajo los soportes
      - Sujeta la barra con agarre prono, con las manos bastante más separadas que el ancho de hombros
      - Extiende los brazos por completo por encima de la cabeza manteniendo la tensión en la polea
      - Mantén el pecho arriba y los hombros abajo
      - Activa el core y mantén el torso erguido

      ### 2. Movimiento
      1. Tira de la barra hacia la parte alta del pecho llevando los codos hacia abajo y afuera
      2. Mantén el torso erguido o inclínate muy ligeramente hacia atrás
      3. Continúa hasta que la barra llegue a la parte alta del pecho
      4. Junta las escápulas en la parte baja
      5. Devuelve la barra lentamente a la posición inicial con control
      6. Detente justo antes de que las placas se apoyen para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala al tirar de la barra hacia abajo
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén los codos más abiertos debido a la amplitud del agarre
      - Concéntrate en llevar los codos hacia abajo, hacia los costados
      - Mantén el pecho arriba y los hombros atrás en todo momento
      - Mantén la tensión constante sin dejar que las placas se apoyen
      - Evita inclinarte o balancear el cuerpo en exceso

      ### 5. Errores comunes
      - Usar un agarre demasiado amplio que limite el rango de movimiento
      - Inclinarse demasiado hacia atrás y convertir el ejercicio en un remo
      - No completar el rango completo de movimiento
      - Encoger los hombros hacia arriba
      - Dejar que las placas se apoyen entre repeticiones
      - Llevar la barra por detrás del cuello, lo que puede forzar los hombros

      ### 6. Seguridad y modificaciones
      - Empieza con un peso moderado para adaptarte al agarre amplio
      - Evita llevar la barra por detrás del cuello para no forzar los hombros
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte baja de cada repetición
      - Si notas molestias en los hombros, cierra un poco el agarre
