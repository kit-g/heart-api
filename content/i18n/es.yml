  Halo:
    name: Halo
    instructions: |
      ## Resumen
      El halo es un ejercicio dinámico de movilidad de hombros que trabaja principalmente los deltoides y los músculos del manguito rotador. También involucra el core y la parte alta de la espalda, usando un movimiento circular alrededor de la cabeza para mejorar la movilidad, la estabilidad y la coordinación del hombro.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros o arrodíllate para mayor estabilidad
      - Sujeta una mancuerna o pesa rusa por los cuernos a la altura del pecho
      - Mantén el pecho erguido, el core activado y la mirada al frente
      - Mantén una buena postura en todo momento

      ### 2. Movimiento
      1. Haz circular el peso alrededor de tu cabeza con un movimiento controlado
      2. Mantén el peso cerca de la cabeza mientras la rodea
      3. Mantén el torso erguido y la parte inferior del cuerpo estable
      4. Completa el círculo y vuelve a la posición inicial
      5. Repite las repeticiones deseadas en una dirección
      6. Cambia de dirección y repite el mismo número de repeticiones

      ### 3. Respiración
      - Respira de forma constante y rítmica durante todo el movimiento
      - Evita contener la respiración

      ### 4. Consejos
      - Mantén el peso cerca de la cabeza durante todo el círculo
      - Concéntrate en un movimiento suave y controlado
      - Mantén el core firme para evitar la rotación del torso
      - Empieza con un peso ligero para dominar el patrón de movimiento
      - Este ejercicio es excelente para el calentamiento y la movilidad de los hombros

      ### 5. Errores comunes
      - Usar demasiado peso y perder el control
      - Permitir que el torso rote junto con el peso
      - Moverse demasiado rápido en los círculos
      - No mantener el peso cerca de la cabeza
      - Arquear la zona lumbar durante el movimiento
      - Contener la respiración

      ### 6. Seguridad y modificaciones
      - Empieza con una mancuerna o pesa rusa muy ligera
      - Arrodíllate para mayor estabilidad si el equilibrio es un problema
      - Usa este ejercicio como calentamiento antes de entrenar hombros
      - Reduce el rango de movimiento si sientes molestias en el hombro
