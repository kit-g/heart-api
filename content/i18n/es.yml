  Bent Over One Arm Row (Dumbbell):
    name: Remo con mancuerna a una mano
    instructions: |
      ## Resumen
      El remo con mancuerna a una mano es un ejercicio de tirón unilateral que trabaja principalmente el dorsal ancho, los romboides y la porción media de los trapecios. También involucra los bíceps y los deltoides posteriores, y te permite corregir desequilibrios de fuerza y lograr un rango de movimiento mayor que los remos bilaterales.

      ## Ejecución
      ### 1. Posición inicial
      - Apoya una rodilla y la mano del mismo lado en un banco plano
      - Coloca el otro pie en el suelo con la rodilla ligeramente flexionada
      - Sujeta una mancuerna con la mano libre, con el brazo colgando recto hacia abajo
      - Mantén la espalda plana y paralela al suelo
      - Activa el core y mantén la columna neutra

      ### 2. Movimiento
      1. Tira de la mancuerna hacia arriba llevando el codo hacia el techo
      2. Mantén el codo cerca del cuerpo mientras remas
      3. Continúa hasta que la mancuerna llegue a la cadera o a la parte baja de las costillas
      4. Aprieta la escápula hacia la columna en la parte alta
      5. Baja lentamente la mancuerna a la posición inicial con control
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Exhala al tirar de la mancuerna hacia arriba
      - Inhala al bajarla de vuelta

      ### 4. Consejos
      - Guía el movimiento con el codo, no con la mano
      - Mantén el torso estable y evita rotarlo
      - Concéntrate en apretar los músculos de la espalda en la parte alta
      - Mantén la espalda plana durante todo el movimiento
      - Controla el peso en ambas direcciones

      ### 5. Errores comunes
      - Rotar el torso en lugar de mantenerlo estable
      - Usar impulso para balancear el peso hacia arriba
      - No lograr el rango completo de movimiento
      - Redondear la espalda en lugar de mantenerla plana
      - Tirar con el brazo en lugar de con los músculos de la espalda
      - Moverse demasiado rápido y perder el control

      ### 6. Seguridad y modificaciones
      - Empieza con un peso moderado para dominar la técnica
      - Realízalo sin banco haciendo una bisagra de cadera y apoyando la mano libre en el muslo
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte alta de cada repetición
      - Haz el mismo número de repeticiones con cada lado para un desarrollo equilibrado
