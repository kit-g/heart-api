  Press Under (Barbell):
    name: Press bajo la barra
    instructions: |
      ## Resumen
      El press bajo la barra es un ejercicio accesorio de halterofilia que trabaja los hombros, los tríceps y el core. Enseña el patrón de movimiento de meterse bajo la barra durante la fase de recepción de arranques y enviones, desarrollando velocidad, posicionamiento y confianza.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas, sujetando una barra a la altura del pecho
      - Usa la anchura de agarre de tu arranque o envión, según el levantamiento que estés entrenando
      - Mantén el pecho erguido, el core activado y los codos ligeramente por debajo de la barra
      - La barra debe apoyarse sobre la parte delantera de los hombros para practicar el envión

      ### 2. Movimiento
      1. Presiona la barra ligeramente hacia arriba mientras, al mismo tiempo, te dejas caer bajo ella
      2. Desplaza los pies hacia tu posición de recepción mientras presionas
      3. Bloquea los brazos por completo en la posición por encima de la cabeza
      4. Recibe en una sentadilla parcial con la barra estable sobre la cabeza
      5. Ponte de pie por completo con la barra en alto
      6. Devuelve la barra a la posición inicial y repite

      ### 3. Respiración
      - Inhala antes de iniciar el press
      - Mantén el aire durante el press y el descenso
      - Exhala después de lograr la extensión completa

      ### 4. Consejos
      - Es un accesorio para pulir la técnica de los levantamientos olímpicos
      - Concéntrate en la velocidad al meterte bajo la barra, no en la fuerza del press
      - El press es mínimo; el énfasis está en dejarse caer bajo la barra
      - Practica el patrón de pies de tu envión o arranque
      - Usa poco peso para desarrollar velocidad y confianza

      ### 5. Errores comunes
      - Presionar demasiado en lugar de meterse bajo la barra
      - No mover los pies a la posición de recepción correcta
      - Dudar en lugar de comprometerse con el movimiento
      - Usar demasiado peso y perder velocidad
      - No lograr la extensión completa por encima de la cabeza
      - Trayectoria de la barra deficiente durante el press

      ### 6. Seguridad y modificaciones
      - Empieza con un tubo de PVC o la barra vacía para aprender el patrón
      - Es una herramienta de aprendizaje, no un ejercicio de fuerza
      - Mantén el peso ligero para conservar la velocidad
      - Es esencial para aprender el envión con tijera y el arranque
