  Power Clean:
    name: Cargada de potencia
    instructions: |
      ## Resumen
      La cargada de potencia es una variante de halterofilia que trabaja toda la cadena posterior, los trapecios y los hombros. Se diferencia de la cargada completa en que la barra se recibe en una sentadilla parcial en lugar de en profundidad completa, enfatizando la potencia explosiva y siendo más accesible para atletas.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies al ancho de caderas, con la barra sobre el mediopié
      - Sujeta la barra justo por fuera de tus piernas
      - Haz bisagra de cadera y flexiona las rodillas para alcanzar la barra
      - Mantén la espalda plana, el pecho arriba y los hombros sobre la barra
      - Activa los dorsales y el core antes de tirar

      ### 2. Movimiento
      1. Empuja explosivamente con las piernas para despegar la barra del suelo
      2. Mantén la barra cerca de tu cuerpo mientras sube
      3. Extiende las caderas y las rodillas con potencia cuando la barra llegue a la mitad del muslo
      4. Métete ligeramente debajo de la barra
      5. Recibe la barra sobre los hombros en posición de sentadilla parcial
      6. Ponte de pie por completo para terminar la repetición

      ### 3. Respiración
      - Toma una respiración profunda antes de tirar
      - Mantén el aire durante el tirón y la recepción
      - Exhala después de ponerte de pie

      ### 4. Consejos
      - Recibe la barra más alto que en una cargada completa (por encima del paralelo)
      - Concéntrate en la extensión explosiva de cadera y la velocidad al meterte debajo de la barra
      - Esta variante requiere menos movilidad que las cargadas completas
      - Mantén la trayectoria de la barra cerca de tu cuerpo
      - Más accesible para el entrenamiento atlético general

      ### 5. Errores comunes
      - Recibir demasiado alto, sin flexión de rodillas
      - Tirar con los brazos demasiado pronto en lugar de usar las piernas
      - Dejar que la barra se aleje del cuerpo
      - No extender por completo las caderas antes de meterse debajo
      - Recibir con los codos bajos
      - Usar demasiado peso antes de dominar la técnica

      ### 6. Seguridad y modificaciones
      - Aprende con un entrenador o preparador cualificado
      - Domina la cargada de potencia en suspensión antes de las cargadas de potencia completas
      - Usa discos de goma para soltar la barra con seguridad
      - Esta variante es excelente para el desarrollo de la potencia atlética
