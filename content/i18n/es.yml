  Straight Leg Deadlift (Band):
    name: Peso muerto con piernas rectas (banda)
    instructions: |
      ## Resumen
      El peso muerto con piernas rectas con banda es un ejercicio de bisagra de cadera con resistencia que trabaja principalmente los isquiotibiales y los erectores espinales. También involucra los glúteos y los dorsales, usando la resistencia progresiva de la banda con una flexión mínima de rodillas para enfatizar la cadena posterior.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas, pisando el centro de una banda
      - Sujeta ambos extremos de la banda con las manos justo por fuera de las piernas
      - Mantente erguido con el pecho arriba, los hombros atrás y el core activado
      - Mantén solo una flexión muy ligera de rodillas durante todo el ejercicio

      ### 2. Movimiento
      1. Haz una bisagra de cadera empujando las caderas hacia atrás y bajando el torso
      2. Mantén la espalda plana y la banda pegada a las piernas
      3. Mantén las piernas casi rectas, con una flexión mínima de rodillas
      4. Baja hasta sentir un estiramiento en los isquiotibiales
      5. Lleva las caderas hacia adelante para volver a la posición inicial
      6. Aprieta los glúteos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala mientras te inclinas hacia adelante
      - Exhala mientras llevas las caderas hacia adelante para incorporarte

      ### 4. Consejos
      - Mantén las piernas casi rectas durante todo el movimiento
      - Concéntrate en la bisagra de cadera, no en hacer una sentadilla
      - Mantén la espalda plana y el pecho erguido durante todo el ejercicio
      - Empuja las caderas hacia atrás tanto como puedas
      - La banda ofrece una resistencia creciente a medida que te incorporas

      ### 5. Errores comunes
      - Redondear la espalda en lugar de mantener la columna plana
      - Flexionar demasiado las rodillas, convirtiéndolo en un peso muerto rumano
      - No empujar las caderas lo suficientemente atrás
      - Bajar demasiado, más allá del punto de estiramiento de los isquiotibiales
      - No mantener una tensión constante en la banda
      - Mirar hacia arriba en lugar de mantener el cuello en posición neutra

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar la bisagra de cadera con las piernas rectas
      - Ajusta la posición de los pies sobre la banda para modificar la resistencia
      - Progresa desde el peso muerto rumano si esta variante te resulta demasiado intensa
      - Si sientes molestias en la zona lumbar, reduce la resistencia y revisa tu técnica
