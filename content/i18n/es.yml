  Overhead Press (Barbell):
    name: Press militar (barra)
    instructions: |
      ## Resumen
      El press militar con barra es un ejercicio compuesto del tren superior que trabaja principalmente las tres cabezas de los deltoides. También involucra los tríceps, la parte superior del pecho y el core, lo que lo convierte en uno de los ejercicios más efectivos para desarrollar la fuerza general de los hombros y la potencia de empuje del tren superior.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros, con la barra en el rack a la altura de la parte alta del pecho
      - Agarra la barra un poco más separado que el ancho de los hombros, con las palmas hacia adelante
      - Saca la barra del rack y sostenla a la altura de los hombros
      - Mantén el pecho erguido, el core activado y los codos ligeramente adelantados
      - Mantén una buena postura en todo momento

      ### 2. Movimiento
      1. Empuja la barra en línea recta hacia arriba extendiendo los brazos
      2. Lleva la cabeza ligeramente hacia atrás para dejar pasar la barra
      3. Continúa empujando hasta que los brazos queden completamente extendidos sobre la cabeza
      4. Alcanza la extensión completa de los codos arriba, con la barra sobre el mediopié
      5. Baja la barra hasta la altura de los hombros con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Toma aire y activa el core antes de empujar
      - Contén la respiración durante el empuje
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - Empuja la barra en una línea vertical recta
      - Mantén el core firme para evitar arquear la zona lumbar
      - Extiende los brazos por completo arriba
      - Mantén la trayectoria de la barra cerca de la cara
      - Este ejercicio puede realizarse de pie o sentado

      ### 5. Errores comunes
      - Arquear la zona lumbar en exceso durante el empuje
      - Empujar la barra hacia adelante en lugar de en línea recta hacia arriba
      - No alcanzar la extensión completa arriba
      - Abrir los codos demasiado hacia afuera
      - Usar impulso de las piernas (convirtiéndolo en un push press)
      - No mantener la tensión del core en todo momento

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la trayectoria vertical del empuje
      - Usa un rack de potencia con barras de seguridad cuando entrenes solo
      - Realiza el press militar sentado para mayor estabilidad
      - Si sientes molestias en el hombro, revisa la anchura del agarre y la trayectoria de la barra
