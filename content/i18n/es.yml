  Standing Leg Curl (Machine):
    name: Curl femoral de pie (máquina)
    instructions: |
      ## Resumen
      El curl femoral de pie es un ejercicio de aislamiento que trabaja principalmente los isquiotibiales, una pierna a la vez. Los gemelos asisten, y la posición de pie te permite entrenar cada pierna en un rango completo mientras la máquina sostiene tu cuerpo.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie frente a la máquina y apoya el muslo contra la almohadilla de soporte
      - Engancha el rodillo detrás de un tobillo
      - Sujeta las asas para mantener el equilibrio
      - Mantén el torso erguido y la pierna de apoyo ligeramente flexionada

      ### 2. Movimiento
      1. Lleva el talón hacia los glúteos flexionando la rodilla
      2. Contrae el isquiotibial en la parte alta del curl
      3. Baja lentamente el rodillo hasta la posición inicial con control
      4. Completa el número deseado de repeticiones controladas
      5. Repite con la otra pierna

      ### 3. Respiración
      - Exhala mientras subes el talón
      - Inhala mientras bajas

      ### 4. Consejos
      - Mantén las caderas quietas; solo debe moverse la rodilla
      - Haz una breve pausa en la parte alta de cada repetición
      - Iguala las repeticiones y el peso en ambas piernas

      ### 5. Errores comunes
      - Balancear la pierna y usar impulso
      - Levantar la cadera para ayudar a subir la pierna
      - Dejar caer el peso en la bajada

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso hasta encontrar la posición del rodillo que resulte cómoda para tu rodilla
      - El curl femoral sentado o tumbado es una alternativa más fácil para principiantes
