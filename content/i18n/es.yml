  Leg Press:
    name: Prensa de piernas
    instructions: |
      ## Resumen
      La prensa de piernas es un ejercicio compuesto de tren inferior que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. Utiliza una máquina guiada para ofrecer resistencia estable y permitir cargas pesadas con menos estrés en la zona lumbar en comparación con las sentadillas con peso libre.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la prensa de piernas con la espalda y las caderas firmes contra los apoyos
      - Coloca los pies en la plataforma separados al ancho de los hombros
      - Mantén los pies planos con las puntas ligeramente hacia fuera
      - Desbloquea las asas de seguridad
      - Mantén el core activado y las manos en las asas

      ### 2. Movimiento
      1. Baja la plataforma flexionando las rodillas hacia el pecho
      2. Continúa hasta que las rodillas alcancen aproximadamente 90 grados
      3. Haz una breve pausa abajo
      4. Empuja con los talones para llevar la plataforma de vuelta arriba
      5. Extiende las piernas sin bloquear por completo las rodillas
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la plataforma
      - Exhala al empujar la plataforma de vuelta arriba

      ### 4. Consejos
      - Mantén la espalda y las caderas firmemente presionadas contra los apoyos
      - Empuja con todo el pie, no solo con las puntas
      - Evita bloquear por completo las rodillas en la extensión total
      - Mantén las rodillas alineadas sobre los dedos de los pies
      - Mantén tensión constante durante todo el movimiento

      ### 5. Errores comunes
      - Levantar los glúteos o la zona lumbar del respaldo
      - Bloquear por completo las rodillas en la extensión total
      - Dejar que las rodillas se metan hacia dentro
      - No lograr la profundidad adecuada (al menos 90 grados)
      - Usar demasiado peso y comprometer la técnica
      - Colocar los pies demasiado bajos en la plataforma, aumentando el estrés en las rodillas

      ### 6. Seguridad y modificaciones
      - Ajusta la posición de los pies (más arriba, más abajo, más ancha o más estrecha) para trabajar distintos músculos
      - Nunca bloquees por completo las rodillas para proteger la articulación
      - Empieza con un peso moderado para dominar la técnica
      - Variante avanzada: realiza la prensa a una pierna o añade una pausa abajo
