  Deadlift High Pull (Barbell):
    name: Peso muerto con tirón alto (barra)
    instructions: |
      ## Resumen
      El peso muerto con tirón alto con barra es un ejercicio accesorio de halterofilia que trabaja toda la cadena posterior, los trapecios y los hombros. Combina un peso muerto con un tirón vertical explosivo, desarrollando potencia y enseñando la mecánica del segundo tirón que se usa en cargadas y arranques.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies al ancho de caderas, con la barra sobre el mediopié
      - Sujeta la barra un poco más abierta que el ancho de hombros
      - Haz bisagra de cadera y flexiona las rodillas para alcanzar la barra
      - Mantén la espalda plana, el pecho arriba y los hombros sobre la barra
      - Activa el core y los dorsales antes de tirar

      ### 2. Movimiento
      1. Realiza un peso muerto empujando con las piernas
      2. Cuando la barra llegue a la mitad del muslo, extiende explosivamente las caderas y las rodillas
      3. Encoge los hombros y tira de la barra hacia arriba con los codos altos
      4. Continúa tirando hasta que la barra llegue al pecho o a la altura de las costillas inferiores
      5. Baja la barra de vuelta a la posición inicial con control
      6. Repite el número deseado de repeticiones explosivas

      ### 3. Respiración
      - Inhala antes de iniciar el tirón
      - Mantén el aire durante el tirón explosivo
      - Exhala mientras bajas la barra

      ### 4. Consejos
      - Concéntrate en la extensión explosiva de cadera a la altura de la mitad del muslo
      - Guía el tirón alto con los codos
      - Mantén la barra cerca de tu cuerpo en todo momento
      - Este ejercicio enseña el segundo tirón de los levantamientos olímpicos
      - Usa menos peso que tu máximo de peso muerto

      ### 5. Errores comunes
      - Tirar con los brazos demasiado pronto, antes de la extensión de cadera
      - No extender por completo caderas y tobillos en la posición de potencia
      - Dejar que la barra se aleje del cuerpo
      - Usar demasiado peso y perder velocidad explosiva
      - Redondear la espalda durante el tirón
      - No mantener los codos altos durante la fase de tirón

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el movimiento explosivo
      - Este es un ejercicio accesorio para halterofilia
      - Domina el peso muerto antes de añadir el componente de tirón alto
      - Úsalo para desarrollar potencia para cargadas y arranques
