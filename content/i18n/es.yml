  Sit Up:
    name: Abdominales
    instructions: |
      ## Resumen
      Los abdominales son un ejercicio clásico de core con peso corporal que trabaja principalmente el recto abdominal y los flexores de cadera. También involucran los oblicuos y el transverso abdominal a lo largo de todo el rango de movimiento, lo que los hace más dinámicos que el crunch, aunque con mayor participación de los flexores de cadera.

      ## Ejecución
      ### 1. Posición inicial
      - Acuéstate boca arriba en una colchoneta con las rodillas flexionadas y los pies apoyados en el suelo
      - Sujeta los pies bajo un objeto estable o pide a un compañero que los sostenga si es necesario
      - Coloca las manos detrás de la cabeza, cruzadas sobre el pecho o extendidas hacia las rodillas
      - Mantén los codos apuntando hacia los lados si tienes las manos detrás de la cabeza
      - Activa el core y presiona la zona lumbar contra la colchoneta

      ### 2. Movimiento
      1. Levanta toda la parte superior del cuerpo de la colchoneta contrayendo los abdominales
      2. Continúa subiendo hasta que el torso quede casi vertical o el pecho llegue a las rodillas
      3. Mantén el core activado y exhala mientras subes
      4. Haz una pausa breve en la parte alta del movimiento
      5. Baja el torso lentamente y con control
      6. Toca la colchoneta con las escápulas antes de comenzar la siguiente repetición

      ### 3. Respiración
      - Exhala al incorporarte y curvar el torso hacia delante
      - Inhala al bajar a la posición inicial

      ### 4. Consejos
      - Concéntrate en usar el core para levantarte, no en tirar del cuello
      - Mantén los pies apoyados en el suelo durante todo el movimiento
      - Muévete con control y no con impulso
      - Evita tirar de la cabeza o el cuello si tienes las manos detrás de la cabeza
      - Evita arquear la zona lumbar en exceso

      ### 5. Errores comunes
      - Tirar del cuello o la cabeza, lo que puede causar molestias
      - Usar impulso para subir en lugar de una contracción muscular controlada
      - Dejar que los pies se despeguen del suelo
      - Arquear la zona lumbar en exceso durante el movimiento
      - Moverse demasiado rápido y sacrificar la técnica
      - No bajar del todo entre repeticiones

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden hacer crunch hasta desarrollar la fuerza suficiente
      - Coloca las manos sobre los muslos y deslízalas hacia las rodillas para una variante más fácil
      - Variante avanzada: sostén un disco sobre el pecho para añadir resistencia
      - Si sientes molestias en la zona lumbar, cambia al crunch o reduce el rango de movimiento
