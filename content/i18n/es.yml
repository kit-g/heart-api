  Deficit Squat:
    name: Sentadilla con déficit
    instructions: |
      ## Resumen
      La sentadilla con déficit es un ejercicio compuesto avanzado que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales con un rango de movimiento ampliado. Utiliza una plataforma elevada para aumentar la profundidad y la dificultad de la sentadilla, desarrollando fuerza en la posición más baja y mejorando la movilidad.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie sobre una plataforma elevada de 1-3 pulgadas (2,5-7,5 cm) con los pies separados al ancho de los hombros
      - Sostén mancuernas a los lados o una barra sobre la parte alta de la espalda
      - Mantén el pecho erguido, el core activado y la mirada al frente
      - Mantén una buena postura durante todo el ejercicio

      ### 2. Movimiento
      1. Inicia la sentadilla flexionando las rodillas y las caderas al mismo tiempo
      2. Mantén el pecho erguido y el peso sobre los talones
      3. Baja más profundo que en una sentadilla normal gracias a la plataforma elevada
      4. Haz una breve pausa en la posición más baja
      5. Empuja con los talones para volver a la posición de pie
      6. Extiende por completo las caderas y las rodillas arriba y repite

      ### 3. Respiración
      - Inhala mientras bajas a la sentadilla
      - Exhala mientras empujas para volver a ponerte de pie

      ### 4. Consejos
      - El déficit aumenta el rango de movimiento y la dificultad
      - Mantén las rodillas alineadas con la punta de los pies
      - Conserva el torso erguido durante todo el movimiento
      - Usa menos peso que en tu sentadilla habitual
      - Esta variante desarrolla fuerza en la posición más baja

      ### 5. Errores comunes
      - Usar una plataforma demasiado alta para tu movilidad
      - No aprovechar la profundidad extra que permite el déficit
      - Dejar que las rodillas se vayan hacia adentro
      - Levantarte sobre la punta de los pies en lugar de mantener el peso en los talones
      - Usar demasiado peso antes de adaptarte al rango ampliado
      - Perder la columna neutra en la posición más baja

      ### 6. Seguridad y modificaciones
      - Empieza con un déficit de 1 pulgada (2,5 cm) y progresa de forma gradual
      - Asegúrate de tener la movilidad adecuada para el rango ampliado
      - Usa menos peso que en tu sentadilla habitual
      - Si sientes molestias en las rodillas, reduce la altura del déficit o el peso
