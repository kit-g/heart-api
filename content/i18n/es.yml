  Box Squat (Barbell):
    name: Sentadilla al cajón (barra)
    instructions: |
      ## Resumen
      La sentadilla al cajón con barra es un ejercicio compuesto del tren inferior que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También involucra el core y la zona lumbar, y utiliza un cajón para asegurar una profundidad constante y enseñar la mecánica correcta de la sentadilla, a la vez que permite cargas más pesadas.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca un cajón o banco detrás de ti a la altura adecuada (ligeramente por debajo del paralelo)
      - Ponte de pie con los pies separados al ancho de los hombros y la barra sobre la parte alta de la espalda
      - Agarra la barra con las manos un poco más abiertas que el ancho de los hombros
      - Mantén el pecho erguido, el core activado y la mirada al frente
      - Mantén la columna neutra en todo momento

      ### 2. Movimiento
      1. Inicia la sentadilla llevando las caderas hacia atrás y flexionando las rodillas
      2. Baja hasta sentarte hacia atrás sobre el cajón
      3. Haz una breve pausa sobre el cajón manteniendo la tensión
      4. Empuja con los talones para volver a ponerte de pie de forma explosiva
      5. Extiende las caderas y las rodillas para volver a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala profundamente antes de descender
      - Mantén la respiración durante el descenso y la pausa
      - Exhala mientras vuelves a subir

      ### 4. Consejos
      - Siéntate hacia atrás sobre el cajón en lugar de dejarte caer
      - Mantén la tensión muscular incluso al sentarte sobre el cajón
      - Empuja con los talones al ponerte de pie
      - Mantén el pecho erguido y el core firme en todo momento
      - El cajón enseña la profundidad correcta y la mecánica de la bisagra de cadera

      ### 5. Errores comunes
      - Relajarse por completo al sentarse sobre el cajón
      - Usar un cajón demasiado alto o demasiado bajo
      - Dejar que las rodillas se vayan hacia adentro
      - Inclinarse demasiado hacia adelante durante el descenso
      - No empujar con los talones al levantarse
      - Rebotar contra el cajón en lugar de hacer una pausa

      ### 6. Seguridad y modificaciones
      - Empieza con un cajón más alto y bájalo gradualmente a medida que mejore tu movilidad
      - Usa un rack de seguridad o un asistente cuando levantes pesos pesados
      - Realiza el ejercicio sin peso al principio para dominar el patrón de movimiento
      - Variación avanzada: añade cadenas o bandas para una resistencia acomodada
