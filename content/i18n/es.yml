  Cable Kickback:
    name: Patada de tríceps (polea)
    instructions: |
      ## Resumen
      La patada de tríceps en polea es un ejercicio de aislamiento que trabaja principalmente los tríceps, en particular la cabeza larga. También involucra los hombros y el core como estabilizadores, proporcionando tensión constante durante todo el movimiento para un desarrollo eficaz de los tríceps.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie frente a una polea baja con un mango individual acoplado
      - Agarra el mango con una mano y da un paso atrás para crear tensión
      - Inclínate hacia delante desde las caderas con el torso a unos 45 grados
      - Mantén el codo del brazo de trabajo flexionado a 90 grados y pegado al costado
      - Apoya la mano libre en el muslo o en la máquina como soporte
      - Activa el core para mayor estabilidad

      ### 2. Movimiento
      1. Extiende el brazo hacia atrás estirando el codo
      2. Mantén el brazo quieto y paralelo al suelo
      3. Continúa hasta que el brazo quede completamente extendido detrás de ti
      4. Haz una pausa y aprieta los tríceps en la extensión completa
      5. Vuelve lentamente a la posición inicial con control
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Exhala al extender el brazo hacia atrás
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén el brazo completamente quieto durante todo el movimiento
      - Concéntrate en aislar los tríceps moviendo solo la articulación del codo
      - Mantén el torso estable, sin balancearte hacia delante y atrás
      - Aprieta fuerte los tríceps en la extensión completa
      - Mantén la tensión en el cable durante todo el movimiento

      ### 5. Errores comunes
      - Dejar que el brazo se mueva durante la extensión
      - Balancear el brazo o usar impulso
      - No lograr la extensión completa del codo atrás
      - Balancear el torso hacia delante y atrás
      - Usar demasiado peso y comprometer la técnica
      - Dejar que el cable pierda tensión en algún punto del movimiento

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la técnica de aislamiento
      - Mantén el core activado para proteger la zona lumbar en la posición inclinada
      - Variante avanzada: haz una pausa de 2-3 segundos en la extensión completa
      - Usa un accesorio de cuerda en lugar del mango para una opción de agarre diferente
