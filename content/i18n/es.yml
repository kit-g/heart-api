  Step-up (Bodyweight):
    name: Subida al cajón (peso corporal)
    instructions: |
      ## Resumen
      La subida al cajón con peso corporal es un ejercicio unilateral del tren inferior que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También involucra el core y los estabilizadores, usando el peso del cuerpo y una plataforma elevada para desarrollar fuerza a una pierna, equilibrio y patrones de movimiento funcionales.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie frente a un cajón o banco estable, a la altura de la rodilla o más bajo
      - Mantén el pecho erguido, el core activado y la mirada al frente
      - Coloca los brazos a los lados o en las caderas
      - Mantén una buena postura durante todo el ejercicio

      ### 2. Movimiento
      1. Coloca un pie completamente sobre el cajón
      2. Empuja con el talón del pie elevado para subir
      3. Lleva el otro pie hasta reunirlo con el primero sobre el cajón
      4. Ponte completamente erguido encima del cajón
      5. Baja con la misma pierna con la que subiste primero
      6. Repite las repeticiones deseadas y cambia de pierna

      ### 3. Respiración
      - Inhala antes de subir
      - Exhala mientras empujas para subir al cajón

      ### 4. Consejos
      - Empuja con el talón del pie elevado, no con la punta
      - Evita impulsarte con la pierna de atrás
      - Mantén el pecho erguido y el torso vertical durante todo el ejercicio
      - Concéntrate en un movimiento controlado en ambas direcciones
      - Empieza con un cajón bajo y progresa de forma gradual

      ### 5. Errores comunes
      - Usar el impulso de la pierna de atrás para subir
      - Inclinarte demasiado hacia adelante durante la subida
      - No apoyar todo el pie sobre el cajón
      - Dejar que la rodilla se vaya hacia adentro
      - Usar un cajón demasiado alto para una técnica correcta
      - No ponerte completamente de pie encima del cajón

      ### 6. Seguridad y modificaciones
      - Asegúrate de que el cajón sea estable y no se deslice ni vuelque
      - Empieza con un cajón bajo (12-18 pulgadas / 30-45 cm) para dominar la técnica
      - Sujétate de un apoyo para mantener el equilibrio al principio
      - Variante avanzada: agrega mancuernas, una barra o aumenta la altura del cajón
