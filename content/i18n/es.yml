  Wrist Roller:
    name: Rodillo de muñeca
    instructions: |
      ## Resumen
      El rodillo de muñeca es un ejercicio de antebrazo que trabaja principalmente los flexores y extensores de la muñeca. También involucra los músculos del agarre y los antebrazos mediante un movimiento de enrollado continuo, lo que lo hace eficaz para desarrollar fuerza y resistencia en los antebrazos.

      ## Ejecución
      ### 1. Posición inicial
      - Mantente de pie erguido sujetando un rodillo de muñeca con ambas manos
      - Sujeta el mango con agarre prono, con las palmas hacia abajo
      - Extiende los brazos rectos al frente a la altura de los hombros
      - Mantén los pies separados al ancho de los hombros y el core activado
      - Asegúrate de que el peso cuelgue libremente de la cuerda

      ### 2. Movimiento
      1. Empieza a girar el mango alternando la flexión de muñeca con cada mano
      2. Enrolla la cuerda hacia arriba, acercando el peso al mango
      3. Mantén los brazos extendidos y paralelos al suelo en todo momento
      4. Continúa girando hasta que el peso llegue arriba
      5. Invierte el movimiento desenrollando lentamente la cuerda hacia abajo
      6. Mantén el control tanto en la fase de enrollado como en la de desenrollado

      ### 3. Respiración
      - Respira de forma constante y natural durante todo el movimiento
      - Evita contener la respiración durante el giro continuo

      ### 4. Consejos
      - Mantén los brazos extendidos a la altura de los hombros en todo momento
      - Concéntrate en movimientos de muñeca controlados en lugar de usar impulso
      - Mantén un movimiento constante y continuo, sin pausas
      - Mantén las muñecas alineadas con los antebrazos
      - Empieza con menos peso para dominar la técnica

      ### 5. Errores comunes
      - Dejar caer los brazos por debajo de la altura de los hombros
      - Usar impulso o movimientos bruscos
      - Dejar que el peso caiga sin control en el descenso
      - Flexionar los codos durante el movimiento
      - Girar demasiado rápido y perder el control
      - Tensar los hombros y la parte superior del cuerpo innecesariamente

      ### 6. Seguridad y modificaciones
      - Empieza con un peso ligero para desarrollar la resistencia de los antebrazos
      - Descansa entre series, ya que los antebrazos se fatigan rápido
      - Variación avanzada: sube y baja el peso varias veces sin descansar
      - Variación con agarre invertido: usa agarre supino para enfatizar otros músculos del antebrazo
    validated: false
