  Deadlift (Dumbbell):
    name: Peso muerto (mancuernas)
    instructions: |
      ## Resumen
      El peso muerto con mancuernas es un ejercicio compuesto que trabaja principalmente los glúteos, los isquiotibiales y los erectores espinales. También involucra los cuádriceps, los dorsales, los trapecios y los músculos del agarre, y utiliza mancuernas para permitir un movimiento independiente de cada brazo y una posición de manos más natural que la barra.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas y las mancuernas en el suelo junto a los pies
      - Haz una bisagra de cadera y flexiona las rodillas para agarrar las mancuernas
      - Sujeta las mancuernas con agarre neutro o prono
      - Mantén el pecho erguido, la espalda plana y los hombros ligeramente por delante de las mancuernas
      - Activa el core y los dorsales antes de levantar

      ### 2. Movimiento
      1. Empuja con los talones y extiende caderas y rodillas al mismo tiempo
      2. Mantén las mancuernas pegadas al cuerpo mientras subes
      3. Ponte de pie por completo extendiendo caderas y rodillas
      4. Mantén los hombros atrás y el pecho erguido arriba
      5. Baja las mancuernas empujando las caderas hacia atrás y flexionando las rodillas
      6. Devuelve las mancuernas al suelo con control y repite

      ### 3. Respiración
      - Inhala profundo y activa el core antes de levantar
      - Aguanta la respiración durante el levantamiento
      - Exhala arriba o mientras bajas las mancuernas

      ### 4. Consejos
      - Mantén las mancuernas pegadas a las espinillas y los muslos en todo momento
      - Sube guiando el movimiento con el pecho
      - Mantén la columna neutra, sin redondearla ni hiperextenderla
      - El agarre neutro puede resultar más cómodo para algunas personas
      - Piensa en empujar el suelo lejos de ti en lugar de levantar las mancuernas

      ### 5. Errores comunes
      - Redondear la zona lumbar durante el levantamiento
      - Empezar con las caderas demasiado altas o demasiado bajas
      - Dejar que las mancuernas se separen del cuerpo
      - No extender por completo las caderas arriba
      - Mirar hacia arriba o hacia abajo en lugar de mantener el cuello neutro
      - Tirar con los brazos en lugar de empujar con piernas y caderas

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas moderadas para dominar la técnica
      - Usa correas de agarre si el agarre te limita
      - Variación avanzada: realiza pesos muertos con mancuerna a una pierna
      - Si sientes molestias en la zona lumbar, reduce el peso y revisa tu técnica
