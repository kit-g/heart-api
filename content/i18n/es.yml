  Reverse Plank:
    name: Plancha invertida
    instructions: |
      ## Resumen
      La plancha invertida es un ejercicio isométrico de core que trabaja principalmente el transverso abdominal, la zona lumbar y los glúteos. También involucra los hombros, los isquiotibiales y los estabilizadores de la parte alta de la espalda, por lo que resulta eficaz para fortalecer la cadena posterior y mejorar la postura.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate sobre una colchoneta con las piernas extendidas al frente
      - Apoya las manos en el suelo detrás de ti, con los dedos apuntando hacia los pies
      - Coloca las manos a la anchura de los hombros con los brazos rectos
      - Activa el core y prepárate para elevar las caderas
      - Mantén los pies juntos o a la anchura de las caderas

      ### 2. Movimiento
      1. Empuja con las manos y los talones para despegar las caderas del suelo
      2. Eleva las caderas hasta que el cuerpo forme una línea recta de la cabeza a los talones
      3. Mantén los brazos rectos y los hombros hacia abajo
      4. Activa los glúteos y el core para sostener la posición
      5. Mantén esta posición estática el tiempo objetivo, normalmente de 20 a 45 segundos
      6. Baja las caderas al suelo con control al terminar

      ### 3. Respiración
      - Respira de forma constante y natural durante toda la posición
      - Evita contener la respiración; mantén una respiración tranquila y regular

      ### 4. Consejos
      - Mantén el cuerpo en línea recta sin hundirte ni elevarte en pico
      - Aprieta los glúteos durante toda la posición para proteger la zona lumbar
      - Empuja el pecho hacia arriba y ábrelo para activar la parte alta de la espalda
      - Mantén el cuello neutro mirando ligeramente hacia arriba
      - Distribuye el peso de forma uniforme entre las manos y los talones

      ### 5. Errores comunes
      - Dejar que las caderas se hundan, lo que sobrecarga la zona lumbar
      - Flexionar los brazos en lugar de mantenerlos rectos
      - Dejar caer la cabeza demasiado hacia atrás, lo que sobrecarga el cuello
      - Contener la respiración en lugar de respirar con naturalidad
      - No activar los glúteos, lo que traslada un estrés excesivo a la zona lumbar
      - Mantener la posición con mala técnica en lugar de reducir la duración

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden empezar con las rodillas flexionadas (posición de mesa invertida)
      - Reduce el tiempo y concéntrate en una técnica perfecta antes de aumentar la duración
      - Variante avanzada: levanta una pierna para aumentar la dificultad
      - Si sientes molestias en las muñecas, apóyate sobre los antebrazos
