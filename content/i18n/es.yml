  Jump Shrug (Barbell):
    name: Encogimiento con salto (barra)
    instructions: |
      ## Resumen
      El encogimiento con salto con barra es un ejercicio accesorio explosivo de halterofilia que trabaja principalmente los trapecios, los gemelos y los glúteos. Enseña la triple extensión explosiva (tobillos, rodillas, caderas), esencial para los levantamientos olímpicos, mientras desarrolla potencia y los trapecios.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies al ancho de caderas sosteniendo una barra
      - Coloca la barra a la mitad del muslo con los brazos rectos
      - Mantén el pecho arriba, la espalda plana y el core activado
      - Sujeta la barra justo por fuera de tus piernas
      - Conserva una ligera flexión de rodillas

      ### 2. Movimiento
      1. Haz un dip ligero flexionando las rodillas
      2. Extiende explosivamente los tobillos, las rodillas y las caderas para saltar hacia arriba
      3. Encoge los hombros con potencia en el punto más alto del salto
      4. Aterriza suavemente con las rodillas flexionadas
      5. Vuelve a la posición inicial
      6. Repite el número deseado de repeticiones explosivas

      ### 3. Respiración
      - Inhala durante el dip
      - Exhala explosivamente durante el salto y el encogimiento

      ### 4. Consejos
      - Busca la máxima potencia explosiva en cada repetición
      - El encogimiento debe producirse en la extensión completa
      - Mantén los brazos rectos durante todo el movimiento
      - Este ejercicio enseña la triple extensión para los levantamientos olímpicos
      - Usa un peso ligero para mantener la velocidad explosiva

      ### 5. Errores comunes
      - Tirar con los brazos en lugar de usar las piernas y el encogimiento
      - No extender por completo tobillos, rodillas y caderas
      - Hacer un dip demasiado profundo antes del salto
      - Usar demasiado peso y perder la calidad explosiva
      - Aterrizar con las piernas rectas
      - No encoger los hombros en el punto más alto del salto

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el movimiento explosivo
      - Aterriza suavemente para proteger tus articulaciones
      - Este es un ejercicio accesorio para halterofilia
      - Úsalo para desarrollar potencia para cargadas y arranques
