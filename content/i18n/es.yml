  Deadlift (Barbell):
    name: Peso muerto (barra)
    instructions: |
      ## Resumen
      El peso muerto con barra es un ejercicio compuesto que trabaja principalmente los erectores espinales, los glúteos y los isquiotibiales. También involucra los cuádriceps, los dorsales, los trapecios y los músculos del agarre, lo que lo convierte en uno de los ejercicios de fuerza más eficaces para todo el cuerpo y para desarrollar la potencia de la cadena posterior.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas y la barra sobre el mediopié
      - Sujeta la barra justo por fuera de las piernas con las manos separadas al ancho de los hombros
      - Haz una bisagra de cadera y flexiona las rodillas para llegar a la barra
      - Mantén el pecho erguido, la espalda plana y los hombros ligeramente por delante de la barra
      - Activa el core y los dorsales antes de levantar

      ### 2. Movimiento
      1. Empuja con los talones y extiende las caderas y las rodillas a la vez
      2. Mantén la barra pegada al cuerpo mientras subes
      3. Ponte completamente de pie extendiendo caderas y rodillas
      4. Mantén los hombros hacia atrás y el pecho erguido arriba
      5. Baja la barra llevando las caderas hacia atrás y flexionando las rodillas
      6. Devuelve la barra al suelo con control y repite

      ### 3. Respiración
      - Inhala profundamente y activa el core antes de levantar
      - Mantén la respiración durante el levantamiento
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - Mantén la barra pegada a las espinillas y los muslos en todo momento
      - Guía la subida con el pecho
      - Mantén la columna neutra, evitando redondearla o hiperextenderla
      - Empuja con todo el pie, no solo con la punta
      - Piensa en empujar el suelo lejos de ti en lugar de levantar la barra

      ### 5. Errores comunes
      - Redondear la zona lumbar durante el levantamiento
      - Empezar con las caderas demasiado altas o demasiado bajas
      - Dejar que la barra se aleje del cuerpo
      - No extender por completo las caderas arriba
      - Mirar hacia arriba o hacia abajo en lugar de mantener el cuello neutro
      - Tirar con los brazos en lugar de empujar con las piernas y las caderas

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la técnica y la bisagra de cadera
      - Usa correas de agarre si la fuerza de agarre te limita
      - Variación avanzada: realiza peso muerto con déficit o peso muerto rumano
      - Si sientes molestias en la zona lumbar, reduce el peso y revisa tu técnica con un profesional
