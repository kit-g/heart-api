  Standing Calf Raise (Barbell):
    name: Elevación de talones de pie (barra)
    instructions: |
      ## Resumen
      La elevación de talones de pie con barra es un ejercicio de aislamiento que trabaja principalmente el gastrocnemio, el músculo principal de la pantorrilla. También involucra el sóleo, usando una barra sobre la parte alta de la espalda para proporcionar una resistencia elevada y desarrollar fuerza y tamaño en los gemelos.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca una barra sobre la parte alta de la espalda, como en una sentadilla
      - Ponte de pie con la parte delantera de los pies sobre una superficie elevada o plataforma
