  Plank:
    name: Plancha
    instructions: |
      ## Resumen
      La plancha es un ejercicio isométrico de core que trabaja principalmente el transverso abdominal y el recto abdominal. También involucra los hombros, los glúteos y los estabilizadores de la zona lumbar durante toda la posición, lo que la convierte en uno de los ejercicios más eficaces para desarrollar estabilidad y resistencia general del core.

      ## Ejecución
      ### 1. Posición inicial
      - Empieza boca abajo sobre una colchoneta con los antebrazos apoyados en el suelo
      - Coloca los codos directamente bajo los hombros con los antebrazos paralelos
      - Extiende las piernas hacia atrás con los dedos de los pies apoyados
      - Despega el cuerpo del suelo formando una línea recta de la cabeza a los talones
      - Activa el core, aprieta los glúteos y mantén el cuello neutro

      ### 2. Movimiento
      1. Mantén esta posición estática conservando la alineación correcta
      2. Mantén el cuerpo en línea recta sin hundirte ni elevar las caderas en pico
      3. Respira de forma constante y mantén la tensión del core en todo momento
      4. Concéntrate en mantener las caderas niveladas y estables
      5. Aguanta el tiempo objetivo, normalmente de 20 a 60 segundos o más
      6. Baja al suelo con control al terminar

      ### 3. Respiración
      - Respira de forma constante y natural durante toda la posición
      - Evita contener la respiración; mantén una respiración tranquila y regular

      ### 4. Consejos
      - Mantén el cuerpo en línea recta de la cabeza a los talones
      - Aprieta los glúteos para evitar que la zona lumbar se hunda
      - Lleva el ombligo hacia la columna para activar la musculatura profunda del core
      - Mantén el cuello neutro mirando un punto en el suelo
      - Distribuye el peso de forma uniforme entre los antebrazos y los dedos de los pies

      ### 5. Errores comunes
      - Dejar que las caderas se hundan, lo que sobrecarga la zona lumbar
      - Elevar demasiado las caderas en pico, lo que reduce la activación del core
      - Contener la respiración en lugar de respirar con naturalidad
      - Dejar que los hombros se deslicen hacia las orejas
      - Dejar caer la cabeza o mirar hacia adelante en lugar de mantener el cuello neutro
      - Mantener la posición con mala técnica en lugar de reducir la duración

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden empezar apoyando las rodillas en lugar de los dedos de los pies
      - Reduce el tiempo y concéntrate en una técnica perfecta antes de aumentar la duración
      - Variante avanzada: levanta una pierna o un brazo para aumentar la dificultad
      - Si sientes molestias en la zona lumbar, revisa tu técnica y reduce el tiempo de la posición
    validated: false
    source_digest: f6f4e1bd5166
  Reverse Crunch:
    name: Crunch invertido
    instructions: |
      ## Resumen
      El crunch invertido es un ejercicio de core con el peso corporal que trabaja principalmente la porción inferior del recto abdominal. También involucra los flexores de cadera, los oblicuos y el transverso abdominal como estabilizadores, por lo que resulta eficaz para desarrollar la fuerza del abdomen inferior con menos tensión en el cuello que los crunches tradicionales.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba sobre una colchoneta con las rodillas flexionadas a 90 grados
      - Levanta los pies del suelo de modo que los muslos queden perpendiculares al suelo
      - Coloca los brazos junto al cuerpo con las palmas hacia abajo como apoyo
      - Presiona la zona lumbar contra la colchoneta y activa el core
      - Mantén la cabeza y la parte alta de la espalda relajadas sobre la colchoneta

      ### 2. Movimiento
      1. Despega las caderas de la colchoneta contrayendo la parte baja del abdomen
      2. Enrolla la pelvis hacia la caja torácica, llevando las rodillas hacia el pecho
      3. Concéntrate en elevar las caderas con los abdominales, no con impulso
      4. Haz una breve pausa arriba cuando las caderas estén completamente elevadas
      5. Baja lentamente las caderas a la posición inicial con control
      6. Detente justo antes de que los pies toquen el suelo para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala mientras elevas las caderas y enrollas la pelvis
      - Inhala mientras bajas a la posición inicial

      ### 4. Consejos
      - Concéntrate en enrollar la pelvis en lugar de solo subir las piernas
      - Mantén la zona lumbar presionada contra la colchoneta en todo momento
      - Muévete despacio y con control para maximizar la activación abdominal
      - Usa las manos solo para equilibrarte, no para empujarte
      - Mantén tensión constante en los abdominales sin relajarte por completo entre repeticiones

      ### 5. Errores comunes
      - Usar impulso para balancear las piernas en lugar de una contracción controlada
      - No despegar las caderas de la colchoneta, moviendo solo las piernas
      - Dejar que la zona lumbar se arquee durante el movimiento
      - Moverse demasiado rápido y sacrificar la técnica
      - Empujar con los brazos en lugar de usar el core
      - Relajarse por completo entre repeticiones, perdiendo la tensión del core

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden reducir el rango de movimiento sin acercar tanto las rodillas al pecho
      - Coloca las manos bajo los glúteos para dar soporte adicional a la zona lumbar
      - Variante avanzada: sujeta un balón medicinal entre las rodillas para añadir resistencia
      - Si sientes molestias en la zona lumbar, concéntrate en movimientos más pequeños con mejor control
