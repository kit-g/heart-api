  Glute Kickback (Machine):
    name: Patada de glúteo (máquina)
    instructions: |
      ## Resumen
      La patada de glúteo en máquina es un ejercicio de aislamiento que trabaja principalmente los glúteos. También involucra los isquiotibiales, y utiliza una trayectoria guiada para aportar estabilidad y resistencia constante durante la extensión de cadera.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate en la máquina de patada de glúteo según su diseño
      - Apoya un pie en la plataforma con la rodilla flexionada
      - Agarra las asas para mantener la estabilidad
      - Mantén el torso estable y el core activado
      - Alinea la cadera que trabaja con el punto de giro de la máquina

      ### 2. Movimiento
      1. Empuja la plataforma hacia atrás extendiendo la cadera
      2. Mantén la rodilla ligeramente flexionada durante todo el movimiento
      3. Continúa hasta que la pierna quede totalmente extendida detrás de ti
      4. Aprieta el glúteo con fuerza en la extensión completa
      5. Devuelve lentamente la plataforma a la posición inicial con control
      6. Completa todas las repeticiones de un lado y luego cambia al otro

      ### 3. Respiración
      - Exhala al extender la pierna hacia atrás
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Concéntrate en impulsar el movimiento con el glúteo
      - Mantén el torso estable y evita arquear la espalda
      - Aprieta el glúteo con fuerza en la extensión completa
      - Controla tanto la fase de extensión como la de retorno
      - Mantén la tensión constante sin dejar que la placa de peso descanse

      ### 5. Errores comunes
      - Arquear la zona lumbar en exceso durante la patada
      - Usar impulso en lugar de una contracción controlada del glúteo
      - No lograr la extensión completa de la cadera
      - Dejar que la placa de peso descanse entre repeticiones
      - Rotar las caderas o el torso durante el movimiento
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Ajusta la máquina a tu cuerpo
      - Empieza con poco peso para asentar la técnica
      - Concéntrate en apretar el glúteo más que en patear alto
      - Variación avanzada: haz una pausa de 2-3 segundos en la extensión completa
