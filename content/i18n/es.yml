  Incline Curl (Dumbbell):
    name: Curl en banco inclinado (mancuernas)
    instructions: |
      ## Resumen
      El curl con mancuernas en banco inclinado es un ejercicio de aislamiento que trabaja principalmente el bíceps braquial con un rango de movimiento ampliado. También involucra el braquial y el braquiorradial, usando la posición inclinada para crear un mayor estiramiento del bíceps al inicio de cada repetición.

      ## Ejecución
      ### 1. Posición inicial
      - Ajusta un banco regulable a una inclinación de 45-60 grados
      - Siéntate en el banco con la espalda firmemente apoyada en el respaldo
      - Sostén una mancuerna en cada mano con los brazos colgando rectos
      - Mantén las palmas hacia delante y los codos ligeramente por detrás del torso
      - Mantén el pecho erguido y el core activado

      ### 2. Movimiento
      1. Sube ambas mancuernas flexionando los codos y contrayendo los bíceps
      2. Mantén la parte superior de los brazos inmóvil y perpendicular al suelo
      3. Continúa subiendo hasta que las mancuernas lleguen a la altura de los hombros
      4. Haz una pausa y aprieta los bíceps en la parte alta del movimiento
      5. Baja lentamente las mancuernas a la posición inicial hasta la extensión completa
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir las mancuernas
      - Inhala al bajar las mancuernas

      ### 4. Consejos
      - Mantén la parte superior de los brazos inmóvil y perpendicular al suelo en todo momento
      - Deja que los brazos se extiendan por completo abajo para un estiramiento máximo
      - Evita balancearte o usar impulso para levantar el peso
      - Mantén la espalda firmemente apoyada contra el banco
      - Concéntrate en el estiramiento abajo y en apretar arriba

      ### 5. Errores comunes
      - Dejar que los codos se desplacen hacia delante durante el curl
      - No lograr la extensión completa de los brazos abajo
      - Despegar los hombros del banco
      - Usar impulso o balancear las mancuernas
      - Elegir una inclinación demasiado pronunciada o demasiado plana
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Empieza con menos peso que en el curl tradicional debido al rango ampliado
      - Ajusta el ángulo del banco entre 45 y 60 grados para encontrar tu posición óptima
      - Realiza curls alternos (un brazo a la vez) para mayor concentración
      - Variante avanzada: añade una fase negativa de 3 a 5 segundos para mayor intensidad
