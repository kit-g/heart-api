  Chest Press (Machine):
    name: Press de pecho (máquina)
    instructions: |
      ## Resumen
      El press de pecho en máquina es un ejercicio de empuje guiado que trabaja principalmente el pectoral mayor. También involucra los deltoides frontales y los tríceps, y utiliza un recorrido fijo que aporta estabilidad y una resistencia constante durante todo el movimiento de empuje.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de press de pecho con la espalda firme contra el respaldo
      - Ajusta la altura del asiento para que las asas queden a la altura de la mitad del pecho
      - Sujeta las asas con ambas manos
      - Apoya los pies planos en el suelo y activa el core
      - Mantén las escápulas retraídas contra el respaldo

      ### 2. Movimiento
      1. Empuja las asas hacia delante extendiendo los brazos
      2. Mantén la espalda firme contra el respaldo en todo momento
      3. Continúa hasta extender por completo los brazos
      4. Haz una breve pausa en la extensión completa
      5. Devuelve lentamente las asas a la posición inicial con control
      6. Detente justo antes de que la carga se apoye para mantener la tensión y repite

      ### 3. Respiración
      - Exhala al empujar las asas hacia delante
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén la espalda firmemente apoyada contra el respaldo
      - Mantén la retracción escapular en todo momento
      - Controla tanto la fase de empuje como la de retorno
      - Mantén la tensión constante sin dejar que la carga se apoye
      - Concéntrate en contraer el pecho en la extensión completa

      ### 5. Errores comunes
      - Despegar la espalda del respaldo durante el empuje
      - Usar impulso en lugar de una contracción muscular controlada
      - Dejar que la carga se apoye entre repeticiones
      - No completar el rango completo de movimiento
      - Dejar que los hombros se adelanten
      - Moverse demasiado rápido en las repeticiones

      ### 6. Seguridad y modificaciones
      - Ajusta la altura del asiento para que las asas queden a la altura del pecho
      - Empieza con poco peso para establecer una técnica correcta
      - Prueba distintas posiciones de agarre si la máquina lo permite
      - Variante avanzada: haz una pausa de 2 a 3 segundos en la extensión completa
