      - Ponte de pie con los pies separados al ancho de las caderas, sosteniendo una mancuerna en cada mano
      - Coloca las mancuernas delante de los muslos con las palmas hacia el cuerpo
      - Mantente erguido con el pecho arriba, los hombros atrás y el core activado
      - Mantén solo una flexión muy ligera de rodillas durante todo el ejercicio

      ### 2. Movimiento
      1. Haz una bisagra de cadera empujando las caderas hacia atrás y bajando las mancuernas
      2. Mantén la espalda plana y las mancuernas pegadas a las piernas
      3. Mantén las piernas casi rectas, con una flexión mínima de rodillas
      4. Baja hasta sentir un estiramiento en los isquiotibiales, normalmente a media espinilla
      5. Lleva las caderas hacia adelante para volver a la posición inicial
      6. Aprieta los glúteos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala mientras bajas las mancuernas
      - Exhala mientras llevas las caderas hacia adelante para incorporarte

      ### 4. Consejos
      - Mantén las piernas casi rectas durante todo el movimiento
      - Concéntrate en la bisagra de cadera, no en hacer una sentadilla
      - Mantén la espalda plana y el pecho erguido durante todo el ejercicio
      - Empuja las caderas hacia atrás tanto como puedas
      - Siente el estiramiento en los isquiotibiales en la posición más baja

      ### 5. Errores comunes
      - Redondear la espalda en lugar de mantener la columna plana
      - Flexionar demasiado las rodillas, convirtiéndolo en un peso muerto rumano
      - No empujar las caderas lo suficientemente atrás
      - Bajar las mancuernas demasiado, más allá del punto de estiramiento de los isquiotibiales
      - Usar demasiado peso y comprometer la técnica
      - Mirar hacia arriba en lugar de mantener el cuello en posición neutra

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas ligeras para dominar la bisagra de cadera con las piernas rectas
      - Progresa desde el peso muerto rumano si esta variante te resulta demasiado intensa
      - La variante con mancuernas permite un agarre más natural que la barra
      - Si sientes molestias en la zona lumbar, reduce el peso y revisa tu técnica
