  Lat Pulldown - Underhand (Cable):
    name: Jalón al pecho con agarre supino (polea)
    instructions: |
      ## Resumen
      El jalón al pecho con agarre supino en polea es un ejercicio de tracción en máquina que trabaja principalmente el dorsal ancho con mayor activación de los bíceps. También involucra los romboides y el trapecio medio, y usa un agarre supino para enfatizar la parte baja de los dorsales y los músculos internos de la espalda.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la estación de jalón con los muslos sujetos bajo los soportes
      - Sujeta la barra con agarre supino (palmas hacia ti), con las manos al ancho de hombros
      - Extiende los brazos por completo por encima de la cabeza manteniendo la tensión en la polea
      - Mantén el pecho arriba y los hombros abajo
      - Activa el core y mantén el torso erguido

      ### 2. Movimiento
      1. Tira de la barra hacia la parte alta del pecho llevando los codos hacia abajo y atrás
      2. Mantén el torso erguido durante todo el movimiento
      3. Continúa hasta que la barra llegue a la parte alta del pecho o a la clavícula
      4. Junta las escápulas en la parte baja
      5. Devuelve la barra lentamente a la posición inicial con control
      6. Detente justo antes de que las placas se apoyen para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala al tirar de la barra hacia abajo
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - El agarre supino permite que los codos se mantengan más cerca del cuerpo
      - Concéntrate en activar los dorsales, no solo en tirar con los bíceps
      - Mantén el pecho arriba y los hombros atrás en todo momento
      - Mantén la tensión constante sin dejar que las placas se apoyen
      - Controla el peso durante todo el rango de movimiento

      ### 5. Errores comunes
      - Depender demasiado de los bíceps en lugar de la espalda
      - Inclinarse demasiado hacia atrás durante la tracción
      - No completar el rango completo de movimiento
      - Encoger los hombros hacia arriba
      - Dejar que las placas se apoyen entre repeticiones
      - Usar impulso para bajar el peso

      ### 6. Seguridad y modificaciones
      - Empieza con menos peso que en tu jalón con agarre prono
      - Ajusta la altura del asiento para extender bien los brazos
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte baja de cada repetición
      - Prueba un agarre más estrecho para variar el énfasis muscular
