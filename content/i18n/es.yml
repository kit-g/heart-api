      - Siéntate en la máquina de press de hombros de carga con discos con la espalda contra el respaldo
      - Ajusta la altura del asiento para que las empuñaduras queden a la altura de tus hombros
      - Sujeta las empuñaduras con las palmas hacia adelante
      - Apoya los pies planos en el suelo y activa el core
      - Mantén la espalda pegada al respaldo

      ### 2. Movimiento
      1. Empuja las empuñaduras en línea recta por encima de la cabeza extendiendo los brazos
      2. Continúa empujando hasta que los brazos queden completamente extendidos
      3. Haz una pausa breve arriba
      4. Baja lentamente las empuñaduras de nuevo a la altura de los hombros con control
      5. Detente justo antes de que los discos toquen, para mantener la tensión
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras empujas las empuñaduras por encima de la cabeza
      - Inhala mientras las bajas

      ### 4. Consejos
      - Mantén la espalda firmemente apoyada contra el respaldo
      - El diseño de carga con discos permite un movimiento independiente de cada brazo
      - Concéntrate en el rango completo de movimiento
      - Controla tanto la fase de empuje como la de bajada
      - Mantén tensión constante sin dejar que los discos descansen

      ### 5. Errores comunes
      - Despegar la espalda del respaldo durante el empuje
      - No alcanzar la extensión completa arriba
      - Dejar que un brazo domine el movimiento
      - Dejar que los discos descansen entre repeticiones
      - Arquear la zona lumbar en exceso
      - Ejecutar las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Ajusta la altura del asiento para asegurar una alineación correcta de las empuñaduras
      - Empieza con discos ligeros para establecer una técnica correcta
      - Trabaja un brazo a la vez para corregir desequilibrios
      - Si sientes molestias en el hombro, reduce el peso o revisa la posición
