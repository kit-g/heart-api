  Jump Squat:
    name: Sentadilla con salto
    instructions: |
      ## Resumen
      La sentadilla con salto es un ejercicio pliométrico que trabaja principalmente los cuádriceps, los glúteos y las pantorrillas. También activa los isquiotibiales y el core, mediante un salto explosivo desde la posición de sentadilla para desarrollar potencia del tren inferior y resistencia cardiovascular.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros
      - Mantén el pecho erguido y el core activado
      - Coloca los brazos a los lados o delante de ti
      - Mantén una buena postura en todo momento

      ### 2. Movimiento
      1. Baja a una sentadilla flexionando rodillas y caderas
      2. Desciende hasta que los muslos queden al menos paralelos al suelo
      3. Salta hacia arriba de forma explosiva, extendiendo caderas, rodillas y tobillos
      4. Balancea los brazos hacia arriba para generar impulso
      5. Aterriza suavemente con las rodillas flexionadas para absorber el impacto
      6. Desciende de inmediato a la siguiente sentadilla y repite

      ### 3. Respiración
      - Inhala al descender a la sentadilla
      - Exhala de forma explosiva al saltar

      ### 4. Consejos
      - Concéntrate en la potencia explosiva al saltar hacia arriba
      - Aterriza suavemente con las rodillas flexionadas para absorber el impacto
      - Mantén el pecho erguido durante todo el movimiento
      - Usa los brazos para generar impulso
      - Mantén el control durante todo el movimiento

      ### 5. Errores comunes
      - Aterrizar con las piernas rectas, lo que aumenta el riesgo de lesión
      - No descender lo suficiente antes de saltar
      - Dejar que las rodillas se metan hacia dentro al aterrizar
      - Usar impulso sin control
      - No extenderse por completo durante la fase de salto
      - Aterrizar con demasiada fuerza en lugar de hacerlo suavemente

      ### 6. Seguridad y modificaciones
      - Empieza con sentadillas con peso corporal para dominar la técnica antes de añadir los saltos
      - Realiza el ejercicio sobre una superficie más blanda para reducir el impacto
      - Reduce la altura del salto si sientes molestias en rodillas o tobillos
      - Variante avanzada: añade un chaleco lastrado o sostén mancuernas
    validated: false
