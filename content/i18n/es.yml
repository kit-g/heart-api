  Flat Knee Raise:
    name: Elevación de rodillas tumbado
    instructions: |
      ## Resumen
      La elevación de rodillas tumbado es un ejercicio de core con el peso corporal que trabaja principalmente la porción inferior del recto abdominal y los flexores de cadera. También involucra el transverso abdominal y los oblicuos como estabilizadores, lo que la convierte en una puerta de entrada accesible para desarrollar la fuerza del abdomen inferior.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba sobre una colchoneta con las piernas extendidas
      - Coloca las manos junto a las caderas o bajo los glúteos como apoyo
      - Presiona la zona lumbar contra la colchoneta y activa el core
      - Mantén la cabeza y los hombros relajados sobre la colchoneta
      - Conserva el cuello en posición neutra mirando al techo

      ### 2. Movimiento
      1. Flexiona las rodillas y elévalas hacia el pecho contrayendo la parte baja del abdomen
      2. Continúa hasta que las rodillas queden directamente sobre las caderas o un poco más allá
      3. Mantén la zona lumbar presionada contra la colchoneta durante todo el movimiento
      4. Haz una breve pausa en la parte alta del movimiento
      5. Baja lentamente las rodillas con control
      6. Detente justo antes de que los pies toquen el suelo para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala mientras elevas las rodillas hacia el pecho
      - Inhala mientras bajas las rodillas a la posición inicial

      ### 4. Consejos
      - Concéntrate en elevar las rodillas con la parte baja del abdomen, no solo con los flexores de cadera
      - Mantén la zona lumbar presionada contra la colchoneta para proteger la columna
      - Muévete despacio y con control durante todo el rango de movimiento
      - Mantén tensión constante sin dejar que los pies toquen el suelo entre repeticiones
      - Mantén el tren superior relajado para evitar tensión en el cuello

      ### 5. Errores comunes
      - Dejar que la zona lumbar se arquee y se despegue de la colchoneta
      - Usar impulso para subir las piernas en lugar de una contracción controlada
      - Moverse demasiado rápido y sacrificar la técnica
      - Dejar que los pies toquen el suelo por completo entre repeticiones
      - Tensar el cuello o el tren superior innecesariamente
      - Contener la respiración durante el movimiento

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden hacer elevaciones más pequeñas, sin subir tanto las rodillas
      - Coloca las manos bajo los glúteos para dar soporte adicional a la zona lumbar
      - Variante avanzada: haz una pausa de 2-3 segundos en la parte alta de cada repetición
      - Progresa a la elevación de piernas tumbado cuando domines la elevación de rodillas con buena técnica
