  Bench Press - Wide Grip (Barbell):
    name: Press de banca con agarre amplio (barra)
    instructions: |
      ## Resumen
      El press de banca con agarre amplio con barra es un ejercicio compuesto de empuje que trabaja principalmente la parte externa del pectoral mayor. También involucra los deltoides frontales y los tríceps, y utiliza una colocación de manos más amplia para enfatizar la amplitud del pecho y reducir la participación de los tríceps.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en un banco plano con los pies firmemente apoyados en el suelo
      - Colócate de modo que los ojos queden justo debajo de la barra
      - Sujeta la barra con las manos bastante más separadas que el ancho de los hombros
      - Desengancha la barra y sostenla con los brazos completamente extendidos sobre el pecho
      - Mantén las escápulas retraídas y presionadas contra el banco

      ### 2. Movimiento
      1. Baja la barra lentamente hasta la parte media o alta del pecho
      2. Mantén los codos más abiertos que en un press estándar
      3. Toca ligeramente el pecho con la barra
      4. Haz una breve pausa abajo
      5. Empuja la barra hacia arriba extendiendo los brazos
      6. Extiende por completo los codos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la barra al pecho
      - Exhala al empujar la barra hacia arriba

      ### 4. Consejos
      - El agarre más amplio reduce el rango de movimiento pero aumenta el estiramiento del pecho
      - Mantén las escápulas retraídas en todo momento
      - Concéntrate en contraer el pecho arriba
      - Conserva el arco natural de la zona lumbar
      - Mantén las muñecas rectas a pesar del agarre más amplio

      ### 5. Errores comunes
      - Usar un agarre demasiado amplio que fuerza los hombros
      - Rebotar la barra en el pecho
      - No lograr un estiramiento completo del pecho abajo
      - Levantar los glúteos del banco
      - Usar demasiado peso y comprometer la técnica
      - Perder la retracción escapular

      ### 6. Seguridad y modificaciones
      - Usa siempre un ayudante cuando levantes pesos altos
      - Empieza con menos peso que en tu press de banca habitual
      - Amplía el agarre de forma gradual hasta encontrar tu posición óptima
      - Si sientes molestias en los hombros, cierra un poco el agarre
