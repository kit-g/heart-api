  Back Extension (Machine):
    name: Hiperextensiones (máquina)
    instructions: |
      ## Resumen
      Las hiperextensiones en máquina son un ejercicio con resistencia que trabaja principalmente los erectores espinales y los músculos de la zona lumbar. También involucran los glúteos y los isquiotibiales, y ofrecen un soporte guiado y una resistencia ajustable para fortalecer la zona lumbar de forma segura y eficaz.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de hiperextensiones con la espalda contra el cojín
      - Ajusta la altura del cojín para que se apoye cómodamente contra la parte media o alta de la espalda
      - Asegura los pies en el reposapiés o bajo los soportes
      - Cruza los brazos sobre el pecho o sujeta las empuñaduras
      - Selecciona un peso adecuado en la torre

      ### 2. Movimiento
      1. Empuja hacia atrás contra el cojín extendiendo la columna y las caderas
      2. Continúa hasta que la espalda quede recta o ligeramente extendida
      3. Mantén el core activado y el movimiento controlado
      4. Haz una pausa breve en la extensión completa
      5. Regresa lentamente a la posición inicial con control
      6. Detente justo antes de que la placa toque la torre de pesas para mantener la tensión y repite

      ### 3. Respiración
      - Exhala al extender la espalda contra el cojín
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén el core activado durante todo el movimiento
      - Evita hiperextender la columna en exceso
      - Concéntrate en un movimiento suave y controlado en ambas direcciones
      - Mantén la tensión constante sin dejar que la torre de pesas descanse
      - Mantén los pies firmemente apoyados en todo momento

      ### 5. Errores comunes
      - Usar demasiado peso y comprometer la técnica
      - Hiperextender la columna en exceso
      - Usar impulso en lugar de una contracción muscular controlada
      - Dejar que la torre de pesas descanse entre repeticiones
      - Arquear el cuello en lugar de mantener una alineación neutra
      - Recorrer el rango de movimiento demasiado rápido

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la técnica y el control
      - Ajusta la altura del cojín para posicionar bien la espalda
      - Variación avanzada: haz una pausa de 2-3 segundos en la extensión completa
      - Si sientes molestias, reduce el peso y comprueba la alineación del cojín
