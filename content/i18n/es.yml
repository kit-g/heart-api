  Squat (Band):
    name: Sentadilla (banda)
    instructions: |
      ## Resumen
      La sentadilla con banda es un ejercicio compuesto con resistencia que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También activa el core, usando la resistencia progresiva de la banda para enseñar una mecánica de sentadilla correcta con menos carga y tensión constante.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros, pisando el centro de una banda
      - Sujeta las asas de la banda a la altura de los hombros o pasa la banda sobre tus hombros
      - Mantén el pecho erguido, el core activado y la mirada al frente
      - Mantén una buena postura en todo momento

      ### 2. Movimiento
      1. Inicia la sentadilla flexionando rodillas y caderas a la vez
      2. Mantén el pecho erguido y el peso sobre los talones
      3. Desciende hasta que los muslos queden al menos paralelos al suelo
      4. Haz una breve pausa abajo
      5. Empuja con los talones para volver a la posición de pie
      6. Extiende por completo caderas y rodillas arriba y repite

      ### 3. Respiración
      - Inhala al descender a la sentadilla
      - Exhala al empujar de vuelta arriba

      ### 4. Consejos
      - La banda ofrece una resistencia creciente a medida que te incorporas
      - Mantén las rodillas alineadas sobre los dedos de los pies
      - Mantén el torso erguido en todo momento
      - Empuja con todo el pie, no solo con las puntas
      - Concéntrate en un movimiento controlado en ambas direcciones

      ### 5. Errores comunes
      - Dejar que las rodillas se metan hacia dentro
      - No lograr la profundidad adecuada
      - Subir sobre las puntas en lugar de mantener el peso en los talones
      - Redondear la espalda durante el descenso
      - Usar impulso en lugar de un movimiento controlado
      - No mantener tensión constante en la banda

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar el patrón de movimiento
      - Ajusta la posición de los pies sobre la banda para modificar la resistencia
      - Usa esta variante para aprender la mecánica de la sentadilla antes de progresar a la barra
      - Variante avanzada: usa una banda de mayor resistencia o añade una pausa abajo
