  Upright Row (Smith Machine):
    name: Remo al mentón (máquina Smith)
    instructions: |
      ## Resumen
      El remo al mentón en máquina Smith es un ejercicio de tirón que trabaja principalmente los hombros y la parte alta de la espalda, en especial los deltoides laterales y los trapecios. Los bíceps asisten, y la trayectoria fija de la barra mantiene el movimiento estable para que puedas concentrarte en el tirón.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca la barra aproximadamente a la altura de las caderas y cárgala con poco peso
      - Ponte de pie cerca de la barra con los pies al ancho de hombros
      - Sujeta la barra con agarre prono, con las manos aproximadamente al ancho de hombros
      - Saca la barra del soporte y deja que cuelgue con los brazos extendidos

      ### 2. Movimiento
      1. Tira de la barra en línea recta hacia arriba por los rieles, hacia la clavícula
      2. Guía el movimiento con los codos, manteniéndolos más altos que las muñecas
      3. Detente cuando los codos lleguen aproximadamente a la altura de los hombros
      4. Baja la barra lentamente con control
      5. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras tiras hacia arriba
      - Inhala mientras bajas

      ### 4. Consejos
      - Mantén la barra cerca de tu cuerpo en todo momento
      - Mantén el torso erguido; evita inclinarte hacia atrás
      - Un agarre un poco más amplio suele ser más cómodo para los hombros

      ### 5. Errores comunes
      - Tirar de la barra demasiado alto, por encima de la clavícula
      - Balancear el cuerpo para subir el peso a tirones
      - Usar un agarre demasiado cerrado, que puede pinzar los hombros

      ### 6. Seguridad y modificaciones
      - Detén el tirón más abajo si sientes cualquier pinzamiento en el hombro
      - Empieza con la barra sin discos para asimilar la trayectoria
