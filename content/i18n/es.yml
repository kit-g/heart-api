  Reverse Curl (Band):
    name: Curl invertido (banda)
    instructions: |
      ## Resumen
      El curl invertido con banda es un ejercicio de aislamiento que trabaja principalmente el braquiorradial y el braquial. También involucra el bíceps braquial y los extensores del antebrazo, usando un agarre prono para enfatizar el desarrollo del antebrazo con resistencia progresiva.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de pie con los pies separados al ancho de las caderas, pisando el centro de una banda
      - Sujeta cada extremo de la banda con agarre prono (palmas hacia abajo)
      - Deja que los brazos cuelguen a los costados con una ligera tensión en la banda
      - Mantén los codos pegados a los costados en todo momento
      - Mantén una postura erguida con el core activado

      ### 2. Movimiento
      1. Sube la banda flexionando los codos mientras mantienes las palmas hacia abajo
      2. Mantén la parte superior de los brazos inmóvil y fija a los costados
      3. Continúa subiendo hasta que los antebrazos queden casi verticales
      4. Haz una pausa y aprieta en la parte alta del movimiento
      5. Baja lentamente las manos a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir la banda
      - Inhala al bajar las manos

      ### 4. Consejos
      - Mantén el agarre prono durante todo el movimiento
      - Mantén los codos inmóviles y pegados al cuerpo
      - Evita balancearte o usar impulso para subir la banda
      - Concéntrate en apretar los antebrazos en la parte alta
      - Controla la resistencia tanto en la subida como en la bajada

      ### 5. Errores comunes
      - Dejar que las muñecas se flexionen hacia arriba en lugar de mantenerlas alineadas
      - Dejar que los codos se desplacen hacia delante durante el curl
      - Usar impulso o balancear el cuerpo para subir la banda
      - No mantener la tensión constante en la banda
      - Apretar demasiado el agarre y generar tensión innecesaria
      - Moverse demasiado rápido en las repeticiones

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar el patrón de agarre prono
      - Mantén las muñecas en posición neutra para evitar molestias
      - Variante avanzada: usa una banda de mayor resistencia o haz una pausa arriba
      - Ajusta la posición de los pies sobre la banda para modificar el nivel de resistencia
