  Bicep Curl (Cable):
    name: Curl de bíceps (polea)
    instructions: |
      ## Resumen
      El curl de bíceps en polea es un ejercicio de aislamiento que trabaja principalmente el bíceps braquial con tensión constante durante todo el movimiento. También involucra el braquial y el braquiorradial, ofreciendo una curva de resistencia más suave que los pesos libres para una activación muscular continua.

      ## Ejecución
