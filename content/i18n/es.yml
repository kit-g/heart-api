    instructions: |
      ## Resumen
      El buenos días con barra es un ejercicio de bisagra de cadera que trabaja principalmente los erectores espinales, los glúteos y los isquiotibiales. También involucra el core y la parte superior de la espalda como estabilizadores, lo que lo hace eficaz para fortalecer la cadena posterior y mejorar la mecánica de la bisagra de cadera.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca una barra sobre la parte superior de la espalda, como lo harías para una sentadilla
      - Ponte de pie con los pies separados entre el ancho de las caderas y el de los hombros
      - Sujeta la barra con las manos algo más separadas que el ancho de los hombros
      - Mantén el pecho erguido, el core activado y las rodillas ligeramente flexionadas
      - Mantén la columna neutra en todo momento

      ### 2. Movimiento
      1. Haz una bisagra de cadera llevando las caderas hacia atrás
      2. Mantén la espalda plana y el core firme mientras bajas el torso
      3. Continúa hasta que el torso quede casi paralelo al suelo o sientas un estiramiento en los isquiotibiales
      4. Mantén una ligera flexión de rodillas en todo momento
      5. Lleva las caderas hacia adelante para volver a la posición inicial
      6. Aprieta los glúteos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al inclinarte hacia adelante
      - Exhala al llevar las caderas hacia adelante para incorporarte

      ### 4. Consejos
      - Concéntrate en el movimiento de bisagra de cadera, no en hacer una sentadilla
      - Mantén la espalda plana y el pecho erguido en todo momento
      - Lleva las caderas hacia atrás tanto como puedas
      - Mantén la barra bien asegurada sobre la parte superior de la espalda
      - Controla el descenso y evita bajar de golpe

      ### 5. Errores comunes
      - Redondear la espalda en lugar de mantener la columna plana
      - Flexionar demasiado las rodillas y convertirlo en una sentadilla
      - No llevar las caderas suficientemente hacia atrás
      - Usar demasiado peso y comprometer la técnica
      - Moverse demasiado rápido y perder el control
      - Hiperextender la espalda arriba

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso o solo la barra para dominar la bisagra de cadera
      - Mantén las rodillas ligeramente flexionadas para proteger los isquiotibiales
      - Realízalo con mancuernas a los costados si la barra te resulta inestable
      - Si sientes molestias en la zona lumbar, reduce el peso y asegúrate de que la técnica sea correcta
