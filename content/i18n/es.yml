      ## Resumen
      Las aperturas con mancuernas son un ejercicio de aislamiento que trabaja principalmente el pectoral mayor. También involucran los deltoides frontales como estabilizadores, y utilizan mancuernas para crear un arco de movimiento amplio que estira y contrae los músculos del pecho.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en un banco plano con los pies firmemente apoyados en el suelo
      - Sostén una mancuerna en cada mano con los brazos extendidos sobre el pecho
      - Coloca las mancuernas con las palmas enfrentadas
      - Mantén una ligera flexión de codos en todo momento
      - Mantén las escápulas retraídas y presionadas contra el banco

      ### 2. Movimiento
      1. Baja ambas mancuernas hacia los lados en un arco amplio
      2. Mantén los codos ligeramente flexionados durante todo el movimiento
      3. Continúa bajando hasta sentir un estiramiento en el pecho
      4. Haz una breve pausa abajo
      5. Vuelve a juntar las mancuernas sobre el pecho, como en un abrazo
      6. Contrae el pecho arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar las mancuernas hacia los lados
      - Exhala al volver a juntar las mancuernas

      ### 4. Consejos
      - Mantén una ligera flexión de codos constante en todo momento
      - Concéntrate en el estiramiento abajo y la contracción arriba
      - Mantén la retracción escapular durante todo el movimiento
      - Imagina que abrazas un árbol grande durante el movimiento
      - Controla el peso durante todo el arco

      ### 5. Errores comunes
      - Estirar por completo los brazos, convirtiéndolo en un press
      - Doblar demasiado los codos y reducir el trabajo del pecho
      - Bajar demasiado las mancuernas y forzar los hombros
      - Usar demasiado peso y perder el arco del movimiento
      - Rebotar las mancuernas abajo
      - No contraer el pecho en la parte superior del movimiento

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas ligeras para dominar el arco del movimiento
      - Mantén los codos ligeramente flexionados para proteger las articulaciones de los hombros
      - Realízalas en banco inclinado o declinado para variar
      - Variante avanzada: haz una pausa de 2 a 3 segundos en el estiramiento abajo
