  Heart Pump:
    name: Heart Pump
    instructions: |
      ## Resumen
      El heart pump es un ejercicio dinámico con mancuernas que trabaja principalmente los bíceps y los antebrazos mediante un bombeo continuo. También involucra los hombros y la fuerza de agarre, usando un patrón de movimiento rítmico que mantiene una tensión constante para la resistencia muscular.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de pie con los pies separados al ancho de las caderas, sosteniendo las mancuernas a los costados
      - Mantén los codos pegados al cuerpo y el core activado
      - Sostén las mancuernas con agarre neutro (palmas mirando hacia tu cuerpo)
      - Mantén una postura erguida con los hombros hacia atrás
      - Prepárate para un movimiento continuo sin descansos

      ### 2. Movimiento
      1. Sube ambas mancuernas a la vez con pulsos cortos y rápidos
      2. Muévete en un rango parcial, bombeando desde la mitad del recorrido hasta cerca de la parte alta
      3. Mantén los codos inmóviles y una tensión constante
      4. Continúa el bombeo rítmico durante el tiempo o número de repeticiones objetivo
      5. Concéntrate en mantener el movimiento controlado y continuo
      6. Termina bajando las mancuernas a la posición inicial

      ### 3. Respiración
      - Respira de forma constante y natural durante todo el movimiento continuo
      - Evita contener la respiración; mantén un ritmo respiratorio consistente

      ### 4. Consejos
      - Mantén el movimiento rápido pero controlado, sin tirones
      - Mantén una tensión constante en los bíceps en todo momento
      - Concéntrate en la congestión y el ardor en los brazos
      - Mantén el core firme para evitar balancearte
      - Usa menos peso que en un curl tradicional por el carácter continuo del ejercicio

      ### 5. Errores comunes
      - Usar demasiado peso y perder el ritmo de bombeo
      - Balancear el cuerpo o usar impulso
      - Moverse en el rango completo en lugar de pulsos parciales enfocados
      - Dejar que los codos se desplacen hacia delante
      - Contener la respiración durante el ejercicio
      - Pausar o descansar durante la serie

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas ligeras para dominar el bombeo continuo
      - Reduce la duración si sientes fatiga excesiva
      - Variante avanzada: aumenta el ritmo o añade pausas en distintas posiciones
      - Realízalo sentado para eliminar el impulso del tren inferior
