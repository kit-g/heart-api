  Skating:
    name: Patinaje
    instructions: |
      ## Resumen
      El patinaje (sobre hielo, sobre ruedas o en línea) es una actividad cardiovascular que trabaja las piernas, los glúteos y el core. Desarrolla el equilibrio, la coordinación y la fuerza de las piernas, y proporciona un acondicionamiento aeróbico eficaz con un impacto relativamente bajo en las articulaciones.

      ## Ejecución
      ### 1. Posición inicial
      - Usa patines adecuados que se ajusten correctamente
      - Utiliza equipo de protección (casco, rodilleras, muñequeras)
      - Comienza en una postura estable y equilibrada
      - Mantén las rodillas ligeramente flexionadas
      - Mantén una postura atlética

      ### 2. Movimiento
      1. Impúlsate con una pierna en ángulo
      2. Deslízate sobre la pierna contraria
      3. Cambia el peso e impúlsate con la otra pierna
      4. Mantén un movimiento rítmico de lado a lado
      5. Mantén el core activado y las rodillas flexionadas
      6. Continúa patinando durante el tiempo deseado

      ### 3. Respiración
      - Respira de forma constante y rítmica durante toda la actividad
      - Ajusta el ritmo para mantener una respiración cómoda
      - Toma descansos si los necesitas mientras aprendes

      ### 4. Consejos
      - Flexiona las rodillas para mejorar el equilibrio y la potencia
      - Impúlsate hacia el lado, no directamente hacia atrás
      - Mantén el peso sobre los patines
      - Relájate y encuentra tu ritmo
      - Practica las técnicas de frenado antes de ganar velocidad

      ### 5. Errores comunes
      - Mantenerse demasiado erguido con las rodillas bloqueadas
      - Impulsarse directamente hacia atrás en lugar de hacia el lado
      - No usar el equipo de seguridad adecuado
      - Patinar por encima del nivel de habilidad actual
      - Mirar hacia los pies en lugar de hacia delante
      - Tensarse en lugar de mantenerse relajado

      ### 6. Seguridad y modificaciones
      - Usa siempre el equipo de protección adecuado
      - Aprende técnicas correctas de caída
      - Comienza en superficies lisas y planas
      - Toma clases con instructores cualificados para progresar más rápido
