  Hanging Knee Raise:
    name: Elevación de rodillas colgado
    instructions: |
      ## Resumen
      La elevación de rodillas colgado es un ejercicio de core con el peso corporal que trabaja principalmente la porción inferior del recto abdominal y los flexores de cadera. También involucra los oblicuos, el transverso abdominal y la fuerza de agarre al colgarte de una barra, por lo que resulta más exigente que las variantes en el suelo.

      ## Ejecución
      ### 1. Posición inicial
      - Cuélgate de una barra de dominadas con las manos a la anchura de los hombros y agarre prono
      - Deja el cuerpo completamente extendido con los pies sin tocar el suelo
      - Activa el core y mantén los hombros hacia abajo y atrás
      - Mantén las piernas juntas con una ligera flexión de rodillas
      - Evita el balanceo excesivo estabilizando el cuerpo

      ### 2. Movimiento
      1. Eleva las rodillas hacia el pecho contrayendo la parte baja del abdomen
      2. Continúa subiendo las rodillas hasta al menos la altura de las caderas o más
      3. Mantén el movimiento controlado y evita usar impulso
      4. Haz una breve pausa en la parte alta del movimiento
      5. Baja lentamente las rodillas a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras elevas las rodillas hacia el pecho
      - Inhala mientras bajas las rodillas a la posición inicial

      ### 4. Consejos
      - Concéntrate en iniciar el movimiento desde el core, no solo desde los flexores de cadera
      - Minimiza el balanceo manteniendo el core firme y el movimiento controlado
      - Mantén los hombros activos y evita colgarte de forma pasiva
      - Piensa en llevar las caderas hacia adelante y arriba, no solo las rodillas
      - Mantén una respiración constante para evitar contenerla

      ### 5. Errores comunes
      - Usar impulso y balancearse en lugar de una contracción muscular controlada
      - Elevar las rodillas solo parcialmente sin activar por completo el abdomen inferior
      - Dejar que los hombros se encojan hacia las orejas
      - Moverse demasiado rápido y perder el control
      - Aflojar la tensión del agarre, lo que compromete la técnica
      - No subir las rodillas lo suficiente para activar bien los abdominales

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden usar correas de muñeca para mejorar el agarre
      - Usa una silla romana o una estación de fondos para una versión con apoyo
      - Variante avanzada: haz una pausa de 2-3 segundos en la parte alta de cada repetición
      - Progresa a la elevación de piernas colgado cuando domines la elevación de rodillas con buena técnica
