  Wide Pull Up:
    name: Dominadas con agarre amplio
    instructions: |
      ## Resumen
      Las dominadas con agarre amplio son un ejercicio de tracción con peso corporal que trabaja principalmente el dorsal ancho con énfasis en la amplitud de la espalda. También involucran los romboides, el trapecio medio y los bíceps, y utilizan un agarre más amplio para trabajar la parte externa de los dorsales y construir una espalda más ancha.

      ## Ejecución
      ### 1. Posición inicial
      - Cuélgate de una barra de dominadas con agarre prono y las manos bastante más separadas que el ancho de los hombros
      - Deja el cuerpo completamente extendido con los brazos rectos
      - Activa el core y mantén los hombros hacia abajo
      - Cruza los tobillos o mantén las piernas rectas
      - Evita balancearte en exceso

      ### 2. Movimiento
      1. Súbete llevando los codos hacia abajo y hacia los lados
      2. Concéntrate en tirar con los dorsales y no con los brazos
      3. Continúa hasta que el mentón supere la barra
      4. Mantén el core firme durante todo el movimiento
      5. Haz una breve pausa arriba
      6. Baja lentamente a la posición inicial hasta extender por completo los brazos

      ### 3. Respiración
      - Exhala al subir
      - Inhala al bajar

      ### 4. Consejos
      - Mantén los codos más abiertos debido al ancho del agarre
      - Concéntrate en llevar los codos hacia abajo, hacia los costados
      - Saca el pecho y mantén una postura correcta
      - Controla el descenso para maximizar el trabajo muscular
      - Piensa en llevar los codos a los costados en lugar de las manos a la barra

      ### 5. Errores comunes
      - Usar un agarre demasiado amplio que limita el rango de movimiento
      - No completar el rango de movimiento arriba o abajo
      - Usar impulso o kipping en lugar de una técnica estricta
      - Dejar que los hombros se encojan hacia las orejas
      - No extender por completo los brazos abajo
      - Tirar solo con los brazos en lugar de activar los dorsales

      ### 6. Seguridad y modificaciones
