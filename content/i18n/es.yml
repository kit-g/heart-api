  Triceps Extension (Dumbbell):
    name: Extensión de tríceps (mancuernas)
    instructions: |
      ## Resumen
      La extensión de tríceps con mancuerna es un ejercicio de aislamiento que trabaja principalmente las tres cabezas del tríceps. También involucra los hombros y el core como estabilizadores, y utiliza una posición de la mancuerna por encima de la cabeza que permite un movimiento natural de los brazos y maximiza el estiramiento del tríceps.

      ## Ejecución
