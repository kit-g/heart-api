  Oblique Crunch:
    name: Crunch oblicuo
    instructions: |
      ## Resumen
      El crunch oblicuo es un ejercicio de core con el peso corporal que trabaja principalmente los oblicuos y el recto abdominal. También involucra el transverso abdominal como estabilizador, por lo que resulta eficaz para desarrollar fuerza y definición en la zona lateral del core.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate de lado sobre una colchoneta con las piernas apiladas o escalonadas para mayor estabilidad
      - Coloca el brazo de abajo en el suelo como apoyo o cruzado sobre el pecho
      - Coloca la mano de arriba suavemente detrás de la cabeza con el codo apuntando hacia arriba
      - Activa el core y mantén la columna neutra
      - Mantén las caderas apiladas y mirando al frente

      ### 2. Movimiento
      1. Eleva el hombro y la parte superior del torso hacia la cadera contrayendo los oblicuos
      2. Concéntrate en llevar la caja torácica hacia la cadera del mismo lado
      3. Aprieta los oblicuos en la parte alta del movimiento durante 1-2 segundos
      4. Baja lentamente a la posición inicial con control
      5. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Exhala mientras subes en el crunch y contraes los oblicuos
      - Inhala mientras bajas a la posición inicial

      ### 4. Consejos
      - Concéntrate en la flexión lateral desde los oblicuos, no en la flexión hacia adelante
      - Mantén las caderas estables y evita rotarlas
      - Muévete despacio y con control para maximizar la activación muscular
      - Evita tirar de la cabeza o el cuello con la mano
      - Mantén tensión constante en los oblicuos durante todo el movimiento

      ### 5. Errores comunes
      - Tirar del cuello o la cabeza, lo que puede causar sobrecarga
      - Rotar las caderas en lugar de aislar los oblicuos
      - Usar impulso en lugar de una contracción muscular controlada
      - No activar por completo los oblicuos en cada repetición
      - Moverse demasiado rápido y sacrificar la técnica
      - Olvidar repetir por igual en ambos lados

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden colocar ambas manos detrás de la cabeza para mayor apoyo
      - Variante avanzada: sostén un disco sobre el pecho para añadir resistencia
      - Si sientes molestias en el cuello, cruza el brazo de arriba sobre el pecho
      - Progresa añadiendo una pausa de 2-3 segundos en la contracción máxima
