  Bicep Curl (Dumbbell):
    name: Curl de bíceps (mancuernas)
    instructions: |
      ## Resumen
      El curl de bíceps con mancuernas es un ejercicio de aislamiento fundamental que trabaja principalmente el bíceps braquial. También involucra el braquial y el braquiorradial, y permite entrenar cada brazo de forma independiente con una rotación natural de la muñeca durante el movimiento.

