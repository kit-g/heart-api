  Incline Row (Dumbbell):
    name: Remo en banco inclinado (mancuernas)
    instructions: |
      ## Resumen
      El remo en banco inclinado con mancuernas es un ejercicio de tirón con apoyo del pecho que trabaja principalmente el dorsal ancho, los romboides y la porción media de los trapecios. También involucra los bíceps y los deltoides posteriores, y utiliza un banco inclinado que elimina la tensión en la zona lumbar y te permite concentrarte por completo en la contracción de la espalda.

      ## Ejecución
      ### 1. Posición inicial
      - Ajusta un banco regulable a una inclinación de 30-45 grados
      - Túmbate boca abajo en el banco con el pecho contra el respaldo
      - Sujeta una mancuerna en cada mano con los brazos colgando rectos hacia abajo
      - Mantén los pies apoyados en el suelo para estabilizarte
      - Activa el core y mantén la columna neutra

      ### 2. Movimiento
      1. Tira de ambas mancuernas hacia las caderas o la parte baja de las costillas
      2. Lleva los codos hacia atrás y arriba, manteniéndolos cerca del cuerpo
      3. Continúa hasta que las mancuernas lleguen al torso
      4. Junta las escápulas en la parte alta
      5. Baja lentamente las mancuernas a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al tirar de las mancuernas hacia arriba
      - Inhala al bajarlas de vuelta

      ### 4. Consejos
      - Mantén el pecho firmemente apoyado contra el banco
      - Guía el movimiento con los codos, no con las manos
      - Concéntrate en juntar las escápulas
      - Evita usar impulso o balancear las mancuernas
      - Controla el peso durante todo el rango de movimiento

      ### 5. Errores comunes
      - Levantar el pecho del banco durante el remo
      - Usar impulso para balancear las mancuernas hacia arriba
      - No lograr el rango completo de movimiento
      - Dejar que los codos se abran en exceso
      - Moverse demasiado rápido y perder el control
      - No juntar las escápulas en la parte alta

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas de peso moderado para dominar la posición con apoyo del pecho
      - Ajusta el ángulo del banco entre 30 y 60 grados para variar el énfasis muscular
      - Trabaja un brazo a la vez para un enfoque unilateral
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte alta de cada repetición
