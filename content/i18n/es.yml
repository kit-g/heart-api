  Stiff Leg Deadlift (Barbell):
    name: Peso muerto con piernas rígidas (barra)
    instructions: |
      ## Resumen
      El peso muerto con piernas rígidas con barra es un ejercicio de bisagra de cadera que trabaja principalmente los isquiotibiales y los erectores espinales. También involucra los glúteos y los dorsales como estabilizadores, y utiliza una flexión mínima de rodillas para enfatizar la cadena posterior y fortalecer la zona lumbar y los isquiotibiales.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas sosteniendo una barra con agarre prono
      - Coloca las manos justo por fuera de las piernas
      - Mantente erguido con la barra a la altura de las caderas
      - Mantén el pecho erguido, los hombros hacia atrás y el core activado
      - Conserva solo una flexión muy ligera de rodillas durante todo el ejercicio

      ### 2. Movimiento
      1. Haz una bisagra de cadera empujando las caderas hacia atrás y bajando la barra
      2. Mantén la espalda recta y la barra pegada a las piernas
      3. Mantén las piernas casi rectas, con una flexión mínima de rodillas
      4. Baja hasta sentir un estiramiento en los isquiotibiales, normalmente a media espinilla
      5. Empuja las caderas hacia delante para volver a la posición inicial
      6. Contrae los glúteos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la barra
      - Exhala al empujar las caderas hacia delante para incorporarte

      ### 4. Consejos
      - Mantén las piernas casi rectas durante todo el movimiento
      - Concéntrate en la bisagra de cadera, no en hacer una sentadilla
      - Mantén la espalda recta y el pecho erguido en todo momento
      - Empuja las caderas hacia atrás lo máximo posible
      - Siente el estiramiento en los isquiotibiales en la parte baja

      ### 5. Errores comunes
      - Redondear la espalda en lugar de mantener la columna recta
      - Doblar demasiado las rodillas, convirtiéndolo en un peso muerto rumano
      - No empujar las caderas lo suficientemente atrás
      - Bajar la barra más allá del punto de estiramiento de los isquiotibiales
      - Usar demasiado peso y comprometer la técnica
      - Mirar hacia arriba en lugar de mantener el cuello en posición neutra

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la bisagra de cadera con las piernas rectas
      - Progresa desde el peso muerto rumano si esta variante te resulta demasiado intensa
      - Realízalo con mancuernas si la barra te resulta inestable
      - Si sientes molestias en la zona lumbar, reduce el peso y asegúrate de mantener una técnica correcta
