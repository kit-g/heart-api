  Reverse Fly (Cable):
    name: Aperturas invertidas (polea)
    instructions: |
      ## Resumen
      Las aperturas invertidas en polea son un ejercicio de aislamiento que trabaja principalmente los deltoides posteriores y la parte alta de la espalda. También involucran los romboides y el trapecio medio, usando poleas que proporcionan tensión constante para mejorar el equilibrio del hombro, la postura y el desarrollo del deltoides posterior.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie centrado entre dos poleas ajustadas a la altura de los hombros
      - Cruza los brazos por delante y sujeta el agarre de la polea opuesta con cada mano
      - Da un pequeño paso atrás para crear tensión con los brazos extendidos
      - Mantén una ligera flexión de codos en todo momento
      - Mantente de pie con el pecho erguido y el core activado

      ### 2. Movimiento
      1. Tira de ambos agarres hacia los lados en un arco amplio
      2. Mantén los codos ligeramente flexionados durante todo el movimiento
      3. Concéntrate en juntar las escápulas
      4. Continúa hasta que los brazos queden extendidos a los lados
      5. Haz una pausa y contrae los deltoides posteriores al final
      6. Vuelve lentamente con los brazos a la posición cruzada inicial y repite

      ### 3. Respiración
      - Exhala mientras tiras de los agarres hacia los lados
      - Inhala mientras vuelves a la posición inicial

      ### 4. Consejos
      - Concéntrate en tirar con los deltoides posteriores y la parte alta de la espalda
      - Mantén los codos ligeramente flexionados en una posición fija
      - Junta las escápulas al final del movimiento
      - Mantén tensión constante sin dejar que la placa del peso se apoye
      - Mantén el torso estable y evita rotarlo

      ### 5. Errores comunes
      - Estirar los brazos por completo durante el movimiento
      - Usar impulso o balancear el peso
      - No juntar las escápulas
      - Rotar el torso en lugar de mantenerlo estable
      - Dejar que la placa del peso descanse entre repeticiones
      - Moverse demasiado rápido en las repeticiones

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón de movimiento
      - Ajusta la altura de las poleas para variar el ángulo de énfasis
      - Realízalo con un brazo a la vez para un trabajo unilateral
      - Si sientes molestias en el hombro, reduce el peso o el rango de movimiento
