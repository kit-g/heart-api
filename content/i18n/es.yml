  Box Jump:
    name: Salto al cajón
    instructions: |
      ## Resumen
      El salto al cajón es un ejercicio pliométrico que trabaja principalmente los cuádriceps, los glúteos y los gemelos. También involucra los isquiotibiales y el core, y utiliza saltos explosivos para desarrollar la potencia del tren inferior, la capacidad atlética y la coordinación.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie frente a un cajón o plataforma estable con los pies separados al ancho de las caderas
      - Colócate a la distancia de un brazo del cajón
      - Mantén el pecho erguido y el core activado
      - Flexiona ligeramente las rodillas y lleva los brazos hacia atrás
      - Prepárate para un salto explosivo

      ### 2. Movimiento
      1. Impulsa los brazos hacia adelante y salta de forma explosiva sobre el cajón
      2. Aterriza suavemente sobre el cajón con ambos pies a la vez
      3. Absorbe el impacto aterrizando en una posición de sentadilla parcial
      4. Ponte completamente de pie sobre el cajón
      5. Baja con cuidado, un pie a la vez
      6. Reinicia la posición y repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala durante la fase de preparación
      - Exhala de forma explosiva al saltar

      ### 4. Consejos
      - Concéntrate en la potencia explosiva de las piernas, no solo en la altura
      - Aterriza suavemente con las rodillas flexionadas para absorber el impacto
      - Empieza con un cajón bajo y progresa gradualmente
      - Mantén el pecho erguido y la vista en el cajón en todo momento
      - Baja del cajón caminando en lugar de saltar para reducir el estrés articular

      ### 5. Errores comunes
      - Aterrizar con las piernas rectas, lo que aumenta el riesgo de lesión
      - Bajar del cajón saltando en lugar de caminando
      - Usar un cajón demasiado alto para tu capacidad actual
      - No extenderte por completo en la parte superior del cajón
      - Aterrizar con los pies en posiciones distintas
      - Acelerar las repeticiones sin reiniciar bien entre saltos

      ### 6. Seguridad y modificaciones
      - Empieza con un cajón bajo y estable (12-18 pulgadas / 30-45 cm) para dominar la técnica
      - Asegúrate de que el cajón sea estable y no resbale ni vuelque
      - Progresa a cajones más altos solo después de dominar las alturas menores
      - Variación avanzada: añade un chaleco lastrado o realiza saltos al cajón a una pierna
