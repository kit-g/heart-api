  Lat Pulldown - Underhand (Band):
    name: Jalón con agarre supino (banda)
    instructions: |
      ## Resumen
      El jalón con agarre supino y banda es un ejercicio de tracción con resistencia elástica que trabaja principalmente el dorsal ancho con mayor participación de los bíceps. También involucra los romboides y el trapecio medio, y usa un agarre supino con resistencia progresiva de la banda durante todo el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Ancla una banda por encima de la cabeza a un punto seguro
      - Ponte de pie o de rodillas mirando hacia el punto de anclaje
      - Sujeta la banda con ambas manos con agarre supino (palmas hacia ti)
      - Extiende los brazos por encima de la cabeza con la banda en tensión
      - Mantén el core activado y el torso erguido

      ### 2. Movimiento
      1. Tira de la banda hacia el pecho llevando los codos hacia abajo y atrás
      2. Mantén el torso erguido durante todo el movimiento
      3. Continúa hasta que las manos lleguen a la parte alta del pecho o a los hombros
      4. Junta las escápulas en la parte baja
      5. Devuelve los brazos lentamente a la posición elevada con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al tirar de la banda hacia abajo
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - El agarre supino permite que los codos se mantengan más cerca del cuerpo
      - Concéntrate en tirar con los músculos de la espalda, no solo con los brazos
      - Mantén el pecho arriba y los hombros atrás en todo momento
      - Mantén la tensión constante en la banda
      - Controla la resistencia tanto en la fase de tracción como en la de retorno

      ### 5. Errores comunes
      - Inclinarse demasiado hacia atrás para usar el peso corporal
      - No mantener la tensión constante en la banda
      - Usar impulso en lugar de un movimiento controlado
      - Encoger los hombros hacia arriba
      - Depender demasiado de los bíceps en lugar de la espalda
      - Ejecutar las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar el patrón con agarre supino
      - Ajusta la distancia al punto de anclaje para modificar la resistencia
      - Hazlo de rodillas si de pie resulta demasiado exigente
      - Variación avanzada: usa una banda de mayor resistencia o añade una pausa en la parte baja
