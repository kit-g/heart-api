  Torso Rotation (Machine):
    name: Rotación de torso (máquina)
    instructions: |
      ## Resumen
      La rotación de torso en máquina es un ejercicio de core con resistencia que trabaja principalmente los oblicuos y el transverso abdominal. También involucra el recto abdominal y los estabilizadores profundos del core mediante un movimiento rotacional controlado, lo que permite aplicar sobrecarga progresiva a la fuerza rotacional del core.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de rotación de torso con la espalda contra el respaldo
      - Ajusta la altura del asiento para que el punto de giro quede alineado con la mitad del torso
      - Apoya los pies en los reposapiés y asegura los muslos bajo las almohadillas
      - Agarra las asas a la altura del pecho a ambos lados
      - Activa el core y mantén una postura erguida

      ### 2. Movimiento
      1. Rota el torso hacia un lado contrayendo los oblicuos
      2. Mantén las caderas estables y mirando al frente durante todo el movimiento
      3. Rota tanto como lo permita la máquina manteniendo el control
      4. Haz una pausa breve al final de la rotación
      5. Vuelve a la posición central inicial con control
      6. Completa todas las repeticiones de un lado, luego ajusta la máquina y repite con el otro

      ### 3. Respiración
      - Exhala al rotar hacia el lado
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Concéntrate en rotar desde el core, no en tirar con los brazos
      - Mantén las caderas y la parte inferior del cuerpo completamente estables
      - Muévete despacio y con control para maximizar el trabajo de los oblicuos
      - Mantén una postura erguida durante todo el movimiento
      - Conserva la tensión en la placa de pesas sin dejar que descanse entre repeticiones

      ### 5. Errores comunes
      - Usar demasiado peso y comprometer la técnica
      - Rotar las caderas junto con el torso
      - Usar impulso o mover el peso con tirones
      - Tirar con los brazos en lugar de rotar con el core
      - Moverse demasiado rápido por el rango de movimiento
      - Inclinarse hacia delante o hacia atrás en lugar de mantenerse erguido

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón rotacional
      - Haz el mismo número de repeticiones en ambos lados para un desarrollo equilibrado
      - Variante avanzada: haz una pausa de 2-3 segundos en la rotación máxima
      - Si sientes molestias en la zona lumbar, reduce el peso y asegúrate de mantener una técnica correcta
