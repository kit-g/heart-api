  Romanian Deadlift (Barbell):
    name: Peso muerto rumano (barra)
    instructions: |
      ## Resumen
      El peso muerto rumano es un ejercicio de bisagra de cadera que trabaja principalmente los isquiotibiales, los glúteos y los erectores espinales. También involucra los dorsales y los trapecios como estabilizadores, y usa un descenso controlado para enfatizar la fase excéntrica y fortalecer la cadena posterior.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies al ancho de caderas sosteniendo la barra con agarre prono
      - Coloca las manos justo por fuera de las piernas
      - Mantente erguido con la barra a la altura de las caderas
      - Mantén el pecho arriba, los hombros atrás y el core activado
      - Conserva una ligera flexión de rodillas en todo momento

      ### 2. Movimiento
      1. Haz una bisagra de cadera empujando las caderas hacia atrás y bajando la barra
      2. Mantén la espalda plana y la barra pegada a las piernas
      3. Baja hasta sentir un estiramiento en los isquiotibiales, normalmente a media espinilla
      4. Mantén una ligera flexión de rodillas durante todo el movimiento
      5. Empuja las caderas hacia adelante para volver a la posición inicial
      6. Contrae los glúteos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la barra
      - Exhala al empujar las caderas hacia adelante para incorporarte

      ### 4. Consejos
      - Concéntrate en la bisagra de cadera, no en hacer sentadilla ni doblar las rodillas
      - Mantén la espalda plana y el pecho arriba en todo momento
      - Empuja las caderas hacia atrás lo máximo posible
      - Mantén la barra pegada a las piernas en todo momento
      - Siente el estiramiento de los isquiotibiales abajo

      ### 5. Errores comunes
      - Redondear la espalda en lugar de mantener la columna neutra
      - Doblar demasiado las rodillas y convertirlo en una sentadilla
      - No empujar las caderas lo suficiente hacia atrás
      - Bajar la barra más allá del punto de estiramiento de los isquiotibiales
      - Usar demasiado peso y comprometer la técnica
      - Ejecutar las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón de bisagra de cadera
      - Mantén una ligera flexión de rodillas para proteger los isquiotibiales
      - Hazlo con mancuernas si la barra te resulta inestable
      - Si notas molestias en la zona lumbar, reduce el peso y asegura una buena técnica
