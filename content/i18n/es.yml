  Burpee:
    name: Burpees
    instructions: |
      ## Resumen
      El burpee es un ejercicio calisténico de cuerpo completo que trabaja principalmente el pecho, los hombros, el core y las piernas. Combina una flexión, una sentadilla y un salto en un solo movimiento continuo, desarrollando resistencia cardiovascular, fuerza y potencia explosiva.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros
      - Mantén el pecho erguido y el core activado
      - Prepárate para moverte con rapidez a lo largo de toda la secuencia

      ### 2. Movimiento
      1. Baja en sentadilla y coloca las manos en el suelo
      2. Salta o da un paso atrás con los pies hasta una posición de plancha alta
      3. Haz una flexión bajando el pecho al suelo
      4. Empuja para volver a la posición de plancha
      5. Salta o da un paso con los pies de vuelta hacia las manos
      6. Salta explosivamente con los brazos por encima de la cabeza y repite

      ### 3. Respiración
      - Respira durante todo el movimiento según lo necesites
      - Exhala durante las fases de flexión y salto

      ### 4. Consejos
      - Mantén un ritmo constante durante las repeticiones
      - Mantén el core firme durante la plancha y la flexión
      - Aterriza con suavidad después del salto
      - Las modificaciones pueden eliminar la flexión o el salto
      - Prioriza la técnica sobre la velocidad mientras aprendes

      ### 5. Errores comunes
      - Dejar que las caderas se hundan en la posición de plancha
      - No llevar el pecho al suelo en la flexión
      - Aterrizar con demasiada fuerza tras el salto
      - Apresurar las repeticiones y perder la técnica
      - No extenderse por completo durante el salto
      - Aguantar la respiración todo el tiempo

      ### 6. Seguridad y modificaciones
      - Da un paso atrás en lugar de saltar para reducir el impacto
      - Elimina la flexión para una versión más fácil
      - Quita el salto final si lo necesitas
      - Variante avanzada: añade una dominada o aumenta la velocidad
    validated: false
