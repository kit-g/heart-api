  Russian Twist:
    name: Giro ruso
    instructions: |
      ## Resumen
      El giro ruso es un ejercicio rotacional dinámico de core que trabaja principalmente los oblicuos y el transverso abdominal. También involucra el recto abdominal y los flexores de cadera como estabilizadores, lo que lo hace eficaz para desarrollar fuerza rotacional y estabilidad del core.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en una colchoneta con las rodillas flexionadas y los pies apoyados en el suelo
      - Inclínate ligeramente hacia atrás para activar el core, formando una V entre el torso y los muslos
      - Levanta un poco los pies del suelo para mayor dificultad, o mantenlos apoyados
      - Junta las manos frente al pecho
      - Mantén la espalda recta y el core activado en todo momento

      ### 2. Movimiento
      1. Rota el torso hacia la derecha, llevando las manos hacia el suelo junto a la cadera
      2. Mantén las caderas mirando al frente mientras giras la parte superior del cuerpo
      3. Haz una pausa breve cuando las manos toquen o se acerquen al suelo
      4. Rota de vuelta pasando por el centro hacia el lado opuesto
      5. Lleva las manos hacia el suelo junto a la cadera izquierda
      6. Continúa alternando lados con un ritmo controlado durante el número deseado de repeticiones

      ### 3. Respiración
      - Exhala al girar hacia cada lado
      - Inhala al pasar por el centro

      ### 4. Consejos
      - Inicia la rotación desde el core, no desde los brazos
      - Mantén el pecho erguido y la espalda recta en todo momento
      - Conserva un ángulo de inclinación constante sin colapsar hacia delante
      - Muévete con control y no con velocidad para máxima efectividad
      - Mantén las caderas estables y mirando al frente

      ### 5. Errores comunes
      - Rotar las caderas junto con el torso en lugar de mantenerlas estables
      - Redondear la espalda y colapsar hacia delante
      - Moverse demasiado rápido y usar impulso en lugar de control
      - Mover solo los brazos en lugar de rotar todo el torso
      - Contener la respiración durante el movimiento
      - Inclinarse demasiado hacia atrás, lo que puede sobrecargar la zona lumbar

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden mantener los pies en el suelo para mayor estabilidad
      - Variante avanzada: sostén un disco, una mancuerna o un balón medicinal para añadir resistencia
      - Reduce el rango de movimiento si sientes molestias en la zona lumbar
      - Progresa levantando más los pies o añadiendo una pausa en cada lado
