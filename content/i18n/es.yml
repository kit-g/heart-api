  Muscle Up:
    name: Muscle-up
    instructions: |
      ## Resumen
      El muscle-up es un ejercicio avanzado con el peso corporal que combina una dominada con un fondo. Trabaja principalmente los dorsales, el pecho, los hombros y los tríceps, y requiere una fuerza considerable del tren superior, potencia explosiva y habilidad técnica para pasar de debajo a encima de la barra o las anillas.

      ## Ejecución
      ### 1. Posición inicial
      - Cuélgate de una barra de dominadas o de unas anillas de gimnasia
      - Usa un agarre falso (pulgares por encima de la barra) para facilitar la transición
      - Mantén el cuerpo en posición de cuerpo hueco (hollow)
      - Activa el core y prepárate para un tirón explosivo
      - Genera un ligero balanceo si necesitas impulso

      ### 2. Movimiento
      1. Tira explosivamente de tu cuerpo hacia la barra
      2. A medida que subes, inclínate ligeramente hacia atrás y lleva el pecho por encima de la barra
      3. Haz la transición de pecho y hombros por encima de la barra con decisión
      4. Empuja hacia abajo para completar el movimiento en posición de apoyo
      5. Baja con control hasta la posición inicial de suspensión
      6. Repite el número deseado de repeticiones

      ### 3. Respiración
      - Toma aire antes de tirar
      - Exhala explosivamente durante el tirón y la transición
      - Inhala durante el descenso

      ### 4. Consejos
      - Es un movimiento avanzado que exige mucha fuerza
      - La fase de transición es la parte más técnica
      - La potencia explosiva de tirón es esencial
      - Practica antes por separado las dominadas y los fondos
      - Considera usar bandas como ayuda mientras aprendes

      ### 5. Errores comunes
      - No generar suficiente impulso explosivo en el tirón
      - No inclinarse hacia atrás durante la transición
      - Fuerza insuficiente en dominadas o fondos
      - Mala sincronización de la fase de transición
      - Intentarlo sin la fuerza previa suficiente
      - Usar demasiado balanceo o impulso

      ### 6. Seguridad y modificaciones
      - Domina primero las dominadas estrictas (15+) y los fondos (20+)
      - Usa una banda como asistencia mientras aprendes
      - Practica la fase de transición por separado
      - El muscle-up en anillas suele ser más fácil de aprender que en barra
    validated: false
