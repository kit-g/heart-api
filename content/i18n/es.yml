  Decline Bench Press (Barbell):
    name: Press de banca declinado (barra)
    instructions: |
      ## Resumen
      El press de banca declinado con barra es un ejercicio de empuje compuesto que trabaja principalmente la porción inferior del pectoral mayor. También involucra los deltoides frontales y los tríceps, y utiliza la posición declinada del banco para enfatizar la parte baja del pecho, normalmente con cargas más pesadas que en el press plano.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en un banco declinado con los pies asegurados bajo los rodillos
      - Colócate de modo que tus ojos queden directamente bajo la barra
      - Agarra la barra con las manos un poco más abiertas que el ancho de los hombros
      - Saca la barra del soporte y sostenla con los brazos completamente extendidos sobre la parte baja del pecho
      - Mantén las escápulas retraídas y presionadas contra el banco

      ### 2. Movimiento
      1. Baja la barra lentamente hasta la parte baja del pecho
      2. Mantén los codos a unos 45 grados respecto al cuerpo
      3. Toca ligeramente el pecho con la barra
      4. Haz una breve pausa abajo
      5. Empuja la barra hacia arriba extendiendo los brazos
      6. Llega a la extensión completa de los codos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala mientras bajas la barra al pecho
      - Exhala mientras empujas la barra hacia arriba

      ### 4. Consejos
      - Mantén las escápulas retraídas durante todo el ejercicio
      - Concéntrate en contraer la parte baja del pecho en la posición alta
      - Controla el descenso y evita rebotar la barra
      - Mantén los pies asegurados para conservar la estabilidad
      - El ángulo declinado suele permitir cargas más pesadas

      ### 5. Errores comunes
      - Rebotar la barra contra el pecho
      - Dejar que los codos se abran en exceso
      - No asegurar bien los pies, lo que causa inestabilidad
      - No lograr el rango completo de movimiento
      - Usar demasiado peso y comprometer la técnica
      - Perder la retracción de las escápulas

      ### 6. Seguridad y modificaciones
      - Utiliza siempre un asistente cuando levantes pesos pesados
      - Asegúrate de que los pies estén bien anclados antes de sacar la barra del soporte
      - Empieza con menos peso que en tu press de banca plano para adaptarte
      - Si sientes molestias en los hombros, ajusta la anchura del agarre
