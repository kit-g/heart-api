  Clean and Jerk (Barbell):
    name: Cargada y envión (barra)
    instructions: |
      ## Resumen
      La cargada y envión es un movimiento completo de halterofilia que trabaja todo el cuerpo. Combina la cargada (del suelo a los hombros) con el envión (de los hombros a por encima de la cabeza), involucrando las piernas, las caderas, la espalda, los hombros y el core en uno de los ejercicios de cuerpo completo más exigentes.

      ## Ejecución
      ### 1. Posición inicial
      - Realiza una cargada completa para llevar la barra a tus hombros
      - Ajusta los pies al ancho de hombros o un poco más
      - Mantén los codos altos con la barra apoyada sobre los deltoides anteriores
      - Mantente erguido con el core activado y listo para el dip

      ### 2. Movimiento
      1. Realiza una cargada para llevar la barra a tus hombros
      2. Haz un dip flexionando ligeramente las rodillas mientras mantienes el torso vertical
      3. Empuja explosivamente hacia arriba extendiendo las piernas
      4. Empuja la barra por encima de la cabeza mientras abres los pies en tijera o hacia los lados
      5. Bloquea los brazos con la barra estable por encima de la cabeza
      6. Recupera juntando de nuevo los pies debajo de la barra

      ### 3. Respiración
      - Respira durante la preparación y entre fases
      - Mantén el aire durante el dip y el empuje
      - Exhala una vez que la barra esté bloqueada por encima de la cabeza

      ### 4. Consejos
      - Este es el levantamiento olímpico más exigente técnicamente
      - El dip debe ser controlado y vertical
      - Usa el empuje de piernas, no solo los brazos, para llevar la barra por encima de la cabeza
      - Practica por separado el trabajo de pies del envión con tijera o el envión de potencia
      - Domina primero la cargada y el movimiento por encima de la cabeza de forma independiente

      ### 5. Errores comunes
      - Hacer el dip hacia adelante en lugar de mantenerse vertical
      - No usar suficiente empuje de piernas en el envión
      - Empujar con los brazos antes de impulsar con las piernas
      - Trayectoria deficiente de la barra durante la fase de envión
      - No bloquear por completo los brazos por encima de la cabeza
      - Intentarlo sin una base técnica adecuada

      ### 6. Seguridad y modificaciones
      - Requiere entrenamiento extenso con un instructor cualificado de halterofilia
      - Domina la cargada y el envión por separado antes de combinarlos
      - Usa discos de goma y una plataforma de levantamiento adecuada
      - Progresa muy gradualmente con los aumentos de peso
