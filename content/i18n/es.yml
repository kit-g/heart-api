  Deadlift (Smith Machine):
    name: Peso muerto (máquina Smith)
    instructions: |
      ## Resumen
      El peso muerto en máquina Smith es un ejercicio compuesto guiado que trabaja principalmente los glúteos, los isquiotibiales y los erectores espinales. También involucra los cuádriceps, los dorsales y los trapecios, y utiliza una trayectoria vertical fija de la barra para aportar estabilidad y permitir concentrarse en el gesto del levantamiento.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca la barra de la máquina Smith a la altura de la mitad de la espinilla
      - Ponte dentro de la máquina con los pies separados al ancho de las caderas y la barra sobre el mediopié
      - Agarra la barra justo por fuera de las piernas con agarre prono o mixto
      - Haz una bisagra de cadera y flexiona las rodillas para alcanzar la barra
      - Mantén el pecho erguido, la espalda plana y los hombros ligeramente por delante de la barra

      ### 2. Movimiento
      1. Desbloquea la barra girándola y luego empuja con los talones
      2. Extiende caderas y rodillas al mismo tiempo para ponerte de pie
      3. Mantén la barra pegada al cuerpo mientras subes
      4. Ponte de pie por completo con los hombros atrás y el pecho erguido
      5. Baja la barra empujando las caderas hacia atrás y flexionando las rodillas
      6. Devuelve la barra a la posición inicial y repite

      ### 3. Respiración
      - Inhala profundo y activa el core antes de levantar
      - Aguanta la respiración durante el levantamiento
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - La trayectoria fija de la barra puede ayudarte a mantener una buena técnica
      - Mantén la barra pegada a las espinillas y los muslos en todo momento
      - Sube guiando el movimiento con el pecho
      - Mantén la columna neutra durante todo el movimiento
      - Usa los topes de seguridad para mayor protección

      ### 5. Errores comunes
      - Redondear la zona lumbar durante el levantamiento
      - Empezar con las caderas demasiado altas o demasiado bajas
      - No ajustar la posición de los pies respecto a la trayectoria fija de la barra
      - No extender por completo las caderas arriba
      - Mirar hacia arriba o hacia abajo en lugar de mantener el cuello neutro
      - Depender demasiado de la trayectoria guiada de la máquina

      ### 6. Seguridad y modificaciones
      - Ajusta la altura inicial de la barra a la mitad de la espinilla para una técnica óptima
      - Coloca los topes de seguridad a la altura adecuada
      - Prueba distintas posiciones de los pies para encontrar tu colocación óptima respecto a la barra
      - Si sientes molestias en la zona lumbar, reduce el peso y revisa tu técnica
