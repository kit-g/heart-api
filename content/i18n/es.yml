  Push Press:
    name: Push press
    instructions: |
      ## Resumen
      El push press es un ejercicio compuesto de potencia que trabaja principalmente los deltoides con la ayuda del impulso de las piernas. También involucra los tríceps, la parte superior del pecho, los cuádriceps y el core, usando un impulso explosivo de piernas para empujar por encima de la cabeza cargas mayores que las que permite el press estricto.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de los hombros, con la barra en el rack a la altura de la parte alta del pecho
      - Agarra la barra un poco más separado que el ancho de los hombros, con las palmas hacia adelante
      - Saca la barra del rack y sostenla a la altura de los hombros
      - Mantén el pecho erguido, el core activado y los codos ligeramente adelantados
      - Mantén una buena postura en todo momento

      ### 2. Movimiento
      1. Haz una flexión ligera doblando rodillas y caderas
      2. Impúlsate hacia arriba de forma explosiva con las piernas mientras empujas la barra por encima de la cabeza
      3. Usa el impulso de las piernas para ayudar a empujar la barra
      4. Continúa empujando hasta que los brazos queden completamente extendidos
      5. Alcanza la extensión completa de los codos con la barra sobre la cabeza
      6. Baja la barra hasta la altura de los hombros con control y repite

      ### 3. Respiración
      - Inhala durante la fase de flexión
      - Exhala de forma explosiva mientras te impulsas y empujas

      ### 4. Consejos
      - El impulso de las piernas debe ser explosivo y potente
      - Sincroniza el impulso de piernas con el empuje de brazos para máxima eficiencia
      - Mantén el core firme durante todo el movimiento
      - Este ejercicio permite manejar cargas mayores que el press estricto
      - Concéntrate en una coordinación fluida entre piernas y brazos

      ### 5. Errores comunes
      - Flexionar demasiado o demasiado poco
      - No coordinar el impulso de piernas con el empuje de brazos
      - Empujar hacia adelante en lugar de en línea recta hacia arriba
      - Arquear la zona lumbar en exceso
      - No alcanzar la extensión completa arriba
      - Dejar que las piernas hagan todo el trabajo en lugar de solo asistir

      ### 6. Seguridad y modificaciones
      - Domina el press militar estricto antes de progresar al push press
      - Empieza con un peso moderado para aprender la sincronización del impulso de piernas
      - Usa un rack de potencia con barras de seguridad cuando entrenes solo
      - Este ejercicio es excelente para desarrollar potencia explosiva
