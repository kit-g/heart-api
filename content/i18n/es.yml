    instructions: |
      ## Resumen
      El jalón al pecho con agarre cerrado es un ejercicio de tracción que trabaja principalmente la espalda, en especial los dorsales. El agarre estrecho mantiene los codos por delante del cuerpo, lo que también involucra intensamente los bíceps en el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca un asa de agarre cerrado o usa un agarre estrecho en la barra
      - Siéntate con los muslos sujetos bajo los soportes
      - Sujeta el asa con ambas manos, con los brazos completamente extendidos por encima de la cabeza
      - Inclínate ligeramente hacia atrás y saca el pecho

      ### 2. Movimiento
      1. Tira del asa hacia la parte alta del pecho
      2. Lleva los codos hacia abajo, pegados a los costados
      3. Contrae los dorsales en la parte baja de la tracción
      4. Deja que el asa suba lentamente hasta extender por completo los brazos
      5. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al tirar hacia abajo
      - Inhala al subir de vuelta

      ### 4. Consejos
      - Mantén el pecho arriba y los hombros lejos de las orejas
      - Tira con la espalda, usando las manos como ganchos
      - Controla el retorno en lugar de dejar que el peso tire de tus brazos hacia arriba

      ### 5. Errores comunes
      - Inclinarse muy atrás y convertir el jalón en un remo
      - Usar impulso para bajar el peso
      - Quedarse corto en la extensión completa de los brazos arriba

      ### 6. Seguridad y modificaciones
      - Empieza ligero y añade peso cuando la trayectoria sea fluida
      - Variación avanzada: haz una pausa en la parte baja de cada repetición
