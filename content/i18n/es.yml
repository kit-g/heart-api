  Skullcrusher (Barbell):
    name: Press francés (barra)
    instructions: |
      ## Resumen
      El press francés con barra es un ejercicio de aislamiento que trabaja principalmente los tríceps, en particular la cabeza larga. También involucra las cabezas medial y lateral del tríceps, usando una posición tumbada para maximizar el estiramiento y la contracción durante todo el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en un banco plano con los pies firmemente apoyados en el suelo
      - Sostén una barra con agarre prono, entre estrecho y al ancho de los hombros
      - Extiende los brazos rectos por encima del pecho
      - Inclina los brazos ligeramente hacia atrás, hacia la cabeza (no perfectamente verticales)
      - Mantén los codos inmóviles durante todo el movimiento

      ### 2. Movimiento
      1. Baja la barra flexionando los codos, llevándola hacia la frente
      2. Mantén la parte superior de los brazos inmóvil y ligeramente inclinada hacia atrás
      3. Baja hasta que los antebrazos superen apenas la paralela con el suelo
      4. Haz una pausa breve en la posición de estiramiento abajo
      5. Extiende los codos para llevar la barra de vuelta a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la barra hacia la frente
      - Exhala al subir la barra

      ### 4. Consejos
      - Mantén la parte superior de los brazos inmóvil durante todo el movimiento
      - Baja la barra con control para evitar golpearte la frente
      - Concéntrate en mantener la tensión en los tríceps en todo momento
      - Mantén los codos relativamente juntos, sin abrirlos hacia los lados
      - Inclina los brazos ligeramente hacia atrás para maximizar el trabajo del tríceps

      ### 5. Errores comunes
      - Dejar que los codos se abran en exceso
      - Mover la parte superior de los brazos en lugar de mantenerla inmóvil
      - Bajar la barra demasiado rápido y sin control
      - No lograr un estiramiento completo abajo
      - Usar demasiado peso y comprometer la técnica
      - Dejar que los codos se desplacen hacia delante durante la extensión

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la técnica de bajada controlada
      - Usa una barra EZ si sientes molestias en las muñecas o los codos
      - Cuenta con un compañero que te asista en las series pesadas
      - Variante avanzada: baja la barra por detrás de la cabeza para un mayor estiramiento
