  Decline Crunch:
    name: Crunch declinado
    instructions: |
      ## Resumen
      El crunch declinado es un ejercicio avanzado de core que trabaja principalmente el recto abdominal con mayor resistencia por efecto de la gravedad. También involucra los flexores de cadera y los oblicuos como estabilizadores, y resulta más exigente que el crunch tradicional en el suelo debido al ángulo declinado.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en un banco declinado con los pies asegurados bajo los soportes
      - Ajusta el banco a un ángulo de declive moderado (normalmente 15-30 grados)
      - Coloca las manos suavemente detrás de la cabeza o cruzadas sobre el pecho
      - Mantén los codos apuntando hacia los lados si tienes las manos detrás de la cabeza
      - Activa el core y mantén la columna en posición neutra

      ### 2. Movimiento
      1. Despega las escápulas del banco contrayendo los músculos abdominales
      2. Enrolla el torso hacia adelante, llevando la caja torácica hacia la pelvis
      3. Exhala y aprieta los abdominales en la parte alta del movimiento durante 1-2 segundos
      4. Baja lentamente los hombros con control
      5. Detente justo antes de que los hombros toquen el banco para mantener la tensión
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala con fuerza mientras subes en el crunch y contraes los abdominales
      - Inhala mientras bajas a la posición inicial

      ### 4. Consejos
      - Concéntrate en enrollar el torso en lugar de tirar con el cuello
      - Mantén tensión constante en los abdominales sin relajarte por completo entre repeticiones
      - Evita tirar de la cabeza o el cuello con las manos
      - Empieza con un declive suave y progresa hacia ángulos más pronunciados
      - Muévete despacio y con control para maximizar la activación muscular

      ### 5. Errores comunes
      - Tirar del cuello con las manos, lo que puede causar sobrecarga
      - Usar impulso para subir en lugar de una contracción controlada
      - Empezar con un declive demasiado pronunciado antes de desarrollar la fuerza suficiente
      - Dejar que la zona lumbar se hiperextienda en la bajada
      - Moverse demasiado rápido y sacrificar la técnica por las repeticiones
      - Relajarse por completo entre repeticiones, perdiendo la tensión del core

      ### 6. Seguridad y modificaciones
      - Los principiantes deben empezar con el banco plano o con un declive muy suave
      - Variante avanzada: sostén un disco sobre el pecho para añadir resistencia
      - Si sientes molestias, reduce el ángulo de declive o vuelve a los crunches en el suelo
      - Progresa aumentando gradualmente el ángulo de declive a medida que ganes fuerza
    validated: false
