  Seated Leg Curl (Machine):
    name: Curl femoral sentado (máquina)
    instructions: |
      ## Resumen
      El curl femoral sentado es un ejercicio de aislamiento que trabaja principalmente los isquiotibiales. También activa las pantorrillas, usando una posición sentada en una máquina guiada para aislar y fortalecer los músculos de la parte posterior del muslo mediante la flexión de rodilla.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de curl femoral con la espalda firme contra el respaldo
      - Coloca el rodillo contra la parte posterior de tus piernas, justo por encima de los tobillos
      - Ajusta la máquina para que tus rodillas queden alineadas con el punto de giro
      - Sujeta las asas para mayor estabilidad
      - Mantén los muslos asegurados bajo el apoyo de muslos

      ### 2. Movimiento
      1. Flexiona las rodillas para llevar las piernas hacia abajo y atrás
      2. Continúa hasta que el rodillo casi toque la parte trasera del asiento
      3. Haz una pausa y aprieta los isquiotibiales en la flexión completa
      4. Devuelve lentamente el peso a la posición inicial con control
      5. Detente justo antes de que la placa de peso toque para mantener la tensión
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al flexionar las piernas hacia abajo
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén la espalda firmemente presionada contra el respaldo
      - Concéntrate en apretar los isquiotibiales en la flexión completa
      - Controla tanto la fase de flexión como la de extensión
      - Mantén tensión constante sin dejar que la placa de peso descanse
      - Evita usar impulso o tirar del peso con brusquedad

      ### 5. Errores comunes
      - Levantar los glúteos del asiento durante el curl
      - Usar impulso o balancear el peso
      - No lograr el rango completo de movimiento
      - Dejar que la placa de peso descanse entre repeticiones
      - Hacer las repeticiones demasiado rápido
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Ajusta el rodillo y el asiento para una alineación correcta de la rodilla
      - Empieza con poco peso para establecer una técnica correcta
      - La posición sentada puede resultar más cómoda que las variantes tumbado
      - Variante avanzada: trabaja una pierna a la vez o añade una pausa en la flexión completa
