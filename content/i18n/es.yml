  Triceps Extension (Machine):
    name: Extensión de tríceps (máquina)
    instructions: |
      ## Resumen
      La extensión de tríceps en máquina es un ejercicio de aislamiento que trabaja principalmente las tres cabezas del tríceps con una trayectoria guiada. También involucra mínimamente los hombros, y utiliza una máquina fija que aporta estabilidad y una resistencia constante durante toda la extensión.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina con la espalda firme contra el respaldo
      - Ajusta la altura del asiento para que los codos queden alineados con el punto de giro de la máquina
      - Sujeta las empuñaduras con agarre prono o neutro, según la máquina
      - Coloca los codos a unos 90 grados para empezar
      - Mantén la parte superior de los brazos apoyada contra el cojín si corresponde

      ### 2. Movimiento
      1. Extiende los brazos empujando las empuñaduras hacia abajo o hacia adelante
      2. Mantén la parte superior de los brazos inmóvil contra el cojín en todo momento
      3. Continúa hasta que los brazos queden completamente extendidos
      4. Haz una pausa y contrae los tríceps en la extensión completa
      5. Regresa lentamente a la posición inicial con control
      6. Detente justo antes de que la placa toque la torre de pesas para mantener la tensión y repite

      ### 3. Respiración
      - Exhala al extender los brazos
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén la parte superior de los brazos completamente inmóvil en todo momento
      - Mantén la tensión constante sin dejar que la torre de pesas descanse
      - Concéntrate en contraer los tríceps en la extensión completa
      - Controla tanto la fase de extensión como la de retorno
      - Evita usar impulso o mover el cuerpo

      ### 5. Errores comunes
      - Levantar la parte superior de los brazos o los codos del cojín
      - Usar impulso en lugar de una contracción muscular controlada
      - Dejar que la torre de pesas descanse por completo entre repeticiones
      - No lograr la extensión completa de los brazos
      - Usar demasiado peso y comprometer la técnica
      - Hacer las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Ajusta la altura del asiento para alinear bien los codos con el punto de giro
      - Empieza con poco peso para establecer la conexión mente-músculo
      - Variación avanzada: añade una pausa de 2-3 segundos en la extensión completa
      - Trabaja un brazo a la vez si la máquina permite el entrenamiento unilateral
