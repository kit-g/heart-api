  Push Up - Close Grip:
    name: Flexiones con agarre cerrado
    instructions: |
      ## Resumen
      Las flexiones con agarre cerrado son un ejercicio de empuje con el peso corporal que trabaja principalmente los tríceps. Colocar las manos más juntas traslada el trabajo del pecho a los brazos, mientras el pecho, los hombros y el core asisten durante todo el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Empieza en posición de plancha con las manos directamente bajo el pecho
      - Coloca las manos a menos del ancho de los hombros, con los pulgares casi tocándose
      - Mantén el cuerpo en línea recta de la cabeza a los talones
      - Activa el core y aprieta los glúteos

      ### 2. Movimiento
      1. Flexiona los codos para bajar el pecho hacia las manos
      2. Mantén los codos pegados a los costados durante el descenso
      3. Baja hasta que el pecho casi toque el suelo
      4. Empuja para volver a la posición inicial estirando los brazos
      5. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar
      - Exhala al empujar hacia arriba

      ### 4. Consejos
      - Mantén los codos apuntando hacia atrás, sin abrirlos
      - Mantén una plancha rígida de la cabeza a los talones
      - Muévete despacio y con control en ambas direcciones

      ### 5. Errores comunes
      - Dejar que las caderas se hundan o se eleven en pico
      - Abrir los codos hacia los lados, lo que quita trabajo a los tríceps
      - Acortar el rango de movimiento

      ### 6. Seguridad y modificaciones
      - Realízalas apoyando las rodillas para reducir la carga
      - Eleva las manos sobre un banco para hacerlas más fáciles
      - Progresa ralentizando la fase de bajada o elevando los pies
