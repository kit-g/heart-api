  Triceps Dip (Assisted):
    name: Fondos en paralelas (asistidos)
    instructions: |
      ## Resumen
      Los fondos en paralelas asistidos son un ejercicio en máquina que trabaja principalmente los tríceps con ayuda. También involucran el pecho y la parte frontal de los hombros, usando la asistencia del contrapeso para hacer los fondos más accesibles mientras desarrollas fuerza hacia los fondos sin asistencia.

      ## Ejecución
      ### 1. Posición inicial
      - Ajusta el peso en la máquina asistida de fondos (más peso = más asistencia)
      - Sube a la plataforma y sujeta las empuñaduras
      - Coloca las rodillas o los pies sobre el apoyo de asistencia
      - Empieza con los brazos completamente extendidos y el cuerpo erguido
      - Activa el core y mantén los hombros abajo, alejados de las orejas

      ### 2. Movimiento
      1. Baja el cuerpo flexionando los codos hasta unos 90 grados
      2. Mantén los codos apuntando hacia atrás y el cuerpo relativamente erguido
      3. Mantén el control mientras el apoyo de asistencia sostiene tu peso
      4. Haz una pausa breve en la parte baja del movimiento
      5. Empuja con las palmas para extender los brazos y volver a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar el cuerpo
      - Exhala al empujar de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén el cuerpo relativamente erguido para maximizar el trabajo de los tríceps
      - Reduce gradualmente el peso de asistencia a medida que ganes fuerza
      - Concéntrate en un movimiento controlado durante todo el rango
      - Mantén los codos relativamente cerca del cuerpo
      - Evita depender demasiado de la asistencia

      ### 5. Errores comunes
      - Usar demasiada asistencia y no exigirte lo suficiente
      - Inclinarse demasiado hacia delante, trasladando el énfasis al pecho
      - Dejar que los codos se abran en exceso
      - Usar impulso en lugar de un movimiento controlado
      - No completar el rango completo de movimiento
      - Encorvar los hombros hacia delante

      ### 6. Seguridad y modificaciones
      - Empieza con más asistencia y redúcela gradualmente a medida que te fortalezcas
      - Reduce el rango de movimiento si sientes molestias en los hombros
      - Progresa hacia los fondos sin asistencia reduciendo el peso de asistencia de forma constante
      - Prioriza la técnica antes que reducir la asistencia demasiado rápido
    validated: false
