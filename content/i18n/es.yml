  Bicep Curl (Barbell):
    name: Curl de bíceps (barra)
    instructions: |
      ## Resumen
      El curl de bíceps con barra es un ejercicio de aislamiento clásico que trabaja principalmente el bíceps braquial. También involucra el braquial y el braquiorradial como músculos secundarios, lo que lo convierte en uno de los ejercicios más eficaces para desarrollar tamaño y fuerza en los brazos.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas sosteniendo una barra con agarre supino
      - Coloca las manos un poco más separadas que el ancho de los hombros
      - Deja que la barra cuelgue con los brazos extendidos frente a los muslos
      - Mantén los codos pegados a los costados durante todo el movimiento
      - Activa el core y mantén una postura erguida

      ### 2. Movimiento
      1. Sube la barra flexionando los codos y contrayendo los bíceps
      2. Mantén los brazos quietos y pegados al torso
      3. Continúa subiendo hasta que la barra llegue a la altura de los hombros
      4. Haz una pausa y aprieta los bíceps en la parte alta del movimiento
      5. Baja la barra lentamente a la posición inicial con control
      6. Repite durante el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir la barra
      - Inhala al bajar la barra

      ### 4. Consejos
      - Mantén los codos fijos a los costados durante todo el movimiento
      - Evita balancearte o usar impulso para levantar el peso
      - Concéntrate en apretar los bíceps en la parte alta de cada repetición
      - Mantén la espalda recta y el core estable
      - Controla tanto la fase de subida como la de bajada

      ### 5. Errores comunes
      - Balancear el cuerpo o usar impulso para levantar el peso
      - Dejar que los codos se desplacen hacia delante durante el curl
      - No extender los brazos por completo abajo
      - Subir el peso demasiado rápido
      - Dejar caer el peso demasiado rápido en la bajada
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la técnica correcta
      - Usa una barra EZ si sientes molestias en las muñecas
      - Variante avanzada: realiza negativas lentas (3-5 segundos) en la fase de bajada
      - Los principiantes pueden usar mancuernas para una posición de muñeca más natural
