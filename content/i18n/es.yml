  Kipping Pull Up:
    name: Dominadas con kipping
    instructions: |
      ## Resumen
      Las dominadas con kipping son un ejercicio dinámico de tracción con el peso corporal que trabaja principalmente el dorsal ancho aprovechando el impulso. También involucran los hombros, el core y los flexores de cadera mediante un balanceo coordinado, lo que las convierte en un movimiento funcional para CrossFit y el entrenamiento atlético.

      ## Ejecución
      ### 1. Posición inicial
      - Cuélgate de una barra de dominadas con agarre prono, con las manos algo más separadas que el ancho de hombros
      - Deja el cuerpo completamente extendido, con los brazos rectos
      - Activa el core y prepárate para iniciar el kipping
      - Mantén los hombros activos, sin colgarte de forma pasiva

      ### 2. Movimiento
      1. Genera impulso empujando el cuerpo hacia adelante y luego llevándolo hacia atrás en arco
      2. Cuando el cuerpo se balancee hacia adelante, lleva las caderas hacia la barra
      3. Aprovecha el impulso ascendente para llevar la barbilla por encima de la barra
      4. Empuja la barra para alejarte en la parte alta e iniciar el siguiente kip
      5. Deja que el cuerpo vuelva a balancearse hasta la posición de arco
      6. Repite el kipping con un ritmo fluido y continuo

      ### 3. Respiración
      - Respira de forma rítmica durante el balanceo continuo
      - Evita contener la respiración durante el movimiento

      ### 4. Consejos
      - Domina las dominadas estrictas antes de intentar variantes con kipping
      - Genera el impulso desde las caderas, no solo con los brazos
      - Mantén un movimiento fluido y continuo
      - Piensa en el gesto como un balanceo coordinado de todo el cuerpo
      - Practica por separado las posiciones hollow y de arco antes de combinarlas

      ### 5. Errores comunes
      - Intentar el kipping sin fuerza suficiente en dominadas estrictas
      - Balancearse en exceso y sin control
      - No coordinar el empuje de cadera con la tracción
      - Perder el ritmo entre repeticiones
      - Dejar los hombros desactivados en la parte baja
      - Hacer kipping sin entender la progresión adecuada

      ### 6. Seguridad y modificaciones
      - Construye una base de 5-10 dominadas estrictas antes de hacer kipping
      - Practica por separado los balanceos en hollow y en arco
      - Usa una máquina asistida de dominadas para ganar fuerza de base
      - Trabaja con un entrenador para aprender la mecánica del kipping de forma segura
