    instructions: |
      ## Resumen
      El press militar en máquina Smith es un ejercicio compuesto guiado que trabaja principalmente las tres cabezas de los deltoides. También involucra los tríceps y la parte superior del pecho, usando una trayectoria vertical fija de la barra que aporta estabilidad y permite concentrarse en la potencia de empuje.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca un banco bajo la barra de la máquina Smith (o quédate de pie)
      - Ajusta la altura de la barra al nivel de la parte alta del pecho
      - Agarra la barra un poco más separado que el ancho de los hombros, con las palmas hacia adelante
      - Libera la barra girándola
      - Mantén el pecho erguido, el core activado y los pies apoyados

      ### 2. Movimiento
      1. Empuja la barra en línea recta hacia arriba extendiendo los brazos
      2. Continúa empujando hasta que los brazos queden completamente extendidos
      3. Alcanza la extensión completa de los codos arriba
      4. Haz una breve pausa arriba
      5. Baja la barra hasta la altura de los hombros con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras empujas la barra hacia arriba
      - Inhala mientras la bajas

      ### 4. Consejos
      - La trayectoria fija de la barra ayuda a mantener una técnica correcta
      - Mantén el core firme para evitar arquear la zona lumbar
      - Aprovecha la trayectoria guiada para hacer repeticiones controladas
      - Concéntrate en empujar en línea recta hacia arriba
