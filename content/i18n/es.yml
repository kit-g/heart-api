  Upright Row (Barbell):
    name: Remo al mentón (barra)
    instructions: |
      ## Resumen
      El remo al mentón con barra es un ejercicio compuesto de tracción que trabaja principalmente los deltoides laterales y el trapecio superior. También involucra los bíceps, los antebrazos y el trapecio medio, y utiliza una tracción vertical para fortalecer los hombros y la parte alta de la espalda.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas sosteniendo una barra con agarre prono
      - Coloca las manos algo más juntas que el ancho de los hombros
      - Deja que la barra cuelgue con los brazos extendidos frente a los muslos
      - Mantén los hombros hacia atrás y el core activado
      - Mantén una postura erguida en todo momento

      ### 2. Movimiento
      1. Tira de la barra hacia arriba pegada al cuerpo elevando los codos
      2. Guía con los codos, manteniéndolos por encima de las muñecas
      3. Continúa tirando hasta que la barra llegue a la parte alta del pecho o al mentón
      4. Mantén la barra pegada al cuerpo en todo momento
      5. Haz una breve pausa en la parte superior del movimiento
      6. Baja lentamente la barra a la posición inicial con control

      ### 3. Respiración
      - Exhala al tirar de la barra hacia arriba
      - Inhala al bajar la barra

      ### 4. Consejos
      - Guía con los codos, no con las manos
      - Mantén la barra pegada al cuerpo durante todo el movimiento
      - Evita encoger los hombros en la parte superior
      - Controla tanto la fase de subida como la de bajada
      - Usa un agarre de ancho moderado para proteger los hombros

      ### 5. Errores comunes
      - Tirar demasiado alto y forzar los hombros
      - Dejar que los codos queden por debajo de las muñecas
      - Usar impulso o balancear el cuerpo
      - Inclinarse hacia atrás durante la tracción
      - Usar un agarre demasiado amplio, que puede causar pinzamiento de hombro
      - Moverse demasiado rápido y perder el control

      ### 6. Seguridad y modificaciones
      - Usa un agarre de ancho moderado para evitar molestias en los hombros
      - Detente a la altura de los hombros si sientes dolor en ellos
      - Usa una barra EZ si la barra recta te causa molestias en las muñecas
      - Variante avanzada: realízalo con mancuernas para un movimiento independiente de cada brazo
