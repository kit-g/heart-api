  Flutter Kick:
    name: Patadas de nado
    instructions: |
      ## Resumen
      Las patadas de nado son un ejercicio dinámico de core con peso corporal que trabaja principalmente la parte inferior del recto abdominal y los flexores de cadera. También involucran el transverso abdominal y los oblicuos como estabilizadores, desarrollando resistencia en el abdomen bajo mediante movimientos alternos y continuos de las piernas.

      ## Ejecución
      ### 1. Posición inicial
      - Acuéstate boca arriba en una colchoneta con las piernas completamente extendidas
      - Coloca las manos junto a las caderas o bajo los glúteos como apoyo
      - Presiona la zona lumbar contra la colchoneta y activa el core
      - Levanta las piernas ligeramente del suelo, unas 6-12 pulgadas (15-30 cm)
      - Mantén la cabeza y los hombros relajados sobre la colchoneta

      ### 2. Movimiento
      1. Alterna subiendo y bajando cada pierna con un movimiento de aleteo pequeño y rápido
      2. Mantén las piernas rectas y las puntas de los pies estiradas en todo momento
      3. Conserva un ritmo constante y controlado sin tocar el suelo
      4. Mantén la zona lumbar firmemente presionada contra la colchoneta
      5. Continúa el aleteo alterno durante el número de repeticiones o el tiempo deseado
      6. Concéntrate en movimientos pequeños y rápidos en lugar de grandes balanceos de pierna

      ### 3. Respiración
      - Respira de forma constante y natural durante todo el movimiento
      - Evita contener la respiración; mantén un ritmo respiratorio uniforme

      ### 4. Consejos
      - Mantén las piernas relativamente bajas para aumentar el trabajo del abdomen bajo
      - Presiona la zona lumbar contra la colchoneta para proteger la columna
      - Muévete desde las caderas, no desde las rodillas
      - Mantén el core firme durante toda la serie
      - Concéntrate en movimientos rápidos y controlados en lugar de patadas amplias

      ### 5. Errores comunes
      - Dejar que la zona lumbar se arquee y se despegue de la colchoneta
      - Hacer movimientos de pierna demasiado amplios, lo que reduce el trabajo del core
      - Dejar que las piernas bajen demasiado o toquen el suelo entre patadas
      - Tensar el cuello y la parte superior del cuerpo innecesariamente
      - Moverse demasiado lento o de forma irregular
      - Contener la respiración durante el ejercicio

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden elevar más las piernas para reducir la intensidad
      - Coloca las manos bajo los glúteos para dar apoyo adicional a la zona lumbar
      - Variante avanzada: realiza el ejercicio con la cabeza y los hombros elevados en posición de crunch
      - Si sientes molestias en la zona lumbar, eleva más las piernas o reduce la duración
