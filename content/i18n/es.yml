  Side Bend (Cable):
    name: Flexión lateral (polea)
    instructions: |
      ## Resumen
      La flexión lateral en polea es un ejercicio de core con resistencia que trabaja principalmente los oblicuos y el transverso abdominal. También involucra el cuadrado lumbar y los erectores espinales como estabilizadores, proporcionando tensión constante durante todo el movimiento para desarrollar fuerza lateral del core.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de lado junto a una polea baja con los pies separados al ancho de los hombros
      - Agarra el mango con la mano más cercana a la máquina
      - Aléjate un poco para crear tensión en el cable
      - Coloca la mano libre detrás de la cabeza o en la cadera
      - Mantente erguido con el core activado y los hombros nivelados

      ### 2. Movimiento
      1. Flexiónate lentamente alejándote de la polea contrayendo los oblicuos del lado opuesto
      2. Mantén las caderas estables y mirando al frente en todo momento
      3. Flexiónate lateralmente tanto como te resulte cómodo manteniendo el control
      4. Haz una pausa breve al final del movimiento
      5. Vuelve a la posición inicial erguida con control, resistiendo el tirón del cable
      6. Completa todas las repeticiones de un lado y luego repite con el otro

      ### 3. Respiración
      - Exhala al flexionarte alejándote de la polea
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Concéntrate en una flexión lateral pura, sin girar ni inclinarte hacia delante
      - Mantén las caderas y los hombros mirando al frente en todo momento
      - Muévete despacio y con control para maximizar el trabajo de los oblicuos
      - Evita flexionarte hacia la polea, lo que reduce la efectividad
      - Mantén la tensión en el cable durante todo el rango de movimiento

      ### 5. Errores comunes
      - Usar demasiado peso y comprometer la técnica
      - Girar o rotar en lugar de flexionarse lateralmente de forma pura
      - Dejar que las caderas se desplacen de lado a lado
      - Flexionarse hacia delante o hacia atrás en lugar de directamente hacia el lado
      - Moverse demasiado rápido y usar impulso
      - No controlar el regreso a la posición inicial

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón de movimiento
      - Los principiantes pueden practicar sin peso para establecer una técnica correcta
      - Variante avanzada: haz una pausa de 2-3 segundos en la contracción máxima
      - Si sientes molestias en la zona lumbar, reduce el peso y revisa tu técnica
