  Upright Row (Dumbbell):
    name: Remo al mentón (mancuernas)
    instructions: |
      ## Resumen
      El remo al mentón con mancuernas es un ejercicio compuesto del tren superior que trabaja principalmente los deltoides medios y el trapecio superior. También involucra los deltoides anteriores y los bíceps, usando mancuernas para un movimiento independiente de cada brazo que desarrolla la amplitud de hombros y el trapecio superior.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies al ancho de hombros sosteniendo una mancuerna en cada mano
      - Deja que las mancuernas cuelguen con los brazos extendidos frente a tus muslos
      - Mantén las palmas hacia tu cuerpo
      - Mantente erguido con el pecho arriba y el core activado
      - Conserva una buena postura durante todo el ejercicio

      ### 2. Movimiento
      1. Tira de las mancuernas en línea recta hacia arriba, pegadas a tu cuerpo
      2. Guía el movimiento con los codos, manteniéndolos más altos que las manos
      3. Continúa tirando hasta que las mancuernas lleguen a la parte alta del pecho o a la altura de los hombros
      4. Haz una pausa breve arriba
      5. Baja lentamente las mancuernas de vuelta a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras tiras de las mancuernas hacia arriba
      - Inhala mientras las bajas

      ### 4. Consejos
      - Mantén las mancuernas cerca de tu cuerpo mientras tiras
      - Guía el movimiento con los codos en todo momento
      - Concéntrate en tirar con los hombros y los trapecios
      - Controla tanto la fase de tirón como la de bajada
      - Las mancuernas permiten una trayectoria de brazos más natural

      ### 5. Errores comunes
      - Tirar demasiado alto y forzar los hombros
      - Dejar que los codos bajen por debajo de las muñecas
      - Usar impulso o balancear el cuerpo
      - Inclinarse hacia atrás durante el tirón
      - Usar un agarre demasiado amplio, lo que puede causar pinzamiento en el hombro
      - Moverse demasiado rápido y perder el control

      ### 6. Seguridad y modificaciones
      - Usa un agarre de anchura moderada para evitar molestias en el hombro
      - Detente a la altura de los hombros si sientes cualquier dolor en el hombro
      - Empieza con mancuernas ligeras para dominar el patrón de movimiento
      - Si sientes molestias en el hombro, considera el face pull como alternativa
