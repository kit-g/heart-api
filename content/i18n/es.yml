  Hack Squat:
    name: Sentadilla hack
    instructions: |
      ## Resumen
      La sentadilla hack es un ejercicio compuesto de tren inferior que trabaja principalmente los cuádriceps. También involucra los glúteos y los isquiotibiales, y utiliza una máquina o una posición de barra que permite cargas altas con menos estrés en la zona lumbar que la sentadilla tradicional.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate en la máquina de sentadilla hack con la espalda contra el respaldo
      - Apoya los pies en la plataforma al ancho de los hombros, con las puntas ligeramente hacia fuera
      - Coloca los hombros bajo las hombreras
      - Libera los seguros y sujeta las asas laterales
      - Mantén el pecho erguido y el core activado

      ### 2. Movimiento
      1. Desciende flexionando rodillas y caderas
      2. Mantén la espalda pegada al respaldo en todo momento
      3. Baja hasta que los muslos queden al menos paralelos a la plataforma
      4. Haz una breve pausa abajo
      5. Empuja con los talones para volver a la posición inicial
      6. Extiende por completo las piernas arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al descender
      - Exhala al empujar de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén la espalda firmemente pegada al respaldo
      - La trayectoria en ángulo enfatiza el desarrollo de los cuádriceps
      - Empuja con todo el pie, no solo con las puntas
      - Mantén las rodillas alineadas con las puntas de los pies
      - Mantén la tensión constante durante todo el movimiento

      ### 5. Errores comunes
      - Despegar la espalda del respaldo durante el movimiento
      - No alcanzar la profundidad adecuada
      - Dejar que las rodillas se vayan hacia dentro
      - Bloquear por completo las rodillas arriba
      - Usar demasiado peso y comprometer la técnica
      - Colocar los pies demasiado bajos en la plataforma, aumentando el estrés en las rodillas

      ### 6. Seguridad y modificaciones
      - Ajusta la posición de los pies en la plataforma para enfocar distintas zonas del cuádriceps
      - Mantén las rodillas detrás de las puntas de los pies o alineadas con ellas para reducir el estrés en las rodillas
      - Empieza con poco peso para dominar el patrón de movimiento
      - Variación avanzada: realiza sentadillas hack a una pierna o añade una pausa abajo
