  Around the World:
    name: Alrededor del mundo
    instructions: |
      ## Resumen
      El alrededor del mundo es un ejercicio dinámico de pecho que trabaja principalmente el pectoral mayor a través de un arco de movimiento amplio. También involucra los deltoides frontales y el core como estabilizadores, y utiliza mancuernas para crear tensión constante durante un patrón de movimiento circular.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate en un banco plano con los pies firmemente apoyados en el suelo
      - Sostén una mancuerna en cada mano con los brazos extendidos sobre el pecho
      - Mantén una ligera flexión de codos durante todo el movimiento
      - Activa el core y presiona la espalda contra el banco
      - Coloca las mancuernas con las palmas enfrentadas

      ### 2. Movimiento
      1. Baja las mancuernas hacia los lados y hacia abajo en un arco amplio
      2. Continúa el arco hasta que las mancuernas queden junto a las caderas
      3. Invierte el movimiento llevando las mancuernas hacia arriba y alrededor hasta la posición inicial
      4. Mantén una ligera flexión de codos durante todo el recorrido circular
      5. Mantén el control y la tensión en los músculos del pecho
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar las mancuernas y rodear con ellas
      - Exhala al llevar las mancuernas de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén una ligera flexión de codos constante en todo momento
      - Concéntrate en mover el peso en un arco suave y controlado
      - Mantén tensión constante en los músculos del pecho
      - Evita bloquear los codos en cualquier punto
      - Usa menos peso que en los ejercicios de pecho habituales

      ### 5. Errores comunes
      - Usar demasiado peso y comprometer el arco del movimiento
      - Estirar por completo los codos durante el movimiento
      - Moverse demasiado rápido y perder el control
      - No mantener tensión constante en el pecho
      - Arquear en exceso la zona lumbar separándola del banco
      - Detenerse abajo en lugar de mantener un movimiento continuo

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas ligeras para dominar el patrón de movimiento circular
      - Mantén los codos ligeramente flexionados para proteger las articulaciones de los hombros
      - Realiza el movimiento en dirección inversa para variar
      - Si sientes molestias en los hombros, reduce el rango de movimiento o el peso
