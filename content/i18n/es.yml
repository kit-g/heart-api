  Bent Over Row (Band):
    name: Remo inclinado (banda)
    instructions: |
      ## Resumen
      El remo inclinado con banda es un ejercicio de tirón con resistencia que trabaja principalmente el dorsal ancho, los romboides y la porción media de los trapecios. También involucra los bíceps y los deltoides posteriores, y ofrece una resistencia progresiva durante todo el movimiento para un desarrollo eficaz de la espalda.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas, pisando el centro de una banda
      - Sujeta cada extremo de la banda con las manos
      - Haz una bisagra de cadera inclinándote hacia adelante con las rodillas ligeramente flexionadas
      - Mantén la espalda plana y el core activado
      - Deja que los brazos cuelguen rectos hacia abajo con la banda en tensión

      ### 2. Movimiento
      1. Tira de la banda hacia el torso llevando los codos hacia atrás
      2. Mantén los codos cerca del cuerpo mientras remas
      3. Continúa hasta que las manos lleguen a la parte baja de las costillas o a las caderas
      4. Junta las escápulas en la parte alta
      5. Regresa lentamente a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al tirar de la banda hacia el torso
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén la espalda plana y el core firme en todo momento
      - Guía el movimiento con los codos, llevándolos hacia atrás
      - Concéntrate en juntar las escápulas
      - Mantén la tensión constante en la banda
      - Evita redondear la espalda durante el movimiento

      ### 5. Errores comunes
      - Redondear la espalda en lugar de mantener la columna plana
      - Usar impulso en lugar de un movimiento controlado
      - No lograr el rango completo de movimiento
      - Ponerse demasiado erguido y reducir el trabajo de la espalda
      - Perder la tensión de la banda en la parte baja
      - Hacer las repeticiones demasiado rápido

