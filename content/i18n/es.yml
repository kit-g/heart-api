  Front Squat (Barbell):
    name: Sentadilla frontal (barra)
    instructions: |
      ## Resumen
      La sentadilla frontal con barra es un ejercicio compuesto de tren inferior que trabaja principalmente los cuádriceps, con mayor énfasis que la sentadilla trasera. También involucra los glúteos, los isquiotibiales, el core y la parte alta de la espalda, y utiliza una posición de la barra por delante del cuerpo que favorece un torso más erguido.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca la barra en un rack a la altura de la parte alta del pecho
      - Pasa por debajo de la barra y apóyala sobre los deltoides frontales
      - Crea una repisa con los hombros, manteniendo los codos altos y apuntando al frente
      - El agarre puede ser de cargada (dedos bajo la barra) o de brazos cruzados
      - Colócate con los pies separados al ancho de los hombros y las puntas ligeramente hacia fuera

      ### 2. Movimiento
      1. Saca la barra del rack y da un paso atrás con los pies al ancho de los hombros
      2. Inicia la sentadilla flexionando rodillas y caderas al mismo tiempo
      3. Mantén el torso erguido y los codos altos en todo momento
      4. Desciende hasta que los muslos queden al menos paralelos al suelo
      5. Empuja con los talones para volver a la posición de pie
      6. Mantén los codos arriba y el pecho erguido, y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala profundo y activa el core antes de descender
      - Aguanta la respiración durante el descenso y la posición baja
      - Exhala al subir o al llegar arriba

      ### 4. Consejos
      - Mantén los codos lo más altos posible en todo momento
      - La carga frontal obliga a mantener el torso más erguido
      - Concéntrate en mantener el pecho erguido y el core firme
      - Empuja las rodillas hacia fuera al descender
      - La sentadilla frontal enfatiza los cuádriceps más que la sentadilla trasera

      ### 5. Errores comunes
      - Dejar caer los codos, haciendo que la barra ruede hacia delante
      - Inclinarse demasiado hacia delante y perder la posición erguida
      - No alcanzar la profundidad adecuada
      - Dejar que las rodillas se vayan hacia dentro
      - Usar demasiado peso antes de dominar la posición
      - No mantener la tensión del core en todo momento

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la posición de rack frontal
      - Usa el agarre de brazos cruzados si el agarre de cargada te resulta incómodo
      - Practica primero la sentadilla frontal solo con la barra
      - Variación avanzada: añade una pausa abajo o realiza sentadillas frontales con tempo
