  Inverted Row (Bodyweight):
    name: Remo invertido (peso corporal)
    instructions: |
      ## Resumen
      El remo invertido es un ejercicio de tirón con peso corporal que trabaja principalmente el dorsal ancho, los romboides y la porción media de los trapecios. También involucra los bíceps, los deltoides posteriores y el core, lo que lo convierte en un movimiento de tirón horizontal eficaz para desarrollar fuerza y resistencia muscular en la espalda.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate debajo de una barra fija situada entre la altura de la cintura y la del pecho
      - Sujeta la barra con agarre prono, con las manos separadas al ancho de los hombros
      - Extiende el cuerpo recto con los talones en el suelo y los brazos completamente extendidos
      - Mantén el cuerpo en línea recta de la cabeza a los talones
      - Activa el core y los glúteos en todo momento

      ### 2. Movimiento
      1. Tira del pecho hacia la barra llevando los codos hacia atrás
      2. Mantén el cuerpo recto y el core firme mientras tiras
      3. Continúa hasta que el pecho toque o casi toque la barra
      4. Junta las escápulas en la parte alta
      5. Baja lentamente a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al tirar del pecho hacia la barra
      - Inhala al bajar de vuelta

      ### 4. Consejos
      - Mantén el cuerpo en línea recta durante todo el movimiento
      - Guía el movimiento con el pecho y mantén los codos cerca del cuerpo
      - Concéntrate en juntar las escápulas
      - Evita que las caderas se hundan o se eleven en pica
      - Controla tanto la fase de tirón como la de bajada

      ### 5. Errores comunes
      - Dejar que las caderas se hundan o se eleven en pica
      - No lograr el rango completo de movimiento arriba
      - Usar impulso en lugar de un movimiento controlado
      - Dejar que los codos se abran en exceso
      - No mantener la línea recta del cuerpo
      - Hacer las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Sube la barra para facilitar el ejercicio si eres principiante
      - Baja la barra o eleva los pies para aumentar la dificultad
      - Realízalo con agarre supino para un énfasis muscular diferente
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte alta de cada repetición
