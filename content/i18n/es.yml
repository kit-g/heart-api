  Pull Up (Assisted):
    name: Dominadas (asistidas)
    instructions: |
      ## Resumen
      Las dominadas asistidas son un ejercicio de tracción en máquina que trabaja principalmente el dorsal ancho con ayuda. También involucran los romboides, el trapecio medio y los bíceps, y usan un contrapeso que hace el movimiento más accesible mientras construyes fuerza hacia las dominadas sin asistencia.

      ## Ejecución
      ### 1. Posición inicial
      - Selecciona el peso en la máquina asistida de dominadas (más peso = más asistencia)
      - Sujeta las asas con agarre prono, con las manos algo más separadas que el ancho de hombros
      - Apoya las rodillas o los pies en la plataforma de asistencia
      - Cuélgate con los brazos completamente extendidos y los hombros activos
      - Mantén el core firme y el cuerpo estable

      ### 2. Movimiento
      1. Sube llevando los codos hacia abajo y atrás
      2. Continúa hasta que la barbilla supere las asas o la barra
      3. Mantén el core activado y el movimiento controlado
      4. Haz una breve pausa en la parte alta
      5. Baja lentamente hasta la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir
      - Inhala al bajar

      ### 4. Consejos
      - Reduce gradualmente el peso de asistencia a medida que ganes fuerza
      - Concéntrate en tirar con los músculos de la espalda, no solo con los brazos
      - Mantén los hombros abajo y atrás en todo momento
      - Controla tanto la fase de subida como la de bajada
      - Evita depender demasiado de la asistencia

      ### 5. Errores comunes
      - Usar demasiada asistencia y no exigirte
      - No completar el rango completo de movimiento
      - Encoger los hombros hacia arriba
      - Usar impulso en lugar de un movimiento controlado
      - No reducir gradualmente el peso de asistencia con el tiempo
      - Tirar solo con los brazos sin activar la espalda

      ### 6. Seguridad y modificaciones
      - Empieza con más asistencia y redúcela gradualmente a medida que te fortalezcas
      - Prioriza la técnica antes que reducir la asistencia demasiado rápido
      - Progresa hacia dominadas con banda o negativas antes de intentarlas sin ayuda
      - Haz jalones al pecho como alternativa para construir fuerza de base
