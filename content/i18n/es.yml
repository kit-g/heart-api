  Chin Up:
    name: Dominadas supinas
    instructions: |
      ## Resumen
      Las dominadas supinas son un ejercicio de tirón con peso corporal que trabaja principalmente el dorsal ancho y los bíceps. También involucran los romboides, la porción media de los trapecios y el core, y utilizan un agarre supino que enfatiza los bíceps más que las dominadas tradicionales, para una fuerza de tirón eficaz en el tren superior.

      ## Ejecución
      ### 1. Posición inicial
      - Cuélgate de una barra de dominadas con agarre supino (palmas hacia ti)
      - Coloca las manos algo más juntas que el ancho de los hombros
      - Deja el cuerpo colgando completamente extendido con los brazos rectos
      - Activa el core y mantén los hombros descendidos
      - Cruza los tobillos o mantén las piernas rectas

      ### 2. Movimiento
      1. Súbete tirando de los codos hacia abajo y atrás
      2. Continúa tirando hasta que el mentón supere la barra
      3. Mantén el core firme y evita balancearte en exceso
      4. Haz una pausa breve en la parte alta del movimiento
      5. Baja lentamente a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al subir
      - Inhala al bajar

      ### 4. Consejos
      - Guía el movimiento con el pecho y mantén los hombros hacia atrás
      - Concéntrate en llevar los codos hacia abajo, no solo las manos hacia arriba
      - Mantén el core activado para minimizar el balanceo
      - Controla el descenso para maximizar el trabajo muscular
      - Piensa en tirar de la barra hacia ti en lugar de subirte a ella

      ### 5. Errores comunes
      - Usar impulso o kipping en lugar de una técnica estricta
      - No lograr el rango completo de movimiento arriba o abajo
      - Dejar que los hombros se encojan hacia las orejas
      - Balancearse en exceso durante el movimiento
      - No extender por completo los brazos abajo
      - Tirar solo con los brazos en lugar de activar la espalda

      ### 6. Seguridad y modificaciones
      - Usa una máquina asistida de dominadas o una banda como ayuda
      - Realiza dominadas supinas negativas (salta hasta arriba y baja despacio) para ganar fuerza
      - Variación avanzada: añade peso con un cinturón de lastre o un chaleco lastrado
      - Progresa de forma gradual para evitar sobrecargar los hombros
