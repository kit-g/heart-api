  Arnold Press (Dumbbell):
    name: Press Arnold (mancuernas)
    instructions: |
      ## Resumen
      El press Arnold es un ejercicio compuesto de hombros que trabaja principalmente las tres cabezas de los deltoides. También involucra los tríceps y la parte superior del pecho, usando un press con rotación de las mancuernas para lograr un desarrollo completo del hombro a través de un rango de movimiento único.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en un banco con respaldo, sosteniendo una mancuerna en cada mano
      - Coloca las mancuernas a la altura de los hombros con las palmas hacia el cuerpo
      - Mantén los codos por delante del torso
      - Activa el core y mantén la espalda apoyada contra el respaldo
      - Apoya los pies planos en el suelo

      ### 2. Movimiento
      1. Presiona las mancuernas hacia arriba mientras rotas las palmas hacia afuera
      2. Continúa presionando y rotando hasta extender por completo los brazos por encima de la cabeza
      3. Arriba, las palmas deben quedar mirando hacia adelante
      4. Haz una breve pausa arriba
      5. Invierte el movimiento rotando las palmas de nuevo hacia adentro mientras bajas
      6. Vuelve a la posición inicial con las palmas hacia el cuerpo y repite

      ### 3. Respiración
      - Inhala en la posición inicial
      - Exhala mientras presionas las mancuernas hacia arriba
      - Inhala mientras bajas las mancuernas

      ### 4. Consejos
      - La rotación debe ser suave y controlada en todo momento
      - Mantén el core activado para proteger la zona lumbar
      - Concéntrate en la rotación tanto como en el press
      - Controla por igual la fase de empuje y la de bajada
      - La rotación característica trabaja las tres cabezas del deltoides

      ### 5. Errores comunes
      - Rotar demasiado rápido y perder el control
      - Arquear la zona lumbar en exceso
      - No completar la rotación
      - Usar demasiado peso y comprometer la técnica
      - Dejar que los codos se abran hacia afuera demasiado pronto
      - Hacer el movimiento con prisa

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas más ligeras que en un press de hombros estándar
      - Domina el patrón de rotación antes de añadir peso
      - Realízalo de pie para un desafío adicional del core
      - Si sientes molestias en el hombro, reduce el peso o el rango de movimiento
