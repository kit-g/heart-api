  Rack Pull (Barbell):
    name: Peso muerto desde soportes (barra)
    instructions: |
      ## Resumen
      El peso muerto desde soportes es un peso muerto de rango parcial que trabaja principalmente la parte alta de la espalda, los trapecios y los erectores espinales. También involucra los glúteos y los isquiotibiales, y usa una posición inicial elevada que permite cargas más pesadas y centrarse en la fase final de extensión del peso muerto.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca la barra en un rack de potencia a la altura de las rodillas o justo por debajo
      - Ponte de pie con los pies al ancho de caderas y la barra sobre la mitad del pie
      - Sujeta la barra justo por fuera de las piernas con agarre prono o mixto
      - Mantén el pecho arriba, la espalda plana y los hombros ligeramente por delante de la barra
      - Activa el core y los dorsales antes de levantar

      ### 2. Movimiento
      1. Empuja con los talones y extiende las caderas para levantar la barra
      2. Mantén la barra pegada al cuerpo mientras tiras
      3. Ponte completamente de pie extendiendo las caderas y llevando los hombros atrás
      4. Junta las escápulas en la parte alta
      5. Baja la barra a los soportes del rack con control
      6. Recoloca la posición y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala profundo y activa el core antes de cada repetición
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - Mantén la espalda plana y el pecho arriba en todo momento
      - Concéntrate en empujar con los talones
      - Lleva los hombros atrás arriba para lograr la extensión completa
      - Mantén la barra pegada al cuerpo durante todo el movimiento
      - Usa más peso que en tu peso muerto habitual gracias al rango reducido

      ### 5. Errores comunes
      - Redondear la parte alta de la espalda durante el tirón
      - Empezar con las caderas demasiado bajas
      - Dejar que la barra se aleje del cuerpo
      - No completar la extensión arriba
      - Usar impulso en lugar de un movimiento controlado
      - Colocar los soportes demasiado altos y perder el beneficio del ejercicio

      ### 6. Seguridad y modificaciones
      - Empieza con los soportes a la altura de las rodillas y ajusta según tus objetivos
      - Usa correas si la fuerza de agarre te limita
      - Variación avanzada: hazlo con déficit para aumentar el rango
      - Si notas molestias en la zona lumbar, sube los soportes y reduce el peso
