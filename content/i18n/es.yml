  Triceps Extension (Cable):
    name: Extensión de tríceps (polea)
    instructions: |
      ## Resumen
      La extensión de tríceps en polea es un ejercicio de aislamiento que trabaja principalmente las tres cabezas del tríceps con tensión constante. También involucra los hombros y el core como estabilizadores, y utiliza una posición de polea por encima de la cabeza para mantener una resistencia continua durante todo el movimiento.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de espaldas a una polea alta con un accesorio de cuerda
      - Sujeta los extremos de la cuerda y da un paso adelante para crear tensión
      - Coloca los brazos por encima de la cabeza con los codos flexionados
      - Mantén los codos apuntando hacia adelante y relativamente cerca de la cabeza
      - Adopta una postura con un pie adelantado para mayor estabilidad y activa el core

      ### 2. Movimiento
      1. Extiende los codos para empujar las manos hacia adelante y arriba
      2. Mantén la parte superior de los brazos inmóvil y cerca de la cabeza
      3. Continúa hasta que los brazos queden completamente extendidos
      4. Haz una pausa y contrae los tríceps en la extensión completa
      5. Regresa lentamente a la posición inicial con control
      6. Detente antes de que la placa toque la torre de pesas para mantener la tensión constante y repite

      ### 3. Respiración
      - Exhala al extender los brazos hacia adelante
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén la parte superior de los brazos inmóvil durante todo el movimiento
      - Mantén la tensión constante sin dejar que la torre de pesas descanse
      - Mantén los codos relativamente juntos
      - Evita arquear la zona lumbar durante el movimiento
      - Concéntrate en la contracción en la extensión completa

      ### 5. Errores comunes
      - Dejar que los codos se abran en exceso
      - Mover la parte superior de los brazos en lugar de mantenerla inmóvil
      - Dejar que la torre de pesas descanse entre repeticiones
      - Inclinarse demasiado hacia adelante
      - Usar impulso en lugar de un movimiento controlado
      - No lograr la extensión completa de los codos

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la posición de la polea por encima de la cabeza
      - Prueba distintos accesorios (cuerda, barra recta, barra en V) para variar
      - Variación avanzada: trabaja un brazo a la vez para un enfoque unilateral
      - Arrodíllate sobre ambas rodillas para una posición más estable si lo necesitas
