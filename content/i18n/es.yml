  Iso-Lateral Row (Machine):
    name: Remo iso-lateral (máquina)
    instructions: |
      ## Resumen
      El remo iso-lateral es un ejercicio de tracción en máquina que trabaja principalmente el dorsal ancho, los romboides y el trapecio medio. También involucra los bíceps y los deltoides posteriores, y su movimiento independiente de cada brazo permite corregir desequilibrios de fuerza y entrenar de forma unilateral o bilateral.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de remo iso-lateral con el pecho contra el respaldo
      - Ajusta la altura del asiento para que las asas queden a la altura de la mitad del pecho
      - Sujeta las asas con agarre neutro o prono
      - Mantén los pies apoyados en los reposapiés y el core activado
      - Lleva los hombros hacia atrás y abajo

      ### 2. Movimiento
      1. Tira de las asas hacia el torso llevando los codos hacia atrás
      2. Mantén el pecho pegado al respaldo en todo momento
      3. Continúa hasta que los codos queden por detrás del torso
      4. Junta las escápulas al final del movimiento
      5. Devuelve las asas lentamente a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al tirar de las asas hacia el torso
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Mantén el pecho firme contra el respaldo para aislar la espalda
      - Guía el movimiento con los codos, llevándolos hacia atrás
      - Concéntrate en juntar las escápulas
      - Trabaja ambos brazos a la vez o alterna para un entrenamiento unilateral
      - Controla el peso durante todo el rango de movimiento

      ### 5. Errores comunes
      - Despegar el pecho del respaldo durante el remo
      - Usar impulso en lugar de una contracción muscular controlada
      - No completar el rango completo de movimiento
      - Encoger los hombros hacia arriba
      - Ejecutar las repeticiones demasiado rápido
      - No igualar la fuerza entre ambos brazos

      ### 6. Seguridad y modificaciones
      - Ajusta la altura del asiento para alinearte correctamente con las asas
      - Empieza con poco peso para asentar una buena técnica
      - Trabaja un brazo a la vez para corregir desequilibrios
      - Variación avanzada: haz una pausa de 2-3 segundos en el punto de máxima contracción
