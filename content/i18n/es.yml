  Lat Pulldown (Cable):
    name: Jalón al pecho (polea)
    instructions: |
      ## Resumen
      El jalón al pecho en polea es un ejercicio de tracción en máquina que trabaja principalmente el dorsal ancho. También involucra los romboides, el trapecio medio y los bíceps, y usa una polea alta con tensión constante para desarrollar la amplitud de la espalda y la fuerza de tracción.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la estación de jalón con los muslos sujetos bajo los soportes
      - Sujeta la barra con agarre prono, con las manos algo más separadas que el ancho de hombros
      - Extiende los brazos por completo por encima de la cabeza manteniendo la tensión en la polea
      - Mantén el pecho arriba y los hombros abajo
      - Activa el core y mantén el torso erguido

      ### 2. Movimiento
      1. Tira de la barra hacia la parte alta del pecho llevando los codos hacia abajo y atrás
      2. Mantén el torso erguido o inclínate ligeramente hacia atrás
      3. Continúa hasta que la barra llegue a la parte alta del pecho o a la clavícula
      4. Junta las escápulas en la parte baja
      5. Devuelve la barra lentamente a la posición inicial con control
      6. Detente justo antes de que las placas se apoyen para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala al tirar de la barra hacia abajo
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Guía el movimiento con los codos, no con las manos
      - Mantén el pecho arriba y los hombros atrás en todo momento
      - Concéntrate en juntar las escápulas
      - Mantén la tensión constante sin dejar que las placas se apoyen
      - Evita usar impulso o balancear el cuerpo en exceso

      ### 5. Errores comunes
      - Inclinarse demasiado hacia atrás y convertir el ejercicio en un remo
      - Usar impulso para bajar el peso
      - No completar el rango de movimiento arriba o abajo
      - Encoger los hombros hacia arriba
      - Dejar que las placas se apoyen entre repeticiones
      - Llevar la barra por detrás del cuello, lo que puede forzar los hombros

      ### 6. Seguridad y modificaciones
      - Ajusta la altura del asiento y el soporte de muslos para fijar el tren inferior
      - Empieza con un peso moderado para dominar la técnica
      - Prueba un agarre supino para variar el énfasis muscular
      - Variación avanzada: haz una pausa de 2-3 segundos en la parte baja de cada repetición
