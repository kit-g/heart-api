  Squat Row (Band):
    name: Sentadilla con remo (banda)
    instructions: |
      ## Resumen
      La sentadilla con remo (banda) es un ejercicio compuesto de cuerpo completo que combina una sentadilla con un movimiento de remo. Trabaja principalmente las piernas, la espalda y el core, usando una banda para coordinar el tren inferior y el superior mientras se desarrollan fuerza y coordinación.

      ## Ejecución
      ### 1. Posición inicial
      - Ancla una banda a la altura del pecho
      - Colócate de frente al punto de anclaje sujetando ambos extremos de la banda
      - Camina hacia atrás hasta que la banda tenga tensión con los brazos extendidos
      - Ponte de pie con los pies separados al ancho de los hombros
      - Mantén el pecho erguido y el core activado

      ### 2. Movimiento
      1. Baja en sentadilla mientras dejas que los brazos se extiendan hacia adelante
      2. En el punto más bajo de la sentadilla, empieza a tirar de la banda hacia tu cuerpo
      3. Rema llevando la banda hacia el pecho mientras subes de la sentadilla
      4. Termina de pie con la banda llevada al pecho
      5. Extiende los brazos mientras bajas a la siguiente sentadilla
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar en sentadilla
      - Exhala al remar y ponerte de pie

      ### 4. Consejos
      - Coordina con fluidez la sentadilla y el remo
      - Mantén tensión constante en la banda durante todo el movimiento
      - Activa el core para mantener la estabilidad
      - Concéntrate en que el tren inferior y el superior trabajen juntos
      - Este ejercicio desarrolla la coordinación de todo el cuerpo

      ### 5. Errores comunes
      - No coordinar la sentadilla con el remo
      - Dejar que la banda pierda tensión
      - Redondear la espalda durante la sentadilla
      - Remar solo con los brazos sin activar la espalda
      - Poca profundidad en la sentadilla
      - Moverse demasiado rápido y perder el control

      ### 6. Seguridad y modificaciones
      - Ajusta la resistencia acercándote o alejándote del anclaje
      - Prioriza la técnica sobre la velocidad o la resistencia
      - Haz primero sentadillas y remos por separado para dominar cada movimiento
      - Ancla la banda de forma segura antes de empezar
    validated: false
