  Cable Crunch:
    name: Crunch en polea
    instructions: |
      ## Resumen
      El crunch en polea es un ejercicio de core eficaz que trabaja principalmente el recto abdominal con tensión constante durante todo el movimiento. También involucra los oblicuos y el transverso abdominal como estabilizadores, lo que lo convierte en una opción popular para desarrollar fuerza y definición abdominal.

      ## Ejecución
      ### 1. Posición inicial
      - Arrodíllate frente a una polea alta con un accesorio de cuerda
      - Sujeta los extremos de la cuerda y colócalos junto a la cabeza o a la altura del pecho
      - Mantén las caderas inmóviles y una ligera inclinación hacia adelante
      - Activa el core y lleva las escápulas hacia abajo y atrás
      - Colócate lo bastante cerca para que la placa de peso no descanse entre repeticiones

      ### 2. Movimiento
      1. Exhala y haz el crunch hacia abajo contrayendo los abdominales y llevando los codos hacia los muslos
      2. Concéntrate en enrollar el torso hacia adelante, no solo en tirar con los brazos
      3. Aprieta con fuerza los abdominales en la parte baja del movimiento durante 1-2 segundos
      4. Regresa lentamente a la posición inicial bajo control manteniendo la tensión
      5. Detente justo antes de que la placa de peso se apoye para mantener tensión constante en el core
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala con fuerza mientras bajas en el crunch y contraes los abdominales
      - Inhala mientras regresas a la posición inicial

      ### 4. Consejos
      - Mantén las caderas fijas durante todo el movimiento; solo debe moverse el torso
      - Piensa en llevar la caja torácica hacia la pelvis en lugar de solo inclinarte hacia adelante
      - Mantén un tempo controlado; evita los tirones y el impulso
      - Conserva la tensión en los abdominales sin dejar que el peso descanse entre repeticiones
      - Los brazos deben permanecer en una posición fija respecto a la cabeza

      ### 5. Errores comunes
      - Tirar con los brazos y los hombros en lugar de contraer los abdominales
      - Dejar que las caderas se balanceen hacia adelante y atrás
      - Moverse demasiado rápido y depender del impulso
      - Dejar que la placa de peso descanse por completo entre repeticiones
      - Elegir un peso demasiado alto que comprometa la técnica
      - Extender demasiado la columna en el regreso, lo que puede sobrecargar la zona lumbar

      ### 6. Seguridad y modificaciones
      - Empieza con un peso ligero para dominar la técnica y la conexión mente-músculo
      - Si sientes molestias en el cuello, prueba a sujetar la cuerda a la altura del pecho en lugar de junto a la cabeza
      - Variante avanzada: haz una pausa de 3-5 segundos en la contracción máxima para aumentar la intensidad
      - Regresión: realiza crunches con el peso corporal hasta desarrollar suficiente fuerza en el core
    validated: false
    source_digest: b3ba6c257213
  Cable Twist:
    name: Giro de torso en polea
    instructions: |
      ## Resumen
      El giro de torso en polea es un ejercicio rotacional de core que trabaja principalmente los oblicuos y el transverso abdominal. También involucra el recto abdominal y los estabilizadores de la cadera durante todo el giro, por lo que resulta eficaz para desarrollar fuerza rotacional y estabilidad del core.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate de lado frente a una polea con el carro ajustado a la altura del pecho
      - Sujeta el mango con ambas manos y aléjate de la máquina para crear tensión
      - Coloca los pies a la anchura de los hombros con las rodillas ligeramente flexionadas
      - Extiende los brazos frente al pecho manteniendo una ligera flexión de codos
      - Activa el core y mantén el torso erguido

      ### 2. Movimiento
      1. Rota el torso alejándote de la polea, girando desde el core
      2. Mantén los brazos extendidos y muévelos como una sola unidad con el torso
      3. Gira tan lejos como te resulte cómodo manteniendo el control y la postura erguida
      4. Haz una breve pausa al final de la rotación
      5. Regresa lentamente a la posición inicial con control, resistiendo el tirón de la polea
      6. Completa todas las repeticiones de un lado y luego repite hacia el otro

      ### 3. Respiración
      - Exhala mientras rotas alejándote de la máquina
      - Inhala mientras regresas a la posición inicial

      ### 4. Consejos
      - Inicia el movimiento desde el core, no desde los brazos ni los hombros
      - Mantén las caderas mirando al frente durante todo el movimiento
      - Mantén el tren inferior estable mientras rota el tren superior
      - Muévete despacio y con control para maximizar la activación del core
      - Mantén la tensión en la polea durante todo el rango de movimiento

      ### 5. Errores comunes
      - Usar impulso o balancear el peso en lugar de rotar con control
      - Dejar que las caderas roten junto con el torso
      - Flexionar o extender los brazos durante el movimiento
      - Inclinarse hacia atrás o adelante en lugar de mantener la postura erguida
      - Elegir un peso demasiado alto que comprometa la técnica
      - Girar demasiado rápido sin el control adecuado

      ### 6. Seguridad y modificaciones
      - Empieza con un peso ligero para dominar el patrón de rotación
      - Los principiantes pueden hacer rotaciones de medio rango hasta ganar control
      - Variante avanzada: haz una pausa de 2-3 segundos en la rotación máxima para aumentar la intensidad
      - Si sientes molestias en la zona lumbar, reduce el rango de movimiento o el peso
    validated: false
