  Back Extension:
    name: Hiperextensiones
    instructions: |
      ## Resumen
      Las hiperextensiones son un ejercicio con peso corporal que trabaja principalmente los erectores espinales y los músculos de la zona lumbar. También involucran los glúteos y los isquiotibiales como músculos secundarios, lo que las hace eficaces para fortalecer la cadena posterior y mejorar la estabilidad de la columna.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate boca abajo en un banco de hiperextensiones
      - Asegura los tobillos bajo los soportes con los muslos apoyados en el cojín
      - Cruza los brazos sobre el pecho o coloca las manos detrás de la cabeza
      - Empieza con el torso flexionado hacia adelante a unos 90 grados
      - Mantén la columna neutra y el core activado

      ### 2. Movimiento
      1. Eleva el torso contrayendo la zona lumbar y los glúteos
      2. Continúa subiendo hasta que el cuerpo forme una línea recta de la cabeza a los talones
      3. Mantén el cuello neutro y evita hiperextender la columna
      4. Haz una pausa breve en la posición superior
      5. Baja lentamente el torso con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al elevar el torso
      - Inhala al bajarlo de vuelta

      ### 4. Consejos
      - Concéntrate en activar la zona lumbar y los glúteos en todo momento
      - Evita hiperextender o arquear en exceso en la parte alta
      - Mantén el core firme para proteger la columna
      - Muévete despacio y con control en ambas direcciones
      - Mantén el cuello en posición neutra, alineado con la columna

      ### 5. Errores comunes
      - Hiperextender la columna en la parte alta del movimiento
      - Usar impulso en lugar de una contracción muscular controlada
      - Dejar que las caderas se levanten del cojín
      - Moverse demasiado rápido y perder el control
      - Arquear el cuello para mirar al frente
      - No activar los glúteos durante el movimiento

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden reducir el rango de movimiento hasta ganar fuerza
      - Sostén un disco contra el pecho para añadir resistencia
      - Realiza el ejercicio en el suelo sin equipamiento si no dispones de banco
      - Si sientes molestias en la zona lumbar, reduce el rango de movimiento y consulta a un profesional
