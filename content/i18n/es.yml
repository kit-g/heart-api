  Kettlebell Swing:
    name: Swing con pesa rusa
    instructions: |
      ## Resumen
      El swing con pesa rusa es un ejercicio dinámico de cuerpo completo que trabaja principalmente los glúteos, los isquiotibiales y el core. También implica los hombros, la espalda y el sistema cardiovascular, usando una bisagra de cadera explosiva para desarrollar potencia, resistencia y fuerza en la cadena posterior.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies un poco más separados que el ancho de los hombros
      - Coloca una pesa rusa en el suelo, a unos 30 cm por delante de ti
      - Haz bisagra de cadera y sujeta la pesa rusa con ambas manos
      - Mantén la espalda plana, el pecho erguido y el core activado
      - Lleva la pesa rusa ligeramente hacia atrás entre las piernas

      ### 2. Movimiento
      1. Empuja las caderas hacia adelante de forma explosiva para balancear la pesa rusa hacia arriba
      2. Deja que la pesa rusa flote hasta la altura del pecho o de los hombros
      3. Mantén los brazos rectos y deja que las caderas hagan el trabajo
      4. Cuando la pesa rusa descienda, vuelve a hacer bisagra de cadera
      5. Deja que la pesa rusa se balancee hacia atrás entre las piernas
      6. Vuelve a empujar las caderas hacia adelante de inmediato para continuar el swing

      ### 3. Respiración
      - Exhala con fuerza al empujar las caderas hacia adelante
      - Inhala mientras la pesa rusa desciende

      ### 4. Consejos
      - Es un movimiento de bisagra de cadera, no una sentadilla
      - La potencia viene de las caderas, no de los brazos
      - Mantén el core firme durante todo el movimiento
      - La pesa rusa debe sentirse ingrávida en el punto más alto
      - Mantén la columna neutra en todo momento

      ### 5. Errores comunes
      - Hacer sentadilla en lugar de bisagra de cadera
      - Levantar la pesa rusa con los brazos en lugar de con las caderas
      - Hiperextender la espalda en el punto más alto del swing
      - No empujar las caderas hacia adelante de forma explosiva
      - Dejar que la pesa rusa baje demasiado entre las piernas
      - Redondear la espalda durante la bisagra

      ### 6. Seguridad y modificaciones
      - Empieza con una pesa rusa más ligera para dominar la bisagra de cadera
      - Domina el peso muerto antes de intentar los swings con pesa rusa
      - Detente si sientes molestias en la zona lumbar
      - Variante avanzada: swings a una mano o swings americanos (por encima de la cabeza)
