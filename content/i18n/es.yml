  Handstand Push Up:
    name: Flexiones en parada de manos
    instructions: |
      ## Resumen
      Las flexiones en parada de manos son un ejercicio de empuje con peso corporal de nivel avanzado que trabaja principalmente los hombros. También involucran los tríceps, la parte superior del pecho y el core, usando una posición invertida para crear una carga máxima sobre los hombros mediante un empuje vertical.

      ## Ejecución
      ### 1. Posición inicial
      - Impúlsate hasta una parada de manos contra una pared
      - Coloca las manos un poco más separadas que el ancho de los hombros
      - Mantén el cuerpo en línea recta desde las manos hasta los pies
      - Activa el core y mantén la cabeza en posición neutra
      - Mantén el equilibrio con la ayuda de la pared

      ### 2. Movimiento
      1. Baja el cuerpo flexionando los codos
      2. Desciende hasta que la parte superior de la cabeza casi toque el suelo
      3. Mantén los codos a unos 45 grados respecto al cuerpo
      4. Haz una breve pausa abajo
      5. Empuja con las palmas para extender los brazos
      6. Vuelve a la parada de manos inicial y repite

      ### 3. Respiración
      - Inhala mientras bajas el cuerpo
      - Exhala mientras empujas hacia arriba

      ### 4. Consejos
      - Es un ejercicio avanzado que requiere una fuerza considerable
      - Mantén el core firme para conservar la alineación del cuerpo
      - Controla el descenso para maximizar el trabajo muscular
      - Concéntrate en empujar en línea recta hacia arriba, no en alejarte de la pared
      - Usa la pared como ayuda para el equilibrio

      ### 5. Errores comunes
      - Permitir que la espalda se arquee en exceso
      - No alcanzar el rango completo de movimiento
      - Abrir los codos demasiado hacia afuera
      - Perder la tensión del core y la alineación del cuerpo
      - Intentar este ejercicio antes de desarrollar la fuerza suficiente
      - Moverse demasiado rápido y perder el control

      ### 6. Seguridad y modificaciones
      - Progresa hacia este ejercicio con flexiones pica o flexiones pica con pies elevados
      - Usa una versión asistida con banda de resistencia
      - Realiza solo repeticiones negativas (solo la bajada) para ganar fuerza
      - Asegúrate de poder mantener una parada de manos contra la pared durante 30+ segundos antes de intentarlo
