    instructions: |
      ## Resumen
      La extensión de piernas en máquina es un ejercicio de aislamiento que trabaja principalmente los cuádriceps. Utiliza una trayectoria de movimiento guiada con resistencia ajustable para aislar y fortalecer los cuatro músculos de la parte frontal del muslo.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de extensión de piernas con la espalda firme contra el respaldo
      - Ajusta el rodillo de modo que tus rodillas queden alineadas con el punto de giro de la máquina
      - Coloca los tobillos detrás del rodillo inferior
      - Sujeta las asas a los lados para mayor estabilidad
      - Mantén el core activado en todo momento

      ### 2. Movimiento
      1. Extiende las piernas contrayendo los cuádriceps
      2. Continúa hasta que las piernas queden completamente extendidas
      3. Haz una pausa y aprieta los cuádriceps en la extensión completa
      4. Baja lentamente el peso a la posición inicial con control
      5. Detente justo antes de que la placa de peso toque para mantener la tensión
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala al extender las piernas
      - Inhala al bajar el peso

      ### 4. Consejos
      - Mantén la espalda firmemente presionada contra el respaldo
      - Concéntrate en apretar los cuádriceps en la extensión completa
      - Controla tanto la fase de extensión como la de bajada
      - Mantén tensión constante sin dejar que la placa de peso descanse
      - Apunta los dedos de los pies al frente o ligeramente hacia arriba

      ### 5. Errores comunes
      - Levantar los glúteos del asiento durante la extensión
      - Usar impulso o balancear el peso
      - No lograr la extensión completa de la rodilla en la parte alta
      - Dejar que la placa de peso descanse entre repeticiones
