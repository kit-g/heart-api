  Lateral Raise (Band):
    name: Elevaciones laterales (banda)
    instructions: |
      ## Resumen
      Las elevaciones laterales con banda son un ejercicio de aislamiento que trabaja principalmente los deltoides medios. También involucran el trapecio superior, usando la resistencia progresiva de la banda para desarrollar amplitud de hombros y mejorar la apariencia de unos hombros más anchos.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas, pisando el centro de una banda
      - Sujeta ambos extremos de la banda con las manos a los costados
      - Mantén los brazos rectos con una ligera flexión de codos
      - Mantente erguido con el pecho arriba y el core activado
      - Mantén una buena postura en todo momento

      ### 2. Movimiento
      1. Eleva ambos brazos hacia los lados en un arco amplio
      2. Mantén los brazos rectos con solo una ligera flexión de codos
      3. Continúa elevando hasta que los brazos queden a la altura de los hombros
      4. Haz una breve pausa arriba
      5. Baja lentamente los brazos a los costados con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras elevas los brazos hacia los lados
      - Inhala mientras los bajas

      ### 4. Consejos
      - La banda ofrece una resistencia creciente a medida que elevas
      - Mantén el torso estable y evita usar impulso
      - Concéntrate en guiar el movimiento con los codos ligeramente flexionados
      - Mantén tensión constante controlando ambas fases
      - Ajusta la posición de los pies sobre la banda para modificar la resistencia

      ### 5. Errores comunes
      - Usar impulso o balancear los brazos
      - Encoger los hombros durante la elevación
      - Flexionar los codos en exceso
      - Elevar los brazos demasiado por encima del nivel de los hombros
      - No mantener tensión constante en la banda
      - Moverse demasiado rápido en las repeticiones

      ### 6. Seguridad y modificaciones
      - Empieza con una resistencia de banda más ligera para dominar el movimiento
      - Ajusta la posición de los pies sobre la banda para una resistencia cómoda
      - Realízalo con un brazo a la vez para un trabajo unilateral
      - Si sientes molestias en el hombro, reduce el rango de movimiento o la resistencia
