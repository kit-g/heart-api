  Triceps Dip:
    name: Fondos en paralelas
    instructions: |
      ## Resumen
      Los fondos en paralelas son un ejercicio con el peso corporal que trabaja principalmente los tríceps. También involucran el pecho y la parte frontal de los hombros como músculos secundarios, lo que los convierte en un movimiento compuesto eficaz para desarrollar la fuerza de empuje del tren superior y la masa del tríceps.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate sobre unas barras paralelas con los brazos completamente extendidos
      - Sujeta las barras con firmeza, con las manos algo más separadas que el ancho de los hombros
      - Mantén el cuerpo erguido con una ligera inclinación hacia delante
      - Cruza los tobillos por detrás o mantén las piernas rectas
      - Activa el core y mantén los hombros abajo, alejados de las orejas

      ### 2. Movimiento
      1. Baja el cuerpo flexionando los codos hasta unos 90 grados
      2. Mantén los codos apuntando hacia atrás, sin abrirlos en exceso
      3. Mantén el torso erguido para enfatizar los tríceps sobre el pecho
      4. Haz una pausa breve en la parte baja del movimiento
      5. Empuja con las palmas para extender los brazos y volver a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar el cuerpo
      - Exhala al empujar de vuelta a la posición inicial

      ### 4. Consejos
      - Mantén el cuerpo relativamente erguido para maximizar el trabajo de los tríceps
      - Mantén los codos pegados al cuerpo en todo momento
      - Concéntrate en usar los tríceps para subir, en lugar del impulso
      - Evita bajar demasiado y someter los hombros a un esfuerzo excesivo
      - Mantén el control durante todo el rango de movimiento

      ### 5. Errores comunes
      - Inclinarse demasiado hacia delante, lo que traslada el énfasis al pecho
      - Dejar que los codos se abran en exceso
      - Bajar demasiado y forzar los hombros
      - Usar impulso o rebotar en la parte baja
      - No lograr la extensión completa de los codos arriba
      - Encorvar los hombros hacia delante

      ### 6. Seguridad y modificaciones
      - Usa una máquina asistida o una banda de apoyo si lo necesitas
      - Reduce el rango de movimiento si sientes molestias en los hombros
      - Variante avanzada: añade peso con un cinturón de lastre o un chaleco lastrado
      - Progresa de forma gradual para evitar molestias en los hombros
