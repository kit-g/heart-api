  Deadlift (Band):
    name: Peso muerto (banda)
    instructions: |
      ## Resumen
      El peso muerto con banda es un ejercicio compuesto con resistencia elástica que trabaja principalmente los glúteos, los isquiotibiales y los erectores espinales. También involucra los cuádriceps, los dorsales y el core, y utiliza la resistencia progresiva de la banda para enseñar la mecánica correcta del peso muerto con una carga más ligera.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies separados al ancho de las caderas, pisando el centro de una banda
      - Agarra ambos extremos de la banda con las manos justo por fuera de las piernas
      - Haz una bisagra de cadera y flexiona las rodillas para alcanzar la banda
      - Mantén el pecho erguido, la espalda plana y los hombros ligeramente por delante de las manos
      - Activa el core y los dorsales antes de levantar

      ### 2. Movimiento
      1. Empuja con los talones y extiende caderas y rodillas al mismo tiempo
      2. Mantén la banda pegada al cuerpo mientras subes
      3. Ponte de pie por completo extendiendo caderas y rodillas
      4. Mantén los hombros atrás y el pecho erguido arriba
      5. Baja de nuevo empujando las caderas hacia atrás y flexionando las rodillas
      6. Vuelve a la posición inicial con control y repite

      ### 3. Respiración
      - Inhala profundo y activa el core antes de levantar
      - Aguanta la respiración durante el levantamiento
      - Exhala arriba o mientras bajas

      ### 4. Consejos
      - Mantén la banda pegada a las espinillas y los muslos en todo momento
      - Sube guiando el movimiento con el pecho
      - Mantén la columna neutra, sin redondearla ni hiperextenderla
      - La banda ofrece una resistencia creciente a medida que te incorporas
      - Concéntrate en el patrón de bisagra de cadera

      ### 5. Errores comunes
      - Redondear la zona lumbar durante el levantamiento
      - Empezar con las caderas demasiado altas o demasiado bajas
      - Dejar que la banda se separe del cuerpo
      - No extender por completo las caderas arriba
      - Mirar hacia arriba o hacia abajo en lugar de mantener el cuello neutro
      - Tirar con los brazos en lugar de empujar con piernas y caderas

      ### 6. Seguridad y modificaciones
      - Empieza con una banda de menor resistencia para dominar la técnica
      - Ajusta la posición de los pies sobre la banda para modificar la resistencia
      - Usa esta variante para aprender la mecánica del peso muerto antes de pasar a la barra
      - Variación avanzada: usa una banda de mayor resistencia o realiza pesos muertos con banda a una pierna
