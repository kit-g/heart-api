  Jumping Jack:
    name: Saltos de tijera
    instructions: |
      ## Resumen
      Los saltos de tijera son un ejercicio cardiovascular básico que trabaja principalmente las piernas, el core y los hombros. Consisten en saltar mientras separas las piernas y elevas los brazos, desarrollando resistencia cardiovascular y coordinación, y sirven como un movimiento de calentamiento eficaz.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies juntos y los brazos a los costados
      - Mantén el pecho erguido, el core activado y la mirada al frente
      - Prepárate para saltar y mover brazos y piernas a la vez

      ### 2. Movimiento
      1. Salta y separa los pies más allá del ancho de los hombros
      2. Al mismo tiempo, eleva los brazos hacia los lados y por encima de la cabeza
      3. Salta de nuevo y junta los pies mientras bajas los brazos
      4. Continúa alternando con un movimiento fluido y rítmico
      5. Mantén una buena postura en todo momento
      6. Repite el número de repeticiones o el tiempo deseado

      ### 3. Respiración
      - Respira de forma rítmica y constante durante todo el ejercicio
      - Inhala y exhala con cada ciclo de salto

      ### 4. Consejos
      - Aterriza con suavidad sobre la parte delantera de los pies
      - Mantén un ritmo constante y controlado
      - Es un excelente ejercicio de calentamiento
      - Mantén el core activado en todo momento
      - Brazos y piernas deben moverse de forma coordinada

      ### 5. Errores comunes
      - Aterrizar con demasiada fuerza sobre los talones
      - No elevar los brazos por completo por encima de la cabeza
      - Moverse demasiado rápido y perder la coordinación
      - Aterrizar con las rodillas bloqueadas
      - Mala postura con los hombros redondeados
      - Aguantar la respiración

      ### 6. Seguridad y modificaciones
      - Da pasos laterales en lugar de saltar para una versión de bajo impacto
      - Reduce el rango de movimiento si lo necesitas
      - Aumenta la velocidad para mayor intensidad
      - Variante avanzada: añade una sentadilla o un alcance con los brazos
