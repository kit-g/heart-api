  Hip Abductor (Machine):
    name: Abducción de cadera (máquina)
    instructions: |
      ## Resumen
      La abducción de cadera en máquina es un ejercicio de aislamiento que trabaja principalmente el glúteo medio y el glúteo menor. También involucra el tensor de la fascia lata, y utiliza una trayectoria guiada para fortalecer los músculos externos de la cadera y mejorar su estabilidad.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de abducción con la espalda firme contra el respaldo
      - Apoya la cara externa de los muslos contra las almohadillas
      - Ajusta la máquina de modo que las rodillas queden alineadas con el punto de giro
      - Agarra las asas para mantener la estabilidad
      - Mantén los pies apoyados y el core activado

      ### 2. Movimiento
      1. Separa las piernas contrayendo los músculos externos de la cadera
      2. Muévete contra la resistencia de forma controlada
      3. Continúa hasta separar las piernas tanto como te resulte cómodo
      4. Haz una pausa y aprieta la parte externa de los glúteos en la abducción completa
      5. Devuelve lentamente las piernas a la posición inicial con control
      6. Detente justo antes de que la placa de peso toque para mantener la tensión, y repite

      ### 3. Respiración
      - Exhala al separar las piernas
      - Inhala al volver a la posición inicial

      ### 4. Consejos
      - Concéntrate en usar los músculos externos de la cadera, no el impulso
      - Mantén la espalda firmemente pegada al respaldo
      - Evita rotar el torso durante el movimiento
      - Controla tanto la fase de abducción como la de aducción
      - Mantén la tensión constante sin dejar que la placa de peso descanse

      ### 5. Errores comunes
      - Usar impulso o balancear las piernas
      - Despegar los glúteos del asiento
      - Rotar el torso en lugar de mantenerlo estable
      - No lograr el rango completo de movimiento
      - Dejar que la placa de peso descanse entre repeticiones
      - Hacer las repeticiones demasiado rápido

      ### 6. Seguridad y modificaciones
      - Ajusta la posición de las almohadillas para alinear bien las rodillas
      - Empieza con poco peso para asentar la técnica
      - Prioriza el movimiento controlado sobre el peso alto
      - Variación avanzada: haz una pausa de 2-3 segundos en la abducción completa
