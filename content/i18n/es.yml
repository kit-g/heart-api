  Crunch (Stability Ball):
    name: Crunch (fitball)
    instructions: |
      ## Resumen
      El crunch en fitball es un ejercicio de core con el peso corporal que trabaja principalmente el recto abdominal con un rango de movimiento ampliado. También involucra los oblicuos, el transverso abdominal y los estabilizadores de la zona lumbar mientras mantienes el equilibrio sobre la superficie inestable.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate sobre un fitball y camina con los pies hacia adelante hasta que la zona lumbar quede apoyada en el balón
      - Coloca el balón bajo la zona lumbar y media de la espalda, con los pies apoyados en el suelo a la anchura de las caderas
      - Coloca las manos suavemente detrás de la cabeza o cruzadas sobre el pecho
      - Permite que la parte alta de la espalda se extienda ligeramente sobre el balón
      - Activa el core y mantén las caderas niveladas

      ### 2. Movimiento
      1. Exhala y despega las escápulas contrayendo los músculos abdominales
      2. Enrolla el torso hacia adelante, llevando la caja torácica hacia la pelvis
      3. Mantén la zona lumbar en contacto con el balón para mayor estabilidad
      4. Aprieta los abdominales en la parte alta del movimiento durante 1-2 segundos
      5. Baja lentamente con control, permitiendo un ligero estiramiento sobre el balón
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras subes en el crunch y contraes los abdominales
      - Inhala mientras bajas a la posición inicial

      ### 4. Consejos
      - Concéntrate en enrollar el torso en lugar de solo levantar la cabeza
      - Mantén los pies firmemente apoyados para conservar la estabilidad
      - Evita tirar del cuello con las manos
      - Muévete despacio para desafiar el equilibrio y maximizar la activación del core
      - Aprovecha la inestabilidad del balón para reclutar más músculos estabilizadores

      ### 5. Errores comunes
      - Tirar del cuello o la cabeza, lo que puede causar sobrecarga
      - Moverse demasiado rápido y perder el equilibrio
      - Dejar que las caderas caigan o se hundan durante el movimiento
      - Usar impulso en lugar de una contracción muscular controlada
      - Colocar el balón demasiado alto o demasiado bajo en la espalda
      - No aprovechar el rango de movimiento ampliado que ofrece el balón

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden empezar con los pies más separados para mayor estabilidad
      - Apoya el balón contra una pared si necesitas soporte adicional
      - Variante avanzada: sostén un disco sobre el pecho para añadir resistencia
      - Si te cuesta mantener el equilibrio, desinfla ligeramente el balón para una superficie más estable
