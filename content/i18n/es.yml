      - Ponte de pie con los pies separados al ancho de los hombros o siéntate en un banco con respaldo
      - Sujeta una sola mancuerna con ambas manos, agarrando uno de sus extremos
      - Presiona la mancuerna por encima de la cabeza hasta extender los brazos por completo
      - Mantén los codos apuntando hacia adelante y cerca de la cabeza
      - Activa el core para estabilizarte

      ### 2. Movimiento
      1. Baja la mancuerna por detrás de la cabeza flexionando los codos
      2. Mantén la parte superior de los brazos inmóvil y vertical en todo momento
      3. Baja hasta sentir un estiramiento profundo en los tríceps
      4. Haz una pausa breve en la posición inferior
      5. Extiende los codos para llevar la mancuerna de vuelta a la posición inicial
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la mancuerna por detrás de la cabeza
      - Exhala al presionar la mancuerna de vuelta hacia arriba

      ### 4. Consejos
      - Mantén la parte superior de los brazos inmóvil y vertical en todo momento
      - Mantén los codos tan juntos como te resulte cómodo
      - Evita arquear la zona lumbar durante el movimiento
      - Concéntrate en el estiramiento abajo y en la contracción arriba
      - Controla el peso durante todo el rango de movimiento

      ### 5. Errores comunes
      - Dejar que los codos se abran en exceso
      - Mover la parte superior de los brazos en lugar de mantenerla inmóvil
      - Arquear la zona lumbar en exceso
      - Usar demasiado peso y comprometer la técnica
      - No lograr el rango completo de movimiento
      - Inclinarse hacia adelante o hacia atrás durante el movimiento

      ### 6. Seguridad y modificaciones
      - Empieza con una mancuerna de peso moderado para dominar la posición por encima de la cabeza
      - Realiza el ejercicio sentado con respaldo para mayor estabilidad
      - Variación avanzada: trabaja un brazo a la vez para un enfoque unilateral
      - Usa dos mancuernas (una en cada mano) para un movimiento independiente de cada brazo
