  Side Plank:
    name: Plancha lateral
    instructions: |
      ## Resumen
      La plancha lateral es un ejercicio isométrico de core que trabaja principalmente los oblicuos y el transverso abdominal. También involucra los hombros, los estabilizadores de cadera y el cuadrado lumbar, lo que la hace muy eficaz para desarrollar fuerza lateral del core, estabilidad y equilibrio.

      ## Ejecución
      ### 1. Posición inicial
      - Acuéstate de lado en una colchoneta con las piernas apiladas y el cuerpo en línea recta
      - Coloca el codo directamente bajo el hombro con el antebrazo perpendicular al cuerpo
      - Apila los pies o coloca el pie de arriba delante para mayor estabilidad
      - Pon la mano de arriba en la cadera o extiéndela hacia el techo
      - Activa el core y prepárate para elevar las caderas

      ### 2. Movimiento
      1. Empuja con el antebrazo y los pies para levantar las caderas del suelo
      2. Eleva las caderas hasta que el cuerpo forme una línea recta de la cabeza a los pies
      3. Mantén el core activado y las caderas elevadas en todo momento
      4. Evita que las caderas se hundan o se eleven en pico
      5. Mantén esta posición estática durante el tiempo objetivo, normalmente 20-45 segundos por lado
      6. Baja las caderas al suelo con control y repite con el otro lado

      ### 3. Respiración
      - Respira de forma constante y natural durante toda la posición
      - Evita contener la respiración; mantén una respiración uniforme y tranquila

      ### 4. Consejos
      - Mantén el cuerpo en línea recta sin hundirte ni rotar
      - Activa los oblicuos para mantener las caderas elevadas
      - Empuja el hombro de apoyo hacia abajo y lejos de la oreja
      - Mantén el cuello neutro mirando al frente
      - Piensa en empujar el suelo lejos de ti con el antebrazo

      ### 5. Errores comunes
      - Dejar que las caderas se hundan hacia el suelo
      - Rotar el torso hacia delante o hacia atrás en lugar de mantener la alineación lateral
      - Dejar que los hombros suban hacia las orejas
      - Contener la respiración en lugar de respirar con naturalidad
      - No apilar el cuerpo correctamente, creando desalineación
      - Mantener la posición con mala técnica en lugar de reducir la duración

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden apoyarse en las rodillas en lugar de los pies
      - Reduce el tiempo de la posición y prioriza una técnica perfecta antes de aumentar la duración
      - Variante avanzada: eleva la pierna de arriba para aumentar la dificultad
      - Repite con ambos lados para un desarrollo equilibrado del core
