  Strict Military Press (Barbell):
    name: Press militar estricto (barra)
    instructions: |
      ## Resumen
      El press militar estricto es un ejercicio compuesto del tren superior que trabaja principalmente las tres cabezas de los deltoides. También involucra los tríceps, la parte superior del pecho y el core, usando una posición de pie estricta sin empuje de piernas para construir fuerza pura de empuje de hombros.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie en posición de firmes, con los pies juntos o muy cerca, y la barra a la altura de la parte alta del pecho
      - Sujeta la barra un poco más abierta que el ancho de hombros, con las palmas hacia adelante
      - Saca la barra del soporte y sostenla a la altura de los hombros
      - Mantén el cuerpo rígido con el pecho arriba, el core firme y los glúteos activados
      - Conserva una postura militar durante todo el ejercicio

      ### 2. Movimiento
      1. Empuja la barra en línea recta por encima de la cabeza extendiendo los brazos
      2. Mantén el cuerpo completamente rígido, sin empuje de piernas ni impulso
      3. Continúa empujando hasta que los brazos queden completamente extendidos por encima de la cabeza
      4. Alcanza la extensión completa de los codos arriba con la barra sobre el mediopié
      5. Baja la barra de nuevo a la altura de los hombros con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Toma aire y activa el core antes de empujar
      - Mantén el aire durante el empuje
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - Mantén una postura militar estricta, sin ningún empuje de piernas
      - Mantén todo el cuerpo rígido desde los pies hasta los hombros
      - Empuja la barra en una línea vertical recta
      - La técnica estricta construye fuerza pura de hombros
      - Esta variante requiere menos peso que el press militar estándar

      ### 5. Errores comunes
      - Usar cualquier empuje de piernas o impulso
      - Arquear la zona lumbar en exceso durante el empuje
      - Empujar la barra hacia adelante en lugar de en línea recta hacia arriba
      - No mantener el cuerpo rígido
      - Abrir la postura más allá de la posición de firmes
      - Usar demasiado peso antes de dominar la técnica estricta

      ### 6. Seguridad y modificaciones
      - Empieza con bastante menos peso que en el press militar estándar
      - Domina el press militar estándar antes de intentar el press militar estricto
      - Usa una jaula de potencia con barras de seguridad cuando entrenes solo
      - Esta es una variante avanzada que enfatiza la técnica estricta y el control
