  Kettlebell Turkish Get Up:
    name: Levantamiento turco (pesa rusa)
    instructions: |
      ## Resumen
      El levantamiento turco es un movimiento complejo de cuerpo completo que trabaja los hombros, el core y las piernas. Consiste en pasar de estar tumbado a estar de pie mientras sostienes una pesa rusa por encima de la cabeza, desarrollando estabilidad de hombro, fuerza del core, coordinación y control de todo el cuerpo.

      ## Ejecución
      ### 1. Posición inicial
      - Túmbate boca arriba con una pesa rusa junto a tu hombro derecho
      - Sujeta la pesa rusa con la mano derecha y presiónala por encima de la cabeza
      - Flexiona la rodilla derecha con el pie apoyado en el suelo
      - Extiende el brazo izquierdo a 45 grados sobre el suelo
      - Mantén la mirada en la pesa rusa en todo momento

      ### 2. Movimiento
      1. Rueda sobre el codo izquierdo manteniendo la pesa rusa en alto
      2. Empuja para apoyarte sobre la mano izquierda
      3. Eleva las caderas del suelo hasta una posición de puente
      4. Barre la pierna izquierda hacia atrás por debajo del cuerpo hasta quedar arrodillado
      5. Ponte de pie desde la posición de rodillas
      6. Invierte todos los pasos para volver a la posición inicial y repite con el otro lado

      ### 3. Respiración
      - Respira de manera constante durante todo este movimiento de varios pasos
      - Nunca aguantes la respiración en ninguna fase

      ### 4. Consejos
      - Es un movimiento muy técnico que requiere práctica
      - Mantén la mirada en la pesa rusa en todo momento
      - Muévete despacio y con intención en cada fase
      - Cada paso debe ser claro y controlado
      - Domina el movimiento sin peso antes de añadir una pesa rusa

      ### 5. Errores comunes
      - Pasar demasiado rápido por las fases
      - No mantener la mirada en la pesa rusa
      - Flexionar el brazo que sostiene la pesa rusa
      - Mala secuencia de los pasos del movimiento
      - Intentarlo con demasiado peso demasiado pronto
      - No mantener la estabilidad del hombro durante todo el ejercicio

      ### 6. Seguridad y modificaciones
      - Aprende primero el movimiento sin peso
      - Divide el movimiento y practica cada fase por separado
      - Empieza con una pesa rusa muy ligera
      - Considera trabajar al principio con un instructor cualificado
