      La elevación de rodillas en silla romana es un ejercicio de core con apoyo que trabaja principalmente la porción inferior del recto abdominal y los flexores de cadera. También involucra los oblicuos y el transverso abdominal para la estabilidad, y ofrece más soporte que las variantes colgado sin dejar de ser un trabajo eficaz para el abdomen inferior.

      ## Ejecución
      ### 1. Posición inicial
      - Colócate en la silla romana con la espalda firmemente apoyada contra el respaldo
      - Apoya los antebrazos en los soportes y sujeta las asas
      - Deja que las piernas cuelguen rectas con los pies sin tocar el suelo
      - Activa el core y mantén los hombros hacia abajo
      - Mantén una postura erguida durante todo el movimiento

      ### 2. Movimiento
      1. Eleva las rodillas hacia el pecho contrayendo la parte baja del abdomen
      2. Continúa subiendo las rodillas hasta al menos la altura de las caderas o más
      3. Mantén el movimiento controlado y evita balancearte
      4. Haz una breve pausa en la parte alta del movimiento
      5. Baja lentamente las rodillas a la posición inicial con control
      6. Repite el número deseado de repeticiones controladas

      ### 3. Respiración
      - Exhala mientras elevas las rodillas hacia el pecho
      - Inhala mientras bajas las rodillas a la posición inicial

      ### 4. Consejos
      - Concéntrate en elevar las rodillas con el core, no solo con los flexores de cadera
      - Mantén la espalda presionada contra el respaldo durante todo el movimiento
      - Evita balancearte o usar impulso para subir las piernas
      - Piensa en llevar las caderas hacia adelante y arriba, no solo las rodillas
      - Mantén una respiración constante y evita contenerla

      ### 5. Errores comunes
      - Usar impulso y balancearse en lugar de una contracción muscular controlada
      - Arquear la zona lumbar separándola del respaldo
      - Elevar las rodillas solo parcialmente sin activar por completo el abdomen inferior
      - Dejar que los hombros se encojan hacia las orejas
      - Moverse demasiado rápido y perder el control
      - No subir las rodillas lo suficiente para activar por completo los abdominales

      ### 6. Seguridad y modificaciones
      - Los principiantes pueden empezar con elevaciones más pequeñas, sin subir tanto las rodillas
      - Variante avanzada: haz una pausa de 2-3 segundos en la parte alta de cada repetición
      - Progresa a la elevación de piernas en silla romana extendiendo las piernas rectas
      - Si sientes molestias en los hombros, ajusta el agarre o la posición de los brazos
