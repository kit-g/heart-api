  Crunch (Machine):
    name: Crunch (máquina)
    instructions: |
      ## Resumen
      El crunch en máquina es un ejercicio de core con resistencia que trabaja principalmente el recto abdominal con tensión constante durante todo el movimiento. También involucra los oblicuos y el transverso abdominal como estabilizadores, y ofrece una forma controlada de aplicar sobrecarga progresiva a los músculos abdominales.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en la máquina de crunch con la espalda contra el respaldo
      - Coloca los pies bajo los soportes o sobre el reposapiés
      - Sujeta las asas por encima de la cabeza o a la altura del pecho, según el diseño de la máquina
      - Ajusta el peso a una resistencia exigente pero manejable
      - Activa el core y mantén la columna en posición neutra

      ### 2. Movimiento
      1. Exhala y haz el crunch hacia adelante contrayendo los músculos abdominales
      2. Concéntrate en enrollar el torso y llevar la caja torácica hacia la pelvis
      3. Mantén el movimiento controlado y evita usar impulso
      4. Aprieta con fuerza los abdominales en la parte baja del movimiento durante 1-2 segundos
      5. Regresa lentamente a la posición inicial manteniendo la tensión en el core
      6. Detente justo antes de que la placa de peso se apoye para mantener tensión continua en los abdominales

      ### 3. Respiración
      - Exhala con fuerza mientras haces el crunch hacia adelante y contraes los abdominales
      - Inhala mientras regresas a la posición inicial

      ### 4. Consejos
      - Concéntrate en mover el peso con el core, no con los brazos ni los hombros
      - Mantén el cuello en posición neutra durante todo el movimiento
      - Mantén un tempo controlado para maximizar la activación muscular
      - Evita que la placa de peso descanse entre repeticiones
      - Mantén la zona lumbar presionada contra el respaldo

      ### 5. Errores comunes
      - Tirar del peso con los brazos o los hombros en lugar de activar el core
      - Moverse demasiado rápido y depender del impulso
      - Elegir un peso demasiado alto que comprometa la técnica
      - Dejar que la placa de peso descanse por completo entre repeticiones
      - Extender o arquear la columna en el movimiento de regreso
      - Contener la respiración durante el ejercicio

      ### 6. Seguridad y modificaciones
      - Empieza con un peso ligero para dominar la técnica y la conexión mente-músculo
      - Variante avanzada: haz una pausa de 3-5 segundos en la contracción máxima
      - Si sientes molestias en la zona lumbar, reduce el peso y concéntrate en la activación del core
      - Progresa gradualmente añadiendo pequeños incrementos de peso con el tiempo
