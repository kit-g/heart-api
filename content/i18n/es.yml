  V Up:
    name: V-up
    instructions: |
      ## Resumen
      El V-up es un ejercicio avanzado de core con peso corporal que trabaja principalmente todo el recto abdominal. También involucra los flexores de cadera, los oblicuos y el transverso abdominal al elevar simultáneamente la parte superior e inferior del cuerpo hasta formar una V, generando una contracción intensa del core.

      ## Ejecución
      ### 1. Posición inicial
      - Acuéstate boca arriba en una colchoneta con los brazos extendidos por detrás de la cabeza
      - Mantén las piernas rectas y juntas, completamente extendidas sobre la colchoneta
      - Activa el core y presiona la zona lumbar contra la colchoneta
      - Mantén la cabeza en posición neutra, alineada con la columna

      ### 2. Movimiento
      1. Levanta simultáneamente las piernas y la parte superior del cuerpo de la colchoneta
      2. Mantén los brazos y las piernas rectos mientras llevas las manos hacia los pies
      3. Forma una V con el cuerpo, en equilibrio sobre los glúteos
      4. Toca o acércate a las puntas de los pies en el punto máximo del movimiento
      5. Haz una pausa breve en la posición de V
      6. Baja lentamente la parte superior e inferior del cuerpo con control
      7. Vuelve a la posición inicial y repite con repeticiones controladas

      ### 3. Respiración
      - Exhala al plegarte en la posición de V
      - Inhala al bajar a la posición inicial

      ### 4. Consejos
      - Concéntrate en usar el core para plegar el cuerpo, no el impulso
      - Mantén las piernas y los brazos rectos durante todo el movimiento
      - Mantén el control tanto en la fase de subida como en la de bajada
      - Mantén el equilibrio sobre los glúteos en la parte alta del movimiento
      - Conserva tensión constante en los abdominales moviéndote despacio

      ### 5. Errores comunes
      - Usar impulso para subir en lugar de una contracción controlada del core
      - Flexionar las rodillas o los brazos para facilitar el ejercicio
      - Dejar que los brazos tiren en lugar de que el core dirija el movimiento
      - Moverse demasiado rápido y perder el control
      - No extenderse por completo al volver a la posición inicial
      - Contener la respiración durante el movimiento

      ### 6. Seguridad y modificaciones
      - Los principiantes deben dominar por separado el crunch y las elevaciones de piernas antes de combinarlos
      - Realiza la variante con rodillas flexionadas (V-up recogido) si con las piernas rectas resulta demasiado difícil
      - Variante avanzada: sostén un peso ligero entre los pies para añadir resistencia
      - Si sientes molestias en la zona lumbar, reduce el rango de movimiento o cambia a variantes más fáciles
