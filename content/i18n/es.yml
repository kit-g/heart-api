  Elliptical Machine:
    name: Elíptica
    instructions: |
      ## Resumen
      La elíptica es un ejercicio cardiovascular de bajo impacto que trabaja las piernas, los glúteos y el sistema cardiovascular. Imita el movimiento de la carrera sin el estrés de impacto en las articulaciones, ofreciendo un acondicionamiento aeróbico eficaz con opciones para implicar el tren superior.

      ## Ejecución
      ### 1. Posición inicial
      - Súbete a la elíptica y coloca los pies en los pedales
      - Sujeta las asas fijas o móviles
      - Mantente erguido con el core activado
      - Empieza con una resistencia baja
      - Comienza con una longitud de zancada cómoda

      ### 2. Movimiento
      1. Empieza a moverte con un movimiento elíptico hacia adelante
      2. Empuja con todo el pie, no solo con la punta
      3. Usa las asas móviles para implicar el tren superior si lo deseas
      4. Mantén una postura erguida en todo momento
      5. Ajusta la resistencia y la inclinación según la intensidad deseada
      6. Continúa durante el tiempo deseado

      ### 3. Respiración
      - Respira de forma constante y rítmica durante todo el ejercicio
      - Aumenta el ritmo de la respiración con la intensidad
      - Nunca aguantes la respiración

      ### 4. Consejos
      - Mantén los pies planos sobre los pedales en todo momento
      - Mantén una postura erguida y evita inclinarte hacia adelante
      - Usa las asas móviles para implicar el tren superior
      - Varía la longitud de zancada, la inclinación y la resistencia
      - Es excelente para un acondicionamiento cardiovascular de bajo impacto

      ### 5. Errores comunes
      - Apoyarse demasiado en las asas
      - Dejar que los talones se levanten de los pedales
      - Mala postura con los hombros redondeados
      - Empujar solo con la punta del pie en lugar de con todo el pie
      - Poner la resistencia demasiado alta al principio
      - No activar el core durante el movimiento

      ### 6. Seguridad y modificaciones
      - Empieza con resistencia baja y poca duración
      - Aumenta gradualmente la intensidad y el tiempo
      - Ideal para personas con problemas articulares o en recuperación de una lesión
      - Varía la inclinación y la resistencia para lograr distintos efectos de entrenamiento
