  Bench Press - Close Grip (Barbell):
    name: Press de banca con agarre cerrado (barra)
    instructions: |
      ## Resumen
      El press de banca con agarre cerrado es un ejercicio con barra que trabaja principalmente los tríceps. También involucra el pecho y la parte frontal de los hombros como músculos secundarios, lo que lo convierte en un movimiento compuesto eficaz para desarrollar fuerza de empuje del tren superior con mayor énfasis en los tríceps.

      ## Ejecución
      ### 1. Posición inicial
      - Acuéstate en un banco plano con los pies firmemente apoyados en el suelo
      - Agarra la barra con las manos un poco más juntas que el ancho de los hombros
      - Colócate de modo que la barra quede directamente sobre la parte alta del pecho
      - Saca la barra del soporte y sostenla con los brazos completamente extendidos
      - Mantén las escápulas retraídas y presionadas contra el banco

      ### 2. Movimiento
      1. Baja la barra lentamente hacia la parte baja del pecho o la parte alta del abdomen
      2. Mantén los codos pegados a los costados, a unos 45 grados del cuerpo
      3. Baja la barra hasta que toque ligeramente el torso
      4. Haz una pausa breve abajo
      5. Empuja la barra hacia arriba extendiendo los brazos
      6. Llega a la extensión completa de codos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala al bajar la barra al pecho
      - Exhala al empujar la barra hacia arriba

      ### 4. Consejos
      - Mantén los codos pegados durante el movimiento para maximizar el trabajo de tríceps
      - Mantén una posición estable con la espalda apoyada en el banco
      - Usa un agarre cómodo pero más cerrado que el de tu press de banca habitual
      - Mantén las muñecas rectas y alineadas sobre los antebrazos
      - Controla el descenso y evita rebotar la barra en el pecho

      ### 5. Errores comunes
      - Usar un agarre demasiado cerrado, lo que puede sobrecargar las muñecas
      - Dejar que los codos se abran en exceso
      - Rebotar la barra en el pecho en lugar de tocar y empujar con control
      - Arquear la espalda en exceso
      - Usar demasiado peso y comprometer la técnica
      - No bajar la barra hasta el pecho

      ### 6. Seguridad y modificaciones
      - Usa un ayudante cuando levantes pesos altos
      - Empieza con poco peso para dominar la técnica de codos pegados
      - Si sientes molestias en las muñecas, abre ligeramente el agarre
      - Variante avanzada: añade cadenas o bandas para una resistencia variable
