    instructions: |
      ## Resumen
      El press de banca en polea es un ejercicio de empuje en máquina que trabaja principalmente el pectoral mayor. También involucra los deltoides frontales y los tríceps, y utiliza poleas para ofrecer tensión constante durante todo el movimiento y una activación uniforme del pecho.

      ## Ejecución
      ### 1. Posición inicial
      - Coloca un banco plano entre dos poleas bajas
      - Fija las asas a ambas poleas bajas y ajusta el peso adecuado
      - Túmbate en el banco con los pies firmemente apoyados en el suelo
      - Sujeta ambas asas con los brazos extendidos y las manos a la altura del pecho
      - Mantén las escápulas retraídas y presionadas contra el banco

      ### 2. Movimiento
      1. Baja lentamente las asas hacia el pecho doblando los codos
      2. Mantén los codos a unos 45 grados del cuerpo
      3. Baja hasta que las manos queden junto al pecho
      4. Haz una breve pausa abajo
      5. Empuja las asas hacia arriba extendiendo los brazos
      6. Detente justo antes de la extensión completa para mantener la tensión y repite

      ### 3. Respiración
      - Inhala al bajar las asas hacia el pecho
      - Exhala al empujar las asas hacia arriba

      ### 4. Consejos
      - Mantén la tensión constante sin llegar a la extensión completa arriba
      - Mantén las escápulas retraídas en todo momento
      - Controla por igual la fase de bajada y la de empuje
      - Mantén los pies planos y el core activado para mayor estabilidad
      - Concéntrate en contraer el pecho en la parte superior de cada repetición

      ### 5. Errores comunes
      - Bloquear por completo los codos y perder tensión en el pecho
      - Dejar que los codos se abran en exceso
      - Usar impulso en lugar de un movimiento controlado
      - Levantar los glúteos del banco
      - No mantener la retracción escapular
      - Arquear en exceso la zona lumbar

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar el patrón de press en polea
      - Ajusta la altura de las poleas para trabajar distintos ángulos (baja, media, alta)
      - Realízalo en banco inclinado o declinado para variar el estímulo muscular
      - Trabaja un brazo a la vez para entrenamiento unilateral
