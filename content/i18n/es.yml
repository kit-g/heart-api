  Goblet Squat (Kettlebell):
    name: Sentadilla goblet (pesa rusa)
    instructions: |
      ## Resumen
      La sentadilla goblet es un ejercicio compuesto de tren inferior que trabaja principalmente los cuádriceps, los glúteos y los isquiotibiales. También involucra el core y la parte alta de la espalda, y utiliza una pesa rusa o mancuerna sostenida frente al pecho para favorecer una buena mecánica de sentadilla y un torso erguido.

      ## Ejecución
      ### 1. Posición inicial
      - Sujeta una pesa rusa por los cuernos (el asa) o una mancuerna en vertical a la altura del pecho
      - Colócate con los pies un poco más separados que el ancho de los hombros
      - Apunta las puntas de los pies ligeramente hacia fuera
      - Mantén el pecho erguido, el core activado y los codos apuntando hacia abajo
      - Mantén el torso erguido en todo momento

      ### 2. Movimiento
      1. Inicia la sentadilla flexionando rodillas y caderas al mismo tiempo
      2. Mantén la pesa rusa pegada al pecho en todo momento
      3. Desciende hasta que los codos toquen la cara interna de las rodillas, o más abajo
      4. Mantén el pecho erguido y el peso sobre los talones
      5. Empuja con los talones para volver a la posición de pie
      6. Extiende por completo caderas y rodillas arriba y repite

      ### 3. Respiración
      - Inhala al descender en la sentadilla
      - Exhala al subir de nuevo

      ### 4. Consejos
      - La carga frontal favorece una buena técnica de sentadilla
      - Usa la pesa rusa como contrapeso para sentarte más profundo hacia atrás
      - Mantén los codos por dentro de las rodillas en la posición baja
      - Empuja las rodillas hacia fuera al bajar y al subir
      - Esta variante es excelente para aprender la mecánica de la sentadilla

      ### 5. Errores comunes
      - Dejar que el pecho se venza hacia delante
      - No alcanzar la profundidad adecuada
      - Dejar que las rodillas se vayan hacia dentro
      - Dejar que la pesa rusa se separe del pecho
      - Subirse a las puntas de los pies en lugar de mantener el peso en los talones
      - Hacer las repeticiones con prisa en lugar de con movimiento controlado

      ### 6. Seguridad y modificaciones
      - Empieza con una pesa rusa ligera para dominar el patrón de movimiento
      - Usa una mancuerna si no tienes pesas rusas
      - Coloca un cajón detrás de ti para asegurar una profundidad constante
      - Variación avanzada: añade una pausa abajo o realiza sentadillas goblet con tempo
