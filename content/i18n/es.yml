  Seated Palms Up Wrist Curl (Dumbbell):
    name: Curl de muñeca sentado con palmas arriba (mancuernas)
    instructions: |
      ## Resumen
      El curl de muñeca sentado con palmas arriba es un ejercicio de aislamiento que trabaja principalmente los flexores del antebrazo. También involucra los flexores de la muñeca y los músculos del agarre, usando una posición sentada con los antebrazos apoyados para aislar el movimiento de la muñeca y desarrollar los antebrazos.

      ## Ejecución
      ### 1. Posición inicial
      - Siéntate en un banco con los pies planos en el suelo
      - Sostén una mancuerna en cada mano con agarre supino (palmas hacia arriba)
      - Apoya los antebrazos sobre los muslos con las muñecas sobresaliendo justo por delante de las rodillas
      - Deja que las mancuernas rueden hacia las puntas de los dedos
      - Mantén los antebrazos planos e inmóviles en todo momento

      ### 2. Movimiento
      1. Sube las muñecas contrayendo los flexores del antebrazo
      2. Lleva las mancuernas tan arriba como te resulte cómodo
      3. Mantén los antebrazos firmemente presionados contra los muslos
      4. Haz una pausa y aprieta en la parte alta del movimiento
      5. Baja lentamente las mancuernas con control
      6. Deja que el peso ruede hasta las puntas de los dedos para un estiramiento completo y repite

      ### 3. Respiración
      - Exhala al subir las muñecas
      - Inhala al bajar las mancuernas

      ### 4. Consejos
      - Mantén los antebrazos completamente inmóviles sobre los muslos
      - Concéntrate en el movimiento puro de la muñeca sin levantar los antebrazos
      - Permite un estiramiento completo abajo dejando rodar el peso hasta los dedos
      - Controla tanto la fase de subida como la de bajada
      - Usa un peso moderado para mantener una técnica estricta

      ### 5. Errores comunes
      - Levantar los antebrazos de los muslos durante el curl
      - Usar impulso en lugar de una contracción muscular controlada
      - No permitir el rango completo de movimiento abajo
      - Apretar demasiado el agarre y limitar el rango de movimiento
      - Usar demasiado peso y comprometer la técnica
      - Moverse demasiado rápido en las repeticiones

      ### 6. Seguridad y modificaciones
      - Empieza con mancuernas ligeras para dominar el aislamiento de la muñeca
      - Trabaja una mano a la vez para mayor concentración si lo necesitas
      - Variante avanzada: haz una pausa de 2 a 3 segundos en la contracción máxima
      - Si sientes molestias, reduce el peso y asegura un buen apoyo de los antebrazos
