  High Knee Skips:
    name: Skipping con rodillas altas
    instructions: |
      ## Resumen
      El skipping con rodillas altas es un ejercicio cardiovascular pliométrico que trabaja principalmente los flexores de cadera, los cuádriceps y las pantorrillas. También involucra el core y mejora la coordinación, usando saltos explosivos tipo skipping para desarrollar potencia en el tren inferior y resistencia cardiovascular.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie, erguido, con los pies separados al ancho de las caderas
      - Mantén el pecho erguido, el core activado y los brazos a los lados
      - Prepárate para avanzar con un movimiento de skipping explosivo
      - Mantén una buena postura en todo momento

      ### 2. Movimiento
      1. Avanza con un salto tipo skipping mientras llevas una rodilla hacia el pecho
      2. Balancea el brazo contrario hacia delante al subir la rodilla
      3. Aterriza sobre la parte anterior del pie y encadena de inmediato el salto con la otra pierna
      4. Sigue alternando las piernas con un skipping explosivo y exagerado
      5. Sube las rodillas lo más alto posible en cada salto
      6. Mantén el ritmo y continúa durante las repeticiones o el tiempo deseados

      ### 4. Consejos
      - Concéntrate en la potencia explosiva de cada salto
      - Sube las rodillas lo más alto posible
      - Usa los brazos para generar impulso
      - Aterriza suave sobre la parte anterior de los pies
      - Mantén una postura erguida en todo momento

      ### 5. Errores comunes
      - No subir las rodillas lo suficiente
      - Aterrizar con todo el pie plano en lugar de con la parte anterior
      - Inclinarse demasiado hacia delante o hacia atrás
      - No usar los brazos para ayudarse con el impulso
      - Moverse demasiado lento, sin potencia explosiva
      - Aguantar la respiración durante el ejercicio

      ### 6. Seguridad y modificaciones
      - Empieza con rodillas altas en el sitio antes de añadir el salto
      - Reduce la altura y la velocidad si sientes molestias en rodillas o caderas
      - Hazlo sobre una superficie más blanda para reducir el impacto
      - Variación avanzada: añade un chaleco lastrado o aumenta la velocidad y la altura
