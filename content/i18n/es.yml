  Incline Bench Press (Barbell):
    name: Press de banca inclinado (barra)
    instructions: |
      ## Resumen
      El press de banca inclinado con barra es un ejercicio de empuje compuesto que trabaja principalmente la porción superior del pectoral mayor. También involucra los deltoides frontales y los tríceps, y utiliza la posición inclinada del banco para enfatizar la parte alta del pecho y desarrollar la fuerza de empuje general.

      ## Ejecución
      ### 1. Posición inicial
      - Ajusta un banco regulable a una inclinación de 30-45 grados
      - Recuéstate en el banco con los pies firmemente apoyados en el suelo
      - Colócate de modo que tus ojos queden bajo la barra
      - Agarra la barra con las manos un poco más abiertas que el ancho de los hombros
      - Saca la barra del soporte y sostenla con los brazos extendidos sobre la parte alta del pecho

      ### 2. Movimiento
      1. Baja la barra lentamente hasta la parte alta del pecho o la clavícula
      2. Mantén los codos a unos 45 grados respecto al cuerpo
      3. Toca ligeramente el pecho con la barra
      4. Haz una breve pausa abajo
      5. Empuja la barra hacia arriba extendiendo los brazos
      6. Llega a la extensión completa de los codos arriba y repite con repeticiones controladas

      ### 3. Respiración
      - Inhala mientras bajas la barra al pecho
      - Exhala mientras empujas la barra hacia arriba

      ### 4. Consejos
      - Mantén las escápulas retraídas durante todo el ejercicio
      - Mantén el ángulo de inclinación entre 30 y 45 grados para una activación óptima de la parte alta del pecho
      - Controla el descenso y evita rebotar la barra
      - Mantén los pies apoyados y el core activado para la estabilidad
      - Concéntrate en contraer la parte alta del pecho en la posición alta

      ### 5. Errores comunes
      - Colocar la inclinación demasiado pronunciada (más de 45 grados), desplazando el énfasis a los hombros
      - Rebotar la barra contra el pecho
      - Dejar que los codos se abran en exceso
      - Levantar los glúteos del banco
      - No lograr el rango completo de movimiento
      - Usar demasiado peso y comprometer la técnica

      ### 6. Seguridad y modificaciones
      - Utiliza siempre un asistente cuando levantes pesos pesados
      - Empieza con menos peso que en tu press de banca plano
      - Ajusta el ángulo de inclinación entre 30 y 45 grados según tu comodidad
      - Si sientes molestias en los hombros, ajusta la anchura del agarre o el ángulo de inclinación
