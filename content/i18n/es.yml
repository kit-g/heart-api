  Sumo Deadlift (Barbell):
    name: Peso muerto sumo (barra)
    instructions: |
      ## Resumen
      El peso muerto sumo con barra es un ejercicio compuesto que trabaja principalmente los glúteos, los isquiotibiales y los cuádriceps con mayor énfasis que el peso muerto convencional. También involucra los erectores espinales, los dorsales y los aductores, y utiliza una postura amplia para reducir la tensión en la zona lumbar y permitir un torso más erguido.

      ## Ejecución
      ### 1. Posición inicial
      - Ponte de pie con los pies bastante más separados que el ancho de los hombros y las puntas hacia fuera
      - Coloca la barra sobre la mitad del pie
      - Sujeta la barra con las manos por dentro de las piernas, separadas al ancho de los hombros
      - Baja las caderas y mantén el pecho erguido
      - Mantén la espalda recta y los hombros ligeramente por delante de la barra

      ### 2. Movimiento
      1. Empuja con los talones y extiende caderas y rodillas a la vez
      2. Mantén la barra pegada al cuerpo mientras subes
      3. Ponte de pie por completo extendiendo las caderas y llevando los hombros hacia atrás
      4. Mantén el torso más erguido que en un peso muerto convencional
      5. Baja la barra empujando las caderas hacia atrás y doblando las rodillas
      6. Devuelve la barra al suelo con control y repite

      ### 3. Respiración
      - Toma aire profundamente y activa el core antes de levantar
      - Aguanta la respiración durante el levantamiento
      - Exhala arriba o mientras bajas la barra

      ### 4. Consejos
      - Mantén las rodillas alineadas con las puntas de los pies en todo momento
      - Empuja las rodillas hacia fuera para activar los glúteos
      - Mantén la barra pegada a las espinillas y los muslos
      - Mantén un torso más erguido que en el peso muerto convencional
      - Concéntrate en empujar el suelo con las piernas

      ### 5. Errores comunes
      - No adoptar una postura lo suficientemente amplia
      - Dejar que las rodillas se vayan hacia dentro
      - Redondear la zona lumbar durante el levantamiento
      - Empezar con las caderas demasiado altas o demasiado bajas
      - Dejar que la barra se aleje del cuerpo
      - No extender por completo las caderas arriba

      ### 6. Seguridad y modificaciones
      - Empieza con poco peso para dominar la postura amplia y la mecánica de cadera
      - Asegúrate de que tu movilidad de cadera permite una posición sumo correcta
      - Usa correas de agarre si la fuerza de agarre te limita
      - Si sientes molestias en la cadera, ajusta el ancho de la postura o el ángulo de los pies
