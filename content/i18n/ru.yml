      ## Техника выполнения
      ### 1. Исходное положение
      - Расположите штангу на верхней части спины, как при приседаниях
      - Встаньте, ноги на ширине таза
      - Держите грудь расправленной, мышцы кора напряжёнными, взгляд направлен вперёд
      - Возьмитесь за гриф хватом чуть шире плеч
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Сделайте одной ногой длинный шаг вперёд
      2. Опустите таз, сгибая оба колена
      3. Продолжайте, пока переднее бедро не станет параллельно полу
      4. Держите переднее колено над голеностопом
      5. Оттолкнитесь пяткой передней ноги и вернитесь в положение стоя
      6. Повторяйте на ту же ногу или чередуйте ноги нужное количество повторений

      ### 3. Дыхание
      - Вдыхайте, делая шаг вперёд и опускаясь
      - Выдыхайте, возвращаясь в положение стоя

      ### 4. Советы
      - Держите корпус вертикально на протяжении всего движения
      - Следите, чтобы переднее колено не выходило за носок
      - Отталкивайтесь пяткой передней ноги, а не носком
      - Делайте достаточно длинный шаг, чтобы сохранять равновесие
      - Держите штангу стабильно на верхней части спины

      ### 5. Частые ошибки
      - Чрезмерный наклон корпуса вперёд во время выпада
      - Заваливание переднего колена внутрь
      - Слишком короткий шаг, создающий нагрузку на колено
      - Недостаточная глубина
      - Удар задним коленом об пол
      - Потеря равновесия или шатание во время движения

      ### 6. Безопасность и модификации
      - Начните с выпадов с собственным весом, чтобы отработать равновесие, прежде чем добавлять штангу
      - Выполняйте выпады в ходьбе, чтобы сохранять темп движения
      - Если штанга кажется неустойчивой, используйте гантели
      - Продвинутый вариант: добавьте дефицит, ставя переднюю ногу на платформу
