  Toes To Bar:
    name: Носки к перекладине
    instructions: |
      ## Обзор
      «Носки к перекладине» — продвинутое упражнение на кор в висе, которое в первую очередь нагружает всю прямую мышцу живота и сгибатели бедра. В работу также включаются косые мышцы живота, поперечная мышца живота, широчайшие, мышцы хвата и стабилизаторы плеча, что делает его одним из самых сложных упражнений на пресс с собственным весом.

      ## Техника выполнения
      ### 1. Исходное положение
      - Повисните на перекладине, руки на ширине плеч, прямой хват
      - Полностью выпрямите тело в висе, стопы не касаются пола
      - Напрягите мышцы кора, плечи опустите вниз и отведите назад
      - Держите ноги вместе и полностью выпрямленными
      - Стабилизируйте тело, чтобы свести раскачивание к минимуму

      ### 2. Движение
      1. Одновременно поднимите ноги и потянитесь носками к перекладине
      2. Держите ноги прямыми, поднимая их по плавной дуге
      3. Используйте силу кора и лёгкий импульс тазом, чтобы дотянуться носками до перекладины
      4. Коснитесь носками перекладины в верхней точке движения
      5. Контролируйте опускание ног вниз
      6. Вернитесь в исходное положение виса и повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Мощно выдыхайте, поднимая ноги к перекладине
      - Вдыхайте, опуская ноги в исходное положение

      ### 4. Советы
      - Создавайте импульс плечами и кором, а не только ногами
      - Ведите носки к перекладине по дуге, а не строго вверх
      - Держите руки прямыми, а плечи включёнными на протяжении всего движения
      - Используйте контролируемый мах, а не боритесь с ним
      - Сильно напрягайте пресс в верхней точке движения

      ### 5. Частые ошибки
      - Сгибание коленей, чтобы облегчить упражнение
      - Чрезмерное неконтролируемое раскачивание
      - Носки не доводятся до самой перекладины
      - Поднятие плеч к ушам
      - Слишком быстрое опускание ног
      - Отсутствие включения широчайших для контроля движения

      ### 6. Безопасность и модификации
      - Прежде чем приступать к этому упражнению, освойте подъёмы ног в висе и «колени к локтям»
      - Используйте кистевые лямки, если хват ограничивает выполнение
      - Новички могут отдельно отработать движение киппингом, прежде чем соединять элементы
      - Продвинутый вариант: выполняйте строгие «носки к перекладине» без маха и киппинга
