      5. Ненадолго задержитесь, когда ладони коснутся стоп или максимально приблизятся к ним
      6. Медленно и подконтрольно опустите верх и низ тела обратно
      7. Вернитесь в исходное положение и повторите в контролируемом темпе

      ### 3. Дыхание
