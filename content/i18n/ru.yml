  Rack Pull (Barbell):
    name: Тяга с упоров (штанга)
    instructions: |
      ## Обзор
      Тяга с упоров — становая тяга с частичной амплитудой, которая в первую очередь нагружает верх спины, трапеции и разгибатели позвоночника. В работу также включаются ягодичные мышцы и бицепс бедра; приподнятое стартовое положение позволяет работать с большим весом и сфокусироваться на завершающей фазе становой тяги.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите штангу на упоры силовой рамы на уровне коленей или чуть ниже
      - Встаньте, ноги на ширине таза, гриф над серединой стопы
      - Возьмитесь за гриф сразу за линией ног прямым хватом или разнохватом
      - Держите грудь поднятой, спину ровной, плечи чуть впереди грифа
      - Перед подъёмом напрягите мышцы кора и широчайшие

      ### 2. Движение
      1. Оттолкнитесь пятками и разогните тазобедренные суставы, поднимая штангу
      2. Во время тяги держите гриф близко к телу
      3. Полностью выпрямитесь, разогнув таз и отведя плечи назад
      4. В верхней точке сведите лопатки
      5. Подконтрольно опустите штангу обратно на упоры
      6. Перестройтесь и повторите в контролируемом темпе

      ### 3. Дыхание
      - Перед каждым повторением сделайте глубокий вдох и напрягите мышцы кора
      - Выдыхайте в верхней точке или на опускании штанги

      ### 4. Советы
      - Держите спину ровной, а грудь поднятой на протяжении всего движения
      - Сосредоточьтесь на толчке через пятки
      - В верхней точке отводите плечи назад до полного выпрямления
      - Держите гриф близко к телу на протяжении всего движения
      - Из-за сокращённой амплитуды используйте вес больше, чем в обычной становой тяге

      ### 5. Частые ошибки
      - Округление верха спины во время тяги
      - Слишком низкое положение таза на старте
      - Гриф уходит от тела
      - Неполное выпрямление в верхней точке
      - Работа за счёт инерции вместо контролируемого движения
      - Слишком высокие упоры, из-за чего теряется тренировочный эффект

      ### 6. Безопасность и модификации
      - Начинайте с упоров на уровне коленей и регулируйте их под свои цели
      - Если хват ограничивает вес, используйте лямки
      - Усложнённый вариант: встаньте в стойку на возвышении для увеличения амплитуды
      - При дискомфорте в пояснице поднимите упоры и уменьшите вес
