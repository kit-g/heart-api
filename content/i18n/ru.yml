  Deficit Squat:
    name: Приседания на возвышении
    instructions: |
      ## Обзор
      Приседания на возвышении — продвинутое многосуставное упражнение, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и бицепс бедра в увеличенной амплитуде. Возвышение под ногами увеличивает глубину и сложность приседа, развивая силу в нижней точке и улучшая подвижность.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте на возвышение высотой 2–8 см, поставив ноги на ширине плеч
      - Держите гантели вдоль тела или штангу на верхней части спины
      - Держите грудь расправленной, мышцы кора напряжёнными, взгляд направьте вперёд
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Начните приседание, одновременно сгибая колени и тазобедренные суставы
      2. Держите грудь расправленной, а вес — на пятках
      3. Опускайтесь глубже, чем в обычном приседе, — это позволяет возвышение
      4. Сделайте короткую паузу в нижней точке
      5. Оттолкнитесь пятками и вернитесь в положение стоя
      6. Полностью выпрямите тазобедренные суставы и колени в верхней точке, затем повторите

      ### 3. Дыхание
      - Вдох — при опускании в присед
      - Выдох — при подъёме в положение стоя

      ### 4. Советы
      - Возвышение увеличивает амплитуду и сложность упражнения
      - Следите, чтобы колени двигались в направлении носков
      - Держите корпус вертикально на протяжении всего движения
      - Используйте вес меньше, чем в обычных приседаниях
      - Этот вариант развивает силу в нижней точке приседа

      ### 5. Частые ошибки
      - Слишком высокое возвышение для вашей подвижности
      - Неиспользование дополнительной глубины, которую даёт возвышение
      - Колени заваливаются внутрь
      - Подъём на носки вместо удержания веса на пятках
      - Слишком большой вес до адаптации к увеличенной амплитуде
      - Потеря нейтрального положения позвоночника в нижней точке

      ### 6. Безопасность и модификации
      - Начинайте с возвышения 2–3 см и прогрессируйте постепенно
      - Убедитесь, что вашей подвижности хватает для увеличенной амплитуды
      - Используйте вес меньше, чем в обычных приседаниях
      - При дискомфорте в коленях уменьшите высоту возвышения или вес
