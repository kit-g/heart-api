  Upright Row (Smith Machine):
    name: Тяга к подбородку (машина Смита)
    instructions: |
      ## Обзор
      Тяга к подбородку в машине Смита — тяговое упражнение, нацеленное в первую очередь на плечи и верхнюю часть спины, особенно на средние дельты и трапеции. Бицепсы работают как вспомогательные мышцы, а фиксированная траектория грифа делает движение стабильным и позволяет сосредоточиться на тяге.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите гриф примерно на уровне таза и повесьте небольшой вес
      - Встаньте вплотную к грифу, стопы на ширине плеч
      - Возьмитесь за гриф прямым хватом, руки примерно на ширине плеч
      - Снимите гриф с фиксаторов и опустите его на вытянутых руках

      ### 2. Движение
      1. Тяните гриф строго вверх по направляющим к ключицам
      2. Ведите движение локтями, держа их выше запястий
      3. Остановитесь, когда локти окажутся примерно на уровне плеч
      4. Медленно и подконтрольно опустите гриф вниз
      5. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая гриф
      - Вдыхайте, опуская его

      ### 4. Советы
      - Держите гриф близко к телу на протяжении всего движения
      - Держите корпус вертикально; не отклоняйтесь назад
      - Чуть более широкий хват часто комфортнее для плеч

      ### 5. Частые ошибки
      - Слишком высокая тяга, выше ключиц
      - Раскачивание корпуса, чтобы забросить вес
      - Слишком узкий хват, который может защемлять плечи

      ### 6. Безопасность и модификации
      - Останавливайте тягу ниже, если чувствуете защемление в плечах
      - Начинайте с пустого грифа, чтобы отработать траекторию
