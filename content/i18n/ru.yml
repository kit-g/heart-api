  Deadlift (Barbell):
    name: Становая тяга (штанга)
    instructions: |
      ## Обзор
      Становая тяга со штангой — базовое упражнение, которое в первую очередь нагружает разгибатели позвоночника, ягодичные мышцы и бицепс бедра. Также работают квадрицепсы, широчайшие, трапеции и мышцы хвата, что делает её одним из самых эффективных упражнений на всё тело для развития мощности задней цепи.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, поставив ноги на ширине таза, гриф над серединой стопы
      - Возьмитесь за гриф сразу за линией ног, руки на ширине плеч
      - Наклонитесь через тазобедренные суставы и согните колени, чтобы дотянуться до грифа
      - Держите грудь развёрнутой, спину плоской, плечи чуть впереди грифа
      - Перед подъёмом напрягите мышцы кора и широчайшие

      ### 2. Движение
      1. Оттолкнитесь пятками от пола, одновременно разгибая тазобедренные и коленные суставы
      2. Ведите гриф вплотную к телу на протяжении всего подъёма
      3. Полностью выпрямитесь, разогнув тазобедренные и коленные суставы
      4. В верхней точке держите плечи отведёнными назад, грудь развёрнутой
      5. Опустите гриф, отводя таз назад и сгибая колени
      6. Подконтрольно верните гриф на пол и повторите

      ### 3. Дыхание
      - Перед подъёмом сделайте глубокий вдох и напрягите мышцы кора
      - Задержите дыхание во время подъёма
      - Выдохните в верхней точке или во время опускания грифа

      ### 4. Советы
      - Держите гриф вплотную к голеням и бёдрам на протяжении всего движения
      - Ведите движение грудью, когда выпрямляетесь
      - Сохраняйте нейтральное положение позвоночника, избегая округления и переразгибания
      - Давите в пол всей стопой, а не только носками
      - Представляйте, что отталкиваете пол от себя, а не поднимаете штангу

      ### 5. Частые ошибки
      - Округление поясницы во время подъёма
      - Слишком высокое или слишком низкое положение таза на старте
      - Гриф уходит от тела
      - Неполное разгибание тазобедренных суставов в верхней точке
      - Взгляд вверх или вниз вместо нейтрального положения шеи
      - Тяга руками вместо работы ног и таза

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить технику и наклон через тазобедренные суставы
      - Используйте лямки, если сила хвата ограничивает вес
      - Продвинутый вариант: выполняйте становую тягу с дефицитом или румынскую тягу
      - При дискомфорте в пояснице уменьшите вес и проверьте технику со специалистом
