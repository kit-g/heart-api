  Reverse Grip Concentration Curl (Dumbbell):
    name: Концентрированные сгибания обратным хватом (гантель)
    instructions: |
      ## Обзор
      Концентрированные сгибания обратным хватом — изолирующее упражнение, которое в первую очередь нагружает плечелучевую и плечевую мышцы с максимальной концентрацией. В работу также включаются двуглавая мышца плеча и разгибатели предплечья; положение сидя с упором и хват ладонью вниз исключают инерцию.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на скамью, широко расставив ноги
      - Возьмите гантель в одну руку хватом ладонью вниз
      - Упритесь задней поверхностью плеча во внутреннюю часть бедра
      - Слегка наклонитесь вперёд и обопритесь свободной рукой о противоположное бедро
      - Держите грудь развёрнутой, мышцы кора напряжёнными

      ### 2. Движение
      1. Поднимите гантель вверх, сохраняя хват ладонью вниз
      2. Держите плечо плотно прижатым к внутренней части бедра от начала до конца
      3. Продолжайте подъём, пока предплечье не станет почти вертикальным
      4. Сделайте паузу и дополнительно напрягите мышцы в верхней точке
      5. Медленно и подконтрольно опустите гантель в исходное положение
      6. Выполните все повторения одной рукой, затем повторите другой

      ### 3. Дыхание
      - Выдыхайте, поднимая гантель вверх
      - Вдыхайте, опуская гантель вниз

      ### 4. Советы
      - Держите плечо полностью неподвижным, прижатым к бедру
      - Сохраняйте хват ладонью вниз на протяжении всего движения
      - Сосредоточьтесь на чистом мышечном сокращении без движений корпуса
      - Держите запястье в нейтральном положении
      - Контролируйте вес по всей амплитуде движения

      ### 5. Частые ошибки
      - Отрыв локтя от бедра во время сгибания
      - Загибание запястья вверх вместо нейтрального положения
      - Подъём веса за счёт инерции или раскачивания
      - Неполная амплитуда движения
      - Отклонение назад или раскачивание корпуса
      - Слишком большой вес в ущерб строгой технике

      ### 6. Безопасность и модификации
      - Начинайте с веса легче, чем в обычных концентрированных сгибаниях
      - Держите спину прямой, чтобы не перегружать поясницу
      - Усложнённый вариант: добавьте паузу 3–5 секунд в точке пикового сокращения
      - Сосредоточьтесь на напряжении предплечья и внешней части бицепса
