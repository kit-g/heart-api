  Kettlebell Swing:
    name: Махи гирей
    instructions: |
      ## Обзор
      Махи гирей — динамичное упражнение на всё тело, нацеленное прежде всего на ягодичные мышцы, бицепс бедра и мышцы кора. Оно также задействует плечи, спину и сердечно-сосудистую систему: взрывное движение через тазобедренные суставы развивает мощность, выносливость и силу задней цепи.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги чуть шире плеч
      - Поставьте гирю на пол примерно в 30 см перед собой
      - Наклонитесь через тазобедренные суставы и возьмитесь за гирю обеими руками
      - Держите спину прямой, грудь поднятой, мышцы кора напряжёнными
      - Слегка замахните гирю назад между ног

      ### 2. Движение
      1. Взрывно подайте таз вперёд, чтобы вымахнуть гирю вверх
      2. Позвольте гире взлететь до уровня груди или плеч
      3. Держите руки прямыми — работать должны тазобедренные суставы
      4. Когда гиря начнёт опускаться, снова выполните наклон через тазобедренные суставы
      5. Позвольте гире уйти назад между ног
      6. Сразу же снова подайте таз вперёд, продолжая махи

      ### 3. Дыхание
      - Мощно выдыхайте, подавая таз вперёд
      - Вдыхайте, когда гиря опускается

      ### 4. Советы
      - Это наклон через тазобедренные суставы, а не присед
      - Мощность идёт от таза, а не от рук
      - Держите мышцы кора напряжёнными на протяжении всего движения
      - В верхней точке гиря должна ощущаться невесомой
      - Сохраняйте нейтральное положение позвоночника

      ### 5. Частые ошибки
      - Приседание вместо наклона через тазобедренные суставы
      - Подъём гири руками вместо работы таза
      - Переразгибание спины в верхней точке маха
      - Недостаточно взрывная подача таза вперёд
      - Слишком низкий пронос гири между ног
      - Округление спины во время наклона

      ### 6. Безопасность и модификации
      - Начинайте с более лёгкой гири, чтобы освоить наклон через тазобедренные суставы
      - Освойте становую тягу, прежде чем переходить к махам гирей
      - Прекратите упражнение при дискомфорте в пояснице
      - Усложнённый вариант: махи одной рукой или американские махи (над головой)
