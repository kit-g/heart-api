  Arnold Press (Dumbbell):
    name: Жим Арнольда (гантели)
    instructions: |
      ## Обзор
      Жим Арнольда — многосуставное упражнение для плеч, которое в первую очередь нагружает все три пучка дельт. В работу также включаются трицепсы и верх груди; жим гантелей с вращением обеспечивает всестороннее развитие плеч за счёт уникальной амплитуды движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на скамью со спинкой, взяв гантель в каждую руку
      - Держите гантели на уровне плеч, ладони обращены к телу
      - Держите локти перед корпусом
      - Напрягите мышцы кора и прижмите спину к спинке
      - Поставьте стопы плотно на пол

      ### 2. Движение
      1. Жмите гантели вверх, одновременно разворачивая ладони наружу
      2. Продолжайте жим с вращением, пока руки не выпрямятся полностью над головой
      3. В верхней точке ладони должны быть обращены вперёд
      4. Сделайте короткую паузу в верхней точке
      5. Выполните движение в обратном порядке, разворачивая ладони внутрь при опускании
      6. Вернитесь в исходное положение с ладонями, обращёнными к телу, и повторите

      ### 3. Дыхание
      - Вдох — в исходном положении
      - Выдох — при жиме гантелей вверх
      - Вдох — при опускании гантелей

      ### 4. Советы
      - Вращение должно быть плавным и контролируемым на протяжении всего движения
      - Держите мышцы кора напряжёнными, чтобы защитить поясницу
      - Уделяйте вращению не меньше внимания, чем самому жиму
      - Одинаково контролируйте и фазу жима, и фазу опускания
      - Уникальное вращение нагружает все три пучка дельт

      ### 5. Частые ошибки
      - Слишком быстрое вращение и потеря контроля
      - Чрезмерный прогиб в пояснице
      - Неполное вращение
      - Слишком большой вес в ущерб технике
      - Слишком раннее разведение локтей в стороны
      - Спешка при выполнении движения

      ### 6. Безопасность и модификации
      - Начинайте с гантелей легче, чем в обычном жиме на плечи
      - Освойте схему вращения, прежде чем добавлять вес
      - Выполняйте стоя для дополнительной нагрузки на мышцы кора
      - При дискомфорте в плечах уменьшите вес или амплитуду движения
