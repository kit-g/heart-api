    instructions: |
      ## Обзор
      Запрыгивания на тумбу — плиометрическое упражнение, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и икры. В работу также включаются бицепс бедра и мышцы кора; взрывные прыжки развивают мощность ног, атлетизм и координацию.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте лицом к устойчивой тумбе или платформе, стопы на ширине таза
      - Расположитесь на расстоянии вытянутой руки от тумбы
      - Держите грудь поднятой, а мышцы кора — напряжёнными
      - Слегка согните колени и отведите руки назад
      - Подготовьтесь к взрывному прыжку

      ### 2. Движение
      1. Махните руками вперёд и взрывным движением запрыгните на тумбу
      2. Мягко приземлитесь на тумбу одновременно обеими ногами
      3. Погасите удар, приземлившись в положение полуприседа
      4. Полностью выпрямитесь на тумбе
      5. Аккуратно сойдите вниз, по одной ноге за раз
      6. Вернитесь в исходное положение и повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдох — в подготовительной фазе
      - Мощный выдох — во время прыжка

      ### 4. Советы
      - Сосредоточьтесь на взрывной силе ног, а не только на высоте прыжка
      - Приземляйтесь мягко, на согнутые колени, чтобы погасить удар
      - Начинайте с невысокой тумбы и повышайте высоту постепенно
      - Держите грудь поднятой, а взгляд — на тумбе на протяжении всего движения
      - Сходите с тумбы шагом, а не спрыгивайте, чтобы снизить нагрузку на суставы

      ### 5. Частые ошибки
      - Приземление на прямые ноги, повышающее риск травмы
      - Спрыгивание с тумбы вместо схода шагом
      - Слишком высокая тумба для текущего уровня подготовки
      - Неполное выпрямление наверху тумбы
      - Приземление со стопами в разных положениях
      - Слишком быстрое выполнение повторений без полноценного сброса между прыжками

      ### 6. Безопасность и модификации
      - Начинайте с низкой устойчивой тумбы (12–18 дюймов), чтобы освоить технику
      - Убедитесь, что тумба устойчива и не скользит и не опрокидывается
      - Переходите на более высокие тумбы только после уверенного освоения низких
      - Усложнённый вариант: добавьте жилет-утяжелитель или выполняйте запрыгивания на одной ноге
