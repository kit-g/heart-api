  Knee Raise (Captain's Chair):
    name: Подъёмы коленей (капитанское кресло)
    instructions: |
      ## Обзор
      Подъёмы коленей в капитанском кресле — упражнение на кор с опорой, которое в первую очередь нагружает нижнюю часть прямой мышцы живота и сгибатели бедра. Для стабильности также работают косые и поперечная мышцы живота; упражнение даёт больше поддержки, чем варианты в висе, оставаясь эффективным для нижней части пресса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Расположитесь в капитанском кресле, плотно прижав спину к спинке
      - Положите предплечья на подлокотники и возьмитесь за рукояти
      - Опустите ноги вертикально вниз, стопы не касаются пола
      - Напрягите мышцы кора и опустите плечи вниз
      - Сохраняйте вертикальное положение корпуса на протяжении всего движения

      ### 2. Движение
      1. Поднимите колени к груди, сокращая нижнюю часть пресса
      2. Продолжайте, пока колени не поднимутся как минимум до уровня таза или выше
      3. Двигайтесь подконтрольно и не раскачивайтесь
      4. Ненадолго задержитесь в верхней точке
      5. Медленно и подконтрольно опустите колени в исходное положение
      6. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая колени к груди
      - Вдыхайте, опуская колени в исходное положение

      ### 4. Советы
      - Поднимайте колени за счёт кора, а не только сгибателей бедра
      - Прижимайте спину к спинке на протяжении всего движения
      - Не раскачивайтесь и не поднимайте ноги за счёт инерции
      - Думайте о том, чтобы подавать таз вперёд и вверх, а не просто поднимать колени
      - Дышите ровно и не задерживайте дыхание

      ### 5. Частые ошибки
      - Раскачивание и работа за счёт инерции вместо контролируемого сокращения
      - Отрыв поясницы от спинки с прогибом
      - Частичный подъём коленей без полного включения нижней части пресса
      - Подъём плеч к ушам
      - Слишком быстрый темп и потеря контроля
      - Недостаточно высокий подъём коленей для полного включения пресса

      ### 6. Безопасность и модификации
      - Новички могут начинать с меньшей амплитуды, не поднимая колени так высоко
      - Продвинутый вариант: пауза 2–3 секунды в верхней точке каждого повторения
      - Усложняйте упражнение, выпрямляя ноги, — подъёмы прямых ног в капитанском кресле
      - При дискомфорте в плечах измените хват или положение рук
