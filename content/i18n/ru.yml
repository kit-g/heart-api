  Lat Pulldown - Underhand (Band):
    name: Тяга сверху обратным хватом (лента)
    instructions: |
      ## Обзор
      Тяга сверху обратным хватом с лентой — тяговое упражнение с сопротивлением, которое в первую очередь нагружает широчайшие мышцы спины с более активным включением бицепсов. В работу также включаются ромбовидные мышцы и средняя часть трапеций; обратный хват и лента обеспечивают прогрессивное сопротивление на протяжении всего движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Закрепите ленту над головой за надёжную опору
      - Встаньте или опуститесь на колени лицом к точке крепления
      - Возьмитесь за ленту обеими руками обратным хватом (ладони к себе)
      - Вытяните руки над головой, сохраняя натяжение ленты
      - Напрягите мышцы кора и держите корпус вертикально

      ### 2. Движение
      1. Потяните ленту вниз к груди, уводя локти вниз и назад
      2. Держите корпус вертикально на протяжении всего движения
      3. Продолжайте, пока кисти не окажутся у верхней части груди или плеч
      4. В нижней точке сведите лопатки
      5. Медленно и подконтрольно верните руки в положение над головой
      6. Повторите нужное количество повторений в контролируемом темпе

      ### 3. Дыхание
      - Выдыхайте, когда тянете ленту вниз
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Обратный хват позволяет держать локти ближе к корпусу
      - Сосредоточьтесь на тяге мышцами спины, а не только руками
      - Держите грудь поднятой, а плечи отведёнными назад на протяжении всего движения
      - Поддерживайте постоянное натяжение ленты
      - Контролируйте сопротивление и в фазе тяги, и в фазе возврата

      ### 5. Частые ошибки
      - Чрезмерное отклонение назад, чтобы работать весом тела
      - Отсутствие постоянного натяжения ленты
      - Работа за счёт инерции вместо контролируемого движения
      - Подъём плеч к ушам
      - Чрезмерная работа бицепсами вместо мышц спины
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Начинайте с более лёгкой ленты, чтобы освоить движение обратным хватом
      - Меняйте расстояние до точки крепления, чтобы регулировать сопротивление
      - Выполняйте на коленях, если стоя слишком тяжело
      - Усложнённый вариант: возьмите более тугую ленту или добавьте паузу в нижней точке
