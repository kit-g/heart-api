  Chest Fly:
    name: Разведения рук
    instructions: |
      ## Обзор
      Разведения рук в тренажёре — изолирующее упражнение, нацеленное в первую очередь на большие грудные мышцы. Передние дельты включаются минимально; фиксированная траектория тренажёра обеспечивает стабильность и равномерное сопротивление на протяжении всего движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр, плотно прижав спину к спинке
      - Отрегулируйте высоту сиденья так, чтобы рукояти были на уровне середины груди
      - Возьмитесь за рукояти, руки разведены в стороны
      - Сохраняйте небольшое сгибание в локтях на протяжении всего упражнения
      - Поставьте стопы на пол и напрягите мышцы кора

      ### 2. Движение
      1. Сведите обе рукояти вместе перед грудью
      2. Держите локти слегка согнутыми, словно обнимаете что-то большое
      3. Продолжайте, пока рукояти не соединятся или почти не коснутся друг друга
      4. Сильно напрягите грудь в точке пикового сокращения
      5. Медленно и подконтрольно верните руки в исходное положение
      6. Останавливайтесь чуть раньше, чем груз коснётся стека, чтобы сохранить напряжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, сводя рукояти вместе
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Сохраняйте одинаковое сгибание в локтях на протяжении всего движения
      - Сосредоточьтесь на сжатии груди в пиковой точке
      - Поддерживайте постоянное напряжение, не давая грузу ложиться на стек
      - Держите спину плотно прижатой к спинке
      - Контролируйте и сведение, и разведение

      ### 5. Частые ошибки
      - Полное выпрямление рук во время движения
      - Использование инерции вместо контролируемого сокращения мышц
      - Опускание груза на стек между повторениями
      - Отрыв спины от спинки
      - Слишком быстрый темп и потеря пикового сокращения
      - Слишком большой вес и чрезмерное сгибание локтей

      ### 6. Безопасность и модификации
      - Отрегулируйте высоту сиденья так, чтобы рукояти были на уровне груди
      - Начните с лёгкого веса, чтобы наладить нейромышечную связь
      - Усложнённый вариант: пауза 2-3 секунды в точке пикового сокращения
      - Меняйте положение рукоятей для разной глубины растяжения
