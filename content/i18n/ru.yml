  Chest Dip:
    name: Отжимания на брусьях на грудь
    instructions: |
      ## Обзор
      Отжимания на брусьях на грудь — жимовое упражнение с собственным весом, нацеленное в первую очередь на нижнюю часть больших грудных мышц. В работу также включаются трицепсы и передние дельты; наклон корпуса вперёд смещает нагрузку с трицепсов на грудь, эффективно развивая её нижнюю часть.

      ## Техника выполнения
      ### 1. Исходное положение
      - Примите упор на параллельных брусьях на полностью выпрямленных руках
      - Крепко возьмитесь за брусья; по возможности держите руки чуть шире плеч
      - Наклоните корпус вперёд примерно на 30-45 градусов
      - Скрестите лодыжки позади себя или держите ноги прямыми
      - Напрягите мышцы кора и держите плечи опущенными

      ### 2. Движение
      1. Опуститесь, сгибая локти примерно до 90 градусов
      2. Держите локти слегка разведёнными, а корпус — наклонённым вперёд
      3. Продолжайте опускаться до ощущения растяжения в груди
      4. Сделайте короткую паузу в нижней точке
      5. Оттолкнитесь ладонями, выпрямите руки и вернитесь в исходное положение
      6. Повторите нужное число контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опускаясь вниз
      - Выдыхайте, выжимая себя обратно в исходное положение

      ### 4. Советы
      - Сохраняйте наклон вперёд, чтобы держать акцент на груди
      - Разводите локти шире, чем в отжиманиях на брусьях на трицепс
      - Сосредоточьтесь на растяжении груди в нижней точке
      - Не опускайтесь слишком глубоко, чтобы не перегружать плечи
      - Сохраняйте контроль на всей амплитуде движения

      ### 5. Частые ошибки
      - Слишком вертикальное положение корпуса, смещающее нагрузку на трицепсы
      - Недостаточный наклон вперёд
      - Слишком глубокое опускание, перегружающее плечи
      - Использование инерции или отбива в нижней точке
      - Неполное выпрямление локтей в верхней точке
      - Подъём плеч к ушам

      ### 6. Безопасность и модификации
      - Используйте гравитрон или ленту для поддержки
      - Уменьшите амплитуду при дискомфорте в плечах
      - Усложнённый вариант: добавьте вес с помощью пояса для отягощений или жилета-утяжелителя
      - Прогрессируйте постепенно, чтобы не перегрузить плечи
    validated: false
    source_digest: 050f9dfd82f8
  Chest Dip (Assisted):
    name: Отжимания на брусьях на грудь (гравитрон)
    instructions: |
      ## Обзор
      Отжимания на брусьях на грудь в гравитроне — жимовое упражнение на тренажёре с поддержкой, нацеленное в первую очередь на нижнюю часть больших грудных мышц. В работу также включаются трицепсы и передние дельты; противовес облегчает движение, помогая наработать силу для отжиманий на брусьях без поддержки.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите вес на гравитроне (больше вес — больше поддержка)
      - Возьмитесь за рукояти, руки чуть шире плеч
      - Поставьте колени или стопы на платформу поддержки
      - Начинайте с полностью выпрямленных рук и наклонённого вперёд корпуса
      - Напрягите мышцы кора и держите плечи опущенными

      ### 2. Движение
      1. Опуститесь, сгибая локти примерно до 90 градусов
      2. Держите корпус наклонённым вперёд на протяжении всего движения
      3. Сохраняйте контроль, пока платформа поддерживает ваш вес
      4. Сделайте короткую паузу в нижней точке
      5. Оттолкнитесь ладонями, выпрямите руки и вернитесь в исходное положение
      6. Повторите нужное число контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опускаясь вниз
      - Выдыхайте, выжимая себя обратно в исходное положение

      ### 4. Советы
      - Сохраняйте наклон вперёд, чтобы акцент был на груди, а не на трицепсах
      - Постепенно уменьшайте вес поддержки по мере роста силы
      - Двигайтесь подконтрольно на всей амплитуде
      - Держите локти слегка разведёнными для акцента на грудь
      - Не полагайтесь на поддержку слишком сильно

      ### 5. Частые ошибки
      - Слишком большая поддержка, при которой нет реальной нагрузки
      - Слишком вертикальное положение корпуса вместо наклона вперёд
      - Чрезмерное разведение локтей в стороны
      - Использование инерции вместо контролируемого движения
      - Неполная амплитуда движения
      - Отсутствие постепенного уменьшения поддержки со временем

      ### 6. Безопасность и модификации
      - Начните с большей поддержки и постепенно уменьшайте её по мере роста силы
      - Ставьте технику выше слишком быстрого снижения поддержки
      - Перед вариантом без поддержки перейдите к отжиманиям с лентой или негативным повторениям
      - Уменьшите амплитуду при дискомфорте в плечах
