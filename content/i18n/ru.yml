  Face Pull (Cable):
    name: Тяга к лицу (блок)
    instructions: |
      ## Обзор
      Тяга к лицу на блоке — изолирующее упражнение, которое в первую очередь нагружает задние дельты и верх спины. Оно также задействует ромбовидные мышцы и среднюю часть трапеций: канатная рукоять помогает улучшить здоровье плеч, осанку и развить задние дельты.

      ## Техника выполнения
      ### 1. Исходное положение
      - Закрепите канатную рукоять на блоке на уровне верха груди
      - Встаньте лицом к блоку, ноги на ширине плеч
      - Возьмитесь за канат обеими руками нейтральным хватом
      - Сделайте шаг назад, чтобы натянуть трос
      - Держите грудь расправленной, мышцы кора — напряжёнными

      ### 2. Движение
      1. Тяните канат к лицу, отводя локти назад и в стороны
      2. По мере тяги разводите концы каната, проводя их мимо ушей
      3. Сосредоточьтесь на сведении лопаток
      4. Продолжайте, пока кисти не окажутся у ушей
      5. Сделайте паузу и дополнительно напрягите задние дельты и верх спины
      6. Медленно и подконтрольно вернитесь в исходное положение и повторите

      ### 3. Дыхание
      - Делайте выдох, подтягивая канат к лицу
      - Делайте вдох, возвращаясь в исходное положение

      ### 4. Советы
      - Тяните за счёт задних дельт и верха спины, а не рук
      - Держите локти высоко и разведёнными в стороны во время тяги
      - Разводите концы каната, чтобы максимально сократить задние дельты
      - Сохраняйте постоянное натяжение троса на протяжении всего подхода
      - Это отличное упражнение для здоровья плеч и осанки

      ### 5. Частые ошибки
      - Тяга слишком низко, к груди, а не к лицу
      - Концы каната не разводятся в конечной точке
      - Использование инерции или рывки
      - Опускание локтей во время тяги
      - Слишком большой вес в ущерб технике
      - Лопатки не сводятся вместе

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить схему движения
      - Регулируйте высоту блока в диапазоне от верха груди до уровня лица
      - Если блока нет, выполняйте упражнение с лентой
      - Ставьте контролируемые повторения и технику выше большого веса
