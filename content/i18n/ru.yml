  Upright Row (Dumbbell):
    name: Тяга к подбородку (гантели)
    instructions: |
      ## Обзор
      Тяга гантелей к подбородку — базовое упражнение для верхней части тела, нацеленное в первую очередь на средние дельты и верхнюю часть трапеций. Оно также задействует передние дельты и бицепсы; гантели обеспечивают независимую работу рук для развития ширины плеч и верхней части трапеций.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте с гантелями в руках, стопы на ширине плеч
      - Опустите гантели на вытянутых руках перед бёдрами
      - Ладони направлены к телу
      - Стойте ровно, грудь вперёд, мышцы кора напряжены
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Тяните гантели строго вверх вдоль тела
      2. Ведите движение локтями, держа их выше кистей
      3. Продолжайте тянуть, пока гантели не окажутся на уровне верхней части груди или плеч
      4. Сделайте короткую паузу в верхней точке
      5. Медленно и подконтрольно опустите гантели в исходное положение
      6. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая гантели вверх
      - Вдыхайте, опуская гантели вниз

      ### 4. Советы
      - Держите гантели близко к телу во время тяги
      - Ведите движение локтями на протяжении всего упражнения
      - Сосредоточьтесь на работе плеч и трапеций
      - Контролируйте и фазу подъёма, и фазу опускания
      - Гантели обеспечивают более естественную траекторию рук

      ### 5. Частые ошибки
      - Слишком высокая тяга, перегружающая плечи
      - Опускание локтей ниже запястий
      - Использование инерции или раскачивание корпуса
      - Отклонение назад во время тяги
      - Слишком широкий хват, который может вызвать импинджмент плеча
      - Слишком быстрый темп и потеря контроля

      ### 6. Безопасность и модификации
      - Используйте умеренную ширину хвата, чтобы избежать дискомфорта в плечах
      - Останавливайтесь на уровне плеч при любой боли в плечах
      - Начинайте с лёгких гантелей, чтобы освоить движение
      - При дискомфорте в плечах рассмотрите тягу к лицу как альтернативу
