  Flutter Kick:
    name: «Ножницы»
    instructions: |
      ## Обзор
      «Ножницы» — динамическое упражнение на кор с собственным весом, которое в первую очередь нагружает нижнюю часть прямой мышцы живота и сгибатели бедра. В работу также включаются поперечная мышца живота и косые мышцы живота в роли стабилизаторов; непрерывные попеременные движения ногами развивают выносливость нижней части пресса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину на коврик, полностью выпрямив ноги
      - Положите руки рядом с бёдрами или под ягодицы для опоры
      - Прижмите поясницу к коврику и напрягите мышцы кора
      - Слегка приподнимите ноги над полом, примерно на 6–12 дюймов (15–30 см)
      - Держите голову и плечи расслабленными на коврике

      ### 2. Движение
      1. Попеременно поднимайте и опускайте ноги короткими быстрыми движениями
      2. Держите ноги прямыми, а носки вытянутыми на протяжении всего упражнения
      3. Сохраняйте постоянный контролируемый ритм, не касаясь пола
      4. Держите поясницу плотно прижатой к коврику
      5. Продолжайте попеременные махи нужное количество повторений или заданное время
      6. Сосредоточьтесь на коротких быстрых движениях, а не на широких махах ногами

      ### 3. Дыхание
      - Дышите ровно и естественно на протяжении всего движения
      - Не задерживайте дыхание; сохраняйте постоянный ритм дыхания

      ### 4. Советы
      - Держите ноги достаточно низко, чтобы сильнее нагрузить нижнюю часть пресса
      - Прижимайте поясницу к коврику, чтобы защитить позвоночник
      - Двигайтесь от тазобедренных суставов, а не от коленей
      - Держите мышцы кора напряжёнными в течение всего подхода
      - Сосредоточьтесь на контролируемых быстрых движениях, а не на широких махах

      ### 5. Частые ошибки
      - Прогиб поясницы с отрывом от коврика
      - Слишком широкие движения ногами, снижающие нагрузку на кор
      - Опускание ног слишком низко или касание пола между махами
      - Излишнее напряжение шеи и верхней части тела
      - Слишком медленный или неравномерный темп
      - Задержка дыхания во время упражнения

      ### 6. Безопасность и модификации
      - Новички могут поднять ноги выше, чтобы снизить нагрузку
      - Подложите руки под ягодицы для дополнительной поддержки поясницы
      - Продвинутый вариант: выполняйте с приподнятыми головой и плечами, как в скручивании
      - При дискомфорте в пояснице поднимите ноги выше или сократите длительность
