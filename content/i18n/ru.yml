  Oblique Crunch:
    name: Косые скручивания
    instructions: |
      ## Обзор
      Косые скручивания — упражнение на кор с собственным весом, которое в первую очередь нагружает косые мышцы живота и прямую мышцу живота. В качестве стабилизатора также работает поперечная мышца живота, что делает упражнение эффективным для развития силы и рельефа боковых мышц кора.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на бок на коврик, ноги положите друг на друга или слегка разнесите для устойчивости
      - Нижнюю руку положите на пол для опоры или на грудь
      - Верхнюю руку слегка заведите за голову, локоть направьте вверх
      - Напрягите мышцы кора и сохраняйте нейтральное положение позвоночника
      - Держите бёдра друг над другом, таз направлен вперёд

      ### 2. Движение
      1. Поднимите плечо и верх корпуса к тазу, сокращая косые мышцы
      2. Сосредоточьтесь на приближении грудной клетки к бедру с той же стороны
      3. Сожмите косые мышцы в верхней точке на 1–2 секунды
      4. Медленно и подконтрольно опуститесь в исходное положение
      5. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Выдыхайте, скручиваясь вверх и сокращая косые мышцы
      - Вдыхайте, опускаясь в исходное положение

      ### 4. Советы
      - Работайте на боковое сгибание за счёт косых мышц, а не на сгибание вперёд
      - Держите таз стабильным и не вращайте его
      - Двигайтесь медленно и подконтрольно, чтобы максимально включить мышцы
      - Не тяните голову и шею рукой
      - Сохраняйте постоянное напряжение косых мышц на протяжении всего движения

      ### 5. Частые ошибки
      - Тяга за шею или голову, что может привести к перенапряжению
      - Вращение таза вместо изолированной работы косых мышц
      - Использование инерции вместо контролируемого мышечного сокращения
      - Неполное включение косых мышц на каждом повторении
      - Слишком быстрый темп в ущерб технике
      - Неодинаковое количество повторений на каждую сторону

      ### 6. Безопасность и модификации
      - Новички могут держать обе руки за головой для большей поддержки
      - Продвинутый вариант: держите блин на груди для дополнительного сопротивления
      - При дискомфорте в шее положите верхнюю руку на грудь
      - Усложняйте упражнение паузой 2–3 секунды в пиковом сокращении
