  Cable Crossover:
    name: Сведения рук в кроссовере
    instructions: |
      ## Обзор
      Сведения рук в кроссовере — изолирующее упражнение, нацеленное в первую очередь на большие грудные мышцы, особенно на внутреннюю часть груди. В качестве стабилизаторов также работают передние дельты; тросы создают постоянное напряжение на протяжении широкой дуги движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте по центру между двумя верхними блоками
      - Возьмите по рукояти в каждую руку, руки разведены в стороны
      - Сделайте шаг вперёд в разножку для устойчивости
      - Слегка наклонитесь вперёд от таза, грудь вперёд
      - Сохраняйте небольшое сгибание в локтях на протяжении всего упражнения

      ### 2. Движение
      1. Сведите обе рукояти вниз и вместе перед грудью
      2. Держите локти слегка согнутыми, словно обнимаете что-то большое
      3. Продолжайте, пока кисти не встретятся или не скрестятся на уровне груди
      4. Сильно напрягите грудь в точке пикового сокращения
      5. Медленно и подконтрольно верните руки в исходное положение
      6. Останавливайтесь до потери натяжения тросов и повторяйте

      ### 3. Дыхание
      - Выдыхайте, сводя рукояти вместе
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Сохраняйте одинаковое сгибание в локтях на протяжении всего движения
      - Сосредоточьтесь на сжатии груди, а не на тяге руками
      - Поддерживайте постоянное напряжение, контролируя обе фазы
      - Держите мышцы кора в напряжении, чтобы не заваливаться вперёд
      - Меняйте высоту блоков, чтобы прорабатывать грудь под разными углами

      ### 5. Частые ошибки
      - Полное выпрямление рук во время движения
      - Использование инерции и раскачивание корпуса
      - Потеря постоянного натяжения тросов
      - Слишком сильный наклон вперёд
      - Слишком быстрый темп и потеря пикового сокращения
      - Слишком большой вес и чрезмерное сгибание локтей

      ### 6. Безопасность и модификации
      - Начните с лёгкого веса, чтобы освоить движение по дуге
      - Меняйте высоту блоков (верхний, средний, нижний) для разных акцентов на грудь
      - Работайте одной рукой для одностороннего акцента
      - Усложнённый вариант: пауза 2-3 секунды в точке пикового сокращения
