  Preacher Curl (Machine):
    name: Сгибания на скамье Скотта (тренажёр)
    instructions: |
      ## Обзор
      Сгибания на скамье Скотта в тренажёре — изолирующее упражнение, которое в первую очередь нагружает двуглавую мышцу плеча по заданной траектории движения. В работу также включаются плечевая и плечелучевая мышцы; фиксированный тренажёр обеспечивает стабильность и постоянное сопротивление на протяжении всего сгибания.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для сгибаний на скамье Скотта, прижав грудь к подушке
      - Отрегулируйте высоту сиденья так, чтобы подмышки опирались на верхний край подушки для рук
      - Положите плечи плоско на подушку
      - Возьмитесь за рукояти обратным хватом
      - Выберите подходящий вес на грузовом стеке

      ### 2. Движение
      1. Поднимите рукояти вверх, сокращая бицепсы
      2. Держите плечи плотно прижатыми к подушке от начала до конца
      3. Продолжайте подъём до полного сокращения бицепсов
      4. Сделайте паузу и напрягите бицепсы в верхней точке
      5. Медленно и подконтрольно опустите рукояти в исходное положение
      6. Остановитесь чуть раньше, чем плитки грузового стека соприкоснутся, чтобы сохранить напряжение, и повторите

      ### 3. Дыхание
      - Выдыхайте, поднимая рукояти вверх
      - Вдыхайте, опуская рукояти вниз

      ### 4. Советы
      - Держите плечи полностью неподвижными на подушке
      - Не отрывайте грудь и локти от подушки
      - Поддерживайте постоянное напряжение, не давая грузовому стеку опускаться до конца
      - Сосредоточьтесь на пиковом сокращении в верхней точке каждого повторения
      - Контролируйте и подъём, и опускание

      ### 5. Частые ошибки
      - Отрыв локтей или плеч от подушки
      - Работа за счёт инерции вместо контролируемого мышечного сокращения
      - Полное опускание грузового стека между повторениями
      - Неполная амплитуда движения
      - Слишком большой вес в ущерб технике
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Отрегулируйте высоту сиденья так, чтобы локти были выровнены с осью вращения тренажёра
      - Начинайте с лёгкого веса, чтобы наладить нейромышечную связь
      - Усложнённый вариант: добавьте паузу 2–3 секунды в точке пикового сокращения
      - Если конструкция тренажёра позволяет, выполняйте по одной руке за раз
