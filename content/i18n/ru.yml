  Triceps Extension (Cable):
    name: Разгибания на трицепс (блок)
    instructions: |
      ## Обзор
      Разгибания на трицепс на блоке — изолирующее упражнение, которое в первую очередь нагружает все три головки трицепса при постоянном натяжении. В качестве стабилизаторов также работают плечи и мышцы кора: положение троса над головой обеспечивает непрерывное сопротивление на протяжении всего движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте спиной к верхнему блоку с канатной рукоятью
      - Возьмитесь за концы каната и сделайте шаг вперёд, чтобы создать натяжение
      - Поднимите согнутые в локтях руки над головой
      - Держите локти направленными вперёд и относительно близко к голове
      - Поставьте ноги в разножку для устойчивости и напрягите мышцы кора

      ### 2. Движение
      1. Разогните локти, выпрямляя руки вперёд и вверх
      2. Держите плечевую часть рук неподвижной и близко к голове
      3. Продолжайте движение до полного выпрямления рук
      4. Сделайте паузу и дополнительно напрягите трицепсы в точке полного выпрямления
      5. Медленно и подконтрольно вернитесь в исходное положение
      6. Не давайте плиткам грузового стека коснуться друг друга, чтобы сохранить постоянное натяжение, затем повторите

      ### 3. Дыхание
      - Выдыхайте, разгибая руки вперёд
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите плечевую часть рук неподвижной на протяжении всего движения
      - Сохраняйте постоянное натяжение, не позволяя грузу ложиться на стек
      - Держите локти относительно близко друг к другу
      - Не прогибайтесь в пояснице во время движения
      - Сосредоточьтесь на пиковом сокращении в точке полного выпрямления

      ### 5. Частые ошибки
      - Чрезмерное разведение локтей в стороны
      - Движение плечевой частью рук вместо её фиксации
      - Груз ложится на стек между повторениями
      - Слишком сильный наклон вперёд
      - Использование инерции вместо контролируемого движения
      - Неполное разгибание в локтях

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить положение с тросом над головой
      - Пробуйте разные рукояти (канат, прямая рукоять, V-образная рукоять) для разнообразия
      - Продвинутый вариант: выполняйте одной рукой для односторонней проработки
      - При необходимости опуститесь на оба колена для более устойчивого положения
