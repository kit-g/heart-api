  Wrist Roller:
    name: Ролик для предплечий
    instructions: |
      ## Обзор
      Ролик для предплечий — упражнение для предплечий, которое в первую очередь нагружает сгибатели и разгибатели запястья. Непрерывное вращательное движение также включает мышцы хвата и предплечья, поэтому упражнение отлично развивает силу и выносливость предплечий.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте прямо, удерживая ролик для предплечий обеими руками
      - Возьмитесь за рукоять прямым хватом, ладони направлены вниз
      - Вытяните прямые руки перед собой на уровне плеч
      - Поставьте ноги на ширине плеч и напрягите мышцы кора
      - Убедитесь, что груз свободно висит на верёвке

      ### 2. Движение
      1. Начните вращать рукоять, поочерёдно сгибая запястья каждой рукой
      2. Накручивайте верёвку, поднимая груз к рукояти
      3. Держите руки вытянутыми и параллельными полу на протяжении всего движения
      4. Продолжайте вращать, пока груз не поднимется до верха
      5. Затем медленно раскручивайте верёвку в обратном направлении, опуская груз
      6. Контролируйте движение и при накручивании, и при раскручивании

      ### 3. Дыхание
      - Дышите ровно и естественно на протяжении всего движения
      - Не задерживайте дыхание во время непрерывного вращения

      ### 4. Советы
      - Держите вытянутые руки на уровне плеч на протяжении всего движения
      - Работайте контролируемыми движениями запястий, а не инерцией
      - Поддерживайте равномерное, непрерывное вращение без пауз
      - Держите запястья на одной линии с предплечьями
      - Начинайте с лёгкого веса, чтобы освоить технику

      ### 5. Частые ошибки
      - Опускание рук ниже уровня плеч
      - Рывковые движения и использование инерции
      - Неконтролируемое падение груза при опускании
      - Сгибание локтей во время движения
      - Слишком быстрое вращение и потеря контроля
      - Излишнее напряжение плеч и верхней части тела

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы развить выносливость предплечий
      - Отдыхайте между подходами: предплечья быстро утомляются
      - Продвинутый вариант: поднимайте и опускайте груз несколько раз подряд без отдыха
      - Вариант с обратным хватом: используйте обратный хват, чтобы сместить акцент на другие мышцы предплечья
