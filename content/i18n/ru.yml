    instructions: |
      ## Обзор
      Австралийские подтягивания — тяговое упражнение с собственным весом, которое в первую очередь нагружает широчайшие, ромбовидные мышцы и среднюю часть трапеций. Также работают бицепсы, задние дельты и мышцы кора, что делает его эффективным горизонтальным тяговым движением для развития силы и выносливости мышц спины.

      ## Техника выполнения
      ### 1. Исходное положение
      - Расположитесь под закреплённой перекладиной на высоте от пояса до груди
      - Возьмитесь за перекладину прямым хватом, руки на ширине плеч
      - Выпрямите тело, пятки на полу, руки полностью выпрямлены
      - Держите тело в прямой линии от головы до пяток
      - Держите мышцы кора и ягодичные мышцы в напряжении на протяжении всего движения

      ### 2. Движение
      1. Подтяните грудь к перекладине, отводя локти назад
      2. Во время тяги держите тело прямым, а мышцы кора — в напряжении
      3. Продолжайте, пока грудь не коснётся перекладины или почти не коснётся её
      4. В верхней точке сведите лопатки
      5. Медленно и подконтрольно опуститесь в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, подтягивая грудь к перекладине
      - Вдыхайте, опускаясь вниз

      ### 4. Советы
      - Держите тело в прямой линии на протяжении всего движения
      - Тянитесь грудью и держите локти близко к телу
      - Сосредоточьтесь на сведении лопаток
      - Не позволяйте тазу провисать или подниматься вверх
      - Контролируйте и тягу, и опускание

      ### 5. Частые ошибки
      - Провисание или подъём таза вверх
      - Неполная амплитуда в верхней точке
      - Использование инерции вместо контролируемого движения
      - Чрезмерное разведение локтей в стороны
      - Потеря прямой линии тела
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Поднимите перекладину выше, чтобы упростить упражнение для новичков
      - Опустите перекладину или поставьте ноги на возвышение, чтобы усложнить упражнение
      - Выполняйте обратным хватом, чтобы сместить акцент на другие мышцы
      - Продвинутый вариант: задержитесь на 2–3 секунды в верхней точке каждого повторения
