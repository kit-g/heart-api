      - Сохраняйте вертикальную осанку с напряжёнными мышцами кора

      ### 2. Движение
      1. Поднимите ленту, сгибая локти и сохраняя ладони направленными друг к другу
      2. Держите плечевую часть рук неподвижной и прижатой к бокам
      3. Поднимайте, пока кисти не окажутся на уровне плеч
      4. Сделайте паузу и сожмите мышцы в верхней точке движения
      5. Медленно и подконтрольно опустите руки в исходное положение
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая ленту
      - Вдыхайте, опуская руки

      ### 4. Советы
      - Сохраняйте нейтральный хват («молоток») на протяжении всего движения
      - Держите локти неподвижными и прижатыми к телу
      - Не раскачивайтесь и не используйте инерцию для подъёма ленты
      - Сосредоточьтесь на сжатии мышц в верхней точке каждого повторения
      - Контролируйте сопротивление и на подъёме, и на опускании

      ### 5. Частые ошибки
      - Вращение запястий вместо сохранения нейтрального хвата
      - Смещение локтей вперёд во время сгибания
      - Подъём ленты за счёт инерции и раскачивания корпуса
      - Неполная амплитуда движения
      - Потеря натяжения ленты в нижней точке
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Начните с ленты полегче, чтобы освоить движение с нейтральным хватом
      - Выполняйте попеременные сгибания «молоток» (по одной руке) для лучшей концентрации
      - Продвинутый вариант: возьмите ленту с большим сопротивлением или добавьте паузу вверху
      - Меняйте положение стоп на ленте, чтобы регулировать уровень сопротивления
