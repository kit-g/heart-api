  Bench Dip:
    name: Обратные отжимания от скамьи
    instructions: |
      ## Обзор
      Обратные отжимания от скамьи — упражнение с собственным весом, которое в первую очередь нагружает трицепсы. Плечи и грудные мышцы работают как вспомогательные, что делает упражнение эффективным жимовым движением для верха тела, требующим минимума оборудования.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на край устойчивой скамьи, взявшись руками за край по бокам от бёдер
      - Поставьте руки на ширине плеч, пальцы направлены вперёд
      - Вытяните ноги перед собой, пятки на полу
      - Сдвиньте таз со скамьи, оставив руки на месте
      - Держите спину близко к скамье, а плечи опущенными

      ### 2. Движение
      1. Опустите тело, сгибая локти примерно до 90 градусов
      2. Держите локти направленными строго назад, не разводите их в стороны
      3. Сохраняйте вертикальное положение корпуса и не сутультесь
      4. Сделайте короткую паузу в нижней точке движения
      5. Отожмитесь ладонями, выпрямляя руки, и вернитесь в исходное положение
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опускаясь вниз
      - Выдыхайте, отжимаясь в исходное положение

      ### 4. Советы
      - Держите локти прижатыми к телу на протяжении всего движения
      - Поднимайтесь за счёт трицепсов, а не толчка ногами
      - Держите мышцы кора напряжёнными для стабильности
      - Не поднимайте плечи к ушам
      - Работайте в полной амплитуде, сохраняя контроль

      ### 5. Частые ошибки
      - Чрезмерное разведение локтей в стороны
      - Слишком глубокое опускание, перегружающее плечи
      - Толчок ногами вместо изолированной работы трицепсов
      - Слишком быстрый темп и использование инерции
      - Сутулость и подача плеч вперёд
      - Недостаточная глубина опускания для полноценной работы трицепсов

      ### 6. Безопасность и модификации
      - Новички могут согнуть колени и поставить стопы ближе к скамье для облегчения
      - Продвинутый вариант: поставьте стопы на другую скамью для усложнения
      - Положите блин на бёдра для дополнительного сопротивления
      - При дискомфорте в плечах уменьшите амплитуду
