  Side Plank:
    name: Боковая планка
    instructions: |
      ## Обзор
      Боковая планка — изометрическое упражнение на кор, которое в первую очередь нагружает косые мышцы живота и поперечную мышцу живота. В работу также включаются плечи, стабилизаторы таза и квадратная мышца поясницы, что делает упражнение очень эффективным для развития силы боковых мышц кора, стабильности и баланса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на бок на коврик, ноги одна на другой, тело вытянуто в прямую линию
      - Расположите локоть строго под плечом, предплечье перпендикулярно телу
      - Поставьте стопы одну на другую или выведите верхнюю стопу вперёд для большей устойчивости
      - Верхнюю руку положите на пояс или вытяните к потолку
      - Напрягите мышцы кора и приготовьтесь поднять таз

      ### 2. Движение
      1. Упритесь предплечьем и стопами в пол и поднимите таз
      2. Поднимайте таз, пока тело не образует прямую линию от головы до стоп
      3. Держите мышцы кора напряжёнными, а таз приподнятым на протяжении всего удержания
      4. Не позволяйте тазу провисать или подниматься вверх «домиком»
      5. Удерживайте статическое положение нужное время, обычно 20–45 секунд на каждую сторону
      6. Подконтрольно опустите таз на пол, затем повторите на другую сторону

      ### 3. Дыхание
      - Дышите ровно и естественно на протяжении всего удержания
      - Не задерживайте дыхание; сохраняйте спокойный, равномерный ритм дыхания

      ### 4. Советы
      - Держите тело прямой линией, без провисания и вращения
      - Напрягайте косые мышцы, чтобы удерживать таз приподнятым
      - Опускайте опорное плечо вниз, дальше от уха
      - Держите шею в нейтральном положении, глядя прямо перед собой
      - Представляйте, что отталкиваете пол предплечьем

      ### 5. Частые ошибки
      - Провисание таза к полу
      - Поворот корпуса вперёд или назад вместо удержания боковой линии
      - Поднятие плеч к ушам
      - Задержка дыхания вместо естественного дыхания
      - Неправильное выстраивание тела, нарушающее прямую линию
      - Удержание позиции с плохой техникой вместо сокращения времени

      ### 6. Безопасность и модификации
      - Новички могут выполнять с опорой на колени вместо стоп
      - Сократите время удержания и сосредоточьтесь на идеальной технике, прежде чем увеличивать длительность
      - Продвинутый вариант: поднимите верхнюю ногу для усложнения
      - Выполняйте на обе стороны для сбалансированного развития кора
