  Leg Press:
    name: Жим ногами
    instructions: |
      ## Обзор
      Жим ногами — базовое упражнение для нижней части тела, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и бицепс бедра. Тренажёр с заданной траекторией обеспечивает стабильное сопротивление и позволяет работать с большими весами при меньшей нагрузке на поясницу по сравнению с приседаниями со свободным весом.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для жима ногами, плотно прижав спину и таз к спинке
      - Поставьте ноги на платформу на ширине плеч
      - Стопы держите полностью на платформе, носки слегка разведены наружу
      - Снимите платформу с предохранительных упоров
      - Держите мышцы кора напряжёнными, а руки на рукоятках

      ### 2. Движение
      1. Опустите платформу, сгибая колени по направлению к груди
      2. Продолжайте, пока колени не согнутся примерно до 90 градусов
      3. Сделайте короткую паузу в нижней точке
      4. Выжмите платформу обратно вверх, отталкиваясь пятками
      5. Выпрямите ноги, не выключая колени полностью
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опуская платформу
      - Выдыхайте, выжимая платформу обратно

      ### 4. Советы
      - Держите спину и таз плотно прижатыми к спинке
      - Давите всей стопой, а не только носками
      - Не выпрямляйте колени полностью в верхней точке
      - Следите, чтобы колени двигались в одной плоскости с носками
      - Сохраняйте постоянное напряжение на протяжении всего движения

      ### 5. Частые ошибки
      - Отрыв ягодиц или поясницы от спинки
      - Полное выключение коленей в точке выпрямления
      - Заваливание коленей внутрь
      - Недостаточная глубина (менее 90 градусов)
      - Слишком большой вес в ущерб технике
      - Слишком низкая постановка ног на платформе, увеличивающая нагрузку на колени

      ### 6. Безопасность и модификации
      - Меняйте постановку ног (выше, ниже, шире, уже), чтобы смещать акцент на разные мышцы
      - Никогда не выключайте колени полностью, чтобы защитить сустав
      - Начните с умеренного веса, чтобы отработать технику
      - Продвинутый вариант: выполняйте жим одной ногой или добавьте паузу в нижней точке
