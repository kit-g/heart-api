  V Up:
    name: Складка «V»
    instructions: |
      ## Обзор
      Складка «V» — продвинутое упражнение на кор с собственным весом, которое в первую очередь нагружает всю прямую мышцу живота. В работу также включаются сгибатели бедра, косые мышцы живота и поперечная мышца живота: одновременный подъём верхней и нижней части тела в положение «V» создаёт интенсивное сокращение мышц кора.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину на коврик, вытянув руки над головой
      - Держите ноги прямыми и вместе, полностью вытянутыми на коврике
      - Напрягите мышцы кора и прижмите поясницу к коврику
      - Держите голову в нейтральном положении на одной линии с позвоночником

      ### 2. Движение
      1. Одновременно поднимите ноги и верхнюю часть тела с коврика
      2. Держите руки и ноги прямыми, тянясь руками к носкам
      3. Сложитесь в форму буквы «V», балансируя на ягодицах
      4. В пиковой точке коснитесь носков или потянитесь к ним
      5. Сделайте короткую паузу в положении «V»
      6. Медленно и подконтрольно опустите верхнюю и нижнюю части тела обратно
      7. Вернитесь в исходное положение и повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, складываясь в положение «V»
      - Вдыхайте, опускаясь в исходное положение

      ### 4. Советы
      - Складывайтесь за счёт мышц кора, а не инерции
      - Держите ноги и руки прямыми на протяжении всего движения
      - Сохраняйте контроль как на подъёме, так и на опускании
      - Балансируйте на ягодицах в верхней точке движения
      - Двигайтесь медленно, сохраняя постоянное напряжение в мышцах пресса

      ### 5. Частые ошибки
      - Подъём рывком за счёт инерции вместо контролируемого сокращения кора
      - Сгибание коленей или рук, чтобы облегчить упражнение
      - Тяга руками вместо работы мышц кора
      - Слишком быстрый темп и потеря контроля
      - Неполное возвращение в исходное положение
      - Задержка дыхания во время движения

      ### 6. Безопасность и модификации
      - Новичкам стоит сначала освоить скручивания и подъёмы ног по отдельности
      - Если прямые ноги слишком сложны, выполняйте вариант с согнутыми коленями (складку с подтянутыми коленями)
      - Продвинутый вариант: зажмите лёгкий вес между стопами для дополнительного сопротивления
      - При дискомфорте в пояснице уменьшите амплитуду или перейдите на более простые варианты
