      6. Полностью выпрямите локти в верхней точке и повторяйте в контролируемом темпе

      ### 3. Дыхание
      - Вдыхайте, опуская гриф к груди
      - Выдыхайте, выжимая гриф вверх

      ### 4. Советы
      - Расположите скамью так, чтобы траектория грифа совпадала с вашей естественной траекторией жима
      - Держите лопатки сведёнными на протяжении всего подхода
      - Используйте преимущество фиксированной траектории для контролируемых повторений
      - Сохраняйте естественный прогиб в пояснице
      - Держите стопы прижатыми к полу и упирайтесь ими для стабильности

      ### 5. Частые ошибки
      - Неправильное положение скамьи относительно траектории грифа
      - Отбив грифа от груди
      - Чрезмерное разведение локтей в стороны
      - Отрыв таза от скамьи
      - Неполная амплитуда движения
      - Чрезмерная опора на стабильность тренажёра

      ### 6. Безопасность и модификации
      - Отрегулируйте положение скамьи так, чтобы гриф двигался по естественной траектории над грудью
      - Установите страховочные упоры на подходящей высоте
      - Выполняйте на наклонной скамье или скамье с обратным наклоном для разнообразия
      - Усложнённый вариант: добавьте цепи или выполняйте медленные негативные повторения
