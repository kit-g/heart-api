  Lying Leg Curl (Machine):
    name: Сгибания ног лёжа (тренажёр)
    instructions: |
      ## Обзор
      Сгибания ног лёжа — изолирующее упражнение, которое в первую очередь нагружает бицепс бедра. Оно также задействует икры: тренажёр с заданной траекторией позволяет изолированно укреплять мышцы задней поверхности бедра за счёт сгибания в коленях.

