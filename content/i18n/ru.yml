  Romanian Deadlift (Dumbbell):
    name: Румынская тяга (гантели)
    instructions: |
      ## Обзор
      Румынская тяга с гантелями — упражнение на наклон через тазобедренные суставы, которое в первую очередь нагружает бицепс бедра, ягодичные мышцы и разгибатели позвоночника. Оно также задействует широчайшие и трапеции как стабилизаторы: гантели дают независимое движение рук и более естественное положение кистей, а акцент делается на эксцентрической фазе.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, в каждой руке по гантели
      - Держите гантели перед бёдрами, ладони обращены к телу
      - Стойте прямо: грудь расправлена, плечи отведены назад, мышцы кора напряжены
      - Сохраняйте лёгкий сгиб в коленях на протяжении всего упражнения

      ### 2. Движение
      1. Выполните наклон через тазобедренные суставы: отведите таз назад и опускайте гантели
      2. Держите спину ровной, а гантели близко к ногам
      3. Опускайтесь до ощущения растяжения в бицепсе бедра, обычно до середины голени
      4. Сохраняйте лёгкий сгиб в коленях на протяжении всего движения
      5. Подайте таз вперёд и вернитесь в исходное положение
      6. Напрягите ягодичные мышцы в верхней точке и повторяйте в контролируемом темпе

      ### 3. Дыхание
      - Вдыхайте, опуская гантели
      - Выдыхайте, подавая таз вперёд и выпрямляясь

      ### 4. Советы
      - Сосредоточьтесь на наклоне через тазобедренные суставы, а не на приседании или сгибании коленей
      - Держите спину ровной, а грудь расправленной на протяжении всего упражнения
      - Отводите таз назад как можно дальше
      - Держите гантели близко к ногам на протяжении всего движения
      - Почувствуйте растяжение в бицепсе бедра в нижней точке

      ### 5. Частые ошибки
      - Округление спины вместо сохранения ровного положения позвоночника
      - Чрезмерное сгибание коленей, превращающее упражнение в присед
      - Недостаточное отведение таза назад
      - Опускание гантелей ниже точки растяжения бицепса бедра
      - Слишком большой вес в ущерб технике
      - Взгляд вверх вместо нейтрального положения шеи

      ### 6. Безопасность и модификации
      - Начните с лёгких гантелей, чтобы отработать паттерн наклона через тазобедренные суставы
      - Сохраняйте лёгкий сгиб в коленях, чтобы защитить бицепс бедра
      - Вариант с гантелями даёт более естественный хват, чем со штангой
      - При дискомфорте в пояснице уменьшите вес и проверьте технику
