  Concentration Curl (Dumbbell):
    name: Концентрированные сгибания (гантель)
    instructions: |
      ## Обзор
      Концентрированные сгибания — изолирующее упражнение, которое в первую очередь нагружает двуглавую мышцу плеча с максимальной концентрацией на мышце. Брахиалис и плечелучевая мышца также включаются в работу, а положение сидя с упором исключает инерцию, обеспечивая строгую изоляцию бицепса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на скамью, широко расставив ноги
      - Возьмите гантель в одну руку, рука свободно свисает вниз
      - Упритесь задней поверхностью плечевой части руки во внутреннюю сторону бедра
      - Слегка наклонитесь вперёд и обопритесь свободной рукой о противоположное бедро
      - Держите грудь приподнятой, а мышцы кора напряжёнными

      ### 2. Движение
      1. Поднимите гантель, сокращая бицепс
      2. Держите плечевую часть руки плотно прижатой к внутренней стороне бедра на протяжении всего движения
      3. Поднимайте гантель до уровня плеча
      4. Сделайте паузу и сильно сожмите бицепс в верхней точке
      5. Медленно и подконтрольно опустите гантель в исходное положение
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Выдыхайте, поднимая гантель
      - Вдыхайте, опуская гантель

      ### 4. Советы
      - Держите плечевую часть руки полностью неподвижной у бедра
      - Сосредоточьтесь на чистом сокращении бицепса без движений корпуса
      - Сильно сжимайте бицепс в верхней точке каждого повторения
      - Не позволяйте гантели раскачиваться и не используйте инерцию
      - Контролируйте вес на всей амплитуде движения

      ### 5. Частые ошибки
      - Отрыв локтя от бедра во время сгибания
      - Использование инерции и раскачивание веса
      - Неполная амплитуда в верхней или нижней точке
      - Отклонение назад и раскачивание корпуса
      - Слишком большой вес в ущерб строгой технике
      - Спешка в повторениях вместо концентрации на сокращении мышцы

      ### 6. Безопасность и модификации
      - Начните с умеренного веса, чтобы обеспечить строгую технику
      - Держите спину прямой, чтобы избежать перегрузки поясницы
      - Продвинутый вариант: добавьте паузу 3–5 секунд в точке пикового сокращения
      - Выполняйте с опорой руки на наклонную скамью для другого угла нагрузки
