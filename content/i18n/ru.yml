  Pendlay Row (Barbell):
    name: Тяга Пендлея (штанга)
    instructions: |
      ## Обзор
      Тяга Пендлея — взрывное упражнение со штангой, которое в первую очередь нагружает широчайшие мышцы спины, ромбовидные мышцы и среднюю часть трапеций. В работу также включаются поясница и бицепс бедра; полная остановка штанги между повторениями исключает инерцию и максимально развивает мощность.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, штанга на полу над серединой стопы
      - Наклонитесь вперёд, пока корпус не станет параллелен полу
      - Возьмитесь за гриф прямым хватом, руки чуть шире плеч
      - Держите спину ровной, грудь направлена вниз, руки полностью выпрямлены
      - Перед каждым повторением напрягайте мышцы кора и широчайшие

      ### 2. Движение
      1. Взрывным движением потяните штангу к нижней части груди или верху живота
      2. Мощно уводите локти назад и вверх
      3. В верхней точке коснитесь грифом корпуса
      4. Коротко сведите лопатки
      5. Подконтрольно опустите штангу обратно на пол
      6. Дождитесь полной остановки штанги на полу, прежде чем начинать следующее повторение

      ### 3. Дыхание
      - Перед каждым повторением сделайте вдох и напрягите корпус
      - Выдыхайте во время тяги или после завершения повторения

      ### 4. Советы
      - Держите корпус параллельно полу на протяжении всего подхода
      - Каждое повторение должно начинаться с полной остановки штанги на полу
      - Тяните взрывно, сохраняя контроль
      - Держите спину ровной, мышцы кора — в напряжении
      - Сосредоточьтесь на генерации усилия мышцами спины

      ### 5. Частые ошибки
      - Штанга не опускается до полной остановки на полу
      - Подъём корпуса во время тяги вместо сохранения параллели с полом
      - Использование отскока штанги от пола
      - Округление спины во время движения
      - Гриф не дотягивается до касания корпуса
      - Слишком медленный темп, теряющий взрывной характер движения

