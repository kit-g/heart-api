  Incline Curl (Dumbbell):
    name: Сгибания на наклонной скамье (гантели)
    instructions: |
      ## Обзор
      Сгибания с гантелями на наклонной скамье — изолирующее упражнение, которое в первую очередь нагружает двуглавую мышцу плеча в увеличенной амплитуде. В работу также включаются плечевая и плечелучевая мышцы; наклонное положение создаёт более сильное растяжение бицепса в начале каждого повторения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите регулируемую скамью под углом 45–60 градусов
      - Сядьте на скамью, плотно прижав спину к спинке
      - Возьмите по гантели в каждую руку, руки свободно свисают вниз
      - Ладони направлены вперёд, локти слегка позади корпуса
      - Держите грудь развёрнутой, мышцы кора напряжёнными

      ### 2. Движение
      1. Поднимите обе гантели вверх, сгибая руки в локтях и сокращая бицепсы
      2. Держите плечи неподвижными и перпендикулярными полу
      3. Продолжайте подъём, пока гантели не окажутся на уровне плеч
      4. Сделайте паузу и напрягите бицепсы в верхней точке
      5. Медленно опустите гантели в исходное положение до полного выпрямления рук
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая гантели вверх
      - Вдыхайте, опуская гантели вниз

      ### 4. Советы
      - Держите плечи неподвижными и перпендикулярными полу на протяжении всего движения
      - Полностью выпрямляйте руки в нижней точке для максимального растяжения
      - Не раскачивайтесь и не поднимайте вес за счёт инерции
      - Держите спину плотно прижатой к скамье
      - Сосредоточьтесь на растяжении внизу и пиковом сокращении вверху

      ### 5. Частые ошибки
      - Уход локтей вперёд во время сгибания
      - Неполное выпрямление рук в нижней точке
      - Отрыв плеч от скамьи
      - Подъём веса за счёт инерции или раскачивания
      - Слишком крутой или слишком пологий угол наклона скамьи
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Из-за увеличенной амплитуды начинайте с меньшего веса, чем в обычных сгибаниях
      - Подбирайте угол наклона скамьи в диапазоне 45–60 градусов под себя
      - Выполняйте сгибания попеременно (по одной руке) для лучшей концентрации
      - Усложнённый вариант: добавьте негативную фазу 3–5 секунд для повышения интенсивности
