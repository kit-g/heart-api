  Romanian Deadlift (Barbell):
    name: Румынская тяга (штанга)
    instructions: |
      ## Обзор
      Румынская тяга — упражнение на основе наклона через тазобедренные суставы, которое в первую очередь нагружает бицепс бедра, ягодичные мышцы и разгибатели позвоночника. В работу как стабилизаторы также включаются широчайшие и трапеции; контролируемое опускание акцентирует эксцентрическую фазу и укрепляет заднюю цепь.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, штанга в руках прямым хватом
      - Расположите кисти сразу за линией ног
      - Встаньте прямо, штанга на уровне таза
      - Держите грудь поднятой, плечи отведёнными назад, мышцы кора в напряжении
      - Сохраняйте лёгкий сгиб в коленях на протяжении всего движения

      ### 2. Движение
      1. Выполните наклон через тазобедренные суставы: отведите таз назад и опускайте штангу
      2. Держите спину ровной, а гриф — близко к ногам
      3. Опускайтесь, пока не почувствуете растяжение бицепса бедра, обычно до середины голени
      4. Сохраняйте лёгкий сгиб в коленях на протяжении всего движения
      5. Подайте таз вперёд и вернитесь в исходное положение
      6. В верхней точке напрягите ягодичные мышцы и повторите в контролируемом темпе

      ### 3. Дыхание
      - Вдыхайте, опуская штангу
      - Выдыхайте, когда подаёте таз вперёд и выпрямляетесь

      ### 4. Советы
      - Сосредоточьтесь на наклоне через тазобедренные суставы, а не на приседании или сгибании коленей
      - Держите спину ровной, а грудь поднятой на протяжении всего движения
      - Отводите таз назад как можно дальше
      - Держите штангу близко к ногам на протяжении всего движения
      - В нижней точке чувствуйте растяжение задней поверхности бедра

      ### 5. Частые ошибки
      - Округление спины вместо сохранения ровного положения позвоночника
      - Чрезмерное сгибание коленей, превращающее движение в присед
      - Недостаточное отведение таза назад
      - Опускание штанги ниже точки растяжения задней поверхности бедра
      - Слишком большой вес в ущерб технике
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить наклон через тазобедренные суставы
      - Сохраняйте лёгкий сгиб в коленях, чтобы защитить бицепс бедра
      - Выполняйте с гантелями, если штанга кажется нестабильной
      - При дискомфорте в пояснице уменьшите вес и проверьте технику
