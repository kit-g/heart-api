  Chest Press (Machine):
    name: Жим от груди (тренажёр)
    instructions: |
      ## Обзор
      Жим от груди в тренажёре — жимовое упражнение с направляемой траекторией, нацеленное в первую очередь на большие грудные мышцы. В работу также включаются передние дельты и трицепсы; фиксированная траектория обеспечивает стабильность и равномерное сопротивление на протяжении всего жима.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр, плотно прижав спину к спинке
      - Отрегулируйте высоту сиденья так, чтобы рукояти были на уровне середины груди
      - Возьмитесь за рукояти обеими руками
      - Поставьте стопы на пол и напрягите мышцы кора
      - Держите лопатки сведёнными и прижатыми к спинке

      ### 2. Движение
      1. Выжмите рукояти вперёд, выпрямляя руки
      2. Держите спину плотно прижатой к спинке на протяжении всего движения
      3. Продолжайте до полного выпрямления рук
      4. Сделайте короткую паузу при полном выпрямлении
      5. Медленно и подконтрольно верните рукояти в исходное положение
      6. Останавливайтесь чуть раньше, чем груз коснётся стека, чтобы сохранить напряжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, выжимая рукояти вперёд
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите спину плотно прижатой к спинке
      - Сохраняйте сведение лопаток на протяжении всего подхода
      - Контролируйте и жим, и возврат
      - Поддерживайте постоянное напряжение, не давая грузу ложиться на стек
      - Сосредоточьтесь на сокращении груди при полном выпрямлении рук

      ### 5. Частые ошибки
      - Отрыв спины от спинки во время жима
      - Использование инерции вместо контролируемого сокращения мышц
      - Опускание груза на стек между повторениями
      - Неполная амплитуда движения
      - Подача плеч вперёд
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Отрегулируйте высоту сиденья так, чтобы рукояти были на уровне груди
      - Начните с лёгкого веса, чтобы отработать правильную технику
      - Пробуйте разные положения хвата, если тренажёр это позволяет
      - Усложнённый вариант: пауза 2-3 секунды при полном выпрямлении
