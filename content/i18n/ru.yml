    instructions: |
      ## Обзор
      Вертикальная тяга в тренажёре — тяговое упражнение с заданной траекторией, которое в первую очередь нагружает широчайшие мышцы спины. В работу также включаются ромбовидные мышцы, средняя часть трапеций и бицепсы; фиксированная траектория движения обеспечивает стабильность и равномерное сопротивление на протяжении всей тяги.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для вертикальной тяги, зафиксировав бёдра под упорами
      - Отрегулируйте высоту сиденья так, чтобы руки полностью выпрямлялись над головой
      - Возьмитесь за рукояти прямым или нейтральным хватом — в зависимости от конструкции тренажёра
      - Держите грудь поднятой, плечи опущенными
      - Напрягите мышцы кора и держите корпус вертикально

      ### 2. Движение
      1. Потяните рукояти вниз к груди, уводя локти вниз и назад
      2. Держите корпус вертикально на протяжении всего движения
      3. Продолжайте, пока рукояти не окажутся у верхней части груди
      4. В нижней точке сведите лопатки
      5. Медленно и подконтрольно верните рукояти в исходное положение
      6. Останавливайтесь чуть раньше, чем грузоблок коснётся упора, чтобы сохранить натяжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, когда тянете рукояти вниз
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите грудь поднятой, а плечи отведёнными назад на протяжении всего движения
      - Ведите движение локтями, уводя их вниз и назад
      - Сосредоточьтесь на сведении лопаток
      - Сохраняйте постоянное натяжение, не позволяя грузоблоку опускаться до конца
      - Контролируйте вес на всей амплитуде движения

      ### 5. Частые ошибки
      - Чрезмерное отклонение назад во время тяги
      - Работа за счёт инерции вместо контролируемого мышечного сокращения
      - Неполная амплитуда движения
      - Подъём плеч к ушам
      - Опускание грузоблока до упора между повторениями
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Отрегулируйте высоту сиденья и упор для бёдер под себя
      - Начинайте с лёгкого веса, чтобы наладить нейромышечную связь
      - Попробуйте разные рукояти, если они доступны
      - Усложнённый вариант: задержитесь на 2-3 секунды в нижней точке каждого повторения
