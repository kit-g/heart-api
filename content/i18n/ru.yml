      3. Опускайтесь, пока бёдра не окажутся как минимум параллельны полу
      4. Сделайте короткую паузу в нижней точке
      5. Оттолкнитесь пятками и вернитесь в положение стоя
      6. Полностью выпрямите тазобедренные суставы и колени в верхней точке, затем повторите

      ### 3. Дыхание
      - Вдох — при опускании в присед
      - Выдох — при подъёме в положение стоя

      ### 4. Советы
      - Ставьте ноги чуть впереди линии грифа для оптимальной техники
      - Фиксированная траектория позволяет отводить таз назад сильнее, чем со свободным весом
      - Следите, чтобы колени двигались в направлении носков
      - Используйте страховочные упоры для дополнительной безопасности
      - Пользуйтесь преимуществом заданной траектории для стабильной техники

      ### 5. Частые ошибки
      - Постановка ног слишком близко к линии грифа
      - Недостаточная глубина приседа
      - Колени заваливаются внутрь
      - Округление спины при опускании
      - Слишком большой вес до освоения техники
      - Чрезмерная зависимость от направляющих машины

      ### 6. Безопасность и модификации
      - Подберите положение стоп относительно грифа, удобное именно вам
      - Установите страховочные упоры на подходящей высоте
      - Начинайте с небольшого веса, чтобы привыкнуть к фиксированной траектории грифа
      - Продвинутый вариант: приседания в машине Смита на одной ноге или пауза в нижней точке
