  Reverse Plank:
    name: Обратная планка
    instructions: |
      ## Обзор
      Обратная планка — изометрическое упражнение на кор, которое в первую очередь нагружает поперечную мышцу живота, поясницу и ягодичные мышцы. Также работают плечи, бицепс бедра и стабилизаторы верха спины, что делает упражнение эффективным для укрепления задней цепи и улучшения осанки.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на коврик, вытянув прямые ноги перед собой
      - Поставьте ладони на пол позади себя, пальцы направлены к стопам
      - Расположите ладони на ширине плеч, руки прямые
      - Напрягите мышцы кора и подготовьтесь поднять таз
      - Держите стопы вместе или на ширине таза

      ### 2. Движение
      1. Отталкиваясь ладонями и пятками, поднимите таз от пола
      2. Поднимайте таз, пока тело не образует прямую линию от головы до пят
      3. Держите руки прямыми, плечи опущенными
      4. Удерживайте положение за счёт ягодичных мышц и кора
      5. Держите это статичное положение заданное время — обычно 20–45 секунд
      6. Закончив, подконтрольно опустите таз на пол

      ### 3. Дыхание
      - Дышите ровно и естественно на протяжении всего удержания
      - Не задерживайте дыхание; дышите спокойно и равномерно

      ### 4. Советы
      - Держите тело прямой линией, без провисания и подъёма таза
      - Сжимайте ягодицы на протяжении удержания, чтобы защитить поясницу
      - Раскрывайте грудь и тянитесь ею вверх, включая верх спины
      - Держите шею нейтрально, глядя слегка вверх
      - Распределяйте вес равномерно между ладонями и пятками

      ### 5. Частые ошибки
      - Провисание таза, перегружающее поясницу
      - Сгибание рук вместо удержания их прямыми
      - Слишком сильное запрокидывание головы, перегружающее шею
      - Задержка дыхания вместо естественного дыхания
      - Отсутствие напряжения в ягодицах, из-за чего перегружается поясница
      - Удержание позиции с плохой техникой вместо сокращения времени

      ### 6. Безопасность и модификации
      - Новички могут начинать с согнутыми коленями (положение обратного «стола»)
      - Сократите время удержания и добейтесь идеальной техники, прежде чем его увеличивать
      - Продвинутый вариант: поднимите одну ногу, чтобы усложнить упражнение
      - При дискомфорте в запястьях выполняйте упражнение с опорой на предплечья
