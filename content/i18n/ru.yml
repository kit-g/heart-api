      - Приземление со слишком широкой постановкой стоп
      - Неполное выпрямление рук над головой
      - Попытка выполнения без работы с тренером

      ### 6. Безопасность и модификации
      - Требуется работа с квалифицированным тренером по тяжёлой атлетике
