      ## Обзор
      Тяга горизонтального блока широким хватом — горизонтальное тяговое упражнение, которое в первую очередь нагружает широчайшие мышцы спины с акцентом на внешнюю часть. В работу также включаются ромбовидные мышцы, средняя часть трапеций и задние дельты; широкий хват нацелен на ширину верха спины и улучшает осанку.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для горизонтальной тяги, поставив стопы на платформы
