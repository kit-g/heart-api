  Bent Over Row (Band):
    name: Тяга в наклоне (лента)
    instructions: |
      ## Обзор
      Тяга в наклоне с лентой — тяговое упражнение с сопротивлением, которое в первую очередь нагружает широчайшие, ромбовидные мышцы и среднюю часть трапеций. Также работают бицепсы и задние дельты: нарастающее сопротивление ленты эффективно прорабатывает спину на протяжении всего движения.

