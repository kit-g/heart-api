      - Держите голову на одной линии с позвоночником

      ### 2. Движение
      1. Поднимите одно колено в сторону, сохраняя сгиб в 90 градусов
      2. Поднимайте ногу, пока бедро не станет параллельно полу или настолько высоко, насколько комфортно
      3. Держите таз ровно и не разворачивайте корпус
      4. В верхней точке сделайте паузу и напрягите внешнюю часть ягодичной мышцы
      5. Медленно и подконтрольно верните колено в исходное положение
      6. Выполните все повторения на одну сторону, затем повторите на другую

