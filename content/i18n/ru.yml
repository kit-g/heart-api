  Deadlift (Smith Machine):
    name: Становая тяга (машина Смита)
    instructions: |
      ## Обзор
      Становая тяга в машине Смита — это базовое упражнение с направляемой траекторией, которое в первую очередь нагружает ягодичные мышцы, бицепс бедра и разгибатели позвоночника. Оно также задействует квадрицепсы, широчайшие и трапеции: фиксированная вертикальная траектория грифа обеспечивает стабильность и позволяет сосредоточиться на самом движении.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите гриф машины Смита на высоте середины голени
      - Встаньте внутри машины, стопы на ширине таза, гриф над серединой стопы
      - Возьмитесь за гриф чуть шире ног прямым или разнохватом
      - Наклонитесь через тазобедренные суставы и согните колени, чтобы дотянуться до грифа
      - Держите грудь расправленной, спину ровной, плечи чуть впереди грифа

      ### 2. Движение
      1. Снимите гриф с фиксаторов, провернув его, затем давите через пятки
      2. Одновременно разгибайте тазобедренные и коленные суставы, вставая
      3. Во время подъёма держите гриф близко к телу
      4. Полностью выпрямитесь: плечи назад, грудь расправлена
      5. Опускайте гриф, отводя таз назад и сгибая колени
      6. Верните гриф в исходное положение и повторите

      ### 3. Дыхание
      - Перед подъёмом сделайте глубокий вдох и напрягите мышцы кора
      - Задержите дыхание во время подъёма
      - Выдохните в верхней точке или при опускании грифа

      ### 4. Советы
      - Фиксированная траектория грифа помогает сохранять правильную технику
      - Держите гриф близко к голеням и бёдрам на протяжении всего движения
      - Вставая, ведите движение грудью
      - Сохраняйте нейтральное положение позвоночника на протяжении всего движения
      - Для дополнительной безопасности используйте страховочные упоры

      ### 5. Частые ошибки
      - Округление поясницы во время подъёма
      - Слишком высокое или слишком низкое положение таза на старте
      - Неправильное положение стоп относительно фиксированной траектории грифа
      - Неполное разгибание таза в верхней точке
      - Взгляд вверх или вниз вместо нейтрального положения шеи
      - Чрезмерная опора на направляемую траекторию машины

      ### 6. Безопасность и модификации
      - Установите стартовую высоту грифа на уровне середины голени для оптимальной техники
      - Установите страховочные упоры на подходящей высоте
      - Экспериментируйте с положением стоп, чтобы найти оптимальную стойку относительно грифа
      - При дискомфорте в пояснице снизьте вес и проверьте технику
