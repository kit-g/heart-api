  Single Leg Bridge:
    name: Ягодичный мост на одной ноге
    instructions: |
      ## Обзор
      Ягодичный мост на одной ноге — унилатеральное упражнение с собственным весом, которое в первую очередь нагружает ягодичные мышцы и бицепс бедра. Оно также задействует мышцы кора и стабилизаторы таза: работа на одной ноге развивает силу ягодичных, устраняет дисбалансы и улучшает стабильность тазобедренных суставов.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину, колени согнуты, стопы полностью на полу
      - Поставьте стопы на ширине таза ближе к ягодицам
      - Вытяните одну ногу прямо, держа её на одной линии с бедром
      - Руки держите вдоль тела на полу
      - Напрягите мышцы кора на протяжении всего упражнения

      ### 2. Движение
      1. Оттолкнитесь пяткой опорной ноги и поднимите таз вверх
      2. Поднимайте таз, пока тело не образует прямую линию от плеч до коленей
      3. Держите вытянутую ногу прямой и на одной линии с рабочим бедром
      4. Сильно напрягите ягодичную мышцу в верхней точке движения
      5. Медленно и подконтрольно опустите таз обратно
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Вдыхайте, опуская таз
      - Выдыхайте, поднимая таз вверх

      ### 4. Советы
      - Сосредоточьтесь на напряжении ягодичной мышцы в верхней точке, а не на прогибе в спине
      - Держите таз ровно на протяжении всего движения
      - Отталкивайтесь пяткой, а не носком
      - Держите вытянутую ногу прямой и в напряжении
      - Контролируйте и фазу подъёма, и фазу опускания

      ### 5. Частые ошибки
      - Переразгибание поясницы в верхней точке вместо работы ягодичных
      - Разворот или перекос таза в одну сторону
      - Неполное разгибание тазобедренных суставов в верхней точке
      - Отталкивание носком вместо пятки
      - Сгибание вытянутой ноги во время движения
      - Слишком быстрый темп с потерей контроля

      ### 6. Безопасность и модификации
      - Освойте обычный ягодичный мост, прежде чем переходить на одну ногу
      - Положите ладони на таз, чтобы контролировать его ровное положение
      - Уменьшите амплитуду при дискомфорте в пояснице
      - Продвинутый вариант: поставьте опорную ногу на скамью или добавьте паузу в верхней точке
