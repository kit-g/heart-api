  Shrug (Barbell):
    name: Шраги (штанга)
    instructions: |
      ## Обзор
      Шраги со штангой — изолирующее упражнение, нацеленное в первую очередь на верхнюю часть трапеций. Оно также задействует мышцу, поднимающую лопатку, и ромбовидные мышцы; штанга позволяет работать с большими весами для построения массивных, мощных трапеций и укрепления стабильности плечевого пояса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте со штангой в руках, стопы на ширине таза
      - Возьмитесь за гриф чуть шире плеч, ладони направлены к телу
      - Опустите гриф на вытянутых руках перед бёдрами
      - Держите руки прямыми с лёгким сгибом в локтях
      - Стойте ровно, грудь вперёд, мышцы кора напряжены

      ### 2. Движение
      1. Поднимите плечи строго вверх к ушам
      2. Держите руки прямыми на протяжении всего движения
      3. Поднимайте плечи как можно выше, концентрируясь на трапециях
      4. Сделайте паузу и напрягите трапеции в верхней точке
      5. Медленно опустите плечи в исходное положение
      6. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая плечи вверх
      - Вдыхайте, опуская плечи вниз

      ### 4. Советы
      - Поднимайте плечи строго вверх, не вращая ими
      - Держите руки прямыми на протяжении всего движения
      - Сильно напрягайте трапеции в верхней точке каждого повторения
      - Не используйте инерцию и не дёргайте вес
      - Штанга позволяет нагружать трапеции большим весом

      ### 5. Частые ошибки
      - Вращение плечами вместо подъёма строго вверх
      - Сгибание локтей, превращающее упражнение в тягу
      - Использование инерции или рывков
      - Неполная амплитуда движения
      - Подъём плеч вперёд или назад вместо строго вверх
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Начинайте с умеренного веса, чтобы освоить подъём строго вверх
      - Используйте лямки, если хват ограничивает вес
      - Для разнообразия выполняйте шраги со штангой за спиной
      - При дискомфорте в шее уменьшите вес и следите за техникой
