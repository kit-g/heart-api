  Russian Twist:
    name: Русский твист
    instructions: |
      ## Обзор
      Русский твист — динамическое ротационное упражнение на кор, которое в первую очередь нагружает косые мышцы живота и поперечную мышцу живота. В работу также включаются прямая мышца живота и сгибатели бедра в роли стабилизаторов, что делает упражнение эффективным для развития ротационной силы и стабильности кора.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на коврик, согните колени и поставьте стопы на пол
      - Слегка отклонитесь назад, напрягая мышцы кора, так чтобы корпус и бёдра образовали форму буквы «V»
      - Для усложнения слегка оторвите стопы от пола или оставьте их на полу
      - Сцепите руки в замок перед грудью
      - Держите спину прямой, а мышцы кора напряжёнными на протяжении всего упражнения

      ### 2. Движение
      1. Поверните корпус вправо, опуская руки к полу рядом с бедром
      2. Держите таз направленным вперёд, пока поворачивается верхняя часть тела
      3. Сделайте короткую паузу, когда руки коснутся пола или приблизятся к нему
      4. Вернитесь через центр и повернитесь в противоположную сторону
      5. Опустите руки к полу рядом с левым бедром
      6. Продолжайте чередовать стороны в контролируемом, ритмичном темпе нужное количество повторений

      ### 3. Дыхание
      - Выдыхайте при повороте в каждую сторону
      - Вдыхайте, проходя через центр

      ### 4. Советы
      - Начинайте вращение от мышц кора, а не от рук
      - Держите грудь приподнятой, а спину прямой на протяжении всего упражнения
      - Сохраняйте постоянный угол наклона назад, не заваливаясь вперёд
      - Двигайтесь подконтрольно, а не быстро — так упражнение эффективнее
      - Держите таз стабильным и направленным вперёд

      ### 5. Частые ошибки
      - Поворот таза вместе с корпусом вместо удержания его стабильным
      - Округление спины и заваливание вперёд
      - Слишком быстрый темп и использование инерции вместо контроля
      - Движение только руками вместо поворота всего корпуса
      - Задержка дыхания во время движения
      - Слишком сильный наклон назад, который может перегрузить поясницу

      ### 6. Безопасность и модификации
      - Новички могут держать стопы на полу для большей устойчивости
      - Продвинутый вариант: возьмите блин, гантель или медбол для дополнительного сопротивления
      - Уменьшите амплитуду, если чувствуете дискомфорт в пояснице
      - Прогрессируйте, поднимая стопы выше или добавляя паузу в каждой стороне
