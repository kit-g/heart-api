  Pull Up (Band):
    name: Подтягивания (лента)
    instructions: |
      ## Обзор
      Подтягивания с лентой — облегчённый вариант подтягиваний, который в первую очередь нагружает широчайшие мышцы спины с поддержкой ленты. В работу также включаются ромбовидные мышцы, средняя часть трапеций и бицепсы; лента даёт переменную помощь на протяжении движения и помогает набрать силу для подтягиваний без поддержки.

      ## Техника выполнения
      ### 1. Исходное положение
      - Перекиньте ленту через перекладину
      - Протяните один конец через другой, чтобы закрепить ленту на перекладине
      - Возьмитесь за перекладину прямым хватом, руки чуть шире плеч
      - Поставьте одно или оба колена либо стопы в нижнюю петлю ленты
      - Повисните на полностью выпрямленных руках, плечи в тонусе

      ### 2. Движение
      1. Подтянитесь, уводя локти вниз и назад
      2. Лента помогает сильнее в нижней части движения и меньше в верхней
      3. Продолжайте, пока подбородок не окажется выше перекладины
      4. Держите мышцы кора в напряжении, движение — контролируемым
      5. Медленно и подконтрольно опуститесь в исходное положение
      6. Повторите нужное количество повторений в контролируемом темпе

      ### 3. Дыхание
      - Выдыхайте, когда подтягиваетесь вверх
      - Вдыхайте, когда опускаетесь вниз

      ### 4. Советы
      - Начинайте с более толстой ленты для большей помощи
      - Постепенно переходите на более тонкие ленты по мере роста силы
      - Сосредоточьтесь на тяге мышцами спины, а не только руками
      - Держите плечи опущенными и отведёнными назад
      - Контролируйте и подъём, и опускание

      ### 5. Частые ошибки
      - Лента с чрезмерной помощью
      - Неполная амплитуда движения
      - Подъём плеч к ушам
      - Использование инерции или киппинга
      - Отсутствие постепенного перехода на более лёгкие ленты
      - Тяга только руками без включения спины

      ### 6. Безопасность и модификации
      - Начинайте с тугой ленты и постепенно переходите на более лёгкие
      - Для максимальной помощи ставьте в ленту обе стопы
      - По мере роста силы используйте одну стопу для умеренной помощи
      - Сочетайте подтягивания с лентой и негативные подтягивания для более быстрого прогресса
