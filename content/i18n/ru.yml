  Cable Pull Through:
    name: Тяга блока между ног
    instructions: |
      ## Обзор
      Тяга блока между ног — это упражнение на наклон через тазобедренные суставы, которое в первую очередь нагружает ягодичные мышцы и бицепс бедра. Оно также задействует поясницу и мышцы кора: блок обеспечивает постоянное натяжение на протяжении всего движения и одновременно учит правильной механике тазового наклона.

      ## Техника выполнения
      ### 1. Исходное положение
      - Закрепите канатную рукоять на нижнем блоке
      - Встаньте спиной к блоку, ноги на ширине плеч
      - Потянитесь между ног и возьмитесь за канат обеими руками
      - Сделайте шаг вперёд, чтобы создать натяжение троса
      - Держите грудь расправленной, мышцы кора напряжёнными

      ### 2. Движение
      1. Выполните наклон, отводя таз назад
      2. Позвольте тросу увести руки между ног
      3. Держите спину ровной, колени слегка согнутыми
      4. Продолжайте, пока не почувствуете растяжение задней поверхности бедра
      5. Мощно подайте таз вперёд, возвращаясь в положение стоя
      6. Сильно сожмите ягодицы в верхней точке, затем повторите

      ### 3. Дыхание
      - Вдох при наклоне вперёд
      - Выдох при подаче таза вперёд

      ### 4. Советы
      - Сосредоточьтесь на наклоне через тазобедренные суставы, а не на приседании
      - Вставая, давите через пятки
      - Сильно сжимайте ягодицы в верхней точке каждого повторения
      - Сохраняйте постоянное натяжение троса на протяжении всего движения
      - Держите нейтральное положение позвоночника и ровную спину

      ### 5. Частые ошибки
      - Приседание вместо наклона через тазобедренные суставы
      - Округление спины во время движения
      - Недостаточное отведение таза назад
      - Слишком большой вес в ущерб технике
      - Неполное разгибание таза в верхней точке
      - Заваливание коленей внутрь

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить паттерн тазового наклона
      - Держите колени слегка согнутыми на протяжении всего движения
      - Используйте это упражнение, чтобы освоить правильную механику становой тяги
      - Усложнённый вариант: выполняйте тягу блока между ног на одной ноге
    validated: false
    source_digest: 6a9d6430dccd
  Calf Press on Leg Press:
    name: Жим носками в тренажёре для жима ногами
    instructions: |
      ## Обзор
      Жим носками в тренажёре для жима ногами — это изолирующее упражнение, которое в первую очередь нагружает икроножную и камбаловидную мышцы икр. Тренажёр обеспечивает стабильное сопротивление, позволяя работать с большим весом и полной амплитудой в голеностопном суставе.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для жима ногами, плотно прижав спину к спинке
      - Поставьте на нижний край платформы только подушечки стоп
      - Пятки свисают, ноги полностью выпрямлены
      - Снимите страховочные упоры
      - Держите колени выпрямленными, но не блокируйте их до конца

      ### 2. Движение
      1. Опустите платформу, сгибая голеностопы и опуская пятки
      2. Позвольте икрам полностью растянуться в нижней точке
      3. Сделайте короткую паузу в положении растяжения
      4. Надавите подушечками стоп, разгибая голеностопы
      5. Поднимите пятки как можно выше
      6. Сильно сожмите икры в верхней точке, затем повторите

      ### 3. Дыхание
      - Вдох при опускании пяток
      - Выдох при подъёме на носки

      ### 4. Советы
      - Держите ноги прямыми, чтобы изолировать икры
      - Работайте в полной амплитуде — от глубокого растяжения до максимального сокращения
      - Сосредоточьтесь на сжатии икр в верхней точке
      - Контролируйте вес в обеих фазах движения
      - Держите мышцы кора напряжёнными для стабильности

      ### 5. Частые ошибки
      - Сгибание коленей во время движения
      - Неполная амплитуда в верхней или нижней точке
      - Пружинящие движения в нижней точке вместо контролируемого растяжения
      - Слишком большой вес в ущерб технике
      - Слишком быстрый темп повторений
      - Отсутствие сжатия в точке пикового сокращения

      ### 6. Безопасность и модификации
      - Начинайте с умеренного веса, чтобы освоить полную амплитуду
      - Меняйте положение стоп (нейтральное, носки внутрь, носки наружу) для всестороннего развития икр
      - Усложнённый вариант: выполняйте жим носками одной ногой
      - Для повышения интенсивности задерживайтесь на 2–3 секунды в точке пикового сокращения
    validated: false
    source_digest: 1ceba47a5bb8
  Calf Press on Seated Leg Press:
    name: Жим носками в тренажёре для жима ногами сидя
    instructions: |
      ## Обзор
      Жим носками в тренажёре для жима ногами сидя — это изолирующее упражнение, которое в первую очередь нагружает икроножную и камбаловидную мышцы икр. Тренажёр для жима ногами сидя обеспечивает стабильное сопротивление под другим углом: из-за положения сидя с согнутыми коленями акцент смещается на камбаловидную мышцу.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для жима ногами сидя, плотно прижав спину к спинке
      - Поставьте на нижний край платформы только подушечки стоп
      - Пятки свисают, колени согнуты под углом 90 градусов
      - Снимите страховочные упоры, если они есть
      - Держите колени неподвижными на протяжении всего движения

      ### 2. Движение
      1. Опустите платформу, сгибая голеностопы и опуская пятки
      2. Позвольте икрам полностью растянуться в нижней точке
      3. Сделайте короткую паузу в положении растяжения
      4. Надавите подушечками стоп, разгибая голеностопы
      5. Поднимите пятки как можно выше
      6. Сильно сожмите икры в верхней точке, затем повторите

      ### 3. Дыхание
      - Вдох при опускании пяток
      - Выдох при подъёме на носки

      ### 4. Советы
      - Держите колени согнутыми и неподвижными на протяжении всего движения
      - Положение сидя акцентирует нагрузку на камбаловидной мышце
      - Работайте в полной амплитуде — от глубокого растяжения до максимального сокращения
      - Сосредоточьтесь на сжатии икр в верхней точке
      - Контролируйте вес в обеих фазах движения

      ### 5. Частые ошибки
      - Разгибание или движение коленей во время выполнения
      - Неполная амплитуда в верхней или нижней точке
      - Пружинящие движения в нижней точке вместо контролируемого растяжения
      - Слишком большой вес в ущерб технике
      - Слишком быстрый темп повторений
      - Отсутствие сжатия в точке пикового сокращения

      ### 6. Безопасность и модификации
      - Начинайте с умеренного веса, чтобы освоить полную амплитуду
      - Меняйте положение стоп (нейтральное, носки внутрь, носки наружу) для всестороннего развития икр
      - Сочетайте с подъёмами на носки стоя для полноценной тренировки икр
      - Усложнённый вариант: задерживайтесь на 2–3 секунды в точке пикового сокращения
