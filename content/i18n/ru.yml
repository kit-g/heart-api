  Upright Row (Barbell):
    name: Тяга к подбородку (штанга)
    instructions: |
      ## Обзор
      Тяга штанги к подбородку — базовое тяговое упражнение, нацеленное в первую очередь на средние дельты и верхнюю часть трапеций. В работу также включаются бицепсы, предплечья и средняя часть трапеций; вертикальная тяга развивает силу плеч и верхней части спины.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, держите штангу прямым хватом
      - Расположите руки чуть уже ширины плеч
      - Дайте штанге повиснуть на прямых руках перед бёдрами
      - Держите плечи отведёнными назад, мышцы кора — в напряжении
      - Сохраняйте вертикальное положение корпуса на протяжении всего упражнения

      ### 2. Движение
      1. Потяните штангу вверх вдоль тела, поднимая локти
      2. Ведите движение локтями, держа их выше запястий
      3. Продолжайте тянуть, пока гриф не дойдёт до верха груди или уровня подбородка
      4. Держите гриф близко к телу на протяжении всего движения
      5. Сделайте короткую паузу в верхней точке
      6. Медленно и подконтрольно опустите штангу в исходное положение

      ### 3. Дыхание
      - Выдыхайте, поднимая штангу
      - Вдыхайте, опуская штангу вниз

      ### 4. Советы
      - Ведите движение локтями, а не кистями
      - Держите гриф близко к телу на протяжении всего движения
      - Не поднимайте плечи (не делайте шраги) в верхней точке
      - Контролируйте и подъём, и опускание
      - Используйте хват средней ширины, чтобы поберечь плечи

      ### 5. Частые ошибки
      - Слишком высокая тяга, перегружающая плечи
      - Опускание локтей ниже запястий
      - Использование инерции и раскачивание корпуса
      - Отклонение корпуса назад во время тяги
      - Слишком широкий хват, который может привести к импинджменту плеча
      - Слишком быстрый темп и потеря контроля

      ### 6. Безопасность и модификации
      - Используйте хват средней ширины, чтобы избежать дискомфорта в плечах
      - Останавливайтесь на уровне плеч, если чувствуете боль в плечах
      - Используйте EZ-гриф, если прямой гриф вызывает дискомфорт в запястьях
      - Усложнённый вариант: выполняйте с гантелями для независимой работы рук
