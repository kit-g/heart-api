  Pistol Squat:
    name: Приседания «пистолетик»
    instructions: |
      ## Обзор
      Приседания «пистолетик» — продвинутое унилатеральное упражнение для нижней части тела, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и бицепс бедра. Оно также задействует мышцы кора, сгибатели бедра и стабилизаторы равновесия: приседание на одной ноге в полную глубину развивает исключительную силу ног, мобильность и равновесие.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте на одну ногу, вторую вытяните прямо перед собой
      - Держите грудь расправленной, мышцы кора напряжёнными, руки вытяните вперёд для равновесия
      - Сохраняйте правильную осанку и смотрите в точку перед собой

      ### 2. Движение
      1. Опускайтесь, сгибая колено и тазобедренный сустав опорной ноги
      2. Держите вытянутую ногу прямой и параллельной полу
      3. Продолжайте опускаться как можно ниже, сохраняя равновесие
      4. Держите пятку на полу, а грудь расправленной
      5. Оттолкнитесь пяткой и вернитесь в положение стоя
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Вдыхайте, опускаясь вниз
      - Выдыхайте, поднимаясь в положение стоя

      ### 4. Советы
      - Это упражнение требует значительной силы, мобильности и равновесия
      - Держите грудь расправленной, а мышцы кора напряжёнными на протяжении всего упражнения
      - Вытянутая нога должна оставаться прямой и не касаться пола
      - Сосредоточьтесь на контролируемом движении в обеих фазах
      - Используйте руки как противовес

      ### 5. Частые ошибки
      - Недостаточная глубина из-за ограничений мобильности
      - Заваливание колена внутрь
      - Потеря равновесия и опускание вытянутой ноги на пол
      - Округление спины или чрезмерный наклон вперёд
      - Сгибание вытянутой ноги
      - Попытка выполнять «пистолетик» без достаточной базовой силы

      ### 6. Безопасность и модификации
      - Подводитесь к «пистолетику» сначала через варианты с поддержкой
      - Держитесь за опору для помощи с равновесием
      - Выполняйте «пистолетик» на тумбу (садясь назад на тумбу)
      - Начните с «пистолетика» на возвышении (стоя на ступеньке)
      - При дискомфорте в коленях сначала улучшите мобильность, прежде чем прогрессировать
