  Seated Leg Press (Machine):
    name: Жим ногами сидя (тренажёр)
    instructions: |
      ## Обзор
      Жим ногами сидя — базовое упражнение для нижней части тела, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и бицепс бедра. Тренажёр с более вертикальной спинкой, чем у классического жима ногами, обеспечивает стабильное сопротивление при сниженной нагрузке на поясницу.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для жима ногами сидя, плотно прижав спину к спинке
      - Поставьте ноги на платформу на ширине плеч
      - Стопы держите полностью на платформе, носки слегка разведены наружу
      - Снимите платформу с предохранительных упоров, если они есть
      - Держите мышцы кора напряжёнными, а руки на рукоятках

      ### 2. Движение
      1. Выжмите платформу вперёд, разгибая ноги
      2. Продолжайте до полного выпрямления ног, не выключая колени
      3. Сделайте короткую паузу в точке выпрямления
      4. Медленно сгибая колени, верните платформу в исходное положение
      5. Продолжайте, пока колени не согнутся примерно до 90 градусов
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, выжимая платформу вперёд
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите спину и таз плотно прижатыми к спинке
      - Давите всей стопой, а не только носками
      - Не выпрямляйте колени полностью в точке выпрямления
      - Следите, чтобы колени двигались в одной плоскости с носками
      - Сохраняйте постоянное напряжение на протяжении всего движения

      ### 5. Частые ошибки
      - Отрыв ягодиц или поясницы от спинки
      - Полное выключение коленей в точке выпрямления
      - Заваливание коленей внутрь
      - Недостаточная глубина (менее 90 градусов)
      - Слишком большой вес в ущерб технике
