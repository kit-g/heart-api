  Hammer Curl (Cable):
    name: Сгибания «молоток» (блок)
    instructions: |
      ## Обзор
      Сгибания «молоток» на блоке — изолирующее упражнение, которое в первую очередь нагружает плечевую и плечелучевую мышцы за счёт постоянного натяжения троса. В работу также включается двуглавая мышца плеча; нейтральный хват на канатной рукояти акцентирует развитие предплечий и внешней части бицепса на протяжении всего движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте лицом к нижнему блоку, ноги на ширине таза
      - Прикрепите канатную рукоять к нижнему блоку
      - Возьмитесь за концы каната ладонями друг к другу (нейтральный хват)
      - Сделайте небольшой шаг назад, чтобы создать натяжение троса
      - Держите локти прижатыми к корпусу и сохраняйте прямую осанку

      ### 2. Движение
      1. Поднимите канат вверх, сгибая руки в локтях и сохраняя ладони обращёнными друг к другу
      2. Держите плечи неподвижными и прижатыми к корпусу
      3. Продолжайте подъём, пока кисти не окажутся на уровне плеч
      4. Сделайте паузу и дополнительно напрягите мышцы в верхней точке
      5. Медленно и подконтрольно опустите канат в исходное положение
      6. Остановитесь чуть раньше, чем плитки грузового стека соприкоснутся, чтобы сохранить постоянное натяжение, и повторите

      ### 3. Дыхание
      - Выдыхайте, поднимая канат вверх
      - Вдыхайте, опуская канат вниз

      ### 4. Советы
      - Сохраняйте нейтральный хват на протяжении всего движения
      - Держите локти прижатыми к корпусу от начала до конца
      - Не отклоняйтесь назад и не поднимайте вес за счёт инерции
      - Поддерживайте постоянное натяжение, не давая грузовому стеку опускаться до конца
      - Сосредоточьтесь на пиковом сокращении в верхней точке каждого повторения

      ### 5. Частые ошибки
      - Вращение запястий вместо удержания нейтрального хвата
      - Уход локтей вперёд во время сгибания
      - Полное опускание грузового стека между повторениями
      - Раскачивание корпуса или подъём веса за счёт инерции
      - Отсутствие постоянного натяжения троса
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить нейтральный хват при постоянном натяжении
      - Попробуйте вариант одной рукой для проработки каждой стороны отдельно
      - Усложнённый вариант: выполняйте с медленной негативной фазой 3–5 секунд
      - Используйте разную высоту блока (нижний, средний, верхний) для смещения акцента нагрузки
