      Разгибания руки назад на блоке — изолирующее упражнение, которое в первую очередь нагружает трицепс, особенно его длинную головку. Плечи и мышцы кора работают как стабилизаторы; постоянное натяжение на протяжении всего движения обеспечивает эффективное развитие трицепсов.

