  Side Bend (Cable):
    name: Наклоны в сторону (блок)
    instructions: |
      ## Обзор
      Наклоны в сторону на блоке — упражнение на кор с сопротивлением, которое в первую очередь нагружает косые мышцы живота и поперечную мышцу живота. В работу также включаются квадратная мышца поясницы и разгибатели спины в роли стабилизаторов; постоянное натяжение на протяжении всего движения помогает развивать силу боковых мышц кора.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте боком к нижнему блоку, ноги на ширине плеч
      - Возьмите рукоять рукой, ближней к тренажёру
      - Слегка отойдите в сторону, чтобы создать натяжение троса
      - Свободную руку положите за голову или на пояс
      - Стойте прямо, мышцы кора напряжены, плечи на одном уровне

      ### 2. Движение
      1. Медленно наклонитесь в сторону от блока, сокращая косые мышцы противоположной стороны
      2. Держите таз стабильным и направленным вперёд на протяжении всего движения
      3. Наклоняйтесь вбок настолько, насколько комфортно, сохраняя контроль
      4. Сделайте короткую паузу в конечной точке движения
      5. Подконтрольно вернитесь в исходное вертикальное положение, сопротивляясь тяге троса
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Выдыхайте, наклоняясь в сторону от блока
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Сосредоточьтесь на чистом боковом наклоне без скручивания и наклона вперёд
      - Держите таз и плечи направленными вперёд на протяжении всего упражнения
      - Двигайтесь медленно и подконтрольно, чтобы максимально нагрузить косые мышцы
      - Не наклоняйтесь в сторону блока — это снижает эффективность
      - Сохраняйте натяжение троса на всей амплитуде движения

      ### 5. Частые ошибки
      - Слишком большой вес в ущерб технике
      - Скручивание или вращение вместо чистого бокового наклона
      - Смещение таза из стороны в сторону
      - Наклон вперёд или назад вместо строго в сторону
      - Слишком быстрый темп и использование инерции
      - Отсутствие контроля при возвращении в исходное положение

      ### 6. Безопасность и модификации
      - Начните с лёгкого веса, чтобы освоить схему движения
      - Новички могут выполнять упражнение без веса, отрабатывая правильную технику
      - Продвинутый вариант: пауза 2–3 секунды в точке пикового сокращения
      - При дискомфорте в пояснице уменьшите вес и проверьте технику
