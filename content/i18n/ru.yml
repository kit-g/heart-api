  Battle Ropes:
    name: Боевые канаты
    instructions: |
      ## Обзор
      Боевые канаты — высокоинтенсивное кардио- и силовое упражнение, нацеленное на плечи, руки, мышцы кора и ноги. Создавая волны и различные паттерны толстыми тяжёлыми канатами, вы развиваете мощность, выносливость, силу хвата и получаете эффективную метаболическую нагрузку на всё тело.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте лицом к точке крепления, ноги на ширине плеч
      - Возьмите по концу каната в каждую руку
      - Слегка согните колени, мышцы кора напряжены
      - Держите спину прямой, грудь поднятой
      - Встаньте на таком расстоянии, чтобы канаты слегка провисали

      ### 2. Движение
      1. Выберите паттерн (поочерёдные волны, двойные волны, удары и т.д.)
      2. Создавайте мощные ритмичные волны движениями рук
      3. Поддерживайте движение в течение заданного интервала
      4. Держите мышцы кора напряжёнными и работайте всем телом
      5. Генерируйте волны непрерывно, без остановок
      6. Продолжайте нужный рабочий интервал (обычно 20-60 секунд)

      ### 3. Дыхание
      - Дышите равномерно и ритмично на протяжении всей работы
      - Выдыхайте с усилием в интенсивных фазах
      - Не задерживайте дыхание

      ### 4. Советы
      - Напрягайте мышцы кора, чтобы защитить поясницу
      - Работайте тазом и ногами, а не только руками
      - Начинайте с коротких интервалов и постепенно наращивайте выносливость
      - Разные паттерны волн нагружают разные мышечные группы
      - Отличный вариант для высокоинтенсивных интервальных тренировок

      ### 5. Частые ошибки
      - Работа только руками вместо всего тела
      - Слишком прямая стойка без атлетической позиции
      - Неравномерные, сбивчивые волны
      - Задержка дыхания во время работы
      - Слишком длинные интервалы на старте
      - Плохая осанка с округлённой спиной

      ### 6. Безопасность и модификации
      - Начинайте с более лёгких канатов или коротких интервалов
      - Снижайте интенсивность, создавая волны меньшей амплитуды
      - Чередуйте разные паттерны волн
      - Полноценно отдыхайте между интервалами
    validated: false
    source_digest: 39ab652bdaaf
  Climbing:
    name: Скалолазание
    instructions: |
      ## Обзор
      Скалолазание — кардио- и силовая активность на всё тело, нацеленная на спину, руки, мышцы кора и ноги. Будь то скалы, скалодром или лазание по канату, оно развивает силу хвата, мышечную выносливость, умение решать задачи на маршруте и выносливость сердечно-сосудистой системы.

      ## Техника выполнения
      ### 1. Исходное положение
      - Подойдите к стене или рельефу с соответствующим страховочным снаряжением
      - Оцените маршрут перед началом
      - Наденьте скальные туфли и при необходимости используйте магнезию
      - Убедитесь в правильной организации страховки, если она применяется
      - Начинайте из устойчивого положения

      ### 2. Движение
      1. Спланируйте маршрут и определите зацепки для рук и ног
      2. Толкайтесь ногами вверх, а не тянитесь только руками
      3. По возможности сохраняйте три точки опоры
      4. Эффективно переносите вес между зацепками
      5. Распределяйте силы, чтобы сохранить выносливость на весь маршрут
      6. Продолжайте лазание нужное время или до конца маршрута

      ### 3. Дыхание
      - Дышите равномерно на протяжении всего подъёма
      - При необходимости делайте короткие паузы на надёжных зацепках
      - Не задерживайте дыхание на сложных участках

      ### 4. Советы
      - Толкайтесь ногами, а не только тяните руками
      - Держите таз ближе к стене для лучшего равновесия
      - Смотрите вперёд, планируя несколько следующих движений
      - Отдыхайте на удобных зацепках, когда находите их
      - Ставьте технику выше чистой силы

      ### 5. Частые ошибки
      - Слишком сильный хват и лишний расход сил
      - Чрезмерная опора на руки вместо ног
      - Отсутствие планирования и «тупики» на маршруте
      - Слишком быстрый темп и преждевременная усталость
      - Неправильное положение тела далеко от стены
      - Отказ от отдыха на удобных зацепках

      ### 6. Безопасность и модификации
      - Всегда лазайте с надлежащим страховочным снаряжением и под присмотром
      - Начинайте с простых маршрутов и усложняйте постепенно
      - Новичкам подойдёт боулдеринг (малая высота, страховочные маты)
      - Учитесь правильной технике у опытных скалолазов или инструкторов
    validated: false
