  Reverse Crunch:
    name: Обратные скручивания
    instructions: |
      ## Обзор
      Обратные скручивания — упражнение на кор с собственным весом, которое в первую очередь нагружает нижнюю часть прямой мышцы живота. В качестве стабилизаторов также работают сгибатели бедра, косые и поперечная мышцы живота; упражнение эффективно развивает нижнюю часть пресса и нагружает шею меньше, чем классические скручивания.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину на коврик, согнув колени под углом 90 градусов
      - Оторвите стопы от пола так, чтобы бёдра были перпендикулярны полу
      - Положите руки вдоль корпуса ладонями вниз для опоры
      - Прижмите поясницу к коврику и напрягите мышцы кора
      - Держите голову и верх спины расслабленными на коврике

      ### 2. Движение
      1. Оторвите таз от коврика, сокращая нижнюю часть пресса
      2. Скручивайте таз к грудной клетке, подтягивая колени к груди
      3. Поднимайте таз за счёт пресса, а не инерции
      4. Ненадолго задержитесь в верхней точке, когда таз полностью поднят
      5. Медленно и подконтрольно опустите таз в исходное положение
      6. Останавливайтесь чуть раньше, чем стопы коснутся пола, чтобы сохранить напряжение, затем повторите

      ### 3. Дыхание
      - Выдыхайте, поднимая таз и скручивая его к грудной клетке
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Сосредоточьтесь на скручивании таза, а не просто на подъёме ног
      - Прижимайте поясницу к коврику на протяжении всего движения
      - Двигайтесь медленно и подконтрольно, чтобы максимально включить пресс
      - Используйте руки только для равновесия, а не для отталкивания
      - Сохраняйте постоянное напряжение пресса, не расслабляясь полностью между повторениями

      ### 5. Частые ошибки
      - Махи ногами за счёт инерции вместо контролируемого сокращения
      - Движение только ногами без отрыва таза от коврика
      - Прогиб поясницы во время движения
      - Слишком быстрый темп в ущерб технике
      - Отталкивание руками вместо работы мышцами кора
      - Полное расслабление между повторениями и потеря напряжения в коре

      ### 6. Безопасность и модификации
      - Новички могут уменьшить амплитуду, не подтягивая колени так близко к груди
      - Подложите ладони под ягодицы для дополнительной поддержки поясницы
      - Продвинутый вариант: зажмите медбол между коленями для дополнительного сопротивления
      - При дискомфорте в пояснице выполняйте движения с меньшей амплитудой и лучшим контролем
