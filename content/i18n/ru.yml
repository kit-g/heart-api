  Seated Row (Cable):
    name: Тяга горизонтального блока
    instructions: |
      ## Обзор
      Тяга горизонтального блока — горизонтальное тяговое упражнение, которое в первую очередь нагружает широчайшие мышцы спины, ромбовидные мышцы и среднюю часть трапеций. В работу также включаются бицепсы и задние дельты; блочный тренажёр обеспечивает постоянное натяжение на протяжении всей тяги для эффективного развития спины.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для горизонтальной тяги, поставив стопы на платформы
      - Возьмитесь за рукоять обеими руками, руки полностью выпрямлены
      - Слегка согните колени, спину держите прямой
      - Сядьте вертикально, грудь поднята, плечи отведены назад
      - Держите мышцы кора в напряжении на протяжении всего движения

      ### 2. Движение
      1. Потяните рукоять к корпусу, уводя локти назад
      2. Держите корпус вертикально, не отклоняйтесь назад чрезмерно
      3. Продолжайте, пока рукоять не окажется у нижней части груди или верха живота
      4. В конечной точке сведите лопатки
      5. Медленно и подконтрольно выпрямите руки в исходное положение
      6. Останавливайтесь чуть раньше, чем грузоблок коснётся упора, чтобы сохранить натяжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, когда тянете рукоять к корпусу
      - Вдыхайте, выпрямляя руки в исходное положение

      ### 4. Советы
      - Держите корпус вертикально с минимальным наклоном
      - Ведите движение локтями, уводя их назад за корпус
      - Сосредоточьтесь на сведении лопаток
      - Сохраняйте постоянное натяжение, не позволяя грузоблоку опускаться до конца
      - Контролируйте вес на всей амплитуде движения

      ### 5. Частые ошибки
      - Чрезмерное отклонение назад и работа за счёт инерции
      - Округление спины во время движения
      - Неполная амплитуда движения
      - Подъём плеч к ушам
      - Опускание грузоблока до упора между повторениями
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Отрегулируйте положение стоп так, чтобы колени оставались слегка согнутыми
      - Пробуйте разные рукояти (широкую, узкую, с нейтральным хватом) для разнообразия
      - Выполняйте тягу одной рукой для односторонней проработки
