  Jumping Jack:
    name: Прыжки с разведением рук и ног
    instructions: |
      ## Обзор
      Прыжки с разведением рук и ног — базовое кардиоупражнение, нацеленное прежде всего на ноги, мышцы кора и плечи. Во время прыжка ноги разводятся в стороны, а руки поднимаются вверх; упражнение развивает выносливость сердечно-сосудистой системы, координацию и отлично подходит для разминки.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги вместе, руки вдоль тела
      - Держите грудь поднятой, мышцы кора напряжёнными, взгляд направлен вперёд
      - Приготовьтесь прыгать, двигая руками и ногами одновременно

      ### 2. Движение
      1. Прыжком расставьте ноги шире плеч
      2. Одновременно поднимите руки через стороны вверх над головой
      3. Следующим прыжком верните ноги вместе, опуская руки
      4. Продолжайте чередовать движения в плавном, ритмичном темпе
      5. Сохраняйте правильную осанку на протяжении всего упражнения
      6. Повторяйте нужное количество повторений или работайте по времени

      ### 3. Дыхание
      - Дышите ритмично и равномерно на протяжении всего упражнения
      - Делайте вдох и выдох с каждым циклом прыжка

      ### 4. Советы
      - Мягко приземляйтесь на подушечки стоп
      - Сохраняйте ровный, контролируемый ритм
      - Это отличное упражнение для разминки
      - Держите мышцы кора напряжёнными
      - Руки и ноги должны двигаться согласованно

      ### 5. Частые ошибки
      - Слишком жёсткое приземление на пятки
      - Руки не поднимаются полностью над головой
      - Слишком высокий темп и потеря координации
      - Приземление на прямые колени
      - Плохая осанка с округлёнными плечами
      - Задержка дыхания

      ### 6. Безопасность и модификации
      - Для низкоударного варианта делайте шаги в стороны вместо прыжков
      - При необходимости уменьшите амплитуду
      - Увеличьте скорость для большей интенсивности
      - Усложнённый вариант: добавьте присед или движение с вытягиванием рук
