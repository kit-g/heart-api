  Clean and Jerk (Barbell):
    name: Взятие на грудь и толчок (штанга)
    instructions: |
      ## Обзор
      Взятие на грудь и толчок — полное тяжелоатлетическое движение, нагружающее всё тело. Оно объединяет взятие на грудь (с пола на плечи) и толчок (с плеч над головой), задействуя ноги, таз, спину, плечи и мышцы кора в одном из самых сложных упражнений на всё тело.

      ## Техника выполнения
      ### 1. Исходное положение
      - Выполните полное взятие на грудь, подняв штангу на плечи
      - Переставьте стопы на ширину плеч или чуть шире
      - Держите локти высоко, гриф лежит на передних дельтах
      - Стойте ровно, мышцы кора напряжены, будьте готовы к подседу

      ### 2. Движение
      1. Выполните взятие на грудь, подняв штангу на плечи
      2. Сделайте подсед, слегка согнув колени и удерживая корпус вертикально
      3. Мощно вытолкните штангу вверх, разгибая ноги
      4. Выжимая штангу над головой, разбросьте ноги в ножницы или расставьте их в стороны
      5. Полностью выпрямите руки, стабилизировав штангу над головой
      6. Вернитесь в стойку, подставив стопы под штангу

      ### 3. Дыхание
      - Дышите во время подготовки и между фазами
      - Задержите дыхание во время подседа и выталкивания
      - Выдохните, когда штанга зафиксирована над головой

      ### 4. Советы
      - Это самое технически сложное тяжелоатлетическое упражнение
      - Подсед должен быть контролируемым и строго вертикальным
      - Выводите штангу над головой за счёт ног, а не только рук
      - Отрабатывайте работу ног в толчке в ножницы или в стойку отдельно
      - Сначала освойте взятие на грудь и толчок по отдельности

      ### 5. Частые ошибки
      - Подсед с наклоном вперёд вместо вертикального
      - Недостаточная работа ног в толчке
      - Жим руками до завершения выталкивания ногами
      - Неправильная траектория грифа в фазе толчка
      - Неполное выпрямление рук над головой
      - Попытка выполнения без технической базы

      ### 6. Безопасность и модификации
      - Требуется серьёзная работа с квалифицированным тренером по тяжёлой атлетике
      - Освойте взятие на грудь и толчок по отдельности, прежде чем объединять их
      - Используйте бамперные блины и тяжелоатлетический помост
      - Повышайте вес очень постепенно
