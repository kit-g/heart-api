  Jump Shrug (Barbell):
    name: Шраги с выпрыгиванием (штанга)
    instructions: |
      ## Обзор
      Шраги с выпрыгиванием со штангой — взрывное вспомогательное упражнение тяжёлой атлетики, нацеленное в первую очередь на трапеции, икры и ягодичные мышцы. Оно учит взрывному тройному разгибанию (голеностопы, колени, таз), необходимому в тяжелоатлетических движениях, одновременно развивая мощность и трапеции.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте со штангой в руках, стопы на ширине таза
      - Гриф на уровне середины бедра, руки прямые
      - Держите грудь вперёд, спину ровной, мышцы кора напряжёнными
      - Возьмитесь за гриф сразу за линией ног
      - Сохраняйте лёгкий сгиб в коленях

      ### 2. Движение
      1. Сделайте небольшой подсед, согнув колени
      2. Взрывно разогните голеностопы, колени и таз, выпрыгивая вверх
      3. Мощно выполните шраг в верхней точке прыжка
      4. Мягко приземлитесь на согнутые колени
      5. Вернитесь в исходное положение
      6. Выполните нужное число взрывных повторений

      ### 3. Дыхание
      - Вдыхайте во время подседа
      - Мощно выдыхайте во время прыжка и шрага

      ### 4. Советы
      - Выполняйте каждое повторение с максимальной взрывной мощностью
      - Шраг должен происходить в момент полного разгибания
      - Держите руки прямыми на протяжении всего движения
      - Это упражнение учит тройному разгибанию для тяжелоатлетических движений
      - Используйте небольшой вес, чтобы сохранять взрывную скорость

      ### 5. Частые ошибки
      - Тяга руками вместо работы ног и шрага
      - Неполное разгибание голеностопов, коленей и таза
      - Слишком глубокий подсед перед прыжком
      - Слишком большой вес и потеря взрывного качества движения
      - Приземление на прямые ноги
      - Отсутствие шрага в верхней точке прыжка

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить взрывное движение
      - Приземляйтесь мягко, чтобы беречь суставы
      - Это вспомогательное упражнение для тяжёлой атлетики
      - Используйте его для развития мощности во взятиях на грудь и рывках
