      - Держите грудь поднятой, мышцы кора напряжёнными, колени слегка согнутыми
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Поднимите мяч над головой, потянувшись вверх
      2. С силой бросьте мяч вертикально вниз в пол
      3. Генерируйте мощность броска всем телом
      4. Сгибайте колени и тазобедренные суставы во время броска
      5. Поймайте или поднимите мяч после отскока
      6. Сразу повторите нужное количество взрывных повторений

      ### 3. Дыхание
      - Вдыхайте, поднимая мяч над головой
      - Мощно выдыхайте, бросая мяч вниз

      ### 4. Советы
      - Работайте всем телом, а не только руками
      - Бросайте с максимальной силой и агрессией
      - Упражнение отлично развивает мощность и снимает стресс
      - Сохраняйте контроль над движением, несмотря на его взрывной характер
      - Используйте мяч, предназначенный для бросков

      ### 5. Частые ошибки
      - Работа только руками вместо всего тела
      - Броски не в полную силу
      - Неконтролируемый отскок мяча
      - Слишком прямая стойка без включения мышц кора
      - Использование мяча, который слишком сильно отскакивает
      - Плохая осанка во время движения

      ### 6. Безопасность и модификации
      - Используйте специальный слэмбол
      - Начинайте с более лёгкого мяча, чтобы освоить взрывное движение
      - Выполняйте упражнение на покрытии, выдерживающем удары
      - Меняйте темп от взрывного до контролируемого в зависимости от целей
