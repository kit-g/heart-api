      - Чрезмерное сгибание коленей, превращающее упражнение в румынскую тягу
      - Недостаточное отведение таза назад
      - Опускание гантелей слишком глубоко, дальше точки растяжения бицепса бедра
      - Слишком большой вес в ущерб технике
      - Взгляд вверх вместо нейтрального положения шеи

      ### 6. Безопасность и модификации
      - Начинайте с лёгких гантелей, чтобы освоить наклон через тазобедренные суставы с прямыми ногами
      - Если этот вариант ощущается слишком тяжёлым, переходите к нему от румынской тяги
      - Вариант с гантелями позволяет держать снаряд более естественным хватом, чем штанга
