  Front Raise (Band):
    name: Подъёмы перед собой (лента)
    instructions: |
      ## Обзор
      Подъёмы перед собой с лентой — изолирующее упражнение, которое в первую очередь нагружает передние дельты. Оно также задействует верх груди: нарастающее сопротивление ленты помогает развить силу и рельеф передней части плеч.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, поставив ноги на ширине таза и наступив на середину ленты
      - Возьмитесь за оба конца ленты, руки перед бёдрами
      - Держите руки прямыми, с чуть согнутыми локтями
      - Стойте ровно: грудь расправлена, мышцы кора напряжены
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Поднимите обе руки вперёд и вверх перед собой
      2. Держите руки прямыми, лишь слегка сгибая локти
      3. Поднимайте, пока руки не окажутся на уровне плеч или чуть выше
      4. Сделайте короткую паузу в верхней точке
      5. Медленно и подконтрольно опустите руки в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Делайте выдох, поднимая руки
      - Делайте вдох, опуская руки

      ### 4. Советы
      - Сопротивление ленты нарастает по мере подъёма
      - Держите корпус неподвижным и не используйте инерцию
      - Сосредоточьтесь на сокращении передних дельт в верхней точке
