  Lat Pulldown - Close Grip (Cable):
    name: Тяга верхнего блока узким хватом
    instructions: |
      ## Обзор
      Тяга верхнего блока узким хватом — тяговое упражнение, которое в первую очередь нагружает мышцы спины, особенно широчайшие. Узкий хват удерживает локти перед корпусом, за счёт чего в движение активно включаются и бицепсы.

      ## Техника выполнения
      ### 1. Исходное положение
      - Прикрепите рукоять для узкого хвата или возьмитесь за гриф узко
      - Сядьте, зафиксировав бёдра под упорами
      - Возьмитесь за рукоять обеими руками, руки полностью вытянуты над головой
      - Слегка отклонитесь назад и поднимите грудь

      ### 2. Движение
      1. Потяните рукоять вниз к верхней части груди
      2. Уводите локти вниз, к бокам
      3. В нижней точке тяги напрягите широчайшие
      4. Медленно верните рукоять вверх до полного выпрямления рук
      5. Повторите нужное количество повторений в контролируемом темпе

      ### 3. Дыхание
      - Выдыхайте, когда тянете вниз
      - Вдыхайте, возвращаясь вверх

      ### 4. Советы
      - Держите грудь поднятой, а плечи опущенными, подальше от ушей
      - Тяните спиной, используя кисти как крюки
      - Контролируйте возврат, не позволяя весу дёргать руки вверх

      ### 5. Частые ошибки
      - Сильное отклонение назад, превращающее тягу в горизонтальную
      - Использование инерции, чтобы дёрнуть вес вниз
      - Неполное выпрямление рук в верхней точке

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса и добавляйте нагрузку, когда траектория движения станет ровной
      - Усложнённый вариант: сделайте паузу в нижней точке каждого повторения
