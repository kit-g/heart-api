  Bench Press (Barbell):
    name: Жим лёжа (штанга)
    instructions: |
      ## Обзор
      Жим штанги лёжа — базовое упражнение для верхней части тела, нацеленное в первую очередь на большие грудные мышцы. В работу также включаются передние дельты и трицепсы, что делает его одним из самых эффективных упражнений для развития силы груди и жимовой мощности верха тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на горизонтальную скамью, стопы плотно прижаты к полу
      - Расположитесь так, чтобы глаза были прямо под грифом
      - Возьмитесь за гриф хватом чуть шире плеч
      - Снимите гриф со стоек и держите его на полностью выпрямленных руках над грудью
      - Сведите лопатки и прижмите их к скамье

      ### 2. Движение
      1. Медленно опустите гриф к средней или нижней части груди
      2. Держите локти под углом около 45 градусов к корпусу
      3. Легко коснитесь грифом груди
      4. Сделайте короткую паузу в нижней точке
      5. Выжмите гриф вверх, выпрямляя руки
      6. Полностью выпрямите локти в верхней точке и повторяйте в контролируемом темпе

      ### 3. Дыхание
      - Вдыхайте, опуская гриф к груди
      - Выдыхайте, выжимая гриф вверх

      ### 4. Советы
      - Держите лопатки сведёнными на протяжении всего движения
      - Сохраняйте естественный прогиб в пояснице
      - Держите стопы прижатыми к полу и упирайтесь ими для стабильности
      - Контролируйте опускание и не отбивайте гриф от груди
      - Держите запястья прямыми, на одной линии с предплечьями

      ### 5. Частые ошибки
      - Отбив грифа от груди вместо контролируемого касания и жима
      - Чрезмерное разведение локтей в стороны
      - Отрыв таза от скамьи во время жима
      - Неполная амплитуда движения
      - Слишком большой вес в ущерб технике
      - Потеря сведения лопаток

      ### 6. Безопасность и модификации
      - Всегда работайте со страхующим при больших весах
      - Начните с лёгкого веса, чтобы отработать правильную технику
      - Используйте более широкий или узкий хват в зависимости от комфорта и целей
      - Усложнённый вариант: добавьте цепи или ленты для переменного сопротивления
