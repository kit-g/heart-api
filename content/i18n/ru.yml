  Deadlift (Band):
    name: Становая тяга (лента)
    instructions: |
      ## Обзор
      Становая тяга с лентой — это базовое упражнение с сопротивлением ленты, которое в первую очередь нагружает ягодичные мышцы, бицепс бедра и разгибатели позвоночника. Оно также задействует квадрицепсы, широчайшие и мышцы кора: нарастающее сопротивление ленты позволяет учить правильную механику становой тяги с меньшей нагрузкой.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте ногами на середину ленты, стопы на ширине таза
      - Возьмитесь за оба конца ленты, руки чуть шире ног
      - Наклонитесь через тазобедренные суставы и согните колени, чтобы дотянуться до ленты
      - Держите грудь расправленной, спину ровной, плечи чуть впереди кистей
      - Перед подъёмом напрягите мышцы кора и широчайшие

      ### 2. Движение
      1. Давите через пятки и одновременно разгибайте тазобедренные и коленные суставы
      2. Во время подъёма держите ленту близко к телу
      3. Полностью выпрямитесь, разогнув таз и колени
      4. В верхней точке держите плечи отведёнными назад, грудь расправленной
      5. Опускайтесь, отводя таз назад и сгибая колени
      6. Подконтрольно вернитесь в исходное положение и повторите

      ### 3. Дыхание
      - Перед подъёмом сделайте глубокий вдох и напрягите мышцы кора
      - Задержите дыхание во время подъёма
      - Выдохните в верхней точке или при опускании

      ### 4. Советы
      - Держите ленту близко к голеням и бёдрам на протяжении всего движения
      - Вставая, ведите движение грудью
      - Сохраняйте нейтральное положение позвоночника, избегая округления и переразгибания
      - По мере выпрямления сопротивление ленты нарастает
      - Сосредоточьтесь на паттерне наклона через тазобедренные суставы

      ### 5. Частые ошибки
      - Округление поясницы во время подъёма
      - Слишком высокое или слишком низкое положение таза на старте
      - Отведение ленты от тела
      - Неполное разгибание таза в верхней точке
      - Взгляд вверх или вниз вместо нейтрального положения шеи
      - Тяга руками вместо работы ног и таза

      ### 6. Безопасность и модификации
      - Начинайте с более лёгкой ленты, чтобы отработать правильную технику
      - Меняйте положение стоп на ленте, чтобы регулировать сопротивление
      - Используйте этот вариант, чтобы освоить механику становой тяги перед переходом к штанге
      - Усложнённый вариант: возьмите более жёсткую ленту или выполняйте становую тягу с лентой на одной ноге
