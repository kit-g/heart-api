  Hip Abductor (Machine):
    name: Разведения ног (тренажёр)
    instructions: |
      ## Обзор
      Разведения ног в тренажёре — это изолирующее упражнение, которое в первую очередь нагружает среднюю и малую ягодичные мышцы. Оно также задействует напрягатель широкой фасции бедра: направляемая траектория укрепляет наружные мышцы бедра и улучшает стабильность таза.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для разведений ног, плотно прижав спину к спинке
      - Прижмите внешнюю сторону бёдер к мягким упорам
      - Отрегулируйте тренажёр так, чтобы колени были на одной оси с точкой вращения
      - Возьмитесь за рукояти для устойчивости
      - Держите стопы на опорах, мышцы кора напряжёнными

      ### 2. Движение
      1. Разводите ноги в стороны, сокращая наружные мышцы бёдер
      2. Двигайтесь против сопротивления подконтрольно
      3. Продолжайте, пока ноги не разойдутся настолько широко, насколько комфортно
      4. Сделайте паузу и сожмите наружную часть ягодиц в точке максимального разведения
      5. Медленно и подконтрольно верните ноги в исходное положение
      6. Останавливайтесь чуть раньше, чем плитки весового стека коснутся друг друга, чтобы сохранить натяжение, затем повторите

      ### 3. Дыхание
      - Выдох при разведении ног
      - Вдох при возвращении в исходное положение

      ### 4. Советы
      - Работайте наружными мышцами бёдер, а не инерцией
      - Держите спину плотно прижатой к спинке
      - Не вращайте корпус во время движения
      - Контролируйте и фазу разведения, и фазу сведения
      - Сохраняйте постоянное натяжение, не давая плиткам весового стека опускаться до конца

      ### 5. Частые ошибки
      - Работа за счёт инерции и раскачивания ног
      - Отрыв ягодиц от сиденья
      - Вращение корпуса вместо удержания его неподвижным
      - Неполная амплитуда движения
      - Опускание весового стека до упора между повторениями
      - Слишком быстрый темп повторений

      ### 6. Безопасность и модификации
      - Отрегулируйте положение упоров, чтобы колени были выровнены правильно
      - Начинайте с лёгкого веса, чтобы поставить технику
      - Отдавайте приоритет контролируемому движению, а не большому весу
      - Усложнённый вариант: задерживайтесь на 2–3 секунды в точке максимального разведения
