    name: Разгибания на трицепс
    instructions: |
      ## Обзор
      Разгибания на трицепс со штангой — изолирующее упражнение, которое в первую очередь нагружает все три головки трицепса. В работу также включаются плечи и мышцы кора в качестве стабилизаторов; положение над головой обеспечивает максимальное растяжение и сокращение трицепсов на протяжении всего движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине плеч, или сядьте на скамью со спинкой
      - Возьмите штангу узким прямым хватом
      - Выжмите штангу над головой до полного выпрямления рук
      - Держите локти направленными вперёд и близко к голове
      - Напрягите мышцы кора для стабильности

      ### 2. Движение
      1. Опустите штангу за голову, сгибая руки в локтях
      2. Держите плечи неподвижными и вертикальными от начала до конца
      3. Опускайте, пока не почувствуете глубокое растяжение трицепсов
      4. Сделайте короткую паузу в нижней точке
      5. Разогните локти и выжмите штангу в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опуская штангу за голову
      - Выдыхайте, выжимая штангу вверх

      ### 4. Советы
      - Держите плечи неподвижными и вертикальными на протяжении всего движения
      - Держите локти настолько близко друг к другу, насколько комфортно
      - Не прогибайтесь в пояснице во время движения
      - Сосредоточьтесь на растяжении внизу и пиковом сокращении вверху
      - Контролируйте вес по всей амплитуде движения

      ### 5. Частые ошибки
      - Чрезмерное разведение локтей в стороны
      - Движение плечами вместо удержания их неподвижными
      - Чрезмерный прогиб в пояснице
      - Слишком большой вес в ущерб технике
      - Неполная амплитуда движения
      - Наклоны вперёд или назад во время движения

      ### 6. Безопасность и модификации
      - При дискомфорте в запястьях или локтях используйте EZ-гриф
      - Начинайте с лёгкого веса, чтобы освоить положение над головой
      - Выполняйте сидя со спинкой для дополнительной стабильности
      - Усложнённый вариант: выполняйте стоя, чтобы сильнее включить мышцы кора
