      - Возьмите одну гантель обеими руками, обхватив её за один конец
      - Выжмите гантель над головой до полного выпрямления рук
      - Держите локти направленными вперёд и близко к голове
      - Напрягите мышцы кора для устойчивости

      ### 2. Движение
      1. Опустите гантель за голову, сгибая локти
