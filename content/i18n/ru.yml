      - Отрегулируйте валик так, чтобы колени были на одной оси с осью вращения тренажёра
      - Заведите лодыжки за нижний валик
      - Возьмитесь за рукоятки по бокам для устойчивости
      - Держите мышцы кора напряжёнными на протяжении всего упражнения

      ### 2. Движение
      1. Разогните ноги усилием квадрицепсов
      2. Продолжайте до полного выпрямления ног
      3. В точке полного разгибания сделайте паузу и напрягите квадрицепсы
      4. Медленно и подконтрольно опустите вес в исходное положение
      5. Останавливайтесь чуть раньше, чем плитки коснутся стека, чтобы сохранить напряжение
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, разгибая ноги
      - Вдыхайте, опуская вес обратно

      ### 4. Советы
      - Держите спину плотно прижатой к спинке
      - Сосредоточьтесь на напряжении квадрицепсов в точке полного разгибания
      - Контролируйте и фазу разгибания, и фазу опускания
      - Сохраняйте постоянное напряжение, не давая плиткам ложиться на стек
      - Направляйте носки прямо вперёд или слегка вверх

      ### 5. Частые ошибки
      - Отрыв ягодиц от сиденья во время разгибания
      - Использование инерции или раскачивание веса
      - Неполное разгибание коленей в верхней точке
      - Опускание плиток на стек между повторениями
      - Слишком быстрый темп выполнения повторений
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Отрегулируйте сиденье и валик для правильного положения коленей
      - Начните с лёгкого веса, чтобы поставить технику
      - Избегайте этого упражнения при проблемах с коленями; проконсультируйтесь со специалистом
      - Продвинутый вариант: выполняйте по одной ноге за раз или добавьте паузу в точке разгибания
