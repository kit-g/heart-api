      - Слегка согните колени, спину держите прямой
      - Сядьте вертикально, грудь поднята, плечи отведены назад
      - Полностью выпрямите руки, сохраняя натяжение троса

      ### 2. Движение
      1. Потяните рукоять к верхней части груди, уводя локти назад и в стороны
      2. Держите корпус вертикально на протяжении всего движения
      3. Продолжайте, пока рукоять не окажется у верхней части груди
      4. В конечной точке сведите лопатки
      5. Медленно и подконтрольно выпрямите руки в исходное положение
      6. Останавливайтесь чуть раньше, чем грузоблок коснётся упора, чтобы сохранить натяжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, когда тянете рукоять к груди
      - Вдыхайте, выпрямляя руки в исходное положение

      ### 4. Советы
      - Из-за ширины хвата локти будут разведены шире
      - Сосредоточьтесь на движении локтей назад и сведении лопаток
      - Держите корпус вертикально с минимальным наклоном
      - Сохраняйте постоянное натяжение, не позволяя грузоблоку опускаться до конца
      - Контролируйте вес на всей амплитуде движения

      ### 5. Частые ошибки
      - Чрезмерное отклонение назад и работа за счёт инерции
      - Локти разведены недостаточно широко для такого хвата
      - Округление спины во время движения
      - Подъём плеч к ушам
      - Опускание грузоблока до упора между повторениями
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Начинайте с умеренного веса, чтобы привыкнуть к широкому хвату
      - Отрегулируйте положение стоп так, чтобы колени оставались слегка согнутыми
      - При дискомфорте в плечах возьмитесь немного уже
      - Усложнённый вариант: задержитесь на 2-3 секунды в точке пикового сокращения
