  Handstand Push Up:
    name: Отжимания в стойке на руках
    instructions: |
      ## Обзор
      Отжимания в стойке на руках — продвинутое жимовое упражнение с собственным весом, которое в первую очередь нагружает плечи. Оно также задействует трицепсы, верх груди и мышцы кора: перевёрнутое положение создаёт максимальную нагрузку на плечи в вертикальном жиме.

      ## Техника выполнения
      ### 1. Исходное положение
      - Махом выйдите в стойку на руках у стены
      - Поставьте руки чуть шире плеч
      - Держите тело прямой линией от кистей до стоп
      - Напрягите мышцы кора и держите голову в нейтральном положении
      - Сохраняйте равновесие, опираясь на стену

      ### 2. Движение
      1. Опуститесь, сгибая локти
      2. Опускайтесь, пока макушка почти не коснётся пола
      3. Держите локти под углом около 45 градусов к корпусу
      4. Сделайте короткую паузу в нижней точке
      5. Оттолкнитесь ладонями и выпрямите руки
      6. Вернитесь в исходную стойку на руках и повторите

      ### 3. Дыхание
      - Делайте вдох, опускаясь вниз
      - Делайте выдох, выжимая себя вверх

      ### 4. Советы
      - Это продвинутое упражнение, требующее значительной силы
      - Держите мышцы кора напряжёнными, чтобы сохранять прямую линию тела
      - Контролируйте опускание, чтобы максимально включить мышцы
      - Жмите строго вверх, а не от стены
      - Используйте стену как опору для равновесия

      ### 5. Частые ошибки
      - Чрезмерный прогиб в спине
      - Неполная амплитуда движения
      - Слишком широкое разведение локтей
      - Потеря напряжения кора и прямой линии тела
      - Попытка выполнять упражнение без достаточной силовой базы
      - Слишком быстрое выполнение и потеря контроля

      ### 6. Безопасность и модификации
      - Подводитесь к упражнению через отжимания уголком, в том числе с ногами на возвышении
      - Выполняйте отжимания в стойке на руках с поддержкой ленты
      - Выполняйте только негативные повторения (только опускание) для развития силы
      - Прежде чем пробовать, убедитесь, что удерживаете стойку на руках у стены 30+ секунд
