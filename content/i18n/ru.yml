  Floor Press (Barbell):
    name: Жим с пола (штанга)
    instructions: |
      ## Обзор
      Жим штанги с пола — жимовое упражнение с укороченной амплитудой, которое в первую очередь нагружает большую грудную мышцу и трицепсы. В работу также включаются передние дельты; пол ограничивает амплитуду движения и снижает нагрузку на плечи, позволяя при этом жать тяжёлые веса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на пол, согнув колени и поставив стопы на пол
      - Расположитесь под грифом на стойках или попросите страхующих подать вам штангу
      - Возьмитесь за гриф хватом чуть шире плеч
      - Удерживайте гриф на полностью выпрямленных руках над грудью
      - Держите лопатки сведёнными и прижатыми к полу

      ### 2. Движение
      1. Медленно опускайте гриф, пока локти не коснутся пола
      2. Держите локти под углом примерно 45 градусов к корпусу
      3. Сделайте короткую паузу, когда трицепсы коснутся пола
      4. Выжмите гриф вверх, выпрямляя руки
      5. Полностью выпрямите руки в верхней точке
      6. Продолжайте выполнять контролируемые повторения, не отбивая локти от пола

      ### 3. Дыхание
      - Вдох — опуская гриф
      - Выдох — выжимая гриф вверх

      ### 4. Советы
      - Пол ограничивает амплитуду движения и снижает нагрузку на плечи
      - Делайте короткую паузу при касании локтями пола, не отбивайте их
      - Сосредоточьтесь на взрывном жиме из нижней точки
      - Держите лопатки сведёнными на протяжении всего упражнения
      - Этот вариант позволяет работать с более тяжёлыми весами, чем жим в полную амплитуду

      ### 5. Частые ошибки
      - Отбивание локтей от пола для создания инерции
      - Чрезмерное разведение локтей в стороны
      - Отсутствие паузы при касании локтями пола
      - Чрезмерный прогиб в спине
      - Слишком большой вес в ущерб контролю
      - Отрыв ягодиц от пола

      ### 6. Безопасность и модификации
