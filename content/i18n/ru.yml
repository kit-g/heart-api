      7. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая ноги к потолку
      - Вдыхайте, опуская ноги в исходное положение

      ### 4. Советы
      - Держите ноги полностью прямыми на протяжении всего движения
      - Поднимайте ноги за счёт кора, а не только сгибателей бедра
