  Sumo Deadlift High Pull (Barbell):
    name: Тяга сумо с протяжкой (штанга)
    instructions: |
      ## Обзор
      Тяга сумо с протяжкой — комплексное упражнение на всё тело с элементами тяжёлой атлетики. Оно нацелено прежде всего на ноги, ягодичные мышцы, трапеции и плечи: широкая стойка сумо в сочетании со взрывной тягой развивает мощность и координацию всего тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги шире плеч, носки развёрнуты наружу
      - Расположите гриф над серединой стопы
      - Возьмитесь за гриф хватом уже постановки ног, руки прямые
      - Держите спину прямой, грудь поднятой, таз опущенным
      - Напрягите мышцы кора и широчайшие перед тягой

      ### 2. Движение
      1. Взрывно оттолкнитесь ногами, поднимая штангу
      2. Мощно разгибайте тазобедренные и коленные суставы по мере подъёма грифа
      3. Полностью выпрямившись, продолжите тягу вверх, ведя локти высоко
      4. Тяните, пока гриф не достигнет уровня груди
      5. Подконтрольно опустите штангу на пол
      6. Примите исходное положение и повторите нужное количество взрывных повторений

      ### 3. Дыхание
      - Вдохните перед началом подъёма
      - Задержите дыхание во время тяги
      - Выдохните, опуская штангу

      ### 4. Советы
      - Широкая стойка акцентирует нагрузку на ногах и ягодичных мышцах
      - Выполняйте подъём с максимальной мощностью
      - Во время протяжки ведите движение локтями
      - Упражнение развивает одновременно силу и мощность
      - Держите гриф близко к телу на протяжении всего движения

      ### 5. Частые ошибки
      - Неполное раскрытие таза перед протяжкой
      - Тяга руками до завершения работы ног
      - Слишком большой вес и потеря взрывной скорости
      - Округление спины во время тяги
      - Локти не поднимаются высоко во время протяжки
      - Гриф уходит от тела

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить взрывное движение
      - Убедитесь в достаточной мобильности тазобедренных суставов для широкой стойки
      - Освойте становую тягу сумо, прежде чем добавлять протяжку
      - Отличное упражнение для кроссфита и функционального тренинга
