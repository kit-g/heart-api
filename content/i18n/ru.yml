    name: Обратные разведения (блок)
    instructions: |
      ## Обзор
      Обратные разведения на блоке — изолирующее упражнение, которое в первую очередь нагружает задние дельты и верх спины. Оно также задействует ромбовидные мышцы и среднюю часть трапеций: тросы дают постоянное натяжение, улучшая баланс плеч, осанку и развитие задних дельт.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте по центру между двумя блоками, установленными на уровне плеч
      - Скрестите руки перед собой и возьмитесь за рукояти противоположных блоков
      - Сделайте небольшой шаг назад, чтобы натянуть тросы, руки выпрямлены
      - Сохраняйте лёгкий сгиб в локтях на протяжении всего упражнения
      - Стойте с расправленной грудью и напряжёнными мышцами кора

      ### 2. Движение
      1. Разведите обе рукояти в стороны по широкой дуге
      2. Держите локти слегка согнутыми на протяжении всего движения
      3. Сосредоточьтесь на сведении лопаток
      4. Продолжайте, пока руки не будут разведены в стороны
      5. Сделайте паузу и дополнительно напрягите задние дельты в конечной точке
      6. Медленно верните руки в скрещённое исходное положение и повторите

      ### 3. Дыхание
      - Делайте выдох, разводя рукояти в стороны
      - Делайте вдох, возвращаясь в исходное положение

      ### 4. Советы
      - Тяните за счёт задних дельт и верха спины
      - Держите локти слегка согнутыми в фиксированном положении
      - Сводите лопатки в конечной точке
      - Сохраняйте постоянное натяжение: не позволяйте плиткам грузов касаться стека
      - Держите корпус неподвижным и не вращайте его

      ### 5. Частые ошибки
      - Полное выпрямление рук во время движения
      - Использование инерции и работа рывками
      - Лопатки не сводятся вместе
      - Вращение корпуса вместо его стабилизации
      - Опускание грузов на стек между повторениями
      - Слишком быстрый темп повторений

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить схему движения
      - Регулируйте высоту блоков, чтобы смещать акцент нагрузки
      - Выполняйте по одной руке для односторонней проработки
      - При дискомфорте в плечах уменьшите вес или амплитуду движения
