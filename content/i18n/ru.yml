  Chest Fly (Dumbbell):
    name: Разведения гантелей лёжа
    instructions: |
      ## Обзор
      Разведения гантелей лёжа — изолирующее упражнение, нацеленное в первую очередь на большие грудные мышцы. В качестве стабилизаторов также работают передние дельты; гантели движутся по широкой дуге, растягивая и сокращая мышцы груди.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на горизонтальную скамью, стопы плотно прижаты к полу
      - Держите по гантели в каждой руке на выпрямленных руках над грудью
      - Держите гантели ладонями друг к другу
      - Сохраняйте небольшое сгибание в локтях на протяжении всего упражнения
      - Сведите лопатки и прижмите их к скамье

      ### 2. Движение
      1. Опустите обе гантели в стороны по широкой дуге
      2. Держите локти слегка согнутыми на протяжении всего движения
      3. Продолжайте опускать до ощущения растяжения в груди
      4. Сделайте короткую паузу в нижней точке
      5. Сведите гантели обратно над грудью движением, похожим на объятие
      6. Напрягите грудь в верхней точке и повторяйте в контролируемом темпе

      ### 3. Дыхание
      - Вдыхайте, опуская гантели в стороны
      - Выдыхайте, сводя гантели вместе

      ### 4. Советы
      - Сохраняйте одинаковое небольшое сгибание в локтях на протяжении всего движения
      - Сосредоточьтесь на растяжении в нижней точке и сжатии в верхней
      - Держите лопатки сведёнными на протяжении всего подхода
      - Представляйте, что обхватываете большое дерево
      - Контролируйте вес по всей дуге движения

      ### 5. Частые ошибки
      - Полное выпрямление рук, превращающее упражнение в жим
      - Чрезмерное сгибание локтей, снижающее нагрузку на грудь
      - Слишком глубокое опускание гантелей, перегружающее плечи
      - Слишком большой вес и потеря траектории дуги
      - Отбив гантелей в нижней точке
      - Отсутствие сжатия груди в верхней точке

      ### 6. Безопасность и модификации
      - Начните с лёгких гантелей, чтобы освоить движение по дуге
      - Держите локти слегка согнутыми, чтобы защитить плечевые суставы
      - Выполняйте на наклонной скамье или скамье с обратным наклоном для разнообразия
      - Усложнённый вариант: пауза 2-3 секунды в нижней точке растяжения
