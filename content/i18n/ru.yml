  Snatch (Barbell):
    name: Рывок (штанга)
    instructions: |
      ## Обзор
      Рывок — полное соревновательное движение тяжёлой атлетики, задействующее всё тело. Штангу нужно поднять с помоста в положение над головой на прямых руках одним непрерывным взрывным движением, что требует максимальной мощности, скорости, мобильности и технической точности.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, гриф над серединой стопы
      - Возьмитесь за гриф широким рывковым хватом (кисти почти у замков грифа)
      - Наклонитесь через тазобедренные суставы и согните колени, чтобы взяться за гриф
      - Держите спину прямой, грудь поднятой, плечи над грифом
      - Руки должны быть прямыми и расслабленными

      ### 2. Движение
      1. Мощно оттолкнитесь ногами, чтобы оторвать штангу от помоста
      2. Ведите гриф близко к ногам по мере подъёма
      3. Мощно разогните тазобедренные и коленные суставы на уровне середины бедра
      4. Уходите под штангу, пока она поднимается
      5. Примите штангу над головой в глубоком приседе с прямыми руками
      6. Полностью встаньте со штангой над головой, завершая подъём

      ### 3. Дыхание
      - Сделайте глубокий вдох перед тягой
      - Задержите дыхание на протяжении тяги, приёма и вставания
      - Выдохните после того, как встанете со штангой над головой

      ### 4. Советы
      - Это самое техничное движение в тяжёлой атлетике
      - Широкий хват сокращает путь штанги
      - Скорость и техника важнее силы
      - Каждая фаза должна быть идеальной для успешного подъёма
      - Требует длительной работы с тренером и практики

      ### 5. Частые ошибки
      - Неправильная ширина хвата
      - Тяга руками до завершения работы ног
      - Дожим штанги вместо ухода под неё
      - Плохая позиция приёма и потеря равновесия
      - Недостаточная мобильность для глубокого приседа со штангой над головой
      - Попытки выполнения без должной технической базы

      ### 6. Безопасность и модификации
      - Требуется обучение у квалифицированного тренера по тяжёлой атлетике
      - Освойте все подводящие элементы, прежде чем выполнять полный рывок
      - Используйте амортизирующие блины и специальный помост
      - Освоение этого движения требует лет практики
