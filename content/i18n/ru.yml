  Elliptical Machine:
    name: Эллиптический тренажёр
    instructions: |
      ## Обзор
      Эллиптический тренажёр — низкоударное кардиоупражнение, нацеленное на ноги, ягодичные мышцы и сердечно-сосудистую систему. Он имитирует беговое движение без ударной нагрузки на суставы, обеспечивая эффективную аэробную работу с возможностью подключения верхней части тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте на тренажёр и поставьте стопы на педали
      - Возьмитесь за неподвижные или подвижные рукояти
      - Стойте прямо, мышцы кора напряжены
      - Начинайте с низкого сопротивления
      - Начните с комфортной длины шага

      ### 2. Движение
      1. Начните движение вперёд по эллиптической траектории
      2. Давите всей стопой, а не только носками
      3. При желании используйте подвижные рукояти для работы верха тела
      4. Сохраняйте вертикальную осанку на протяжении всей работы
      5. Регулируйте сопротивление и наклон для нужной интенсивности
      6. Продолжайте нужное время

      ### 3. Дыхание
      - Дышите равномерно и ритмично на протяжении всей работы
      - Увеличивайте частоту дыхания с ростом интенсивности
      - Никогда не задерживайте дыхание

      ### 4. Советы
      - Держите стопы полностью на педалях на протяжении всей работы
      - Сохраняйте вертикальную осанку, не наклоняйтесь вперёд
      - Используйте подвижные рукояти, чтобы включить верх тела
      - Меняйте длину шага, наклон и сопротивление для разнообразия
      - Отличный вариант низкоударного кардио

      ### 5. Частые ошибки
      - Слишком сильная опора на рукояти
      - Отрыв пяток от педалей
      - Плохая осанка с округлёнными плечами
      - Давление только носками вместо всей стопы
      - Слишком высокое сопротивление на старте
      - Мышцы кора не включены во время движения

      ### 6. Безопасность и модификации
      - Начинайте с низкого сопротивления и короткой продолжительности
      - Постепенно увеличивайте интенсивность и время
      - Идеален для людей с чувствительными суставами или восстанавливающихся после травм
      - Меняйте наклон и сопротивление для разных тренировочных эффектов
