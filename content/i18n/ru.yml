  T Bar Row:
    name: Тяга Т-грифа
    instructions: |
      ## Обзор
      Тяга Т-грифа — базовое тяговое упражнение, нацеленное в первую очередь на широчайшие, ромбовидные мышцы и среднюю часть трапеций. В работу также включаются поясница, бицепсы и задние дельты; фиксированная точка вращения позволяет работать с большим весом по стабильной траектории.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте над тренажёром для тяги Т-грифа, ноги на ширине плеч
      - Возьмитесь за рукояти обеими руками
      - Выполните наклон через тазобедренные суставы, корпус под углом около 45 градусов
      - Держите спину ровной, грудь вперёд, мышцы кора напряжены
      - Дайте весу повиснуть на прямых руках

      ### 2. Движение
      1. Потяните рукояти к нижней части груди или верхней части живота
      2. Ведите локти назад и вверх, держа их близко к корпусу
      3. Продолжайте, пока рукояти не дойдут до корпуса
      4. Сведите лопатки в верхней точке
      5. Медленно и подконтрольно опустите вес в исходное положение
      6. Останавливайтесь чуть раньше, чем вес ляжет на упор, чтобы сохранить напряжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, подтягивая рукояти к корпусу
      - Вдыхайте, опуская вес вниз

      ### 4. Советы
      - Держите спину ровной, а мышцы кора — в напряжении на протяжении всего подхода
      - Ведите движение локтями, уводя их назад за спину
      - Сосредоточьтесь на сведении лопаток
      - Сохраняйте постоянный угол наклона корпуса в течение подхода
      - Держите вес близко к телу

      ### 5. Частые ошибки
      - Округление спины вместо сохранения ровного положения позвоночника
      - Слишком вертикальное положение корпуса, снижающее нагрузку на спину
      - Подъём веса рывком за счёт инерции
      - Неполная амплитуда движения
      - Раскачивание корпуса вверх-вниз с каждым повторением
      - Полное опускание веса на упор между повторениями

      ### 6. Безопасность и модификации
      - Начните с умеренного веса, чтобы освоить положение в наклоне
      - Если есть возможность, используйте тягу Т-грифа с упором в грудь, чтобы разгрузить поясницу
      - Пробуйте разные рукояти для разнообразия
      - Усложнённый вариант: пауза 2-3 секунды в верхней точке каждого повторения
