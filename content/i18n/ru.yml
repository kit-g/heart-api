    name: Трастер (гиря)
    instructions: |
      ## Обзор
      Трастер с гирями — комплексное упражнение на всё тело, объединяющее присед с жимом над головой. Оно нацелено прежде всего на ноги, плечи и мышцы кора: гири позволяют рукам двигаться независимо, развивая мощность, выносливость и координацию.

      ## Техника выполнения
      ### 1. Исходное положение
      - Держите одну или две гири в позиции на груди на уровне плеч
      - Встаньте, ноги на ширине плеч
      - Держите локти прижатыми, грудь поднятой
      - Держите мышцы кора напряжёнными на протяжении всего движения

      ### 2. Движение
      1. Опуститесь в присед до параллели бёдер с полом или ниже
      2. Взрывно встаньте из приседа
      3. Используя инерцию, выжмите гири над головой, выпрямляясь
      4. Полностью выпрямите руки с гирями над головой
      5. Опустите гири обратно в позицию на груди
      6. Сразу опуститесь в следующий присед и повторите

      ### 3. Дыхание
      - Вдыхайте, опускаясь в присед
      - Мощно выдыхайте, вставая и выжимая гири

      ### 4. Советы
      - Используйте толчок ногами, чтобы помочь выжать гири над головой
      - Движение должно быть плавным и непрерывным
      - Держите корпус вертикально во время приседа
      - Гири позволяют рукам двигаться по более естественной траектории, чем штанга
      - Начинайте с лёгкого веса, чтобы освоить координацию

      ### 5. Частые ошибки
      - Жим без помощи ног
      - Пауза между приседом и жимом
      - «Заваливание» груди во время приседа
      - Неполное выпрямление рук над головой
      - Плохая позиция гирь на груди
      - Слишком большой вес до освоения техники

      ### 6. Безопасность и модификации
      - Сначала отдельно освойте гоблет-приседания и жим гири
      - Начинайте с одной лёгкой гири, прежде чем брать две
      - Если гирь нет, выполняйте упражнение с гантелями
      - Отличное упражнение для метаболического тренинга
    validated: false
    source_digest: e79446181d4f
