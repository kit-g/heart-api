  Wide Pull Up:
    name: Подтягивания широким хватом
    instructions: |
      ## Обзор
      Подтягивания широким хватом — тяговое упражнение с собственным весом, нацеленное в первую очередь на широчайшие с акцентом на ширину спины. В работу также включаются ромбовидные мышцы, средняя часть трапеций и бицепсы; более широкий хват нагружает внешнюю часть широчайших и помогает построить визуально более широкую спину.

      ## Техника выполнения
      ### 1. Исходное положение
      - Повисните на перекладине прямым хватом, руки значительно шире плеч
      - Полностью выпрямитесь в висе на прямых руках
      - Напрягите мышцы кора и держите плечи опущенными
      - Скрестите лодыжки или держите ноги прямыми
      - Избегайте лишнего раскачивания

      ### 2. Движение
      1. Подтянитесь, ведя локти вниз и в стороны
      2. Старайтесь тянуть широчайшими, а не руками
      3. Продолжайте, пока подбородок не окажется выше перекладины
      4. Держите мышцы кора в напряжении на протяжении всего движения
      5. Сделайте короткую паузу в верхней точке
      6. Медленно опуститесь в исходное положение до полного выпрямления рук

      ### 3. Дыхание
      - Выдыхайте, подтягиваясь вверх
      - Вдыхайте, опускаясь вниз

      ### 4. Советы
      - Из-за ширины хвата локти будут разведены шире обычного
      - Сосредоточьтесь на том, чтобы тянуть локти вниз к бокам
      - Ведите движение грудью и сохраняйте правильную осанку
      - Контролируйте опускание для максимальной работы мышц
      - Думайте о том, чтобы привести локти к бокам, а не кисти к перекладине

      ### 5. Частые ошибки
      - Слишком широкий хват, ограничивающий амплитуду
      - Неполная амплитуда в верхней или нижней точке
      - Использование инерции или киппинга вместо строгой техники
      - Подъём плеч к ушам
      - Неполное выпрямление рук в нижней точке
      - Тяга только руками без включения широчайших

      ### 6. Безопасность и модификации
      - Используйте гравитрон или ленту для поддержки
      - Выполняйте тягу верхнего блока, чтобы построить базовую силу
      - Усложнённый вариант: добавьте вес с помощью пояса для отягощений или жилета-утяжелителя
      - При дискомфорте в плечах немного сузьте хват
