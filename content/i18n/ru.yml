  Stiff Leg Deadlift (Barbell):
    name: Тяга на прямых ногах (штанга)
    instructions: |
      ## Обзор
      Тяга на прямых ногах со штангой — упражнение на наклон через тазобедренные суставы, нацеленное в первую очередь на бицепс бедра и разгибатели позвоночника. В качестве стабилизаторов также работают ягодичные мышцы и широчайшие; минимальное сгибание коленей акцентирует заднюю цепь и укрепляет поясницу и заднюю поверхность бедра.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, держите штангу прямым хватом
      - Расположите руки чуть шире линии ног
      - Встаньте прямо, штанга на уровне бёдер
      - Держите грудь вперёд, плечи отведены назад, мышцы кора напряжены
      - Сохраняйте лишь совсем небольшое сгибание в коленях на протяжении всего упражнения

      ### 2. Движение
      1. Выполните наклон через тазобедренные суставы: отведите таз назад и опустите штангу
      2. Держите спину ровной, а гриф — близко к ногам
      3. Держите ноги почти прямыми, с минимальным сгибанием коленей
      4. Опускайтесь до ощущения растяжения в бицепсе бедра — обычно до середины голени
      5. Подайте таз вперёд, чтобы вернуться в исходное положение
      6. Напрягите ягодичные мышцы в верхней точке и повторяйте в контролируемом темпе

      ### 3. Дыхание
      - Вдыхайте, опуская штангу
      - Выдыхайте, подавая таз вперёд при подъёме

      ### 4. Советы
      - Держите ноги почти прямыми на протяжении всего движения
      - Сосредоточьтесь на наклоне через тазобедренные суставы, а не на приседании
      - Держите спину ровной, а грудь — вперёд на протяжении всего подхода
      - Отводите таз назад как можно дальше
      - Чувствуйте растяжение бицепса бедра в нижней точке

      ### 5. Частые ошибки
      - Округление спины вместо сохранения ровного положения позвоночника
      - Слишком сильное сгибание коленей, превращающее упражнение в румынскую тягу
      - Недостаточное отведение таза назад
      - Опускание грифа заметно ниже точки растяжения бицепса бедра
      - Слишком большой вес в ущерб технике
      - Взгляд вверх вместо нейтрального положения шеи

      ### 6. Безопасность и модификации
      - Начните с лёгкого веса, чтобы освоить наклон через тазобедренные суставы с прямыми ногами
      - Если этот вариант слишком тяжёл, начните с румынской тяги
      - Выполняйте с гантелями, если штанга кажется нестабильной
      - При дискомфорте в пояснице уменьшите вес и проверьте технику
