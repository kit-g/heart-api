  Clean (Barbell):
    name: Взятие на грудь (штанга)
    instructions: |
      ## Обзор
      Взятие штанги на грудь — взрывное тяжелоатлетическое движение, нацеленное в первую очередь на квадрицепсы, ягодичные мышцы и бицепс бедра. Оно также задействует всю заднюю цепь, трапеции и плечи: мощное разгибание в тазобедренных суставах и тяга поднимают штангу с пола на плечи.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, стопы на ширине таза, гриф над серединой стопы
      - Возьмитесь за гриф сразу за линией ног хватом «в замок»
      - Наклонитесь через тазобедренные суставы и согните колени, чтобы взяться за гриф
      - Держите спину ровной, грудь вперёд, плечи над грифом
      - Включите широчайшие и напрягите мышцы кора перед тягой

      ### 2. Движение
      1. Мощно оттолкнитесь ногами, срывая штангу с пола
      2. Держите гриф близко к телу на всём пути вверх
      3. Когда гриф достигнет середины бедра, мощно разогнитесь в тазобедренных и коленных суставах
      4. Уходите под штангу, пока она поднимается
      5. Примите гриф на плечи в положении фронтального приседа
      6. Полностью встаньте, чтобы завершить повторение

      ### 3. Дыхание
      - Сделайте глубокий вдох перед тягой
      - Задержите дыхание на протяжении тяги и приёма штанги
      - Выдохните после вставания

      ### 4. Советы
      - Это технически сложное движение, требующее работы с тренером
      - Сосредоточьтесь на взрывном разгибании таза в нужный момент
      - Держите траекторию грифа близко к телу на всём протяжении
      - Принимайте гриф с высоко поднятыми и выведенными вперёд локтями
      - Отработайте движение с лёгким весом, прежде чем нагружать штангу

      ### 5. Частые ошибки
      - Слишком высокое или слишком низкое положение таза на старте
      - Ранняя тяга руками вместо работы ног
      - Уход грифа от тела
      - Неполное разгибание в тазобедренных суставах перед уходом под штангу
      - Приём штанги с низкими локтями или в неправильном положении
      - Попытка взять большой вес без поставленной техники

      ### 6. Безопасность и модификации
      - Учитесь у квалифицированного тренера по тяжёлой атлетике
      - Освойте взятие на грудь с виса, прежде чем брать штангу с пола
      - Сначала практикуйтесь с пластиковой трубой или пустым грифом
      - Используйте бамперные блины и помост для безопасного сброса штанги
