  Overhead Press (Barbell):
    name: Жим над головой (штанга)
    instructions: |
      ## Обзор
      Жим штанги над головой — базовое упражнение для верха тела, которое в первую очередь нагружает все три пучка дельт. Оно также задействует трицепсы, верх груди и мышцы кора, что делает его одним из самых эффективных упражнений для общей силы плеч и жимовой мощности верха тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, поставив ноги на ширине плеч; штанга на стойках на уровне верха груди
      - Возьмите гриф чуть шире плеч, ладони направлены вперёд
      - Снимите штангу со стоек и держите её на уровне плеч
      - Держите грудь расправленной, мышцы кора напряжёнными, локти слегка выведенными вперёд
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Выжмите штангу строго вверх над головой, выпрямляя руки
      2. Слегка отведите голову назад, чтобы пропустить гриф
      3. Продолжайте жать до полного выпрямления рук над головой
      4. Полностью выпрямите локти в верхней точке, гриф — над серединой стопы
      5. Подконтрольно опустите штангу обратно на уровень плеч
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Перед жимом сделайте вдох и напрягите мышцы кора
      - Задержите дыхание во время жима
      - Выдохните в верхней точке или при опускании штанги

      ### 4. Советы
      - Жмите штангу по строго вертикальной траектории
      - Держите мышцы кора напряжёнными, чтобы не прогибаться в пояснице
      - Полностью выпрямляйте руки в верхней точке
      - Держите траекторию грифа близко к лицу
      - Упражнение можно выполнять стоя или сидя

      ### 5. Частые ошибки
      - Чрезмерный прогиб в пояснице во время жима
      - Жим вперёд вместо строго вверх
      - Неполное выпрямление рук в верхней точке
      - Слишком широкое разведение локтей
      - Использование инерции ног (превращение упражнения в швунг жимовой)
      - Потеря напряжения кора

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить вертикальную траекторию жима
      - Тренируясь в одиночку, используйте силовую раму со страховочными упорами
      - Для большей стабильности выполняйте жим над головой сидя
      - При дискомфорте в плечах проверьте ширину хвата и траекторию грифа
