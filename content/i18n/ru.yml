  Chest Press (Band):
    name: Жим от груди (лента)
    instructions: |
      ## Обзор
      Жим от груди с лентой — жимовое упражнение с эластичным сопротивлением, нацеленное в первую очередь на большие грудные мышцы. В работу также включаются передние дельты и трицепсы; сопротивление ленты нарастает по ходу движения и максимально при полном выпрямлении рук.

      ## Техника выполнения
      ### 1. Исходное положение
      - Закрепите ленту на уровне груди позади себя
      - Возьмите по концу ленты в каждую руку на уровне груди
      - Сделайте шаг вперёд, чтобы создать натяжение; локти согнуты
      - Встаньте в разножку для устойчивости
      - Держите грудь вперёд, мышцы кора — в напряжении

      ### 2. Движение
      1. Выжмите обе руки вперёд, выпрямляя их
      2. Держите кисти на уровне груди на протяжении всего движения
      3. Продолжайте до полного выпрямления рук
      4. Сделайте паузу и напрягите грудь при полном выпрямлении
      5. Медленно и подконтрольно верните кисти к груди
      6. Останавливайтесь до потери натяжения ленты и повторяйте

      ### 3. Дыхание
      - Выдыхайте, выжимая руки вперёд
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Поддерживайте постоянное напряжение, контролируя обе фазы
      - Держите корпус стабильным и не наклоняйтесь вперёд
      - Сосредоточьтесь на сокращении груди при полном выпрямлении рук
      - Держите запястья прямыми на протяжении всего подхода
      - Меняйте расстояние до точки крепления, чтобы регулировать сопротивление

      ### 5. Частые ошибки
      - Использование инерции и раскачивание корпуса
      - Потеря постоянного натяжения ленты
      - Слишком сильный наклон вперёд во время жима
      - Чрезмерное разведение локтей в стороны
      - Слишком быстрый темп выполнения повторений
      - Полная потеря натяжения в исходном положении

      ### 6. Безопасность и модификации
      - Начните с ленты с меньшим сопротивлением, чтобы освоить движение
      - Регулируйте расстояние до точки крепления, чтобы менять уровень сопротивления
      - Работайте одной рукой для одностороннего акцента
      - Усложнённый вариант: возьмите более жёсткую ленту или добавьте паузу при выпрямлении рук
