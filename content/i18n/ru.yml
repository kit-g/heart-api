  Chin Up:
    name: Подтягивания обратным хватом
    instructions: |
      ## Обзор
      Подтягивания обратным хватом — тяговое упражнение с собственным весом, которое в первую очередь нагружает широчайшие и бицепсы. Также работают ромбовидные мышцы, средняя часть трапеций и мышцы кора: обратный хват сильнее включает бицепсы, чем классические подтягивания, эффективно развивая тяговую силу верха тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Повисните на перекладине обратным хватом (ладони к себе)
      - Расположите руки чуть уже ширины плеч
      - Полностью выпрямите тело, руки прямые
      - Напрягите мышцы кора и опустите плечи вниз
      - Скрестите лодыжки или держите ноги прямыми

      ### 2. Движение
      1. Подтянитесь, направляя локти вниз и назад
      2. Продолжайте, пока подбородок не окажется выше перекладины
      3. Держите мышцы кора в напряжении и не раскачивайтесь
      4. Сделайте короткую паузу в верхней точке
      5. Медленно и подконтрольно опуститесь в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, подтягиваясь вверх
      - Вдыхайте, опускаясь вниз

      ### 4. Советы
      - Тянитесь грудью вверх и держите плечи отведёнными назад
      - Сосредоточьтесь на движении локтей вниз, а не просто кистей вверх
      - Держите мышцы кора в напряжении, чтобы не раскачиваться
      - Контролируйте фазу опускания для максимальной работы мышц
      - Представляйте, что тянете перекладину к себе, а не себя к перекладине

      ### 5. Частые ошибки
      - Использование инерции или киппинга вместо строгой техники
      - Неполная амплитуда в верхней или нижней точке
      - Подъём плеч к ушам
      - Чрезмерное раскачивание во время движения
      - Неполное выпрямление рук в нижней точке
      - Тяга только руками без включения спины

      ### 6. Безопасность и модификации
      - Используйте гравитрон или ленту для поддержки
      - Выполняйте негативные повторения (запрыгните в верхнюю точку и медленно опускайтесь), чтобы набрать силу
      - Продвинутый вариант: добавьте вес с помощью пояса или жилета-утяжелителя
      - Прогрессируйте постепенно, чтобы не перегрузить плечи
