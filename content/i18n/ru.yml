      - Неполное выпрямление в прыжке
      - Задержка дыхания на протяжении всего упражнения

      ### 6. Безопасность и модификации
      - Отшагивайте назад вместо прыжка, чтобы снизить ударную нагрузку
      - Уберите отжимание для облегчённого варианта
      - При необходимости уберите прыжок в конце
