    instructions: |
      ## Обзор
      Подтягивания в гравитроне — тяговое упражнение на тренажёре, которое в первую очередь нагружает широчайшие мышцы спины с поддержкой. В работу также включаются ромбовидные мышцы, средняя часть трапеций и бицепсы; противовес облегчает движение, делая подтягивания доступнее и помогая набрать силу для подтягиваний без поддержки.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите вес на гравитроне (больше вес — больше помощь)
      - Возьмитесь за рукояти прямым хватом, руки чуть шире плеч
      - Поставьте колени или стопы на платформу противовеса
      - Повисните на полностью выпрямленных руках, плечи в тонусе
      - Держите мышцы кора в напряжении, тело стабильно

      ### 2. Движение
      1. Подтянитесь, уводя локти вниз и назад
      2. Продолжайте, пока подбородок не окажется выше рукоятей или перекладины
      3. Держите мышцы кора в напряжении, движение — контролируемым
      4. Коротко задержитесь в верхней точке
      5. Медленно и подконтрольно опуститесь в исходное положение
      6. Повторите нужное количество повторений в контролируемом темпе

      ### 3. Дыхание
      - Выдыхайте, когда подтягиваетесь вверх
      - Вдыхайте, когда опускаетесь вниз

      ### 4. Советы
      - Постепенно уменьшайте вес противовеса по мере роста силы
      - Сосредоточьтесь на тяге мышцами спины, а не только руками
      - Держите плечи опущенными и отведёнными назад
      - Контролируйте и подъём, и опускание
      - Не полагайтесь на помощь тренажёра слишком сильно

      ### 5. Частые ошибки
      - Слишком большая помощь противовеса, из-за которой нагрузка недостаточна
      - Неполная амплитуда движения
      - Подъём плеч к ушам
      - Работа за счёт инерции вместо контролируемого движения
      - Вес противовеса не уменьшается со временем
      - Тяга только руками без включения спины

      ### 6. Безопасность и модификации
      - Начинайте с большей помощи и постепенно уменьшайте её по мере роста силы
      - Ставьте технику выше скорости уменьшения противовеса
      - Переходите к подтягиваниям с лентой или негативным подтягиваниям, прежде чем пробовать вариант без поддержки
      - В качестве альтернативы выполняйте тягу верхнего блока для развития базовой силы
