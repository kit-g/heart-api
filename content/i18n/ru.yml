      - Слишком сильное сгибание коленей, превращающее движение в присед
      - Недостаточное отведение таза назад
      - Слишком большой вес в ущерб технике
      - Слишком быстрый темп и потеря контроля
      - Переразгибание спины в верхней точке

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса или пустого грифа, чтобы освоить наклон через тазобедренные суставы
      - Держите колени слегка согнутыми, чтобы защитить бицепс бедра
      - Если штанга лежит нестабильно, выполняйте упражнение с гантелями в опущенных руках
