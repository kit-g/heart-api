  Skullcrusher (Barbell):
    name: Французский жим лёжа (штанга)
    instructions: |
      ## Обзор
      Французский жим лёжа со штангой — изолирующее упражнение, которое в первую очередь нагружает трицепсы, особенно их длинную головку. В работу также включаются медиальная и латеральная головки трицепса; положение лёжа обеспечивает максимальное растяжение и сокращение на протяжении всего движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на скамью, стопы плотно упираются в пол
      - Возьмите штангу прямым хватом уже или на ширине плеч
      - Выпрямите руки вертикально над грудью
      - Слегка отклоните руки назад, к голове (не строго вертикально)
      - Держите локти неподвижными на протяжении всего движения

      ### 2. Движение
      1. Опустите штангу, сгибая локти и направляя гриф ко лбу
      2. Держите плечи неподвижными, слегка отклонёнными назад
      3. Опускайте, пока предплечья не пройдут чуть ниже параллели с полом
      4. Сделайте короткую паузу в нижней точке растяжения
      5. Разогните локти и верните гриф в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опуская штангу ко лбу
      - Выдыхайте, выжимая штангу вверх

      ### 4. Советы
      - Держите плечи неподвижными на протяжении всего движения
      - Опускайте гриф подконтрольно, чтобы не задеть лоб
      - Сохраняйте напряжение в трицепсах от начала до конца
      - Держите локти достаточно близко друг к другу, не разводя их в стороны
      - Слегка отклоняйте руки назад для максимального включения трицепсов

      ### 5. Частые ошибки
      - Чрезмерное разведение локтей в стороны
      - Движение плечами вместо удержания их неподвижными
      - Слишком быстрое, неконтролируемое опускание грифа
      - Неполное растяжение в нижней точке
      - Слишком большой вес в ущерб технике
      - Уход локтей вперёд во время разгибания

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить контролируемое опускание
      - При дискомфорте в запястьях или локтях используйте EZ-гриф
      - В тяжёлых подходах работайте со страхующим
      - Усложнённый вариант: опускайте гриф за голову для большего растяжения
