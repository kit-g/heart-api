  Seated Overhead Press (Barbell):
    name: Жим над головой сидя (штанга)
    instructions: |
      ## Обзор
      Жим штанги над головой сидя — базовое упражнение для верхней части тела, нацеленное в первую очередь на все три пучка дельт. Оно также задействует трицепсы и верхнюю часть груди; положение сидя с опорой на спинку исключает помощь ног и изолирует плечи.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на скамью со спинкой, стопы поставьте на пол всей поверхностью
      - Установите штангу в стойке на уровне верхней части груди
      - Возьмитесь за гриф чуть шире плеч, ладони направлены вперёд
      - Снимите гриф со стоек и удерживайте его на уровне плеч
      - Прижмите спину к спинке и напрягите мышцы кора

      ### 2. Движение
      1. Выжмите гриф строго вверх над головой, выпрямляя руки
      2. Продолжайте жать до полного выпрямления рук
      3. Полностью выпрямите локти в верхней точке
      4. Сделайте короткую паузу вверху
      5. Подконтрольно опустите гриф обратно на уровень плеч
      6. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Сделайте вдох и напрягите корпус перед жимом
      - Задержите дыхание во время жима
      - Выдохните в верхней точке или при опускании грифа

      ### 4. Советы
      - Держите спину плотно прижатой к спинке
      - Положение сидя исключает помощь ног и обеспечивает строгую работу плеч
      - Жмите строго вверх, а не вперёд
      - Работайте в полной амплитуде
      - Этот вариант отлично изолирует плечи

      ### 5. Частые ошибки
      - Прогиб поясницы с отрывом от спинки во время жима
      - Жим вперёд вместо строго вверх
      - Неполное выпрямление рук в верхней точке
      - Использование инерции с отрывом ягодиц от сиденья
      - Слишком широкое разведение локтей в стороны
      - Отсутствие напряжения в мышцах кора

      ### 6. Безопасность и модификации
      - Используйте страхующего при работе с большими весами
      - Начинайте с веса меньше, чем в жиме стоя
      - Если возможно, отрегулируйте наклон спинки для удобства
      - При дискомфорте в плечах проверьте ширину хвата и траекторию грифа
