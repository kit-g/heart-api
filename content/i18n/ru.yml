  Back Extension (Machine):
    name: Гиперэкстензия (тренажёр)
    instructions: |
      ## Обзор
      Гиперэкстензия в тренажёре — упражнение с отягощением, которое в первую очередь нагружает разгибатели позвоночника и мышцы поясницы. Также работают ягодичные мышцы и бицепс бедра: тренажёр задаёт траекторию и позволяет регулировать сопротивление для безопасного и эффективного укрепления поясницы.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для гиперэкстензии, прижав спину к подушке
      - Отрегулируйте высоту подушки так, чтобы она удобно упиралась в среднюю или верхнюю часть спины
      - Зафиксируйте стопы на платформе или под валиками
      - Скрестите руки на груди или возьмитесь за рукояти
      - Установите подходящий вес на грузовом стеке

      ### 2. Движение
      1. Надавите спиной на подушку, разгибая позвоночник и тазобедренные суставы
      2. Продолжайте, пока спина не выпрямится или слегка не разогнётся назад
      3. Держите мышцы кора в напряжении и двигайтесь подконтрольно
      4. Сделайте короткую паузу в точке полного разгибания
      5. Медленно и подконтрольно вернитесь в исходное положение
      6. Останавливайтесь чуть раньше, чем плитки грузового стека коснутся друг друга, чтобы сохранить натяжение, затем повторите

      ### 3. Дыхание
      - Выдыхайте, разгибая спину и надавливая на подушку
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите мышцы кора в напряжении на протяжении всего движения
      - Не переразгибайте позвоночник
      - Сосредоточьтесь на плавном, контролируемом движении в обоих направлениях
      - Сохраняйте постоянное натяжение, не позволяя грузу ложиться на стек
      - Держите стопы плотно прижатыми на протяжении всего подхода

      ### 5. Частые ошибки
      - Слишком большой вес в ущерб технике
      - Чрезмерное переразгибание позвоночника
      - Использование инерции вместо контролируемого мышечного сокращения
      - Груз ложится на стек между повторениями
      - Запрокидывание головы вместо нейтрального положения шеи
      - Слишком быстрый темп на всей амплитуде

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить правильную технику и контроль
      - Отрегулируйте высоту подушки для правильного положения спины
      - Продвинутый вариант: задержитесь на 2–3 секунды в точке полного разгибания
      - При дискомфорте уменьшите вес и проверьте положение подушки
