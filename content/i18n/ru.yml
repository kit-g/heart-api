  Lateral Raise (Dumbbell):
    name: Махи в стороны (гантели)
    instructions: |
      ## Обзор
      Махи в стороны с гантелями — изолирующее упражнение, которое в первую очередь нагружает средние дельты. Оно также задействует верхнюю часть трапеций: гантели позволяют работать каждой рукой независимо, увеличивая ширину плеч и делая их визуально шире.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте с гантелями в руках, ноги на ширине плеч
      - Опустите гантели вдоль тела, ладони обращены внутрь
      - Держите руки прямыми, с чуть согнутыми локтями
      - Стойте ровно: грудь расправлена, мышцы кора напряжены
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Поднимите обе руки в стороны по широкой дуге
      2. Держите руки прямыми, лишь слегка сгибая локти
      3. Поднимайте, пока руки не окажутся на уровне плеч
      4. Сделайте короткую паузу в верхней точке
      5. Медленно и подконтрольно опустите гантели вдоль тела
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Делайте выдох, поднимая гантели в стороны
      - Делайте вдох, опуская гантели

      ### 4. Советы
      - Держите корпус неподвижным и не используйте инерцию
      - Ведите движение слегка согнутыми локтями
      - В верхней точке представляйте, что выливаете воду из кувшина
      - Контролируйте и фазу подъёма, и фазу опускания
      - Сохраняйте постоянное напряжение на протяжении всего подхода

      ### 5. Частые ошибки
      - Использование инерции и раскачивание гантелей
      - Пожимание плечами во время подъёма
      - Чрезмерное сгибание локтей
      - Подъём гантелей намного выше уровня плеч
      - Слишком большой вес в ущерб технике
      - Потеря постоянного напряжения

      ### 6. Безопасность и модификации
      - Начинайте с лёгких гантелей, чтобы освоить схему движения
      - Выполняйте по одной руке для лучшей концентрации и контроля
      - Выполняйте махи сидя, чтобы исключить инерцию от ног
      - При дискомфорте в плечах уменьшите вес или амплитуду движения
