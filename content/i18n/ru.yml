  Sumo Deadlift (Barbell):
    name: Становая тяга сумо (штанга)
    instructions: |
      ## Обзор
      Становая тяга сумо со штангой — базовое упражнение, нацеленное в первую очередь на ягодичные мышцы, бицепс бедра и квадрицепсы — с большим акцентом, чем в классической становой тяге. В работу также включаются разгибатели позвоночника, широчайшие и приводящие мышцы; широкая стойка снижает нагрузку на поясницу и позволяет держать корпус более вертикально.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги значительно шире плеч, носки развёрнуты наружу
      - Расположите гриф над серединой стопы
      - Возьмитесь за гриф хватом на ширине плеч, руки внутри линии ног
      - Опустите таз и держите грудь вперёд
      - Держите спину ровной, плечи — чуть впереди грифа

      ### 2. Движение
      1. Оттолкнитесь пятками и одновременно разгибайте тазобедренные и коленные суставы
      2. Во время подъёма ведите гриф вплотную к телу
      3. Полностью выпрямитесь, разогнув таз и отведя плечи назад
      4. Держите корпус более вертикально, чем в классической становой тяге
      5. Опустите гриф, отводя таз назад и сгибая колени
      6. Подконтрольно верните гриф на пол и повторите

      ### 3. Дыхание
      - Перед подъёмом сделайте глубокий вдох и напрягите мышцы кора
      - Задерживайте дыхание во время подъёма
      - Выдыхайте в верхней точке или при опускании грифа

      ### 4. Советы
      - Следите, чтобы колени двигались в направлении носков
      - Разводите колени наружу, чтобы включить ягодичные мышцы
      - Держите гриф вплотную к голеням и бёдрам
      - Сохраняйте более вертикальное положение корпуса, чем в классической становой тяге
      - Думайте о том, что вы отталкиваете пол ногами

      ### 5. Частые ошибки
      - Недостаточно широкая стойка
      - Заваливание коленей внутрь
      - Округление поясницы во время подъёма
      - Слишком высокое или слишком низкое положение таза на старте
      - Уход грифа от тела
      - Неполное разгибание таза в верхней точке

      ### 6. Безопасность и модификации
      - Начните с лёгкого веса, чтобы освоить широкую стойку и механику работы таза
      - Убедитесь, что подвижность тазобедренных суставов позволяет правильно встать в стойку сумо
      - Используйте лямки, если сила хвата ограничивает вес
      - При дискомфорте в тазобедренных суставах измените ширину стойки или разворот стоп
