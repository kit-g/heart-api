  Triceps Extension (Machine):
    name: Разгибания на трицепс (тренажёр)
    instructions: |
      ## Обзор
      Разгибания на трицепс в тренажёре — изолирующее упражнение, которое в первую очередь нагружает все три головки трицепса по заданной траектории. Плечи включаются минимально: фиксированная конструкция тренажёра обеспечивает стабильность и равномерное сопротивление на протяжении всего разгибания.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр, плотно прижав спину к спинке
      - Отрегулируйте высоту сиденья так, чтобы локти находились на одной оси с осью вращения тренажёра
      - Возьмитесь за рукояти прямым или нейтральным хватом в зависимости от конструкции тренажёра
      - В исходном положении локти согнуты примерно под углом 90 градусов
      - Если конструкция предусматривает упор, прижмите плечевую часть рук к подушке

      ### 2. Движение
      1. Разогните руки, нажимая на рукояти вниз или вперёд
      2. Держите плечевую часть рук неподвижно прижатой к упору на протяжении всего движения
      3. Продолжайте движение до полного выпрямления рук
      4. Сделайте паузу и дополнительно напрягите трицепсы в точке полного выпрямления
      5. Медленно и подконтрольно вернитесь в исходное положение
      6. Останавливайтесь чуть раньше, чем плитки грузового стека коснутся друг друга, чтобы сохранить натяжение, затем повторите

      ### 3. Дыхание
      - Выдыхайте, разгибая руки
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите плечевую часть рук полностью неподвижной на протяжении всего движения
      - Сохраняйте постоянное натяжение, не позволяя грузу ложиться на стек
      - Сосредоточьтесь на сокращении трицепсов в точке полного выпрямления
      - Контролируйте и фазу разгибания, и фазу возврата
      - Не используйте инерцию и не помогайте себе корпусом

      ### 5. Частые ошибки
      - Отрыв плечевой части рук или локтей от упора
      - Использование инерции вместо контролируемого мышечного сокращения
      - Груз полностью ложится на стек между повторениями
      - Неполное выпрямление рук
      - Слишком большой вес в ущерб технике
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Отрегулируйте высоту сиденья так, чтобы локти были на одной оси с осью вращения тренажёра
      - Начинайте с лёгкого веса, чтобы наладить нейромышечную связь
      - Продвинутый вариант: добавьте паузу 2–3 секунды в точке полного выпрямления
      - Если конструкция тренажёра позволяет, выполняйте одной рукой для односторонней проработки
