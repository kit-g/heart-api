  Ball Slams:
    name: Броски мяча в пол
    instructions: |
      ## Обзор
      Броски мяча в пол — взрывное упражнение на всё тело, нацеленное прежде всего на мышцы кора, плечи и широчайшие. Оно также задействует всю заднюю цепь и сердечно-сосудистую систему: с помощью медбола вы развиваете мощность, снимаете стресс и тренируете взрывную силу.

