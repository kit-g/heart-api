exercises:
  Ab Wheel:
    name: Ролик для пресса
    instructions: |
      ## Обзор
      Выкат с роликом для пресса — сложное упражнение на кор, которое в первую очередь нагружает прямую и поперечную мышцы живота. В качестве стабилизаторов на протяжении всего движения также работают косые мышцы живота, сгибатели бедра и плечи.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте на колени на коврик, ролик расположите прямо перед собой
      - Крепко возьмитесь за рукояти ролика обеими руками на ширине плеч
      - Расположите плечи прямо над роликом
      - Держите спину прямой, мышцы кора напряжёнными
      - Смотрите в пол, чтобы сохранять нейтральное положение шеи

      ### 2. Движение
      1. Медленно катите ролик вперёд, выпрямляя руки и разгибаясь в тазобедренных суставах
      2. Держите мышцы кора в напряжении и не допускайте провисания поясницы
      3. Выкатывайтесь настолько далеко, насколько можете, сохраняя контроль и ровную спину
      4. Ненадолго задержитесь в положении полного выката
      5. Подтяните ролик обратно к коленям, сокращая мышцы пресса
      6. Подконтрольно вернитесь в исходное положение

      ### 3. Дыхание
      - Выдыхайте, выкатываясь вперёд и вытягивая корпус
      - Вдыхайте, возвращая ролик в исходное положение

      ### 4. Советы
      - Сохраняйте постоянное напряжение в мышцах кора на протяжении всего движения
      - Двигайтесь медленно и подконтрольно; скорость снижает эффективность
      - Сосредоточьтесь на том, чтобы возвращаться за счёт пресса, а не рук
      - Держите таз стабильным и избегайте чрезмерного прогиба

      ### 5. Частые ошибки
      - Провисание или переразгибание поясницы
      - Слишком глубокий выкат до того, как набрана достаточная сила
      - Использование инерции вместо контролируемого движения
      - Подъём таза «домиком» при возврате
      - Задержка дыхания во время движения

      ### 6. Безопасность и модификации
      - Начинайте с частичных выкатов к стене, чтобы ограничить амплитуду
      - Выполняйте упражнение с коленей, прежде чем пробовать с носков
      - При дискомфорте в пояснице уменьшите амплитуду
      - Переходите к выкатам стоя только после уверенного освоения варианта с коленей
    validated: false
    source_digest: 88d0c5e76120
  Bicycle Crunch:
    name: Скручивания «велосипед»
    instructions: |
      ## Обзор
      Скручивания «велосипед» — динамичное упражнение на кор, которое в первую очередь нагружает прямую мышцу живота и косые мышцы. Также работают сгибатели бедра и поперечная мышца живота, когда вы согласуете повороты корпуса с попеременными движениями ног.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину на коврик, согните колени, стопы поставьте на пол
      - Слегка заведите руки за голову, локти направьте в стороны
      - Немного приподнимите плечи от коврика и напрягите мышцы кора
      - Оторвите стопы от пола, согнув колени под углом 90 градусов
      - Прижимайте поясницу к коврику

      ### 2. Движение
      1. Одновременно потянитесь правым локтем к левому колену, выпрямляя правую ногу
      2. Поворачивайте корпус так, чтобы к колену шло плечо, а не только локоть
      3. Ненадолго задержитесь, когда локоть и колено сблизятся
      4. Вернитесь в центральное положение с обоими согнутыми коленями
      5. Повторите в другую сторону: потянитесь левым локтем к правому колену, выпрямляя левую ногу
      6. Продолжайте чередовать стороны плавным, контролируемым «педалирующим» движением

      ### 3. Дыхание
      - Выдыхайте на повороте, приближая локоть к колену
      - Вдыхайте, возвращаясь в центр и меняя сторону

      ### 4. Советы
      - Сосредоточьтесь на вращении всего корпуса, а не только на движении локтей
      - Держите шею расслабленной и не тяните голову руками
      - Сохраняйте постоянное напряжение в мышцах кора на протяжении всего движения
      - Двигайтесь подконтрольно, а не быстро — так эффективнее
      - Прижимайте поясницу к коврику, чтобы защитить позвоночник

      ### 5. Частые ошибки
      - Тяга за шею или голову вместо работы мышцами кора
      - Слишком быстрый темп и потеря техники
      - Движение только локтями вместо поворота корпуса
      - Отрыв поясницы от коврика
      - Неполное выпрямление ног на каждом повторении
      - Задержка дыхания во время движения

      ### 6. Безопасность и модификации
      - Новички могут держать стопы на полу и выполнять повороты без движения ног
      - Уменьшите амплитуду при дискомфорте в шее или пояснице
      - Усложняйте упражнение, замедляя темп и увеличивая время под нагрузкой
      - Продвинутый вариант: пауза 2–3 секунды в каждом повороте
    validated: false
    source_digest: f32a661f68a7
  Cable Crunch:
    name: Скручивания на блоке
    instructions: |
      ## Обзор
      Скручивания на блоке — эффективное упражнение на кор, которое в первую очередь нагружает прямую мышцу живота с постоянным натяжением на протяжении всего движения. В качестве стабилизаторов также работают косые и поперечная мышцы живота, поэтому упражнение популярно для развития силы и рельефа пресса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте на колени перед верхним блоком с канатной рукоятью
      - Возьмитесь за концы каната и расположите их у головы или у верхней части груди
      - Держите таз неподвижным и сохраняйте лёгкий наклон вперёд
      - Напрягите мышцы кора и опустите лопатки вниз и назад
      - Расположитесь достаточно близко, чтобы весовой стек не опускался полностью между повторениями

      ### 2. Движение
      1. На выдохе скрутитесь вниз, сокращая пресс и направляя локти к бёдрам
      2. Сосредоточьтесь на скручивании корпуса вперёд, а не на тяге руками
      3. Сильно сожмите пресс в нижней точке на 1–2 секунды
      4. Медленно и подконтрольно вернитесь в исходное положение, сохраняя натяжение
      5. Останавливайтесь чуть раньше, чем плитки коснутся стека, чтобы кор оставался под постоянной нагрузкой
      6. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Мощно выдыхайте, скручиваясь вниз и сокращая пресс
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите таз неподвижным на протяжении всего движения; двигаться должен только корпус
      - Думайте о том, чтобы приближать грудную клетку к тазу, а не просто наклоняться вперёд
      - Сохраняйте контролируемый темп; избегайте рывков и инерции
      - Не давайте весу отдыхать между повторениями, чтобы пресс оставался в напряжении
      - Руки должны сохранять фиксированное положение относительно головы

      ### 5. Частые ошибки
      - Тяга руками и плечами вместо сокращения пресса
      - Раскачивание таза вперёд-назад
      - Слишком быстрый темп и работа за счёт инерции
      - Полное опускание весового стека между повторениями
      - Слишком большой вес, из-за которого страдает техника
      - Чрезмерное разгибание позвоночника при возврате, что может перегрузить поясницу

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить технику и связь «мозг–мышца»
      - При дискомфорте в шее попробуйте держать канат на уровне груди, а не у головы
      - Продвинутый вариант: пауза 3–5 секунд в пиковом сокращении для большей интенсивности
      - Упрощение: выполняйте обычные скручивания с собственным весом, пока не разовьёте достаточную силу кора
    validated: false
    source_digest: b3ba6c257213
  Cable Twist:
    name: Повороты корпуса на блоке
    instructions: |
      ## Обзор
      Повороты корпуса на блоке — ротационное упражнение на кор, которое в первую очередь нагружает косые и поперечную мышцы живота. На протяжении всего вращения также работают прямая мышца живота и стабилизаторы таза, что делает упражнение эффективным для развития ротационной силы и стабильности кора.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте боком к блочному тренажёру, установив блок на уровне груди
      - Возьмитесь за рукоять обеими руками и отойдите от тренажёра, чтобы создать натяжение
      - Поставьте ноги на ширине плеч, слегка согнув колени
      - Вытяните руки перед грудью, сохраняя лёгкий сгиб в локтях
      - Напрягите мышцы кора и держите корпус вертикально

      ### 2. Движение
      1. Поверните корпус от тренажёра, вращаясь за счёт мышц кора
      2. Держите руки вытянутыми и двигайте их единым целым с корпусом
      3. Поворачивайтесь настолько, насколько комфортно, сохраняя контроль и вертикальное положение
      4. Ненадолго задержитесь в конечной точке поворота
      5. Медленно и подконтрольно вернитесь в исходное положение, сопротивляясь тяге троса
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Выдыхайте, поворачиваясь от тренажёра
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Начинайте движение с мышц кора, а не с рук или плеч
      - Держите таз направленным вперёд на протяжении всего движения
      - Сохраняйте стабильный низ тела, пока вращается верх
      - Двигайтесь медленно и подконтрольно, чтобы максимально включить кор
      - Сохраняйте натяжение троса во всей амплитуде

      ### 5. Частые ошибки
      - Работа за счёт инерции или размахивание весом вместо контролируемого вращения
      - Поворот таза вместе с корпусом
      - Сгибание или разгибание рук во время движения
      - Наклон назад или вперёд вместо вертикального положения корпуса
      - Слишком большой вес, из-за которого страдает техника
      - Слишком быстрые повороты без должного контроля

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить паттерн вращения
      - Новички могут выполнять повороты в половину амплитуды, пока не разовьют контроль
      - Продвинутый вариант: пауза 2–3 секунды в пике поворота для большей интенсивности
      - При дискомфорте в пояснице уменьшите амплитуду или вес
