  Deficit Deadlift (Barbell):
    name: Становая тяга с дефицитом (штанга)
    instructions: |
      ## Обзор
      Становая тяга с дефицитом со штангой — это продвинутое базовое упражнение, которое в первую очередь нагружает ягодичные мышцы, бицепс бедра и разгибатели позвоночника с увеличенной амплитудой. Оно также сильнее, чем классическая тяга, задействует квадрицепсы: возвышение под ногами повышает сложность и укрепляет нижнюю фазу движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте на возвышение высотой 2–8 см, стопы на ширине таза
      - Расположите штангу на полу над серединой стопы
      - Возьмитесь за гриф чуть шире ног прямым или разнохватом
      - Наклонитесь через тазобедренные суставы и согните колени глубже обычного, чтобы дотянуться до грифа
      - Держите грудь расправленной, спину ровной, плечи чуть впереди грифа

      ### 2. Движение
      1. Давите через пятки и одновременно разгибайте тазобедренные и коленные суставы
      2. Поднимаясь из более глубокого положения, держите гриф близко к телу
      3. Полностью выпрямитесь, разогнув таз и колени
      4. В верхней точке держите плечи отведёнными назад, грудь расправленной
      5. Опускайте гриф, отводя таз назад и сгибая колени
      6. Подконтрольно верните гриф на пол и повторите

      ### 3. Дыхание
      - Перед подъёмом сделайте глубокий вдох и напрягите мышцы кора
      - Задержите дыхание во время подъёма
      - Выдохните в верхней точке или при опускании грифа

      ### 4. Советы
      - Дефицит увеличивает амплитуду и сложность движения
      - Держите гриф близко к голеням и бёдрам на протяжении всего движения
      - Сосредоточьтесь на мощном срыве из нижнего положения
      - Используйте вес меньше, чем в классической становой тяге
      - Этот вариант развивает силу в самой трудной фазе подъёма

      ### 5. Частые ошибки
      - Слишком высокое возвышение для вашей мобильности
      - Округление поясницы из-за увеличенной амплитуды
      - Слишком высокое положение таза на старте как компенсация дефицита
      - Слишком большой вес в ущерб технике
      - Отклонение траектории грифа от тела
      - Потеря нейтрального положения позвоночника в нижней точке

      ### 6. Безопасность и модификации
      - Начинайте с дефицита 2–3 см и увеличивайте его постепенно
      - Используйте вес на 10–20% меньше, чем в классической становой тяге
      - Убедитесь, что вашей мобильности достаточно для увеличенной амплитуды
      - При дискомфорте в пояснице уменьшите высоту дефицита или вес
