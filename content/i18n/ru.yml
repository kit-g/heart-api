  Stretching:
    name: Растяжка
    instructions: |
      ## Обзор
      Растяжка — упражнение на гибкость, охватывающее многие группы мышц по всему телу. Она помогает улучшить подвижность, снять мышечное напряжение и ускорить восстановление, поэтому необходима для общей мобильности и профилактики травм.

      ## Техника выполнения
      ### 1. Исходное положение
      - Выберите удобное место с достаточным пространством для движения
      - Наденьте удобную, не сковывающую движения одежду
      - Начните с лёгкой разминки, чтобы разогреть мышцы
      - Уделите внимание зонам, которые ощущаются зажатыми или будут работать на тренировке

      ### 2. Движение
      1. Выберите растяжки для нужных групп мышц
      2. Медленно входите в каждую растяжку до ощущения лёгкого натяжения
      3. Удерживайте каждую растяжку 15-30 секунд без пружинящих движений
      4. Дышите глубоко и расслабляйтесь в каждом положении
      5. Медленно выходите из растяжки и переходите к следующей
      6. Продолжайте в течение нужного времени

      ### 3. Дыхание
      - Дышите медленно и глубоко на протяжении каждой растяжки
      - Выдыхайте, углубляясь в растяжку
      - Никогда не задерживайте дыхание во время растяжки

      ### 4. Советы
      - Растягивайтесь после тренировки, пока мышцы разогреты
      - Уделяйте внимание основным группам мышц и зажатым зонам
      - Растяжка должна быть комфортной, а не болезненной
      - Включайте растяжки и для верхней, и для нижней части тела
      - Регулярность важнее продолжительности

      ### 5. Частые ошибки
      - Пружинящие или рывковые движения во время растяжки
      - Растяжение до боли
      - Задержка дыхания во время растяжки
      - Слишком короткое удержание растяжек
      - Растяжка холодных мышц без разминки
      - Игнорирование отдельных групп мышц

      ### 6. Безопасность и модификации
      - Никогда не растягивайтесь до острой боли
      - При необходимости используйте йога-блоки или ремни
      - Снижайте интенсивность при восстановлении после травмы
      - Перед тренировкой предпочитайте динамическую растяжку, после — статическую
