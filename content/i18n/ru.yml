  Overhead Squat (Barbell):
    name: Приседания со штангой над головой
    instructions: |
      ## Обзор
      Приседания со штангой над головой — вспомогательное упражнение тяжёлой атлетики, нагружающее квадрицепсы, ягодичные мышцы и все мышцы кора. Оно также требует отличной мобильности и стабильности плеч, развивая силу всего тела, баланс и позицию приёма штанги в рывке.

      ## Техника выполнения
      ### 1. Исходное положение
      - Начните со штангой над головой, удерживая её широким рывковым хватом
      - Встаньте, стопы на ширине плеч, носки слегка развёрнуты
      - Полностью выпрямите руки, гриф над серединой стопы
      - Держите грудь вперёд, мышцы кора напряжёнными, взгляд направлен вперёд
      - Активно тянитесь плечами вверх, «толкая» гриф

      ### 2. Движение
      1. Начните присед, одновременно сгибая колени и тазобедренные суставы
      2. Опускаясь, держите гриф строго над серединой стопы
      3. Сохраняйте прямые руки и активные плечи на протяжении всего движения
      4. Опуститесь как минимум до параллели бёдер с полом
      5. Оттолкнитесь пятками и вернитесь в положение стоя
      6. Удерживайте штангу над головой стабильно на всём протяжении и повторите

      ### 3. Дыхание
      - Сделайте вдох перед опусканием
      - Задержите дыхание во время опускания и в нижней точке
      - Выдохните на подъёме

      ### 4. Советы
      - Упражнение требует отличной мобильности плеч и тазобедренных суставов
      - Гриф должен оставаться над серединой стопы на всём протяжении
      - Держите руки прямыми и постоянно «толкайте» гриф вверх
      - Начните с пластиковой трубы или пустого грифа, чтобы освоить движение
      - Упражнение формирует позицию приёма штанги в рывке

      ### 5. Частые ошибки
      - Сгибание рук во время приседа
      - Уход грифа вперёд или назад
      - Отсутствие активного давления плечами в гриф
      - Недостаточная мобильность таза или плеч для нужной глубины
      - Взгляд вниз вместо направленного вперёд
      - Попытка выполнения без подготовки мобильности

      ### 6. Безопасность и модификации
      - Освойте движение с пластиковой трубой, прежде чем добавлять вес
      - Отдельно работайте над мобильностью плеч и тазобедренных суставов
      - Осваивая упражнение с весом, используйте страхующего
      - Это обязательная подготовка к тренировке рывка
