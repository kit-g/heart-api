  Zercher Squat (Barbell):
    name: Приседания Зерхера (штанга)
    instructions: |
      ## Обзор
      Приседания Зерхера — продвинутое многосуставное упражнение, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и бицепс бедра. Оно также сильно вовлекает мышцы кора, верх спины и бицепсы; штанга, удерживаемая в локтевых сгибах, создаёт уникальную схему нагрузки, способствующую вертикальному положению корпуса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите штангу в стойках на высоте локтей
      - Подойдите под гриф и разместите его в локтевых сгибах
      - Сцепите ладони в замок перед грудью
      - Встаньте, поставив ноги на ширине плеч
      - Держите грудь расправленной, мышцы кора напряжёнными, локти прижатыми к корпусу

      ### 2. Движение
      1. Начните приседание, одновременно сгибая колени и тазобедренные суставы
      2. Держите корпус вертикально, а локти прижатыми на протяжении всего движения
      3. Опускайтесь, пока бёдра не окажутся как минимум параллельны полу
      4. Сохраняйте вертикальное положение корпуса, надёжно удерживая гриф в локтевых сгибах
      5. Оттолкнитесь пятками и вернитесь в положение стоя
      6. Полностью выпрямите тазобедренные суставы и колени в верхней точке, затем повторите

      ### 3. Дыхание
      - Перед опусканием сделайте глубокий вдох и напрягите мышцы кора
      - Задержите дыхание при опускании и в нижней точке
      - Выдохните на подъёме или в верхней точке

      ### 4. Советы
      - Фронтальное расположение веса заставляет держать корпус максимально вертикально
      - Держите локти прижатыми, чтобы гриф не соскальзывал
      - Для комфорта подложите в локтевые сгибы валик или полотенце
      - Этот вариант серьёзно нагружает мышцы кора и верх спины
      - Начинайте с небольшого веса, чтобы привыкнуть к необычному положению грифа

      ### 5. Частые ошибки
      - Гриф выскальзывает из локтевых сгибов
      - Чрезмерный наклон корпуса вперёд, несмотря на фронтальную нагрузку
      - Недостаточная глубина приседа
      - Разведение локтей в стороны
      - Слишком большой вес до освоения положения грифа
      - Потеря напряжения мышц кора

      ### 6. Безопасность и модификации
      - Начинайте с очень лёгкой штанги или даже тренировочного грифа
      - Подкладывайте в локтевые сгибы плотный валик или полотенце для комфорта
      - Это продвинутый вариант; сначала освойте фронтальные приседания
      - При дискомфорте уменьшите вес или выберите другой вариант приседаний
