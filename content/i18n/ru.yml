  Torso Rotation (Machine):
    name: Повороты корпуса (тренажёр)
    instructions: |
      ## Обзор
      Повороты корпуса в тренажёре — упражнение на кор с сопротивлением, которое в первую очередь нагружает косые мышцы живота и поперечную мышцу живота. Прямая мышца живота и глубокие стабилизаторы кора также работают в контролируемом ротационном движении, позволяя прогрессивно наращивать ротационную силу кора.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для поворотов корпуса, прижав спину к спинке
      - Отрегулируйте высоту сиденья так, чтобы ось вращения находилась на уровне середины корпуса
      - Поставьте стопы на упоры и зафиксируйте бёдра под валиками
      - Возьмитесь за рукояти на уровне груди с обеих сторон
      - Напрягите мышцы кора и сохраняйте вертикальную осанку

      ### 2. Движение
      1. Поверните корпус в одну сторону, сокращая косые мышцы живота
      2. Держите таз стабильным и направленным вперёд на протяжении всего движения
      3. Поворачивайтесь настолько, насколько позволяет тренажёр, сохраняя контроль
      4. Сделайте короткую паузу в конечной точке поворота
      5. Подконтрольно вернитесь в исходное центральное положение
      6. Выполните все повторения на одну сторону, затем перенастройте тренажёр и повторите на другую

      ### 3. Дыхание
      - Выдыхайте при повороте в сторону
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Поворачивайтесь за счёт мышц кора, а не тяните руками
      - Держите таз и нижнюю часть тела полностью неподвижными
      - Двигайтесь медленно и подконтрольно, чтобы максимально нагрузить косые мышцы
      - Сохраняйте вертикальную осанку на протяжении всего движения
      - Сохраняйте натяжение, не позволяя грузу ложиться на стек между повторениями

      ### 5. Частые ошибки
      - Слишком большой вес в ущерб технике
      - Поворот таза вместе с корпусом
      - Использование инерции и рывков
      - Тяга руками вместо поворота за счёт кора
      - Слишком быстрое движение по амплитуде
      - Наклон вперёд или назад вместо вертикального положения

      ### 6. Безопасность и модификации
      - Начните с лёгкого веса, чтобы освоить схему вращения
      - Выполняйте равное число повторений в обе стороны для сбалансированного развития
      - Продвинутый вариант: пауза 2–3 секунды в точке максимального поворота
      - При дискомфорте в пояснице уменьшите вес и следите за правильной техникой
