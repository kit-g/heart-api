      ### 2. Движение
      1. Поднимите руки в стороны, давя на подушки рычагов
      2. Поднимайте, пока руки не окажутся на уровне плеч
      3. Держите локти слегка согнутыми на протяжении всего движения
      4. Сделайте короткую паузу в верхней точке
      5. Медленно и подконтрольно опустите руки в исходное положение
      6. Остановитесь, не опуская грузы на стек, чтобы сохранить напряжение, и повторите

      ### 3. Дыхание
      - Делайте выдох, поднимая руки в стороны
      - Делайте вдох, опуская руки

      ### 4. Советы
      - Плотно прижимайте спину к спинке
      - Поднимайте за счёт средних дельт, а не трапеций
      - Контролируйте и фазу подъёма, и фазу опускания
      - Сохраняйте постоянное напряжение: не опускайте грузы на стек
      - Не пожимайте плечами во время движения

      ### 5. Частые ошибки
      - Отрыв спины от спинки во время подъёма
      - Пожимание плечами вместо изолированной работы дельт
      - Использование инерции вместо контролируемого движения
      - Опускание грузов на стек между повторениями
      - Подъём рук намного выше уровня плеч
      - Слишком быстрый темп повторений

      ### 6. Безопасность и модификации
