  Kipping Pull Up:
    name: Подтягивания киппингом
    instructions: |
      ## Обзор
      Подтягивания киппингом — динамичное тяговое упражнение с собственным весом, которое в первую очередь нагружает широчайшие мышцы спины за счёт использования инерции. В работу также включаются плечи, мышцы кора и сгибатели бедра благодаря скоординированному раскачиванию, что делает движение функциональным для кроссфита и атлетической подготовки.

      ## Техника выполнения
      ### 1. Исходное положение
      - Повисните на перекладине прямым хватом, руки чуть шире плеч
      - Полностью выпрямите тело, руки прямые
      - Напрягите мышцы кора и приготовьтесь начать раскачивание
      - Держите плечи в тонусе, не висите пассивно

      ### 2. Движение
      1. Создайте инерцию: подайте тело вперёд, а затем отведите его назад, прогнувшись в дугу
      2. Когда тело качнётся вперёд, подайте бёдра к перекладине
      3. Используйте восходящий импульс, чтобы подтянуть подбородок выше перекладины
      4. В верхней точке оттолкнитесь от перекладины, начиная следующий кип
      5. Позвольте телу качнуться назад в положение прогиба
      6. Повторяйте движение в плавном, непрерывном ритме

      ### 3. Дыхание
      - Дышите ритмично на протяжении всего непрерывного движения
      - Не задерживайте дыхание во время выполнения

      ### 4. Советы
      - Освойте строгие подтягивания, прежде чем переходить к киппингу
      - Создавайте инерцию бёдрами, а не только руками
      - Сохраняйте движение плавным и непрерывным
      - Думайте о движении как о скоординированном раскачивании всего тела
      - Отрабатывайте позиции «лодочка» и «дуга» по отдельности, прежде чем соединять их

      ### 5. Частые ошибки
      - Попытка выполнять киппинг без достаточной силы в строгих подтягиваниях
      - Чрезмерное неконтролируемое раскачивание
      - Отсутствие координации между подачей бёдер и тягой
      - Сбитый ритм между повторениями
      - Расслабление плеч в нижней точке
      - Выполнение киппинга без понимания правильной прогрессии

      ### 6. Безопасность и модификации
      - Создайте базу из 5-10 строгих подтягиваний, прежде чем осваивать киппинг
      - Отрабатывайте раскачивания в «лодочке» и «дуге» по отдельности
      - Используйте гравитрон, чтобы наработать базовую силу
      - Осваивайте механику киппинга под руководством тренера
