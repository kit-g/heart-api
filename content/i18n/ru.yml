  Landmine Press:
    name: Ландмайн-жим
    instructions: |
      ## Обзор
      Ландмайн-жим — жимовое упражнение, которое в первую очередь нагружает плечи, особенно передние дельты. Ему помогают трицепсы, верх груди и мышцы кора, а дуговая траектория закреплённой штанги делает его более щадящей для плеч альтернативой строгому жиму над головой.

      ## Техника выполнения
      ### 1. Исходное положение
      - Закрепите один конец штанги в креплении «ландмайн» или в углу
      - Встаньте лицом к грифу, ноги на ширине плеч
      - Держите свободный конец грифа на уровне плеча обеими руками или одной рукой для одностороннего варианта
      - Напрягите мышцы кора и не задирайте рёбра

      ### 2. Движение
      1. Выжмите гриф вверх и вперёд по его естественной дуге
      2. Продолжайте до полного выпрямления рук
      3. Сделайте короткую паузу в верхней точке
      4. Подконтрольно опустите гриф обратно на уровень плеча
      5. Выполните нужное количество контролируемых повторений; если жмёте одной рукой, повторите на другую сторону

      ### 3. Дыхание
      - Делайте выдох на жиме
      - Делайте вдох на опускании

      ### 4. Советы
      - Держите всё тело в напряжении; не допускайте прогиба в пояснице
      - Жмите по дуге грифа, а не боритесь с ней
      - Отставьте одну ногу немного назад для более устойчивой стойки

      ### 5. Частые ошибки
      - Прогиб в спине, чтобы дожать вес
      - Подъём плеча к уху
      - Слишком большое или слишком маленькое расстояние до закреплённого конца

      ### 6. Безопасность и модификации
      - Встаньте на одно или оба колена, чтобы исключить работу ног
      - Начинайте с пустого грифа: закреплённый конец и так снижает нагрузку
