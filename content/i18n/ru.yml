  Donkey Kick (Smith Machine):
    name: Махи ногой назад на четвереньках (машина Смита)
    instructions: |
      ## Обзор
      Махи ногой назад на четвереньках в машине Смита — это изолирующее упражнение, которое в первую очередь нагружает ягодичные мышцы. Оно также задействует бицепс бедра: фиксированная вертикальная траектория грифа обеспечивает стабильное сопротивление при разгибании бедра.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте на четвереньки под грифом машины Смита
      - Упритесь подошвой одной стопы в гриф снизу
      - Расположите кисти строго под плечами, колено — под тазобедренным суставом
      - Держите мышцы кора напряжёнными, спину ровной
      - Установите гриф на подходящей стартовой высоте

      ### 2. Движение
      1. Выжимайте гриф стопой вверх, разгибая бедро
      2. Держите колено согнутым под углом 90 градусов на протяжении всего движения
      3. Продолжайте, пока бедро не окажется на одной линии с корпусом или чуть выше
      4. Сильно сожмите ягодичную мышцу в верхней точке движения
      5. Медленно и подконтрольно опустите гриф в исходное положение
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Выдох при выжимании грифа вверх
      - Вдох при опускании грифа

      ### 4. Советы
      - Держите мышцы кора напряжёнными, а спину ровной на протяжении всего движения
      - Сосредоточьтесь на том, чтобы движение выполняла ягодичная мышца
      - Сохраняйте угол 90 градусов в колене
      - Избегайте чрезмерного прогиба в пояснице
      - Держите таз параллельно полу

      ### 5. Частые ошибки
      - Чрезмерный прогиб в пояснице ради большей высоты
      - Вращение таза вместо удержания его параллельно полу
      - Работа за счёт инерции вместо контролируемого сокращения ягодичной мышцы
      - Выпрямление рабочей ноги во время движения
      - Неполное разгибание бедра
      - Слишком быстрый темп повторений

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса или пустого грифа, чтобы освоить движение
      - Отрегулируйте стартовую высоту грифа под комфортную амплитуду
      - Подложите что-нибудь мягкое под опорное колено
      - Усложнённый вариант: задерживайтесь на 2–3 секунды в верхней точке каждого повторения
