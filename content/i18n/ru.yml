  Jump Rope:
    name: Скакалка
    instructions: |
      ## Обзор
      Прыжки со скакалкой — это высокоинтенсивное кардиоупражнение, которое задействует икры, плечи и сердечно-сосудистую систему. Оно развивает координацию, ловкость, выносливость и обеспечивает эффективную нагрузку на всё тело при минимуме инвентаря.

      ## Техника выполнения
      ### 1. Исходное положение
      - Держите рукоятки скакалки на уровне бёдер
      - Расположите скакалку за пятками
      - Встаньте, поставив стопы вместе или чуть врозь
      - Держите локти близко к корпусу
      - Сохраняйте прямую осанку, мышцы кора напряжены

      ### 2. Движение
      1. Вращайте скакалку над головой движением кистей
      2. Перепрыгивайте через скакалку обеими ногами, когда она проходит под вами
      3. Мягко приземляйтесь на подушечки стоп
      4. Прыгайте невысоко — ровно настолько, чтобы пропустить скакалку
      5. Поддерживайте равномерный ритм
      6. Продолжайте в течение нужного времени или количества повторений

      ### 3. Дыхание
      - Дышите ритмично и равномерно на протяжении всего упражнения
      - Найдите ритм дыхания, совпадающий с ритмом прыжков
      - Не задерживайте дыхание

      ### 4. Советы
      - Вращайте скакалку кистями, а не руками
      - Делайте прыжки низкими и экономными
      - Приземляйтесь мягко, чтобы снизить ударную нагрузку на суставы
      - Начинайте с коротких интервалов и постепенно наращивайте выносливость
      - Разные техники (на одной ноге, двойные прыжки) добавят разнообразия

      ### 5. Частые ошибки
      - Излишне высокие прыжки
      - Вращение скакалки руками, а не кистями
      - Слишком жёсткое приземление на пятки
      - Рукоятки удерживаются слишком далеко от корпуса
      - Плохая осанка с округлёнными плечами
      - Длина скакалки не отрегулирована под рост

      ### 6. Безопасность и модификации
      - Отрегулируйте длину скакалки под свой рост
      - Начинайте с базовых прыжков и постепенно переходите к вариациям
      - Занимайтесь на подходящей поверхности (не на бетоне)
      - Носите спортивную обувь с хорошей поддержкой
    validated: false
    source_digest: cba52d158006
  Rowing (Machine):
    name: Гребной тренажёр
    instructions: |
      ## Обзор
      Гребной тренажёр — это кардиоупражнение на всё тело, которое задействует ноги, спину, мышцы кора и руки. Он обеспечивает низкоударную аэробную нагрузку, одновременно развивая силу и выносливость: гребковое движение включает в работу примерно 85% мышц тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на тренажёр, зафиксировав стопы ремнями
      - Возьмитесь за рукоятку прямым хватом
      - Начинайте с вертикальным положением голеней и лёгким наклоном корпуса вперёд
      - Держите спину прямой, мышцы кора напряжены
      - Руки выпрямлены и тянутся к рукоятке

      ### 2. Движение
      1. Оттолкнитесь ногами, начиная тягу
      2. Когда ноги выпрямятся, слегка отклонитесь назад и подтяните рукоятку к груди
      3. Выполните движение в обратном порядке: выпрямите руки, наклонитесь вперёд, согните колени
      4. Поддерживайте плавный, непрерывный ритм
      5. Тяга должна быть мощной, возврат — контролируемым
      6. Продолжайте грести нужное время или дистанцию

      ### 3. Дыхание
      - Выдыхайте во время тяги (силовой фазы)
      - Вдыхайте во время возврата

      ### 4. Советы
      - Мощность создают ноги (60%), затем кор (20%) и руки (20%)
      - Сохраняйте правильную осанку на протяжении всего гребка
      - Ведите рукоятку плавно и равномерно
      - Стремитесь к стабильному темпу (20–30 гребков в минуту)
      - Следите за дисплеем, чтобы контролировать темп и мощность

      ### 5. Частые ошибки
      - Работа только руками вместо ног
      - Округление спины во время гребка
      - Тяга согнутыми руками до выпрямления ног
      - Слишком сильный хват рукоятки
      - Слишком быстрая фаза возврата
      - Чрезмерное отклонение назад в конце гребка

      ### 6. Безопасность и модификации
      - Начинайте с коротких сессий, чтобы освоить правильную технику
      - Отрегулируйте положение ремней для стоп для удобства
      - Уменьшайте сопротивление (положение заслонки) для длительных сессий
      - Это отличное низкоударное кардио для всего тела
    validated: false
    source_digest: bb6a56898a2a
  Running:
    name: Бег
    instructions: |
      ## Обзор
      Бег — это высокоударное кардиоупражнение, которое в первую очередь задействует ноги и сердечно-сосудистую систему. Он развивает выносливость, эффективно сжигает калории, укрепляет кости и благотворно влияет на психическое здоровье, требуя при этом минимума экипировки.

      ## Техника выполнения
