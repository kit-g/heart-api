      - Наклонитесь вперёд через тазобедренные суставы, корпус под углом около 45 градусов
      - Согните локоть рабочей руки до 90 градусов и прижмите его к боку
      - Свободную руку положите на бедро или обопритесь на тренажёр
      - Напрягите мышцы кора для стабильности

      ### 2. Движение
      1. Отведите руку назад, выпрямляя локоть
      2. Держите плечевую часть руки неподвижной и параллельной полу
      3. Продолжайте движение, пока рука полностью не выпрямится позади вас
      4. Сделайте паузу и сожмите трицепс в точке полного выпрямления
      5. Медленно и подконтрольно вернитесь в исходное положение
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Выдыхайте, разгибая руку назад
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите плечевую часть руки полностью неподвижной на протяжении всего движения
      - Изолируйте трицепс, двигаясь только в локтевом суставе
      - Сохраняйте стабильное положение корпуса, не раскачивайтесь вперёд-назад
      - Сильно сжимайте трицепс в точке полного выпрямления
      - Сохраняйте натяжение троса на протяжении всего движения

      ### 5. Частые ошибки
      - Движение плечевой части руки во время разгибания
      - Мах рукой и использование инерции
      - Неполное выпрямление локтя в конечной точке
      - Раскачивание корпуса вперёд-назад
      - Слишком большой вес в ущерб технике
      - Провисание троса в любой точке движения

      ### 6. Безопасность и модификации
