  Kettlebell Turkish Get Up:
    name: Турецкий подъём (гиря)
    instructions: |
      ## Обзор
      Турецкий подъём — комплексное движение на всё тело, нацеленное на плечи, мышцы кора и ноги. Из положения лёжа вы поднимаетесь в положение стоя, удерживая гирю над головой; упражнение развивает стабильность плеча, силу кора, координацию и контроль над всем телом.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину, гиря рядом с правым плечом
      - Возьмите гирю правой рукой и выжмите её над собой
      - Согните правое колено, стопа стоит на полу
      - Левую руку положите на пол под углом 45 градусов
      - Всё время смотрите на гирю

      ### 2. Движение
      1. Перекатитесь на левый локоть, удерживая гирю над собой
      2. Выйдите в упор на левую ладонь
      3. Поднимите таз от пола в положение моста
      4. Проведите левую ногу назад под собой в положение на колене
      5. Встаньте из положения на колене
      6. Выполните все шаги в обратном порядке, вернувшись в исходное положение, затем повторите на другую сторону

      ### 3. Дыхание
      - Дышите равномерно на протяжении всего многоэтапного движения
      - Никогда не задерживайте дыхание ни в одной из фаз

      ### 4. Советы
      - Это очень техничное движение, требующее практики
      - Всё время держите гирю в поле зрения
      - Двигайтесь медленно и осознанно в каждой фазе
      - Каждый шаг должен быть чётким и контролируемым
      - Освойте движение без веса, прежде чем брать гирю

      ### 5. Частые ошибки
      - Слишком быстрое прохождение фаз
      - Взгляд не направлен на гирю
      - Сгибание руки, удерживающей гирю
      - Неправильная последовательность шагов движения
      - Слишком большой вес на раннем этапе
      - Потеря стабильности плеча по ходу движения

      ### 6. Безопасность и модификации
      - Сначала выучите движение без веса
      - Разбейте движение на фазы и отрабатывайте каждую отдельно
      - Начинайте с очень лёгкой гири
      - На начальном этапе имеет смысл позаниматься с квалифицированным инструктором
