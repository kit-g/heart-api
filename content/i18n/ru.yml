  Seated Calf Raise (Machine):
    name: Подъёмы на носки сидя (тренажёр)
    instructions: |
      ## Обзор
      Подъёмы на носки сидя — изолирующее упражнение, которое в первую очередь нагружает камбаловидную мышцу голени. Оно также задействует икроножную мышцу: положение сидя с согнутыми коленями смещает акцент на камбаловидную мышцу для полноценного развития икр.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для подъёмов на носки сидя, валик должен лежать на нижней части бёдер
      - Поставьте подушечки стоп на платформу, пятки свисают
      - Отрегулируйте высоту валика так, чтобы он удобно лежал на бёдрах
      - Снимите предохранительный рычаг
      - Держите колени согнутыми под углом 90 градусов на протяжении всего упражнения

      ### 2. Движение
      1. Опустите пятки, сгибая голеностопы как можно ниже
      2. Позвольте икрам полностью растянуться в нижней точке
      3. Сделайте короткую паузу в положении растяжения
      4. Поднимите пятки как можно выше, отталкиваясь подушечками стоп
      5. Сильно напрягите икры в верхней точке
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опуская пятки
      - Выдыхайте, поднимаясь на носки

      ### 4. Советы
      - Держите колени неподвижными и согнутыми на протяжении всего упражнения
      - Положение сидя акцентирует нагрузку на камбаловидной мышце
      - Работайте в полной амплитуде: от глубокого растяжения до максимального сокращения
      - Сосредоточьтесь на напряжении икр в верхней точке
      - Контролируйте вес в обеих фазах движения

      ### 5. Частые ошибки
      - Неполная амплитуда в верхней или нижней точке
      - Пружинящие движения в нижней точке вместо контролируемого растяжения
      - Слишком большой вес в ущерб технике
      - Слишком быстрый темп выполнения повторений
      - Отсутствие пикового сокращения в верхней точке
      - Разгибание или движение коленей во время упражнения

      ### 6. Безопасность и модификации
      - Отрегулируйте высоту валика для комфорта и правильного положения
      - Меняйте положение стоп (нейтрально, носки внутрь, носки наружу) для полноценного развития икр
      - Сочетайте с подъёмами на носки стоя для комплексной тренировки икр
      - Продвинутый вариант: задерживайтесь на 2–3 секунды в точке пикового сокращения
