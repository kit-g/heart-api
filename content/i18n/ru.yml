  Thruster (Barbell):
    name: Трастер (штанга)
    instructions: |
      ## Обзор
      Трастер со штангой — комплексное упражнение на всё тело, объединяющее фронтальный присед с жимом над головой. Оно нацелено прежде всего на ноги, плечи и мышцы кора: одно непрерывное взрывное движение развивает мощность, выносливость и силу всего тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Держите штангу во фронтальной позиции на уровне плеч
      - Встаньте, ноги на ширине плеч
      - Держите локти высоко, грудь поднятой
      - Держите мышцы кора напряжёнными на протяжении всего движения

      ### 2. Движение
      1. Опуститесь во фронтальный присед до параллели бёдер с полом или ниже
      2. Взрывно встаньте из приседа
      3. Используя инерцию, выжмите штангу над головой, выпрямляясь
      4. Полностью выпрямите руки со штангой над головой
      5. Опустите штангу обратно во фронтальную позицию
      6. Сразу опуститесь в следующий присед и повторите

      ### 3. Дыхание
      - Вдыхайте, опускаясь в присед
      - Мощно выдыхайте, вставая и выжимая штангу

      ### 4. Советы
      - Используйте толчок ногами, чтобы помочь выжать штангу над головой
      - Движение должно быть плавным и непрерывным
      - Держите корпус вертикально во время приседа
      - Это одно из самых энергозатратных упражнений на всё тело
      - Начинайте с лёгкого веса, чтобы освоить координацию

      ### 5. Частые ошибки
      - Жим без помощи ног
      - Пауза между приседом и жимом
      - «Заваливание» груди во время приседа
      - Неполное выпрямление рук над головой
      - Плохая фронтальная позиция с опущенными локтями
      - Слишком большой вес до освоения техники

      ### 6. Безопасность и модификации
      - Сначала отдельно освойте фронтальные приседания и жим над головой
      - Начинайте с пустого грифа или лёгких гантелей
      - Упражнение популярно в кроссфите и метаболических тренировках
      - Снижайте вес для многоповторных подходов на выносливость
