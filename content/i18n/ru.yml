    instructions: |
      ## Обзор
      Махи в стороны в тренажёре — изолирующее упражнение, которое в первую очередь нагружает средние дельты. Оно также задействует верхнюю часть трапеций: заданная траектория тренажёра обеспечивает стабильную нагрузку и постоянство техники для развития ширины плеч.

      ## Техника выполнения
