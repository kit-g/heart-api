  Curtsey Lunges (Barbell):
    name: Выпады «реверанс» (штанга)
    instructions: |
      ## Обзор
      Выпады «реверанс» — унилатеральное упражнение для нижней части тела, которое в первую очередь нагружает ягодичные мышцы, квадрицепсы и отводящие мышцы бедра. В работу также включаются мышцы кора и стабилизаторы; диагональный шаг назад акцентирует нагрузку на ягодичных мышцах и внешней поверхности бёдер.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, поставив ноги на ширине таза, с гантелями вдоль тела
      - Держите грудь расправленной, мышцы кора напряжёнными, взгляд направьте вперёд
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Шагните одной ногой назад и накрест за опорную ногу, как в реверансе
      2. Опустите таз, сгибая оба колена
      3. Продолжайте опускаться, пока бедро передней ноги не окажется почти параллельно полу
      4. Держите грудь расправленной, а корпус вертикально
      5. Оттолкнитесь пяткой передней ноги и вернитесь в положение стоя
      6. Повторяйте на ту же ногу или чередуйте ноги нужное число повторений

      ### 3. Дыхание
      - Вдох — при шаге назад и опускании
      - Выдох — при возвращении в положение стоя

      ### 4. Советы
      - Диагональный шаг акцентирует нагрузку на ягодичных мышцах и внешней поверхности бёдер
      - Держите корпус вертикально на протяжении всего движения
      - Сосредоточьтесь на равновесии и контроле во время шага накрест
      - Отталкивайтесь пяткой передней ноги при возвращении в положение стоя
      - Пусть гантели свободно висят вдоль тела

      ### 5. Частые ошибки
      - Чрезмерный наклон корпуса вперёд во время выпада
      - Переднее колено заваливается внутрь
      - Недостаточно глубокий шаг назад и накрест
      - Недостаточная глубина
      - Потеря равновесия во время диагонального шага
      - Использование инерции вместо контролируемого движения

      ### 6. Безопасность и модификации
      - Начинайте с собственного веса, чтобы освоить диагональный шаг
      - На первых порах держитесь за опору для равновесия
      - Добавляя вес, начинайте с лёгких гантелей
      - Продвинутый вариант: увеличьте вес гантелей или добавьте пружинящее движение в нижней точке
