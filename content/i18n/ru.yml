  Triceps Dip (Assisted):
    name: Отжимания на брусьях (гравитрон)
    instructions: |
      ## Обзор
      Отжимания на брусьях в гравитроне — упражнение в тренажёре, которое в первую очередь нагружает трицепсы с поддержкой. В работу также включаются грудные мышцы и передние дельты; противовес делает движение доступнее и помогает наращивать силу для отжиманий без поддержки.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите вес на гравитроне (чем больше вес, тем больше помощь)
      - Встаньте на платформу и возьмитесь за рукояти
      - Поставьте колени или стопы на подушку противовеса
      - Начинайте с полностью выпрямленных рук и вертикального корпуса
      - Напрягите мышцы кора и опустите плечи вниз

      ### 2. Движение
      1. Опуститесь, сгибая локти примерно до 90 градусов
      2. Направляйте локти назад, корпус держите по возможности вертикально
      3. Сохраняйте контроль, пока подушка противовеса поддерживает ваш вес
      4. Сделайте короткую паузу в нижней точке
      5. Отталкиваясь ладонями, выпрямите руки и вернитесь в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опускаясь вниз
      - Выдыхайте, отжимаясь в исходное положение

      ### 4. Советы
      - Держите корпус по возможности вертикально для максимального включения трицепсов
      - По мере роста силы постепенно уменьшайте вес противовеса
      - Сосредоточьтесь на контролируемом движении по всей амплитуде
      - Держите локти достаточно близко к корпусу
      - Не полагайтесь на помощь тренажёра слишком сильно

      ### 5. Частые ошибки
      - Слишком большая помощь противовеса и недостаточная нагрузка
      - Чрезмерный наклон вперёд, смещающий нагрузку на грудь
      - Чрезмерное разведение локтей в стороны
      - Работа за счёт инерции вместо контролируемого движения
      - Неполная амплитуда движения
      - Сведение плеч вперёд с округлением

      ### 6. Безопасность и модификации
      - Начинайте с большей помощи и постепенно уменьшайте её по мере роста силы
