  Push Press:
    name: Швунг жимовой
    instructions: |
      ## Обзор
      Швунг жимовой — базовое упражнение на развитие мощности, которое в первую очередь нагружает дельты с подключением ног. Оно также задействует трицепсы, верх груди, квадрицепсы и мышцы кора: взрывной посыл ногами позволяет выжимать над головой больший вес, чем строгий жим.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, поставив ноги на ширине плеч; штанга на стойках на уровне верха груди
      - Возьмите гриф чуть шире плеч, ладони направлены вперёд
      - Снимите штангу со стоек и держите её на уровне плеч
      - Держите грудь расправленной, мышцы кора напряжёнными, локти слегка выведенными вперёд
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Выполните небольшой подсед, сгибая колени и тазобедренные суставы
      2. Взрывным движением выпрямите ноги, одновременно выжимая штангу над головой
      3. Используйте импульс от ног, чтобы помочь выжать штангу
      4. Продолжайте жать до полного выпрямления рук
      5. Полностью выпрямите локти в верхней точке, штанга — над головой
      6. Подконтрольно опустите штангу обратно на уровень плеч и повторите

      ### 3. Дыхание
      - Делайте вдох во время подседа
      - Мощно выдыхайте во время посыла и жима

      ### 4. Советы
      - Посыл ногами должен быть взрывным и мощным
      - Синхронизируйте посыл ног с жимом рук для максимальной эффективности
      - Держите мышцы кора напряжёнными на протяжении всего движения
      - Упражнение позволяет работать с большим весом, чем строгий жим
      - Сосредоточьтесь на слаженной работе ног и рук

      ### 5. Частые ошибки
      - Слишком глубокий или слишком мелкий подсед
      - Несогласованность посыла ног и жима рук
      - Жим вперёд вместо строго вверх
      - Чрезмерный прогиб в пояснице
      - Неполное выпрямление рук в верхней точке
