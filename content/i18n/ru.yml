      3. Приземляйтесь на подушечку стопы и сразу подскакивайте на другой ноге
      4. Продолжайте чередовать ноги взрывными, подчёркнутыми подскоками
      5. С каждым подскоком поднимайте колени как можно выше
      6. Держите ритм и продолжайте нужное количество повторений или времени

      ### 4. Советы
