  High Row (Machine):
    name: Тяга сверху (тренажёр)
    instructions: |
      ## Обзор
      Тяга сверху в тренажёре — тяговое упражнение, которое в первую очередь нагружает спину, особенно широчайшие. Тяга из верхнего положения вниз и назад также включает задние дельты и бицепсы, а упор для груди поддерживает корпус на протяжении всего движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Отрегулируйте сиденье так, чтобы рукояти находились выше уровня плеч
      - Сядьте, плотно прижав грудь к упору
      - Потянитесь вверх и возьмитесь за рукояти обеими руками
      - Поставьте стопы всей поверхностью на пол

      ### 2. Движение
      1. Потяните рукояти вниз и назад к верхней части груди
      2. Ведите локти вниз и назад за спину
      3. В конечной точке тяги сведите лопатки
      4. Медленно и подконтрольно верните рукояти в исходное положение
      5. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте во время тяги
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите грудь прижатой к упору на протяжении всего подхода
      - Ведите тягу локтями, а не кистями
      - Полностью выпрямляйте руки между повторениями, чтобы работать в полной амплитуде

      ### 5. Частые ошибки
      - Отклонение назад и подъём веса рывком
      - Тяга только руками без движения лопаток
      - Плитки грузового стека ударяются друг о друга между повторениями

      ### 6. Безопасность и модификации
      - Начните с лёгкого веса, чтобы подобрать высоту сиденья под длину рук
      - Тяга одной рукой — полезный вариант для устранения асимметрии
