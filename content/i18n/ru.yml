  Deadlift (Dumbbell):
    name: Становая тяга (гантели)
    instructions: |
      ## Обзор
      Становая тяга с гантелями — это базовое упражнение, которое в первую очередь нагружает ягодичные мышцы, бицепс бедра и разгибатели позвоночника. Оно также задействует квадрицепсы, широчайшие, трапеции и мышцы хвата: гантели позволяют рукам двигаться независимо и обеспечивают более естественное положение кистей, чем штанга.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, стопы на ширине таза, гантели на полу по бокам от стоп
      - Наклонитесь через тазобедренные суставы и согните колени, чтобы взять гантели
      - Держите гантели нейтральным или прямым хватом
      - Держите грудь расправленной, спину ровной, плечи чуть впереди гантелей
      - Перед подъёмом напрягите мышцы кора и широчайшие

      ### 2. Движение
      1. Давите через пятки и одновременно разгибайте тазобедренные и коленные суставы
      2. Во время подъёма держите гантели близко к телу
      3. Полностью выпрямитесь, разогнув таз и колени
      4. В верхней точке держите плечи отведёнными назад, грудь расправленной
      5. Опускайте гантели, отводя таз назад и сгибая колени
      6. Подконтрольно верните гантели на пол и повторите

      ### 3. Дыхание
      - Перед подъёмом сделайте глубокий вдох и напрягите мышцы кора
      - Задержите дыхание во время подъёма
      - Выдохните в верхней точке или при опускании гантелей

      ### 4. Советы
      - Держите гантели близко к голеням и бёдрам на протяжении всего движения
      - Вставая, ведите движение грудью
      - Сохраняйте нейтральное положение позвоночника, избегая округления и переразгибания
      - Нейтральный хват для многих более комфортен
      - Думайте о том, что вы отталкиваете пол, а не поднимаете гантели

      ### 5. Частые ошибки
      - Округление поясницы во время подъёма
      - Слишком высокое или слишком низкое положение таза на старте
      - Отведение гантелей от тела
      - Неполное разгибание таза в верхней точке
      - Взгляд вверх или вниз вместо нейтрального положения шеи
      - Тяга руками вместо работы ног и таза

      ### 6. Безопасность и модификации
      - Начинайте с умеренного веса гантелей, чтобы отработать правильную технику
      - Если хват ограничивает, используйте лямки
      - Усложнённый вариант: выполняйте становую тягу с гантелями на одной ноге
      - При дискомфорте в пояснице снизьте вес и проверьте технику
