  Heart Pump:
    name: Heart Pump
    instructions: |
      ## Обзор
      Heart Pump — динамичное упражнение с гантелями, которое в первую очередь нагружает бицепсы и предплечья за счёт непрерывных пампинговых движений. В работу также включаются плечи и хват; ритмичный характер движения поддерживает постоянное напряжение и развивает мышечную выносливость.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, гантели по бокам
      - Держите локти прижатыми к корпусу, мышцы кора напряжены
      - Гантели в нейтральном хвате (ладони обращены к корпусу)
      - Сохраняйте прямую осанку, плечи отведены назад
      - Настройтесь на непрерывное движение без пауз

      ### 2. Движение
      1. Одновременно поднимайте обе гантели короткими быстрыми импульсами
      2. Работайте в частичной амплитуде — от середины движения почти до верхней точки
      3. Держите локти неподвижными и сохраняйте постоянное напряжение
      4. Продолжайте ритмичный пампинг в течение заданного времени или количества повторений
      5. Следите, чтобы движение оставалось контролируемым и непрерывным
      6. В конце опустите гантели в исходное положение

      ### 3. Дыхание
      - Дышите ровно и естественно на протяжении всего непрерывного движения
      - Не задерживайте дыхание; сохраняйте постоянный дыхательный ритм

      ### 4. Советы
      - Двигайтесь быстро, но контролируемо, без рывков
      - Поддерживайте постоянное напряжение в бицепсах
      - Сосредоточьтесь на ощущении пампа и жжения в руках
      - Держите мышцы кора напряжёнными, чтобы не раскачиваться
      - Из-за непрерывного характера упражнения берите вес легче, чем для обычных сгибаний

      ### 5. Частые ошибки
      - Слишком большой вес и потеря ритма пампинга
      - Раскачивание корпуса или использование инерции
      - Работа в полной амплитуде вместо сфокусированных частичных импульсов
      - Уход локтей вперёд
      - Задержка дыхания во время упражнения
      - Паузы или отдых внутри подхода

      ### 6. Безопасность и модификации
      - Начинайте с лёгких гантелей, чтобы освоить непрерывное пампинговое движение
      - При чрезмерной усталости сократите продолжительность
      - Усложнённый вариант: увеличьте темп или добавьте паузы в разных точках амплитуды
      - Выполняйте сидя, чтобы исключить инерцию нижней части тела
