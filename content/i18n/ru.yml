  Hang Snatch (Barbell):
    name: Рывок с виса (штанга)
    instructions: |
      ## Обзор
      Рывок с виса — тяжелоатлетический вариант, нагружающий всё тело с акцентом на взрывную мощность. Движение начинается из положения стоя и требует поднять штангу от бёдер над головой одним слитным движением, развивая координацию и мощность всего тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте со штангой в руках широким рывковым хватом
      - Гриф на уровне середины бедра, стопы на ширине таза
      - Держите грудь вперёд, спину ровной, мышцы кора напряжёнными
      - Слегка наклонитесь через тазобедренные суставы, колени согнуты
      - Руки прямые, хват широкий

      ### 2. Движение
      1. Подконтрольно опустите гриф чуть ниже коленей
      2. Взрывно разогнитесь в тазобедренных и коленных суставах, как в прыжке
      3. Уходите под штангу, пока она поднимается
      4. Примите штангу над головой в полном приседе или в высокой стойке
      5. Полностью встаньте с зафиксированной над головой штангой
      6. Опустите гриф в положение виса и повторите

      ### 3. Дыхание
      - Вдыхайте во время опускания грифа
      - Задержите дыхание на протяжении взрывной тяги и приёма
      - Выдохните после вставания со штангой над головой

      ### 4. Советы
      - Широкий хват сокращает путь грифа
      - Это одно из самых технически сложных тяжелоатлетических движений
      - Держите гриф близко к телу во время тяги
      - Принимайте штангу на прямые руки, гриф над серединой стопы
      - Освойте положение виса, прежде чем переходить к полным рывкам

      ### 5. Частые ошибки
      - Слишком узкий хват
      - Тяга руками до полного разгибания таза
      - Дожим штанги вместо ухода под неё
      - Приземление со слишком широкой постановкой стоп или в неправильную позицию
      - Неполное выпрямление рук над головой
      - Попытка выполнения без достаточной мобильности и технической подготовки

      ### 6. Безопасность и модификации
      - Требуется серьёзная работа с квалифицированным тренером
      - Сначала освойте мышечный рывок и приседания со штангой над головой
      - Используйте бамперные блины и тяжелоатлетический помост
      - Повышайте вес очень постепенно
