      - Держите таз прижатым к скамье

      ### 2. Движение
      1. Согните ноги в коленях, поднимая валик
      2. Продолжайте, пока валик почти не коснётся ягодиц
      3. В точке полного сгибания сделайте паузу и напрягите бицепс бедра
      4. Медленно и подконтрольно верните вес в исходное положение
      5. Останавливайтесь чуть раньше, чем плитки коснутся стека, чтобы сохранить напряжение
      6. Повторите нужное количество контролируемых повторений

