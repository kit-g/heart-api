  Push Up:
    name: Отжимания
    instructions: |
      ## Обзор
      Отжимания — жимовое упражнение с собственным весом, которое в первую очередь нагружает большую грудную мышцу. В работу также включаются передние дельты, трицепсы и мышцы кора, что делает отжимания одним из самых эффективных и универсальных упражнений для развития силы и выносливости верха тела.

      ## Техника выполнения
      ### 1. Исходное положение
      - Примите упор лёжа, поставив руки чуть шире плеч
      - Расположите кисти строго под плечами
      - Держите тело прямой линией от головы до пят
      - Напрягите мышцы кора и ягодичные мышцы
      - Стопы держите вместе или на ширине таза

      ### 2. Движение
      1. Опустите тело, сгибая локти
      2. Держите локти под углом примерно 45 градусов к корпусу
      3. Опускайтесь, пока грудь почти не коснётся пола
      4. Сделайте короткую паузу в нижней точке
      5. Оттолкнитесь ладонями от пола, выпрямляя руки, и вернитесь в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдох — опуская тело вниз
      - Выдох — отжимаясь в исходное положение

      ### 4. Советы
      - Сохраняйте прямую линию тела от головы до пят на протяжении всего упражнения
      - Держите мышцы кора и ягодичные напряжёнными, чтобы таз не провисал
      - Контролируйте движение в обе стороны
      - Держите шею в нейтральном положении, глядя чуть впереди кистей
      - Работайте в полной амплитуде: от груди у пола до полностью выпрямленных рук

      ### 5. Частые ошибки
      - Провисание таза или подъём его вверх «домиком»
      - Чрезмерное разведение локтей в стороны
      - Неполная амплитуда движения
      - Опускание головы или взгляд вниз
      - Использование инерции вместо контролируемого движения
      - Задержка дыхания во время движения

      ### 6. Безопасность и модификации
      - Если классические отжимания пока слишком сложны, начните с отжиманий с колен
      - Для облегчённого варианта поставьте руки на скамью или обопритесь о стену
      - Усложнённый вариант: добавьте вес с помощью жилета-утяжелителя или ленты через спину
      - Пробуйте разные положения рук (широкое, узкое, «алмаз») для разнообразия
