  Incline Row (Dumbbell):
    name: Тяга гантелей лёжа на наклонной скамье
    instructions: |
      ## Обзор
      Тяга гантелей лёжа на наклонной скамье — тяговое упражнение с опорой грудью, которое в первую очередь нагружает широчайшие, ромбовидные мышцы и среднюю часть трапеций. Также работают бицепсы и задние дельты: наклонная скамья снимает нагрузку с поясницы и позволяет полностью сосредоточиться на сокращении мышц спины.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите регулируемую скамью под углом 30–45 градусов
      - Лягте на скамью лицом вниз, прижав грудь к спинке
      - Возьмите по гантели в каждую руку, руки свисают прямо вниз
      - Поставьте стопы на пол для устойчивости
      - Напрягите мышцы кора и сохраняйте нейтральное положение позвоночника

      ### 2. Движение
      1. Потяните обе гантели к бёдрам или нижней части рёбер
      2. Отводите локти назад и вверх, держа их близко к телу
      3. Продолжайте, пока гантели не дойдут до корпуса
      4. В верхней точке сведите лопатки
      5. Медленно и подконтрольно опустите гантели в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая гантели
      - Вдыхайте, опуская гантели вниз

      ### 4. Советы
      - Держите грудь плотно прижатой к скамье
      - Ведите движение локтями, а не кистями
      - Сосредоточьтесь на сведении лопаток
      - Не используйте инерцию и не забрасывайте гантели рывком
      - Контролируйте вес по всей амплитуде движения

      ### 5. Частые ошибки
      - Отрыв груди от скамьи во время тяги
      - Подъём веса рывком за счёт инерции
      - Неполная амплитуда движения
      - Чрезмерное разведение локтей в стороны
      - Слишком быстрый темп и потеря контроля
      - Отсутствие сведения лопаток в верхней точке

      ### 6. Безопасность и модификации
      - Начинайте с умеренных гантелей, чтобы освоить положение с опорой грудью
      - Меняйте угол наклона скамьи в пределах 30–60 градусов, чтобы смещать акцент нагрузки
      - Выполняйте одной рукой для односторонней проработки
      - Продвинутый вариант: задержитесь на 2–3 секунды в верхней точке каждого повторения
