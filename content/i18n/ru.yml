  Upright Row (Cable):
    name: Тяга к подбородку (блок)
    instructions: |
      ## Обзор
      Тяга к подбородку на блоке — базовое упражнение, которое в первую очередь нагружает средние дельты и верхнюю часть трапеций. Также работают бицепсы, предплечья и средняя часть трапеций: нижний блок обеспечивает постоянное натяжение на протяжении всего вертикального тягового движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте лицом к нижнему блоку с прямой или канатной рукоятью
      - Возьмитесь за рукоять прямым хватом чуть уже ширины плеч
      - Встаньте прямо, ноги на ширине таза
      - Опустите прямые руки вниз, трос под натяжением
      - Отведите плечи назад и напрягите мышцы кора

      ### 2. Движение
      1. Потяните рукоять вверх вдоль тела, поднимая локти
      2. Ведите движение локтями, держа их выше запястий
      3. Продолжайте тянуть, пока рукоять не окажется на уровне верха груди или подбородка
      4. Держите рукоять близко к телу на протяжении всего движения
      5. Сделайте короткую паузу в верхней точке
      6. Медленно и подконтрольно опустите рукоять в исходное положение

      ### 3. Дыхание
      - Выдыхайте, поднимая рукоять вверх
      - Вдыхайте, опуская рукоять вниз

      ### 4. Советы
      - Ведите движение локтями, а не кистями
      - Держите рукоять близко к телу на протяжении всего движения
      - Не поднимайте плечи (не делайте шраги) в верхней точке
      - Сохраняйте постоянное натяжение, не позволяя грузу ложиться на стек
      - Контролируйте и подъём, и опускание

      ### 5. Частые ошибки
      - Слишком высокая тяга, перегружающая плечевые суставы
      - Локти опускаются ниже запястий
      - Раскачивание корпуса и использование инерции
      - Груз ложится на стек между повторениями
      - Отклонение корпуса назад во время тяги
      - Слишком широкий хват, который может привести к импинджменту плеча

      ### 6. Безопасность и модификации
      - Используйте хват средней ширины, чтобы избежать дискомфорта в плечах
      - При любой боли в плечах поднимайте рукоять не выше уровня плеч
      - Попробуйте канатную рукоять для более естественного положения кистей
      - Продвинутый вариант: выполняйте одной рукой для односторонней проработки
