  Jump Squat:
    name: Приседания с выпрыгиванием
    instructions: |
      ## Обзор
      Приседания с выпрыгиванием — плиометрическое упражнение, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и икры. Оно также задействует бицепс бедра и мышцы кора: взрывное выпрыгивание из положения приседа развивает мощность ног и выносливость сердечно-сосудистой системы.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине плеч
      - Держите грудь расправленной, мышцы кора напряжёнными
      - Руки держите вдоль тела или перед собой
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Опуститесь в присед, сгибая колени и тазобедренные суставы
      2. Опускайтесь, пока бёдра не станут как минимум параллельны полу
      3. Взрывным движением выпрыгните вверх, полностью разгибая тазобедренные, коленные и голеностопные суставы
      4. Сделайте мах руками вверх для придания импульса
      5. Приземляйтесь мягко на согнутые колени, чтобы погасить удар
      6. Сразу же опускайтесь в следующий присед и повторяйте

      ### 3. Дыхание
      - Вдыхайте, опускаясь в присед
      - Мощно выдыхайте в момент прыжка

      ### 4. Советы
      - Сосредоточьтесь на взрывном усилии при выпрыгивании вверх
      - Приземляйтесь мягко на согнутые колени, чтобы погасить удар
      - Держите грудь расправленной на протяжении всего движения
      - Помогайте себе руками для создания импульса
      - Сохраняйте контроль на протяжении всего движения

      ### 5. Частые ошибки
      - Приземление на прямые ноги, повышающее риск травмы
      - Недостаточная глубина приседа перед прыжком
      - Заваливание коленей внутрь при приземлении
      - Использование инерции без контроля
      - Неполное выпрямление в фазе прыжка
      - Слишком жёсткое, а не мягкое приземление

      ### 6. Безопасность и модификации
      - Начните с приседаний с собственным весом, чтобы отработать технику, прежде чем добавлять прыжки
      - Выполняйте упражнение на более мягкой поверхности, чтобы снизить ударную нагрузку
      - Уменьшите высоту прыжка при дискомфорте в коленях или голеностопах
      - Продвинутый вариант: добавьте жилет-утяжелитель или возьмите гантели
