  Bent Over Row (Dumbbell):
    name: Тяга гантелей в наклоне
    instructions: |
      ## Обзор
      Тяга гантелей в наклоне — базовое тяговое упражнение, которое в первую очередь нагружает широчайшие, ромбовидные мышцы и среднюю часть трапеций. Также работают бицепсы и задние дельты: гантели позволяют рукам двигаться независимо и держать запястья в естественном положении на протяжении всей тяги.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, поставив ноги на ширине таза, с гантелью в каждой руке
      - Наклонитесь вперёд через тазобедренные суставы, слегка согнув колени
      - Держите спину плоской, грудь развёрнутой, мышцы кора — в напряжении
      - Гантели висят на прямых руках, ладони обращены друг к другу или к телу
      - Сохраняйте нейтральное положение позвоночника

      ### 2. Движение
      1. Потяните обе гантели к бёдрам или нижней части рёбер
      2. Отводите локти назад и вверх, держа их близко к телу
      3. Продолжайте, пока гантели не дойдут до корпуса
      4. В верхней точке сведите лопатки
      5. Медленно и подконтрольно опустите гантели в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, подтягивая гантели к корпусу
      - Вдыхайте, опуская гантели вниз

      ### 4. Советы
      - Держите спину плоской, а мышцы кора — в напряжении на протяжении всего движения
      - Ведите движение локтями, отводя их назад за спину
      - Сосредоточьтесь на сведении лопаток
      - Сохраняйте постоянный угол наклона корпуса на протяжении всего подхода
      - Если удобно, позволяйте запястьям естественно разворачиваться

      ### 5. Частые ошибки
      - Округление спины вместо удержания её плоской
      - Слишком вертикальное положение корпуса, снижающее нагрузку на спину
      - Подъём веса рывком за счёт инерции
      - Неполная амплитуда движения
      - Вращение корпуса из стороны в сторону
      - Слишком быстрый темп и потеря контроля

      ### 6. Безопасность и модификации
      - Начинайте с умеренных гантелей, чтобы освоить наклон через тазобедренные суставы
      - Выполняйте одной рукой для лучшей концентрации и устойчивости
      - Продвинутый вариант: задержитесь на 2–3 секунды в верхней точке каждого повторения
      - Держите колени слегка согнутыми, чтобы защитить поясницу
