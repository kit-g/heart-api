  Deadlift High Pull (Barbell):
    name: Становая тяга с протяжкой (штанга)
    instructions: |
      ## Обзор
      Становая тяга с протяжкой — вспомогательное упражнение тяжёлой атлетики, нагружающее всю заднюю цепь, трапеции и плечи. Оно объединяет становую тягу со взрывной протяжкой вверх, развивая мощность и обучая механике второй фазы тяги, используемой во взятиях на грудь и рывках.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, стопы на ширине таза, гриф над серединой стопы
      - Возьмитесь за гриф чуть шире плеч
      - Наклонитесь через тазобедренные суставы и согните колени, чтобы взяться за гриф
      - Держите спину ровной, грудь вперёд, плечи над грифом
      - Напрягите мышцы кора и включите широчайшие перед тягой

      ### 2. Движение
      1. Выполните становую тягу, мощно оттолкнувшись ногами
      2. Когда гриф достигнет середины бедра, взрывно разогнитесь в тазобедренных и коленных суставах
      3. Выполните шраг и протяните гриф вверх, ведя локти высоко
      4. Продолжайте тянуть, пока гриф не достигнет уровня груди или нижних рёбер
      5. Подконтрольно опустите гриф в исходное положение
      6. Выполните нужное число взрывных повторений

      ### 3. Дыхание
      - Сделайте вдох перед началом тяги
      - Задержите дыхание на протяжении взрывной протяжки
      - Выдохните, опуская гриф

      ### 4. Советы
      - Сосредоточьтесь на взрывном разгибании таза от середины бедра
      - Во время протяжки ведите движение локтями
      - Держите гриф близко к телу на всём протяжении
      - Это упражнение учит второй фазе тяги в тяжелоатлетических движениях
      - Используйте вес меньше вашего максимума в становой тяге

      ### 5. Частые ошибки
      - Ранняя тяга руками до разгибания в тазобедренных суставах
      - Неполное разгибание таза и голеностопов в силовой позиции
      - Уход грифа от тела
      - Слишком большой вес и потеря взрывной скорости
      - Округление спины во время тяги
      - Низкие локти в фазе протяжки

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить взрывное движение
      - Это вспомогательное упражнение для тяжёлой атлетики
      - Освойте становую тягу, прежде чем добавлять протяжку
      - Используйте его для развития мощности во взятиях на грудь и рывках
