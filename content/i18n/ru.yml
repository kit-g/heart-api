  Press Under (Barbell):
    name: Жим с уходом под штангу
    instructions: |
      ## Обзор
      Жим с уходом под штангу — вспомогательное упражнение тяжёлой атлетики, нацеленное на плечи, трицепсы и мышцы кора. Оно обучает двигательному паттерну ухода под штангу в фазе приёма при рывке и толчке, развивая скорость, точность позиций и уверенность.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, удерживая штангу на уровне груди
      - Используйте рывковый или толчковый хват в зависимости от того, какое движение отрабатываете
      - Держите грудь поднятой, мышцы кора напряжёнными, локти чуть ниже грифа
      - Для отработки толчка гриф должен лежать на передней части плеч

      ### 2. Движение
      1. Слегка выжмите штангу вверх, одновременно уходя под неё
      2. Во время жима расставьте ноги в позицию приёма
      3. Полностью выпрямите руки в положении над головой
      4. Зафиксируйтесь в частичном приседе со стабильной штангой над головой
      5. Полностью встаньте со штангой над головой
      6. Верните штангу в исходное положение и повторите

      ### 3. Дыхание
      - Вдохните перед началом жима
      - Задержите дыхание во время жима и ухода под штангу
      - Выдохните после полного выпрямления рук

      ### 4. Советы
      - Это вспомогательное упражнение для отработки техники олимпийских движений
      - Сосредоточьтесь на скорости ухода под штангу, а не на силе жима
      - Жим минимален; акцент — на уходе вниз
      - Отрабатывайте работу ног для вашего толчка или рывка
      - Используйте лёгкий вес, чтобы развивать скорость и уверенность

      ### 5. Частые ошибки
      - Слишком активный жим вместо ухода под штангу
      - Ноги не переставляются в правильную позицию приёма
      - Нерешительность вместо уверенного выполнения движения
      - Слишком большой вес и потеря скорости
      - Неполное выпрямление рук над головой
      - Неправильная траектория грифа во время жима

      ### 6. Безопасность и модификации
      - Начинайте с пластиковой палки или пустого грифа, чтобы освоить паттерн
      - Это обучающее упражнение, а не силовое
      - Держите вес лёгким, чтобы сохранять скорость
      - Незаменимо для освоения толчка в ножницы и рывка
