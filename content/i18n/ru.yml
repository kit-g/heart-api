  Squat Row (Band):
    name: Приседания с тягой (лента)
    instructions: |
      ## Обзор
      Приседания с тягой с лентой — комплексное упражнение на всё тело, объединяющее присед с тяговым движением. Оно нацелено прежде всего на ноги, спину и мышцы кора: лента сопротивления помогает согласовать работу нижней и верхней части тела, развивая силу и координацию.

      ## Техника выполнения
      ### 1. Исходное положение
      - Закрепите ленту на уровне груди
      - Встаньте лицом к точке крепления, удерживая оба конца ленты
      - Отойдите назад, чтобы лента натянулась при вытянутых руках
      - Поставьте ноги на ширине плеч
      - Держите грудь поднятой, мышцы кора напряжёнными

      ### 2. Движение
      1. Одновременно приседайте и позволяйте рукам вытягиваться вперёд
      2. В нижней точке приседа начните тянуть ленту к себе
      3. Тяните ленту к груди, поднимаясь из приседа
      4. Закончите движение стоя, с лентой, притянутой к груди
      5. Выпрямляйте руки, опускаясь в следующий присед
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опускаясь в присед
      - Выдыхайте во время тяги и вставания

      ### 4. Советы
      - Плавно согласуйте присед и тягу
      - Сохраняйте постоянное натяжение ленты на протяжении всего движения
      - Напрягайте мышцы кора для стабильности
      - Следите за слаженной работой нижней и верхней части тела
      - Упражнение развивает координацию всего тела

      ### 5. Частые ошибки
      - Несогласованность приседа и тяги
      - Потеря натяжения ленты
      - Округление спины во время приседа
      - Тяга только руками без включения спины
      - Недостаточная глубина приседа
      - Слишком быстрый темп и потеря контроля

      ### 6. Безопасность и модификации
      - Регулируйте сопротивление, подходя ближе или отходя дальше от крепления
      - Ставьте технику выше скорости и сопротивления
      - Сначала отдельно освойте приседания и тягу
      - Надёжно закрепите ленту перед началом
