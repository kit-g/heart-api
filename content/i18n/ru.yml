    name: Разведения на наклонной скамье (гантели)
    instructions: |
      ## Обзор
      Разведения гантелей на наклонной скамье — изолирующее упражнение, которое в первую очередь нагружает верхнюю часть большой грудной мышцы. Передние дельты работают как стабилизаторы; наклонное положение и гантели создают широкую дугу движения, растягивая и сокращая мышцы верха груди.

