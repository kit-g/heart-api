      - Лягте на скамью, плотно поставив стопы на пол
      - Держите по гантели в каждой руке на выпрямленных руках над верхней частью груди
      - Разверните гантели ладонями друг к другу
      - Сохраняйте лёгкий сгиб в локтях на протяжении всего упражнения

      ### 2. Движение
      1. Опустите обе гантели в стороны по широкой дуге
      2. Держите локти слегка согнутыми на протяжении всего движения
      3. Продолжайте опускать, пока не почувствуете растяжение в верхней части груди
      4. Сделайте короткую паузу в нижней точке
      5. Сведите гантели над грудью обнимающим движением
      6. Сократите верх груди в верхней точке и продолжайте выполнять контролируемые повторения

      ### 3. Дыхание
      - Вдох — разводя гантели в стороны
      - Выдох — сводя гантели вместе

      ### 4. Советы
      - Сохраняйте одинаковый лёгкий сгиб в локтях на протяжении всего упражнения
      - Сосредоточьтесь на растяжении в нижней точке и сокращении в верхней
      - Держите лопатки сведёнными на протяжении всего движения
