  Standing Leg Curl (Machine):
    name: Сгибания ног стоя (тренажёр)
    instructions: |
      ## Обзор
      Сгибания ног стоя — изолирующее упражнение, которое в первую очередь нагружает бицепс бедра, прорабатывая ноги поочерёдно. Икры работают как ассистенты, а положение стоя позволяет тренировать каждую ногу в полной амплитуде, пока тренажёр поддерживает корпус.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте лицом к тренажёру и прижмите бедро к опорной подушке
      - Заведите валик за лодыжку рабочей ноги
      - Держитесь за рукояти для равновесия
      - Держите корпус вертикально, опорную ногу слегка согните

      ### 2. Движение
      1. Согните ногу в колене, подтягивая пятку к ягодицам
      2. Напрягите бицепс бедра в верхней точке сгибания
      3. Медленно и подконтрольно верните валик в исходное положение
      4. Выполните нужное число подконтрольных повторений
      5. Повторите другой ногой

      ### 3. Дыхание
      - Выдох — при сгибании ноги
      - Вдох — при опускании

      ### 4. Советы
      - Держите таз неподвижно; двигаться должно только колено
      - Делайте короткую паузу в верхней точке каждого повторения
      - Выполняйте одинаковое число повторений с одинаковым весом на обе ноги

      ### 5. Частые ошибки
      - Раскачивание ноги и использование инерции
      - Подъём бедра, помогающий поднять ногу
      - Бросание веса на пути вниз

      ### 6. Безопасность и модификации
      - Начинайте с небольшого веса, чтобы подобрать положение валика, комфортное для колена
      - Сгибания ног сидя или лёжа — более простая альтернатива для новичков
