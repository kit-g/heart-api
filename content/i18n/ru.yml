  Seated Leg Curl (Machine):
    name: Сгибания ног сидя (тренажёр)
    instructions: |
      ## Обзор
      Сгибания ног сидя — изолирующее упражнение, которое в первую очередь нагружает бицепс бедра. Оно также задействует икры: тренажёр с заданной траекторией в положении сидя позволяет изолированно укреплять мышцы задней поверхности бедра за счёт сгибания в коленях.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для сгибания ног, плотно прижав спину к спинке
      - Расположите валик на задней части голеней, чуть выше лодыжек
      - Отрегулируйте тренажёр так, чтобы колени были на одной оси с осью вращения
      - Возьмитесь за рукоятки для устойчивости
      - Зафиксируйте бёдра под верхним валиком

      ### 2. Движение
      1. Согните ноги, уводя голени вниз и назад
      2. Продолжайте, пока валик почти не коснётся низа сиденья
      3. В точке полного сгибания сделайте паузу и напрягите бицепс бедра
      4. Медленно и подконтрольно верните вес в исходное положение
      5. Останавливайтесь чуть раньше, чем плитки коснутся стека, чтобы сохранить напряжение
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, сгибая ноги
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите спину плотно прижатой к спинке
      - Сосредоточьтесь на напряжении бицепса бедра в точке полного сгибания
      - Контролируйте и фазу сгибания, и фазу разгибания
      - Сохраняйте постоянное напряжение, не давая плиткам ложиться на стек
      - Не используйте инерцию и не дёргайте вес

      ### 5. Частые ошибки
      - Отрыв ягодиц от сиденья во время сгибания
      - Использование инерции или раскачивание веса
      - Неполная амплитуда движения
      - Опускание плиток на стек между повторениями
      - Слишком быстрый темп выполнения повторений
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Отрегулируйте валик и сиденье для правильного положения коленей
      - Начните с лёгкого веса, чтобы поставить технику
      - Положение сидя может быть комфортнее, чем варианты лёжа
      - Продвинутый вариант: выполняйте по одной ноге за раз или добавьте паузу в точке полного сгибания
