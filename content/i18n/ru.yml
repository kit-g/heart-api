  Bench Press - Wide Grip (Barbell):
    name: Жим лёжа широким хватом (штанга)
    instructions: |
      ## Обзор
      Жим штанги лёжа широким хватом — базовое жимовое упражнение, нацеленное в первую очередь на внешнюю часть больших грудных мышц. В работу также включаются передние дельты и трицепсы; более широкая постановка рук акцентирует ширину груди и снижает участие трицепсов.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на горизонтальную скамью, стопы плотно прижаты к полу
      - Расположитесь так, чтобы глаза были прямо под грифом
      - Возьмитесь за гриф хватом значительно шире плеч
      - Снимите гриф со стоек и держите его на полностью выпрямленных руках над грудью
      - Сведите лопатки и прижмите их к скамье

      ### 2. Движение
      1. Медленно опустите гриф к средней или верхней части груди
      2. Держите локти разведёнными шире, чем в обычном жиме
      3. Легко коснитесь грифом груди
      4. Сделайте короткую паузу в нижней точке
      5. Выжмите гриф вверх, выпрямляя руки
      6. Полностью выпрямите локти в верхней точке и повторяйте в контролируемом темпе

      ### 3. Дыхание
      - Вдыхайте, опуская гриф к груди
      - Выдыхайте, выжимая гриф вверх

      ### 4. Советы
      - Широкий хват уменьшает амплитуду, но усиливает растяжение груди
      - Держите лопатки сведёнными на протяжении всего подхода
      - Сосредоточьтесь на сокращении груди в верхней точке
      - Сохраняйте естественный прогиб в пояснице
      - Держите запястья прямыми, несмотря на широкий хват

      ### 5. Частые ошибки
      - Слишком широкий хват, перегружающий плечи
      - Отбив грифа от груди
      - Недостаточное растяжение груди в нижней точке
      - Отрыв таза от скамьи
      - Слишком большой вес в ущерб технике
      - Потеря сведения лопаток

      ### 6. Безопасность и модификации
      - Всегда работайте со страхующим при больших весах
      - Начните с веса легче, чем в вашем обычном жиме лёжа
      - Расширяйте хват постепенно, подбирая оптимальную ширину
      - При дискомфорте в плечах немного сузьте хват
