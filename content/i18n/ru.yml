  Back Extension:
    name: Гиперэкстензия
    instructions: |
      ## Обзор
      Гиперэкстензия — упражнение с собственным весом, которое в первую очередь нагружает разгибатели позвоночника и мышцы поясницы. В качестве вспомогательных также работают ягодичные мышцы и бицепс бедра, поэтому упражнение эффективно укрепляет заднюю цепь и повышает стабильность позвоночника.

      ## Техника выполнения
      ### 1. Исходное положение
      - Расположитесь лицом вниз на тренажёре для гиперэкстензии
      - Зафиксируйте лодыжки под валиками, бёдра лежат на опорной подушке
      - Скрестите руки на груди или заведите их за голову
      - Начните с корпусом, согнутым вперёд примерно под углом 90 градусов
      - Сохраняйте нейтральное положение позвоночника и держите мышцы кора в напряжении

      ### 2. Движение
      1. Поднимите корпус усилием поясницы и ягодичных мышц
      2. Продолжайте подъём, пока тело не образует прямую линию от головы до пяток
      3. Держите шею в нейтральном положении и не переразгибайте позвоночник
      4. Сделайте короткую паузу в верхней точке
      5. Медленно и подконтрольно опустите корпус вниз
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая корпус вверх
      - Вдыхайте, опуская корпус вниз

      ### 4. Советы
      - Сосредоточьтесь на работе поясницы и ягодичных мышц на протяжении всего движения
      - Не переразгибайтесь и не прогибайтесь чрезмерно в верхней точке
      - Держите мышцы кора в напряжении, чтобы защитить позвоночник
      - Двигайтесь медленно и подконтрольно в обоих направлениях
      - Держите шею в нейтральном положении на одной линии с позвоночником

      ### 5. Частые ошибки
      - Переразгибание позвоночника в верхней точке движения
      - Использование инерции вместо контролируемого мышечного сокращения
      - Отрыв таза от подушки
      - Слишком быстрый темп и потеря контроля
      - Запрокидывание головы, чтобы смотреть вперёд
      - Отсутствие включения ягодичных мышц во время движения

      ### 6. Безопасность и модификации
      - Новички могут уменьшить амплитуду, пока не наберут достаточно силы
      - Для дополнительного сопротивления держите блин у груди
      - Если тренажёра нет, выполняйте упражнение на полу без оборудования
      - При дискомфорте в пояснице уменьшите амплитуду и проконсультируйтесь со специалистом
