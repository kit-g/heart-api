  Box Squat (Barbell):
    name: Приседания на ящик (штанга)
    instructions: |
      ## Обзор
      Приседания на ящик со штангой — базовое упражнение для низа тела, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и бицепс бедра. В работу также включаются мышцы кора и поясница; ящик задаёт постоянную глубину, учит правильной механике приседа и позволяет работать с более тяжёлыми весами.

      ## Техника выполнения
      ### 1. Исходное положение
      - Поставьте позади себя ящик или скамью подходящей высоты (чуть ниже параллели)
      - Встаньте, стопы на ширине плеч, штанга лежит на верхней части спины
      - Возьмитесь за гриф хватом чуть шире плеч
      - Держите грудь поднятой, мышцы кора напряжёнными, взгляд направлен вперёд
      - Сохраняйте нейтральное положение позвоночника на протяжении всего упражнения

      ### 2. Движение
      1. Начните присед, отводя таз назад и сгибая колени
      2. Опускайтесь, пока не сядете на ящик
      3. Сделайте короткую паузу на ящике, сохраняя напряжение
      4. Мощно встаньте, отталкиваясь пятками
      5. Выпрямите таз и колени, вернувшись в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Глубокий вдох перед опусканием
      - Задержите дыхание во время опускания и паузы
      - Выдох — вставая

      ### 4. Советы
      - Садитесь на ящик назад, а не падайте на него
      - Сохраняйте напряжение в мышцах даже сидя на ящике
      - Вставая, отталкивайтесь пятками
      - Держите грудь поднятой, а мышцы кора — напряжёнными на протяжении всего упражнения
      - Ящик учит правильной глубине и механике наклона через тазобедренные суставы

      ### 5. Частые ошибки
      - Полное расслабление при посадке на ящик
      - Слишком высокий или слишком низкий ящик
      - Заваливание коленей внутрь
      - Чрезмерный наклон вперёд при опускании
      - Отсутствие отталкивания пятками при вставании
      - Отскок от ящика вместо паузы

      ### 6. Безопасность и модификации
      - Начинайте с более высокого ящика и постепенно понижайте его по мере роста подвижности
      - При работе с тяжёлыми весами используйте страховочную раму или страхующего
      - Сначала отработайте движение без веса
      - Усложнённый вариант: добавьте цепи или ленты для переменного сопротивления
    validated: false
    source_digest: 7fe468447300
  Bulgarian Split Squat:
    name: Болгарские сплит-приседания
    instructions: |
      ## Обзор
      Болгарские сплит-приседания — одностороннее упражнение для низа тела, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и бицепс бедра. В работу также включаются мышцы кора и стабилизаторы таза; положение с задней ногой на возвышении увеличивает амплитуду, бросает вызов равновесию и развивает силу каждой ноги по отдельности.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте спиной к скамье или другому возвышению
      - Положите подъём задней стопы на скамью позади себя
      - Выставьте переднюю ногу достаточно далеко вперёд для глубокого выпада
      - Держите грудь поднятой, мышцы кора напряжёнными, корпус вертикальным
      - Держите гантели по бокам или штангу на верхней части спины

      ### 2. Движение
      1. Опустите тело, сгибая колено и тазобедренный сустав передней ноги
      2. Следите, чтобы переднее колено двигалось в направлении носка
      3. Опускайтесь, пока бедро передней ноги не станет параллельно полу
      4. Сделайте короткую паузу в нижней точке
      5. Вернитесь в исходное положение, отталкиваясь пяткой передней ноги
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Вдох — опуская тело вниз
      - Выдох — возвращаясь в исходное положение

      ### 4. Советы
      - Держите основной вес на передней ноге
      - Сохраняйте вертикальное положение корпуса на протяжении всего движения
      - Подберите оптимальное положение передней стопы под свою гибкость
      - Контролируйте опускание и мощно вставайте
      - Держите переднее колено в одной плоскости с носком

      ### 5. Частые ошибки
      - Слишком близкое к скамье положение передней стопы
      - Заваливание переднего колена внутрь
      - Чрезмерный наклон корпуса вперёд во время движения
      - Слишком большой перенос веса на заднюю ногу
      - Недостаточная глубина приседа
      - Слишком быстрый темп вместо контролируемого движения

      ### 6. Безопасность и модификации
      - Начинайте с собственного веса, чтобы освоить равновесие и технику
      - При необходимости используйте более низкую опору для задней ноги
      - На первых порах держитесь за опору для равновесия
      - Усложнённый вариант: добавьте вес — гантели, штангу или жилет-утяжелитель
