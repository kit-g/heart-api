  Reverse Curl (Band):
    name: Обратные сгибания (лента)
    instructions: |
      ## Обзор
      Обратные сгибания с лентой — изолирующее упражнение, которое в первую очередь нагружает плечелучевую и плечевую мышцы. В работу также включаются двуглавая мышца плеча и разгибатели предплечья; прямой хват акцентирует развитие предплечий при прогрессирующем сопротивлении ленты.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, ноги на ширине таза, наступив на середину ленты
      - Возьмитесь за концы ленты прямым хватом (ладони вниз)
      - Руки свободно висят по бокам, лента слегка натянута
      - Держите локти прижатыми к корпусу на протяжении всего упражнения
      - Сохраняйте прямую осанку, мышцы кора напряжены

      ### 2. Движение
      1. Потяните ленту вверх, сгибая руки в локтях и сохраняя ладони направленными вниз
      2. Держите плечи неподвижными и прижатыми к корпусу
      3. Продолжайте подъём, пока предплечья не станут почти вертикальными
      4. Сделайте паузу и дополнительно напрягите мышцы в верхней точке
      5. Медленно и подконтрольно опустите кисти в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая ленту вверх
      - Вдыхайте, опуская кисти вниз

      ### 4. Советы
      - Сохраняйте прямой хват на протяжении всего движения
      - Держите локти неподвижными и прижатыми к корпусу
      - Не раскачивайтесь и не тяните ленту за счёт инерции
      - Сосредоточьтесь на напряжении предплечий в верхней точке
      - Контролируйте сопротивление и на подъёме, и на опускании

      ### 5. Частые ошибки
      - Загибание запястий вверх вместо удержания их на одной линии с предплечьем
      - Уход локтей вперёд во время сгибания
      - Подъём ленты за счёт инерции или раскачивания корпуса
      - Отсутствие постоянного натяжения ленты
      - Слишком сильный хват, создающий лишнее напряжение
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Начинайте с ленты меньшего сопротивления, чтобы освоить движение прямым хватом
      - Держите запястья в нейтральном положении, чтобы избежать перенапряжения
      - Усложнённый вариант: возьмите более жёсткую ленту или добавьте паузу в верхней точке
      - Меняйте постановку ног на ленте, чтобы регулировать сопротивление
