  Glute Ham Raise:
    name: Глют-хэм подъёмы (GHR)
    instructions: |
      ## Обзор
      Глют-хэм подъёмы — это продвинутое упражнение с собственным весом, которое в первую очередь нагружает бицепс бедра и ягодичные мышцы. Оно также задействует поясницу и икры: эксцентрическое и концентрическое сокращение бицепса бедра развивает силу задней цепи и устойчивость к травмам.

      ## Техника выполнения
      ### 1. Исходное положение
      - Расположитесь лицом вниз в тренажёре для глют-хэм подъёмов
      - Зафиксируйте лодыжки под валиками, бёдра на опорной подушке
      - Начните с вертикального положения корпуса, перпендикулярно полу
      - Скрестите руки на груди или держите их перед собой
      - Держите мышцы кора и ягодицы напряжёнными на протяжении всего движения

      ### 2. Движение
      1. Медленно опускайте корпус вперёд, разгибая ноги в коленях
      2. При опускании держите тело прямой линией от коленей до головы
      3. Контролируйте опускание за счёт бицепса бедра и ягодичных мышц
      4. Опуститесь, пока корпус не окажется почти параллелен полу
      5. Подтяните себя обратно в исходное положение усилием бицепса бедра
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдох при опускании корпуса вперёд
      - Выдох при возвращении в исходное положение

      ### 4. Советы
      - Сосредоточьтесь на контроле эксцентрической (опускающей) фазы
      - Держите тело прямой линией на протяжении всего движения
      - Работайте бицепсом бедра и ягодицами, а не инерцией
      - Если полные повторения слишком трудны, начинайте с частичной амплитуды
      - Это упражнение серьёзно развивает силу бицепса бедра

      ### 5. Частые ошибки
      - Сгибание в тазобедренных суставах вместо удержания прямого тела
      - Слишком быстрое опускание в эксцентрической фазе
      - Подъём за счёт инерции и раскачивания
      - Отсутствие напряжения в ягодицах на протяжении движения
      - Чрезмерный прогиб в пояснице
      - Попытка работать в полной амплитуде до наработки достаточной силы

      ### 6. Безопасность и модификации
      - При необходимости используйте ленту для помощи
      - Начинайте с только эксцентрических повторений (только опускание, затем возврат в исходное)
      - Помогайте себе вернуться в исходное положение, отталкиваясь руками от пола
      - Усложнённый вариант: держите блин у груди для дополнительного сопротивления
