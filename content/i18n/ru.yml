  Muscle Up:
    name: Выход силой
    instructions: |
      ## Обзор
      Выход силой — продвинутое упражнение с собственным весом, объединяющее подтягивание с отжиманием в упоре. Оно нацелено прежде всего на широчайшие, грудь, плечи и трицепсы и требует серьёзной силы верха тела, взрывной мощности и техники, чтобы перейти из виса под перекладиной или кольцами в упор над ними.

      ## Техника выполнения
      ### 1. Исходное положение
      - Повисните на перекладине или гимнастических кольцах
      - Используйте ложный хват (большие пальцы поверх перекладины) для более лёгкого перехода
      - Держите тело в положении «лодочки»
      - Напрягите мышцы кора и приготовьтесь к взрывному подтягиванию
      - При необходимости создайте небольшой раскач для инерции

      ### 2. Движение
      1. Взрывно подтянитесь к перекладине
      2. Поднимаясь, слегка отклонитесь назад и выводите грудь над перекладиной
      3. Резко переведите грудь и плечи над перекладиной
      4. Отожмитесь вниз, завершая движение в упоре
      5. Подконтрольно опуститесь обратно в исходный вис
      6. Повторите нужное количество повторений

      ### 3. Дыхание
      - Сделайте вдох перед подтягиванием
      - Мощно выдыхайте во время подтягивания и перехода
      - Вдыхайте во время опускания

      ### 4. Советы
      - Это продвинутое движение, требующее серьёзной силы
      - Фаза перехода — самая техничная часть
      - Ключевое значение имеет взрывная сила тяги
      - Сначала отдельно отработайте подтягивания и отжимания на брусьях
      - На этапе освоения можно использовать резиновые ленты для помощи

      ### 5. Частые ошибки
      - Недостаточно взрывное подтягивание
      - Отсутствие отклонения назад во время перехода
      - Недостаточная сила в подтягиваниях или отжиманиях на брусьях
      - Неправильный тайминг фазы перехода
      - Попытки без достаточной базовой силы
      - Слишком сильный раскач и использование инерции

      ### 6. Безопасность и модификации
      - Сначала освойте строгие подтягивания (15+) и отжимания на брусьях (20+)
      - Используйте помощь резиновой ленты на этапе обучения
      - Отрабатывайте фазу перехода отдельно
      - Выход силой на кольцах обычно освоить проще, чем на перекладине
