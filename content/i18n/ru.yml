  Shrug (Machine):
    name: Шраги (тренажёр)
    instructions: |
      ## Обзор
      Шраги в тренажёре — изолирующее упражнение, которое в первую очередь нагружает верхнюю часть трапеций. В работу также включаются мышца, поднимающая лопатку, и ромбовидные мышцы; фиксированная траектория обеспечивает стабильность и позволяет сосредоточиться исключительно на движении плечами.

      ## Техника выполнения
      ### 1. Исходное положение
      - Расположитесь в тренажёре для шрагов в соответствии с его конструкцией
      - Возьмитесь за рукояти обеими руками
      - Встаньте или сядьте прямо, руки свободно опущены вниз
      - Если стоите, поставьте ноги на ширине плеч
      - Напрягите мышцы кора и сохраняйте нейтральное положение позвоночника

      ### 2. Движение
      1. Поднимите плечи строго вверх, к ушам
      2. Держите руки прямыми на протяжении всего движения
      3. Продолжайте до максимального подъёма плеч
      4. В верхней точке задержитесь и напрягите трапеции
      5. Медленно и подконтрольно опустите плечи в исходное положение
      6. Останавливайтесь чуть раньше, чем грузоблок коснётся упора, чтобы сохранить натяжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, поднимая плечи
      - Вдыхайте, опуская плечи вниз

      ### 4. Советы
      - Сосредоточьтесь на подъёме плеч строго вверх, не вращайте ими
      - Держите руки прямыми и расслабленными
      - Избегайте инерции и рывков
      - В верхней точке каждого повторения сильно напрягайте трапеции
      - Сохраняйте постоянное натяжение, не позволяя грузоблоку опускаться до конца

      ### 5. Частые ошибки
      - Вращение плечами вместо подъёма строго вверх
      - Сгибание локтей во время шрага
      - Использование инерции и раскачивания веса
      - Неполная амплитуда движения
      - Опускание грузоблока до упора между повторениями
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Начинайте с умеренного веса, чтобы освоить подъём плеч строго вверх
      - Отрегулируйте тренажёр под своё телосложение
      - Усложнённый вариант: задержитесь на 2-3 секунды в верхней точке каждого повторения
      - Для повышения интенсивности опускайте вес медленно, за 3-5 секунд
