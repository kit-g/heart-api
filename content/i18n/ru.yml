  Triceps Dip:
    name: Отжимания на брусьях
    instructions: |
      ## Обзор
      Отжимания на брусьях — упражнение с собственным весом, которое в первую очередь нагружает трицепсы. В работу также включаются грудные мышцы и передние дельты, что делает упражнение эффективным базовым движением для развития жимовой силы верха тела и массы трицепсов.

      ## Техника выполнения
      ### 1. Исходное положение
      - Примите упор на параллельных брусьях на полностью выпрямленных руках
      - Крепко возьмитесь за брусья, кисти чуть шире плеч
      - Держите корпус вертикально с лёгким наклоном вперёд
      - Скрестите лодыжки позади себя или держите ноги прямыми
      - Напрягите мышцы кора и опустите плечи вниз

      ### 2. Движение
      1. Опуститесь, сгибая локти примерно до 90 градусов
      2. Направляйте локти строго назад, не разводя их в стороны
      3. Держите корпус вертикально, чтобы акцентировать трицепсы, а не грудь
      4. Сделайте короткую паузу в нижней точке
      5. Отталкиваясь ладонями, выпрямите руки и вернитесь в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опускаясь вниз
      - Выдыхайте, отжимаясь в исходное положение

      ### 4. Советы
      - Держите корпус по возможности вертикально для максимального включения трицепсов
      - Держите локти прижатыми к корпусу на протяжении всего движения
      - Поднимайте себя силой трицепсов, а не за счёт инерции
      - Не опускайтесь слишком глубоко, чтобы не перегружать плечи
      - Сохраняйте контроль по всей амплитуде движения

      ### 5. Частые ошибки
      - Чрезмерный наклон вперёд, смещающий нагрузку на грудь
      - Чрезмерное разведение локтей в стороны
      - Слишком глубокое опускание с перегрузкой плеч
      - Использование инерции или «отбива» в нижней точке
      - Неполное выпрямление рук в верхней точке
      - Сведение плеч вперёд с округлением

      ### 6. Безопасность и модификации
      - При необходимости используйте гравитрон или ленту для поддержки
      - При дискомфорте в плечах сократите амплитуду движения
      - Усложнённый вариант: добавьте отягощение с помощью пояса или жилета
      - Прогрессируйте постепенно, чтобы не перегрузить плечи
