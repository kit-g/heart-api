  Crunch (Stability Ball):
    name: Скручивания (фитбол)
    instructions: |
      ## Обзор
      Скручивания на фитболе — упражнение на кор с собственным весом, которое в первую очередь нагружает прямую мышцу живота с увеличенной амплитудой. Также работают косые мышцы, поперечная мышца живота и стабилизаторы поясницы, поскольку приходится удерживать равновесие на нестабильной поверхности.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на фитбол и шагайте стопами вперёд, пока поясница не ляжет на мяч
      - Расположите мяч под поясницей и серединой спины, стопы поставьте на пол на ширине таза
      - Слегка заведите руки за голову или скрестите их на груди
      - Позвольте верху спины немного разогнуться на мяче
      - Напрягите мышцы кора и держите таз на одном уровне

      ### 2. Движение
      1. На выдохе оторвите лопатки, сокращая мышцы пресса
      2. Скручивайте верх корпуса вперёд, приближая грудную клетку к тазу
      3. Держите поясницу в контакте с мячом для стабильности
      4. Сожмите пресс в верхней точке на 1–2 секунды
      5. Медленно опуститесь обратно, позволяя лёгкое растяжение на мяче
      6. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, скручиваясь вверх и сокращая пресс
      - Вдыхайте, опускаясь в исходное положение

      ### 4. Советы
      - Сосредоточьтесь на скручивании корпуса, а не просто на подъёме головы
      - Плотно упирайтесь стопами в пол для стабильности
      - Не тяните шею руками
      - Двигайтесь медленно, чтобы усложнить удержание равновесия и максимально включить кор
      - Используйте нестабильность мяча для включения большего числа мышц-стабилизаторов

      ### 5. Частые ошибки
      - Тяга за шею или голову, что может привести к перенапряжению
      - Слишком быстрый темп и потеря равновесия
      - Опускание или провисание таза во время движения
      - Использование инерции вместо контролируемого мышечного сокращения
      - Слишком высокое или слишком низкое положение мяча под спиной
      - Отказ от увеличенной амплитуды, которую даёт мяч

      ### 6. Безопасность и модификации
      - Новички могут поставить стопы шире для большей устойчивости
      - При необходимости прижмите мяч к стене для дополнительной опоры
      - Продвинутый вариант: держите блин на груди для дополнительного сопротивления
      - Если трудно удерживать равновесие, слегка сдуйте мяч, чтобы поверхность стала стабильнее
