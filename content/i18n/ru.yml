  Hang Clean (Barbell):
    name: Взятие на грудь с виса (штанга)
    instructions: |
      ## Обзор
      Взятие на грудь с виса — тяжелоатлетический вариант, нагружающий квадрицепсы, ягодичные мышцы, бицепс бедра и верхнюю часть спины. Движение начинается из положения стоя, а не с пола, что смещает акцент на взрывное разгибание таза и фазу приёма штанги при меньшей технической сложности.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте со штангой на вытянутых руках
      - Гриф на уровне середины бедра, стопы на ширине таза
      - Держите грудь вперёд, спину ровной, мышцы кора напряжёнными
      - Слегка наклонитесь через тазобедренные суставы, колени согнуты
      - Возьмитесь сразу за линией ног, по возможности хватом «в замок»

      ### 2. Движение
      1. Подконтрольно опустите гриф чуть ниже коленей
      2. Взрывно разогнитесь в тазобедренных и коленных суставах, как в прыжке
      3. Выполните шраг и уйдите под штангу
      4. Примите гриф на передние дельты в положении фронтального приседа
      5. Полностью встаньте со штангой на плечах
      6. Опустите гриф в положение виса и повторите

      ### 3. Дыхание
      - Вдыхайте во время опускания грифа
      - Задержите дыхание на протяжении взрывной тяги и приёма
      - Выдохните после вставания

      ### 4. Советы
      - Этот вариант отрабатывает силовую позицию взятия на грудь
      - Держите гриф близко к телу во время тяги
      - Принимайте гриф с высоко поднятыми и выведенными вперёд локтями
      - Положение виса снижает технические требования по сравнению с подъёмом с пола
      - Сосредоточьтесь на взрывном разгибании таза

      ### 5. Частые ошибки
      - Слишком медленное опускание грифа и потеря натяжения
      - Тяга руками вместо работы таза
      - Уход грифа от тела
      - Приём штанги с низкими локтями или в неправильном положении
      - Неполное разгибание таза перед уходом под штангу
      - Слишком большой вес до освоения техники

      ### 6. Безопасность и модификации
      - Освойте этот вариант, прежде чем переходить к полным взятиям на грудь с пола
      - Освойте силовое взятие на грудь (приём в высокой стойке), прежде чем принимать штангу в полный присед
      - При необходимости используйте бамперные блины для безопасного сброса
      - Обратитесь к тренеру для постановки тяжелоатлетической техники
