      - Наклонитесь вперёд через тазобедренные суставы, слегка согнув колени
      - Держите спину плоской, а мышцы кора — в напряжении
      - Опустите прямые руки вниз, лента под натяжением

      ### 2. Движение
      1. Потяните ленту к корпусу, отводя локти назад
      2. Держите локти близко к телу во время тяги
      3. Продолжайте, пока кисти не дойдут до нижней части рёбер или бёдер
      4. В верхней точке сведите лопатки
      5. Медленно и подконтрольно вернитесь в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, подтягивая ленту к корпусу
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите спину плоской, а мышцы кора — в напряжении на протяжении всего движения
      - Ведите движение локтями, отводя их назад за спину
      - Сосредоточьтесь на сведении лопаток
      - Сохраняйте постоянное натяжение ленты
      - Не округляйте спину во время движения

      ### 5. Частые ошибки
      - Округление спины вместо удержания её плоской
      - Использование инерции вместо контролируемого движения
      - Неполная амплитуда движения
      - Слишком вертикальное положение корпуса, снижающее нагрузку на спину
      - Потеря натяжения ленты в нижней точке
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Начинайте с ленты полегче, чтобы освоить наклон через тазобедренные суставы
      - Меняйте положение стоп на ленте, чтобы регулировать сопротивление
      - Продвинутый вариант: возьмите более жёсткую ленту или добавьте паузу в верхней точке
      - Держите колени слегка согнутыми, чтобы защитить поясницу
