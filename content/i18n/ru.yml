  Around the World:
    name: «Вокруг света»
    instructions: |
      ## Обзор
      «Вокруг света» — динамичное упражнение для груди, нацеленное в первую очередь на большие грудные мышцы за счёт широкой дуги движения. В качестве стабилизаторов также работают передние дельты и мышцы кора; гантели создают постоянное напряжение на протяжении всей круговой траектории.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на горизонтальную скамью, стопы плотно прижаты к полу
      - Держите по гантели в каждой руке на прямых руках над грудью
      - Сохраняйте небольшое сгибание в локтях на протяжении всего движения
      - Напрягите мышцы кора и прижмите спину к скамье
      - Держите гантели ладонями друг к другу

      ### 2. Движение
      1. Опустите гантели в стороны и вниз по широкой дуге
      2. Продолжайте дугу, пока гантели не окажутся у бёдер
      3. Обратным движением верните гантели вверх и по кругу в исходное положение
      4. Сохраняйте небольшое сгибание в локтях на всей круговой траектории
      5. Сохраняйте контроль и напряжение в мышцах груди
      6. Повторите нужное число контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опуская гантели вниз по дуге
      - Выдыхайте, возвращая гантели в исходное положение

      ### 4. Советы
      - Сохраняйте одинаковое небольшое сгибание в локтях на протяжении всего движения
      - Ведите гантели по плавной контролируемой дуге
      - Держите мышцы груди в постоянном напряжении
      - Не выпрямляйте локти полностью ни в одной точке
      - Используйте вес легче, чем в обычных упражнениях для груди

      ### 5. Частые ошибки
      - Слишком большой вес, ломающий траекторию дуги
      - Полное выпрямление локтей во время движения
      - Слишком быстрый темп и потеря контроля
      - Отсутствие постоянного напряжения в груди
      - Чрезмерный прогиб поясницы с отрывом от скамьи
      - Остановка в нижней точке вместо непрерывного движения

      ### 6. Безопасность и модификации
      - Начните с лёгких гантелей, чтобы освоить круговую траекторию
      - Держите локти слегка согнутыми, чтобы защитить плечевые суставы
      - Для разнообразия выполняйте движение в обратном направлении
      - При дискомфорте в плечах уменьшите амплитуду или вес
