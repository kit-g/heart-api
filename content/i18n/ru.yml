  Front Squat (Barbell):
    name: Фронтальные приседания (штанга)
    instructions: |
      ## Обзор
      Фронтальные приседания со штангой — это базовое упражнение для нижней части тела, которое нагружает квадрицепсы сильнее, чем приседания со штангой на спине. Оно также задействует ягодичные мышцы, бицепс бедра, мышцы кора и верх спины: положение штанги спереди способствует вертикальному положению корпуса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите штангу в стойке на уровне верхней части груди
      - Подшагните под гриф и расположите его на передних дельтах
      - Создайте «полку» плечами, держа локти высоко и направленными вперёд
      - Хват — тяжелоатлетический (пальцы под грифом) или скрещённый
      - Встаньте, стопы на ширине плеч, носки слегка развёрнуты наружу

      ### 2. Движение
      1. Снимите штангу со стойки и сделайте шаг назад, стопы на ширине плеч
      2. Начните приседание, одновременно сгибая колени и тазобедренные суставы
      3. Держите корпус вертикально, локти высоко на протяжении всего движения
      4. Опускайтесь, пока бёдра не окажутся как минимум параллельны полу
      5. Давите через пятки, возвращаясь в положение стоя
      6. Держите локти поднятыми и грудь расправленной, повторяйте в контролируемом темпе

      ### 3. Дыхание
      - Перед опусканием сделайте глубокий вдох и напрягите мышцы кора
      - Задержите дыхание во время опускания и в нижней точке
      - Выдохните на подъёме или в верхней точке

      ### 4. Советы
      - Держите локти как можно выше на протяжении всего движения
      - Положение штанги спереди заставляет держать корпус более вертикально
      - Сосредоточьтесь на расправленной груди и напряжённом коре
      - Разводите колени наружу при опускании
      - Фронтальные приседания нагружают квадрицепсы сильнее, чем приседания со штангой на спине

      ### 5. Частые ошибки
      - Опускание локтей, из-за чего гриф скатывается вперёд
      - Чрезмерный наклон вперёд и потеря вертикального положения
      - Недостаточная глубина приседа
      - Заваливание коленей внутрь
      - Слишком большой вес до освоения положения штанги
      - Потеря напряжения кора на протяжении движения

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить положение штанги на груди
      - Если тяжелоатлетический хват некомфортен, используйте скрещённый
      - Сначала отрабатывайте фронтальные приседания с пустым грифом
      - Усложнённый вариант: добавьте паузу в нижней точке или выполняйте фронтальные приседания в заданном темпе
