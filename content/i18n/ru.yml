  Bent Over Row - Underhand (Barbell):
    name: Тяга штанги в наклоне обратным хватом
    instructions: |
      ## Обзор
      Тяга штанги в наклоне обратным хватом — базовое тяговое упражнение, которое в первую очередь нагружает широчайшие с акцентом на их нижнюю часть. Бицепсы включаются сильнее, чем в варианте прямым хватом, вместе с ромбовидными мышцами и средней частью трапеций, поэтому упражнение эффективно развивает ширину спины и силу рук.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, поставив ноги на ширине таза, и возьмите штангу обратным хватом
      - Расположите руки чуть уже ширины плеч
      - Наклонитесь вперёд через тазобедренные суставы, слегка согнув колени
      - Держите спину плоской, грудь развёрнутой, мышцы кора — в напряжении
      - Штанга висит на прямых руках под плечами

      ### 2. Движение
      1. Потяните штангу к низу груди или верху живота
      2. Отводите локти назад и слегка наружу во время тяги
      3. Продолжайте, пока гриф не коснётся корпуса
      4. В верхней точке сведите лопатки
      5. Медленно и подконтрольно опустите штангу в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, подтягивая штангу к корпусу
      - Вдыхайте, опуская штангу вниз

      ### 4. Советы
      - Держите спину плоской, а мышцы кора — в напряжении на протяжении всего движения
      - Обратный хват позволяет локтям идти ближе к телу
      - Сосредоточьтесь на сокращении широчайших и сведении лопаток
      - Сохраняйте постоянный угол наклона корпуса на протяжении всего подхода
      - Контролируйте вес в обоих направлениях

      ### 5. Частые ошибки
      - Округление спины вместо удержания её плоской
      - Слишком вертикальное положение корпуса, снижающее нагрузку на спину
      - Подъём веса рывком за счёт инерции
      - Неполная амплитуда движения
      - Чрезмерное разведение локтей в стороны
      - Слишком быстрый темп и потеря контроля

      ### 6. Безопасность и модификации
      - Начинайте с меньшего веса, чем в тяге прямым хватом, чтобы освоить хват
      - Используйте лямки, если сила хвата ограничивает вес
      - Продвинутый вариант: возьмите штангу более узким хватом для усиленной нагрузки на бицепсы
      - При дискомфорте в пояснице уменьшите вес и проверьте технику
