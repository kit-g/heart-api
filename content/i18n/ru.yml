  Decline Bench Press (Barbell):
    name: Жим на скамье с обратным наклоном (штанга)
    instructions: |
      ## Обзор
      Жим штанги на скамье с обратным наклоном — базовое жимовое упражнение, которое в первую очередь нагружает нижнюю часть большой грудной мышцы. В работу также включаются передние дельты и трицепсы; обратный наклон скамьи смещает акцент на низ груди и, как правило, позволяет работать с более тяжёлыми весами, чем в горизонтальном жиме.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на скамью с обратным наклоном, зафиксировав ноги под упорами
      - Расположитесь так, чтобы глаза находились прямо под грифом
      - Возьмитесь за гриф хватом чуть шире плеч
      - Снимите гриф со стоек и удерживайте его на полностью выпрямленных руках над нижней частью груди
      - Держите лопатки сведёнными и прижатыми к скамье

      ### 2. Движение
      1. Медленно опустите гриф к нижней части груди
      2. Держите локти под углом примерно 45 градусов к корпусу
      3. Слегка коснитесь грифом груди
      4. Сделайте короткую паузу в нижней точке
      5. Выжмите гриф вверх, выпрямляя руки
      6. Полностью выпрямите руки в верхней точке и продолжайте выполнять контролируемые повторения

      ### 3. Дыхание
      - Вдох — опуская гриф к груди
      - Выдох — выжимая гриф вверх

      ### 4. Советы
      - Держите лопатки сведёнными на протяжении всего упражнения
      - В верхней точке сосредоточьтесь на сокращении нижней части груди
      - Контролируйте опускание и не отбивайте гриф от груди
      - Держите ноги зафиксированными для сохранения устойчивости
      - Обратный наклон обычно позволяет работать с более тяжёлыми весами

      ### 5. Частые ошибки
      - Отбивание грифа от груди
      - Чрезмерное разведение локтей в стороны
      - Ненадёжная фиксация ног, приводящая к потере устойчивости
      - Неполная амплитуда движения
      - Слишком большой вес в ущерб технике
      - Потеря сведения лопаток

      ### 6. Безопасность и модификации
      - При работе с тяжёлыми весами всегда занимайтесь со страхующим
      - Перед снятием грифа со стоек убедитесь, что ноги надёжно зафиксированы
      - Начинайте с веса меньше, чем в горизонтальном жиме лёжа, чтобы адаптироваться
      - При дискомфорте в плечах измените ширину хвата
