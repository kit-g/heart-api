  Power Snatch (Barbell):
    name: Силовой рывок (штанга)
    instructions: |
      ## Обзор
      Силовой рывок — тяжелоатлетический вариант, нагружающий всё тело с акцентом на взрывную мощность. Штанга поднимается с пола над головой одним движением и принимается в частичном подседе, а не в глубоком, что делает упражнение более доступным, но по-прежнему мощно развивающим.

      ## Техника выполнения
