      - Наклонитесь через тазобедренные суставы и согните колени, чтобы взяться за гриф
      - Держите спину ровной, грудь вперёд, плечи над грифом
      - Руки прямые, хват широкий

      ### 2. Движение
      1. Мощно оттолкнитесь ногами, срывая штангу с пола
      2. Держите гриф близко к телу на всём пути вверх
      3. На уровне середины бедра мощно разогнитесь в тазобедренных и коленных суставах
      4. Уходите под штангу, пока она поднимается
      5. Примите штангу над головой в частичном подседе на прямые руки
      6. Полностью встаньте со штангой над головой, чтобы завершить повторение

      ### 3. Дыхание
      - Сделайте глубокий вдох перед тягой
      - Задержите дыхание на протяжении тяги и приёма
      - Выдохните после вставания со штангой над головой

      ### 4. Советы
      - Принимайте штангу выше, чем в полном рывке (выше параллели)
      - Широкий хват сокращает путь грифа
      - Этот вариант требует меньшей мобильности, чем полный рывок
      - Держите гриф близко к телу во время взрывной тяги
      - Сосредоточьтесь на скорости и генерации мощности

      ### 5. Частые ошибки
      - Слишком узкий хват
      - Тяга руками до полного разгибания таза
