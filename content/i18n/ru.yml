  Seated Dip (Machine):
    name: Отжимания на брусьях сидя (тренажёр)
    instructions: |
      ## Обзор
      Отжимания на брусьях сидя в тренажёре — жимовое упражнение, которое в первую очередь нагружает трицепсы. Грудные мышцы и передние дельты помогают в работе, а положение сидя и заданная траектория позволяют сосредоточиться на руках, не удерживая равновесие всем телом, как в классических отжиманиях на брусьях.

      ## Техника выполнения
      ### 1. Исходное положение
      - Отрегулируйте сиденье так, чтобы рукояти были примерно на уровне груди
      - Сядьте, плотно прижав спину к спинке
      - Возьмитесь за рукояти ладонями внутрь, локти согнуты
      - Поставьте стопы всей поверхностью на пол

      ### 2. Движение
      1. Выжмите рукояти вниз, выпрямляя руки
      2. Продолжайте до полного выпрямления рук, но без жёсткого замыкания локтей
      3. Сделайте короткую паузу и напрягите трицепсы
      4. Медленно согните локти и вернитесь в исходное положение
      5. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, выжимая рукояти вниз
      - Вдыхайте, возвращаясь вверх

      ### 4. Советы
      - Держите спину и плечи прижатыми к спинке
      - Ведите локти близко к корпусу
      - Контролируйте вес на обратном пути, не давая ему падать

      ### 5. Частые ошибки
      - Подъём плеч к ушам
      - Раскачивание корпуса для использования инерции
      - Удары плиток грузового стека между повторениями

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить траекторию рукоятей
      - При дискомфорте в плечах сократите амплитуду движения
      - Усложнённый вариант: добавьте паузу в точке полного выпрямления
