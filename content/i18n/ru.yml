  Trap Bar Deadlift:
    name: Становая тяга с трэп-грифом
    instructions: |
      ## Обзор
      Становая тяга с трэп-грифом — многосуставное упражнение, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и бицепс бедра. В работу также включаются разгибатели позвоночника, широчайшие и трапеции; шестиугольная конструкция грифа позволяет сохранять более нейтральное положение позвоночника и снижает нагрузку на поясницу.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте внутрь трэп-грифа, поставив ноги на ширине таза
      - Возьмитесь за рукояти по бокам нейтральным хватом
      - Выполните наклон через тазобедренные суставы и согните колени, чтобы дотянуться до рукоятей
      - Держите грудь расправленной, спину ровной, плечи — над грифом
      - Перед подъёмом напрягите мышцы кора и широчайшие

      ### 2. Движение
      1. Оттолкнитесь пятками и одновременно разогните тазобедренные суставы и колени
      2. Ведите гриф близко к телу на протяжении подъёма
      3. Полностью выпрямитесь, разогнув тазобедренные суставы и колени
      4. В верхней точке держите плечи отведёнными назад, а грудь расправленной
      5. Опустите гриф, отводя таз назад и сгибая колени
      6. Подконтрольно верните гриф на пол и повторите

      ### 3. Дыхание
      - Перед подъёмом сделайте глубокий вдох и напрягите мышцы кора
      - Задержите дыхание во время подъёма
      - Выдохните в верхней точке или при опускании грифа

      ### 4. Советы
      - Трэп-гриф обеспечивает более естественный нейтральный хват
      - Траектория грифа более вертикальная, чем в классической становой тяге
      - Этот вариант обычно легче переносится поясницей
      - Отталкивайтесь всей стопой, а не только носками
      - Думайте о том, что вы отталкиваете пол от себя, а не поднимаете гриф

      ### 5. Частые ошибки
      - Округление поясницы во время подъёма
      - Слишком высокое или слишком низкое положение таза на старте
      - Неполное разгибание тазобедренных суставов в верхней точке
      - Взгляд вверх или вниз вместо нейтрального положения шеи
      - Подъём за счёт рук вместо работы ног и таза
      - Неиспользование преимуществ нейтрального хвата

      ### 6. Безопасность и модификации
      - Начинайте с небольшого веса, чтобы привыкнуть к трэп-грифу
      - У многих трэп-грифов есть высокие и низкие рукояти; начинайте с высоких
      - Этот вариант отлично подходит тем, кто бережёт поясницу
      - При дискомфорте в пояснице проверьте технику и уменьшите вес
