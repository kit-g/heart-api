    instructions: |
      ## Обзор
      Тяга верхнего блока широким хватом — тяговое упражнение на тренажёре, которое в первую очередь нагружает широчайшие мышцы спины с акцентом на ширину. В работу также включаются ромбовидные мышцы и средняя часть трапеций; широкий хват нацелен на внешнюю часть широчайших и помогает визуально расширить спину.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для тяги верхнего блока, зафиксировав бёдра под упорами
      - Возьмитесь за рукоять прямым хватом значительно шире плеч
      - Полностью вытяните руки вверх, сохраняя натяжение троса
      - Держите грудь поднятой, плечи опущенными
      - Напрягите мышцы кора и держите корпус вертикально

      ### 2. Движение
      1. Потяните рукоять вниз к верхней части груди, уводя локти вниз и в стороны
      2. Держите корпус вертикально или отклонитесь назад совсем слегка
      3. Продолжайте, пока рукоять не коснётся верхней части груди
      4. В нижней точке сведите лопатки
      5. Медленно и подконтрольно верните рукоять в исходное положение
      6. Останавливайтесь чуть раньше, чем грузоблок коснётся упора, чтобы сохранить натяжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, когда тянете рукоять вниз
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Из-за ширины хвата локти будут разведены шире
      - Сосредоточьтесь на движении локтей вниз, к бокам
      - Держите грудь поднятой, а плечи отведёнными назад на протяжении всего движения
      - Сохраняйте постоянное натяжение, не позволяя грузоблоку опускаться до конца
      - Избегайте чрезмерного наклона и раскачивания корпуса

      ### 5. Частые ошибки
      - Слишком широкий хват, ограничивающий амплитуду движения
