  Straight Leg Deadlift (Band):
    name: Тяга на прямых ногах (лента)
    instructions: |
      ## Обзор
      Тяга на прямых ногах с лентой — упражнение на наклон через тазобедренные суставы с сопротивлением ленты, которое в первую очередь нагружает бицепс бедра и разгибатели позвоночника. В работу также включаются ягодичные мышцы и широчайшие; прогрессирующее сопротивление ленты и минимальное сгибание коленей акцентируют нагрузку на задней цепи.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте на середину ленты, поставив ноги на ширине таза
      - Возьмитесь за оба конца ленты, руки чуть шире ног
      - Встаньте прямо: грудь расправлена, плечи отведены назад, мышцы кора напряжены
      - Сохраняйте лишь совсем небольшой сгиб в коленях на протяжении всего упражнения

      ### 2. Движение
      1. Выполните наклон через тазобедренные суставы, отводя таз назад и опуская корпус
      2. Держите спину ровной, а ленту — близко к ногам
      3. Держите ноги почти прямыми, с минимальным сгибанием коленей
      4. Опускайтесь до ощущения растяжения в бицепсе бедра
      5. Подайте таз вперёд и вернитесь в исходное положение
      6. Напрягите ягодичные мышцы в верхней точке и повторите, выполняя повторения подконтрольно

      ### 3. Дыхание
      - Вдох — при наклоне вперёд
      - Выдох — при подаче таза вперёд и выпрямлении

      ### 4. Советы
      - Держите ноги почти прямыми на протяжении всего движения
      - Сосредоточьтесь на наклоне через тазобедренные суставы, а не на приседании
      - Держите спину ровной, а грудь расправленной на протяжении всего упражнения
      - Отводите таз назад как можно дальше
      - Сопротивление ленты нарастает по мере выпрямления

      ### 5. Частые ошибки
      - Округление спины вместо сохранения ровного положения позвоночника
      - Чрезмерное сгибание коленей, превращающее упражнение в румынскую тягу
      - Недостаточное отведение таза назад
      - Опускание слишком глубоко, дальше точки растяжения бицепса бедра
      - Потеря постоянного натяжения ленты
      - Взгляд вверх вместо нейтрального положения шеи

      ### 6. Безопасность и модификации
      - Начинайте с ленты послабее, чтобы освоить наклон через тазобедренные суставы с прямыми ногами
      - Меняйте положение стоп на ленте, чтобы регулировать сопротивление
      - Если этот вариант ощущается слишком тяжёлым, переходите к нему от румынской тяги
      - При дискомфорте в пояснице уменьшите сопротивление и проверьте технику
