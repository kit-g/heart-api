  Strict Military Press (Barbell):
    name: Строгий армейский жим (штанга)
    instructions: |
      ## Обзор
      Строгий армейский жим — базовое упражнение для верхней части тела, нацеленное в первую очередь на все три пучка дельт. Оно также задействует трицепсы, верхнюю часть груди и мышцы кора; строгая стойка без помощи ног развивает чистую силу жима плечами.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте по стойке «смирно», стопы вместе или почти вместе, штанга на уровне верхней части груди
      - Возьмитесь за гриф чуть шире плеч, ладони направлены вперёд
      - Снимите гриф со стоек и удерживайте его на уровне плеч
      - Держите тело жёстким: грудь вперёд, кор напряжён, ягодичные мышцы включены
      - Сохраняйте строевую осанку на протяжении всего упражнения

      ### 2. Движение
      1. Выжмите гриф строго вверх над головой, выпрямляя руки
      2. Держите тело абсолютно жёстким, без помощи ног и инерции
      3. Продолжайте жать до полного выпрямления рук над головой
      4. Полностью выпрямите локти в верхней точке, гриф над серединой стопы
      5. Подконтрольно опустите гриф обратно на уровень плеч
      6. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Сделайте вдох и напрягите мышцы кора перед жимом
      - Задержите дыхание во время жима
      - Выдохните в верхней точке или при опускании грифа

      ### 4. Советы
      - Сохраняйте строгую строевую осанку, полностью исключив помощь ног
      - Держите всё тело жёстким от стоп до плеч
      - Жмите гриф по строго вертикальной траектории
      - Строгая техника развивает чистую силу плеч
      - Этот вариант требует меньшего веса, чем обычный жим над головой

      ### 5. Частые ошибки
      - Любая помощь ног или использование инерции
      - Чрезмерный прогиб поясницы во время жима
      - Жим грифа вперёд вместо строго вверх
      - Потеря жёсткого положения тела
      - Постановка стоп шире строевой стойки
      - Слишком большой вес до освоения строгой техники

      ### 6. Безопасность и модификации
      - Начинайте со значительно меньшего веса, чем в обычном жиме над головой
      - Освойте обычный жим над головой, прежде чем переходить к строгому армейскому жиму
      - Тренируясь в одиночку, используйте силовую раму со страховочными упорами
      - Это продвинутый вариант, требующий строгой техники и контроля
