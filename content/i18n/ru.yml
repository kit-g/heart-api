  Flat Knee Raise:
    name: Подъёмы коленей лёжа
    instructions: |
      ## Обзор
      Подъёмы коленей лёжа — упражнение на кор с собственным весом, которое в первую очередь нагружает нижнюю часть прямой мышцы живота и сгибатели бедра. В качестве стабилизаторов также работают поперечная и косые мышцы живота, что делает упражнение доступной отправной точкой для развития силы нижней части пресса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину на коврик, вытянув ноги
      - Положите руки вдоль корпуса у бёдер или подложите под ягодицы для поддержки
      - Прижмите поясницу к коврику и напрягите мышцы кора
      - Держите голову и плечи расслабленными на коврике
      - Сохраняйте нейтральное положение шеи, глядя в потолок

      ### 2. Движение
      1. Согните колени и поднимите их к груди, сокращая нижнюю часть пресса
      2. Продолжайте, пока колени не окажутся прямо над тазом или чуть дальше
      3. Прижимайте поясницу к коврику на протяжении всего движения
      4. Ненадолго задержитесь в верхней точке
      5. Медленно и подконтрольно опустите колени обратно
      6. Останавливайтесь чуть раньше, чем стопы коснутся пола, чтобы сохранить напряжение, затем повторите

      ### 3. Дыхание
      - Выдыхайте, поднимая колени к груди
      - Вдыхайте, опуская колени в исходное положение

      ### 4. Советы
      - Поднимайте колени за счёт нижней части пресса, а не только сгибателей бедра
      - Прижимайте поясницу к коврику, чтобы защитить позвоночник
      - Двигайтесь медленно и подконтрольно во всей амплитуде
      - Сохраняйте постоянное напряжение, не позволяя стопам касаться пола между повторениями
      - Держите верх тела расслабленным, чтобы избежать напряжения в шее

      ### 5. Частые ошибки
      - Отрыв поясницы от коврика
      - Подъём ног рывком за счёт инерции вместо контролируемого сокращения
      - Слишком быстрый темп в ущерб технике
      - Полное касание пола стопами между повторениями
      - Излишнее напряжение шеи и верха тела
      - Задержка дыхания во время движения

      ### 6. Безопасность и модификации
      - Новички могут выполнять подъёмы с меньшей амплитудой, не поднимая колени так высоко
      - Подложите ладони под ягодицы для дополнительной поддержки поясницы
      - Продвинутый вариант: пауза 2–3 секунды в верхней точке каждого повторения
      - Освоив подъёмы коленей с правильной техникой, переходите к упражнению «Подъёмы ног лёжа»
