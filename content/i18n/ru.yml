      ### 2. Движение
      1. Поставьте одну ногу полной стопой на тумбу
      2. Оттолкнитесь пяткой верхней ноги и зашагните наверх
      3. Приставьте вторую ногу на тумбу
      4. Полностью выпрямитесь стоя на тумбе
      5. Спуститесь вниз с той же ноги, с которой зашагивали
      6. Повторите нужное число повторений, затем смените ногу

      ### 3. Дыхание
      - Вдох — перед зашагиванием
      - Выдох — при подъёме на тумбу

      ### 4. Советы
      - Отталкивайтесь пяткой верхней ноги, а не носком
      - Не отталкивайтесь опорной ногой, стоящей на полу
      - Держите грудь расправленной, а корпус вертикально на протяжении всего движения
      - Сосредоточьтесь на контролируемом движении в обеих фазах
      - Начинайте с невысокой тумбы и повышайте высоту постепенно

      ### 5. Частые ошибки
      - Толчок опорной ногой с использованием инерции
      - Чрезмерный наклон корпуса вперёд при зашагивании
      - Стопа поставлена на тумбу не полностью
      - Колено заваливается внутрь
      - Слишком высокая тумба, не позволяющая соблюдать технику
      - Неполное выпрямление стоя на тумбе

      ### 6. Безопасность и модификации
      - Убедитесь, что тумба устойчива и не скользит
      - Начинайте с невысокой тумбы (30–45 см), чтобы освоить технику
      - На первых порах держитесь за опору для равновесия
      - Продвинутый вариант: добавьте гантели, штангу или увеличьте высоту тумбы
