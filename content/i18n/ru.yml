      - Не прогибайтесь в пояснице во время движения
      - Сосредоточьтесь на растяжении в нижней точке и сокращении в верхней
      - Контролируйте вес по всей амплитуде движения

      ### 5. Частые ошибки
      - Чрезмерное разведение локтей в стороны
