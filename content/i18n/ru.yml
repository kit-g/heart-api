  Chin Up (Assisted):
    name: Подтягивания обратным хватом (гравитрон)
    instructions: |
      ## Обзор
      Подтягивания обратным хватом в гравитроне — тяговое упражнение в тренажёре, которое в первую очередь нагружает широчайшие и бицепсы с поддержкой противовеса. Также работают ромбовидные мышцы и средняя часть трапеций: противовес делает подтягивания доступнее и помогает набрать силу для подтягиваний без поддержки.

      ## Техника выполнения
      ### 1. Исходное положение
      - Установите вес противовеса на гравитроне (больше вес — больше помощь)
      - Возьмитесь за рукояти обратным хватом, руки на ширине плеч
      - Поставьте колени или стопы на платформу противовеса
      - Повисните на полностью выпрямленных руках, плечи в тонусе
      - Держите мышцы кора в напряжении, а тело — стабильным

      ### 2. Движение
      1. Подтянитесь, направляя локти вниз и назад
      2. Продолжайте, пока подбородок не поднимется выше рукоятей или перекладины
      3. Держите мышцы кора в напряжении и двигайтесь подконтрольно
      4. Сделайте короткую паузу в верхней точке
      5. Медленно и подконтрольно опуститесь в исходное положение
      6. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, подтягиваясь вверх
      - Вдыхайте, опускаясь вниз

      ### 4. Советы
      - Постепенно уменьшайте вес противовеса по мере роста силы
      - Тяните за счёт мышц спины, а не только рук
      - Держите плечи опущенными и отведёнными назад
      - Контролируйте и подъём, и опускание
      - Не полагайтесь на противовес слишком сильно

      ### 5. Частые ошибки
      - Слишком большой противовес, не дающий достаточной нагрузки
      - Неполная амплитуда движения
      - Подъём плеч к ушам
      - Использование инерции вместо контролируемого движения
      - Отсутствие постепенного уменьшения противовеса со временем
      - Тяга только руками без включения спины

      ### 6. Безопасность и модификации
      - Начинайте с большей поддержкой и постепенно уменьшайте её по мере роста силы
      - Ставьте технику выше слишком быстрого уменьшения противовеса
      - Перед подтягиваниями без поддержки переходите к варианту с лентой или негативным повторениям
      - В качестве альтернативы выполняйте тягу верхнего блока для создания базовой силы
