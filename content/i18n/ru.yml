      ### 1. Исходное положение
      - Примите положение планки на прямых руках, ладони строго под плечами
      - Держите тело прямой линией от головы до пяток
      - Напрягите мышцы кора и держите таз ровно
      - Поставьте ноги на ширине таза

      ### 2. Движение
      1. Подтяните одно колено к груди беговым движением
      2. Быстро смените ноги: верните согнутую ногу назад и подтяните к груди другое колено
      3. Продолжайте чередовать ноги в ритмичном беговом темпе
      4. Держите мышцы кора напряжёнными, а таз ровным на протяжении всего упражнения
      5. Поддерживайте ровный темп или ускорьтесь для повышения интенсивности
      6. Продолжайте нужное количество повторений или заданное время

      ### 3. Дыхание
      - Дышите ритмично и равномерно на протяжении всего движения
      - Не задерживайте дыхание

      ### 4. Советы
      - Держите мышцы кора напряжёнными, чтобы таз не провисал и не поднимался вверх
      - Сохраняйте положение планки на протяжении всего движения
      - Сосредоточьтесь на подтягивании коленей к груди, а не просто на движении ног
      - Начинайте медленно, чтобы отработать технику, прежде чем наращивать темп
      - Держите ладони плотно на полу, а плечи стабильными

      ### 5. Частые ошибки
      - Провисание таза или подъём его вверх «домиком»
      - Подпрыгивание тазом вверх-вниз на каждом повторении
      - Недостаточное подтягивание коленей к груди
      - Округление плеч вперёд
      - Слишком быстрый темп с потерей техники
      - Задержка дыхания во время упражнения

      ### 6. Безопасность и модификации
      - Начните с медленного варианта «скалолаза», чтобы отработать технику
      - Для облегчения поставьте руки на скамью
      - Выполняйте медленные контролируемые повторения для большей нагрузки на мышцы кора
      - Продвинутый вариант: добавьте скручивание, подтягивая колено к противоположному локтю, или увеличьте темп
