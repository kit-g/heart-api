  Decline Crunch:
    name: Скручивания на скамье с обратным наклоном
    instructions: |
      ## Обзор
      Скручивания на скамье с обратным наклоном — продвинутое упражнение на кор, которое в первую очередь нагружает прямую мышцу живота с повышенным сопротивлением за счёт силы тяжести. В качестве стабилизаторов также работают сгибатели бедра и косые мышцы, поэтому из-за наклонного положения упражнение сложнее обычных скручиваний на полу.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на скамью с обратным наклоном, зафиксировав стопы под валиками
      - Установите умеренный угол наклона (обычно 15–30 градусов)
      - Слегка заведите руки за голову или скрестите их на груди
      - Если руки за головой, направьте локти в стороны
      - Напрягите мышцы кора и сохраняйте нейтральное положение позвоночника

      ### 2. Движение
      1. Оторвите лопатки от скамьи, сокращая мышцы пресса
      2. Скручивайте верх корпуса вперёд, приближая грудную клетку к тазу
      3. На выдохе сожмите пресс в верхней точке на 1–2 секунды
      4. Медленно и подконтрольно опустите плечи обратно
      5. Останавливайтесь чуть раньше, чем плечи коснутся скамьи, чтобы сохранить напряжение
      6. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Мощно выдыхайте, скручиваясь вверх и сокращая пресс
      - Вдыхайте, опускаясь в исходное положение

      ### 4. Советы
      - Сосредоточьтесь на скручивании корпуса, а не на подъёме за счёт шеи
      - Сохраняйте постоянное напряжение пресса, не расслабляясь полностью между повторениями
      - Не тяните голову и шею руками
      - Начинайте с небольшого наклона и постепенно увеличивайте угол
      - Двигайтесь медленно и подконтрольно, чтобы максимально включить мышцы

      ### 5. Частые ошибки
      - Тяга за шею руками, что может привести к перенапряжению
      - Подъём рывком за счёт инерции вместо контролируемого сокращения
      - Слишком крутой наклон до того, как набрана достаточная сила
      - Переразгибание поясницы при опускании
      - Слишком быстрый темп в ущерб технике
      - Полное расслабление между повторениями и потеря напряжения в коре

      ### 6. Безопасность и модификации
      - Новичкам стоит начинать с горизонтальной скамьи или совсем небольшого наклона
      - Продвинутый вариант: держите блин на груди для дополнительного сопротивления
      - При дискомфорте уменьшите угол наклона или вернитесь к скручиваниям на полу
      - Прогрессируйте, постепенно увеличивая угол наклона по мере роста силы
