  Bent Over One Arm Row (Dumbbell):
    name: Тяга гантели одной рукой в наклоне
    instructions: |
      ## Обзор
      Тяга гантели одной рукой в наклоне — одностороннее тяговое упражнение, которое в первую очередь нагружает широчайшие, ромбовидные мышцы и среднюю часть трапеций. Также работают бицепсы и задние дельты: упражнение позволяет устранять дисбаланс в силе и работать с большей амплитудой, чем двусторонние тяги.

      ## Техника выполнения
      ### 1. Исходное положение
      - Поставьте одно колено и одноимённую руку на горизонтальную скамью для опоры
      - Другую ногу поставьте на пол, слегка согнув колено
      - Возьмите гантель в свободную руку, рука свисает прямо вниз
      - Держите спину плоской и параллельной полу
      - Напрягите мышцы кора и сохраняйте нейтральное положение позвоночника

      ### 2. Движение
      1. Потяните гантель вверх, направляя локоть к потолку
      2. Держите локоть близко к телу во время тяги
      3. Продолжайте, пока гантель не дойдёт до бедра или нижней части рёбер
      4. В верхней точке сведите лопатку к позвоночнику
      5. Медленно и подконтрольно опустите гантель в исходное положение
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Выдыхайте, поднимая гантель
      - Вдыхайте, опуская гантель вниз

      ### 4. Советы
      - Ведите движение локтем, а не кистью
      - Держите корпус стабильным и не вращайте его
      - Сосредоточьтесь на сокращении мышц спины в верхней точке
      - Держите спину плоской на протяжении всего движения
      - Контролируйте вес в обоих направлениях

      ### 5. Частые ошибки
      - Вращение корпуса вместо его стабилизации
      - Подъём веса рывком за счёт инерции
      - Неполная амплитуда движения
      - Округление спины вместо удержания её плоской
      - Тяга рукой вместо мышц спины
      - Слишком быстрый темп и потеря контроля

      ### 6. Безопасность и модификации
      - Начинайте с умеренного веса, чтобы освоить технику
      - Можно выполнять без скамьи: наклонитесь через тазобедренные суставы и обопритесь свободной рукой о бедро
      - Продвинутый вариант: задержитесь на 2–3 секунды в верхней точке каждого повторения
      - Выполняйте одинаковое число повторений на обе стороны для сбалансированного развития
