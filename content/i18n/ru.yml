      Горизонтальная тяга в тренажёре — горизонтальное тяговое упражнение, которое в первую очередь нагружает широчайшие мышцы спины, ромбовидные мышцы и среднюю часть трапеций. В работу также включаются бицепсы и задние дельты; фиксированная траектория движения обеспечивает стабильность и равномерное сопротивление на протяжении всей тяги.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр, прижав грудь к упору
      - Отрегулируйте высоту сиденья так, чтобы рукояти были на уровне середины груди
      - Плотно поставьте стопы на подставки
      - Возьмитесь за рукояти обеими руками
      - Держите грудь поднятой, плечи отведёнными назад

      ### 2. Движение
      1. Потяните рукояти к корпусу, уводя локти назад
      2. Держите грудь прижатой к упору на протяжении всего движения
      3. Продолжайте, пока локти не окажутся позади корпуса
      4. В конечной точке сведите лопатки
      5. Медленно и подконтрольно верните рукояти в исходное положение
      6. Останавливайтесь чуть раньше, чем грузоблок коснётся упора, чтобы сохранить натяжение, и повторяйте

      ### 3. Дыхание
      - Выдыхайте, когда тянете рукояти к корпусу
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите грудь плотно прижатой к упору, чтобы изолировать мышцы спины
      - Ведите движение локтями, уводя их назад за корпус
      - Сосредоточьтесь на сведении лопаток
      - Сохраняйте постоянное натяжение, не позволяя грузоблоку опускаться до конца
      - Контролируйте вес на всей амплитуде движения

      ### 5. Частые ошибки
      - Отрыв груди от упора во время тяги
      - Работа за счёт инерции вместо контролируемого мышечного сокращения
      - Неполная амплитуда движения
      - Подъём плеч к ушам
      - Опускание грузоблока до упора между повторениями
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Отрегулируйте высоту сиденья, чтобы рукояти располагались правильно
      - Начинайте с лёгкого веса, чтобы наладить нейромышечную связь
      - Попробуйте разные рукояти, если они доступны
      - Усложнённый вариант: задержитесь на 2-3 секунды в точке пикового сокращения
