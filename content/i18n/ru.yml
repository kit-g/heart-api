    name: Жим лёжа узким хватом (штанга)
    instructions: |
      ## Обзор
      Жим лёжа узким хватом — упражнение со штангой, которое в первую очередь нагружает трицепсы. Грудные мышцы и передние дельты работают как вспомогательные, что делает его эффективным базовым движением для развития жимовой силы верха тела с акцентом на трицепсы.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на скамью, плотно поставив стопы на пол
      - Возьмите штангу хватом чуть уже ширины плеч
      - Расположитесь так, чтобы гриф находился прямо над верхней частью груди
      - Снимите штангу со стоек и держите её на полностью выпрямленных руках
      - Сведите лопатки и прижмите их к скамье

      ### 2. Движение
      1. Медленно опустите гриф к нижней части груди или верхней части живота
      2. Держите локти прижатыми к бокам под углом около 45 градусов к корпусу
      3. Опускайте гриф, пока он слегка не коснётся корпуса
      4. Сделайте короткую паузу внизу
      5. Выжмите гриф вверх, выпрямляя руки
      6. Полностью выпрямите локти в верхней точке и повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опуская гриф к груди
      - Выдыхайте, выжимая гриф вверх

      ### 4. Советы
      - Держите локти прижатыми на протяжении всего движения для максимальной работы трицепсов
      - Сохраняйте стабильное, ровное положение спины на скамье
      - Используйте хват, который комфортен, но уже, чем в обычном жиме лёжа
      - Держите запястья прямыми, на одной линии с предплечьями
      - Контролируйте опускание и не отбивайте гриф от груди

      ### 5. Частые ошибки
      - Слишком узкий хват, который перегружает запястья
      - Чрезмерное разведение локтей в стороны
      - Отбив грифа от груди вместо контролируемого касания и жима
      - Чрезмерный прогиб спины
      - Слишком большой вес в ущерб технике
      - Неполное опускание грифа до груди

      ### 6. Безопасность и модификации
      - Работайте со страхующим при подъёме больших весов
      - Начните с лёгкого веса, чтобы освоить технику с прижатыми локтями
      - При дискомфорте в запястьях слегка расширьте хват
      - Продвинутый вариант: добавьте цепи или ленты для переменного сопротивления
