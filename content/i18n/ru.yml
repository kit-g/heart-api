  Power Clean:
    name: Силовое взятие на грудь
    instructions: |
      ## Обзор
      Силовое взятие на грудь — тяжелоатлетический вариант, нагружающий всю заднюю цепь, трапеции и плечи. От полного взятия на грудь оно отличается приёмом штанги в частичном подседе, а не в глубоком, с акцентом на взрывную мощность, и более доступно для атлетов.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, стопы на ширине таза, гриф над серединой стопы
      - Возьмитесь за гриф сразу за линией ног
      - Наклонитесь через тазобедренные суставы и согните колени, чтобы взяться за гриф
      - Держите спину ровной, грудь вперёд, плечи над грифом
      - Включите широчайшие и напрягите мышцы кора перед тягой

      ### 2. Движение
      1. Мощно оттолкнитесь ногами, срывая штангу с пола
      2. Держите гриф близко к телу на всём пути вверх
      3. Когда гриф достигнет середины бедра, мощно разогнитесь в тазобедренных и коленных суставах
      4. Слегка уйдите под штангу
      5. Примите гриф на плечи в частичном подседе
      6. Полностью встаньте, чтобы завершить повторение

      ### 3. Дыхание
      - Сделайте глубокий вдох перед тягой
      - Задержите дыхание на протяжении тяги и приёма штанги
      - Выдохните после вставания

      ### 4. Советы
      - Принимайте штангу выше, чем в полном взятии на грудь (выше параллели)
      - Сосредоточьтесь на взрывном разгибании таза и скорости ухода под штангу
      - Этот вариант требует меньшей мобильности, чем полное взятие на грудь
      - Держите траекторию грифа близко к телу
      - Отлично подходит для общей атлетической подготовки

