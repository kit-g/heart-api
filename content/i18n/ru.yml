  Pull Up:
    name: Подтягивания
    instructions: |
      ## Обзор
      Подтягивания — тяговое упражнение с собственным весом, которое в первую очередь нагружает широчайшие мышцы спины. В работу также включаются ромбовидные мышцы, средняя часть трапеций, бицепсы и мышцы кора, что делает подтягивания одним из самых эффективных упражнений для верха тела, развивающим ширину спины и силу тяги.

      ## Техника выполнения
      ### 1. Исходное положение
      - Повисните на перекладине прямым хватом, руки чуть шире плеч
      - Полностью выпрямите тело, руки прямые
      - Напрягите мышцы кора и держите плечи опущенными
      - Скрестите лодыжки или держите ноги прямыми
      - Избегайте лишнего раскачивания

      ### 2. Движение
      1. Подтянитесь, уводя локти вниз и назад
      2. Ведите движение грудью, плечи отведены назад
      3. Продолжайте тянуться, пока подбородок не окажется выше перекладины
      4. Держите мышцы кора в напряжении на протяжении всего движения
      5. Коротко задержитесь в верхней точке
      6. Медленно опуститесь в исходное положение до полного выпрямления рук

      ### 3. Дыхание
      - Выдыхайте, когда подтягиваетесь вверх
      - Вдыхайте, когда опускаетесь вниз

      ### 4. Советы
      - Думайте о том, чтобы тянуть локти вниз, а не подбородок вверх
      - Держите плечи включёнными, не позволяйте им подниматься к ушам
      - Контролируйте опускание для максимального включения мышц
      - Работайте в полной амплитуде: от виса на прямых руках до подбородка над перекладиной
      - Держите мышцы кора в напряжении, чтобы свести раскачивание к минимуму

      ### 5. Частые ошибки
      - Использование инерции или киппинга вместо строгой техники
      - Неполная амплитуда в верхней или нижней точке
      - Подъём плеч к ушам
      - Чрезмерное раскачивание во время движения
      - Неполное выпрямление рук в нижней точке
      - Тяга только руками без включения спины

      ### 6. Безопасность и модификации
      - Используйте гравитрон или ленту для поддержки
      - Выполняйте негативные подтягивания (запрыгните в верхнюю точку и медленно опуститесь), чтобы набрать силу
      - Усложнённый вариант: добавьте вес с помощью пояса для отягощений или жилета-утяжелителя
      - Прогрессируйте постепенно, чтобы не перегрузить плечи
