    source_digest: 3251f7b9e0af
  Cross Body Crunch:
    name: Диагональные скручивания
    instructions: |
      ## Обзор
      Диагональные скручивания — ротационное упражнение на кор, которое в первую очередь нагружает косые мышцы живота и прямую мышцу живота. Также включаются сгибатели бедра и поперечная мышца живота, когда вы тянете локоть к противоположному колену, что делает упражнение эффективным для развития ротационной силы кора.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину на коврик, согните колени, стопы поставьте на пол
      - Слегка заведите руки за голову, локти направьте в стороны
      - Немного приподнимите плечи от коврика и напрягите мышцы кора
      - Прижимайте поясницу к коврику на протяжении всего движения

      ### 2. Движение
      1. Оторвите правое плечо от коврика, одновременно подтягивая левое колено к груди
      2. Поверните корпус, направляя правый локоть к левому колену
      3. Сосредоточьтесь на вращении всего корпуса, а не только на движении локтя
      4. Ненадолго задержитесь, когда локоть и колено сблизятся
      5. Подконтрольно опуститесь в исходное положение
      6. Повторите в другую сторону, направляя левый локоть к правому колену
      7. Продолжайте чередовать стороны нужное число повторений

      ### 3. Дыхание
      - Выдыхайте на скручивании с поворотом к колену
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите шею расслабленной и не тяните голову руками
      - Начинайте движение с мышц кора, а не с рук
      - Сохраняйте постоянное напряжение пресса на протяжении всего движения
      - Прижимайте поясницу к коврику, чтобы защитить позвоночник
      - Двигайтесь подконтрольно, а не быстро — так эффективнее

      ### 5. Частые ошибки
      - Тяга за шею или голову вместо работы мышцами кора
      - Движение только локтем вместо поворота всего корпуса
      - Отрыв поясницы от коврика
      - Слишком быстрый темп и потеря техники
      - Использование инерции вместо контролируемого мышечного сокращения
      - Недостаточное включение косых мышц в повороте

      ### 6. Безопасность и модификации
      - Новички могут держать обе стопы на полу и выполнять поворот без подъёма колена
      - Продвинутый вариант: удержание в сокращённом положении 2–3 секунды на каждой стороне
      - При дискомфорте в шее поддерживайте голову одной рукой, а другой тянитесь к колену
      - Усложняйте упражнение, замедляя темп и увеличивая время под нагрузкой
