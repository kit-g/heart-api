      - Держите лопатки сведёнными и прижатыми к спинке

      ### 2. Движение
      1. Выжмите рукояти вперёд, выпрямляя руки
      2. Держите спину плотно прижатой к спинке на протяжении всего движения
      3. Продолжайте, пока руки не будут полностью выпрямлены
      4. Сделайте короткую паузу в точке полного выпрямления
      5. Медленно и подконтрольно верните рукояти в исходное положение
      6. Выполните нужное количество контролируемых повторений

