      ## Техника выполнения
      ### 1. Исходное положение
      - Установите регулируемую скамью под углом 30–45 градусов
      - Лягте на скамью, плотно поставив стопы на пол
      - Расположитесь так, чтобы глаза находились под грифом
      - Возьмитесь за гриф хватом чуть шире плеч
      - Снимите гриф со стоек и удерживайте его на выпрямленных руках над верхней частью груди

      ### 2. Движение
      1. Медленно опустите гриф к верхней части груди или к ключицам
      2. Держите локти под углом примерно 45 градусов к корпусу
      3. Слегка коснитесь грифом груди
      4. Сделайте короткую паузу в нижней точке
      5. Выжмите гриф вверх, выпрямляя руки
      6. Полностью выпрямите руки в верхней точке и продолжайте выполнять контролируемые повторения

      ### 3. Дыхание
      - Вдох — опуская гриф к груди
      - Выдох — выжимая гриф вверх

      ### 4. Советы
      - Держите лопатки сведёнными на протяжении всего упражнения
      - Сохраняйте наклон скамьи 30–45 градусов для оптимальной работы верха груди
      - Контролируйте опускание и не отбивайте гриф от груди
      - Держите стопы прижатыми к полу, а мышцы кора — напряжёнными для устойчивости
      - В верхней точке сосредоточьтесь на сокращении верхней части груди

      ### 5. Частые ошибки
      - Слишком крутой наклон (более 45 градусов), смещающий нагрузку на плечи
      - Отбивание грифа от груди
      - Чрезмерное разведение локтей в стороны
      - Отрыв ягодиц от скамьи
      - Неполная амплитуда движения
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - При работе с тяжёлыми весами всегда занимайтесь со страхующим
      - Начинайте с веса меньше, чем в горизонтальном жиме лёжа
