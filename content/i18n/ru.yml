  Knees to Elbows:
    name: Колени к локтям
    instructions: |
      ## Обзор
      «Колени к локтям» — продвинутое упражнение на кор в висе, которое в первую очередь нагружает всю прямую мышцу живота и сгибатели бедра. Также работают косые и поперечная мышцы живота, хват и стабилизаторы плеч; упражнение требует серьёзного контроля кора и координации.

      ## Техника выполнения
      ### 1. Исходное положение
      - Повисните на перекладине, взявшись прямым хватом на ширине плеч
      - Полностью выпрямитесь в висе, стопы не касаются пола
      - Напрягите мышцы кора и опустите плечи вниз и назад
      - Стабилизируйте корпус, чтобы избежать раскачивания
      - Держите ноги вместе на протяжении всего движения

      ### 2. Движение
      1. Поднимите колени к локтям, сокращая мышцы пресса
      2. Слегка отклонитесь назад и поднимите колени как можно выше
      3. Стремитесь коснуться локтей коленями или максимально приблизиться к ним
      4. Двигайтесь подконтрольно и избегайте чрезмерного раскачивания
      5. Ненадолго задержитесь в верхней точке
      6. Медленно и подконтрольно опустите колени в исходное положение
      7. Выполните нужное число контролируемых повторений

      ### 3. Дыхание
      - Мощно выдыхайте, поднимая колени к локтям
      - Вдыхайте, опуская колени в исходное положение

      ### 4. Советы
      - Ведите колени вверх и вперёд, а не просто вверх
      - Позвольте лёгкий наклон назад, чтобы коленям было проще дотянуться до локтей
      - Держите плечи в тонусе и не висите пассивно
      - Минимизируйте раскачивание, сохраняя напряжение кора
      - Думайте о скручивании всего корпуса, а не просто о подъёме ног

      ### 5. Частые ошибки
      - Чрезмерная инерция и раскачивание вместо контролируемого сокращения
      - Недостаточно высокий подъём коленей для полного включения кора
      - Подъём плеч к ушам
      - Слишком быстрый темп и потеря контроля
      - Ослабление хвата, из-за чего страдает техника
      - Отсутствие лёгкого наклона назад, из-за чего сложнее дотянуться до локтей

      ### 6. Безопасность и модификации
      - Сначала освойте подъёмы коленей в висе, прежде чем браться за этот продвинутый вариант
      - Если хват ограничивает, используйте кистевые лямки
      - Новички могут выполнять упражнение в капитанском кресле с опорой
      - Продвинутый вариант: добавьте поворот, поочерёдно направляя колени к противоположным локтям
