  Lateral Box Jump:
    name: Боковые запрыгивания на тумбу
    instructions: |
      ## Обзор
      Боковые запрыгивания на тумбу — плиометрическое упражнение, которое в первую очередь нагружает квадрицепсы, ягодичные мышцы и икры. Оно также задействует отводящие мышцы бедра и стабилизаторы кора: взрывные прыжки вбок развивают мощность ног, координацию и боковую атлетичность.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте сбоку от устойчивой тумбы или платформы, ноги на ширине таза
      - Расположитесь на расстоянии примерно 30 см от тумбы
      - Держите грудь расправленной, мышцы кора напряжёнными
      - Слегка согните колени и приготовьтесь к прыжку вбок
      - Держите руки наготове для создания импульса

      ### 2. Движение
      1. Сделайте мах руками и взрывным движением запрыгните вбок на тумбу
      2. Приземлитесь мягко на тумбу одновременно обеими ногами
      3. Погасите удар, приземлившись в положение полуприседа
      4. Полностью выпрямитесь, стоя на тумбе
      5. Сойдите с тумбы шагом на противоположную сторону
      6. Сразу же запрыгните вбок обратно на исходную сторону и повторите

      ### 3. Дыхание
      - Вдыхайте в подготовительной фазе
      - Мощно выдыхайте в момент прыжка

      ### 4. Советы
      - Сосредоточьтесь на взрывном боковом усилии ног
      - Приземляйтесь мягко на согнутые колени, чтобы погасить удар
      - Держите грудь расправленной, а взгляд направленным на тумбу
      - Помогайте себе руками для создания бокового импульса
      - Начинайте с низкой тумбы и повышайте высоту постепенно

      ### 5. Частые ошибки
      - Приземление на прямые ноги, повышающее риск травмы
      - Использование слишком высокой для вашего уровня тумбы
      - Приземление не одновременно обеими ногами
      - Спрыгивание с тумбы вместо схода шагом
      - Потеря равновесия во время бокового прыжка
      - Спешка в повторениях без должной подготовки между прыжками

      ### 6. Безопасность и модификации
      - Начните с низкой устойчивой тумбы (12–18 дюймов), чтобы отработать технику
      - Убедитесь, что тумба устойчива и не скользит и не опрокидывается
      - Отработайте боковые прыжки на полу, прежде чем добавлять высоту тумбы
      - Продвинутый вариант: увеличьте высоту тумбы или выполняйте непрерывные боковые прыжки без пауз
