  Glute Kickback (Machine):
    name: Отведения ноги назад (тренажёр)
    instructions: |
      ## Обзор
      Отведения ноги назад в тренажёре — это изолирующее упражнение, которое в первую очередь нагружает ягодичные мышцы. Оно также задействует бицепс бедра: направляемая траектория обеспечивает стабильность и равномерное сопротивление на протяжении всего разгибания бедра.

      ## Техника выполнения
      ### 1. Исходное положение
      - Расположитесь в тренажёре для отведений ноги назад согласно его конструкции
      - Поставьте одну стопу на платформу, колено согнуто
      - Возьмитесь за рукояти для устойчивости
      - Держите корпус неподвижным, мышцы кора напряжёнными
      - Совместите рабочий тазобедренный сустав с осью вращения тренажёра

      ### 2. Движение
      1. Отталкивайте платформу назад, разгибая бедро
      2. Держите колено слегка согнутым на протяжении всего движения
      3. Продолжайте, пока нога не будет полностью выпрямлена позади вас
      4. Сильно сожмите ягодичную мышцу в точке полного разгибания
      5. Медленно и подконтрольно верните платформу в исходное положение
      6. Выполните все повторения на одну сторону, затем повторите на другую

      ### 3. Дыхание
      - Выдох при отведении ноги назад
      - Вдох при возвращении в исходное положение

      ### 4. Советы
      - Сосредоточьтесь на том, чтобы движение выполняла ягодичная мышца
      - Держите корпус неподвижным и не прогибайте спину
      - Сильно сжимайте ягодичную мышцу в точке полного разгибания
      - Контролируйте и фазу отведения, и фазу возврата
      - Сохраняйте постоянное натяжение, не давая плиткам весового стека опускаться до конца

      ### 5. Частые ошибки
      - Чрезмерный прогиб в пояснице во время отведения
      - Работа за счёт инерции вместо контролируемого сокращения ягодичной мышцы
      - Неполное разгибание бедра
