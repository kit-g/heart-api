  Push Up - Close Grip:
    name: Отжимания узким хватом
    instructions: |
      ## Обзор
      Отжимания узким хватом — жимовое упражнение с собственным весом, которое в первую очередь нагружает трицепсы. Узкая постановка рук смещает нагрузку с груди на руки, при этом грудные мышцы, плечи и мышцы кора помогают на протяжении всего движения.

      ## Техника выполнения
      ### 1. Исходное положение
      - Примите упор лёжа, ладони строго под грудью
      - Поставьте руки уже ширины плеч, большие пальцы почти соприкасаются
      - Держите тело в одну линию от головы до пяток
      - Напрягите мышцы кора и ягодичные мышцы

      ### 2. Движение
      1. Согните локти и опустите грудь к ладоням
      2. Во время опускания держите локти прижатыми к корпусу
      3. Опускайтесь, пока грудь почти не коснётся пола
      4. Выпрямляя руки, отожмитесь в исходное положение
      5. Выполните нужное количество контролируемых повторений

      ### 3. Дыхание
      - Вдыхайте, опускаясь вниз
      - Выдыхайте, отжимаясь вверх

      ### 4. Советы
      - Направляйте локти назад, не разводите их в стороны
      - Сохраняйте жёсткую планку от головы до пяток
      - Двигайтесь медленно и подконтрольно в обе стороны

      ### 5. Частые ошибки
      - Провисание таза или подъём его вверх «домиком»
      - Широкое разведение локтей, снимающее нагрузку с трицепсов
      - Укороченная амплитуда движения

      ### 6. Безопасность и модификации
      - Выполняйте с колен, чтобы снизить нагрузку
      - Поставьте руки на скамью, чтобы облегчить упражнение
      - Для прогрессии замедляйте фазу опускания или поднимайте ноги на возвышение
