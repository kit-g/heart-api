  Sit Up:
    name: Подъёмы корпуса
    instructions: |
      ## Обзор
      Подъёмы корпуса — классическое упражнение на кор с собственным весом, которое в первую очередь нагружает прямую мышцу живота и сгибатели бедра. Косые мышцы живота и поперечная мышца живота также работают на всей амплитуде, что делает упражнение более динамичным, чем скручивания, но требует большего участия сгибателей бедра.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на спину на коврик, согните колени и поставьте стопы на пол
      - При необходимости зафиксируйте стопы под устойчивым предметом или попросите партнёра подержать их
      - Положите руки за голову, скрестите их на груди или вытяните к коленям
      - Если руки за головой, держите локти разведёнными в стороны
      - Напрягите мышцы кора и прижмите поясницу к коврику

      ### 2. Движение
      1. Поднимите весь корпус с коврика за счёт сокращения мышц пресса
      2. Продолжайте скручиваться вверх, пока корпус не станет почти вертикальным или грудь не приблизится к коленям
      3. Держите мышцы кора напряжёнными и выдыхайте на подъёме
      4. Сделайте короткую паузу в верхней точке движения
      5. Медленно и подконтрольно опустите корпус обратно
      6. Коснитесь лопатками коврика, прежде чем начинать следующее повторение

      ### 3. Дыхание
      - Выдыхайте, поднимаясь и скручивая корпус вперёд
      - Вдыхайте, опускаясь в исходное положение

      ### 4. Советы
      - Поднимайтесь за счёт мышц кора, а не тяните себя за шею
      - Держите стопы на полу на протяжении всего движения
      - Двигайтесь подконтрольно, без инерции
      - Не дёргайте себя за голову и шею, если руки за головой
      - Не допускайте чрезмерного прогиба в пояснице

      ### 5. Частые ошибки
      - Тяга за шею или голову, которая может привести к перенапряжению
      - Подъём рывком за счёт инерции вместо контролируемого сокращения мышц
      - Отрыв стоп от пола
      - Чрезмерный прогиб поясницы во время движения
      - Слишком быстрый темп в ущерб технике
      - Неполное опускание корпуса между повторениями

      ### 6. Безопасность и модификации
      - Новички могут выполнять скручивания, пока не наберут достаточно силы
      - Более лёгкий вариант: положите руки на бёдра и скользите ими к коленям
      - Продвинутый вариант: держите блин на груди для дополнительного сопротивления
      - При дискомфорте в пояснице перейдите на скручивания или уменьшите амплитуду
    validated: false
    source_digest: 6f2d6eb00f7c
  Superman:
    name: «Супермен»
    instructions: |
      ## Обзор
      «Супермен» — упражнение на кор с собственным весом, которое в первую очередь нагружает поясницу (разгибатели спины) и ягодичные мышцы. В работу также включаются верх спины, плечи и бицепс бедра, что делает упражнение эффективным для укрепления задней цепи и улучшения разгибания позвоночника.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на живот на коврик, вытянув прямые руки над головой
      - Держите ноги прямыми и вместе, полностью вытянутыми назад
      - Положите лоб на коврик, шея в нейтральном положении
      - Напрягите мышцы кора и ягодицы перед началом движения
      - Держите носки вытянутыми на протяжении всего упражнения

      ### 2. Движение
      1. Одновременно поднимите руки, грудь и ноги с коврика
      2. Поднимайте их настолько высоко, насколько комфортно, сжимая поясницу и ягодицы
      3. Держите руки и ноги прямыми на протяжении всего движения
      4. Сделайте короткую паузу в верхней точке, напрягая мышцы задней цепи
      5. Медленно и подконтрольно опустите руки, грудь и ноги обратно на коврик
      6. Повторите нужное количество контролируемых повторений

      ### 3. Дыхание
      - Выдыхайте, поднимая руки, грудь и ноги с коврика
      - Вдыхайте, опускаясь в исходное положение

      ### 4. Советы
      - Сосредоточьтесь на сжатии поясницы и ягодиц в верхней точке
      - Держите шею нейтральной, глядя вниз на коврик
      - Поднимайтесь подконтрольно, без инерции
      - Держите руки и ноги прямыми на протяжении всего упражнения
      - Представляйте, что вытягиваете тело от кончиков пальцев рук до носков

      ### 5. Частые ошибки
      - Слишком высокий подъём головы и шеи, который может вызвать перенапряжение
      - Сгибание рук или ног во время движения
      - Использование инерции вместо контролируемого сокращения мышц
      - Отсутствие напряжения в ягодицах и работа только поясницей
      - Слишком быстрый темп в ущерб технике
      - Задержка дыхания во время упражнения

      ### 6. Безопасность и модификации
      - Новички могут поднимать только руки или только ноги, пока не наберут силу
      - Уменьшите амплитуду при дискомфорте в пояснице
      - Продвинутый вариант: удерживайте верхнюю позицию 3–5 секунд для повышения нагрузки
      - Прогрессируйте до попеременного «супермена» (противоположные рука и нога) для разнообразия
