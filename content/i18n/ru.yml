  Plank:
    name: Планка
    instructions: |
      ## Обзор
      Планка — изометрическое упражнение на кор, которое в первую очередь нагружает поперечную и прямую мышцы живота. На протяжении удержания также работают плечи, ягодичные мышцы и стабилизаторы поясницы, что делает планку одним из самых эффективных упражнений для общей стабильности и выносливости кора.

      ## Техника выполнения
      ### 1. Исходное положение
      - Лягте на коврик лицом вниз, предплечья на полу
      - Расположите локти строго под плечами, предплечья параллельно друг другу
      - Вытяните ноги назад, упритесь пальцами ног в пол
      - Оторвите тело от пола, выстроив прямую линию от головы до пят
      - Напрягите мышцы кора, сожмите ягодицы и держите шею нейтрально

      ### 2. Движение
      1. Удерживайте это статичное положение, сохраняя правильное выравнивание
      2. Держите тело прямой линией, без провисания и подъёма таза
      3. Дышите ровно и сохраняйте напряжение кора
      4. Следите, чтобы таз оставался на одном уровне и был стабилен
      5. Держите планку заданное время — обычно 20–60 секунд и дольше
      6. Закончив, подконтрольно опуститесь на пол

      ### 3. Дыхание
      - Дышите ровно и естественно на протяжении всего удержания
      - Не задерживайте дыхание; дышите спокойно и равномерно

      ### 4. Советы
      - Держите тело прямой линией от головы до пят
      - Напрягайте ягодицы, чтобы не провисала поясница
      - Втягивайте живот к позвоночнику, чтобы включить глубокие мышцы кора
      - Держите шею нейтрально, глядя в точку на полу
      - Распределяйте вес равномерно между предплечьями и носками

      ### 5. Частые ошибки
      - Провисание таза, перегружающее поясницу
      - Слишком высокий подъём таза, снижающий нагрузку на кор
      - Задержка дыхания вместо естественного дыхания
      - Подъём плеч к ушам
      - Опускание головы вниз или взгляд вперёд вместо нейтрального положения шеи
      - Удержание позиции с плохой техникой вместо сокращения времени

      ### 6. Безопасность и модификации
      - Новички могут начинать с опоры на колени вместо носков
      - Сократите время удержания и добейтесь идеальной техники, прежде чем его увеличивать
      - Продвинутый вариант: поднимите одну ногу или одну руку, чтобы усложнить упражнение
      - При дискомфорте в пояснице проверьте технику и сократите время удержания
