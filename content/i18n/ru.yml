  Lat Pulldown (Single Arm):
    name: Тяга верхнего блока одной рукой
    instructions: |
      ## Обзор
      Тяга верхнего блока одной рукой — одностороннее тяговое упражнение, которое в первую очередь нагружает широчайшие мышцы спины. В работу также включаются ромбовидные мышцы, средняя часть трапеций и мышцы-стабилизаторы кора; независимое движение руки помогает устранять дисбаланс силы и улучшает общее развитие спины.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте в тренажёр для тяги верхнего блока, зафиксировав бёдра под упорами
      - Прикрепите одиночную рукоять к верхнему блоку
      - Возьмитесь за рукоять одной рукой прямым или нейтральным хватом
      - Полностью вытяните руку вверх, сохраняя натяжение
      - Держите корпус вертикально, мышцы кора — в напряжении

      ### 2. Движение
      1. Потяните рукоять вниз к плечу, уводя локоть вниз и назад
      2. Держите корпус стабильно, избегайте чрезмерных поворотов
      3. Продолжайте, пока рукоять не окажется у плеча или верхней части груди
      4. В нижней точке опустите лопатку вниз и назад
      5. Медленно и подконтрольно верните рукоять в исходное положение
      6. Выполните все повторения одной рукой, затем повторите другой

      ### 3. Дыхание
      - Выдыхайте, когда тянете рукоять вниз
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Держите корпус стабильно, сводя вращение к минимуму
      - Ведите движение локтем, уводя его вниз и назад
      - Сосредоточьтесь на приведении лопатки к позвоночнику
      - Сохраняйте постоянное натяжение на протяжении всего движения
      - Контролируйте вес в обоих направлениях

      ### 5. Частые ошибки
      - Чрезмерный поворот корпуса вместо его стабилизации
      - Использование инерции, чтобы тянуть вес вниз
      - Неполная амплитуда движения
      - Подъём плеча к уху
      - Опускание грузоблока до упора между повторениями
      - Разное количество повторений на каждую сторону

      ### 6. Безопасность и модификации
      - Начинайте с меньшего веса, чем в двусторонней тяге
      - Свободной рукой держитесь за тренажёр для дополнительной стабильности
      - Усложнённый вариант: задержитесь на 2-3 секунды в нижней точке каждого повторения
      - Выполняйте одинаковое количество повторений и уделяйте внимание обеим сторонам для сбалансированного развития
