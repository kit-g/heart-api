      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте лицом к верхнему блоку с прямой рукоятью
      - Возьмитесь за рукоять прямым хватом, руки на ширине плеч
      - Прижмите локти к бокам, предплечья параллельны полу
      - Поставьте ноги на ширине таза, слегка выставив одну вперёд
      - Напрягите мышцы кора и держите корпус прямо

      ### 2. Движение
      1. Выжмите рукоять вниз, полностью разгибая локти
      2. Держите плечевую часть рук неподвижной и прижатой к бокам
      3. Продолжайте жать, пока руки полностью не выпрямятся у бёдер
      4. Сделайте паузу и дополнительно напрягите трицепсы в точке полного выпрямления
      5. Медленно и подконтрольно позвольте рукояти подняться в исходное положение
      6. Не давайте плиткам грузового стека коснуться друг друга, чтобы сохранить постоянное натяжение, затем повторите

      ### 3. Дыхание
      - Выдыхайте, выжимая рукоять вниз
      - Вдыхайте, возвращая рукоять в исходное положение

      ### 4. Советы
      - Держите локти полностью неподвижными и прижатыми к бокам
      - Изолируйте трицепс, двигаясь только в локтевом суставе
      - Сохраняйте постоянное натяжение, не позволяя грузу ложиться на стек
      - Не наклоняйтесь вперёд и не помогайте себе корпусом
      - Сильно напрягайте трицепсы в нижней точке каждого повторения

      ### 5. Частые ошибки
      - Локти уходят вперёд или расходятся в стороны
      - Наклон вперёд и дожимание рукояти весом тела
      - Неполное разгибание локтей в нижней точке
      - Груз ложится на стек между повторениями
      - Использование инерции вместо контролируемого движения
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить строгую фиксацию локтей
      - Пробуйте разные рукояти (канат, V-образная рукоять, одиночная рукоять) для разнообразия
      - Продвинутый вариант: выполняйте одной рукой для односторонней проработки
      - Добавьте паузу 2–3 секунды в точке полного выпрямления для повышения интенсивности
