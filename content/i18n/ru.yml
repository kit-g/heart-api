  Seated Palms Up Wrist Curl (Dumbbell):
    name: Сгибания запястий сидя ладонями вверх (гантели)
    instructions: |
      ## Обзор
      Сгибания запястий сидя ладонями вверх — изолирующее упражнение, которое в первую очередь нагружает сгибатели предплечья. В работу также включаются сгибатели запястья и мышцы хвата; положение сидя с опорой предплечий изолирует движение в запястьях для развития предплечий.

      ## Техника выполнения
      ### 1. Исходное положение
      - Сядьте на скамью, стопы всей поверхностью на полу
      - Возьмите по гантели в каждую руку обратным хватом (ладони вверх)
      - Положите предплечья на бёдра так, чтобы запястья выступали чуть за колени
      - Позвольте гантелям скатиться к кончикам пальцев
      - Держите предплечья прижатыми и неподвижными на протяжении всего упражнения

      ### 2. Движение
      1. Поднимите кисти вверх, сокращая сгибатели предплечья
      2. Поднимите гантели настолько высоко, насколько комфортно
      3. Держите предплечья плотно прижатыми к бёдрам
      4. Сделайте паузу и дополнительно напрягите мышцы в верхней точке
      5. Медленно и подконтрольно опустите гантели вниз
      6. Дайте весу скатиться к кончикам пальцев для полного растяжения и повторите

      ### 3. Дыхание
      - Выдыхайте, поднимая кисти вверх
      - Вдыхайте, опуская гантели вниз

      ### 4. Советы
      - Держите предплечья полностью неподвижными на бёдрах
      - Сосредоточьтесь на чистом движении в запястьях, не поднимая предплечья
      - Допускайте полное растяжение внизу, давая весу скатываться к кончикам пальцев
      - Контролируйте и подъём, и опускание
      - Используйте умеренный вес для строгой техники

      ### 5. Частые ошибки
      - Отрыв предплечий от бёдер во время сгибания
      - Работа за счёт инерции вместо контролируемого мышечного сокращения
      - Неполная амплитуда в нижней точке
      - Слишком сильный хват, ограничивающий амплитуду движения
      - Слишком большой вес в ущерб технике
      - Слишком быстрый темп выполнения повторений

      ### 6. Безопасность и модификации
      - Начинайте с лёгких гантелей, чтобы освоить изолированное движение в запястьях
      - При необходимости выполняйте по одной руке за раз для лучшей концентрации
      - Усложнённый вариант: задержитесь на 2–3 секунды в точке пикового сокращения
      - При дискомфорте уменьшите вес и проверьте, что предплечья хорошо опираются
