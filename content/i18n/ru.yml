  Halo:
    name: «Гало»
    instructions: |
      ## Обзор
      «Гало» — динамическое упражнение на подвижность плеч, которое в первую очередь нагружает дельты и мышцы вращательной манжеты плеча. Оно также задействует мышцы кора и верх спины: круговое движение снаряда вокруг головы улучшает подвижность, стабильность и координацию плечевого пояса.

      ## Техника выполнения
      ### 1. Исходное положение
      - Встаньте, поставив ноги на ширине плеч, или опуститесь на колени для большей устойчивости
      - Держите гантель или гирю за «рога» на уровне груди
      - Держите грудь расправленной, мышцы кора напряжёнными, взгляд направьте вперёд
      - Сохраняйте правильную осанку на протяжении всего упражнения

      ### 2. Движение
      1. Обведите снаряд вокруг головы контролируемым движением
      2. Держите снаряд близко к голове на всей траектории
      3. Сохраняйте вертикальное положение корпуса и стабильный низ тела
      4. Завершите полный круг и вернитесь в исходное положение
      5. Выполните нужное количество повторений в одну сторону
      6. Смените направление и выполните столько же повторений в другую

      ### 3. Дыхание
      - Дышите ровно и ритмично на протяжении всего движения
      - Не задерживайте дыхание

      ### 4. Советы
      - Держите снаряд близко к голове на протяжении всего круга
      - Сосредоточьтесь на плавном, контролируемом движении
      - Держите мышцы кора напряжёнными, чтобы корпус не вращался
      - Начинайте с лёгкого веса, чтобы освоить схему движения
      - Это отличное упражнение для разминки плеч и развития их подвижности

      ### 5. Частые ошибки
      - Слишком большой вес и потеря контроля
      - Вращение корпуса вслед за снарядом
      - Слишком быстрое выполнение кругов
      - Снаряд проходит далеко от головы
      - Прогиб в пояснице во время движения
      - Задержка дыхания

      ### 6. Безопасность и модификации
      - Начинайте с очень лёгкой гантели или гири
      - Если сложно держать равновесие, выполняйте упражнение на коленях
      - Используйте это упражнение как разминку перед тренировкой плеч
      - При дискомфорте в плечах уменьшите амплитуду движения
