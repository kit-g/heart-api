      - Отрегулируйте высоту сиденья так, чтобы подмышка удобно опиралась на верхний край подушки
      - Возьмите гантель в одну руку обратным хватом
      - Полностью вытяните рабочую руку над подушкой, сохраняя лёгкий сгиб в локте
      - Держите плечо плотно прижатым к подушке на протяжении всего упражнения

      ### 2. Движение
      1. Поднимите гантель вверх, сокращая бицепс
      2. Держите плечо плотно прижатым к подушке от начала до конца
      3. Продолжайте подъём, пока предплечье не станет почти вертикальным
      4. Сделайте паузу и напрягите бицепс в верхней точке
      5. Медленно и подконтрольно опустите гантель в исходное положение
      6. Выполните все повторения одной рукой, затем повторите другой

      ### 3. Дыхание
      - Выдыхайте, поднимая гантель вверх
      - Вдыхайте, опуская гантель вниз

      ### 4. Советы
      - Держите плечо полностью неподвижным на подушке
      - Если комфортно, допускайте естественное вращение запястья во время сгибания
      - Сосредоточьтесь на растяжении внизу и пиковом сокращении вверху
      - Не отрывайте локоть и грудь от подушки
      - Контролируйте вес по всей амплитуде движения

      ### 5. Частые ошибки
      - Отрыв локтя или плеча от подушки
      - Подъём веса за счёт инерции или раскачивания
      - Неполное выпрямление руки в нижней точке
      - Поворот корпуса в помощь движению
      - Слишком быстрое опускание веса
      - Слишком большой вес в ущерб технике

      ### 6. Безопасность и модификации
      - Начинайте с умеренного веса, чтобы работать строго каждой рукой
      - При желании выполняйте обеими руками одновременно для сбалансированного развития
      - Усложнённый вариант: задержитесь на 2–3 секунды в точке пикового сокращения
      - Полностью выпрямляйте руку в нижней точке, но не допускайте переразгибания
