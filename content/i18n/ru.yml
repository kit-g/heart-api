      - Сядьте в тренажёр для скручиваний, прижав спину к спинке
      - Заведите стопы под валики или поставьте их на подставку
      - Возьмитесь за рукояти над головой или на уровне груди — в зависимости от конструкции тренажёра
      - Установите сложный, но посильный вес
      - Напрягите мышцы кора и сохраняйте нейтральное положение позвоночника

      ### 2. Движение
      1. На выдохе скрутитесь вперёд, сокращая мышцы пресса
      2. Сосредоточьтесь на скручивании корпуса и приближении грудной клетки к тазу
      3. Двигайтесь подконтрольно и не используйте инерцию
      4. Сильно сожмите пресс в нижней точке на 1–2 секунды
      5. Медленно вернитесь в исходное положение, сохраняя напряжение в коре
      6. Останавливайтесь чуть раньше, чем плитки коснутся стека, чтобы пресс оставался под постоянной нагрузкой

      ### 3. Дыхание
      - Мощно выдыхайте, скручиваясь вперёд и сокращая пресс
      - Вдыхайте, возвращаясь в исходное положение

      ### 4. Советы
      - Двигайте вес за счёт кора, а не рук или плеч
      - Держите шею в нейтральном положении на протяжении всего движения
      - Сохраняйте контролируемый темп для максимального включения мышц
      - Не давайте весовому стеку отдыхать между повторениями
      - Прижимайте поясницу к спинке

      ### 5. Частые ошибки
      - Тяга веса руками или плечами вместо работы мышцами кора
      - Слишком быстрый темп и работа за счёт инерции
      - Слишком большой вес, из-за которого страдает техника
      - Полное опускание весового стека между повторениями
      - Разгибание или прогиб позвоночника при возврате
      - Задержка дыхания во время упражнения

      ### 6. Безопасность и модификации
      - Начинайте с лёгкого веса, чтобы освоить технику и связь «мозг–мышца»
      - Продвинутый вариант: пауза 3–5 секунд в пиковом сокращении
      - При дискомфорте в пояснице уменьшите вес и сосредоточьтесь на работе кора
      - Прогрессируйте постепенно, добавляя вес небольшими шагами
