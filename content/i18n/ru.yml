  Split Jerk (Barbell):
    name: Толчок в ножницы (штанга)
    instructions: |
      ## Обзор
      Толчок в ножницы — движение тяжёлой атлетики, нацеленное на плечи, трицепсы и ноги. Штанга посылается с плеч в положение над головой с одновременной разножкой ног вперёд и назад, что даёт большую устойчивость и позволяет поднимать большие веса, чем в толчке в стойку.

      ## Техника выполнения
      ### 1. Исходное положение
      - Начните со штангой, лежащей на передней части плеч
      - Встаньте, ноги на ширине таза
      - Держите локти слегка выведенными вперёд и вверх
      - Напрягите мышцы кора и сохраняйте вертикальное положение корпуса
      - Приготовьтесь к контролируемому подседу

      ### 2. Движение
      1. Выполните подсед, слегка согнув колени и сохраняя корпус вертикальным
      2. Мощно вытолкните штангу вверх, разгибая ноги
      3. Разбросьте ноги вперёд и назад, выжимая штангу над головой
      4. Приземлитесь с согнутым передним коленом и выпрямленной задней ногой
      5. Полностью выпрямите руки, стабилизировав штангу над головой
      6. Вернитесь в стойку: сначала подставьте переднюю ногу, затем заднюю

      ### 3. Дыхание
      - Сделайте вдох перед подседом
      - Задержите дыхание во время подседа, выталкивания и разножки
      - Выдохните, когда штанга зафиксирована над головой

      ### 4. Советы
      - Ножницы дают большую устойчивость, чем другие варианты толчка
      - Подсед должен быть строго вертикальным, без наклона вперёд
      - Мощно работайте ногами до включения рук
      - Голень передней ноги в позиции приёма должна быть вертикальной
      - Это самый распространённый вариант толчка на соревнованиях

      ### 5. Частые ошибки
      - Подсед с наклоном вперёд вместо вертикального
      - Недостаточно широкая разножка
      - Жим руками до выталкивания ногами
      - Приземление с коленом передней ноги дальше носка
      - Неправильная траектория грифа во время выталкивания
      - Неполное выпрямление рук над головой

      ### 6. Безопасность и модификации
      - Требуется обучение у квалифицированного тренера по тяжёлой атлетике
      - Сначала отработайте разножку без веса
      - Освойте толчок в стойку, прежде чем учить толчок в ножницы
      - Используйте плинты для отработки позиции приёма
