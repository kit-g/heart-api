name: heart_pages
description: "heart-of.me's rendered pages: the blog, built to static HTML with Jaspr"
publish_to: none

environment:
  sdk: ">=3.13.0"

dependencies:
  jaspr: ^0.23.5
  jaspr_content: ^0.5.4
  syntax_highlight_lite: ^0.0.1
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  jaspr_cli: ^0.23.5
  lints: ^6.1.0

jaspr:
  mode: static
