name: heart_pages
description: "heart-of.me's rendered pages: the blog, built to static HTML with Jaspr"
publish_to: none

# Below 3.14 until Jaspr moves: jaspr_cli and jaspr_builder 0.23.5 need analyzer 12,
# which build_web_compilers pairs only with SDKs below 3.14, and jaspr_cli doesn't build
# against analyzer 13. CI pins setup-dart to 3.13.7 for this; unpin both together.
environment:
  sdk: ">=3.13.0 <3.14.0"

dependencies:
  jaspr: ^0.23.5
  jaspr_content: ^0.5.4
  syntax_highlight_lite: ^0.0.1
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  jaspr_cli: ^0.23.5
  lints: ^6.1.0

jaspr:
  mode: static
