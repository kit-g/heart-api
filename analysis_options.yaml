# Shared analyzer/lint config for every Dart package in the repo. Packages
# include this file by relative path, alongside their package: base set:
#
#   include: [package:lints/recommended.yaml, ../analysis_options.yaml]
#
# Later entries win on conflicts, and a package's own file beats both — but if
# a rule is meant to hold everywhere, change it here.
#
# No package: URIs in THIS file, deliberately: the repo root has no pubspec, so
# the IDE (which analyzes the root as its own context) could not resolve them
# and flagged include_file_not_found. Relative includes keep this file inert.

formatter:
  trailing_commas: preserve
  page_width: 120

linter:
  rules:
    require_trailing_commas: true
    prefer_const_constructors: true
    prefer_final_in_for_each: true
    unnecessary_underscores: false
    avoid_positional_boolean_parameters: true
    avoid_dynamic_calls: true
    prefer_single_quotes: true
    avoid_print: true
    use_null_aware_elements: true
